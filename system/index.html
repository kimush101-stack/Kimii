  --sun: #FFC933; --sun-ink: #1A1510; --orange: #FF8A3D; --orange-soft: #43280F; --ok: #5CD08C; --ok-soft: #173524; --lock: #6E5F4A;
  --shadow: 0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);

* { box-sizing: border-box; }

/* ---------- header ---------- */

.brandrow { display: flex; align-items: center; gap: 12px; padding-block: 12px 6px; }

.station { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--muted); position: relative; padding: 0; }

main { padding-block: 20px 64px; }
section.view { display: grid; gap: 16px; }

/* ---------- step card ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px; display: grid; gap: 14px; min-width: 0; }

.step-title { font-size: clamp(24px, 6vw, 32px); }

.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--sunk); border-radius: 999px; padding: 4px 12px; font-size: 14px; }
.chip.ok { background: var(--ok-soft); color: var(--ok); font-weight: 700; }
.chip.lock { background: transparent; border: 1px dashed var(--lock); color: var(--muted); }
.why { font-size: 17px; }
.label { font-family: var(--display); font-weight: 600; font-size: 17px; }

ol.actions input { appearance: none; width: 24px; height: 24px; margin: 1px 0 0; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; }

ol.actions input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--lock); }
.donewhen { background: var(--ok-soft); border-radius: 14px; padding: 12px 14px; }

.tip { background: var(--orange-soft); border-radius: 14px; padding: 12px 14px; }
.res { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 2px solid var(--fg); background: var(--surface); border-radius: 999px; padding: 8px 16px; font-weight: 600; }

.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.stage { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
