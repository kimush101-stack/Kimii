[30/45] דקות, מותאם בדיוק לגיל הילדים שלך. הילדים זזים, צוחקים ומשתפים פעולה, ובסוף מקבלים סיום רגוע, כך שאת חוזרת לשגרת הגן עם קבוצה שקטה. אחרי המופע נשאר אצלך <strong>דף ״משחקים עם קים״<\/strong> עם 3 משחקים שאפשר להמשיך כל השבוע, וקריאה שעוצרת את כל הגן בשנייה: ׳עם קים...׳ ׳כולם משחקים!׳״<\/p>\n<\/blockquote>\n<p><strong>לרכז/ת קייטנה או מתנ״ס:<\/strong><\/p>\n<blockquote>\n<p>״יום משחקים עם קים הוא מופע תנועה אינטראקטיבי של 30–45 דקות לקבוצות של עד [25/60] ילדים, פנים או חוץ בצל. אפשר להזמין מופע בודד, שני מופעים ברצף לשתי קבוצות גיל, או סדרה של 3 מפגשים. אני עובדת לפי צ׳קליסט בטיחות קבוע, מגיעה 30 דקות לפני, ומתאמת מראש עם הצוות את כל מה שצריך.״<\/p>\n<\/blockquote>\n<p><strong>להורים (יום הולדת):<\/strong><\/p>\n<blockquote>\n<p>״יום הולדת עם קים: 45 דקות שבהן כל הילדים משחקים, ו[שם הילד/ה] הוא/היא הקפטן/ית של קים. אני מגיעה עם הכל, מתאימה את המשחקים לגיל ולאופי של הילד/ה, ומשאירה לכם קבוצה רגועה לפני העוגה.״<\/p>\n<\/blockquote>\n<p><strong>למפיק/ת אירועים או רכז/ת קהילה (אירוע משפחות):<\/strong><\/p>\n<blockquote>\n<p>״׳כולם משחקים׳ הוא מופע תנועה משפחתי שבו ההורים והילדים משחקים יחד: קריאות קהל, קוביית אתגרים וריקוד משותף. 45–50 דקות, עם הגברה, לקהל של עד [___] ילדים והוריהם.״<\/p>\n<\/blockquote>\n<h3>3. נוסחי וואטסאפ קצרים להצעה (אחרי שאמרו ״תשלחי פרטים״)<\/h3>\n<p><strong>גן:<\/strong><\/p>\n<blockquote>\n<p>היי [שם], תודה! הנה הפרטים בקצרה 👇<\/p>\n<p>🟡 <strong>קים בגן:<\/strong> מופע תנועה ומשחק של [30/45] דק׳, מותאם לגיל [___]<\/p>\n<p>✅ כל הציוד עליי, מגיעה חצי שעה לפני<\/p>\n<p>✅ אחרי המופע נשאר לך דף עם 3 משחקים להמשך השבוע<\/p>\n<p>💰 [<strong><em>] ₪ · מופע שני ברצף בגן שכן: [<\/em><\/strong>] ₪<\/p>\n<p>🎬 ככה זה נראה: [קישור לסרטון]<\/p>\n<p>מתאים לך שנדבר 5 דקות על תאריך?<\/p>\n<\/blockquote>\n<p><strong>קייטנה / מתנ״ס:<\/strong><\/p>\n<blockquote>\n<p>היי [שם], הנה הפרטים 👇<\/p>\n<p>☀️ <strong>יום משחקים עם קים:<\/strong> מופע תנועה אינטראקטיבי, 30–45 דק׳, עד [___] ילדים בקבוצה<\/p>\n<p>✅ פנים או חוץ בצל מלא, צ׳קליסט בטיחות קבוע<\/p>\n<p>✅ מופע בודד / שני מופעים ברצף / סדרה של 3<\/p>\n<p>💰 מופע: [<strong><em>] ₪ · ברצף: [<\/em><\/strong>] ₪ · סדרה: [___] ₪<\/p>\n<p>🎬 [קישור לסרטון]<\/p>\n<p>איזה תאריכים אתם בודקים?<\/p>\n<\/blockquote>\n<p><strong>יום הולדת:<\/strong><\/p>\n<blockquote>\n<p>היי [שם], איזה כיף! הנה הפרטים 👇<\/p>\n<p>🎂 <strong>יום הולדת עם קים:<\/strong> 45 דק׳ של משחק לכל הילדים, ו[שם הילד/ה] הקפטן/ית של קים<\/p>\n<p>✅ אני מגיעה עם הכל: מוזיקה, ציוד ומדבקה לכל ילד/ה<\/p>\n<p>✅ עד [___] ילדים, בבית, בגינה או באולם<\/p>\n<p>💰 [<strong><em>] ₪, כולל נסיעה באזור [<\/em><\/strong>]<\/p>\n<p>🎬 [קישור לסרטון]<\/p>\n<p>מה התאריך והשעה? אבדוק לך זמינות 🙂<\/p>\n<\/blockquote>\n<p><strong>אירוע משפחות:<\/strong><\/p>\n<blockquote>\n<p>היי [שם], תודה על הפנייה! 👇<\/p>\n<p>👨‍👩‍👧 <strong>כולם משחקים:<\/strong> מופע תנועה שבו הילדים <strong>וההורים<\/strong> משחקים יחד, 45–50 דק׳<\/p>\n<p>✅ קריאות קהל, קוביית אתגרים וריקוד משותף<\/p>\n<p>✅ צריך הגברה (שלי או של המקום) ושטח במה מסומן<\/p>\n<p>💰 [___] ₪<\/p>\n<p>🎬 [קישור לסרטון]<\/p>\n<p>כמה ילדים ומבוגרים אתם מצפים?<\/p>\n<\/blockquote>\n<hr />\n<h2>נספח — דף ״משחקים עם קים״ (להשאיר בגן ולשלוח להורים)<\/h2>\n<blockquote>\n<p><strong>איך משתמשים:<\/strong> מעצבים בעמוד אחד (אפשר ב־Canva), בצבעי המותג, ומדפיסים 2–3 עותקים לכל גן. להורים ביום הולדת שולחים כתמונה או PDF בוואטסאפ. <strong>בלי תמונות של ילדים.<\/strong><\/p>\n<p>המשחקים לקוחים מ<a href=\"02-show-script.md\">תסריט המופע<\/a>, ולכן הילדים כבר מכירים אותם.<\/p>\n<h1>משחקים עם קים 🟡<\/h1>\n<p><strong>הקריאה הסודית:<\/strong> אתם אומרים ״עם קים...״, הילדים עונים ״כולם משחקים!״ וקופאים עם ידיים למעלה. עובד גם כשצריך שקט 😉<\/p>\n<p><strong>1. קים אומרת<\/strong><\/p>\n<p>״אם אני אומרת ׳קים אומרת: קופצים!׳, קופצים. אם אני אומרת רק ׳קופצים!׳, לא זזים!״<\/p>\n<p>מי שטעה אומר ״אופס!״ עם ידיים על הלחיים, כולם עונים ״לא נורא!״, <strong>וממשיכים לשחק. אף אחד לא יוצא.<\/strong><\/p>\n<p>לקטנים: ״עשו כמוני״, פשוט מחקים, בלי מלכודות.<\/p>\n<p><strong>2. הפסל של קים<\/strong><\/p>\n<p>כשיש מוזיקה, רוקדים לאט־לאט. כשהמוזיקה נעצרת, קופאים כמו פסל. מי שמצחיק את הפסלים: <strong>רק פרצופים, בלי לגעת.<\/strong><\/p>\n<p>סבבים: פסלים של חיות, של גיבורי־על, ״פסלים שנפלה להם הגלידה״.<\/p>\n<p><strong>3. קוביית קים (מכינים בבית)<\/strong><\/p>\n<p>קופסת קרטון מרובעת עטופה בנייר, ועל כל צד ציור:<\/p>\n<p>סחרור (<strong>סיבוב אחד, לאט<\/strong>) · כפיים (10 כפיים) · נעליים (ריצה <strong>במקום<\/strong>, 5 שניות) · כוכבים (ריקוד משוגע ואז ״פסל!״) · פרצוף צוחק (צוחקים ואז ״ששש...״) · גלידה (נמסים לאט עד הרצפה).<\/p>\n<p>זורקים <strong>מלמטה<\/strong>, ומה שיוצא, כולם עושים.<\/p>\n<p><strong>כללי בטיחות קטנים:<\/strong> כל אחד בבועה שלו (ידיים לצדדים, לא נוגעים באף אחד), קופצים ורצים רק במקום, ומבוגר תמיד בחדר.<\/p>\n<p><em>עם קים — כולם משחקים!<\/em> · [טלפון] · [@שם_משתמש]<\/p>\n<\/blockquote>\n<hr />\n<h2>צ׳קליסט: מטיוטה לגרסה 1<\/h2>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מילאתי את כל ה־<code>[___]<\/code> מגיליון התמחור ומהחלטות הפגישה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מדיניות הביטול עברה בדיקה (עו״ד או יועץ), ורשמתי מה שונה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> עיצבתי את דף ההצעה ואת דף ״משחקים עם קים״ ב־PDF, בצבעי המותג (<a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a>)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> שלחתי את דף ההצעה לגננת או להורה אחד שאני מכירה ושאלתי: ״מה לא ברור? מה חסר?״<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> אחרי 3 הופעות: עדכנתי את ההצעה לפי <a href=\"05-pilot-feedback.md\">טופס המשוב<\/a> (מה הכי עבד, מה הגננות והורים ציטטו)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> הוספתי 2–3 ציטוטים מאושרים מהורים או מצוות (רק באישור, לפי <a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>)<\/li>\n<\/ul>\n<p><strong>קבצים קשורים:<\/strong><\/p>\n<p><a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a> · <a href=\"10-outreach-templates.md\">תבניות פנייה<\/a> · <a href=\"12-booking-process.md\">תהליך ההזמנה<\/a> · <a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a> · <a href=\"02-show-script.md\">תסריט המופע<\/a> · <a href=\"08-consent-template.md\">טופס אישור הצילום<\/a> · <a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a> · <a href=\"../site/index.html\">עמוד הנחיתה<\/a><\/p>"}, "docs/07-advisor-meeting.md": {"title": "פגישת המיקוד: יועץ עסקי ומשווק", "html": "<h1>פגישת המיקוד: יועץ עסקי ומשווק<\/h1>\n<blockquote>\n<p><strong>המטרה:<\/strong> לצאת מהפגישה עם <strong>החלטות<\/strong>, לא עם רעיונות. בסוף צריכים להיות לך: גיל יעד, ערוץ לקוחות ראשון, מחירון, החלטות מנהלה, פלטפורמה ראשית, תקציב, ותוכנית 90 יום שבה לכל שורה יש אחראי/ת, תאריך וסכום.<\/p>\n<p><strong>הכלל שלך בפגישה:<\/strong> את מביאה נתונים, הם מביאים ניסיון. <strong>כל החלטה נרשמת<\/strong> ביומן ההחלטות (בסוף הקובץ), ועוברת לקובץ שבו היא מבוצעת.<\/p>\n<\/blockquote>\n<p><strong>משך:<\/strong> כשעתיים (110 דקות, כולל הפסקה קצרה). אם יש רק 90 דקות, ראי ״גרסה מקוצרת״ בסוף סדר היום.<\/p>\n<p><strong>מי:<\/strong> את, היועץ/ת העסקי/ת, המשווק/ת. אם אפשר, חבר/ה שרושם/ת, כדי שאת תהיי פנויה לחשוב.<\/p>\n<hr />\n<h2>מתי לקיים את הפגישה<\/h2>\n<p><strong>הזמן הנכון:<\/strong> בסוף תוכנית 30 הימים (<a href=\"01-concept.md\">מסמך הקונספט<\/a>, פרק 7), כשיש לך נתונים אמיתיים. בדקי:<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> לפחות <strong>2–3 הופעות פיילוט<\/strong>, עם כרטיס ציון לכל אחת (<a href=\"05-pilot-feedback.md\">טופס המשוב<\/a>)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> לפחות <strong>3 שבועות של סרטונים<\/strong>, עם גיליון מדדים (<a href=\"09-filming-guide.md\">מדריך הצילום<\/a>, פרק 15)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a> ממולא <strong>עד שלב 6<\/strong> (כולל 5 מפעילים דומים)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <a href=\"06-show-offer.md\">הצעת המופע<\/a> מעודכנת לפי הפיילוט<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>רצוי:<\/strong> 10 פניות ראשונות יצאו (<a href=\"10-outreach-templates.md\">תבניות פנייה<\/a>), כדי שיהיה מה לספר על התגובות<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> רשימת מצב של הרישוי והמנהלה: מה סגור, מה בתהליך, מה פתוח (<a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a>)<\/li>\n<\/ul>\n<p><strong>לא הכל מוכן?<\/strong> מקיימים את הפגישה בכל זאת אחרי 30 יום, ומביאים את מה שיש. פגישה עם חצי נתונים עדיפה על דחייה בלי סוף.<\/p>\n<hr />\n<h2>ההכנה: שבוע לפני<\/h2>\n<table>\n<thead>\n<tr>\n<th>מתי<\/th>\n<th>מה<\/th>\n<th>זמן<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>7 ימים לפני<\/strong><\/td>\n<td>לקבוע מועד ומקום. לשאול אותם: ״מה תרצו לראות לפני הפגישה?״<\/td>\n<td>10 דק׳<\/td>\n<\/tr>\n<tr>\n<td><strong>3 ימים לפני<\/strong><\/td>\n<td>להכין את <strong>דף המצב<\/strong> (למטה) ולמלא את טבלת ״מה מביאים״<\/td>\n<td>שעה וחצי<\/td>\n<\/tr>\n<tr>\n<td><strong>2 ימים לפני<\/strong><\/td>\n<td>לשלוח להם את החבילה (למטה)<\/td>\n<td>10 דק׳<\/td>\n<\/tr>\n<tr>\n<td><strong>יום לפני<\/strong><\/td>\n<td>להדפיס את דף המצב ואת יומן ההחלטות. לתרגל פתיחה של 3 דקות בקול<\/td>\n<td>30 דק׳<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>מה שולחים יומיים לפני<\/h3>\n<p><strong>חובה לקרוא (עד 15 דקות קריאה):<\/strong><\/p>\n<ol>\n<li>דף המצב (עמוד אחד)<\/li>\n<li><a href=\"01-concept.md\">מסמך הקונספט<\/a><\/li>\n<li><a href=\"06-show-offer.md\">הצעת המופע<\/a>, חלקים א׳–ב׳<\/li>\n<\/ol>\n<p><strong>להעיף מבט אם יש זמן:<\/strong><\/p>\n<ul>\n<li>ליועץ: <a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>, <a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a>, <a href=\"06-show-offer.md\">הצעת המופע<\/a> חלק ד׳ (תנאי ביטול)<\/li>\n<li>למשווק: <a href=\"03-video-scripts.md\">תסריטי הווידאו<\/a>, גיליון המדדים, <a href=\"10-outreach-templates.md\">תבניות פנייה<\/a>, <a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a><\/li>\n<\/ul>\n<p><strong>ההודעה:<\/strong><\/p>\n<blockquote>\n<p>היי [שם], מצרפת את החומרים לפגישה ב[יום]. <strong>חובה<\/strong> רק שלושת הראשונים, בערך רבע שעה קריאה. המטרה שלי לצאת עם החלטות על: גיל יעד, ערוץ לקוחות ראשון, מחיר, מבנה העסק ופלטפורמה ראשית. אם יש עוד משהו שתרצו לראות, תגידו לי. תודה! 🟡<\/p>\n<\/blockquote>\n<hr />\n<h2>דף המצב (עמוד אחד, ממלאים 3 ימים לפני)<\/h2>\n<blockquote>\n<p><strong>״קים משחקים״ — דף מצב, [תאריך]<\/strong><\/p>\n<p><strong>מה עשיתי ב־30 יום (במספרים)<\/strong><\/p>\n<ul>\n<li>הופעות: ___ (מתוכן בתשלום: ___) · סרטונים שפורסמו: ___ · פניות שיצאו: ___<\/li>\n<\/ul>\n<p><strong>הפיילוט<\/strong> (<a href=\"05-pilot-feedback.md\">טופס המשוב<\/a>)<\/p>\n<ul>\n<li>צבע כללי בכל הופעה: ___ / ___ / ___<\/li>\n<li>ציון המלצה ממוצע (אם יש 3+): ___ · סימנים עסקיים (שאלו על מחיר, ביקשו פרטים): ___<\/li>\n<li>הקטע הכי חזק: ___ · הקטע הכי חלש: ___ · מה שיניתי: ___<\/li>\n<\/ul>\n<p><strong>התוכן<\/strong> (<a href=\"09-filming-guide.md\">מדריך הצילום<\/a>)<\/p>\n<ul>\n<li>עוקבים: ___ (כמה מהם נראים הורים או מוסדות: ___)<\/li>\n<li>הסרטון הכי טוב ולמה: ___ · פניות שהגיעו מהרשתות: ___<\/li>\n<\/ul>\n<p><strong>מכירות<\/strong> (<a href=\"10-outreach-templates.md\">תבניות פנייה<\/a>, <a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>)<\/p>\n<ul>\n<li>פניות שיצאו: ___ · אחוז מענה: ___% · הצעות שנשלחו: ___ · נסגרו: ___<\/li>\n<li>מה אנשים אמרו כשלא סגרו: ___<\/li>\n<\/ul>\n<p><strong>כסף<\/strong> (<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>)<\/p>\n<ul>\n<li>הוצאתי עד היום: ___ ₪ (ציוד <strong><em>, תלבושת <\/em><\/strong>, אחר ___)<\/li>\n<li>מחיר רצפה: ___ ₪ · טווח 5 המפעילים: <strong><em>–<\/em><\/strong> ₪ · האמצעי: ___ ₪<\/li>\n<\/ul>\n<p><strong>מנהלה<\/strong> (<a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a>)<\/p>\n<ul>\n<li>סגור: ___ · בתהליך: ___ · פתוח: ___<\/li>\n<\/ul>\n<p><strong>הזמינות שלי:<\/strong> ___ שעות בשבוע · ימים ושעות פנויים להופעות: ___<\/p>\n<p><strong>3 השאלות הכי גדולות שלי:<\/strong><\/p>\n<ol>\n<li>\n<hr />\n<\/li>\n<li>\n<hr />\n<\/li>\n<li>\n<hr />\n<\/li>\n<\/ol>\n<\/blockquote>\n<hr />\n<h2>מה מביאים לפגישה<\/h2>\n<table>\n<thead>\n<tr>\n<th>מה<\/th>\n<th>מאיזה קובץ<\/th>\n<th>בשביל מי<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>דף המצב, מודפס, 3 עותקים<\/td>\n<td>הקובץ הזה<\/td>\n<td>שניהם<\/td>\n<\/tr>\n<tr>\n<td>כרטיסי הציון + טבלת המעקב בין הופעות<\/td>\n<td><a href=\"05-pilot-feedback.md\">טופס המשוב<\/a><\/td>\n<td>שניהם<\/td>\n<\/tr>\n<tr>\n<td>ציטוטים מאושרים מהורים ומצוות<\/td>\n<td><a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>, טבלת ההמלצות<\/td>\n<td>המשווק<\/td>\n<\/tr>\n<tr>\n<td>גיליון מדדי הסרטונים + 2 הסרטונים הכי טובים בטלפון<\/td>\n<td><a href=\"09-filming-guide.md\">מדריך הצילום<\/a>, פרק 15<\/td>\n<td>המשווק<\/td>\n<\/tr>\n<tr>\n<td>גיליון התמחור: רצפה, 5 מפעילים, טיוטת מחירון<\/td>\n<td><a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a><\/td>\n<td>היועץ<\/td>\n<\/tr>\n<tr>\n<td>הצעת המופע + טיוטת תנאי הביטול<\/td>\n<td><a href=\"06-show-offer.md\">הצעת המופע<\/a><\/td>\n<td>שניהם<\/td>\n<\/tr>\n<tr>\n<td>גיליון ״לידים״ ומדדי הפנייה<\/td>\n<td><a href=\"10-outreach-templates.md\">תבניות פנייה<\/a><\/td>\n<td>שניהם<\/td>\n<\/tr>\n<tr>\n<td>רשימת מצב מנהלה ושאלות פתוחות (״לבדוק״)<\/td>\n<td><a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a><\/td>\n<td>היועץ<\/td>\n<\/tr>\n<tr>\n<td>תמונות של התלבושת והלוגו, ובדיקת זמינות השם<\/td>\n<td><a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a><\/td>\n<td>המשווק<\/td>\n<\/tr>\n<tr>\n<td>תנ״ך הדמות (בקצרה: אופי, קול, משפטים קבועים)<\/td>\n<td><a href=\"14-character-bible.md\">תנ״ך הדמות<\/a><\/td>\n<td>המשווק<\/td>\n<\/tr>\n<tr>\n<td>טלפון עם <a href=\"../site/index.html\">עמוד הנחיתה<\/a> פתוח<\/td>\n<td>—<\/td>\n<td>המשווק<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>סדר היום<\/h2>\n<blockquote>\n<p>לכל בלוק יש <strong>שאלה אחת להחלטה<\/strong>. אם הדיון נתקע, שואלים: ״מה אנחנו מחליטים <strong>עכשיו<\/strong>, ומה צריך לבדוק עד מתי?״ ורושמים.<\/p>\n<\/blockquote>\n<h3>0–10 · פתיחה: מה למדנו<\/h3>\n<ul>\n<li>את מציגה את דף המצב ב<strong>3 דקות<\/strong> (תרגלת!). הם שואלים שאלות הבהרה.<\/li>\n<li><strong>שאלה להחלטה:<\/strong> האם יש מוצר? (לפי הכלל ב<a href=\"05-pilot-feedback.md\">טופס המשוב<\/a>, חלק ז׳: לפחות 2 הופעות ירוקות ו־2 סימנים עסקיים)<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>החלטה<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>יש מוצר / צריך ליטוש / משהו בסיסי לא עובד<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>10–25 · קהל ומוצר<\/h3>\n<p><strong>שאלה להחלטה:<\/strong> מה גיל הליבה, ומי הקונה הראשי?<\/p>\n<table>\n<thead>\n<tr>\n<th>אפשרות<\/th>\n<th>בעד<\/th>\n<th>נגד<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>3–4<\/strong> (30 דק׳)<\/td>\n<td>הרבה גנים, מופע קצר<\/td>\n<td>פחות מקום לקטעים התיאטרליים ולאלתור, שבהם את הכי חזקה<\/td>\n<\/tr>\n<tr>\n<td><strong>5–6<\/strong> (גרסת הבסיס)<\/td>\n<td>הגרסה הכי מגובשת, גן חובה וימי הולדת<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>7–8<\/strong><\/td>\n<td>ילדים ״ממציאים״, קייטנות<\/td>\n<td>צריך לשמור על ״קול״ ולא ״חמוד״<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>נתונים לבסס עליהם:<\/strong> באיזה גיל הכרטיסים הכי ירוקים? מאיזה סוג לקוח הגיעו סימנים עסקיים?<\/p>\n<table>\n<thead>\n<tr>\n<th>החלטה<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>גיל ליבה<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>קונה ראשי (הורים / גננות / רכזות)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>שינויים במוצר (משך, קטעים)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>25–40 · ערוץ לקוחות ראשון<\/h3>\n<p><strong>שאלה להחלטה:<\/strong> איזה <strong>ערוץ אחד<\/strong> תוקפים ב־90 הימים הקרובים, ואיזה ערוץ משני?<\/p>\n<table>\n<thead>\n<tr>\n<th>קריטריון<\/th>\n<th>ימי הולדת<\/th>\n<th>גנים<\/th>\n<th>קייטנות / מתנ״סים<\/th>\n<th>מפיקים / מתחמים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>מחיר להופעה (מהמחקר שלך)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>כמה הופעות אפשר בחודש<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>עונתיות<\/td>\n<td>כל השנה, סופ״ש<\/td>\n<td>סביב חגים, בקרים<\/td>\n<td>חגים וקיץ<\/td>\n<td>לפי הלקוחות שלהם<\/td>\n<\/tr>\n<tr>\n<td>כמה זמן עד שסוגרים<\/td>\n<td>קצר<\/td>\n<td>בינוני (גננת + ועד)<\/td>\n<td>ארוך (תוכנית, מסמכים, תשלום מאוחר)<\/td>\n<td>משתנה<\/td>\n<\/tr>\n<tr>\n<td>בירוקרטיה<\/td>\n<td>נמוכה<\/td>\n<td>בינונית<\/td>\n<td>גבוהה<\/td>\n<td>נמוכה<\/td>\n<\/tr>\n<tr>\n<td>מתאים לזמינות שלך (בקרים / אחה״צ / סופ״ש)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>מה הנתונים שלך אומרים (אחוז מענה, סימנים עסקיים)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>החלטה<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ערוץ ראשי ל־90 יום<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>ערוץ משני<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>מה <strong>לא<\/strong> עושים עכשיו<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>40–55 · תמחור, חבילות ותנאים<\/h3>\n<p><strong>שאלה להחלטה:<\/strong> מה המחירון ומה התנאים שיוצאים ללקוחות מחר בבוקר?<\/p>\n<p>עוברים על <a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>, שלבים 5–8, ועל <a href=\"06-show-offer.md\">הצעת המופע<\/a>, חלק ד׳:<\/p>\n<table>\n<thead>\n<tr>\n<th>החלטה<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>מחיר הרצפה מקובל? (שכר שעתי, מספר הופעות שנתי)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>מחיר מלא לכל חבילה<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>מחיר השקה, ועד מתי (תאריך או מספר הופעות)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>מקדמה: כמה, ומתי היתרה<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>מדיניות שינוי מועד וביטול (אחרי בדיקה משפטית)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>מדיניות נסיעות ואזור פעילות<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>תנאי תשלום למוסדות<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>שיתוף פעולה עם מפיקים: מותר עמלה? כמה?<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>55–60 · הפסקה (5 דקות)<\/h3>\n<h3>60–75 · עסק ומנהלה (בעיקר היועץ)<\/h3>\n<p><strong>שאלה להחלטה:<\/strong> מה חייב להיות סגור <strong>לפני<\/strong> ההופעה הבאה בתשלום, ומה יכול לחכות?<\/p>\n<table>\n<thead>\n<tr>\n<th>נושא<\/th>\n<th>השאלה<\/th>\n<th>החלטה / מי בודק עד מתי<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מבנה העסק<\/strong><\/td>\n<td>עוסק פטור או מורשה, לפי ההכנסה הצפויה והלקוחות (מוסדות שצריכים חשבונית מס?)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>רו״ח / הנהלת חשבונות<\/strong><\/td>\n<td>צריך רו״ח עכשיו? איזו תוכנה לקבלות? כמה להפריש למס?<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>ביטוח<\/strong><\/td>\n<td>איזה ביטוח נדרש להפעלת ילדים, ומה מוסדות דורשים? למי לפנות להצעות?<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>אישור משטרה<\/strong><\/td>\n<td>חובה? איך מוציאים? (<a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a>)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>זכויות מוזיקה<\/strong><\/td>\n<td>מי חייב ברישיון במופע בגן, בקייטנה וביום הולדת: אני, המקום או המזמין? (<a href=\"02-show-script.md\">תסריט המופע<\/a>, פרק 8)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>תנאי ביטול<\/strong><\/td>\n<td>הנוסח ב<a href=\"06-show-offer.md\">הצעת המופע<\/a> תואם את חוק הגנת הצרכן?<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>פנייה יזומה<\/strong><\/td>\n<td>כללי חוק הספאם: וואטסאפ נחשב? מותר פולואפ? (<a href=\"10-outreach-templates.md\">תבניות פנייה<\/a>, חלק א׳)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>פרטיות וצילום<\/strong><\/td>\n<td>טופס אישור הצילום מספיק? כמה זמן שומרים פרטי לקוחות? (<a href=\"08-consent-template.md\">טופס אישור הצילום<\/a>)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>מסמכי ספק<\/strong><\/td>\n<td>מה להכין מראש למוסדות? (<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>, תחנה 6)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>75–95 · שיווק, תוכן ומותג (בעיקר המשווק)<\/h3>\n<p><strong>שאלה להחלטה:<\/strong> איפה מפרסמים, כמה, ולמי מדברים?<\/p>\n<table>\n<thead>\n<tr>\n<th>נושא<\/th>\n<th>השאלה<\/th>\n<th>החלטה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>פלטפורמה ראשית<\/strong><\/td>\n<td>ההמלצה ב<a href=\"09-filming-guide.md\">מדריך הצילום<\/a>: אינסטגרם ראשית, יוטיוב שורטס כספרייה, טיקטוק כניסוי. מאשרים?<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>קצב<\/strong><\/td>\n<td>3 סרטונים בשבוע (<a href=\"01-concept.md\">מסמך הקונספט<\/a>) אפשרי לצד ההופעות?<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>ילדים מול הורים<\/strong><\/td>\n<td>התוכן לילדים, השיווק להורים. איך זה נראה בכיתוב, בביו ובסטוריז?<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>הגעה למוסדות<\/strong><\/td>\n<td>מה עובד מול גננות ורכזות? יש לו/ה אנשי קשר להכיר לך?<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>קידום ממומן<\/strong><\/td>\n<td>עכשיו או אחרי שיש סרטון שהוכיח את עצמו? תקציב ניסוי ולכמה זמן?<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>מותג<\/strong><\/td>\n<td>שם משתמש סופי, דומיין, בדיקת סימן מסחר, לוגו (<a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a>)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>המלצות<\/strong><\/td>\n<td>איך אוספים יותר, ואיפה מציגים? (<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>, תחנה 11)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>95–105 · תקציב ותוכנית 90 יום<\/h3>\n<p><strong>שאלה להחלטה:<\/strong> כמה כסף ושעות משקיעים, ובמה, לפי הסדר של הקונספט?<\/p>\n<p><strong>תקציב לפי שלבים<\/strong> (<a href=\"01-concept.md\">מסמך הקונספט<\/a>, פרק 8: קודם מיתוג בסיסי, תלבושת, תוכן ופיילוט):<\/p>\n<table>\n<thead>\n<tr>\n<th>קטגוריה<\/th>\n<th>עכשיו (90 יום)<\/th>\n<th>רק אחרי אימות ביקוש<\/th>\n<th>לא השנה<\/th>\n<th>סכום<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>תלבושת (סט שני, שדרוג)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>לוגו ומיתוג בסיסי<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>ציוד (מגבר וכו׳)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>צילום ועריכה<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>קידום ממומן (ניסוי)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>ביטוח, רו״ח, אישורים<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>שיר מקורי / כוריאוגרפיה<\/td>\n<td><\/td>\n<td>✓<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>קליפ מושקע<\/td>\n<td><\/td>\n<td><\/td>\n<td>✓<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>אתר מורכב<\/td>\n<td><\/td>\n<td><\/td>\n<td>✓<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>מרצ׳נדייז<\/td>\n<td><\/td>\n<td><\/td>\n<td>✓<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>ניהול אישי<\/td>\n<td><\/td>\n<td><\/td>\n<td>✓<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>שלד 90 יום:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>חודש<\/th>\n<th>מטרה מרכזית<\/th>\n<th>יעד מספרי<\/th>\n<th>אחראי/ת<\/th>\n<th>תקציב<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><\/td>\n<td>___ הופעות בתשלום · ___ סרטונים · ___ פניות<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><\/td>\n<td>___ הופעות · ___ המלצות מאושרות<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><\/td>\n<td>___ הופעות · ___ לקוחות חוזרים או הפניות<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>מדדי הצלחה ל־90 יום<\/strong> (לבחור 3–5, ולקבוע יעד מספרי):<\/p>\n<table>\n<thead>\n<tr>\n<th>מדד<\/th>\n<th>מאיפה הנתון<\/th>\n<th>יעד<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>הופעות בתשלום<\/td>\n<td><a href=\"12-booking-process.md\">גיליון הלקוחות<\/a><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>אחוז סגירה של הצעות<\/td>\n<td><a href=\"12-booking-process.md\">גיליון הלקוחות<\/a>, מדדים חודשיים<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>ציון המלצה ממוצע<\/td>\n<td><a href=\"05-pilot-feedback.md\">טופס המשוב<\/a><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>לקוחות חוזרים או הפניות<\/td>\n<td><a href=\"12-booking-process.md\">גיליון הלקוחות<\/a><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>פניות נכנסות מהרשתות<\/td>\n<td><a href=\"12-booking-process.md\">גיליון הלקוחות<\/a>, עמודת ״מקור״<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>עוקבים <strong>מסוג הורים ומוסדות<\/strong> (לא רק מספר כללי)<\/td>\n<td><a href=\"09-filming-guide.md\">מדריך הצילום<\/a><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>ילדים זוכרים את ״כולם משחקים!״ גם בסוף<\/td>\n<td><a href=\"05-pilot-feedback.md\">טופס המשוב<\/a><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>105–110 · סיכום: מי עושה מה עד מתי<\/h3>\n<p>עוברים על יומן ההחלטות שורה אחרי שורה. <strong>אין שורה בלי אחראי/ת ותאריך.<\/strong><\/p>\n<h3>גרסה מקוצרת (90 דקות)<\/h3>\n<p>מאחדים ״קהל ומוצר״ עם ״ערוץ לקוחות ראשון״ (20 דק׳), מקצרים את המנהלה ל־10 דקות (רק ״מה חייב לפני ההופעה הבאה״), וקובעים <strong>שיחת המשך של 30 דקות<\/strong> עם היועץ לשאר נושאי המנהלה.<\/p>\n<hr />\n<h2>בנק שאלות<\/h2>\n<h3>ליועץ העסקי<\/h3>\n<p><strong>מבנה ומס<\/strong><\/p>\n<ul>\n<li>עוסק פטור או מורשה, לפי ההכנסה שאני צופה וסוג הלקוחות?<\/li>\n<li>כמה אחוז לשים בצד למס הכנסה, ביטוח לאומי ופנסיה?<\/li>\n<li>אילו הוצאות מוכרות (רכב, טלפון, תלבושת, ציוד)?<\/li>\n<\/ul>\n<p><strong>סיכונים<\/strong><\/p>\n<ul>\n<li>איזה ביטוח בדיוק, ובאיזה היקף? למי לפנות להצעות?<\/li>\n<li>מה לעשות אם ילד/ה נפצע/ת במופע, גם כשהאחריות על הצוות?<\/li>\n<li>תנאי הביטול שלי חוקיים? מה קורה עם מקדמה?<\/li>\n<\/ul>\n<p><strong>תזרים<\/strong><\/p>\n<ul>\n<li>מוסדות משלמים מאוחר. איך מתכננים את זה?<\/li>\n<li>כמה הופעות בחודש צריך כדי שזה ישתלם, לפי מחיר הרצפה?<\/li>\n<\/ul>\n<p><strong>צמיחה<\/strong><\/p>\n<ul>\n<li>מתי לשקול עובד/ת או מפעיל/ה נוסף/ת? (ומה עושים עם זה שהדמות היא אני?)<\/li>\n<li>מתי נכון להשקיע בשיר מקורי, ולפי אילו נתונים?<\/li>\n<\/ul>\n<h3>למשווק<\/h3>\n<p><strong>פלטפורמות ותוכן<\/strong><\/p>\n<ul>\n<li>איזו פלטפורמה ראשית, כשהקהל המפיץ הוא הורים והקהל הצופה הוא ילדים?<\/li>\n<li>מה ראית בסרטונים שלי שעובד, ומה לא?<\/li>\n<li>איך משלבים תוכן מהופעות בלי לחשוף ילדים?<\/li>\n<\/ul>\n<p><strong>מכירות<\/strong><\/p>\n<ul>\n<li>איך מגיעים למקבלי החלטות במוסדות (גננות, רכזות קייטנה, מתנ״סים)?<\/li>\n<li>מה ההצעה שלי צריכה להגיד כדי שגננת תגיד ״כן״ בלי להתלבט?<\/li>\n<li>איך מעודדים הפניות מפה לאוזן?<\/li>\n<\/ul>\n<p><strong>מותג וקידום<\/strong><\/p>\n<ul>\n<li>השם והלוגו עובדים? מה צריך לבדוק לפני שמשקיעים?<\/li>\n<li>מתי קידום ממומן, באיזה תקציב ניסוי, ואיך יודעים שזה עבד?<\/li>\n<\/ul>\n<hr />\n<h2>דגלים אדומים: מתי לעצור ולהגיד ״רגע״<\/h2>\n<table>\n<thead>\n<tr>\n<th>אם עולה הצעה ל...<\/th>\n<th>מה עונים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>קליפ מושקע, שיר בהפקה גדולה, אתר מורכב, מרצ׳נדייז או מנהל/ת אישי/ת<\/strong> עכשיו<\/td>\n<td>״לפי הקונספט, זה שלב הרחבה <strong>אחרי<\/strong> אימות ביקוש. מה יהיה הסימן שהביקוש אומת? בואו נכתוב מספר: ___ הופעות בתשלום ו־___ לקוחות חוזרים.״ (<a href=\"01-concept.md\">מסמך הקונספט<\/a>, פרק 8)<\/td>\n<\/tr>\n<tr>\n<td><strong>לצלם ילדים מההופעות לשיווק<\/strong> בלי אישורים<\/td>\n<td>״רק עם אישור הורים חתום לשימוש שיווקי. אחרת מצלמים רק אותי או את ההתרחשות מאחור.״ (<a href=\"08-consent-template.md\">טופס אישור הצילום<\/a>)<\/td>\n<\/tr>\n<tr>\n<td><strong>להוריד מחיר מתחת לרצפה<\/strong> כדי ״לתפוס שוק״<\/td>\n<td>״מתחת לרצפה אני מממנת את הלקוח. אפשר מחיר השקה מוגבל בזמן, מעל הרצפה.״ (<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>)<\/td>\n<\/tr>\n<tr>\n<td><strong>הודעות המוניות<\/strong> לקבוצות או לרשימות<\/td>\n<td>״אני עובדת אחד־על־אחד, לפי כללי חוק הספאם וחוקי הקבוצות.״ (<a href=\"10-outreach-templates.md\">תבניות פנייה<\/a>)<\/td>\n<\/tr>\n<tr>\n<td><strong>קניית עוקבים או המלצות<\/strong><\/td>\n<td>לא. זה פוגע באמון של הורים ובמדדים שלך<\/td>\n<\/tr>\n<tr>\n<td><strong>הבטחות שאי אפשר לעמוד בהן<\/strong> (״תכתבי שאת מבוטחת, תסדרי אחר כך״)<\/td>\n<td>״אני כותבת רק מה שנכון היום.״<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>יומן החלטות (ממלאים בפגישה)<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>נושא<\/th>\n<th>מה הוחלט<\/th>\n<th>למה (נתון או נימוק)<\/th>\n<th>מי<\/th>\n<th>עד מתי<\/th>\n<th>איפה מעדכנים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>גיל ליבה<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><a href=\"06-show-offer.md\">הצעת המופע<\/a>, <a href=\"02-show-script.md\">תסריט המופע<\/a><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>ערוץ ראשי ומשני<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><a href=\"10-outreach-templates.md\">תבניות פנייה<\/a>, גיליון ״לידים״<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>מחירון ומחיר השקה<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>, <a href=\"06-show-offer.md\">הצעת המופע<\/a><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>מקדמה ותנאי ביטול<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><a href=\"06-show-offer.md\">הצעת המופע<\/a> חלק ד׳, <a href=\"12-booking-process.md\">תהליך ההזמנה<\/a><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>עוסק פטור / מורשה<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a>, <a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a> שלב 4<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>ביטוח ואישורים<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>זכויות מוזיקה<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><a href=\"02-show-script.md\">תסריט המופע<\/a> פרק 8<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>פלטפורמה ראשית וקצב<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><a href=\"09-filming-guide.md\">מדריך הצילום<\/a>, <a href=\"03-video-scripts.md\">תסריטי הווידאו<\/a><\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>קידום ממומן<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><a href=\"09-filming-guide.md\">מדריך הצילום<\/a> פרק 16<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>שם, דומיין, סימן מסחר, לוגו<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a>, <a href=\"../site/index.html\">עמוד הנחיתה<\/a><\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>תקציב 90 יום<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>הקובץ הזה<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>אחרי הפגישה<\/h2>\n<h3>תוך 24 שעות<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> לשלוח לשניהם סיכום קצר: ההחלטות, מי עושה מה ועד מתי (להעתיק את יומן ההחלטות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> להודות. אם עזרו בלי תשלום, לשאול איך את יכולה להחזיר טובה<\/li>\n<\/ul>\n<blockquote>\n<p>היי [שם], תודה ענקית על הפגישה! 🧡 מצרפת את הסיכום: [ההחלטות]. המשימות שלך: [<strong><em>] עד [<\/em><\/strong>]. אעדכן אותך ב[תאריך] איפה אני עומדת.<\/p>\n<\/blockquote>\n<h3>תוך 72 שעות: לעדכן את הקבצים<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong><a href=\"06-show-offer.md\">הצעת המופע<\/a>:<\/strong> גיל, חבילות, מחירים, תנאים. להוריד את ה־<code>[___]<\/code> שנסגרו<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong><a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>:<\/strong> מחירון סופי, תאריך סיום מחיר ההשקה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong><a href=\"10-outreach-templates.md\">תבניות פנייה<\/a>:<\/strong> לסדר את 20 הלידים לפי הערוץ שנבחר<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong><a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>:<\/strong> מקדמה, תנאי תשלום, מסמכי ספק<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong><a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a>:<\/strong> לסמן מה הוחלט ומה נשאר ״לבדוק״<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong><a href=\"09-filming-guide.md\">מדריך הצילום<\/a><\/strong> ו־<strong><a href=\"03-video-scripts.md\">תסריטי הווידאו<\/a>:<\/strong> פלטפורמה וקצב<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong><a href=\"../site/index.html\">עמוד הנחיתה<\/a>:<\/strong> שם משתמש, פרטי קשר, מה שהשתנה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>ביומן:<\/strong> פגישת מעקב קצרה (30 דק׳) בעוד 30 יום, עם אותו דף מצב מעודכן<\/li>\n<\/ul>\n<p><strong>קבצים קשורים:<\/strong><\/p>\n<p><a href=\"01-concept.md\">מסמך הקונספט<\/a> · <a href=\"05-pilot-feedback.md\">טופס המשוב לפיילוט<\/a> · <a href=\"06-show-offer.md\">הצעת המופע<\/a> · <a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a> · <a href=\"10-outreach-templates.md\">תבניות פנייה<\/a> · <a href=\"12-booking-process.md\">תהליך ההזמנה<\/a> · <a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a> · <a href=\"09-filming-guide.md\">מדריך הצילום<\/a> · <a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a> · <a href=\"14-character-bible.md\">תנ״ך הדמות<\/a><\/p>"}, "docs/08-consent-template.md": {"title": "אישורי צילום ופרסום: הטפסים והכללים", "html": "<h1>אישורי צילום ופרסום: הטפסים והכללים<\/h1>\n<blockquote>\n<p><strong>למה את צריכה את זה:<\/strong> התוכן של ״קים משחקים״ נשען על רגעים אמיתיים עם ילדים, אבל ילד/ה מזוהה בפרסום עסקי דורש/ת <strong>אישור הורה בכתב, לשימוש הספציפי<\/strong>. בקובץ הזה יש שישה נוסחים מוכנים (נייר, טופס דיגיטלי, מוסד, הודעה למארח/ת, ציטוט המלצה, מבוגר/ת בצילום), ואחריהם <strong>הכללים הפנימיים שלך<\/strong>: מה עושים לפני, בזמן ואחרי כל אירוע.<\/p>\n<p><strong>טיוטה, לא ייעוץ משפטי.<\/strong> הנוסחים נכתבו לפי העקרונות של <a href=\"https://he.wikisource.org/wiki/חוק_הגנת_הפרטיות\">חוק הגנת הפרטיות<\/a> (פירוט ב<a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a>, פרק 7). <strong>לפני שימוש ראשון, להעביר לעו״ד.<\/strong> מוסד שיש לו טופס משלו: <strong>הטופס שלו קודם<\/strong>, ואת מוסיפה רק מה שחסר.<\/p>\n<\/blockquote>\n<hr />\n<h2>איזה נוסח מתי<\/h2>\n<table>\n<thead>\n<tr>\n<th>מצב<\/th>\n<th>מה שולחים<\/th>\n<th>מתי שולחים<\/th>\n<th>מי אוסף/ת<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>יום הולדת / אירוע פרטי<\/strong><\/td>\n<td>נוסח א׳ (נייר/PDF) <strong>או<\/strong> נוסח ב׳ (טופס דיגיטלי) לכל הורה, + נוסח ד׳ למארח/ת<\/td>\n<td>עם הודעת האישור, ותזכורת שבוע לפני (<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>, תחנות 6–7)<\/td>\n<td>המארח/ת מעביר/ה את הקישור, ההורים ממלאים<\/td>\n<\/tr>\n<tr>\n<td><strong>גן, קייטנה, מתנ״ס, בית ספר<\/strong><\/td>\n<td>נוסח ג׳ למוסד. אישורי ההורים: בטופס של המוסד, או בנוסח א׳/ב׳<\/td>\n<td>בסגירת ההזמנה<\/td>\n<td>המוסד<\/td>\n<\/tr>\n<tr>\n<td><strong>פיילוט<\/strong> (<a href=\"04-launch-checklist.md\">תוכנית ההשקה<\/a>, שבוע 3)<\/td>\n<td>כמו למעלה. ברירת המחדל בפיילוט: <strong>תיעוד פנימי בלבד<\/strong><\/td>\n<td>לפני הפיילוט<\/td>\n<td>המארח/ת<\/td>\n<\/tr>\n<tr>\n<td><strong>המלצה בכתב מהורה או מגננת<\/strong><\/td>\n<td>נוסח ה׳<\/td>\n<td>כשמבקשים המלצה (<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>, תחנה 11)<\/td>\n<td>את<\/td>\n<\/tr>\n<tr>\n<td><strong>צילום שבו אין ילדים מזוהים<\/strong> (רק את, מאחורי הילדים, ידיים ורגליים)<\/td>\n<td>לא נדרש טופס הורים לפי הכללים הפנימיים שלך, <strong>אבל<\/strong> מודיעים למארח/ת מראש. <strong>לבדוק<\/strong> עם עו״ד<\/td>\n<td>לפני האירוע<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>מבוגר/ת מזוהה בצילום<\/strong> (גננת, הורה, חבר/ה שעוזר/ת לך בסרטון)<\/td>\n<td>נוסח ו׳<\/td>\n<td>לפני הצילום<\/td>\n<td>את<\/td>\n<\/tr>\n<tr>\n<td><strong>סרטון מתוכנן שבו ילד/ה ״משחק/ת״ איתך<\/strong> (לא תיעוד של מופע)<\/td>\n<td><strong>אף אחד מהנוסחים כאן לא מספיק.<\/strong> קודם בודקים אם נדרש היתר להעסקת ילדים (<a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a>, פרק 7.7). עד אז: סרטונים מתוכננים רק איתך<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>העקרונות: למה הטופס בנוי ככה<\/h2>\n<ol>\n<li><strong>הסכמה נפרדת לכל שימוש.<\/strong> ״תיעוד פנימי״, ״פרסום ברשתות״ ו״מודעה בתשלום״ הם שלושה דברים שונים. הורה יכול/ה להסכים לאחד ולא לשני.<\/li>\n<li><strong>מה שלא סומן, לא אושר.<\/strong> אין תיבות מסומנות מראש.<\/li>\n<li><strong>בלי שמות ובלי מקום.<\/strong> לא שם הילד/ה (גם לא שם פרטי), לא שם הגן, לא כתובת, לא תיוג מיקום.<\/li>\n<li><strong>אפשר לחזור בך.<\/strong> בכל עת, בהודעה פשוטה, עם זמן טיפול ידוע מראש.<\/li>\n<li><strong>אישור הוא לא תנאי.<\/strong> ילד/ה בלי אישור משתתף/ת במופע בדיוק כמו כולם.<\/li>\n<li><strong>גם הילד/ה מחליט/ה.<\/strong> ילד/ה שמסתיר/ה פנים, אומר/ת ״לא״ או בורח/ת מהמצלמה: לא מצלמים ולא מפרסמים, <strong>גם אם יש אישור<\/strong>.<\/li>\n<li><strong>כולם בפריים, או אף אחד.<\/strong> מפרסמים ילדים מזוהים <strong>רק<\/strong> כשלכל ילד/ה בפריים יש אישור לאותו שימוש. אחרת: מאחור, מרחוק, טשטוש, או לא מפרסמים (כמו ב<a href=\"02-show-script.md\">תסריט המופע<\/a>).<\/li>\n<li><strong>החשבונות שלך עסקיים.<\/strong> שימוש בתמונה של אדם ״לשם רווח״ בלי הסכמה הוא פגיעה בפרטיות לפי החוק, ולכן ההסכמה כאן מפורשת ובכתב (פירוט ב<a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a>, פרק 7.2).<\/li>\n<li><strong>שומרים מעט, מוחקים בזמן.<\/strong> הקבצים והטפסים נשמרים בתיקייה פרטית, וחומר שלא בשימוש נמחק.<\/li>\n<\/ol>\n<hr />\n<h2>נוסח א׳ — אישור הורה מלא (להדפסה או PDF)<\/h2>\n<p><em>הוראות: ממלאים מראש את פרטי האירוע ואת פרטי הקשר שלך, ומעבירים להורים. החלקים בסוגריים מרובעים: להשלמה שלך לפני השליחה.<\/em><\/p>\n<hr />\n<p><strong>״קים משחקים״ — אישור הורה/אפוטרופוס לצילום ולשימוש בתמונות ובסרטונים<\/strong><\/p>\n<p><strong>פרטי האירוע<\/strong><\/p>\n<ul>\n<li>תאריך: <strong><em>_<\/em><\/strong>_____<\/li>\n<li>סוג האירוע: ☐ יום הולדת ☐ גן ☐ קייטנה ☐ מתנ״ס ☐ אחר: <strong><em>_<\/em><\/strong>_____<\/li>\n<li>מארח/ת או מוסד: <strong><em>_<\/em><\/strong>_____<\/li>\n<li>מי מצלם/ת: קים נידם (״קים משחקים״) [או: <strong><em>_<\/em><\/strong>_____, שמצלם/ת מטעמה]<\/li>\n<\/ul>\n<p><strong>פרטי ההורה/האפוטרופוס<\/strong><\/p>\n<ul>\n<li>שם מלא: <strong><em>_<\/em><\/strong>_____<\/li>\n<li>טלפון: <strong><em>_<\/em><\/strong>_____<\/li>\n<\/ul>\n<p><strong>פרטי הילד/ה<\/strong><\/p>\n<ul>\n<li>שם פרטי: <strong><em>_<\/em><\/strong>_____ (לא יפורסם. משמש רק כדי לדעת מי אושר/ה)<\/li>\n<li>גיל: ____<\/li>\n<li>סימן היכר לעריכה (לא חובה, למשל ״חולצה כתומה״): <strong><em>_<\/em><\/strong>_____<\/li>\n<\/ul>\n<p><strong>1. מה אני מאשר/ת<\/strong> (מסמנים רק מה שמתאים. <strong>מה שלא סומן, לא מאושר<\/strong>)<\/p>\n<p>☐ <strong>א. תיעוד פנימי בלבד.<\/strong> לצורך שיפור המופע. לא יפורסם ולא יישלח לאף אחד. יימחק תוך [30] יום.<\/p>\n<p>☐ <strong>ב. שליחה למארח/ת בלבד.<\/strong> תמונות או סרטון מהאירוע יישלחו רק ל[מארח/ת / המוסד], לשימוש פרטי, ולא לפרסום ברשת.<\/p>\n<p>☐ <strong>ג. פרסום בערוצים של ״קים משחקים״<\/strong> (אינסטגרם, טיקטוק, יוטיוב, פייסבוק, לפי מה שקיים), בפרסום רגיל, בלי תשלום על קידום.<\/p>\n<p>☐ <strong>ד. מודעות בתשלום.<\/strong> שימוש בתוכן בקידום ממומן ברשתות, שמגיע גם לאנשים שלא עוקבים.<\/p>\n<p>☐ <strong>ה. חומרים שיווקיים.<\/strong> עמוד הנחיתה או האתר, הצעות מחיר ומצגות למוסדות.<\/p>\n<p><strong>איך הילד/ה יכול/ה להופיע<\/strong> (אם סימנתי ג׳, ד׳ או ה׳, מסמנים אחד):<\/p>\n<p>☐ גם פנים ברורות\n☐ רק מרחוק, מאחור או בלי פנים ברורות<\/p>\n<p><strong>2. מה קים מתחייבת<\/strong><\/p>\n<ol>\n<li><strong>לא יפורסמו<\/strong> שם הילד/ה (גם לא שם פרטי), שם המוסד, כתובת, או כל פרט מזהה אחר, <strong>ולא יתויג מיקום<\/strong>.<\/li>\n<li>הפרסום יהיה <strong>רק אחרי האירוע<\/strong>, לא בזמן אמת.<\/li>\n<li><strong>לא יפורסם<\/strong> רגע מביך או פוגע: בכי, נפילה, בגדים לא מסודרים, החלפת בגדים, בגד ים.<\/li>\n<li>ילד/ה שלא רוצה להצטלם <strong>לא יצולם/תצולם<\/strong>, גם אם יש אישור.<\/li>\n<li>הקבצים נשמרים בתיקייה פרטית ומאובטחת, <strong>לא נשלחים לקבוצות<\/strong>, לא מועברים לאף גורם אחר ולא נמכרים.<\/li>\n<li>התמונות והסרטונים ישמשו <strong>רק<\/strong> בהקשר של ״קים משחקים״, ורק לשימושים שסומנו.<\/li>\n<li><strong>חזרה מהאישור:<\/strong> אפשר בכל עת, בהודעה ל[טלפון / מייל]. תוך [7] ימים התוכן יוסר מהערוצים של ״קים משחקים״, והשימוש בו ייפסק. <strong>חשוב לדעת:<\/strong> תוכן שכבר שותף או נשמר אצל אחרים לפני ההסרה, אין לי אפשרות מלאה להחזיר.<\/li>\n<li><strong>שמירת הטופס:<\/strong> הטופס נשמר כל עוד התוכן בשימוש, ועוד [___] אחרי זה, ואז נמחק. [להשלים אחרי בדיקה עם עו״ד]<\/li>\n<\/ol>\n<p><strong>3. ידוע לי ש...<\/strong><\/p>\n<ul>\n<li>האישור ניתן <strong>מרצון ובלי תמורה<\/strong>.<\/li>\n<li>אם לא אאשר, זה <strong>לא ישפיע<\/strong> על ההשתתפות של הילד/ה במופע.<\/li>\n<li>אני ההורה/האפוטרופוס של הילד/ה, ואני מוסמך/ת לתת את האישור. [<strong>לבדוק<\/strong> עם עו״ד אם נדרשת חתימה של שני ההורים]<\/li>\n<\/ul>\n<p><strong>קראתי, הבנתי ואני מאשר/ת את מה שסימנתי.<\/strong><\/p>\n<p>חתימה: <strong><em>_<\/em><\/strong><strong><em>_<\/em>  תאריך: <\/strong><strong><em>_<\/em><\/strong>___<\/p>\n<p><em>[שורה אופציונלית, אם העו״ד ימליץ/תמליץ על חתימת שני ההורים:]<\/em> שם ההורה הנוסף: <strong><em>_<\/em><\/strong><strong><em>_<\/em>  חתימה: <\/strong><strong><em>_<\/em><\/strong>___<\/p>\n<hr />\n<h2>נוסח ב׳ — גרסה דיגיטלית קצרה (Google Forms)<\/h2>\n<p><strong>למה:<\/strong> הורים ממלאים בטלפון תוך דקה, ואת מקבלת הכול בגיליון מסודר עם תאריך ושעה.<\/p>\n<blockquote>\n<p><strong>תוקף משפטי:<\/strong> לפי <a href=\"https://www.hamichlol.org.il/חוק_חתימה_אלקטרונית\">חוק חתימה אלקטרונית<\/a>, חתימה אלקטרונית שאינה ״מאושרת״ יכולה לעמוד בדרישת חתימה אם היא משיגה את מטרות החתימה (זיהוי החותם/ת וגמירות דעת). <strong>לבדוק עם עו״ד<\/strong> אם טופס עם שם מוקלד ותיבת אישור מספיק לשימושים שלך, במיוחד למודעות בתשלום. עד שבדקת: לשימושים ד׳ (מודעות בתשלום) ו־ה׳ (חומרים שיווקיים), אפשר לבקש <strong>גם<\/strong> נוסח א׳ חתום.<\/p>\n<\/blockquote>\n<h3>הגדרות (פעם אחת, 15 דקות)<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ליצור את הטופס <strong>בחשבון Google של העסק<\/strong>, עם אימות דו־שלבי<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> בהגדרות התשובות: להפעיל <strong>איסוף כתובות אימייל<\/strong>, ו<strong>שליחת עותק של התשובה למשיב/ה<\/strong>, כדי שלהורה יישאר עותק (השמות המדויקים של ההגדרות בממשק עשויים להשתנות, <strong>לבדוק<\/strong>)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא<\/strong> לבקש מספר ת״ז, שם משפחה של הילד/ה או שם הגן<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> לחבר את התשובות לגיליון, ולשמור אותו בתיקייה <code>06 אישורי צילום<\/code> (<a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a>, פרק 0). <strong>אף פעם<\/strong> לא לתת לאף אחד הרשאת עריכה או צפייה בגיליון<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לכל אירוע, עותק נפרד של הטופס<\/strong> (״יצירת עותק״), עם התאריך והמארח/ת בכותרת. כך קל להתאים בין טופס לאירוע, וקל למחוק בזמן<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> להעלות את נוסח א׳ כ־PDF לתיקייה עם הרשאת צפייה בלבד, ולקשר אליו מהטופס (״התנאים המלאים״)<\/li>\n<\/ul>\n<h3>מבנה הטופס<\/h3>\n<p><strong>כותרת:<\/strong> אישור צילום — ״קים משחקים״ — [תאריך] — [שם המארח/ת או המוסד]<\/p>\n<p><strong>תיאור (להעתקה):<\/strong><\/p>\n<blockquote>\n<p>היי! 🟡 בהופעה של ״קים משחקים״ אני לפעמים מצלמת כדי לשפר את המופע, ולפעמים כדי לשתף רגעים שמחים. אני מצלמת ילד/ה <strong>רק<\/strong> לפי מה שתאשרו כאן. <strong>מה שלא תסמנו, לא מאושר.<\/strong> לא אפרסם שם, שם של גן, מקום או כל פרט מזהה, ולא בזמן אמת. אפשר לחזור בכם בכל עת בהודעה ל[טלפון], ותוך [7] ימים התוכן יורד. אם לא תאשרו, הילד/ה משתתף/ת בדיוק כמו כולם. התנאים המלאים: [קישור ל־PDF]. תודה! קים<\/p>\n<\/blockquote>\n<p>[ולהוסיף כאן את הודעת הפרטיות הקצרה מ<a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a>, פרק 7.4]<\/p>\n<p><strong>השאלות:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>שאלה<\/th>\n<th>סוג שאלה<\/th>\n<th>חובה?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>שם מלא של ההורה/האפוטרופוס<\/td>\n<td>תשובה קצרה<\/td>\n<td>כן<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>טלפון<\/td>\n<td>תשובה קצרה<\/td>\n<td>כן<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>שם פרטי של הילד/ה (לא יפורסם)<\/td>\n<td>תשובה קצרה<\/td>\n<td>כן<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>גיל הילד/ה<\/td>\n<td>רשימה נפתחת (3, 4, 5... 10)<\/td>\n<td>כן<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>מה את/ה מאשר/ת? (אפשר לסמן כמה, או כלום)<\/td>\n<td>תיבות סימון: א׳ תיעוד פנימי בלבד · ב׳ שליחה למארח/ת בלבד · ג׳ פרסום בערוצים של ״קים משחקים״ · ד׳ מודעות בתשלום · ה׳ חומרים שיווקיים<\/td>\n<td><strong>לא<\/strong> (ריק = לא מאשר/ת)<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>איך הילד/ה יכול/ה להופיע?<\/td>\n<td>בחירה מרובה: גם פנים ברורות · רק מרחוק/מאחור/בלי פנים · לא רלוונטי, לא אישרתי פרסום<\/td>\n<td>כן<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>סימן היכר לעריכה (למשל ״חולצה כתומה״)<\/td>\n<td>תשובה קצרה<\/td>\n<td>לא<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>הצהרה<\/td>\n<td>תיבת סימון אחת: ״קראתי את התנאים המלאים, אני ההורה/האפוטרופוס של הילד/ה, ואני מאשר/ת את מה שסימנתי״<\/td>\n<td>כן<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>שם מלא, כחתימה<\/td>\n<td>תשובה קצרה<\/td>\n<td>כן<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>הודעת אישור (אחרי שליחה):<\/strong><\/p>\n<blockquote>\n<p>תודה! 🟡 קיבלתי. עותק של מה שסימנת נשלח למייל שלך. רוצה לשנות או לבטל? הודעה ל[טלפון] ואני מטפלת תוך [7] ימים.<\/p>\n<\/blockquote>\n<h3>הודעות להעתקה (וואטסאפ)<\/h3>\n<p><strong>כשיש לך את הטלפון של ההורה<\/strong> (למשל ההורה שהזמין/ה את המופע ליום ההולדת. להורי האורחים הקישור עובר דרך המארח/ת, ראי נוסח ד׳):<\/p>\n<blockquote>\n<p>היי [שם], כאן קים מ״קים משחקים״ 🟡 לקראת המופע ב[תאריך]: לפעמים אני מצלמת כדי לשפר את המופע או לשתף רגעים שמחים, <strong>רק לפי מה שתאשר/י<\/strong>. דקה למלא: [קישור]. לא מתאים לך? פשוט לא ממלאים, והילד/ה משחק/ת בדיוק כמו כולם. תודה!<\/p>\n<\/blockquote>\n<p><strong>תזכורת, שבוע לפני<\/strong> (רק למי שלא מילא/ה, ורק פעם אחת):<\/p>\n<blockquote>\n<p>היי [שם], תזכורת קטנה לקראת [תאריך] 🟡 אם תרצה/י שאוכל לצלם גם את [שם פרטי], הקישור כאן: [קישור]. ואם לא, זה לגמרי בסדר. נתראה!<\/p>\n<\/blockquote>\n<p><strong>כלל:<\/strong> לא שולחים יותר מתזכורת אחת, ולא מבקשים ״למה לא״. ״לא״ היא תשובה שלמה.<\/p>\n<h3>ביום האירוע: איך יודעים מי אושר/ה<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>ערב לפני:<\/strong> לפתוח את הגיליון ולכתוב בפתקים בטלפון רשימה קצרה: שם פרטי + סימן היכר + מה אושר. <strong>לא מדפיסים ולא תולים<\/strong><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אם לא כל הילדים אושרו לאותו שימוש:<\/strong> מחליטים מראש שמצלמים רק מאחור, מרחוק או רק את עצמך (עיקרון 7)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אחרי העריכה:<\/strong> מוחקים את הרשימה מהפתקים<\/li>\n<\/ul>\n<hr />\n<h2>נוסח ג׳ — למוסד (גן, קייטנה, מתנ״ס, בית ספר)<\/h2>\n<p><em>הוראות: שולחים עם אישור ההזמנה. מוסד עם נוהל משלו: מבקשים את הנוהל, ומשתמשים בנוסח הזה רק כדי לסגור את מה שלא כתוב שם.<\/em><\/p>\n<blockquote>\n<p><strong>שימי לב:<\/strong> טופס הסכמה שנתי של גן או של בית ספר מכסה בדרך כלל פרסום <strong>של המוסד<\/strong> (בעמוד של הגן, בקבוצת ההורים). הוא <strong>לא בהכרח<\/strong> מכסה פרסום בערוצים <strong>העסקיים שלך<\/strong>. לשאול במפורש, ולבקש לראות את הנוסח.<\/p>\n<\/blockquote>\n<hr />\n<p><strong>תיאום תיעוד ופרסום — ״קים משחקים״ ו־[שם המוסד]<\/strong><\/p>\n<p><strong>פרטים<\/strong><\/p>\n<ul>\n<li>מוסד: <strong><em>_<\/em><\/strong><strong><em>_<\/em>  איש/אשת קשר ותפקיד: <\/strong><strong><em>_<\/em><\/strong><strong><em>  טלפון: <\/em><\/strong><strong><em>_<\/em><\/strong>__<\/li>\n<li>תאריך ושעת המופע: <strong><em>_<\/em><\/strong><strong><em>_<\/em>  מספר ילדים משוער: <\/strong>__  גילאים: ____<\/li>\n<\/ul>\n<p><strong>1. מה המוסד מאשר<\/strong> (מסמנים אחד או יותר)<\/p>\n<p>☐ <strong>לא לצלם בכלל.<\/strong><\/p>\n<p>☐ <strong>תיעוד פנימי בלבד<\/strong> לשיפור המופע, בלי פרסום. יימחק תוך [30] יום.<\/p>\n<p>☐ <strong>פרסום של קים ו״אווירה״ בלבד:<\/strong> צילום מאחורי הילדים, מרחוק, או ידיים ורגליים, <strong>בלי פנים מזוהות<\/strong>.<\/p>\n<p>☐ <strong>פרסום של ילדים מזוהים<\/strong>, רק כאלה שיש להם אישור הורים בכתב לפרסום בערוצים של ״קים משחקים״ (ראו סעיף 2).<\/p>\n<p>☐ <strong>שליחת החומר למוסד<\/strong> לשימוש המוסד, לפי הנהלים של המוסד.<\/p>\n<p>☐ <strong>ציון שם המוסד<\/strong> בפרסום. (ברירת המחדל: <strong>לא<\/strong> מציינים)<\/p>\n<p>☐ המוסד מבקש <strong>לראות את הסרטון לפני הפרסום<\/strong>.<\/p>\n<p><strong>2. אישורי הורים<\/strong> (מסמנים אחד)<\/p>\n<p>☐ למוסד יש אישורי הורים חתומים, <strong>שמכסים במפורש<\/strong> פרסום בערוצים של ״קים משחקים״.<\/p>\n<p>☐ המוסד יעביר להורים את טופס האישור של ״קים משחקים״ (נייר או קישור), ויעדכן את קים מי אישר/ה.<\/p>\n<p>☐ אין אישורי הורים. <strong>ילדים לא מצולמים באופן מזוהה.<\/strong><\/p>\n<p><strong>3. ביום עצמו<\/strong><\/p>\n<ul>\n<li>איש/אשת הצוות יגיד/תגיד לקים, בתחילת המופע, אילו ילדים <strong>לא מצטלמים<\/strong>. בעל פה או ברשימה קצרה שקים מחזירה בסוף ולא שומרת.<\/li>\n<li>איש/אשת צוות נמצא/ת בחדר לאורך כל המופע.<\/li>\n<li>הצוות מבקש מהורים שמגיעים (אם יש): ״מצלמים רק את הילד שלכם, ולא מעלים לרשת ילדים אחרים.״<\/li>\n<\/ul>\n<p><strong>4. מה קים מתחייבת<\/strong><\/p>\n<ol>\n<li>לא מפרסמת שמות ילדים, שם המוסד (אלא אם סומן), כתובת או תיוג מיקום.<\/li>\n<li>מפרסמת רק אחרי האירוע.<\/li>\n<li>לא מצלמת מחוץ למופע (חצר, שירותים, חדרי צוות), ולא מצלמת שלטים, מסמכים או לוחות עם שמות.<\/li>\n<li>לא מפרסמת רגע מביך או פוגע, ולא מצלמת ילד/ה שלא רוצה.<\/li>\n<li>שומרת את הקבצים בתיקייה פרטית ומאובטחת, לא שולחת לקבוצות, ומוחקת חומר גולמי שלא בשימוש תוך [30] יום.<\/li>\n<li>מסירה תוכן תוך [7] ימים מבקשה של המוסד או של הורה.<\/li>\n<\/ol>\n<p><strong>5.<\/strong> אם יש סתירה בין המסמך הזה לבין נוהלי המוסד, הרשות או משרד החינוך, <strong>הנהלים של המוסד גוברים<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>שם<\/th>\n<th>תפקיד<\/th>\n<th>חתימה<\/th>\n<th>תאריך<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>מטעם המוסד<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>״קים משחקים״<\/td>\n<td>קים נידם<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>נוסח ד׳ — הודעה למארח/ת: הורים שמצלמים<\/h2>\n<p><strong>להעתקה, למארח/ת, יומיים לפני (וואטסאפ):<\/strong><\/p>\n<blockquote>\n<p>היי [שם], עוד יומיים חוגגים! 🟡 בקשה קטנה: אפשר לשלוח להורים המוזמנים את הקישור לאישור הצילום? [קישור]. מי שלא ממלא/ת, הילד/ה משחק/ת בדיוק כמו כולם, אני פשוט לא מצלמת אותו/ה.<\/p>\n<p>ועוד דבר: בתחילת המופע אשמח שתגיד/י להורים משפט אחד: <strong>״מצלמים רק את הילד שלכם, ולא מעלים לרשת ילדים אחרים.״<\/strong> זה בא יותר טוב ממך מאשר ממני 😊<\/p>\n<\/blockquote>\n<p><strong>המשפט שהמארח/ת אומר/ת בתחילת המופע<\/strong> (כמו ב<a href=\"02-show-script.md\">תסריט המופע<\/a>):<\/p>\n<blockquote>\n<p>״לפני שמתחילים: מצלמים רק את הילד שלכם, ולא מעלים לרשת ילדים אחרים. תודה!״<\/p>\n<\/blockquote>\n<hr />\n<h2>נוסח ה׳ — אישור לציטוט המלצה<\/h2>\n<p><strong>למה:<\/strong> ב<a href=\"04-launch-checklist.md\">תוכנית ההשקה<\/a> את אוספת 3 משפטי המלצה. גם ציטוט הוא שימוש בשם של אדם, ולכן מבקשים אישור, וההורה בוחר/ת איך הוא/היא מופיע/ה.<\/p>\n<p><strong>להעתקה (וואטסאפ או מייל):<\/strong><\/p>\n<blockquote>\n<p>היי [שם], תודה על המילים המרגשות! 🟡 אפשר לצטט אותן בערוצים של ״קים משחקים״? הנה הנוסח שהייתי רוצה לפרסם:<\/p>\n<p>״[הציטוט]״<\/p>\n<p>איך תרצי/ה שזה יופיע? (לבחור אחד)\n1. שם פרטי + ״אמא/אבא לילד/ה בן/בת [גיל]״\n2. רק ״אמא/אבא לילד/ה בן/בת [גיל]״, בלי שם\n3. [לגננת:] ״גננת, [עיר]״<\/p>\n<p>ואיפה מותר? (אפשר כמה): רשתות · עמוד הנחיתה · הצעות מחיר למוסדות<\/p>\n<p>אפשר לבקש להסיר בכל עת, ואני מורידה תוך [7] ימים. תודה! קים<\/p>\n<\/blockquote>\n<p><strong>כללים:<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא<\/strong> כותבים את שם הילד/ה, שם הגן או שם משפחה בציטוט<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא<\/strong> משנים את הציטוט בלי אישור. קיצור: שולחים את הגרסה המקוצרת לאישור<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> שומרים צילום מסך של האישור בתיקייה <code>06<\/code><\/li>\n<\/ul>\n<hr />\n<h2>נוסח ו׳ — אישור מבוגר/ת שמופיע/ה בצילום<\/h2>\n<p><strong>למה:<\/strong> גם מבוגרים מזוהים (גננת, איש/אשת צוות, הורה, חבר/ה שמשתתף/ת בסרטון) מופיעים בערוצים <strong>עסקיים<\/strong>, ולכן מבקשים גם מהם אישור. זה קצר, ואפשר בוואטסאפ.<\/p>\n<p><strong>להעתקה (וואטסאפ או מייל):<\/strong><\/p>\n<blockquote>\n<p>היי [שם], תודה שהשתתפת! 🟡 אפשר לפרסם את [הסרטון/התמונה] שבו/ה את/ה מופיע/ה בערוצים של ״קים משחקים״? (אינסטגרם, טיקטוק, יוטיוב, פייסבוק, עמוד הנחיתה)<\/p>\n<p><strong>1. איפה מותר?<\/strong> א. רק בפרסום רגיל · ב. גם במודעות בתשלום · ג. גם בחומרים למוסדות<\/p>\n<p><strong>2. איך תופיע/י?<\/strong> א. בלי שם · ב. שם פרטי · ג. שם מלא ותפקיד<\/p>\n<p>לא אתייג אותך ולא את מקום העבודה שלך, אלא אם תבקש/י. אפשר לבקש להסיר בכל עת, ואני מורידה תוך [7] ימים.<\/p>\n<p>מספיק לענות, למשל: ״מאשר/ת, 1א, 2ב״. ואם לא מתאים לך, גם זה בסדר גמור, פשוט לא אפרסם. תודה! קים<\/p>\n<\/blockquote>\n<p><strong>כללים:<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>גננת או איש/אשת צוות:<\/strong> מאשרים <strong>גם<\/strong> מול המוסד שמותר לפרסם (נוסח ג׳). אישור אישי לא מחליף את אישור המוסד<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>חבר/ה שמצלם/ת בשבילך:<\/strong> לסכם בכתב שהקבצים נשארים <strong>אצלך<\/strong>, לא אצלו/ה, ושהוא/היא לא מפרסם/ת אותם בעצמו/ה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> שומרים צילום מסך של האישור בתיקייה <code>06<\/code><\/li>\n<\/ul>\n<hr />\n<h2>הכללים הפנימיים שלך<\/h2>\n<h3>לפני האירוע<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> נשלח הנוסח המתאים (טבלה בראש הקובץ), ונשלחה תזכורת שבוע לפני<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> את יודעת: כמה ילדים אושרו, ולאיזה שימוש<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>החלטת מראש<\/strong> מה מצלמים: אם לא כולם אושרו, רק מאחור, מרחוק או רק את עצמך<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>תיוג מיקום אוטומטי במצלמה: כבוי<\/strong> (בהגדרות המצלמה בטלפון)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> אם מישהו מצלם בשבילך: הוא/היא קרא/ה את הכללים האלה, ומצלם/ת <strong>בטלפון שלך<\/strong><\/li>\n<\/ul>\n<h3>בזמן האירוע<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>קודם המשחק, אחר כך הצילום.<\/strong> לא עוצרים משחק בשביל שוט<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> צילומים רחבים, מאחורי הילדים. <strong>לא<\/strong> קלוז־אפ של פני ילדים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ילד/ה שמסמן/ת ״לא״: מורידים את המצלמה מיד<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> לא מצלמים בשירותים, בהחלפת בגדים, בבכי או אחרי נפילה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> לא מצלמים שלטים, לוחות שמות או מדבקות שם על תיקים וחולצות<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אף פעם לא מסמנים מול הילדים מי ״אין לו אישור״.<\/strong> לא מדבקות, לא צמידים צבעוניים, לא ״אתה לא יכול להיות בתמונה״. הרשימה נמצאת רק אצלך<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>תמונה קבוצתית בסוף:<\/strong> רק אם <strong>לכל<\/strong> הילדים בפריים יש אישור לאותו שימוש. אחרת מצלמים אותך לבד, או מאחורי הילדים. ילד/ה בלי אישור שרוצה ״להיות בתמונה״: מקבל/ת תפקיד, למשל <strong>״עוזר/ת הצלם/ת״<\/strong> שמחזיק/ה את הקובייה ליד המצלמה, בלי הסבר ובלי להבליט<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>הסכמה של הילד/ה עצמו/ה:<\/strong> לפני רגע מצולם, אפשר להגיד בתוך הדמות: ״עכשיו אני מצלמת רגע כדי לזכור כמה הייתם מדהימים! מי שלא רוצה להיות בצילום, עובר/ת לצד של [שם המבוגר/ת], וזה לגמרי בסדר.״ ומי שעבר/ה, לא מצולם/ת<\/li>\n<\/ul>\n<h3>אחרי האירוע (באותו ערב)<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> להעביר את כל הקבצים לתיקייה <code>06<\/code>, ולמחוק מהגלריה בטלפון. לבדוק שלא נשמרו בגיבוי אוטומטי (Google Photos, וואטסאפ)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>טפסי נייר:<\/strong> לסרוק או לצלם לתיקייה <code>06<\/code> באותו ערב. את המקור שומרים במעטפה סגורה, בבית, לא בתיק ההופעה. כמה זמן לשמור את המקור: <strong>לבדוק<\/strong> עם עו״ד<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>סינון:<\/strong> כל קובץ עם ילד/ה <strong>בלי<\/strong> אישור לשימוש המתוכנן: נמחק, או נערך כך שהילד/ה לא מזוהה (טשטוש, חיתוך)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>עריכה:<\/strong> טשטוש פנים כשצריך, הסרה של שמות על בגדים ותיקים, שלטים ומספרי רכב<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>פרסום רק אחרי האירוע.<\/strong> עדיף למחרת<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>כיתוב:<\/strong> בלי שמות, בלי מקום, בלי תיוג של המוסד או של הורים (אלא אם אושר)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>ביוטיוב:<\/strong> סימון ״מיועד לילדים״ לפי הכללים (<a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a>, פרק 7.6)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>תוך 30 יום:<\/strong> מחיקת חומר גולמי שלא נכנס לשימוש<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> לעדכן את <strong>יומן האישורים<\/strong> (למטה) ואת עמודת ״אישורי צילום״ ב<a href=\"12-booking-process.md\">גיליון הלקוחות<\/a><\/li>\n<\/ul>\n<h3>תגובות והודעות ברשתות<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> תגובה שמזכירה שם, גן או מקום של ילד/ה: <strong>מוחקים<\/strong>, ואפשר לשלוח להורה הודעה עדינה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מתכתבים עם ילדים<\/strong> בהודעות פרטיות. עונים רק להורים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> תגובה או הודעה לא הולמת שקשורה לילדים: <strong>מצלמים מסך<\/strong> (לתיעוד), ואז מוחקים, חוסמים ומדווחים לפלטפורמה. אם יש חשש לפגיעה בילד/ה: המוקד הלאומי להגנה על ילדים ברשת, <strong>105<\/strong> (<strong>לבדוק<\/strong> מראש את דרכי הפנייה), ובמקרה דחוף משטרה <strong>100<\/strong><\/li>\n<\/ul>\n<h3>כשהורה מבקש/ת להסיר<\/h3>\n<ol>\n<li><strong>עונים באותו יום:<\/strong> ״בטח, אני מטפלת בזה.״ בלי שאלות ובלי לנסות לשכנע.<\/li>\n<li><strong>מסירים<\/strong> את התוכן מכל הערוצים (כולל סטוריז שמורים, היילייטס והעמוד) <strong>תוך 7 ימים<\/strong> לכל המאוחר. עדיף מיד.<\/li>\n<li><strong>מעדכנים<\/strong> את יומן האישורים: ״בוטל בתאריך...״, ומוחקים את הקבצים של הילד/ה מהתיקייה, אם אין בהם צורך אחר שאושר.<\/li>\n<li><strong>מאשרים להורה:<\/strong> ״הורדתי מ[איפה]. אם תראה/י את זה במקום אחר, תגיד/י לי.״<\/li>\n<\/ol>\n<p><strong>להעתקה:<\/strong><\/p>\n<blockquote>\n<p>היי [שם], הורדתי את [הסרטון/התמונה] מ[אינסטגרם/טיקטוק/יוטיוב/העמוד]. מחקתי גם את הקבצים אצלי. אם תראה/י את זה במקום אחר, תכתוב/תכתבי לי ואטפל. תודה שאמרת/ה 🟡<\/p>\n<\/blockquote>\n<h3>אם משהו השתבש<\/h3>\n<p>פורסם ילד/ה בלי אישור, נשלח קובץ לאדם הלא נכון, או שתוכן הגיע למקום שלא היה אמור:<\/p>\n<ol>\n<li><strong>מורידים מיד<\/strong> מכל מקום שבשליטתך.<\/li>\n<li><strong>מספרים להורה בכנות<\/strong>, מתנצלים, ואומרים מה עשית.<\/li>\n<li><strong>כותבים<\/strong> מה קרה ומתי (לתיקייה <code>06<\/code>).<\/li>\n<li>אם יש תלונה, דרישה או משהו שלא ברור: <strong>מתייעצים עם עו״ד<\/strong> (<a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a>, פרק 12).<\/li>\n<li><strong>לומדים:<\/strong> מה בכללים האלה לא עבד, ומעדכנים אותם.<\/li>\n<\/ol>\n<hr />\n<h2>יומן אישורים (להעתיק ל־Google Sheets)<\/h2>\n<table>\n<thead>\n<tr>\n<th>תאריך אירוע<\/th>\n<th>מארח/ת / מוסד<\/th>\n<th>נוסח (א׳/ב׳/ג׳)<\/th>\n<th>כמה ילדים / כמה אישרו<\/th>\n<th>שימושים שאושרו<\/th>\n<th>איפה שמור<\/th>\n<th>מחיקת גולמי עד<\/th>\n<th>פורסם (איפה, מתי)<\/th>\n<th>בקשות הסרה (תאריך, טופל)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><code>06/...<\/code><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>קבצים קשורים<\/h2>\n<p><a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a> (פרק 7: פרטיות ופלטפורמות) · <a href=\"09-filming-guide.md\">מדריך הצילום<\/a> · <a href=\"02-show-script.md\">תסריט המופע<\/a> · <a href=\"03-video-scripts.md\">תסריטי הווידאו<\/a> · <a href=\"12-booking-process.md\">תהליך ההזמנה<\/a> · <a href=\"06-show-offer.md\">הצעת המופע<\/a> · <a href=\"14-character-bible.md\">תנ״ך הדמות<\/a> · <a href=\"04-launch-checklist.md\">תוכנית ההשקה<\/a> · <a href=\"05-pilot-feedback.md\">טופס המשוב לפיילוט<\/a><\/p>"}, "docs/09-filming-guide.md": {"title": "מדריך צילום, עריכה ופרסום — רק עם טלפון", "html": "<h1>מדריך צילום, עריכה ופרסום — רק עם טלפון<\/h1>\n<blockquote>\n<p><strong>בשביל מה הקובץ הזה:<\/strong> כאן מוסבר איך את מצלמת לבד, בטלפון, סרטונים שנראים טוב, ואיך עורכת, מפרסמת ומודדת אותם. מה לצלם כתוב ב<a href=\"03-video-scripts.md\">תסריטי הסרטונים<\/a>.\n<strong>העיקרון:<\/strong> לא קונים ציוד יקר לפני שיודעים מה עובד. טלפון, חצובה, חלון ואנרגיה של קים זה כל מה שצריך בחודש הראשון. זה תואם את סדר ההשקעות ב<a href=\"01-concept.md\">קונספט<\/a>.<\/p>\n<\/blockquote>\n<p><strong>סימונים בקובץ:<\/strong><\/p>\n<ul>\n<li><strong>״לבדוק״<\/strong>: מידע שלא אומת עד הסוף, או שמשתנה לעיתים קרובות. לוודא לפני שמסתמכים עליו.<\/li>\n<li><strong>״הערכה״<\/strong>: מחיר משוער ולא הצעת מחיר. לבדוק בחנות לפני קנייה.<\/li>\n<li>המקורות נבדקו באוקטובר 2026 ומרוכזים בסוף הקובץ.<\/li>\n<\/ul>\n<h2>תוכן העניינים<\/h2>\n<ol>\n<li>ציוד: מה צריך באמת<\/li>\n<li>הגדרות טלפון: פעם אחת<\/li>\n<li>מקום, רקע ואור<\/li>\n<li>סאונד<\/li>\n<li>מסגור אנכי 9:16<\/li>\n<li>איך מצלמים לבד<\/li>\n<li>יום צילום מרוכז: 6 סרטונים ב־2 שעות<\/li>\n<li>צילום במופע או בפיילוט (כשיש ילדים בחדר)<\/li>\n<li>עריכה: תהליך ב־10 צעדים באפליקציות חינמיות<\/li>\n<li>כתוביות בעברית<\/li>\n<li>ניהול קבצים וגיבוי<\/li>\n<li>כללי הפלטפורמות לגבי ילדים: חובה לקרוא<\/li>\n<li>מה עובד בכל פלטפורמה<\/li>\n<li>צ׳קליסט פרסום<\/li>\n<li>גיליון מדדים<\/li>\n<li>אחרי 4 שבועות: במה להשקיע<\/li>\n<li>מקורות<\/li>\n<\/ol>\n<hr />\n<h2>1. ציוד — מה צריך באמת<\/h2>\n<table>\n<thead>\n<tr>\n<th>פריט<\/th>\n<th>חובה?<\/th>\n<th>למה<\/th>\n<th>הערכת עלות<\/th>\n<th>הערות<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>הטלפון שלך<\/strong><\/td>\n<td>חובה<\/td>\n<td>המצלמה, המיקרופון וחדר העריכה<\/td>\n<td>0 ₪ (קיים)<\/td>\n<td>לפנות מקום אחסון לפני כל יום צילום (ראי פרק 7)<\/td>\n<\/tr>\n<tr>\n<td><strong>חצובה עם מחזיק לטלפון ושלט בלוטוס<\/strong><\/td>\n<td><strong>חובה<\/strong><\/td>\n<td>בלי זה אי אפשר לצלם לבד כל הגוף. השלט מתחיל ועוצר הקלטה מרחוק<\/td>\n<td><strong>הערכה:<\/strong> עשרות שקלים עד כ־200 ₪. <strong>לבדוק<\/strong><\/td>\n<td>חשוב שתגיע לגובה החזה או יותר. יש בחנויות בארץ דגמים של מוט סלפי וחצובה עם שלט, למשל <a href=\"https://www.bug.co.il/brand/xiaomi/selfie/stick/tripod/mini/52cm/remote\">Xiaomi Selfie Stick Tripod ב־Bug<\/a> או <a href=\"https://www.bug.co.il/brand/gekkopod/color/black/gekkostick/\">GekkoStick ב־Bug<\/a> (לא מצאתי מחיר מאומת, <strong>לבדוק<\/strong>). מוט סלפי קצר מדי לא יתאים לצילום רחב של כל הגוף, אז לבדוק גובה מקסימלי<\/td>\n<\/tr>\n<tr>\n<td><strong>אור<\/strong><\/td>\n<td>—<\/td>\n<td>חלון גדול<\/td>\n<td>0 ₪<\/td>\n<td>ראי פרק 3. <strong>לא<\/strong> קונים טבעת אור בשלב הזה<\/td>\n<\/tr>\n<tr>\n<td><strong>מיקרופון דש אלחוטי<\/strong><\/td>\n<td>רשות (מומלץ אחרי שבועיים, אם הסאונד חלש)<\/td>\n<td>כשהטלפון רחוק ממך 2–3 מטר (צילום רחב), הקול נשמע רחוק ומהדהד. מיקרופון על הבגד פותר את זה<\/td>\n<td><strong>הערכה:<\/strong> כ־150–400 ₪ לערכה בסיסית. <strong>לבדוק<\/strong><\/td>\n<td>לדוגמה, <a href=\"https://www.bug.co.il/brand/hohem/mic/01/kit/1\">Hohem MIC-01 KIT 1 ב־Bug<\/a> הוצג ב־229 ₪ בזמן הבדיקה (אוקטובר 2026, <strong>לבדוק מחיר עדכני<\/strong>). דגמים של מותגים מוכרים יותר עולים יותר. <strong>לפני קנייה:<\/strong> לבדוק שהמחבר מתאים לטלפון (USB-C או Lightning)<\/td>\n<\/tr>\n<tr>\n<td>~~מיקרופון דש עם חוט~~<\/td>\n<td><strong>לא<\/strong><\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>בסרטונים עם קפיצות וסיבובים, חוט ארוך מסוכן להיתקלות. לא מתאים<\/td>\n<\/tr>\n<tr>\n<td><strong>מטען נייד<\/strong><\/td>\n<td>מומלץ<\/td>\n<td>שהטלפון לא ימות באמצע יום צילום<\/td>\n<td>כנראה כבר יש לך<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>נייר דבק צבעוני<\/strong><\/td>\n<td>מומלץ<\/td>\n<td>מסמנים ברצפה את ״הנקודה שלך״ ואת גבולות הפריים<\/td>\n<td>שקלים בודדים (הערכה)<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>רקע<\/strong><\/td>\n<td>—<\/td>\n<td>קיר בהיר ונקי, או סדין או בד חלק<\/td>\n<td>0–50 ₪ (הערכה)<\/td>\n<td>ראי פרק 3<\/td>\n<\/tr>\n<tr>\n<td><strong>אביזרים<\/strong><\/td>\n<td>לפי סרטון<\/td>\n<td>קובייה רכה, צעיפים, כדורים רכים<\/td>\n<td>0 ₪ נוסף<\/td>\n<td>מאותו ארגז של <a href=\"02-show-script.md\">ציוד המופע<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>סדר קנייה מומלץ<\/h3>\n<ol>\n<li><strong>עכשיו:<\/strong> חצובה עם שלט. זו הקנייה היחידה שבאמת נדרשת.<\/li>\n<li><strong>אחרי שבועיים של פרסום:<\/strong> אם בבדיקה עם אוזניות הקול שלך בצילומים הרחבים נשמע רחוק או מהדהד, קונים מיקרופון דש אלחוטי.<\/li>\n<li><strong>לא בחודש הראשון:<\/strong> טבעת אור, גימבל, מצלמה, מנוי בתשלום לאפליקציית עריכה, השכרת סטודיו. כל אלה עולים לדיון רק אחרי <a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a>, עם נתונים ביד.<\/li>\n<\/ol>\n<hr />\n<h2>2. הגדרות טלפון — פעם אחת<\/h2>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>ניקוי עדשה<\/strong> בבגד רך. זה הטיפ הכי זול, והוא משפר כל צילום<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>רזולוציה:<\/strong> 1080p (Full HD) מספיקה. <strong>אם יש מקום אחסון<\/strong>, אפשר 4K: זה מאפשר ״זום״ בעריכה (למשל לקלוז־אפ בשוט 2 של סרטון ההיכרות) בלי לאבד איכות, אבל הקבצים כבדים פי כמה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>קצב פריימים:<\/strong> 30 לסרטונים רגילים. <strong>60<\/strong> לסרטונים שתרצי בהם הילוך איטי חלק של קפיצות (צריך הרבה אור)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>רשת (Grid):<\/strong> להפעיל בהגדרות המצלמה. עוזרת לשמור על קו אופק ישר ועל קים במרכז<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>נעילת פוקוס וחשיפה:<\/strong> לפני הטייק, לחיצה ארוכה על המקום שבו תעמדי (באייפון ״AE/AF Lock״; באנדרואיד השם משתנה בין מכשירים, <strong>לבדוק במכשיר שלך<\/strong>). כך התמונה לא ״מחשיכה ומבהירה״ כשאת זזה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מיקום בתמונות כבוי:<\/strong> לכבות את שמירת המיקום של המצלמה. כך קבצים שאת שולחת לא מסגירים איפה צולמו<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מצב ״נא לא להפריע״ או מצב טיסה<\/strong> בזמן הצילום. שיחה נכנסת עוצרת הקלטה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>HDR:<\/strong> אם אחרי ההעלאה הצבעים נראים ״שרופים״ או בהירים מדי, לנסות לכבות את הקלטת ה־HDR בהגדרות הווידאו ולהשוות (<strong>לבדוק במכשיר שלך<\/strong>)<\/li>\n<\/ul>\n<hr />\n<h2>3. מקום, רקע ואור<\/h2>\n<h3>המקום<\/h3>\n<ul>\n<li><strong>מקום פנוי של כ־2×2 מטר לפחות<\/strong> לקפיצות וסיבובים, בלי פינות של רהיטים קרובות.<\/li>\n<li><strong>רצפה לא חלקה<\/strong> (שטיח דק או מחצלת שלא זזה), ולצלם בנעלי ספורט, כמו בתלבושת.<\/li>\n<li><strong>הבית שלך לא בפריים:<\/strong> בלי תמונות משפחתיות, מספר בית, נוף מהחלון שמזהה את הרחוב, או מכתבים עם כתובת. זה בשביל הביטחון שלך.<\/li>\n<li><strong>צילום בחוץ (פארק, גינה):<\/strong> רק כשריק מאנשים. <strong>אין לצלם ילדים זרים<\/strong>, גם לא ברקע. אם ילד נכנס לפריים, הטייק נמחק.<\/li>\n<\/ul>\n<h3>הרקע<\/h3>\n<ul>\n<li><strong>קיר בהיר ונקי<\/strong> (לבן, שמנת, תכלת בהיר) עובד הכי טוב.<\/li>\n<li><strong>לא רקע צהוב או כתום:<\/strong> התלבושת של קים צהובה, כתומה ולבנה (<a href=\"15-costume-and-logo.md\">מפרט התלבושת<\/a>), ועל רקע באותם צבעים היא ״נבלעת״. התלבושת צריכה לבלוט מהרקע.<\/li>\n<li><strong>נגיעה של מותג<\/strong> (לא חובה): אביזר צהוב אחד בפינה, כדור או קובייה. תמיד באותו מקום, כדי שהסרטונים ייראו ״אותו עולם״.<\/li>\n<li><strong>אותו רקע בכל הסרטונים<\/strong> בחודש הראשון. זה בונה זיהוי.<\/li>\n<\/ul>\n<h3>האור<\/h3>\n<p><strong>הכלל:<\/strong> החלון מאחורי הטלפון, ופני קים מול החלון.<\/p>\n<table>\n<thead>\n<tr>\n<th>מצב<\/th>\n<th>מה קורה<\/th>\n<th>מה עושים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>חלון <strong>מאחורייך<\/strong><\/td>\n<td>את נראית כמו צללית<\/td>\n<td>להסתובב: החלון מול הפנים, מאחורי הטלפון<\/td>\n<\/tr>\n<tr>\n<td>חלון <strong>מהצד<\/strong><\/td>\n<td>חצי פנים בצל<\/td>\n<td>אפשר, אבל להשתמש בסדין לבן או קרטון לבן בצד השני כ״מחזיר אור״<\/td>\n<\/tr>\n<tr>\n<td><strong>שמש ישירה<\/strong> בחוץ בצהריים<\/td>\n<td>צללים חזקים, עיניים מצומצמות<\/td>\n<td>לצלם <strong>בצל פתוח<\/strong> (צל של בניין או עץ, עם שמיים מעל), או בשעות הבוקר ואחר הצהריים המאוחרות<\/td>\n<\/tr>\n<tr>\n<td><strong>יום מעונן<\/strong><\/td>\n<td>אור רך ואחיד<\/td>\n<td>מעולה, לנצל<\/td>\n<\/tr>\n<tr>\n<td><strong>ערב ונורות בבית<\/strong><\/td>\n<td>צבעים צהבהבים, תמונה ״רועשת״<\/td>\n<td>לצלם ביום. לא לערבב אור חלון עם נורה צהובה<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>בדיקת 5 שניות:<\/strong> תסתכלי על העיניים שלך בצילום הבדיקה. אם רואים בהן נקודת אור קטנה (השתקפות החלון), האור טוב.<\/p>\n<hr />\n<h2>4. סאונד<\/h2>\n<p>הסאונד חשוב יותר מהתמונה. צופים יסלחו על תמונה בינונית, אבל לא על קול שלא שומעים.<\/p>\n<table>\n<thead>\n<tr>\n<th>בעיה<\/th>\n<th>למה זה קורה<\/th>\n<th>פתרון<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>הד<\/strong> (״קול של אמבטיה״)<\/td>\n<td>בבתים בארץ הרבה רצפות אריחים וקירות חשופים<\/td>\n<td>לצלם בחדר עם שטיח, וילונות, ספה או מיטה. אפשר לפרוס שמיכה על הרצפה מחוץ לפריים<\/td>\n<\/tr>\n<tr>\n<td><strong>רעש רקע<\/strong><\/td>\n<td>מזגן, מאוורר, מקרר, כביש<\/td>\n<td><strong>לכבות מזגן ומאוורר בזמן הטייק<\/strong> (ולהדליק בהפסקות). לסגור חלון לרחוב<\/td>\n<\/tr>\n<tr>\n<td><strong>קול רחוק<\/strong> בצילום רחב<\/td>\n<td>הטלפון במרחק 2–3 מטר<\/td>\n<td>לדבר בקול ״במה״: חזק, ברור ולאט יותר. אם זה לא מספיק, מיקרופון דש אלחוטי (פרק 1)<\/td>\n<\/tr>\n<tr>\n<td><strong>מוזיקה מתנגשת<\/strong><\/td>\n<td>מוזיקה מרמקול בזמן הצילום<\/td>\n<td><strong>לא משמיעים מוזיקה בזמן הצילום.<\/strong> מוסיפים בעריכה מתוך ספריית האפליקציה (ראי ״מוזיקה״ בפרק 9)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>בדיקה:<\/strong> בכל יום צילום, הטייק הראשון נבדק <strong>עם אוזניות<\/strong>, ורק אחרי זה ממשיכים.<\/p>\n<hr />\n<h2>5. מסגור אנכי 9:16<\/h2>\n<h3>שלושה גדלי שוט<\/h3>\n<table>\n<thead>\n<tr>\n<th>שוט<\/th>\n<th>מה רואים<\/th>\n<th>מתי משתמשים<\/th>\n<th>הנחת הטלפון (בערך)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>רחב<\/strong><\/td>\n<td>כל הגוף, מהנעליים ועד מעל הראש, עם מקום לקפיצה<\/td>\n<td>קפיצות, ריקוד, חיות, ״הפסל״, אתגרים<\/td>\n<td>2–3 מטר ממך, בגובה המותניים או החזה<\/td>\n<\/tr>\n<tr>\n<td><strong>מדיום<\/strong><\/td>\n<td>מהמותניים ומעלה<\/td>\n<td>הוקים, הסברים, ״עכשיו אתם!״, הסיום הקבוע<\/td>\n<td>כ־1–1.5 מטר, בגובה העיניים או מעט מתחת<\/td>\n<\/tr>\n<tr>\n<td><strong>קרוב<\/strong><\/td>\n<td>פנים וכתפיים<\/td>\n<td>תגובות (הפתעה, חשד, צחוק)<\/td>\n<td>עדיף לא להזיז את החצובה: בצילום ב־4K עושים ״זום״ בעריכה<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>טיפ מקצועי:<\/strong> בגובה מעט נמוך מהעיניים, הטלפון ״רואה״ אותך קצת מלמטה, כמו שילד רואה מבוגר שמשחק איתו. כך את נראית אנרגטית ו״גדולה מהחיים״. לא נמוך מדי.<\/p>\n<h3>בדיקת קפיצה<\/h3>\n<p>לפני כל סרטון רחב: <strong>תקפצי הכי גבוה שאת קופצת בסרטון ובדקי שהראש לא נחתך.<\/strong> אם נחתך, מרחיקים את החצובה או מורידים אותה.<\/p>\n<h3>אזורים בטוחים: איפה לא לשים טקסט ופנים<\/h3>\n<p>בכל אפליקציה, הממשק (שם משתמש, כפתורי לייק ושיתוף, הכיתוב) מכסה חלק מהמסך. <strong>המספרים שונים בין המקורות ומשתנים מעת לעת<\/strong>, ולכן אלה הנחיות כלליות:<\/p>\n<table>\n<thead>\n<tr>\n<th>אזור במסך<\/th>\n<th>מה מכוסה<\/th>\n<th>מה לשים שם<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>רצועה עליונה<\/strong> (בערך 13–14% העליונים)<\/td>\n<td>שם משתמש, ״Reels״, אודיו<\/td>\n<td>שום דבר חשוב<\/td>\n<\/tr>\n<tr>\n<td><strong>רצועה תחתונה<\/strong> (בערך 20–35% התחתונים)<\/td>\n<td>הכיתוב, שם השיר, כפתורים<\/td>\n<td><strong>לא טקסט חשוב ולא כתוביות.<\/strong> הרגליים יכולות להיות שם<\/td>\n<\/tr>\n<tr>\n<td><strong>צד ימין, חצי תחתון<\/strong><\/td>\n<td>עמודת הלייק, התגובה והשיתוף<\/td>\n<td>לא טקסט<\/td>\n<\/tr>\n<tr>\n<td><strong>המרכז<\/strong><\/td>\n<td>פנוי<\/td>\n<td><strong>הפנים של קים, הטקסט על המסך והכתוביות<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>(מקור: <a href=\"https://www.hopperhq.com/blog/instagram-reel-size/\">Hopper HQ — Instagram Reel Size<\/a>, שמבוסס על אחוזים ש־Meta מפרסמת; מקורות אחרים נותנים מספרים מעט שונים. <strong>לבדוק<\/strong> בתצוגה המקדימה של האפליקציה לפני פרסום.)<\/p>\n<p><strong>תצוגה ברשת הפרופיל:<\/strong> באינסטגרם, הרשת בפרופיל מציגה את הסרטון חתוך (לפי Hopper HQ ביחס 3:4, <strong>לבדוק<\/strong>). לכן הכותרת בתמונת השער צריכה להיות <strong>באמצע הגובה<\/strong>.<\/p>\n<hr />\n<h2>6. איך מצלמים לבד — שיטת העבודה<\/h2>\n<ol>\n<li><strong>מסמנים נקודה:<\/strong> נייר דבק ברצפה איפה שאת עומדת, ועוד 2 סימונים לגבולות הפריים מימין ומשמאל. ככה לא יוצאים מהפריים.<\/li>\n<li><strong>בוחרים מצלמה:<\/strong>\n   - <strong>מצלמה קדמית (סלפי):<\/strong> את רואה את עצמך, וזה נוח מאוד למתחילה. בטלפונים חדשים האיכות לרוב מספיקה.\n   - <strong>מצלמה אחורית:<\/strong> בדרך כלל איכות טובה יותר, אבל לא רואים את עצמך. עובדים עם הסימונים ברצפה ועם טייק בדיקה.\n   - <strong>ההמלצה:<\/strong> לצלם טייק בדיקה של 10 שניות בשתיהן ולהשוות בטלפון. אם ההבדל לא מורגש, להמשיך עם הקדמית.\n   - יש שעונים חכמים שמציגים תצוגה מקדימה של המצלמה. אם יש לך שעון כזה, <strong>לבדוק<\/strong> אם זה עובד אצלך.<\/li>\n<li><strong>מסתכלים לעדשה ולא למסך.<\/strong> במצלמה הקדמית העדשה נמצאת מעל המסך. כדאי להדביק מדבקה קטנה ליד העדשה כתזכורת.<\/li>\n<li><strong>כרטיס ביטים ליד המצלמה:<\/strong> דף מודפס בגופן גדול עם ההוק, 3–4 הביטים והסיום (מתוך <a href=\"03-video-scripts.md\">התסריטים<\/a>), מודבק ליד הטלפון או על החצובה.<\/li>\n<li><strong>מתחילים כל טייק בשם:<\/strong> ״הפסל, טייק 2״, ונושמים. כך קל למצוא את הטייק בעריכה, ואת החלק הזה חותכים.<\/li>\n<li><strong>מתחילים בתנועה:<\/strong> את ההוק מתחילים <strong>כבר בתנועה<\/strong> (נכנסת לפריים, קופצת), לא עומדת ומחכה. את השנייה שלפני חותכים בעריכה.<\/li>\n<li><strong>השלט ביד או בכיס:<\/strong> לוחצים ״הקלטה״, מכניסים לכיס או מניחים מחוץ לפריים, ומתחילים.<\/li>\n<li><strong>אנרגיה של 120%:<\/strong> מה שמרגיש מוגזם בחדר נראה ״בדיוק נכון״ במסך קטן. הבעות פנים גדולות יותר, קול חזק יותר וקצב מהיר יותר.<\/li>\n<li><strong>הכלל של 3 טייקים:<\/strong> מקסימום 3–4 טייקים מלאים לסרטון. אם זה לא עובד, עוברים הלאה וחוזרים לזה בסוף. שלמות היא אויב של ״3 בשבוע״.<\/li>\n<\/ol>\n<hr />\n<h2>7. יום צילום מרוכז — 6 סרטונים ב־2 שעות<\/h2>\n<p><strong>למה במרוכז:<\/strong> להתלבש, להתאפר, לסדר אור ולהתחמם לוקח זמן. כשעושים את זה פעם בשבועיים במקום כל יומיים, נשאר לך זמן למופעים ולעסק.<\/p>\n<h3>ערב לפני (45–60 דקות, לא כלול בשעתיים)<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> בחרתי 6 תסריטים (שבועיים של תוכן) מתוך <a href=\"03-video-scripts.md\">התסריטים<\/a><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> הדפסתי כרטיס ביטים לכל סרטון, בגופן גדול<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> קראתי כל תסריט בקול פעם אחת, ותרגלתי את המשחקים בגוף<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> טענתי טלפון, שלט, מיקרופון (אם יש) ומטען נייד<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> פיניתי מקום בטלפון. <strong>הערכה:<\/strong> 10–15GB לפחות לשעתיים צילום, ובצילום 4K יותר. <strong>לבדוק<\/strong> לפי המכשיר<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> התלבושת מוכנה (נקייה, מגוהצת, נעליים נקיות), עם גומיות וסרט לשיער גם ברזרבה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> האביזרים לסרטונים האלה בארגז אחד<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> המקום מפונה, וסימוני הרצפה במקום<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> הודעתי בבית שיהיה שקט בין [שעה] ל־[שעה]<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> בקבוק מים ונשנוש קטן<\/li>\n<\/ul>\n<h3>לוח הזמנים ביום הצילום<\/h3>\n<table>\n<thead>\n<tr>\n<th>זמן<\/th>\n<th>שלב<\/th>\n<th>מה עושים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0:00–0:10<\/td>\n<td><strong>הקמה<\/strong><\/td>\n<td>חצובה בגובה הנכון, מסגור רחב, נעילת פוקוס וחשיפה, בדיקת אור, מזגן ומאוורר כבויים<\/td>\n<\/tr>\n<tr>\n<td>0:10–0:15<\/td>\n<td><strong>טייק בדיקה<\/strong><\/td>\n<td>10 שניות: מדברת, קופצת ומסתובבת. צופה <strong>עם אוזניות<\/strong>: הראש לא נחתך? הקול ברור? האור על הפנים?<\/td>\n<\/tr>\n<tr>\n<td>0:15–0:25<\/td>\n<td><strong>חימום<\/strong><\/td>\n<td>חימום גוף (מפרקים, קפיצות קלות) וחימום קול. 3 פעמים ״עם קים... כולם משחקים!״ כדי להיכנס לדמות<\/td>\n<\/tr>\n<tr>\n<td>0:25–0:55<\/td>\n<td><strong>בלוק א׳: 3 סרטונים רחבים בלי אביזרים<\/strong><\/td>\n<td>כ־10 דקות לכל סרטון (ראי ״שגרת 10 הדקות״ למטה)<\/td>\n<\/tr>\n<tr>\n<td>0:55–1:00<\/td>\n<td><strong>הפסקה<\/strong><\/td>\n<td>מים, ובדיקה מהירה שהקבצים נשמרו<\/td>\n<\/tr>\n<tr>\n<td>1:00–1:30<\/td>\n<td><strong>בלוק ב׳: 3 סרטונים<\/strong><\/td>\n<td>קודם הסרטונים שבאותו מסגור, ואז מזיזים את החצובה למדיום, ואז סרטוני האביזרים<\/td>\n<\/tr>\n<tr>\n<td>1:30–1:45<\/td>\n<td><strong>״בנק״<\/strong><\/td>\n<td>3 גרסאות הוק לסרטונים הבאים, 4 סיומים קבועים באנרגיות שונות, תגובות (״וואו!״, ״אופס!״, צחוק, מבט חשדני), תנועת היד בקרוב, ו־5 שניות של אביזרים ותלבושת לסטוריז<\/td>\n<\/tr>\n<tr>\n<td>1:45–1:55<\/td>\n<td><strong>גיבוי<\/strong><\/td>\n<td>העברת הקבצים למחשב או לענן פרטי, ושינוי שמות (פרק 11)<\/td>\n<\/tr>\n<tr>\n<td>1:55–2:00<\/td>\n<td><strong>סגירה<\/strong><\/td>\n<td>סימון ״צולם״ ב<a href=\"03-video-scripts.md\">לוח התוכן<\/a>, ורשימה של מה צריך לצלם שוב<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>שגרת 10 הדקות — לכל סרטון<\/h3>\n<table>\n<thead>\n<tr>\n<th>דקות<\/th>\n<th>מה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>קוראת את כרטיס הביטים בקול<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>מוודאת שהמסגור מתאים לסרטון (רחב או מדיום)<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>2–3 טייקים מלאים, ואז ההוק לבד 3 פעמים, ואז הסיום לבד פעם או פעמיים<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>צופה בטייק הכי טוב (לא בכולם!) ומסמנת אותו כ״מועדף״ בגלריה<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>אל תמחקי טייקים כושלים מצחיקים.<\/strong> הם חומר הגלם של <a href=\"03-video-scripts.md\">סרטון 9, ״מאחורי הקלעים״<\/a>.<\/p>\n<h3>חלוקה לבלוקים בחודש הראשון<\/h3>\n<table>\n<thead>\n<tr>\n<th>יום צילום<\/th>\n<th>בלוק א׳ (רחב, בלי אביזרים)<\/th>\n<th>בלוק ב׳<\/th>\n<th>בנק<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>יום 1<\/strong> (לפני שבוע תוכן 1)<\/td>\n<td>1 הפסל · 2 הכף והרגל · 3 הרגל שלי<\/td>\n<td>6 חיות (רחב) · 4 קים אומרת (מדיום) · 5 הקובייה (אביזר)<\/td>\n<td>הוקים לסרטונים 7–12<\/td>\n<\/tr>\n<tr>\n<td><strong>יום 2<\/strong> (לפני שבוע תוכן 3)<\/td>\n<td>8 עשר שניות · 10 הרמזור · 11 הגרב (רחב ואביזר)<\/td>\n<td>7 המראה · 12 השלט (מדיום) · קטעי הדיבור של סרטון 9<\/td>\n<td>הוקים וסיומים לחודש 2, בלופרים<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>סרטון ההיכרות<\/strong> מצולם בנפרד, בשבוע הגיבוש, ואפשר באותו מפגש עם ניסיונות של סרטונים 1–3.<\/p>\n<\/blockquote>\n<hr />\n<h2>8. צילום במופע או בפיילוט (כשיש ילדים בחדר)<\/h2>\n<p>הכללים המלאים נמצאים ב<a href=\"08-consent-template.md\">נוסח אישור הצילום<\/a> וב<a href=\"13-legal-admin.md\">מסמך המשפטי והמנהלי<\/a>. כאן רק התרגום לצילום בפועל:<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לפני המופע:<\/strong> בידך רשימה של מי <strong>חתמו<\/strong> על אישור, ולאיזה שימוש (תיעוד פנימי / רשתות / שיווק)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מי מצלם:<\/strong> מלווה או חבר/ה, לא את (את מופיעה). הטלפון על חצובה בצד האחורי של החדר<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>זווית:<\/strong> קים מול המצלמה, וילדים <strong>בגב<\/strong> למצלמה או רחוקים. לא קלוז־אפ על פני ילדים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>ילד בלי אישור לא בפריים.<\/strong> אם נכנס, הקטע לא מתפרסם, או שמטשטשים אותו בעריכה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>שום דבר מזהה:<\/strong> שם הגן או המוסד, שלטים, סמלים על חולצות, שמות ילדים שנאמרים בקול<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מעלים בזמן אמת<\/strong> ולא מתייגים מיקום. מפרסמים בדיעבד<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>החומר נשאר אצלך:<\/strong> לא שולחים קבצים גולמיים לקבוצות וואטסאפ. מה שלא נכנס לשימוש נמחק לפי הכללים ב<a href=\"13-legal-admin.md\">מסמך המשפטי<\/a><\/li>\n<\/ul>\n<hr />\n<h2>9. עריכה — תהליך ב־10 צעדים באפליקציות חינמיות<\/h2>\n<h3>בחירת אפליקציה<\/h3>\n<table>\n<thead>\
