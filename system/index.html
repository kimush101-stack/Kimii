>ריל<\/td>\n<td>קים משתגעת<\/td>\n<td><\/td>\n<td><\/td>\n<td>☐<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>כל יום<\/td>\n<td>IG · וואטסאפ<\/td>\n<td>סטורי<\/td>\n<td>—<\/td>\n<td>לפי ״שבוע סטוריז טיפוסי״<\/td>\n<td><\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>החודש הראשון — ממולא<\/h3>\n<table>\n<thead>\n<tr>\n<th>שבוע תוכן<\/th>\n<th>א׳<\/th>\n<th>ג׳<\/th>\n<th>ה׳<\/th>\n<th>אירועים מיוחדים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>השקה<\/td>\n<td><strong>0 — אתם יודעים לשחק?<\/strong> (מוצמד)<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>שליחה למעגל הקרוב בווטסאפ<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>1 — הפסל של קים<\/td>\n<td>2 — הכף והרגל<\/td>\n<td>3 — הרגל שלי לא מקשיבה לי!<\/td>\n<td>יום צילום 1 נעשה לפני השבוע<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>4 — קים אומרת<\/td>\n<td>5 — הקובייה מחליטה<\/td>\n<td>6 — חיות בבית של קים<\/td>\n<td>שבוע הפיילוט: סטוריז לפי הפרק למעלה<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>7 — משחק המראה<\/td>\n<td>8 — 10 שניות קופצות<\/td>\n<td>9 — מאחורי הקלעים<\/td>\n<td>יום צילום 2 בתחילת השבוע<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>10 — הרמזור של קים<\/td>\n<td>11 — אתגר הגרב<\/td>\n<td>12 — השלט של קים<\/td>\n<td>הצעת המופע מוכנה. סיכום מדדים בסוף השבוע<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>עונות ומועדים שכדאי לתכנן מראש<\/h3>\n<p>התוכן יכול ״להתלבש״ על מועדים, וגם הביקוש להופעות משתנה לאורך השנה. <strong>את התאריכים המדויקים בודקים בלוח השנה<\/strong>, ואת מועדי ההזמנה בודקים בשיחה עם 2–3 גננות ורכזות קייטנה (<a href=\"10-outreach-templates.md\">תבניות פנייה<\/a>). לא להסתמך על ניחוש.<\/p>\n<table>\n<thead>\n<tr>\n<th>מועד<\/th>\n<th>רעיון לתוכן<\/th>\n<th>הערה עסקית (לבדוק בשטח)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>חנוכה<\/td>\n<td>״אתגר הסביבון״: מסתובבים ונעצרים כמו סביבון. ״פסל של חנוכייה״<\/td>\n<td>מסיבות חנוכה בגנים: לברר מול גננות <strong>מתי<\/strong> הן סוגרות הפעלות<\/td>\n<\/tr>\n<tr>\n<td>ט״ו בשבט<\/td>\n<td>״משחק העץ״: גדלים מזרע לעץ, ורוח מנענעת<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>פורים<\/td>\n<td>״קים מתחפשת״: כל תחפושת היא תנועה אחרת<\/td>\n<td>מסיבות פורים בגנים ובמתנ״סים<\/td>\n<\/tr>\n<tr>\n<td>פסח<\/td>\n<td>״יציאה מהבית״: משחק מסלול. משחקים לחופשה<\/td>\n<td>קייטנות פסח: לברר מתי נסגרות<\/td>\n<\/tr>\n<tr>\n<td>קיץ<\/td>\n<td>אתגרים בחוץ, בצל ובשעות נוחות. ״משחקים לחופש״<\/td>\n<td>קייטנות קיץ: לברר מול מתנ״סים ורשויות מתי מתכננים (ייתכן שחודשים מראש)<\/td>\n<\/tr>\n<tr>\n<td>חזרה לגן (ספטמבר)<\/td>\n<td>״משחקי היכרות לגן״<\/td>\n<td>גננות מתכננות את השנה, ופנייה בזמן הזה יכולה להתאים. לבדוק<\/td>\n<\/tr>\n<tr>\n<td>ימי הולדת<\/td>\n<td>כל השנה<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>בנקים לעבודה שוטפת<\/h2>\n<h3>בנק הוקים (לחודש 2 ואילך)<\/h3>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>הוק<\/th>\n<th>פורמט מתאים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>״אף אחד לא מצליח את זה בפעם הראשונה.״<\/td>\n<td>אתגר<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>״אסור לצחוק. מתחילים... עכשיו.״<\/td>\n<td>משחקים / משתגעת<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>״רגע רגע רגע! מי זז?!״<\/td>\n<td>משחקים<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>״יש לכם 10 שניות.״ (טיימר על המסך)<\/td>\n<td>אתגר<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>״אני צריכה עזרה. דחוף.״<\/td>\n<td>משתגעת<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>״אמא שלי לא הצליחה. אתם?״<\/td>\n<td>אתגר<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>״זה המשחק שהילדים בגן ביקשו הכי הרבה.״ (רק אם זה נכון)<\/td>\n<td>משחקים<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>״אני סופרת עד 3 ואתם כבר בעמידה.״<\/td>\n<td>משחקים / אתגר<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>קים קפואה בתנוחה מוזרה, וטקסט ״מה קרה פה?״<\/td>\n<td>משתגעת<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>״תעשו בדיוק מה שאני עושה... אבל הפוך.״<\/td>\n<td>משחקים<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>בנק רעיונות לסרטונים (חודש 2)<\/h3>\n<table>\n<thead>\n<tr>\n<th>פורמט<\/th>\n<th>רעיונות<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>משחקים עם קים<\/strong><\/td>\n<td>חם־קר עם תנועה · בלונים דמיוניים (מנפחים, מעיפים, מפוצצים) · ״האות של השבוע״: יוצרים אות בגוף · ״מספרים בגוף״ · הליכה על חבל דמיוני · ריקוד הידיים (רק ידיים, יושבים)<\/td>\n<\/tr>\n<tr>\n<td><strong>אתגר קים<\/strong><\/td>\n<td>20 שניות בלי לצחוק · 3 כפיים מאחורי הגב · זריקת גרב לסל כביסה · מסלול כריות רכות · אתגר האצבעות (קואורדינציה עדינה)<\/td>\n<\/tr>\n<tr>\n<td><strong>קים משתגעת<\/strong><\/td>\n<td>קים מנסה להיות רצינית ולא מצליחה · קים מדברת עם הצל שלה · ״קים בהילוך איטי״ · קים מפחדת מ... גרב · ״החיה של הצופים״ (המנצחת מהסקר)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>רעיון שנכנס לבנק צריך לעבור 3 בדיקות: <strong>(1)<\/strong> אפשר להסביר את הכלל ב־5 שניות. <strong>(2)<\/strong> ילד בן 4 יכול לעשות אותו בבטחה בסלון. <strong>(3)<\/strong> יש בו רגע מצחיק או מפתיע.<\/p>\n<\/blockquote>"}, "docs/04-launch-checklist.md": {"title": "המסלול של קים: צ׳קליסט מא׳ עד ת׳", "html": "<h1>המסלול של קים: צ׳קליסט מא׳ עד ת׳<\/h1>\n<p><em>הקובץ נוצר אוטומטית מתוך system/roadmap.json. הגרסה האינטראקטיבית נמצאת ב־system/index.html.<\/em><\/p>\n<h2>א · יסודות ובדיקות (שבוע 1 · גיבוש)<\/h2>\n<p>לסדר את הבסיס: תיקייה אחת לכל הניירת, השם נבדק ונתפס, ותהליכים ארוכים (ביטוח, אישור משטרה, קורס עזרה ראשונה) כבר יוצאים לדרך.<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> א1 · פותחים תיקייה אחת לכל המיזם (45 דקות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> א2 · סוגרים את 7 ההחלטות של הדמות (שעה–שעתיים)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> א3 · בוחרים איות אחד לשם באנגלית (30 דקות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> א4 · בודקים שהשם פנוי (שעה)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> א5 · תופסים את השם בכל הרשתות (שעה)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> א6 · מבקשים הצעות לביטוח צד ג׳ (שעה עכשיו, ומעקב במשך שבוע)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> א7 · מגישים בקשה לאישור משטרה (30 דקות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> א8 · נרשמים לקורס עזרה ראשונה (20 דקות להרשמה)<\/li>\n<\/ul>\n<p><strong>בסוף השלב:<\/strong> יש לך שם בדוק, חשבונות תפוסים בכל הרשתות, ותהליכי הביטוח ואישור המשטרה כבר רצים ברקע.<\/p>\n<h2>ב · הדמות והלוק (שבוע 1 · גיבוש)<\/h2>\n<p>להפוך את קים לדמות שרואים ומזהים: תלבושת שעובדת בתנועה ובמצלמה, לוגו זמני ותנועת יד שיושבת בגוף.<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ב1 · מרכיבים תלבושת ראשונה (חצי יום)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ב2 · מבחני התלבושת (שעה)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ב3 · לוגו זמני בקנבה (1–2 שעות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ב4 · תנועת היד נכנסת לגוף (30 דקות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ב5 · תמונות חתימה לפרופיל (45 דקות)<\/li>\n<\/ul>\n<p><strong>בסוף השלב:<\/strong> קים נראית כמו קים: תלבושת שעברה את כל המבחנים, לוגו זמני, ותמונות חתימה לפרופיל.<\/p>\n<h2>ג · המופע: לימוד וחזרות (שבועות 1–2)<\/h2>\n<p>להכיר את המופע בעל פה, לבנות את הציוד והמוזיקה, ולהגיע לריצה מלאה של 45 דקות בתלבושת.<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ג1 · קוראים את התסריט בקול ומקליטים (שעתיים)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ג2 · מתרגלים הסברים של 20 שניות (1–2 שעות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ג3 · ערכת ציוד מינימלית לפיילוט (חצי יום)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ג4 · שלט מוזיקה Bluetooth (30 דקות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ג5 · בונים את הפלייליסט של המופע (2–3 שעות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ג6 · שולחים שאלות לאקו״ם (30 דקות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ג7 · ריצה מלאה לבד, בתלבושת ועם טיימר (שעה וחצי)<\/li>\n<\/ul>\n<p><strong>בסוף השלב:<\/strong> את מריצה את כל המופע לבד עם טיימר, עם פלייליסט מוכן, ציוד ארוז ושלט מוזיקה שעובד.<\/p>\n<h2>ד · תוכן ראשון ועלייה לאוויר (שבועות 1–2 · עלייה לאוויר)<\/h2>\n<p>להכין פינת צילום, לצלם את סרטוני הפתיחה ולעלות לאוויר עם סרטון ההיכרות.<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ד1 · מכינים טלפון וחצובה (45 דקות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ד2 · פינת צילום ובדיקת 10 שניות (30 דקות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ד3 · מכינים טפסי הסכמה לצילום (שעה)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ד4 · צילומי ניסיון פרטיים (2 שעות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ד5 · בוחרים אפליקציית עריכה אחת (30 דקות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ד6 · מגדירים את החשבונות לתוכן ילדים (45 דקות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ד7 · יום צילום 1: סרטונים 1–6 (חצי יום)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ד8 · יום ההשקה: סרטון ההיכרות באוויר (שעה וחצי)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ד9 · שבוע הפרסום הראשון (20 דקות לכל פרסום)<\/li>\n<\/ul>\n<p><strong>בסוף השלב:<\/strong> סרטון ההיכרות באוויר, ועוד 5 סרטונים מוכנים לפרסום.<\/p>\n<h2>ה · פיילוט חברים (שבועות 2–3 · פיילוט שטח)<\/h2>\n<p>להריץ את המופע מול ילדים אמיתיים בסביבה בטוחה, למדוד מה עובד, ולתקן לפני שגובים כסף.<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ה1 · מגייסים קבוצת פיילוט וצופה (שעה)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ה2 · שאלות ההזמנה למארח (20 דקות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ה3 · פיילוט חברים 1: 25–30 דקות (שעתיים כולל הכנה)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ה4 · סיכום 24 שעות ושני שינויים (45 דקות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ה5 · חזרה גנרלית עם ״קלפי צרות״ (שעה וחצי)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ה6 · פיילוט חברים 2: מופע מלא (חצי יום)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ה7 · נקודת החלטה: עוברים לפיילוט בתשלום? (30 דקות)<\/li>\n<\/ul>\n<p><strong>בסוף השלב:<\/strong> שני פיילוטים מתועדים, עם החלטה ברורה אם עוברים לפיילוט בתשלום.<\/p>\n<h2>ו · עסק על הנייר (שבועות 3–4)<\/h2>\n<p>לפתוח עסק כחוק, עם ביטוח, אישורים וטפסים שנבדקו, לפני שמקבלים את השקל הראשון.<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ו1 · פגישה עם רואה או רואת חשבון (שעה)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ו2 · פותחים תיק במס הכנסה ובביטוח לאומי (1–2 שעות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ו3 · אפליקציית קבלות וחשבון בנק נפרד (שעה)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ו4 · סוגרים ביטוח צד ג׳ (שעה)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ו5 · אישור המשטרה בידיים (15 דקות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ו6 · עורך או עורכת דין עוברים על הטפסים (שעה עכשיו, ומעקב)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ו7 · תיקיית ספק אחת למוסדות (30 דקות)<\/li>\n<\/ul>\n<p><strong>בסוף השלב:<\/strong> עסק פתוח, ביטוח פעיל, אישור משטרה בידיים ותיקיית מסמכים מוכנה למוסדות.<\/p>\n<h2>ז · מחיר ואריזה עסקית (שבוע 4 · אריזה עסקית)<\/h2>\n<p>לקבוע מחיר שמכסה עלויות ומשאיר רווח, לסגור את הצעת המופע ולהכין כלים פשוטים לניהול הזמנות.<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ז1 · כמה זמן באמת לוקחת הופעה (30 דקות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ז2 · רושמים את כל העלויות (שעה)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ז3 · סקר שוק: 5 מפעילים דומים (1–2 שעות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ז4 · קובעים מחיר (45 דקות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ז5 · סוגרים את הצעת המופע (2–3 שעות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ז6 · מערכת הזמנות פשוטה (2 שעות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ז7 · עמוד הנחיתה באוויר (2–3 שעות)<\/li>\n<\/ul>\n<p><strong>בסוף השלב:<\/strong> יש מחיר, הצעת מופע מעוצבת, עמוד נחיתה באוויר ומערכת פשוטה לניהול הזמנות.<\/p>\n<h2>ח · לקוחות ראשונים (שבוע 4 ואילך)<\/h2>\n<p>לפנות לגנים, קייטנות, מתנ״סים והורים, לסגור הופעות ראשונות בתשלום ולאסוף המלצות אמיתיות.<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ח1 · ערכת הפנייה מוכנה (30 דקות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ח2 · רשימת 20 לידים (1–2 שעות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ח3 · פנייה לחנוכה (אם זה אוקטובר–נובמבר) (שעה)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ח4 · הודעת גיוס בקבוצות הורים (30 דקות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ח5 · 10 פניות ומעקב (שעתיים, ועוד מעקב)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ח6 · הופעה ראשונה בתשלום (יום)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ח7 · המלצות אמיתיות באתר (30 דקות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ח8 · אחרי 3 הופעות: החלטת מוצר (שעה)<\/li>\n<\/ul>\n<p><strong>בסוף השלב:<\/strong> 3 הופעות בתשלום מאחורייך, המלצות אמיתיות באתר, והחלטה מבוססת על המוצר.<\/p>\n<h2>ט · פגישת מיקוד ותוכנית 90 יום (חודש 2)<\/h2>\n<p>לשבת עם היועץ והמשווק עם נתונים אמיתיים, לסגור את ההחלטות הפתוחות ולבנות תוכנית ל־90 יום.<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ט1 · ניקוד התוכן אחרי 4 שבועות (שעה וחצי)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ט2 · מכינים את חבילת הפגישה (שעתיים)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ט3 · פגישת המיקוד (90 דקות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ט4 · מעבירים את ההחלטות למסמכים (שעה)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ט5 · נועלים שם וקונים דומיין (שעה)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ט6 · לוגו ממעצב או מעצבת (שעתיים, ועוד מעקב)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ט7 · החלטה על רישום סימן מסחר (1–2 שעות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ט8 · תלבושת שנייה וערכת חירום (חצי יום)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ט9 · סיכום 90 יום (שעתיים)<\/li>\n<\/ul>\n<p><strong>בסוף השלב:<\/strong> החלטות סגורות על שם, מחיר, קהל ותקציב, ותוכנית 90 יום עם אחריות לכל שורה.<\/p>\n<h2>י · שלב ההרחבה (אחרי 90 יום, רק אם הביקוש אומת)<\/h2>\n<p>להתרחב רק אחרי שהביקוש הוכח: שיר מקורי, כוריאוגרפיה, מוצרים ופורמטים חדשים.<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> י1 · בודקים שהביקוש אומת (שעה)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> י2 · שיר מקורי וכוריאוגרפיה (כמה שבועות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> י3 · מוצרים ופורמטים חדשים (משתנה)<\/li>\n<\/ul>\n<p><strong>בסוף השלב:<\/strong> קים משחקים הוא מותג עם שיר, ריקוד ומוצרים, שנבנו על בסיס של ביקוש אמיתי.<\/p>\n<h2>שגרות קבועות<\/h2>\n<ul>\n<li><strong>3 סרטונים בשבוע<\/strong> (כל שבוע · ראשון, שלישי, חמישי): עברי על צ׳קליסט הפרסום לפני כל סרטון. כתוביות בעברית תמיד. טקסט לפוסט שמדבר להורים. אין ילדים מזוהים בלי הסכמה חתומה.<\/li>\n<li><strong>סיכום מדדים שבועי<\/strong> (כל שישי · 20 דקות): מלאי את גיליון המדדים ואת הסיכום השבועי במדריך הצילום. סמני איזה סרטון עבד הכי טוב ולמה. בחרי מה לצלם בשבוע הבא.<\/li>\n<li><strong>יום צילום מרוכז<\/strong> (כל שבועיים · חצי יום): צלמי 5–6 סרטונים לפי לוח הזמנים במדריך. צלמי גם בנק של פתיחות וסיומים. שמרי בלופרים לסרטון ״מאחורי הקלעים״.<\/li>\n<li><strong>אחרי כל הופעה<\/strong> (תוך 24 שעות מכל הופעה): סיכום 3 שורות בטופס המשוב. מחיקת מידע רגיש מדף ההכנה. שאלון קצר להורים או לצוות, ובקשת המלצה. עד 2 שינויים, רשומים ביומן השינויים.<\/li>\n<li><strong>בלוק פניות שבועי<\/strong> (כל שבוע · שעה וחצי): 5 פניות חדשות מרשימת הלידים. מעקב יום 3 ויום 7 לפניות קודמות. עדכון גיליון ההזמנות. הוספת לידים חדשים לרשימה.<\/li>\n<li><strong>בדיקת מחיר<\/strong> (כל 3 חודשים): עדכני את העלויות ואת מחיר הרצפה בגיליון התמחור. בדקי את כללי האצבע של 10 הצעות המחיר האחרונות.<\/li>\n<li><strong>עדכון ספר הדמות<\/strong> (כל 5 הופעות): עדכני בספר הדמות מה עבד באמת: משפטים, תגובות ילדים, רגעים מצחיקים. בדקי שהילדים עדיין מעתיקים את תנועת היד וצועקים ״כולם משחקים!״.<\/li>\n<li><strong>עדכון שנתי של חוקים ואגרות<\/strong> (כל ינואר): עברי שוב על מדריך הרישוי והמנהלה. עדכני תקרות, אגרות ותעריפים. חדשי את ביטוח צד ג׳ ובדקי שאישור המשטרה בתוקף.<\/li>\n<\/ul>"}, "docs/05-pilot-feedback.md": {"title": "טופס משוב לפיילוט: למדוד, לסכם, להחליט", "html": "<h1>טופס משוב לפיילוט: למדוד, לסכם, להחליט<\/h1>\n<blockquote>\n<p><strong>למה את צריכה את זה:<\/strong> בלי מדידה, זוכרים אחרי מופע רק את הרגע הכי טוב ואת הרגע הכי מביך. הטופס הזה הופך כל הופעה לכמה מספרים פשוטים, והם אומרים לך <strong>מה לשנות בהופעה הבאה, ומה לא לגעת בו.<\/strong>\nהטופס בנוי בדיוק לפי עשרת הקטעים ב<a href=\"02-show-script.md\">תסריט המופע<\/a>.<\/p>\n<\/blockquote>\n<h2>גרסה מינימלית (אם יש רק כוח לזה)<\/h2>\n<blockquote>\n<p><strong>מתחילים מכאן.<\/strong> בפיילוט הראשון, עם צופה שלא עשה/תה את זה אף פעם, הגרסה הזאת מספיקה. את ״הגרסה המלאה״ (כל השאר בטופס) מוסיפים כשהמינימלית כבר זורמת לך.<\/p>\n<p><strong>הצופה, חובה רק 4 דברים<\/strong> (בדף הצופה, חלק ב׳):\n1. <strong>לא־משתתפים<\/strong> בכל קטע: מספר אחד לקטע.\n2. <strong>שניות עד שקופאים<\/strong> אחרי כל ״עם קים...״ שנועד לעצור.\n3. <strong>רגעי איבוד:<\/strong> הדקה, ומה קרה רגע לפני.\n4. <strong>כל אירוע בטיחות או ״כמעט״.<\/strong><\/p>\n<p>זמן הסבר, פרצי צחוק, המדד המיוחד והסימנים: <strong>לא חובה.<\/strong> הצבעת האגודלים (30 שנ׳): אם אפשר.<\/p>\n<p><strong>הסיכום שלך, 3 שורות:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>שאלה<\/th>\n<th>תשובה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>בטיחות: 0 אירועים?<\/td>\n<td>כן / לא<\/td>\n<\/tr>\n<tr>\n<td>כמה קטעים אדומים? (אדום = השתתפות מתחת ל־50%, <strong>או<\/strong> הקבוצה אבדה ליותר מ־30 שנ׳, <strong>או<\/strong> אירוע בטיחות בקטע)<\/td>\n<td>___<\/td>\n<\/tr>\n<tr>\n<td>החזרת קשב: הזמן האמצעי עד 10 שנ׳? (מסדרים מהקצר לארוך ולוקחים את האמצעי)<\/td>\n<td>כן / לא<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>ההחלטה:<\/strong>\n- <strong>בטיחות 0, החזרת קשב עד 10 שנ׳, ולכל היותר קטע אדום אחד<\/strong> ← ממשיכים, ומשנים <strong>עד 2 דברים<\/strong> לפי סדר העדיפויות בכלל 6 (חלק ז׳).\n- <strong>כל מצב אחר<\/strong> ← מתקנים <strong>רק את העדיפות הראשונה<\/strong> (בטיחות ← החזרת קשב ← הקטע האדום המוקדם ביותר בתסריט), ובודקים בהופעה הבאה.\n- <strong>כלל אצבע לצבע הכללי בגרסה הזאת:<\/strong> ההופעה <strong>אדומה<\/strong> אם היה אירוע בטיחות, או אם חצי מהקטעים או יותר אדומים. אחרת היא ״לא אדומה״. (זה מה שקובע את המעבר בין שלבי המחיר, חלק ז׳.)<\/p>\n<\/blockquote>\n<h2>איך זה עובד (הגרסה המלאה): 7 שלבים קצרים<\/h2>\n<table>\n<thead>\n<tr>\n<th>שלב<\/th>\n<th>מה<\/th>\n<th>מי<\/th>\n<th>מתי<\/th>\n<th>כמה זמן<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>א<\/td>\n<td><strong>דף הכנה<\/strong><\/td>\n<td>את<\/td>\n<td>ערב לפני<\/td>\n<td>5 דק׳<\/td>\n<\/tr>\n<tr>\n<td>ב<\/td>\n<td><strong>דף הצופה<\/strong><\/td>\n<td>חבר/ה, בן/בת זוג או איש/אשת צוות<\/td>\n<td>במהלך המופע<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>ג<\/td>\n<td><strong>הצבעת אגודלים<\/strong><\/td>\n<td>הילדים (הצופה סופר/ת)<\/td>\n<td>קטע 9, דקה 41 בערך (במופע מקוצר: בתוך הסיום)<\/td>\n<td>30 שניות<\/td>\n<\/tr>\n<tr>\n<td>ד<\/td>\n<td><strong>הקלטה קולית שלך<\/strong><\/td>\n<td>את<\/td>\n<td>עד שעה אחרי, באוטו<\/td>\n<td>10 דק׳<\/td>\n<\/tr>\n<tr>\n<td>ה<\/td>\n<td><strong>שאלון להורים או לצוות<\/strong><\/td>\n<td>ההורים או הצוות<\/td>\n<td>למחרת, בוואטסאפ<\/td>\n<td>2 דק׳ בשבילם<\/td>\n<\/tr>\n<tr>\n<td>ו<\/td>\n<td><strong>כרטיס הציון<\/strong><\/td>\n<td>את<\/td>\n<td>עד 24 שעות אחרי<\/td>\n<td>20 דק׳<\/td>\n<\/tr>\n<tr>\n<td>ז<\/td>\n<td><strong>החלטה ויומן שינויים<\/strong><\/td>\n<td>את<\/td>\n<td>מיד אחרי כרטיס הציון<\/td>\n<td>10 דק׳<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>אין צופה?<\/strong> אפשר בלי שלב ב׳, אבל המספרים יהיו פחות מדויקים. במקרה כזה בקשי מהגננת או מההורה המארח/ת למלא רק את שורת ״לא־משתתפים״ בכל קטע (חלק ב׳).<\/p>\n<h3>פרטיות: חוקים לטופס עצמו<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אין שמות של ילדים בטופס.<\/strong> אם צריך לציין ילד/ה, כותבים ״ילד/ה א׳״ או ״ילדה בשורה 2״.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>הצופה לא מצלם/ת ילדים.<\/strong> מודדים בעיניים ובשעון עצר, לא במצלמה. צילום רק לפי <a href=\"08-consent-template.md\">טופס אישור הצילום<\/a>.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ציטוטים מהורים מפרסמים <strong>רק באישור מפורש<\/strong> (חלק ה׳).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> שומרים את הטפסים בתיקייה ״פיילוטים״, לפי תאריך.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>בדף ההכנה (חלק א׳) רושמים רק מה שצריך למופע, בלי שמות ובלי אבחנות<\/strong> (למשל ״ילד/ה אחד/ת רגיש/ה לרעש״, לא ״יוסי, ADHD״). <strong>אחרי ההופעה מוחקים את השורה הזאת<\/strong> ומשאירים בטופס רק את המספרים. ראי <a href=\"13-legal-admin.md\">מסמך הרישוי והמנהלה<\/a>, פרק 7 (מה מותר לאסוף ולכמה זמן).<\/li>\n<\/ul>\n<hr />\n<h2>חלק א׳ — דף הכנה (ערב לפני)<\/h2>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>הופעה מספר<\/td>\n<td>______<\/td>\n<\/tr>\n<tr>\n<td>תאריך ושעה<\/td>\n<td>______<\/td>\n<\/tr>\n<tr>\n<td>סוג אירוע<\/td>\n<td>יום הולדת / גן / קייטנה / מתנ״ס / אירוע משפחות / אחר: ______<\/td>\n<\/tr>\n<tr>\n<td>גרסה<\/td>\n<td>3–4 / 5–6 / 7–8 / מעורב<\/td>\n<\/tr>\n<tr>\n<td>אורך מתוכנן<\/td>\n<td>______ דק׳<\/td>\n<\/tr>\n<tr>\n<td>מספר ילדים צפוי<\/td>\n<td>______<\/td>\n<\/tr>\n<tr>\n<td>חלל<\/td>\n<td>פנים / חוץ · קטן / בינוני / גדול · סוג רצפה: ______<\/td>\n<\/tr>\n<tr>\n<td>מה קורה לפני ואחרי המופע<\/td>\n<td>(למשל: ״ממש אחרי ארוחת צהריים״, ״סוף יום ארוך״) ______<\/td>\n<\/tr>\n<tr>\n<td>מבוגרים מהמקום שיהיו בחדר<\/td>\n<td>______<\/td>\n<\/tr>\n<tr>\n<td>מה צפוי: ילד/ת יום הולדת, רגישויות, צרכים מיוחדים (<strong>בלי שמות ובלי אבחנות<\/strong>. למחוק אחרי ההופעה)<\/td>\n<td>______<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>מה אני בודקת הפעם?<\/strong> (1–2 שינויים בלבד מההופעה הקודמת, מתוך יומן השינויים בחלק ז׳)<\/p>\n<ol>\n<li>שיניתי: <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong>_ · אני מצפה שהמדד ______ ישתפר.<\/li>\n<li>שיניתי: <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong>_ · אני מצפה שהמדד ______ ישתפר.<\/li>\n<\/ol>\n<hr />\n<h2>חלק ב׳ — דף הצופה (במהלך המופע)<\/h2>\n<h3>הודעה להעביר לצופה (להעתיק לוואטסאפ)<\/h3>\n<blockquote>\n<p>היי! תודה שבאת. משימה אחת: <strong>את/ה לא צופה במופע, את/ה צופה בילדים.<\/strong>\nשב/י בצד, בחלק הקדמי, כך שתראה/י את הפנים שלהם. פתח/י שעון עצר בטלפון. <strong>בלי לצלם ילדים.<\/strong>\nיש 4 דברים למדוד:\n1. <strong>לא־משתתפים:<\/strong> באמצע כל קטע, ספר/י כמה ילדים <strong>לא<\/strong> עושים את הפעילות (יושבים בצד, מדברים, מסתובבים). מספר אחד לכל קטע.\n2. <strong>זמן הסבר:<\/strong> מהמילה הראשונה שבה קים מסבירה משחק ועד שרוב הילדים מתחילים לשחק. בשניות.\n3. <strong>זמן החזרת קשב:<\/strong> בכל פעם שקים אומרת ״עם קים...״ כדי לעצור (חוץ מבפתיחה ובסיום), כמה שניות עד שכמעט כולם קפאו ושקטים.\n4. <strong>פרצי צחוק:<\/strong> כשרוב הקבוצה צוחקת ביחד, זה פרץ אחד. סופרים.\nובנוסף: אם ראית ש<strong>רבע מהילדים או יותר<\/strong> ״לא איתה״ במשך יותר מ־10 שניות, רשמ/י את <strong>הדקה<\/strong> ו<strong>מה קרה רגע לפני<\/strong>.\nוגם: <strong>כל נפילה, התנגשות או ״כמעט״<\/strong> (כמעט התנגשו, כמעט החליקו). הדקה ומה קרה.\nבסוף, בהצבעת האגודלים, תעריך/י כמה אגודלים הורמו לכל משחק.\n<strong>אם זה יותר מדי:<\/strong> חובה רק סעיפים 1 ו־3, רגעי האיבוד, וכל אירוע בטיחות או ״כמעט״ (נפילה, התנגשות, כמעט החלקה). זמן הסבר וצחוק לא חובה.<\/p>\n<\/blockquote>\n<h3>מספר ילדים בפועל: ______ (לספור בתחילת המופע)<\/h3>\n<h3>טבלת הקטעים<\/h3>\n<p><strong>איך מחשבים השתתפות:<\/strong> (מספר ילדים פחות לא־משתתפים) ÷ מספר ילדים × 100.\n<em>לדוגמה: 20 ילדים, 3 לא משתתפים. 17 ÷ 20 = 85%.<\/em><\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>קטע<\/th>\n<th>לא־משתתפים<\/th>\n<th>השתתפות %<\/th>\n<th>זמן הסבר (שנ׳)<\/th>\n<th>פרצי צחוק<\/th>\n<th>המדד המיוחד של הקטע (ראי טבלת היעדים)<\/th>\n<th>רגעי איבוד (דקה + מה קרה)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>כניסה<\/td>\n<td><\/td>\n<td><\/td>\n<td>—<\/td>\n<td><\/td>\n<td>״כן!״ בפעם השנייה: כמעט כולם / רוב / חצי / מעטים<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>הקריאה הסודית<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>מבחן הרעש: ___ שנ׳ עד שקט<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>קים אומרת<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>השתתפות בסיבוב האחרון: ___%<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>הפסל<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>קפאו תוך 2 שנ׳: רוב / חצי / מעטים<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>קוביית קים<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>כמה ילדים ״קפאו כמו פסל״ כשקים בחרה זורק/ת: יותר מחצי / רבע עד חצי / פחות מרבע<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>קים משתגעת<\/td>\n<td><\/td>\n<td><\/td>\n<td>—<\/td>\n<td><\/td>\n<td>פרצי צחוק: ___<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>המסלול<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>זמן סידור שורות: ___ שנ׳<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>הריקוד<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>בסבב ״בלעדיי״, ביצעו את כל התנועות: ___%<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>נשימה<\/td>\n<td><\/td>\n<td><\/td>\n<td>—<\/td>\n<td><\/td>\n<td>שניות עד שהחדר רגוע: ___<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>סיום<\/td>\n<td><\/td>\n<td><\/td>\n<td>—<\/td>\n<td><\/td>\n<td>עוצמת הקריאה האחרונה 1–5: ___ · ב״פסל אחרון״ נשארו רגועים: כן / לא<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>מדדים לאורך כל המופע<\/h3>\n<table>\n<thead>\n<tr>\n<th>מדד<\/th>\n<th>רישום<\/th>\n<th>יעד<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>זמני החזרת קשב<\/strong> (כל פעם שהשתמשה ב״עם קים״ לעצירה)<\/td>\n<td>___ , ___ , ___ , ___ , ___ שנ׳<\/td>\n<td>עד 5 שנ׳<\/td>\n<\/tr>\n<tr>\n<td><strong>הסברים שנמשכו מעל 20 שנ׳<\/strong><\/td>\n<td>___ (באילו קטעים: ______)<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td><strong>כמה פעמים קים צעקה<\/strong> (הרימה קול כדי להשתיק)<\/td>\n<td>___<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td><strong>משך בפועל<\/strong><\/td>\n<td>___ דק׳ (מתוכנן: ___)<\/td>\n<td>עד 3 דק׳ הפרש<\/td>\n<\/tr>\n<tr>\n<td><strong>אירועי בטיחות<\/strong>: נפילה, התנגשות, ילד/ה שנפגע/ה<\/td>\n<td>___ · מה קרה: ______<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td><strong>״כמעט״<\/strong>: כמעט התנגשו, כמעט החליקו, ילד/ה כמעט יצא/ה מהשטח<\/td>\n<td>___ · מה קרה: ______<\/td>\n<td>0<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>סימנים חזקים מהילדים (לסמן ולספור)<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ילדים חזרו על ״כולם משחקים!״ <strong>בלי שביקשו<\/strong> · כמה פעמים: ___<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ילדים חיקו תנועות של קים <strong>אחרי<\/strong> המופע (בדרך החוצה, בחצר)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ילדים צעקו ״עוד!״ או ״שוב!״ · כמה פעמים: ___<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ילד/ה ביישן/ית שישב/ה בצד <strong>הצטרף/ה<\/strong> · באיזו דקה: ___<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ילדים ניגשו לקים בסוף (לשאול, לספר, להראות תנועה)<\/li>\n<\/ul>\n<h3>סימנים מהמבוגרים (חשוב לעסק)<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> הצוות או ההורים השתתפו או צחקו<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>רוב המבוגרים היו בטלפון רוב הזמן<\/strong> (ביום הולדת ההורים הם הקונים הבאים, אז זה סימן אזהרה)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מבוגר/ת שאל/ה על <strong>מחיר<\/strong><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מבוגר/ת שאל/ה על <strong>תאריך<\/strong> או הופעה נוספת<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ביקשו פרטים <strong>לגן, לקייטנה או למשפחה אחרת<\/strong><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> לקחו כרטיס ביקור או סרקו קוד<\/li>\n<\/ul>\n<p><strong>מספר סימנים עסקיים<\/strong> (סכום ארבע השורות האחרונות): ___<\/p>\n<hr />\n<h2>חלק ג׳ — הצבעת אגודלים (קטע 9)<\/h2>\n<p>קים שואלת ״מי אהב את...?״, והצופה מעריך/ה.<\/p>\n<table>\n<thead>\n<tr>\n<th>משחק<\/th>\n<th>כמעט כולם<\/th>\n<th>רוב<\/th>\n<th>חצי<\/th>\n<th>מעטים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>קוביית קים<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>הפסל<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>קים משתגעת<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>המסלול<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>הריקוד<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>איך משתמשים בזה:<\/strong> האגודלים לא נכנסים לציון. הם עוזרים בשני מקרים:<\/p>\n<ol>\n<li><strong>בחירה בין קטעים צהובים:<\/strong> יש כמה קטעים צהובים ומותר לשנות רק אחד? משנים את זה שקיבל <strong>פחות<\/strong> אגודלים (ראי כלל 6 בחלק ז׳).<\/li>\n<li><strong>רעיון לתוכן:<\/strong> המשחק עם הכי הרבה אגודלים הוא מועמד מצוין לסרטון (ראי <a href=\"03-video-scripts.md\">תסריטי הווידאו<\/a>).<\/li>\n<\/ol>\n<hr />\n<h2>חלק ד׳ — הקלטה קולית שלך (עד שעה אחרי)<\/h2>\n<p><strong>איך:<\/strong> יושבים באוטו לפני שנוסעים, פותחים הקלטה בטלפון ועונים בקול. אחר כך רושמים בטופס רק את התשובות הקצרות.<\/p>\n<ol>\n<li><strong>הרגע הכי חזק:<\/strong> מה קרה בו בדיוק? מה אמרתי?<\/li>\n<li><strong>איפה איבדתי אותם?<\/strong> מה קרה רגע לפני?<\/li>\n<li><strong>מה אלתרתי שכדאי להכניס קבוע?<\/strong> ← לרשום את <strong>המשפט המדויק<\/strong>: <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong>_<\/li>\n<li><strong>איפה הרגשתי לא בטוחה או שכחתי מה הלאה?<\/strong><\/li>\n<li><strong>גוף וקול:<\/strong> הקול נשחק? התלבושת הפריעה לתנועה (חצאית, נעליים, קוקו)? (ראי <a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a>)<\/li>\n<li><strong>האנרגיה שלי בסוף,<\/strong> 1–5: ___<\/li>\n<li><strong>הרגשתי שהבטיחות בשליטה כל הזמן?<\/strong> כן / לא, כי: ______<\/li>\n<li><strong>משפט אחד: מה אני הכי רוצה לשנות?<\/strong> <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong>_<\/li>\n<\/ol>\n<hr />\n<h2>חלק ה׳ — שאלון להורים ולצוות (למחרת)<\/h2>\n<p><strong>למה למחרת:<\/strong> מה שהילדים מספרים בבית או בגן <strong>יום אחרי<\/strong> הוא הסימן הכי אמין לכך שהמופע ״נשאר״.<\/p>\n<h3>הודעה לצוות (גן, קייטנה, מתנ״ס)<\/h3>\n<p><em>הנוסח כתוב בלשון נקבה. בקייטנות ובמתנ״סים איש הקשר הוא לא פעם גבר, ואז מתאימים לשון: מוסיפה ← מוסיף, תמליצי ← תמליץ. (״כתבת״ ו״מבחינתך״ נכתבים אותו דבר.)<\/em><\/p>\n<blockquote>\n<p>היי [שם], כאן קים מ״קים משחקים״. תודה על אתמול! יש לי 5 שאלות קצרות, ממש 2 דקות, וזה יעזור לי מאוד לשפר:\n1. מה הילדים סיפרו או עשו אחרי המופע? (אם יש משפט שאמרו, אשמח לשמוע אותו בדיוק)\n2. מה הכי עבד מבחינתך?\n3. מה היית משנה או מוסיפה?\n4. האם המופע התאים לגיל, לאורך ולמקום?\n5. מ־0 עד 10, כמה סביר שתמליצי עליי לגן או למסגרת אחרת?<\/p>\n<p>ועוד שאלה אחת: אפשר לצטט את מה שכתבת בעמוד שלי? רק עם תפקיד ועיר (למשל ״גננת, חיפה״), או בלי שום פרט, מה שנוח לך.<\/p>\n<\/blockquote>\n<h3>הודעה להורים (יום הולדת)<\/h3>\n<blockquote>\n<p>היי [שם], כאן קים. תודה שהזמנתם אותי ליום ההולדת של [שם הילד/ה]! אשמח ל־2 דקות שלכם:\n1. מה [שם הילד/ה] סיפר/ה על המופע אחרי זה?\n2. מה הכי אהבתם?\n3. מה הייתם משנים?\n4. איך היה לכם כמארחים? היה פשוט, או שמשהו היה מסורבל?\n5. מ־0 עד 10, כמה סביר שתמליצו עליי לחברים?<\/p>\n<p>ואפשר לצטט את מה שכתבתם בעמוד שלי? רק עם שם פרטי ועיר, או בלי שם בכלל, מה שנוח לכם.<\/p>\n<\/blockquote>\n<h3>שאלת בונוס (רק כשמתאים, ובעיקר מול מוסדות)<\/h3>\n<blockquote>\n<p>״בהפעלות מהסוג הזה, מה טווח המחירים שאתם בדרך כלל משלמים?״<\/p>\n<\/blockquote>\n<p>התשובה עוברת ל<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>. <strong>לא שואלים את זה בהופעה שהייתה בחינם לחברים.<\/strong><\/p>\n<h3>איך קוראים את ציון ההמלצה (0–10)<\/h3>\n<table>\n<thead>\n<tr>\n<th>ציון<\/th>\n<th>מה זה אומר<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>9–10<\/td>\n<td><strong>ממליצים.<\/strong> אלה האנשים שיפיצו אותך. בקשי ציטוט והפניה<\/td>\n<\/tr>\n<tr>\n<td>7–8<\/td>\n<td><strong>מרוצים, לא נלהבים.<\/strong> שאלי: ״מה היה הופך את זה ל־10?״<\/td>\n<\/tr>\n<tr>\n<td>0–6<\/td>\n<td><strong>משהו לא עבד.<\/strong> התקשרי (לא וואטסאפ) והקשיבי בלי להתגונן<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>אחרי 3–5 הופעות אפשר לחשב ממוצע. עם תשובה אחת או שתיים לא עושים חשבון, פשוט קוראים.<\/em><\/p>\n<p><em>ציטוטים שאושרו עוברים לאיסוף ההמלצות ב<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a> ולעמוד הנחיתה.<\/em><\/p>\n<hr />\n<h2>חלק ו׳ — כרטיס הציון (עד 24 שעות)<\/h2>\n<h3>שלב 1: ציון לכל קטע (1–3)<\/h3>\n<p><strong>הכלל:<\/strong> הציון של הקטע הוא <strong>הצבע הכי נמוך<\/strong> מבין שלושה דברים: ההשתתפות, המדד המיוחד ורגעי האיבוד.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>3 ירוק: עבד<\/strong><\/th>\n<th><strong>2 צהוב: חלקי<\/strong><\/th>\n<th><strong>1 אדום: לא עבד<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>השתתפות<\/strong><\/td>\n<td>80% ומעלה<\/td>\n<td>50%–79%<\/td>\n<td>מתחת ל־50%<\/td>\n<\/tr>\n<tr>\n<td><strong>רגעי איבוד בקטע<\/strong><\/td>\n<td>אין<\/td>\n<td>אחד, קצר (עד 30 שנ׳)<\/td>\n<td>הקבוצה אבדה ליותר מ־30 שנ׳<\/td>\n<\/tr>\n<tr>\n<td><strong>בטיחות בקטע<\/strong><\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td><strong>כל אירוע בטיחות = אדום אוטומטי<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>המדד המיוחד<\/strong><\/td>\n<td>לפי הטבלה למטה<\/td>\n<td>לפי הטבלה למטה<\/td>\n<td>לפי הטבלה למטה<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>יעדים למדד המיוחד של כל קטע<\/h3>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>קטע<\/th>\n<th>מדד<\/th>\n<th>ירוק<\/th>\n<th>צהוב<\/th>\n<th>אדום<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>כניסה<\/td>\n<td>״כן!״ בפעם השנייה<\/td>\n<td>כמעט כולם<\/td>\n<td>רוב<\/td>\n<td>חצי או פחות<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>הקריאה הסודית<\/td>\n<td>שניות עד שקט במבחן הרעש<\/td>\n<td>עד 5<\/td>\n<td>6–10<\/td>\n<td>מעל 10<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>קים אומרת<\/td>\n<td>השתתפות בסיבוב האחרון<\/td>\n<td>80%+<\/td>\n<td>50%–79%<\/td>\n<td>מתחת ל־50%<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>הפסל<\/td>\n<td>קפאו תוך 2 שנ׳<\/td>\n<td>רוב<\/td>\n<td>חצי<\/td>\n<td>מעטים<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>קוביית קים<\/td>\n<td>כמה ילדים ״קפאו כמו פסל״ כשקים בחרה זורק/ת<\/td>\n<td>יותר מחצי<\/td>\n<td>רבע עד חצי<\/td>\n<td>פחות מרבע<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>קים משתגעת<\/td>\n<td>פרצי צחוק<\/td>\n<td>3 ומעלה<\/td>\n<td>1–2<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>המסלול<\/td>\n<td>זמן סידור שורות<\/td>\n<td>עד 60 שנ׳<\/td>\n<td>61–120 שנ׳<\/td>\n<td>מעל 2 דק׳ או ויתור<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>הריקוד<\/td>\n<td>ביצוע בסבב ״בלעדיי״<\/td>\n<td>60%+<\/td>\n<td>30%–59%<\/td>\n<td>מתחת ל־30%<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>נשימה<\/td>\n<td>שניות עד שהחדר רגוע<\/td>\n<td>עד 60<\/td>\n<td>61–120<\/td>\n<td>מעל 120<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>סיום<\/td>\n<td>עוצמה (1–5) ו״פסל אחרון״<\/td>\n<td>4–5 ורגועים<\/td>\n<td>3, או לא רגועים לגמרי<\/td>\n<td>1–2, או יצאו משליטה<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>קטע שלא התקיים (למשל המסלול בגרסת 3–4, שבה הוא אופציונלי) לא נכנס לחישוב.<\/em><\/p>\n<h3>שלב 2: הכרטיס<\/h3>\n<table>\n<thead>\n<tr>\n<th>מדד<\/th>\n<th>התוצאה שלי<\/th>\n<th>ירוק<\/th>\n<th>צהוב<\/th>\n<th>אדום<\/th>\n<th>הצבע שלי<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>ציון הקטעים<\/strong> = סכום הציונים ÷ (מספר הקטעים × 3) × 100<\/td>\n<td>___%<\/td>\n<td>85%+<\/td>\n<td>65%–84%<\/td>\n<td>מתחת ל־65%<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>החזרת קשב:<\/strong> הזמן האמצעי (מסדרים את הזמנים מהקצר לארוך ולוקחים את האמצעי)<\/td>\n<td>___ שנ׳<\/td>\n<td>עד 5<\/td>\n<td>6–10<\/td>\n<td>מעל 10<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>הסברים מעל 20 שנ׳<\/strong><\/td>\n<td>___<\/td>\n<td>0<\/td>\n<td>1–2<\/td>\n<td>3+<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>בטיחות<\/strong><\/td>\n<td>___<\/td>\n<td>0<\/td>\n<td>״כמעט״ אחד או יותר<\/td>\n<td>אירוע אחד או יותר<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>צעקות של קים<\/strong><\/td>\n<td>___<\/td>\n<td>0<\/td>\n<td>1–2<\/td>\n<td>3+<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>משך מול תכנון<\/strong><\/td>\n<td>___ דק׳ הפרש<\/td>\n<td>עד 3<\/td>\n<td>4–7<\/td>\n<td>יותר מ־7<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>ציון המלצה<\/strong> (הורים או צוות)<\/td>\n<td>___<\/td>\n<td>9–10<\/td>\n<td>7–8<\/td>\n<td>0–6<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>סימנים עסקיים<\/strong><\/td>\n<td>___<\/td>\n<td>2+<\/td>\n<td>1<\/td>\n<td>0<\/td>\n<td><em>(מידע, לא ״כישלון״, במיוחד בהופעה חינמית)<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>שלב 3: הצבע הכללי<\/h3>\n<table>\n<thead>\n<tr>\n<th>צבע<\/th>\n<th>מתי<\/th>\n<th>מה עושים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>ירוק<\/strong><\/td>\n<td>ציון הקטעים ירוק <strong>וגם<\/strong> הבטיחות ירוקה <strong>וגם<\/strong> החזרת הקשב לא אדומה<\/td>\n<td>ממשיכים להופעות ולהזמנות. משפרים 1–2 דברים<\/td>\n<\/tr>\n<tr>\n<td><strong>צהוב<\/strong><\/td>\n<td>כל מצב אחר שאינו אדום<\/td>\n<td>משנים עד 2 דברים לפי כללי ההחלטה ובודקים בהופעה הבאה<\/td>\n<\/tr>\n<tr>\n<td><strong>אדום<\/strong><\/td>\n<td>ציון הקטעים אדום <strong>או<\/strong> הבטיחות אדומה<\/td>\n<td><strong>לא לוקחים הופעה בתשלום<\/strong> לפני ריצה נוספת עם ילדים של חברים (שלב 0 ב<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>, עד 2 הופעות כאלה בסך הכל). אדום גם בהופעת החברים השנייה? לא מוסיפים עוד הופעות חינם: עוצרים ומביאים את הטפסים ל<a href=\"07-advisor-meeting.md\">פגישה עם היועץ והמשווק<\/a>. אם הבטיחות אדומה, קודם תחקיר בטיחות (כלל 1)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>דוגמה מלאה (כדי לראות איך זה עובד)<\/h3>\n<blockquote>\n<p><strong>הופעה 2, גן, 24 ילדים, גרסת 5–6.<\/strong>\nציוני קטעים: 3, 3, 3, 2, 3, 2, <strong>1<\/strong>, 3, 2, 3 ← סכום 25 ÷ 30 = <strong>83%, צהוב.<\/strong>\nהחזרת קשב: 3, 6, 4, 5, 5 שנ׳ ← מסדרים: 3, 4, <strong>5<\/strong>, 5, 6 ← האמצעי 5, <strong>ירוק.<\/strong>\nבטיחות: 0, <strong>ירוק.<\/strong> צעקות: 1, <strong>צהוב.<\/strong> סימנים עסקיים: 1 (הגננת שאלה על מחיר).\n<strong>הצבע הכללי: צהוב.<\/strong><\/p>\n<p><strong>ההחלטה, לפי סדר העדיפויות בכלל 6:<\/strong>\n- אין אירוע בטיחות, והחזרת הקשב ירוקה, אז עוברים לקטעים האדומים. קטע 7 (המסלול) אדום, כי סידור השורות לקח 150 שנ׳, למרות שהמסלולים היו השורות הקיימות. בטבלת התסמינים: ״סידור שורות מעל 2 דק׳״ ← <strong>שינוי 1:<\/strong> מוותרים על השורות: מעגל אחד בישיבה.\n- נשאר שינוי אחד לקטעים הצהובים: 4 (הפסל), 6 (קים משתגעת) ו־9 (נשימה). בהצבעת האגודלים הפסל קיבל ״חצי״ וקים משתגעת ״רוב״ (הנשימה לא בהצבעה), אז בוחרים בפסל. בדף הצופה כתוב שהילדים לא קפאו כי קטעי הריקוד היו ארוכים ← <strong>שינוי 2:<\/strong> עצירות כל 5–8 שנ׳.\n- בצעקה האחת <strong>לא מטפלים עכשיו<\/strong>, כי כבר יש 2 שינויים. רושמים אותה כ״מועמדת״, ואם היא חוזרת בהופעה הבאה, מגיע תורו של מגבר הקול.<\/p>\n<\/blockquote>\n<hr />\n<h2>חלק ז׳ — כללי ההחלטה: מה משנים בפעם הבאה<\/h2>\n<h3>שמונת הכללים<\/h3>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>כלל<\/th>\n<th>למה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>בטיחות עוקפת הכל.<\/strong> כל אירוע בטיחות, גם ״כמעט״, מטופל <strong>לפני ההופעה הבאה<\/strong>, בלי לחכות. התיקון הזה לא נספר במגבלת 2 השינויים.<\/td>\n<td>ילדים קודם<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>מקסימום 2 שינויים בכל הופעה.<\/strong><\/td>\n<td>אם תשני 5 דברים, לא תדעי מה מהם עזר<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>קטע אדום פעם אחת: מאבחנים ומתקנים דבר אחד<\/strong> בתוך הקטע, לפי טבלת התסמינים. <strong>לא מוחקים קטע אחרי הופעה אחת<\/strong>, אולי זה היה הקהל (חום, רעב, יום ארוך).<\/td>\n<td>הופעה אחת היא לא סטטיסטיקה<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><strong>קטע אדום פעמיים ברצף (גם אחרי תיקון): מחליפים את המשחק<\/strong> במשחק מ<a href=\"02-show-script.md\">בנק המשחקים החלופיים<\/a> (פרק 13 בתסריט).<\/td>\n<td>לא נלחמים במשחק שלא עובד<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><strong>קטע ירוק בשתי הופעות ברצף: ״קטע נעול״ לאותה גרסת גיל.<\/strong> לא נוגעים בו בגרסה הזאת, ומסמנים אותו כמועמד לסרטון. (קטע שנעול בגרסת 5–6 עדיין נבדק מחדש בגרסת 3–4 או 7–8, כי שם זה משחק אחר.)<\/td>\n<td>מה שעובד, לא מתקנים<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><strong>כשיש יותר מ־2 מועמדים לשינוי, זה סדר העדיפויות:<\/strong> (1) בטיחות, (2) החזרת קשב, (3) קטעים אדומים, <strong>המוקדם בתסריט קודם<\/strong>, (4) קטעים צהובים, <strong>קודם זה שקיבל פחות אגודלים<\/strong> (קטע שלא היה בהצבעה נבחר לפי הסדר בתסריט).<\/td>\n<td>בעיה בתחילת המופע מתגלגלת לכל ההמשך<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td><strong>הופעה ״חריגה״<\/strong> (חום קיצוני, 3 ילדים במקום 20, הפסקת חשמל): ממלאים את הטופס אבל <strong>לא מחליטים לפיו לבד<\/strong>. מחכים להופעה הבאה.<\/td>\n<td>לא משנים מופע בגלל יום חריג<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td><strong>אחרי 3 הופעות: החלטה על המוצר כולו<\/strong> (טבלה בהמשך)<\/td>\n<td>הזמן לעבור מניסוי לעסק<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>טבלת תסמינים: מה ראית ← מה כנראה הסיבה ← מה לשנות<\/h3>\n<table>\n<thead>\n<tr>\n<th>מה ראית<\/th>\n<th>סיבה אפשרית<\/th>\n<th>שינוי אחד לנסות<\/th>\n<th>איפה בתסריט<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>הסבר שנמשך מעל 20 שנ׳<\/td>\n<td>יותר מדי מילים<\/td>\n<td>הדגמה <strong>לפני<\/strong> מילים. לכתוב את ההסבר מחדש בשני משפטים<\/td>\n<td>פרק 5, ״ההסבר״ בכל קטע<\/td>\n<\/tr>\n<tr>\n<td>השתתפות נמוכה <strong>בתחילת<\/strong> קטע<\/td>\n<td>לא הבינו את המשחק<\/td>\n<td>להוסיף ״סיבוב ניסיון״ לפני הסיבוב ״האמיתי״<\/td>\n<td>פרק 5<\/td>\n<\/tr>\n<tr>\n<td>השתתפות שיורדת <strong>באמצע<\/strong> קטע<\/td>\n<td>הקטע ארוך מדי<\/td>\n<td>לעבור ל״גרסה קצרה״ של הקטע<\/td>\n<td>פרק 5<\/td>\n<\/tr>\n<tr>\n<td>החזרת קשב מעל 10 שנ׳<\/td>\n<td>הסימן לא נלמד מספיק<\/td>\n<td>להאריך את קטע 2 בדקה: שני ״מבחני רעש״ במקום אחד<\/td>\n<td>קטע 2<\/td>\n<\/tr>\n<tr>\n<td>איבוד <strong>במעבר<\/strong> בין קטעים<\/td>\n<td>״שקט מת״, קים מחפשת מה הלאה<\/td>\n<td>לשנן את משפט המעבר, ולהפעיל את רצועת הגשר (00ב) בזמן ההכנה<\/td>\n<td>פרק 14, דף הבמה; פרק 8, הסידור הטכני<\/td>\n<\/tr>\n<tr>\n<td>איבוד <strong>אחרי דקה 30<\/strong><\/td>\n<td>עייפות<\/td>\n<td>לקצר את המסלול, או להקדים את הריקוד<\/td>\n<td>פרק 7, סדר הקיצוץ<\/td>\n<\/tr>\n<tr>\n<td>פחות מ־2 פרצי צחוק בקים משתגעת<\/td>\n<td>התנועה קטנה או מהירה מדי<\/td>\n<td>לצלם חזרה ולהאט ולהגדיל כל תקלה<\/td>\n<td>קטע 6, פרק 12<\/td>\n<\/tr>\n<tr>\n<td>סידור שורות מעל 2 דק׳<\/td>\n<td>סידור מסובך<\/td>\n<td>קודם לבדוק שבאמת השתמשת בשורות שהילדים כבר יושבים בהן (זה הבסיס בתסריט). אם כן: מוותרים על השורות, מעגל אחד בישיבה<\/td>\n<td>קטע 7<\/td>\n<\/tr>\n<tr>\n<td>ילדים לא קופאים בפסל<\/td>\n<td>קטעי ריקוד ארוכים<\/td>\n<td>עצירות כל 5–8 שנ׳<\/td>\n<td>קטע 4<\/td>\n<\/tr>\n<tr>\n<td>כולם רוצים לזרוק את הקובייה, ויש בכי<\/td>\n<td>ציפייה בלי תפקיד<\/td>\n<td>״מתופף ראשי״ לכל מי שלא זרק<\/td>\n<td>קטע 5<\/td>\n<\/tr>\n<tr>\n<td>ילדים נבהלו בכניסה<\/td>\n<td>קטנים מדי לכניסה רועשת<\/td>\n<td>כניסה רכה (גרסת 3–4)<\/td>\n<td>קטע 1<\/td>\n<\/tr>\n<tr>\n<td>קים צעקה<\/td>\n<td>אין הגברה, או לחץ<\/td>\n<td>מגבר קול, וכלים 2 ו־7 מארגז הכלים<\/td>\n<td>פרק 6, פרק 10<\/td>\n<\/tr>\n<tr>\n<td>הקול נשחק<\/td>\n<td>אין הגברה, או אין חימום<\/td>\n<td>מגבר, חימום קול ומים<\/td>\n<td>פרק 12<\/td>\n<\/tr>\n<tr>\n<td>הצוות יצא או לא עזר<\/td>\n<td>לא סוכם מראש<\/td>\n<td>להכניס לשיחת ההזמנה ולתדריך<\/td>\n<td>פרק 4, <a href=\"12-booking-process.md\">תהליך ההזמנה<\/a><\/td>\n<\/tr>\n<tr>\n<td>הורים בטלפונים (יום הולדת)<\/td>\n<td>אין להם תפקיד<\/td>\n<td>להזמין את ההורים לסבב אחד בריקוד. זה גם הכי טוב לשיווק<\/td>\n<td>קטע 8<\/td>\n<\/tr>\n<tr>\n<td>השתתפות ירוקה אבל מעט אגודלים<\/td>\n<td>עשו, אבל לא אהבו<\/td>\n<td>לא לשנות עדיין. לעקוב בהופעה הבאה<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>משך המופע חרג ביותר מ־7 דק׳<\/td>\n<td>קטעים מתארכים<\/td>\n<td>טבלת זמנים בחזרות, ולהחליט מראש מה מקצרים<\/td>\n<td>פרק 12<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>אחרי 3 הופעות: החלטה על המוצר כולו<\/h3>\n<p><strong>איך זה מתחבר לשלבי המחיר<\/strong> ב<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>, שלב 8: הופעות 1–2 = <strong>שלב 0 (פיילוט חברים)<\/strong>. עוברים ל<strong>שלב 1 (פיילוט בתשלום)<\/strong> רק אם הצבע הכללי של ההופעה האחרונה <strong>לא אדום<\/strong>. ״יש מוצר״ (השורה הראשונה בטבלה) = מעבר ל<strong>שלב 2 (מחיר השקה)<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th>מה קרה ב־3 ההופעות<\/th>\n<th>מה זה אומר<\/th>\n<th>הצעד הבא<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>לפחות 2 ירוקות כלליות, ולפחות 2 סימנים עסקיים בסך הכל<\/strong><\/td>\n<td>יש מוצר<\/td>\n<td>לעבור לאריזה עסקית: <a href=\"06-show-offer.md\">הצעת המופע<\/a>, <a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>, <a href=\"10-outreach-templates.md\">תבניות הפנייה<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>בעיקר צהוב<\/strong><\/td>\n<td>המוצר בכיוון, צריך ליטוש<\/td>\n<td>נשארים בשלב 1 (פיילוט בתשלום) לעוד 2 הופעות, עם שינויים לפי הכללים. ראי <a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>בעיקר אדום, או אותו קטע אדום בכל ההופעות<\/strong><\/td>\n<td>משהו בסיסי לא מתאים (גיל, אורך, פורמט)<\/td>\n<td>לעצור ולהביא את הטפסים ל<a href=\"07-advisor-meeting.md\">פגישה עם היועץ והמשווק<\/a>. לשקול גיל יעד אחר או מופע קצר יותר<\/td>\n<\/tr>\n<tr>\n<td><strong>ירוק במופע, אבל 0 סימנים עסקיים<\/strong><\/td>\n<td>הילדים אוהבים, המבוגרים לא ״קונים״<\/td>\n<td>לבדוק את מי הזמנת (חברים? חינם?) ולנסות פיילוט אצל לקוח אמיתי. להביא ל<a href=\"07-advisor-meeting.md\">פגישה עם היועץ<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>יומן שינויים (ממלאים אחרי כל הופעה)<\/h2>\n<table>\n<thead>\n<tr>\n<th>הופעה<\/th>\n<th>תאריך<\/th>\n<th>מה שיניתי (עד 2)<\/th>\n<th>למה: איזה מדד<\/th>\n<th>מה קרה בהופעה הבאה<\/th>\n<th>להשאיר?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>כן / לא / לבדוק שוב<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>מעקב בין הופעות (תמונה אחת לכל הפיילוטים)<\/h2>\n<p>כתבי בכל משבצת <strong>ירוק / צהוב / אדום<\/strong>, או את המספר.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>הופעה 1<\/th>\n<th>הופעה 2<\/th>\n<th>הופעה 3<\/th>\n<th>הופעה 4<\/th>\n<th>הופעה 5<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>תאריך, סוג וגרסה<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>מספר ילדים<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>1. כניסה<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2. הקריאה הסודית<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3. קים אומרת<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4. הפסל<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5. קוביית קים<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>6. קים משתגעת<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>7. המסלול<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>8. הריקוד<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>9. נשימה<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>10. סיום<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>ציון הקטעים %<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>החזרת קשב (אמצעי)<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>בטיחות<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>ציון המלצה<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>סימנים עסקיים<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>צבע כללי<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>טיפ: אם נוח לך יותר, העתיקי את הטבלה הזו לגיליון (Google Sheets) לצד מעקב הלקוחות ב<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>.<\/em><\/p>\n<hr />\n<h2>דף צופה מקוצר להדפסה (עמוד אחד)<\/h2>\n<p><strong>מספר ילדים:<\/strong> ___ · <strong>שעת התחלה:<\/strong> ___ · <strong>שעת סיום:<\/strong> ___<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>קטע<\/th>\n<th>לא־משתתפים<\/th>\n<th>הסבר (שנ׳)<\/th>\n<th>צחוק<\/th>\n<th>מדד מיוחד<\/th>\n<th>איבוד?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>כניסה<\/td>\n<td><\/td>\n<td>—<\/td>\n<td><\/td>\n<td>״כן!״: כולם / רוב / חצי / מעטים<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>קריאה<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>שקט אחרי רעש: ___ שנ׳<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>קים אומרת<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>השתתפות בסיבוב האחרון: ___%<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>פסל<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>קפאו: רוב / חצי / מעטים<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>קובייה<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>״קפאו כמו פסל״ בבחירת זורק/ת: יותר מחצי / רבע–חצי / פחות מרבע<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>משתגעת<\/td>\n<td><\/td>\n<td>—<\/td>\n<td><\/td>\n<td>צחוק: ___<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>מסלול<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>סידור: ___ שנ׳<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>ריקוד<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>״בלעדיי״: ___%<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>נשימה<\/td>\n<td><\/td>\n<td>—<\/td>\n<td><\/td>\n<td>רגוע אחרי: ___ שנ׳<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>סיום<\/td>\n<td><\/td>\n<td>—<\/td>\n<td><\/td>\n<td>עוצמה 1–5: ___ · פסל: כן / לא<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>״עם קים״ לעצירה (שנ׳):<\/strong> ___ , ___ , ___ , ___ , ___ · <strong>צעקות:<\/strong> ___ · <strong>בטיחות / ״כמעט״:<\/strong> ______<\/p>\n<p><strong>אגודלים<\/strong> (כולם / רוב / חצי / מעט): קובייה ___ · פסל ___ · משתגעת ___ · מסלול ___ · ריקוד ___<\/p>\n<p><strong>סימנים:<\/strong> ״כולם משחקים!״ ספונטני ___ · ״עוד!״ ___ · ביישן/ית הצטרף/ה בדקה ___ · שאלו מחיר או תאריך ___<\/p>\n<hr />\n<p><strong>קבצים קשורים:<\/strong>\n<a href=\"02-show-script.md\">תסריט המופע<\/a> · <a href=\"08-consent-template.md\">טופס אישור הצילום<\/a> · <a href=\"12-booking-process.md\">תהליך ההזמנה<\/a> · <a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a> · <a href=\"06-show-offer.md\">הצעת המופע<\/a> · <a href=\"07-advisor-meeting.md\">פגישה עם היועץ והמשווק<\/a> · <a href=\"03-video-scripts.md\">תסריטי הווידאו<\/a><\/p>"}, "docs/06-show-offer.md": {"title": "הצעת המופע: החבילות, התנאים והטקסטים ללקוח", "html": "<h1>הצעת המופע: החבילות, התנאים והטקסטים ללקוח<\/h1>\n<blockquote>\n<p><strong>מה יש בקובץ:<\/strong><\/p>\n<p><strong>חלק א׳–ב׳:<\/strong> מה את מוכרת. המופע וארבע חבילות, אחת לכל סוג לקוח.<\/p>\n<p><strong>חלק ג׳–ד׳:<\/strong> מה את מבקשת מהמארח, מה את מתחייבת, ותנאי ההזמנה והביטול (טיוטה).<\/p>\n<p><strong>חלק ה׳:<\/strong> טקסטים מוכנים להעתקה: דף הצעה, נוסחים לכל סוג לקוח, ודף ״משחקים עם קים״ שמשאירים בגן.<\/p>\n<p>כל מה שמסומן <code>[___]<\/code> ממלאים מתוך <a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a> ומהחלטות <a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a>. <strong>לא שולחים ללקוח טקסט שיש בו עדיין <code>[___]<\/code>.<\/strong><\/p>\n<\/blockquote>\n<hr />\n<h2>לפני שמשתמשים: מה צריך להשלים<\/h2>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מחירים לכל חבילה ותוספת, מ<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a> (שלב 7)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> אזור פעילות ומדיניות נסיעות (גיליון התמחור, שלב 7)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> פרטי קשר אמיתיים: טלפון, וואטסאפ, אימייל, שם משתמש ברשתות (<a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a>, בדיקת זמינות שמות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> סוג העסק (עוסק פטור / מורשה) ומספר עוסק (<a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a>)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מדיניות הביטול (חלק ד׳) עברה בדיקה של עו״ד או של היועץ<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> קישור לסרטון ההיכרות (<a href=\"03-video-scripts.md\">תסריטי הווידאו<\/a>) ול<a href=\"../site/index.html\">עמוד הנחיתה<\/a><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> דף ״משחקים עם קים״ (נספח בסוף הקובץ) מעוצב ומוכן כ־PDF להדפסה<\/li>\n<\/ul>\n<hr />\n<h2>חלק א׳ — המוצר: ״המופע של קים משחקים״<\/h2>\n<p><strong>במשפט אחד (להורים ולמוסדות):<\/strong> מופע תנועה ומשחק אינטראקטיבי, שבו הילדים לא יושבים ומסתכלים, אלא משחקים עם קים מהדקה הראשונה ועד האחרונה.<\/p>\n<h3>מה הילדים עושים במופע (בשפה של הורים)<\/h3>\n<ul>\n<li><strong>זזים:<\/strong> ״קים אומרת״, ״הפסל של קים״ וקפיצות, הכל במקום ובבטחה<\/li>\n<li><strong>צוחקים:<\/strong> קים ״משתגעת״, והילדים מצילים אותה<\/li>\n<li><strong>משתפים פעולה:<\/strong> משחק קבוצתי שבו מצליחים רק ביחד<\/li>\n<li><strong>מובילים:<\/strong> ילדים מוזמנים לבחור תנועה, לזרוק את ״קוביית קים״ ולהוביל את הריקוד<\/li>\n<li><strong>נרגעים בסוף:<\/strong> נשימה, תודה וסיום שקט. <strong>הצוות או ההורים מקבלים קבוצה רגועה, לא מתפוצצת.<\/strong><\/li>\n<\/ul>\n<h3>גרסאות לפי גיל (מתוך <a href=\"02-show-script.md\">תסריט המופע<\/a>, פרק 11)<\/h3>\n<table>\n<thead>\n<tr>\n<th>גיל<\/th>\n<th>משך<\/th>\n<th>מה שונה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>3–4<\/strong><\/td>\n<td>30 דק׳<\/td>\n<td>״עשו כמוני״, בלי חוקים מסובכים, קול רך<\/td>\n<\/tr>\n<tr>\n<td><strong>5–6<\/strong> (גרסת הבסיס)<\/td>\n<td>45 דק׳<\/td>\n<td>חוק אחד או שניים בכל משחק, ילדים מובילים לפעמים<\/td>\n<\/tr>\n<tr>\n<td><strong>7–8<\/strong><\/td>\n<td>45–50 דק׳<\/td>\n<td>חוקים עם טריקים, הילדים ממציאים תנועות ותקלות<\/td>\n<\/tr>\n<tr>\n<td><strong>קבוצה מעורבת<\/strong><\/td>\n<td>לפי הצעירים<\/td>\n<td>הגדולים מקבלים תפקידים: ״עוזר/ת של קים״, ״קפטן/ית של שורה״<\/td>\n<\/tr>\n<tr>\n<td><strong>מתחת לגיל 3<\/strong><\/td>\n<td>—<\/td>\n<td><strong>לא בשלב הזה.<\/strong> המופע לא בנוי לגיל הזה<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>גודל קבוצה (כללי עבודה שלך, לא חוק)<\/h3>\n<table>\n<thead>\n<tr>\n<th>מספר ילדים<\/th>\n<th>איך<\/th>\n<th>הערה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5–10<\/td>\n<td>מופע אינטימי, 35–40 דק׳<\/td>\n<td>כל ילד/ה זורק/ת את הקובייה ומוביל/ה תנועה<\/td>\n<\/tr>\n<tr>\n<td>10–25<\/td>\n<td>המופע הרגיל<\/td>\n<td><strong>בלי מגבר<\/strong><\/td>\n<\/tr>\n<tr>\n<td>25–60<\/td>\n<td>רק כשיש לך <strong>מגבר קול עם מיקרופון ראש<\/strong><\/td>\n<td>עד שקנית מגבר, מגבילים את כל החבילות ל־25 ילדים<\/td>\n<\/tr>\n<tr>\n<td>מעל 60<\/td>\n<td><strong>שני מופעים<\/strong>, כל אחד לחצי קבוצה<\/td>\n<td>לא מופע אחד גדול<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>תמיד כלול<\/h3>\n<ul>\n<li>כל הציוד: רמקול, מוזיקה, קוביית קים, כדורים רכים, סרט לקו הבמה<\/li>\n<li>ערכת עזרה ראשונה בסיסית משלך (בנוסף לזו של המקום)<\/li>\n<li>מדבקה לכל ילד/ה בסוף<\/li>\n<li>התאמה מראש לגיל, למקום ולצרכים מיוחדים שסיפרו לך עליהם<\/li>\n<li>הגעה 30 דקות לפני: סיבוב בטיחות ותדריך קצר לאחראי/ת<\/li>\n<\/ul>\n<h3>לא כלול (ואומרים את זה מראש)<\/h3>\n<ul>\n<li><strong>צילום של הילדים.<\/strong> קים לא מצלמת ילדים בלי אישור הורים חתום (<a href=\"08-consent-template.md\">טופס אישור הצילום<\/a>)<\/li>\n<li>\n<p><strong>השגחה וטיפול שוטף בילדים<\/strong> במהלך המופע (ליווי לשירותים, הרגעה, טיפול ראשון ויצירת קשר עם ההורים): אצל הצוות או ההורים. אני אחראית להוביל פעילות בטוחה ומותאמת.<\/p>\n<blockquote>\n<p><em>הערה פנימית, לא ללקוח:<\/em> המשפט הזה מחלק תפקידים. <strong>הוא לא פוטר אותך מאחריות לרשלנות<\/strong>, ותביעה יכולה להגיע אלייך אישית. לכן ביטוח צד ג׳ הוא חובה מעשית, עוד לפני ההופעה הראשונה מול ילדים שאינם מהמשפחה (<a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a>, פרק 4).<\/p>\n<\/blockquote>\n<\/li>\n<li>\n<p><strong>שיר ״היום יום הולדת״ ברמקול.<\/strong> ההורים שרים, ולקים יש ״קפיצות גיל״ משלה (זכויות מוזיקה, <a href=\"02-show-script.md\">תסריט המופע<\/a>, פרק 8)<\/p>\n<\/li>\n<li>אוכל, קישוט, מתנות<\/li>\n<\/ul>\n<hr />\n<h2>חלק ב׳ — ארבע החבילות<\/h2>\n<blockquote>\n<p>המחירים: מ<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>. שמות החבילות זהים בכל הקבצים, כדי שיהיה קל לעקוב בגיליון הלקוחות (<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>).<\/p>\n<\/blockquote>\n<h3>חבילה 1 — ״יום הולדת עם קים״ 🎂<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>למי<\/strong><\/td>\n<td>הורים לילדים בני 3–8. בבית, בגינה, בחדר מועדון או באולם<\/td>\n<\/tr>\n<tr>\n<td><strong>מי מחליט ומשלם<\/strong><\/td>\n<td>ההורה, לרוב אחרי שראה סרטון או שמע המלצה<\/td>\n<\/tr>\n<tr>\n<td><strong>משך<\/strong><\/td>\n<td>45 דק׳ (גרסת 3–4: 30 דק׳)<\/td>\n<\/tr>\n<tr>\n<td><strong>גודל קבוצה<\/strong><\/td>\n<td>עד 25 ילדים (עד שיש מגבר)<\/td>\n<\/tr>\n<tr>\n<td><strong>מה מיוחד<\/strong><\/td>\n<td>ילד/ת יום ההולדת הוא/היא <strong>״הקפטן/ית של קים״<\/strong>, <strong>רק אם רוצה<\/strong>: בוחר/ת תנועה ראשונה, זורק/ת ראשון/ה את הקובייה, מוביל/ה את הריקוד. ״קפיצות גיל״ של כל החדר. הקריאה האחרונה מוקדשת לו/ה<\/td>\n<\/tr>\n<tr>\n<td><strong>מתי במסיבה<\/strong><\/td>\n<td>אחרי שרוב הילדים הגיעו (בערך 15–20 דק׳ מתחילת המסיבה), <strong>לפני העוגה והאוכל<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>כלול גם<\/strong><\/td>\n<td>הודעת וואטסאפ להורה המארח/ת אחרי המסיבה, עם משחק אחד לשחק בבית (להעביר להורי האורחים, אם רוצים)<\/td>\n<\/tr>\n<tr>\n<td><strong>מחיר<\/strong><\/td>\n<td>[<strong><em>] ₪ · מחיר השקה: [<\/em><\/strong>] ₪<\/td>\n<\/tr>\n<tr>\n<td><strong>שאלות מיוחדות בהזמנה<\/strong><\/td>\n<td>איך מבטאים את השם? בן/בת כמה? <strong>אוהב/ת להיות במרכז או מתבייש/ת?<\/strong> אחים שחשוב לשתף? (<a href=\"02-show-script.md\">תסריט המופע<\/a>, פרק 7)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>חבילה 2 — ״קים בגן״ 🏫<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>למי<\/strong><\/td>\n<td>גני ילדים עירוניים ופרטיים, גילאי 3–6<\/td>\n<\/tr>\n<tr>\n<td><strong>מי מחליט ומשלם<\/strong><\/td>\n<td>בגן פרטי: הבעלים או הגננת. בגן עירוני: בדרך כלל הגננת יחד עם ועד ההורים. <strong>לבדוק בכל גן<\/strong> מי מאשר, מי משלם, והאם נדרש אישור של הרשות להפעלה חיצונית (<a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a>)<\/td>\n<\/tr>\n<tr>\n<td><strong>משך<\/strong><\/td>\n<td>30 דק׳ (3–4) או 45 דק׳ (5–6)<\/td>\n<\/tr>\n<tr>\n<td><strong>גודל קבוצה<\/strong><\/td>\n<td>קבוצת גן אחת. מעל 25 ילדים, רק עם מגבר<\/td>\n<\/tr>\n<tr>\n<td><strong>מה מיוחד<\/strong><\/td>\n<td><strong>דף ״משחקים עם קים״ לגננת<\/strong> (נספח בסוף הקובץ): 3 משחקים מהמופע עם הסבר של 20 שניות, כדי להמשיך לשחק בגן כל השבוע. הקריאה ״עם קים — כולם משחקים!״ הופכת לסימן עצירה שהגננת יכולה להשתמש בו<\/td>\n<\/tr>\n<tr>\n<td><strong>אפשרות<\/strong><\/td>\n<td><strong>שני גנים באותו מבנה, ברצף<\/strong>, במחיר מופחת למופע השני (גיליון התמחור, שלב 7)<\/td>\n<\/tr>\n<tr>\n<td><strong>מתי<\/strong><\/td>\n<td>בבוקר, בשעה שהגננת קובעת. מועדים חזקים: לפני חגים ומסיבות (חנוכה, פורים, מסיבת סוף שנה), וגם ״יום כיף״ סתם באמצע השנה<\/td>\n<\/tr>\n<tr>\n<td><strong>מחיר<\/strong><\/td>\n<td>30 דק׳: [<strong><em>] ₪ · 45 דק׳: [<\/em><\/strong>] ₪ · מופע שני ברצף: [<strong><em>] ₪ · מחיר השקה: [<\/em><\/strong>] ₪<\/td>\n<\/tr>\n<tr>\n<td><strong>שאלות מיוחדות בהזמנה<\/strong><\/td>\n<td>כמה ילדים ובאיזה גיל? יש ילדים עם צרכים מיוחדים או רגישות לרעש? מה מצב אישורי הצילום בגן?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>חבילה 3 — ״יום משחקים בקייטנה / במתנ״ס״ ☀️<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>למי<\/strong><\/td>\n<td>קייטנות (קיץ, חנוכה, פסח), מתנ״סים, צהרונים<\/td>\n<\/tr>\n<tr>\n<td><strong>מי מחליט ומשלם<\/strong><\/td>\n<td>רכז/ת הקייטנה או מנהל/ת המתנ״ס. לרוב צריך <strong>מסמכי ספק<\/strong> והזמנה מסודרת (<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>)<\/td>\n<\/tr>\n<tr>\n<td><strong>אפשרויות<\/strong><\/td>\n<td><strong>3א. מופע בודד<\/strong> · <strong>שני מופעים ברצף<\/strong> לשתי קבוצות גיל · <strong>3ב. סדרה של 3 מפגשים<\/strong> (למשל פעם בשבוע בקיץ)<\/td>\n<\/tr>\n<tr>\n<td><strong>משך<\/strong><\/td>\n<td>30–45 דק׳ לפי גיל. <strong>בחוץ בחום: 30–35 דק׳ בלבד<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>גודל קבוצה<\/strong><\/td>\n<td>עד 25 בלי מגבר, עד 60 עם מגבר, מעל 60 שני מופעים<\/td>\n<\/tr>\n<tr>\n<td><strong>מה מיוחד<\/strong><\/td>\n<td>בסדרה: כל מפגש בונה על הקודם. הקריאה והסימנים כבר מוכרים, ונכנסים משחקים מ״בנק המשחקים״ (פרק 13 ב<a href=\"02-show-script.md\">תסריט המופע<\/a>) ותנועה חדשה בריקוד. <strong>סדרה מציעים רק אחרי שהמופע הבסיסי עבד לפחות 3 פעמים<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>מחיר<\/strong><\/td>\n<td>בודד: [<strong><em>] ₪ · מופע נוסף ברצף: [<\/em><\/strong>] ₪ · סדרה של 3: [<strong><em>] ₪ · מחיר השקה (מופע בודד): [<\/em><\/strong>] ₪<\/td>\n<\/tr>\n<tr>\n<td><strong>שאלות מיוחדות בהזמנה<\/strong><\/td>\n<td>פנים או חוץ? <strong>אם בחוץ: צל מלא ושעה<\/strong> (בוקר מוקדם או אחה״צ מאוחר). כמה אנשי צוות יישארו? מה מסמכי הספק שהם צריכים? מתי ואיך משלמים?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>חבילה 4 — ״כולם משחקים: אירוע משפחות״ 👨‍👩‍👧<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>למי<\/strong><\/td>\n<td>מתנ״סים ורשויות (אירועי חג וקהילה), ימי משפחות של מקומות עבודה, מפיקי אירועים, קהילות<\/td>\n<\/tr>\n<tr>\n<td><strong>מי מחליט ומשלם<\/strong><\/td>\n<td>רכז/ת התרבות או הקהילה, או המפיק/ה<\/td>\n<\/tr>\n<tr>\n<td><strong>משך<\/strong><\/td>\n<td>45–50 דק׳<\/td>\n<\/tr>\n<tr>\n<td><strong>מה מיוחד<\/strong><\/td>\n<td><strong>גם ההורים משחקים.<\/strong> ״צד ימין נגד צד שמאל״ בקריאה, הורים מצטרפים לריקוד ולקובייה. <strong>לא משחקים שבהם מבוגרים מרימים ילדים<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>תנאים<\/strong><\/td>\n<td><strong>רק כשיש לך מגבר<\/strong> (או מערכת הגברה של המקום), ואחרי לפחות 5 הופעות במסגרות קטנות. שטח במה מסומן, מבוגר/ת מהצוות לכל 10–15 ילדים<\/td>\n<\/tr>\n<tr>\n<td><strong>מחיר<\/strong><\/td>\n<td>[<strong><em>] ₪ · מחיר השקה: [<\/em><\/strong>] ₪<\/td>\n<\/tr>\n<tr>\n<td><strong>שאלות מיוחדות בהזמנה<\/strong><\/td>\n<td>כמה ילדים וכמה מבוגרים? יש במה ומערכת הגברה? מה עוד קורה באירוע באותו זמן (מתנפחים, דוכנים)? מי איש/אשת הקשר ביום האירוע?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>תוספות לכל החבילות<\/h3>\n<table>\n<thead>\n<tr>\n<th>תוספת<\/th>\n<th>מחיר<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>הארכה ל־50–55 דקות<\/td>\n<td>[___] ₪<\/td>\n<\/tr>\n<tr>\n<td>נסיעה מעבר לאזור [___]<\/td>\n<td>[___] ₪ (לפי מדיניות הנסיעות בגיליון התמחור)<\/td>\n<\/tr>\n<tr>\n<td>שעת שיא (שישי, ערב חג, שבוע החנוכה)<\/td>\n<td>[___] ₪ / ללא הנחות<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>מחיר השקה בכל החבילות:<\/strong> לפי <a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>, שלב 8, למספר הלקוחות הראשונים או עד התאריך שקבעת מראש. <strong>בהצעה תמיד כותבים את שני המחירים<\/strong> (המלא וההשקה), כדי שהמחיר המלא יישאר בראש. ההנחה ניתנת בתמורה ל<strong>משוב פרטי קצר<\/strong> (שאלון), ולא בתמורה לביקורת ציבורית (<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>, תחנה 11).<\/p>\n<hr />\n<h2>חלק ג׳ — מה את מבקשת מהמארח, ומה את מתחייבת<\/h2>\n<h3>מה את מבקשת מהמארח<\/h3>\n<p>את רוב הדברים האלה שואלים כבר <strong>בשאלון ההזמנה<\/strong> (<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>), ומזכירים יום לפני.<\/p>\n<table>\n<thead>\n<tr>\n<th>נושא<\/th>\n<th>מה מבקשים<\/th>\n<th>למה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מבוגר אחראי בחדר<\/strong><\/td>\n<td>לפחות מבוגר/ת אחד/ת מהמקום <strong>כל הזמן<\/strong>. בקבוצות גדולות: מבוגר/ת לכל 10–15 ילדים בערך (כלל עבודה שלך)<\/td>\n<td>את מובילה את המשחק בבטחה. <strong>ההשגחה השוטפת על הילדים<\/strong> (שירותים, הרגעה, טיפול ראשון, קשר עם ההורים) נשארת אצלם (<a href=\"02-show-script.md\">תסריט המופע<\/a>, חוק זהב 7)<\/td>\n<\/tr>\n<tr>\n<td><strong>מקום<\/strong><\/td>\n<td>חלל שבו כל ילד/ה יכול/ה לפתוח ידיים לצדדים בלי לגעת באחר. אין מקום כזה? המופע עובר לגרסת ישיבה<\/td>\n<td>בטיחות<\/td>\n<\/tr>\n<tr>\n<td><strong>רצפה<\/strong><\/td>\n<td>יבשה ולא חלקה. על פרקט או שיש: נעליים או יחפים, <strong>לא גרביים<\/strong><\/td>\n<td>החלקות<\/td>\n<\/tr>\n<tr>\n<td><strong>בחוץ<\/strong><\/td>\n<td><strong>צל מלא<\/strong>, ובקיץ רק בוקר מוקדם או אחה״צ מאוחר. מים לכל ילד/ה<\/td>\n<td>חום (<a href=\"02-show-script.md\">תסריט המופע<\/a>, פרק 7)<\/td>\n<\/tr>\n<tr>\n<td><strong>סידור ישיבה<\/strong><\/td>\n<td>הילדים יושבים בחצי עיגול מול הבמה כשקים נכנסת. הצוות מושיב אותם<\/td>\n<td>פתיחה נקייה<\/td>\n<\/tr>\n<tr>\n<td><strong>בלי אוכל ובלי פעילות מקבילה<\/strong><\/td>\n<td>לא אוכלים בזמן המופע (קופצים, ואוכל בפה מסוכן). לא מפעילים מתנפח או הפעלה אחרת באותו חלל באותו זמן<\/td>\n<td>בטיחות וקשב<\/td>\n<\/tr>\n<tr>\n<td><strong>חשמל<\/strong><\/td>\n<td>שקע ליד אזור הבמה<\/td>\n<td>טעינה למקרה הצורך<\/td>\n<\/tr>\n<tr>\n<td><strong>הגעה<\/strong><\/td>\n<td>כתובת מדויקת, איפה נכנסים, איפה אפשר לפרוק ציוד<\/td>\n<td>להגיע בזמן<\/td>\n<\/tr>\n<tr>\n<td><strong>מקום להתארגן<\/strong><\/td>\n<td>חדר או שירותים לסידור אחרון של התלבושת<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>מידע מראש<\/strong><\/td>\n<td>מספר ילדים וגילאים, ילדים עם צרכים מיוחדים, רגישות לרעש או קושי בתנועה<\/td>\n<td>התאמת המופע<\/td>\n<\/tr>\n<tr>\n<td><strong>צילום<\/strong><\/td>\n<td>מה מצב אישורי הצילום? מי לא מצולם? בבקשה שהמארח/ת יגיד/תגיד להורים: ״מצלמים רק את הילד שלכם ולא מעלים לרשת ילדים אחרים״<\/td>\n<td>פרטיות (<a href=\"08-consent-template.md\">טופס אישור הצילום<\/a>)<\/td>\n<\/tr>\n<tr>\n<td><strong>איש/אשת קשר<\/strong><\/td>\n<td>שם וטלפון של מי שאחראי/ת ביום עצמו<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>מה את מתחייבת (אפשר לכתוב את זה גם בהצעה, זה מוכר)<\/h3>\n<ul>\n<li>להגיע <strong>30 דקות לפני<\/strong> ולעשות סיבוב בטיחות<\/li>\n<li><strong>לא להרים ילדים, לא לסובב ולא לשאת<\/strong>, גם אם מבקשים. מגע רק כשהילד/ה בוחר/ת (כיף, נפנוף)<\/li>\n<li><strong>אף פעם לא להישאר לבד עם ילד/ה<\/strong> בחדר סגור<\/li>\n<li><strong>לא לצלם ילדים<\/strong> בלי אישור הורים חתום<\/li>\n<li>להתאים את המופע לגיל, למקום ולצרכים שסיפרו לך עליהם<\/li>\n<li>ש<strong>אף ילד/ה לא ״נפסל/ת״<\/strong> ולא יושב/ת בצד בגלל טעות. ילד/ה שלא רוצה להשתתף, יכול/ה לצפות<\/li>\n<li>להגיע עם כל הציוד, ולהמשיך את המופע גם אם המוזיקה נופלת<\/li>\n<li>האישורים הנדרשים לעבודה עם ילדים וביטוח, <strong>כשהם בתוקף<\/strong> (<a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a>). <strong>לא כותבים ״מבוטחת״ או ״עם אישור משטרה״ לפני שזה נכון<\/strong><\/li>\n<\/ul>\n<hr />\n<h2>חלק ד׳ — תנאי הזמנה ומדיניות ביטול (טיוטה)<\/h2>\n<blockquote>\n<p>⚠️ <strong>טיוטה בלבד, לא ייעוץ משפטי.<\/strong> לפני שמפרסמים או שולחים ללקוח, להעביר לבדיקה של עו״ד או של היועץ העסקי (<a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a>).<\/p>\n<p><strong>למה זה חשוב:<\/strong> כשהורה מזמין/ה ממך בטלפון, בוואטסאפ או באינטרנט, ייתכן שזו <strong>״עסקת מכר מרחוק״<\/strong> לפי חוק הגנת הצרכן, ואז יש לו/ה זכות ביטול שאסור לך לצמצם בתנאים שלך. <strong>תנאי שסותר את החוק, בטל.<\/strong><\/p>\n<\/blockquote>\n<h3>מה ידוע (ומה עוד לבדוק)<\/h3>\n<blockquote>\n<p>המקורות כאן הם <strong>אתרי צרכנות ומשרדי עורכי דין, לא נוסח החוק עצמו.<\/strong> הם מתארים את אותם כללים, אבל יש ביניהם הבדלי ניסוח (למשל ״ימים שאינם ימי מנוחה״ מול ״ימי עסקים״). לכן כל סעיף מסומן <strong>לבדוק<\/strong>, ואת הנוסח הסופי קובעים עם עו״ד.<\/p>\n<\/blockquote>\n<ul>\n<li><strong>שירות חד־פעמי (כמו מופע):<\/strong> הצרכן רשאי לבטל <strong>בתוך 14 יום<\/strong> מיום העסקה או מקבלת <strong>מסמך הפרטים<\/strong>, לפי המאוחר, <strong>ובלבד שהביטול נעשה לפחות 2 ימים שאינם ימי מנוחה לפני מועד השירות.<\/strong> מקורות: <a href=\"https://www.bizportal.co.il/financialconsumerism/news/article/20036709\">ביזפורטל — ביטול עסקה לשירות<\/a>; <a href=\"https://www.ice.co.il/consumerism/news/article/1039784\">ice — כסף וצרכנות<\/a>; <a href=\"https://protocol.co.il/remote-selling-transaction-cancellation/\">פרוטוקול — ביטול עסקת מכר מרחוק<\/a>. <strong>לבדוק בנוסח החוק.<\/strong><\/li>\n<li><strong>דמי ביטול:<\/strong> מוגבלים ל־<strong>5% מהמחיר או 100 ₪, הנמוך מביניהם.<\/strong> מקורות: <a href=\"https://www.kolzchut.org.il/he/עסקת_מכר_מרחוק\">כל זכות — עסקת מכר מרחוק<\/a>; <a href=\"https://www.bizportal.co.il/financialconsumerism/news/article/20042624\">ביזפורטל<\/a>. <strong>לבדוק.<\/strong><\/li>\n<li><strong>שירותי הארחה, נסיעה, חופש או בילוי:<\/strong> לפי המקורות, זכות הביטול <strong>לא חלה<\/strong> כשהביטול נעשה בתוך <strong>7 ימים שאינם ימי מנוחה<\/strong> לפני מועד השירות. מקורות: <a href=\"https://www.chamber.org.il/newslobby/articles/95632/\">לשכת המסחר — עו״ד שושנה רבינוביץ׳<\/a>; <a href=\"https://www.ice.co.il/consumerism/news/article/1039784\">ice<\/a>. <strong>שאלה לעו״ד: האם מופע ביום הולדת נחשב ״בילוי״ (7 ימים) או שירות רגיל (2 ימים)?<\/strong><\/li>\n<li><strong>אזרח ותיק (65+), אדם עם מוגבלות ועולה חדש:<\/strong> לפי המקורות, תקופת הביטול היא <strong>4 חודשים<\/strong>, כשבעסקה הייתה <strong>שיחה<\/strong> (גם בצ׳אט או בוואטסאפ). דמי הביטול נשארים 5% או 100 ₪. מקורות: <a href=\"https://protocol.co.il/transaction-cancellation-senior-citizen/\">פרוטוקול — ביטול עסקה על ידי אזרח ותיק<\/a>; <a href=\"https://www.kolzchut.org.il/he/ביטול_עסקה_ברוכלות_או_עסקת_מכר_מרחוק_על_ידי_עולה_חדש\">כל זכות — ביטול עסקה על ידי עולה חדש<\/a> (שם כתוב שגם אז, בשירות חד־פעמי, צריכים להישאר לפחות 2 ימי עסקים עד השירות). <strong>לבדוק.<\/strong> בפועל: סבתא שמזמינה בטלפון יום הולדת לנכד היא אולי ״אזרחית ותיקה״.<\/li>\n<li><strong>השעון מתחיל רק כשמסרת מסמך בכתב עם פרטי העסקה.<\/strong> בלי המסמך, ייתכן ש־14 הימים <strong>לא מתחילים בכלל.<\/strong> פרסום התנאים באתר או בעמוד לא מספיק: לפי פסק דין שמצוטט ב־<a href=\"https://www.law.co.il/media/computer-law/vidman.pdf\">law.co.il<\/a>, צריך מסמך ייעודי שנמסר ללקוח אחרי שסגרתם. <strong>לבדוק.<\/strong> מה כותבים במסמך: למטה, ״מסמך פרטי העסקה״, ובתחנה 6 ב<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>.<\/li>\n<li><strong>לבדוק:<\/strong> מוסדות (מתנ״ס, רשות, גן פרטי כעסק) הם בדרך כלל לא ״צרכנים״. מולם קובע מה שסוכם בכתב.<\/li>\n<li><strong>לבדוק:<\/strong> כש<strong>ועד הורים<\/strong> (כלומר הורים פרטיים) משלם על מופע בגן עירוני, ייתכן שהמשלם הוא <strong>צרכן<\/strong> ולא מוסד, ואז חלים עליו כללי הצרכן שלמעלה.<\/li>\n<\/ul>\n<h3>מה זה אומר בפועל (דוגמאות לבדיקה עם העו״ד, לא תשובה)<\/h3>\n<table>\n<thead>\n<tr>\n<th>מצב<\/th>\n<th>לפי המקורות למעלה<\/th>\n<th>השאלה לעו״ד<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>הורה הזמין/ה 3 שבועות מראש, קיבל/ה ממך מסמך פרטים, וביטל/ה אחרי 5 ימים<\/td>\n<td>בתוך 14 יום, ויותר מ־2 ימים לפני: החזר מלא, פחות 5% או 100 ₪ לכל היותר<\/td>\n<td>2 ימים או 7 (״בילוי״)?<\/td>\n<\/tr>\n<tr>\n<td>אותו הורה ביטל/ה יום לפני המופע<\/td>\n<td>עברו 14 יום, וגם פחות מ־2 ימים לפני: כנראה <strong>התנאים שלך<\/strong> חלים (סעיף 4)<\/td>\n<td>מה מותר לקבוע בסעיף 4?<\/td>\n<\/tr>\n<tr>\n<td>הזמנה 4 ימים מראש, ביטול יום לפני<\/td>\n<td>פחות מ־2 ימים לפני: כנראה זכות הביטול שבחוק לא חלה, וחלים התנאים שלך<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>לא שלחת מסמך פרטים<\/strong>, וההורה ביטל/ה 3 ימים לפני<\/td>\n<td>ייתכן ש־14 הימים לא התחילו, ולכן ההורה עדיין בתוך התקופה<\/td>\n<td><strong>בגלל זה שולחים תמיד את המסמך<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>מסמך פרטי העסקה (ללקוח פרטי, לפני המופע)<\/h3>\n<p><strong>מה זה:<\/strong> הודעה אחת מלאה בוואטסאפ או PDF, שנשלחת <strong>כשהלקוח אישר<\/strong>, לפני המופע. שומרים עותק. הנוסח המוכן נמצא ב<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>, תחנה 6.<\/p>\n<p>לפי <a href=\"https://www.kolzchut.org.il/he/עסקת_מכר_מרחוק\">כל זכות<\/a>, בין הפרטים שהעוסק חייב לגלות: שם, מספר זהות או מספר עוסק, וכתובת. <strong>לבדוק עם עו״ד את הרשימה המדויקת.<\/strong> עד שבדקת, כוללים את כל אלה:<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> שם מלא: קים נידם, ״קים משחקים״<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מספר עוסק (או ת״ז, אם כך יגידו לך)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> כתובת לפנייה וטלפון<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מה כלול: חבילה, משך, מספר ילדים, גילאים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מחיר מלא, מקדמה, יתרה ומועד התשלום<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> תאריך, שעה וכתובת המופע<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>תנאי הביטול המלאים<\/strong> (נוסח הטיוטה למטה, אחרי בדיקת עו״ד), כולל איך מודיעים על ביטול (באותו ערוץ שבו הזמינו)<\/li>\n<\/ul>\n<h3>נוסח הטיוטה<\/h3>\n<p><strong>1. סגירת הזמנה.<\/strong> ההזמנה סגורה אחרי אישור בכתב (וואטסאפ או מייל) ותשלום מקדמה של [___]. במוסדות: אחרי הזמנת עבודה או אישור בכתב של מורשה/ית חתימה.<\/p>\n<p><strong>2. תשלום.<\/strong><\/p>\n<ul>\n<li>לקוחות פרטיים: מקדמה [<strong><em>] בעת הסגירה. יתרה [<\/em><\/strong>] <strong>עד [___]<\/strong> (מומלץ: עד יום לפני, כדי שלא תצטרכי לגבות באמצע מסיבה).<\/li>\n<li>מוסדות: אחרי המופע נשלח <strong>חשבון עסקה<\/strong> (אם את עוסקת פטורה) או <strong>חשבונית מס<\/strong> (אם את עוסקת מורשית), בתנאי התשלום שסוכמו מראש: [___].<\/li>\n<li>על כל תשלום תינתן קבלה, <strong>כשהכסף מתקבל.<\/strong><\/li>\n<\/ul>\n<p><strong>3. שינוי מועד על ידי הלקוח.<\/strong> אפשר לשנות מועד <strong>פעם אחת ללא עלות<\/strong>, בהודעה של לפחות [___] ימים לפני המופע ובכפוף לזמינות. המקדמה עוברת למועד החדש.<\/p>\n<p><strong>4. ביטול על ידי לקוח פרטי.<\/strong> בתוך תקופת הביטול שבחוק: לפי חוק הגנת הצרכן. אחרי התקופה: [לבחור עם העו״ד אחת מהאפשרויות].<\/p>\n<blockquote>\n<p><strong>אפשרויות לעו״ד<\/strong> (כדי שתגיעי עם שאלה ממוקדת, לא עם חור). <strong>אף אחת מהן לא נבדקה משפטית:<\/strong><\/p>\n<ul>\n<li><strong>אפשרות א׳:<\/strong> בתוך תקופת הביטול שבחוק, החזר מלא פחות דמי ביטול כחוק (5% או 100 ₪, הנמוך). אחרי התקופה, המקדמה לא מוחזרת, אבל <strong>עוברת למועד חדש בתוך 6 חודשים.<\/strong><\/li>\n<li><strong>אפשרות ב׳:<\/strong> אחרי התקופה, החזר של <strong>חצי מהמקדמה.<\/strong><\/li>\n<li><strong>אפשרות ג׳:<\/strong> אחרי התקופה, המקדמה לא מוחזרת ולא עוברת.<\/li>\n<\/ul>\n<p>← לשאול: ״מה מותר לי? ואיך מנסחים את זה כך שזה לא סותר את החוק?״<\/p>\n<\/blockquote>\n<p><strong>5. ביטול על ידי מוסד.<\/strong> [לבחור עם העו״ד או היועץ, או לפי הזמנת העבודה של המוסד]:<\/p>\n<blockquote>\n<p><strong>הצעה לדיון:<\/strong> עד 14 יום לפני: ללא חיוב · 7–13 ימים לפני: <strong><em>% מהמחיר · פחות מ־7 ימים: <\/em><\/strong>% מהמחיר. <strong>ואם הזמנת העבודה של המוסד קובעת תנאים אחרים, קוראים אותם לפני שחותמים<\/strong> (<a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a>, פרק 11). [לבדוק]<\/p>\n<\/blockquote>\n<p><strong>6. ביטול על ידי קים<\/strong> (מחלה, מקרה חירום): החזר מלא של כל מה ששולם, או מועד חדש, <strong>לפי בחירת הלקוח.<\/strong> קים היא המופע, ולכן לא נשלחת מחליפה.<\/p>\n<p><strong>7. מזג אוויר, חום וביטחון.<\/strong><\/p>\n<ul>\n<li>מופע בחוץ ביום של <strong>עומס חום<\/strong> (לפי <a href=\"https://ims.gov.il\">השירות המטאורולוגי<\/a>) או גשם: עוברים פנימה, ואם אין מקום מקורה, <strong>קובעים מועד חדש ללא עלות.<\/strong><\/li>\n<li>הגבלות התקהלות של <strong>פיקוד העורף<\/strong> (<a href=\"https://www.oref.org.il\">oref.org.il<\/a>): קובעים מועד חדש ללא עלות.<\/li>\n<\/ul>\n<p><strong>8. בטיחות.<\/strong> קים רשאית להתאים, לקצר או לעצור את המופע כשיש סכנה לילדים (למשל רצפה רטובה, הרבה יותר ילדים ממה שסוכם, אין מבוגר מהמקום בחדר). התאמה כזאת אינה הפרה של ההזמנה.<\/p>\n<p><strong>9. איחור בתחילת המופע.<\/strong> אם המופע מתחיל באיחור של יותר מ־[15] דקות שלא בגלל קים, הוא מסתיים בשעה שנקבעה, או מוארך בתוספת של [___] ₪ אם הלוח מאפשר.<\/p>\n<p><strong>10. מספר ילדים.<\/strong> המחיר הוא לקבוצה של עד [<strong><em>] ילדים. אם מגיעים יותר, המופע מותאם (חלק מהמשחקים בישיבה), ובתוספת של [<\/em><\/strong>] ₪. מעל 60 ילדים, רק שני מופעים נפרדים.<\/p>\n<p><strong>11. צילום ופרטיות.<\/strong> קים לא מצלמת ילדים בלי אישור הורים חתום. ההורים מצלמים רק את ילדיהם. פרטים אישיים נשמרים רק לצורך ההזמנה (<a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a>).<\/p>\n<h3>הגרסה הקצרה (להדביק בתחתית הצעת מחיר)<\/h3>\n<blockquote>\n<p><strong>תנאים בקצרה:<\/strong> ההזמנה נסגרת עם אישור בכתב ומקדמה של [<strong><em>]. היתרה עד [<\/em><\/strong>]. אפשר לשנות מועד פעם אחת ללא עלות עד [___] ימים לפני. ביטול לפי חוק הגנת הצרכן. בחום כבד, גשם (בחוץ) או הנחיות פיקוד העורף, קובעים מועד חדש בלי עלות. מבוגר/ת מהמקום נשאר/ת בחדר לאורך כל המופע. אני לא מצלמת ילדים בלי אישור הורים. התנאים המלאים: [קישור]<\/p>\n<\/blockquote>\n<hr />\n<h2>חלק ה׳ — טקסטים מוכנים לשליחה<\/h2>\n<p><strong>לשון:<\/strong> הנוסחים כתובים בלשון נקבה, כי רוב מי שפונות הן גננות, רכזות ואמהות. כשכותבים לגבר, מתאימים.<\/p>\n<p><strong>מתי משתמשים במה:<\/strong><\/p>\n<ul>\n<li><strong>הפנייה הראשונה<\/strong> (״אפשר לשלוח לך פרטים?״) והפולואפים: ב<a href=\"10-outreach-templates.md\">תבניות הפנייה<\/a>.<\/li>\n<li><strong>ההצעה עצמה<\/strong>, אחרי שהלקוח אמר ״כן, תשלחי״: <strong>כאן.<\/strong><\/li>\n<li><strong>הצעת מחיר רשמית, אישור הזמנה ותזכורות:<\/strong> ב<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>.<\/li>\n<\/ul>\n<h3>1. דף ההצעה (לשליחה כ־PDF או במייל)<\/h3>\n<blockquote>\n<h1>עם קים — כולם משחקים! 🟡<\/h1>\n<p><strong>קים<\/strong> היא כוכבת ילדים אנרגטית, מצחיקה וספורטיבית, ובמופע שלה הילדים לא יושבים ומסתכלים. <strong>הם משחקים איתה.<\/strong><\/p>\n<p>[30 / 45] דקות של תנועה, אתגרים, צחוק וריקוד, שבהן כל ילד וילדה לוקחים חלק.<\/p>\n<p><strong>מה קורה במופע<\/strong><\/p>\n<ul>\n<li>🏃 <strong>משחקי תנועה:<\/strong> ״קים אומרת״ ו״הפסל של קים״<\/li>\n<li>🎲 <strong>קוביית קים:<\/strong> ילד/ה זורק/ת, וכל החדר מבצע<\/li>\n<li>😂 <strong>קים משתגעת:<\/strong> קים ״מתקלקלת״, והילדים מצילים אותה<\/li>\n<li>🤝 <strong>המסלול של קים:<\/strong> מצליחים רק ביחד<\/li>\n<li>💃 <strong>הריקוד של קים:<\/strong> ריקוד פשוט שכולם יוצאים איתו הביתה<\/li>\n<li>🌬️ <strong>סיום רגוע:<\/strong> נשימה ותודה, וקבוצה שקטה בסוף<\/li>\n<\/ul>\n<p><strong>למה זה עובד<\/strong><\/p>\n<ul>\n<li><strong>אין צופים, יש שחקנים.<\/strong> אין מפסידים ואף אחד לא יושב בצד<\/li>\n<li><strong>ניסיון מעשי<\/strong> בהדרכת תנועה ומשחק לילדים ובתיאטרון<\/li>\n<li><strong>מותאם לגיל:<\/strong> מופע אחר לגן ואחר לכיתה ב׳<\/li>\n<li><strong>בטיחות קודם:<\/strong> הכל במקום ובבועה האישית, בלי הרמות ובלי מגע שהילד/ה לא בחר/ה<\/li>\n<li><strong>מגיעה עם הכל:<\/strong> רמקול, מוזיקה, ציוד משחק ומדבקה לכל ילד/ה<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>גילאים<\/td>\n<td>3–8<\/td>\n<\/tr>\n<tr>\n<td>משך<\/td>\n<td>30 דק׳ (3–4), 45 דק׳ (5–8)<\/td>\n<\/tr>\n<tr>\n<td>מספר ילדים<\/td>\n<td>עד [___]<\/td>\n<\/tr>\n<tr>\n<td>מקום<\/td>\n<td>פנים, או חוץ בצל מלא<\/td>\n<\/tr>\n<tr>\n<td>אזור<\/td>\n<td>[___]<\/td>\n<\/tr>\n<tr>\n<td>מחיר<\/td>\n<td>[___] ₪<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>📞 [טלפון] · 💬 [וואטסאפ] · 📧 [אימייל] · 📸 [@שם_משתמש] · 🎬 [קישור לסרטון]<\/p>\n<p><em>צילום ילדים לפרסום, רק באישור חתום של הורים.<\/em><\/p>\n<\/blockquote>\n<h3>2. פסקה מותאמת לכל סוג לקוח (מחליפה את הפסקה הראשונה בדף)<\/h3>\n<p><strong>לגננת:<\/strong><\/p>\n<blockquote>\n<p>״קים מגיעה לגן עם מופע תנועה ומשחק של
