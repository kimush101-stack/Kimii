n<tr>\n<th>אפליקציה<\/th>\n<th>מה טוב<\/th>\n<th>על מה לשים לב<\/th>\n<th>מקור<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Edits<\/strong> (של Instagram/Meta)<\/td>\n<td>חינמית. לפי דף האפליקציה: ייצוא ב־4K <strong>בלי סימן מים<\/strong>, כתוביות אוטומטיות<\/td>\n<td>מחוברת לחשבון Instagram. <strong>לבדוק<\/strong> תמיכה בכתוביות בעברית. Meta אמרו שייתכן שיגבו כסף על חלק מתכונות ה־AI בעתיד<\/td>\n<td><a href=\"https://apps.apple.com/app/6738967378\">App Store — Edits<\/a> · <a href=\"https://www.socialmediatoday.com/news/instagram-announces-launch-edits-video-editing-app/\">Social Media Today<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>CapCut<\/strong><\/td>\n<td>פופולרית מאוד, הרבה תבניות, כתוביות אוטומטיות (״Auto captions״)<\/td>\n<td>יש גרסת Pro בתשלום, וייתכן שחלק מהתכונות (כולל כתוביות) נעולות. <strong>לבדוק<\/strong>. תנאי השימוש עודכנו ביוני 2025 ונותנים לחברה רישיון רחב לתוכן שמעלים, מה שעורר ביקורת<\/td>\n<td><a href=\"https://www.capcut.com/help/auto-captions\">CapCut Help — Auto captions<\/a> · <a href=\"https://www.techloy.com/capcuts-latest-terms-of-service-raises-big-questions-about-content-ownership/\">Techloy על תנאי השימוש<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>InShot<\/strong><\/td>\n<td>פשוטה מאוד, טובה למתחילות<\/td>\n<td>בגרסה החינמית מתווסף <strong>סימן מים<\/strong>. מסירים אותו בצפייה בפרסומת או במנוי Pro (<strong>לבדוק<\/strong>; המקור הוא בלוג של אפליקציה מתחרה)<\/td>\n<td><a href=\"https://spliceapp.com/blog/best-free-alternative-to-inshot\">Splice blog<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>העורך המובנה<\/strong> באינסטגרם, בטיקטוק וביוטיוב<\/td>\n<td>אין צורך באפליקציה נוספת, עם טקסט ומוזיקה מהספרייה<\/td>\n<td>פחות שליטה, וקשה להשתמש באותה עריכה בכמה פלטפורמות<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>איך בוחרים (בדיקה של 10 דקות):<\/strong> מצלמים 10 שניות שבהן קים אומרת: ״קים אומרת לקפוץ! עם קים... כולם משחקים!״. מעלים ל־Edits ול־CapCut ובודקים: <strong>(1)<\/strong> הכתוביות האוטומטיות זיהו עברית? <strong>(2)<\/strong> סימני הפיסוק במקום? <strong>(3)<\/strong> יש סימן מים בייצוא? בוחרים אחת ונשארים איתה חודש.<\/p>\n<p><strong>פרטיות בעריכה:<\/strong> אפליקציות עריכה רבות שומרות פרויקטים בענן, ותנאי השימוש שלהן רחבים. <strong>סרטונים שבהם רואים ילדים (גם באישור) עדיף לערוך בכלי שעובד על המכשיר, בלי גיבוי ענן של האפליקציה<\/strong>, ולקרוא את תנאי השימוש לפני שמעלים. סרטונים של קים לבד הם פחות רגישים.<\/p>\n<h3>10 הצעדים<\/h3>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>צעד<\/th>\n<th>מה בודקים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>ייבוא<\/strong> של הטייק המועדף, ההוק הכי טוב והסיום הכי טוב<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>חיתוך ההתחלה:<\/strong> הפריים הראשון הוא כבר תנועה<\/td>\n<td>בלי ״טייק 2״, בלי נשימה, בלי שנייה ריקה<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>בדיקת 2 השניות:<\/strong> צופים רק ב־2 השניות הראשונות. מבינים מה המשחק?<\/td>\n<td>אם לא, מחליפים להוק אחר מהבנק<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><strong>חיתוכים מהירים:<\/strong> מורידים כל הפסקה מיותרת בין ביטים (״ג׳אמפ־קאטים״)<\/td>\n<td>לא חותכים את הפאוזה של ״עם קים...״. היא מכוונת<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><strong>זום לנקודות חזקות:<\/strong> הגדלה של 110–130% ברגעי תגובה (חשד, הפתעה)<\/td>\n<td>לא יותר מ־3–4 פעמים בסרטון<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><strong>טקסט על המסך:<\/strong> לפי עמודת ״טקסט על המסך״ ב<a href=\"03-video-scripts.md\">תסריטים<\/a>, כבר מהפריים הראשון<\/td>\n<td>במרכז, באזור הבטוח (פרק 5)<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td><strong>כתוביות<\/strong> אוטומטיות, ואז <strong>הגהה ידנית מלאה<\/strong><\/td>\n<td>פרק 10<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td><strong>מוזיקה ואפקטים:<\/strong> מוזיקה <strong>בשקט מתחת לקול<\/strong>. 1–2 אפקטי סאונד לכל היותר<\/td>\n<td>הקול של קים תמיד מעל המוזיקה<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td><strong>כרטיס סיום:<\/strong> לוגו ושם משתמש. <strong>שומרים כתבנית<\/strong> ומשתמשים בה כל פעם<\/td>\n<td>אותו צליל סיום בכל סרטון<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td><strong>ייצוא:<\/strong> 1080×1920, 30 פריימים (או 60 אם צולם ב־60)<\/td>\n<td>קובץ נקי, <strong>בלי סימן מים<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>זמן עריכה צפוי:<\/strong> 30–45 דקות לסרטון בהתחלה, ופחות אחרי כמה שבועות של תרגול. זו הערכה, וזה משתנה מאדם לאדם.<\/p>\n<p><strong>קיצור דרך:<\/strong> אחרי שהסרטון הראשון יוצא טוב, <strong>שכפלי את הפרויקט<\/strong> ורק החליפי את הקטעים. הסגנון של הטקסט, הכתוביות וכרטיס הסיום נשאר אחיד, וכך נבנה מותג.<\/p>\n<h3>מוזיקה<\/h3>\n<ul>\n<li><strong>משתמשים במוזיקה רק מתוך הספרייה של האפליקציה<\/strong> שבה מפרסמים, או ממוזיקה שבטוח מותר להשתמש בה. שיר מסחרי שמוסיפים בעריכה חיצונית עלול להיות מושתק או חסום אחרי ההעלאה.<\/li>\n<li><strong>חשבון עסקי<\/strong> ב־Instagram וב־TikTok עשוי לקבל ספריית מוזיקה מצומצמת יותר (מוזיקה מסחרית מאושרת). <strong>לבדוק<\/strong> בהגדרות כשתבחרי סוג חשבון.<\/li>\n<li><strong>הקול של קים, כפיים ואפקטים מקוריים<\/strong> הם תמיד הכי בטוחים, וגם הכי מזוהים עם המותג.<\/li>\n<li>זכויות על מוזיקה <strong>במופעים<\/strong> (לא ברשת) הן נושא נפרד, שמופיע ב<a href=\"13-legal-admin.md\">מסמך המשפטי והמנהלי<\/a>.<\/li>\n<\/ul>\n<hr />\n<h2>10. כתוביות בעברית<\/h2>\n<p><strong>למה תמיד:<\/strong> הרבה הורים צופים בלי סאונד (בעבודה, ליד ילד ישן), והכתוביות עוזרות גם לצופים עם לקות שמיעה.<\/p>\n<table>\n<thead>\n<tr>\n<th>כלל<\/th>\n<th>איך<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>גודל<\/strong><\/td>\n<td>גדול. עד 2 שורות, ובערך 4–6 מילים בשורה<\/td>\n<\/tr>\n<tr>\n<td><strong>ניגודיות<\/strong><\/td>\n<td>טקסט לבן עם קו מתאר כהה, או טקסט כהה על ״קופסה״ צהובה של המותג. לבדוק שקריא גם במסך בהיר<\/td>\n<\/tr>\n<tr>\n<td><strong>גופן<\/strong><\/td>\n<td><strong>לבדוק שהגופן תומך בעברית.<\/strong> חלק מהגופנים באפליקציות לא כוללים אותיות עבריות ומציגים ריבועים או גופן אחר. אם יש גופן מותג ב<a href=\"15-costume-and-logo.md\">מפרט הלוגו<\/a>, להשתמש בו<\/td>\n<\/tr>\n<tr>\n<td><strong>מיקום<\/strong><\/td>\n<td>מרכז־תחתון של המסך, <strong>מעל<\/strong> הרצועה התחתונה שהממשק מכסה (פרק 5)<\/td>\n<\/tr>\n<tr>\n<td><strong>הגהה<\/strong><\/td>\n<td>כתוביות אוטומטיות בעברית טועות. <strong>טעות צפויה:<\/strong> ״קים״ ייכתב ״קיים״ או ״קם״. עוברים מילה מילה<\/td>\n<\/tr>\n<tr>\n<td><strong>פיסוק<\/strong><\/td>\n<td>באפליקציות רבות סימני קריאה ושאלה ״קופצים״ לצד הלא נכון בעברית. אם זה קורה, להקליד את הסימן בתחילת השורה ולבדוק בתצוגה, או לוותר עליו<\/td>\n<\/tr>\n<tr>\n<td><strong>עקביות<\/strong><\/td>\n<td>״כולם משחקים!״ נכתב תמיד אותו דבר, באותו צבע ובאותו מקום<\/td>\n<\/tr>\n<tr>\n<td><strong>הדגשה<\/strong><\/td>\n<td>מילת המפתח (״קופאים!״, ״עצור!״) בצבע המותג<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>כתוביות צרובות או כתוביות של הפלטפורמה?<\/strong> צורבים את הכתוביות לתוך הסרטון בעריכה. כך הן נראות בכל מקום, כולל בעמוד הנחיתה ובווטסאפ. על כתוביות אוטומטיות של הפלטפורמות בעברית לא סומכים (<strong>לבדוק<\/strong> בכל פלטפורמה).<\/p>\n<hr />\n<h2>11. ניהול קבצים וגיבוי<\/h2>\n<ul>\n<li><strong>שמות קבצים:<\/strong> <code>שבוע-סרטון-תיאור<\/code>, למשל <code>W1-V2-hakaf-veharegel-FINAL<\/code>. גרסה סופית תמיד עם <code>FINAL<\/code>.<\/li>\n<li><strong>תיקיות:<\/strong> <code>1-גולמי<\/code> · <code>2-בעריכה<\/code> · <code>3-מוכן לפרסום<\/code> · <code>4-פורסם<\/code> · <code>בלופרים<\/code> · <code>בנק הוקים וסיומים<\/code>.<\/li>\n<li><strong>גיבוי<\/strong> אחרי כל יום צילום, למחשב או לענן <strong>פרטי<\/strong> (לא תיקייה משותפת).<\/li>\n<li><strong>חומר עם ילדים:<\/strong> בתיקייה נפרדת, עם האישורים החתומים לידה (כמו ב<a href=\"08-consent-template.md\">נוסח האישור<\/a>). לא משתפים קישור לתיקייה הזו עם אף אחד.<\/li>\n<li><strong>סרטון סופי נקי<\/strong> (בלי סימן מים של אפליקציה או פלטפורמה) נשמר תמיד. ממנו מעלים לכל הפלטפורמות, ממנו לעמוד הנחיתה וממנו לפניות.<\/li>\n<\/ul>\n<hr />\n<h2>12. כללי הפלטפורמות לגבי ילדים — חובה לקרוא<\/h2>\n<p>התוכן של קים פונה לילדים, ולכן חלים עליו כללים מיוחדים. אלה הדברים שמצאתי; <strong>הכללים משתנים<\/strong>, אז <strong>לבדוק<\/strong> בדפי העזרה לפני פתיחת כל ערוץ.<\/p>\n<h3>YouTube — ״מיועד לילדים״ (Made for Kids)<\/h3>\n<ul>\n<li><strong>חובה לסמן:<\/strong> כל יוצר, <strong>בכל מדינה<\/strong>, חייב להצהיר אם התוכן שלו ״מיועד לילדים״. אפשר לסמן ברמת הערוץ או ברמת כל סרטון. לפי YouTube: <em>״Regardless of your location, you're legally required to comply with the Children's Online Privacy Protection Act (COPPA) and/or other laws״<\/em> (מקור: <a href=\"https://support.google.com/youtube/answer/9527654\">YouTube Help — Set your channel or video's audience<\/a>).<\/li>\n<li><strong>מתי תוכן נחשב ״מיועד לילדים״:<\/strong> YouTube בודקת בין השאר אם ילדים הם קהל היעד העיקרי, ואם יש דמויות, משחקים, שירים ופעילויות שמכוונים לילדים (מקור: <a href=\"https://support.google.com/youtube/answer/9528076\">YouTube Help — Determining if your content is \"made for kids\"<\/a>). <strong>התוכן של קים עונה על הקריטריונים האלה כמעט בוודאות.<\/strong> תוכן לא נחשב ״מיועד לילדים״ רק כי הוא מתאים לכל המשפחה (מקור: <a href=\"https://support.google.com/youtube/answer/9684541\">YouTube FAQ<\/a>), אבל אצל קים הכוונה לפנות לילדים ברורה.<\/li>\n<li><strong>מה נכבה בתוכן ״מיועד לילדים״:<\/strong> בין השאר <strong>תגובות<\/strong>, <strong>התראות (פעמון)<\/strong>, כרטיסים ומסכי סיום, נגן מוקטן ופרסום מותאם אישית (מקורות: <a href=\"https://support.google.com/youtube/answer/9528076\">YouTube Help 9528076<\/a>, <a href=\"https://www.broadcastbeat.com/how-coppa-affects-online-video\">Broadcast Beat<\/a>). את הרשימה המלאה והעדכנית <strong>לבדוק<\/strong> בדף העזרה.<\/li>\n<li><strong>אם מסמנים לא נכון:<\/strong> לפי YouTube, אפשר להיקלע לבעיות מול רשויות, ו־YouTube עשויה לנקוט צעדים נגד החשבון ולשנות את הסימון בעצמה (מקור: <a href=\"https://support.google.com/youtube/answer/9527654\">YouTube Help 9527654<\/a>).<\/li>\n<li><strong>המשמעות בשבילך:<\/strong><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> לסמן את ערוץ היוטיוב <strong>״כן, מיועד לילדים״<\/strong>. <strong>לא<\/strong> לסמן ״לא מיועד לילדים״ רק כדי לקבל תגובות<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ביוטיוב <strong>אין<\/strong> קריאה ״כתבו בתגובות״. הטקסט על המסך הוא ״עכשיו תעשו את זה עם אמא או אבא!״ (ראי <a href=\"03-video-scripts.md\">התסריטים<\/a>)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> להתייחס ליוטיוב כ״ספרייה״ של משחקים שמשפחות חוזרות אליה, לא כמקום לשיחה עם הקהל<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> אם יש לך ספק לגבי הסימון, להעלות אותו ב<a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a> או מול עורך/ת דין (ראי <a href=\"13-legal-admin.md\">מסמך משפטי<\/a>)<\/li>\n<\/ul>\n<h3>TikTok<\/h3>\n<ul>\n<li><strong>גיל מינימום לחשבון: 13.<\/strong> הודעות פרטיות מגיל 16, ושידור חי מגיל 18 (מקור: <a href=\"https://www.tiktok.com/community-guidelines/en/youth-safety\">TikTok Community Guidelines — Youth Safety<\/a>; <a href=\"https://www.tiktok.com/safety/en/policies-and-engagement/youth-safety\">TikTok Safety — Youth safety<\/a>).<\/li>\n<li>TikTok אוסרת תוכן שעלול לפגוע בצעירים פיזית, רגשית או התפתחותית (שם). זו עוד סיבה להקפיד על חוקי הבטיחות בתסריטים.<\/li>\n<li><strong>לא מצאתי<\/strong> ב־TikTok סימון ״מיועד לילדים״ כמו ביוטיוב (<strong>לבדוק<\/strong> בהגדרות כשתפתחי חשבון).<\/li>\n<li><strong>המשמעות בשבילך:<\/strong> הקהל שם הוא <strong>הורים<\/strong> (ובני נוער). מדברים אליהם בכיתוב, ולא מבקשים מילדים לעקוב או להגיב.<\/li>\n<\/ul>\n<h3>Instagram<\/h3>\n<ul>\n<li><strong>גיל מינימום לחשבון: 13<\/strong> לפי תנאי השימוש (<strong>לבדוק<\/strong> בתנאים העדכניים).<\/li>\n<li><strong>חשבונות שמנוהלים בידי מבוגרים ומציגים בעיקר ילדים:<\/strong> ב־2025 הודיעה Meta על הגנות מחמירות לחשבונות כאלה: הגדרות ההודעות המחמירות ביותר, סינון תגובות פוגעניות (״Hidden Words״) שמופעל אוטומטית, ופחות הצגה של החשבון למבוגרים חשודים (מקור: <a href=\"https://www.mediapost.com/publications/article/407636/meta-tightens-restrictions-on-child-facing-account.html\">MediaPost<\/a>). החשבון של קים מציג <strong>את קים<\/strong>, אז ייתכן שזה לא יחול עליו. <strong>לבדוק<\/strong>, ובכל מקרה להפעיל סינון בעצמך (למטה).<\/li>\n<li><strong>המשמעות בשבילך:<\/strong> Instagram הוא כנראה המקום שבו הורים וגננות ישלחו לך הודעות, ולכן ההודעות נשארות פתוחות, אבל עם סינון.<\/li>\n<\/ul>\n<h3>בישראל<\/h3>\n<p>חוק הגנת הפרטיות עודכן (תיקון 13 נכנס לתוקף באוגוסט 2025; מקור: <a href=\"https://www.loc.gov/item/global-legal-monitor/2025-11-17/israel-amendment-to-privacy-protection-law-goes-into-effect/\">Library of Congress<\/a>). מה זה אומר לגבי צילום ופרסום ילדים ולגבי שמירת אישורים מפורט ב<a href=\"13-legal-admin.md\">מסמך המשפטי והמנהלי<\/a> וב<a href=\"08-consent-template.md\">נוסח האישור<\/a>.<\/p>\n<h3>ניהול תגובות והודעות (בכל הפלטפורמות)<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> להפעיל <strong>סינון תגובות<\/strong> (באינסטגרם ״Hidden Words״, ובטיקטוק סינון מילים), ולהוסיף מילים פוגעניות בעברית<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> למחוק מיד ולחסום תגובות לא הולמות. לא להתווכח בתגובות<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא לנהל שיחה פרטית עם ילד.<\/strong> אם ילד כותב, תשובה קצרה וחמה: ״איזה כיף! תבקשו מאמא או אבא לכתוב לי״<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> פנייה על הזמנה עוברת לווטסאפ או לטלפון לפי <a href=\"12-booking-process.md\">תהליך ההזמנה<\/a><\/li>\n<\/ul>\n<hr />\n<h2>13. מה עובד בכל פלטפורמה<\/h2>\n<blockquote>\n<p><strong>המלצת עבודה<\/strong> (ההחלטה הסופית בפגישה עם המשווק, <a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a>): <strong>Instagram כפלטפורמה ראשית<\/strong>, YouTube Shorts <strong>כספרייה<\/strong>, ו־TikTok <strong>כניסוי חשיפה<\/strong>. מעלים את אותו סרטון לכולן.<\/p>\n<\/blockquote>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Instagram Reels<\/th>\n<th>TikTok<\/th>\n<th>YouTube Shorts<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>התפקיד אצלך<\/strong><\/td>\n<td>הורים וגננות בישראל. הודעות פרטיות ו<strong>הזמנות<\/strong>. סטוריז לבניית אמון<\/td>\n<td>חשיפה לקהל חדש של הורים צעירים<\/td>\n<td>ספרייה למשפחות, שנשארת לאורך זמן. ״מיועד לילדים״<\/td>\n<\/tr>\n<tr>\n<td><strong>אורך מקסימלי<\/strong><\/td>\n<td>עד 3 דקות (הוכרז בינואר 2025; <a href=\"https://www.etvbharat.com/en/!technology/instagram-increases-reels-length-to-3-minutes-changing-to-long-form-video-format-enn25012001576\">ETV Bharat<\/a>, <strong>לבדוק<\/strong>)<\/td>\n<td>ארוך בהרבה ממה שאת צריכה<\/td>\n<td>עד 3 דקות מאוקטובר 2024 (<a href=\"https://routenote.com/blog/how-long-can-youtube-shorts-be/\">RouteNote<\/a>, <strong>לבדוק<\/strong>)<\/td>\n<\/tr>\n<tr>\n<td><strong>האורך שלך<\/strong><\/td>\n<td>20–45 שניות<\/td>\n<td>20–45 שניות<\/td>\n<td>20–45 שניות<\/td>\n<\/tr>\n<tr>\n<td><strong>האשטגים<\/strong><\/td>\n<td>עד 5 (<a href=\"https://www.socialmediatoday.com/news/instagram-implements-new-limits-on-hashtag-use/808309/\">Social Media Today<\/a>)<\/td>\n<td>3–5<\/td>\n<td>1–3 בתיאור<\/td>\n<\/tr>\n<tr>\n<td><strong>תגובות<\/strong><\/td>\n<td>פתוחות, עם סינון<\/td>\n<td>פתוחות, עם סינון<\/td>\n<td>כבויות (מיועד לילדים)<\/td>\n<\/tr>\n<tr>\n<td><strong>קריאה לפעולה<\/strong><\/td>\n<td>״הורים, כתבו לנו...״<\/td>\n<td>אותו דבר<\/td>\n<td>״עכשיו תעשו את זה עם אמא או אבא!״<\/td>\n<\/tr>\n<tr>\n<td><strong>כלים שימושיים<\/strong><\/td>\n<td><strong>סטוריז והיילייטס<\/strong>, תגובה מוצמדת, <strong>Trial Reels<\/strong> לבדיקת הוקים מול לא־עוקבים (<a href=\"https://creators.instagram.com/blog/instagram-trial-reels\">Instagram Creators<\/a>, זכאות <strong>לבדוק<\/strong>), פוסט משותף (Collab) עם גן או מתנ״ס, רק באישור<\/td>\n<td>הצמדת סרטון ההיכרות לפרופיל<\/td>\n<td>כותרת ברורה: ״[שם המשחק] · משחקים עם קים״<\/td>\n<\/tr>\n<tr>\n<td><strong>בשעה הראשונה<\/strong><\/td>\n<td>לענות לכל תגובה ולשתף לסטורי<\/td>\n<td>לענות לתגובות<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>מה לא לעשות<\/strong><\/td>\n<td>להעלות סרטון עם סימן מים של TikTok<\/td>\n<td>לבקש מילדים לעקוב<\/td>\n<td>לסמן ״לא מיועד לילדים״ כדי לקבל תגובות<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>ערוצים ישראליים שלא כדאי לשכוח:<\/strong><\/p>\n<ul>\n<li><strong>סטטוס וואטסאפ:<\/strong> כל סרטון עולה גם לשם. המעגל הקרוב שלך הוא המפיצים הראשונים.<\/li>\n<li><strong>קבוצות פייסבוק של הורים<\/strong> (לפי עיר או שכונה): לקרוא את חוקי הקבוצה <strong>לפני<\/strong> שמשתפים. לרוב מותר לשתף ״משחק לסוף השבוע״, ולא מודעת פרסום. לא לשתף באותה קבוצה יותר מפעם בשבועיים.<\/li>\n<\/ul>\n<hr />\n<h2>14. צ׳קליסט פרסום — להעתיק לכל סרטון<\/h2>\n<h3>לפני ההעלאה<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> צפיתי בסרטון המלא <strong>עם<\/strong> סאונד ו<strong>בלי<\/strong> סאונד<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ב־2 השניות הראשונות ברור מה המשחק<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> הכתוביות עברו הגהה (״קים״ ולא ״קיים״), ושום טקסט לא מוסתר בידי הממשק<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אין ילד מזוהה<\/strong> בלי אישור חתום. <strong>אין פרט מזהה<\/strong> של הבית, של מוסד או של מיקום<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> כרטיס הסיום קיים, ושם המשתמש נכון<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> קובץ נקי (בלי סימן מים), 1080×1920<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> בחרתי תמונת שער, והכותרת בה באמצע הגובה (רשת הפרופיל חותכת)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> הכיתוב וההאשטגים הועתקו מ<a href=\"03-video-scripts.md\">התסריטים<\/a><\/li>\n<\/ul>\n<h3>Instagram<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> כיתוב ועד 5 האשטגים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> תמונת שער<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> הסרטון מוצג גם בפיד או ברשת הפרופיל<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> (לא חובה) Trial Reel לניסוי הוק<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> תגובה מוצמדת עם שאלה להורים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> סינון התגובות פעיל<\/li>\n<\/ul>\n<h3>TikTok<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> העליתי את <strong>הקובץ הנקי<\/strong> (לא הורדה מאינסטגרם)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> כיתוב ו־3–5 האשטגים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> תמונת שער<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> סינון התגובות פעיל<\/li>\n<\/ul>\n<h3>YouTube Shorts<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> כותרת: ״[שם המשחק] · משחקים עם קים״<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>קהל: ״כן, מיועד לילדים״<\/strong><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> שורה ראשונה בתיאור: מה המשחק ולאיזה גיל הוא מתאים (בלי הבטחות התפתחותיות)<\/li>\n<\/ul>\n<h3>אחרי הפרסום<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> בשעה הראשונה: עניתי לכל התגובות<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> שיתפתי לסטורי ולסטטוס וואטסאפ<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> רשמתי בגיליון המדדים: תאריך, שעה ואורך<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אחרי 48 שעות:<\/strong> מילאתי מדדים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אחרי 7 ימים:<\/strong> מילאתי מדדים שוב<\/li>\n<\/ul>\n<hr />\n<h2>15. גיליון מדדים<\/h2>\n<p><strong>איפה רואים נתונים:<\/strong> באינסטגרם צריך <strong>חשבון מקצועי<\/strong> (יוצר או עסקי; המעבר חינמי) כדי לקבל ״תובנות״. בטיקטוק יש ״Analytics״ בכלי היוצרים. ביוטיוב יש <strong>YouTube Studio<\/strong>. שמות התפריטים והמדדים משתנים מעת לעת, אז <strong>לבדוק<\/strong> באפליקציה.<\/p>\n<h3>מה מודדים ולמה<\/h3>\n<table>\n<thead>\n<tr>\n<th>מדד<\/th>\n<th>מה הוא אומר לך<\/th>\n<th>אם הוא נמוך<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>צפיות<\/strong><\/td>\n<td>כמה אנשים הסרטון הגיע אליהם<\/td>\n<td>לא להיבהל בהתחלה. בחודש הראשון המספרים קטנים, וזה נורמלי<\/td>\n<\/tr>\n<tr>\n<td><strong>צפייה ממוצעת או אחוז שצפו עד הסוף<\/strong><\/td>\n<td>האם הסרטון <strong>מחזיק<\/strong><\/td>\n<td>לקצר, להוריד הסברים, להעלות קצב<\/td>\n<\/tr>\n<tr>\n<td><strong>כמה נשארו אחרי השניות הראשונות<\/strong> (בגרף השימור, אם קיים)<\/td>\n<td>האם <strong>ההוק<\/strong> עובד<\/td>\n<td>להחליף הוק (בנק ההוקים ב<a href=\"03-video-scripts.md\">תסריטים<\/a>)<\/td>\n<\/tr>\n<tr>\n<td><strong>שמירות<\/strong><\/td>\n<td>הורים שומרים ״לאחר כך״, כלומר הסרטון <strong>שימושי<\/strong><\/td>\n<td>לחזק בכיתוב את ״למה זה טוב ואיך משחקים בבית״<\/td>\n<\/tr>\n<tr>\n<td><strong>שיתופים או שליחות<\/strong><\/td>\n<td>הורים מעבירים להורים אחרים. <strong>הקהל המפיץ<\/strong><\/td>\n<td>לעשות משחק שקל יותר לשחק ביחד, ולבקש ״שלחו להורה ש...״<\/td>\n<\/tr>\n<tr>\n<td><strong>תגובות עם תשובה לאתגר<\/strong><\/td>\n<td>הילדים <strong>באמת שיחקו<\/strong><\/td>\n<td>לשאול שאלה פשוטה יותר (מספר, מילה אחת)<\/td>\n<\/tr>\n<tr>\n<td><strong>עוקבים חדשים מהסרטון<\/strong><\/td>\n<td>אנשים רוצים עוד<\/td>\n<td>לוודא שהפרופיל מסביר מה מקבלים<\/td>\n<\/tr>\n<tr>\n<td><strong>פניות על הופעות<\/strong> (הודעות או לחיצות על הקישור)<\/td>\n<td><strong>הביקוש העסקי.<\/strong> המדד הכי חשוב<\/td>\n<td>ביו, היילייט ״להזמנות״, וכיתוב אחד מתוך שלושה שמזכיר הזמנות<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>חישובים פשוטים (במחשבון)<\/h3>\n<ul>\n<li><strong>שיעור הפצה<\/strong> = (שמירות + שיתופים) ÷ צפיות × 100<\/li>\n<li><strong>שיעור שימור<\/strong> = צפייה ממוצעת בשניות ÷ אורך הסרטון בשניות × 100<\/li>\n<\/ul>\n<h3>הגיליון — שורה לכל סרטון ולכל פלטפורמה<\/h3>\n<p>(אפשר להעתיק לגוגל שיטס, עמודה לכל כותרת.)<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>שם<\/th>\n<th>פורמט<\/th>\n<th>פלטפורמה<\/th>\n<th>תאריך ושעה<\/th>\n<th>אורך (שנ׳)<\/th>\n<th>צפיות 48ש׳<\/th>\n<th>צפיות 7 ימים<\/th>\n<th>צפייה ממוצעת (שנ׳)<\/th>\n<th>שימור %<\/th>\n<th>שמירות<\/th>\n<th>שיתופים<\/th>\n<th>שיעור הפצה %<\/th>\n<th>תגובות־אתגר<\/th>\n<th>עוקבים חדשים<\/th>\n<th>פניות<\/th>\n<th>מה למדתי<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>אתם יודעים לשחק?<\/td>\n<td>היכרות<\/td>\n<td>IG<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>הפסל של קים<\/td>\n<td>משחקים<\/td>\n<td>IG<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>הכף והרגל<\/td>\n<td>אתגר<\/td>\n<td>IG<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>...<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>סיכום שבועי (כל יום ו׳, 20 דקות)<\/h3>\n<table>\n<thead>\n<tr>\n<th>שבוע<\/th>\n<th>הסרטון הכי טוב (ולמה)<\/th>\n<th>הסרטון הכי חלש (ולמה)<\/th>\n<th>פניות השבוע<\/th>\n<th>מה משנים בשבוע הבא<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>16. אחרי 4 שבועות — במה להשקיע<\/h2>\n<p><strong>המטרה:<\/strong> לצאת עם החלטה ברורה לחודש 2: איזה פורמט מקבל יותר מקום, אילו הוקים עובדים, ואיזו פלטפורמה ראשית. כל זה מבוסס על נתונים, לא על תחושה.<\/p>\n<blockquote>\n<p><strong>לפני שמתחילים, שתי אזהרות:<\/strong>\n1. <strong>12 סרטונים זה מדגם קטן.<\/strong> סרטון ״ויראלי״ אחד יכול לעוות הכל. לכן משווים <strong>חציון<\/strong> (הערך האמצעי) של כל פורמט, לא ממוצע.\n2. <strong>משווים אותך לעצמך<\/strong>, לא לחשבונות אחרים. אין ״מספר טוב״ כללי. יש ״טוב יותר מהחציון שלי״.<\/p>\n<\/blockquote>\n<h3>שלב 1 — ניקוד לכל פורמט (שעה אחת)<\/h3>\n<ol>\n<li>מהגיליון לוקחים את <strong>נתוני 7 הימים<\/strong> של 12 הסרטונים (בפלטפורמה הראשית).<\/li>\n<li>לכל פורמט (4 סרטונים) מחשבים <strong>חציון<\/strong> של כל מדד בטבלה למטה.<\/li>\n<li>בכל מדד: הפורמט הכי טוב מקבל 3 נקודות, השני 2 והאחרון 1.<\/li>\n<li>מכפילים במשקל ומחברים.<\/li>\n<\/ol>\n<table>\n<thead>\n<tr>\n<th>מדד<\/th>\n<th>משקל<\/th>\n<th>משחקים עם קים<\/th>\n<th>אתגר קים<\/th>\n<th>קים משתגעת<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>פניות על הופעות<\/td>\n<td>×3<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>שיעור הפצה (שמירות + שיתופים)<\/td>\n<td>×2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>שיעור שימור<\/td>\n<td>×2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>תגובות־אתגר<\/td>\n<td>×1<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>צפיות<\/td>\n<td>×1<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>סה״כ<\/strong> (מקסימום 27)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>דוגמה להמחשה בלבד (מספרים מומצאים, לא תחזית):<\/strong> אם ב״אתגר קים״ יצאו 3 בפניות (×3 = 9), 3 בהפצה (×2 = 6), 2 בשימור (×2 = 4), 3 בתגובות (×1 = 3) ו־2 בצפיות (×1 = 2), הסה״כ הוא 24. אם שני הפורמטים האחרים קיבלו 15 ו־15, ״אתגר קים״ מוביל בבירור.<\/p>\n<h3>שלב 2 — כללי החלטה<\/h3>\n<table>\n<thead>\n<tr>\n<th>אם...<\/th>\n<th>אז...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>פורמט אחד מוביל בבירור<\/strong> (פער של 5 נקודות ומעלה)<\/td>\n<td>בחודש 2 הוא מקבל <strong>2 מתוך 3 סרטונים בשבוע<\/strong>, ושני האחרים מתחלפים בסלוט השלישי<\/td>\n<\/tr>\n<tr>\n<td><strong>כל הפורמטים קרובים<\/strong><\/td>\n<td>ממשיכים 1־1־1, ומשקיעים בשיפור ההוקים<\/td>\n<\/tr>\n<tr>\n<td><strong>סרטון בודד קיבל פי 3 מהחציון שלך<\/strong><\/td>\n<td>תוך שבוע מצלמים <strong>״חלק 2״<\/strong> באותו מבנה ובאותו סוג הוק. אם גם הוא מצליח, זו <strong>סדרה קבועה<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>השימור נמוך בכל הסרטונים<\/strong><\/td>\n<td>הבעיה בפתיחה, לא בפורמט: מצלמים מחדש הוקים, מקצרים ל־20–30 שניות ומורידים הסברים<\/td>\n<\/tr>\n<tr>\n<td><strong>שימור טוב, אבל מעט שמירות ושיתופים<\/strong><\/td>\n<td>הסרטון משעשע, אבל להורים הוא לא ״שימושי״. מחזקים בכיתוב את ״איך משחקים בבית ולמה זה טוב״, ובוחרים משחקים שקל לחזור עליהם<\/td>\n<\/tr>\n<tr>\n<td><strong>הרבה צפיות ותגובות, אבל אין פניות<\/strong><\/td>\n<td>חסר ״שביל״ להזמנה: ביו, היילייט ״להזמנות״, כיתוב אחד מתוך שלושה, סטוריז מהמופעים, ו<strong>פנייה יזומה<\/strong> (<a href=\"10-outreach-templates.md\">תבניות פנייה<\/a>)<\/td>\n<\/tr>\n<tr>\n<td><strong>הפניות מגיעות בעיקר מפלטפורמה אחת<\/strong><\/td>\n<td>היא הפלטפורמה הראשית. לאחרות מעלים את אותו סרטון, בלי להשקיע בהן זמן נוסף<\/td>\n<\/tr>\n<tr>\n<td><strong>שעה או יום מסוימים עובדים טוב יותר<\/strong><\/td>\n<td>מזיזים את ימי ושעות הפרסום<\/td>\n<\/tr>\n<tr>\n<td><strong>משחק שהצליח ברשת הצליח גם בפיילוט<\/strong> (<a href=\"05-pilot-feedback.md\">טופס תצפית<\/a>)<\/td>\n<td>זה <strong>משחק ליבה<\/strong> של המותג: נכנס קבוע ל<a href=\"02-show-script.md\">מופע<\/a> והופך לסדרה<\/td>\n<\/tr>\n<tr>\n<td><strong>שום דבר לא ממש עובד<\/strong><\/td>\n<td>4 שבועות זה קצר. ממשיכים עוד 4 שבועות עם הוקים משופרים לפני ששוקלים לשנות את הקונספט, ומביאים את הנתונים ל<a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>שלב 3 — תוכנית חודש 2 (למלא)<\/h3>\n<table>\n<thead>\n<tr>\n<th>שאלה<\/th>\n<th>ההחלטה שלי<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>הפורמט המוביל, שמקבל 2 סלוטים בשבוע<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>הפורמט או הפורמטים בסלוט המתחלף<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3 ההוקים הכי טובים, שבונים עליהם<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>סדרה חדשה (״חלק 2״)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>הפלטפורמה הראשית<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>ימי ושעות פרסום<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>דבר אחד שמפסיקים לעשות<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>ניסוי אחד חדש לחודש 2<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>מה <strong>לא<\/strong> מחליטים לבד בשלב הזה<\/h3>\n<ul>\n<li><strong>קידום ממומן<\/strong> (תשלום על חשיפה): רק אחרי שיש סרטון שהוכיח את עצמו, ועם תקציב ניסוי שנקבע ב<a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a>.<\/li>\n<li><strong>ציוד או עריכה בתשלום:<\/strong> לפי סדר ההשקעות ב<a href=\"01-concept.md\">קונספט<\/a>.<\/li>\n<\/ul>\n<hr />\n<h2>17. מקורות<\/h2>\n<p>נבדקו באוקטובר 2026. מדיניות הפלטפורמות ומחירים משתנים, אז <strong>לבדוק<\/strong> לפני שמסתמכים.<\/p>\n<p><strong>YouTube ו״מיועד לילדים״<\/strong><\/p>\n<ul>\n<li><a href=\"https://support.google.com/youtube/answer/9527654\">YouTube Help — Set your channel or video's audience<\/a><\/li>\n<li><a href=\"https://support.google.com/youtube/answer/9528076\">YouTube Help — Determining if your content is \"made for kids\"<\/a><\/li>\n<li><a href=\"https://support.google.com/youtube/answer/9684541\">YouTube Help — Frequently asked questions about \"made for kids\"<\/a><\/li>\n<li><a href=\"https://www.broadcastbeat.com/how-coppa-affects-online-video\">Broadcast Beat — How COPPA affects online video<\/a> (מקור משני)<\/li>\n<\/ul>\n<p><strong>TikTok<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.tiktok.com/community-guidelines/en/youth-safety\">TikTok Community Guidelines — Youth Safety<\/a><\/li>\n<li><a href=\"https://www.tiktok.com/safety/en/policies-and-engagement/youth-safety\">TikTok Safety — Youth safety and well-being<\/a><\/li>\n<\/ul>\n<p><strong>Instagram ו־Meta<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.socialmediatoday.com/news/instagram-implements-new-limits-on-hashtag-use/808309/\">Social Media Today — Instagram implements new limits on hashtag use<\/a><\/li>\n<li><a href=\"https://creators.instagram.com/blog/instagram-trial-reels\">Instagram Creators — Trial reels<\/a><\/li>\n<li><a href=\"https://www.mediapost.com/publications/article/407636/meta-tightens-restrictions-on-child-facing-account.html\">MediaPost — Meta tightens restrictions on child-facing accounts run by adults<\/a><\/li>\n<li><a href=\"https://www.etvbharat.com/en/!technology/instagram-increases-reels-length-to-3-minutes-changing-to-long-form-video-format-enn25012001576\">ETV Bharat — Instagram increases Reels length to 3 minutes<\/a> (מקור משני)<\/li>\n<li><a href=\"https://www.hopperhq.com/blog/instagram-reel-size/\">Hopper HQ — Instagram Reel size and safe zones<\/a> (מקור משני)<\/li>\n<\/ul>\n<p><strong>YouTube Shorts<\/strong><\/p>\n<ul>\n<li><a href=\"https://routenote.com/blog/how-long-can-youtube-shorts-be/\">RouteNote — How long can YouTube Shorts be<\/a> (מקור משני)<\/li>\n<\/ul>\n<p><strong>אפליקציות עריכה<\/strong><\/p>\n<ul>\n<li><a href=\"https://apps.apple.com/app/6738967378\">App Store — Edits: Video Editor<\/a><\/li>\n<li><a href=\"https://www.socialmediatoday.com/news/instagram-announces-launch-edits-video-editing-app/\">Social Media Today — Instagram announces Edits<\/a><\/li>\n<li><a href=\"https://www.capcut.com/help/auto-captions\">CapCut Help — Auto captions<\/a><\/li>\n<li><a href=\"https://www.techloy.com/capcuts-latest-terms-of-service-raises-big-questions-about-content-ownership/\">Techloy — CapCut's terms of service and content ownership<\/a><\/li>\n<li><a href=\"https://spliceapp.com/blog/best-free-alternative-to-inshot\">Splice blog — Free alternative to InShot<\/a> (בלוג של מתחרה, <strong>לבדוק<\/strong>)<\/li>\n<\/ul>\n<p><strong>ציוד (דוגמאות מחנות ישראלית; מחירים משתנים)<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bug.co.il/brand/hohem/mic/01/kit/1\">Bug — Hohem MIC-01 KIT 1<\/a><\/li>\n<li><a href=\"https://www.bug.co.il/brand/xiaomi/selfie/stick/tripod/mini/52cm/remote\">Bug — Xiaomi Selfie Stick Tripod Mini<\/a><\/li>\n<li><a href=\"https://www.bug.co.il/brand/gekkopod/color/black/gekkostick/\">Bug — GekkoStick<\/a><\/li>\n<\/ul>\n<p><strong>ישראל — פרטיות<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.loc.gov/item/global-legal-monitor/2025-11-17/israel-amendment-to-privacy-protection-law-goes-into-effect/\">Library of Congress — Israel: Amendment to Privacy Protection Law goes into effect<\/a><\/li>\n<\/ul>"}, "docs/10-outreach-templates.md": {"title": "תבניות פנייה: למי פונים, איפה מוצאים אותם, ומה כותבים", "html": "<h1>תבניות פנייה: למי פונים, איפה מוצאים אותם, ומה כותבים<\/h1>\n<blockquote>\n<p><strong>למה את צריכה את זה:<\/strong> הזמנות לא מגיעות רק מסרטונים. בהתחלה, <strong>רוב ההזמנות יגיעו מפנייה יזומה שלך<\/strong> ומהמלצות. הקובץ הזה נותן לך רשימה של 20 גופים ראשונים, הודעה מוכנה לכל סוג לקוח (וואטסאפ, מייל ושיחה), פולואפ אחרי 3 ו־7 ימים, ותשובות מוכנות ל״יקר״ ול״יש לנו כבר מפעיל״.<\/p>\n<p><strong>מתי:<\/strong> פנייה לגיוס פיילוט כבר <strong>בשבוע 3<\/strong> (חלק ה׳, תבנית 3ג). פנייה מלאה ב<strong>שבוע 4<\/strong>, אחרי שהצעת המופע והמחיר מוכנים (תוכנית 30 הימים ב<a href=\"01-concept.md\">מסמך הקונספט<\/a>, פרק 7).<\/p>\n<p><strong>הקצב:<\/strong> 10 פניות בשבוע הראשון, ואחר כך 5 פניות חדשות בשבוע + פולואפים. בערך <strong>3 בלוקים של 30 דקות בשבוע.<\/strong><\/p>\n<\/blockquote>\n<hr />\n<h2>חלק א׳ — חוקי הפנייה (קראי לפני הכל)<\/h2>\n<h3>8 הכללים שלך<\/h3>\n<ol>\n<li><strong>אישי, אחד־על־אחד.<\/strong> לא שולחים הודעה המונית, ולא רשימת תפוצה לאנשים שלא ביקשו.<\/li>\n<li><strong>בהודעה הכתובה הראשונה שואלים רשות:<\/strong> ״אפשר לשלוח לך פרטים?״, ונותנים דרך פשוטה להגיד לא.<\/li>\n<li><strong>מקסימום שני פולואפים, ואז מפסיקים.<\/strong> מי שלא ענה בכלל להודעה הראשונה, מקבל <strong>שיחת טלפון<\/strong>, לא עוד הודעה כתובה (חלק ה׳).<\/li>\n<li><strong>״לא״ זה לא.<\/strong> מסמנים בגיליון ״לא לפנות״, ולא פונים שוב.<\/li>\n<li><strong>קבוצות וואטסאפ ופייסבוק:<\/strong> קוראים את חוקי הקבוצה, ובמקרה של ספק שואלים את המנהל/ת. <strong>לא שולחים הודעות פרטיות לחברי קבוצה שלא מכירים אותך.<\/strong><\/li>\n<li><strong>בלי תמונות של ילדים<\/strong> בחומרי פנייה, אלא אם יש אישור הורים חתום <strong>לשימוש שיווקי<\/strong> (<a href=\"08-consent-template.md\">טופס אישור הצילום<\/a>).<\/li>\n<li><strong>רק אמת.<\/strong> לא כותבים ״מבוטחת״, ״עם אישור משטרה״ או ״הופעתי בעשרות גנים״ לפני שזה נכון (<a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a>).<\/li>\n<li><strong>בזמנים נכונים:<\/strong> לא בשישי אחה״צ, בשבת ובחגים. לגננות לא מתקשרים בשעות שהן עם הילדים; בהודעה הראשונה שואלים מתי נוח.<\/li>\n<\/ol>\n<h3>חוק הספאם בקצרה (לא ייעוץ משפטי)<\/h3>\n<table>\n<thead>\n<tr>\n<th>מה<\/th>\n<th>מה ידוע<\/th>\n<th>מקור<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מה אסור<\/strong><\/td>\n<td>לשלוח <strong>דבר פרסומת<\/strong> במייל, ב־SMS, בפקס או בחיוג אוטומטי בלי הסכמה מפורשת מראש של הנמען. נמען יכול לתבוע <strong>עד 1,000 ₪ על כל הודעה<\/strong>, בלי להוכיח נזק<\/td>\n<td><a href=\"https://www.kolzchut.org.il/he/פיצוי_בגין_משלוח_דברי_פרסומת_ללא_הסכמה_של_הנמען_(חוק_הספאם)\">כל זכות — חוק הספאם<\/a>; <a href=\"https://protocol.co.il/spam-law/\">פרוטוקול<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>פנייה חד־פעמית לעסק<\/strong><\/td>\n<td>לפי נוסח הסעיף כפי שהוא מצוטט בפסק דין שמצאתי בחיפוש, פנייה <strong>חד־פעמית<\/strong> לנמען <strong>שהוא עסק<\/strong>, שבה מציעים לו להסכים לקבל פרסומת, לא נחשבת הפרה. <strong>לא אימתתי<\/strong> את הנוסח מול ספר החוקים<\/td>\n<td>רקע: <a href=\"https://www.chamber.org.il/serviceslobby/legal/74023/115485/\">לשכת המסחר — חוק הספאם, רענון נהלים<\/a> · <strong>לבדוק<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>מה צריך בכל הודעת פרסומת<\/strong> (אחרי שהסכימו)<\/td>\n<td>לסמן בבירור שזו פרסומת (לפי המקורות: המילה ״פרסומת״ בתחילת ההודעה), שם ודרך התקשרות של השולח/ת, ואפשרות פשוטה לבקש להפסיק<\/td>\n<td>כמו למעלה · <strong>לבדוק<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>לקוחות קיימים<\/strong><\/td>\n<td>יש חריג למי שכבר קנה ממך, בתנאים מסוימים<\/td>\n<td>כמו למעלה · <strong>לבדוק<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>וואטסאפ<\/strong><\/td>\n<td><strong>לא מצאתי מקור ברור<\/strong> שקובע אם וואטסאפ נכלל. <strong>הנחת עבודה:<\/strong> מתייחסים לוואטסאפ כמו ל־SMS ולמייל<\/td>\n<td><strong>לבדוק<\/strong> עם עו״ד או ביועץ (<a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a>)<\/td>\n<\/tr>\n<tr>\n<td><strong>שיחת טלפון רגילה<\/strong> (את מדברת, לא הקלטה)<\/td>\n<td>ברשימת האמצעים שבמקורות לא מופיעה שיחה אנושית חיה<\/td>\n<td><strong>לבדוק<\/strong>. בכל מקרה: בנימוס, ובלי להתקשר שוב למי שביקש שלא<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>התרגום המעשי<\/h3>\n<table>\n<thead>\n<tr>\n<th>מצב<\/th>\n<th>מה עושים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>גננת, מתנ״ס, קייטנה, מפיק/ה (כולם עסקים או מוסדות), <strong>פנייה ראשונה בכתב<\/strong><\/td>\n<td>הודעה <strong>אחת<\/strong>, אישית, שמציגה אותך <strong>ושואלת אם אפשר לשלוח פרטים<\/strong>. בלי מחירון, בלי קובץ, לכל היותר קישור אחד<\/td>\n<\/tr>\n<tr>\n<td>ענו ״כן, תשלחי״<\/td>\n<td>זו הסכמה. שולחים את ההצעה (<a href=\"06-show-offer.md\">הצעת המופע<\/a>, חלק ה׳)<\/td>\n<\/tr>\n<tr>\n<td>לא ענו בכלל<\/td>\n<td><strong>שיחת טלפון<\/strong> ביום 3, ושיחה נוספת ביום 7. אם אין מענה, סוגרים ״אין מענה״<\/td>\n<\/tr>\n<tr>\n<td>הורים זרים<\/td>\n<td><strong>לא פונים אליהם בפרטי.<\/strong> הם מגיעים אלייך דרך פוסט בקבוצה, הרשתות או המלצה<\/td>\n<\/tr>\n<tr>\n<td>הורים מהמעגל שלך (חברים, משפחה)<\/td>\n<td>הודעה אישית, כמו שמדברים עם חברה. <strong>לא רשימת תפוצה<\/strong><\/td>\n<\/tr>\n<tr>\n<td>לקוח/ה שעבד/ה איתך<\/td>\n<td>לפי <a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>, תחנה 12: רק עם סיבה, ותמיד עם ״אם לא מתאים, רק תגידי״<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>חלק ב׳ — לפני שמתחילים: ערכת הפנייה<\/h2>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>סרטון ההיכרות<\/strong> עלה, ויש לו קישור (<a href=\"03-video-scripts.md\">תסריטי הווידאו<\/a>)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong><a href=\"../site/index.html\">עמוד הנחיתה<\/a><\/strong> באוויר, עם פרטי קשר אמיתיים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>דף ההצעה<\/strong> מוכן (<a href=\"06-show-offer.md\">הצעת המופע<\/a>, חלק ה׳)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מחירים<\/strong> ממולאים (<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>וואטסאפ ביזנס<\/strong> מותקן, עם תמונת פרופיל (הלוגו או את בתלבושת), תיאור קצר ותשובות מהירות (<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>גיליון ״לידים״<\/strong> פתוח (חלק ד׳)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>משפט היכרות<\/strong> אחד שלך, אמיתי (ממלאים פעם אחת ומשתמשים בכל התבניות):<\/li>\n<\/ul>\n<blockquote>\n<p>״אני קים נידם, [הניסיון האמיתי שלך במשפט, למשל: מדריכת תנועה לילדים ושחקנית], ואני מפעילה את ׳קים משחקים׳: מופע תנועה שבו הילדים לא צופים, אלא משחקים.״<\/p>\n<\/blockquote>\n<hr />\n<h2>חלק ג׳ — איפה מוצאים אנשי קשר<\/h2>\n<h3>לפי סוג לקוח<\/h3>\n<table>\n<thead>\n<tr>\n<th>סוג<\/th>\n<th>איפה מוצאים<\/th>\n<th>מי מחליט/ה<\/th>\n<th>הערוץ הכי טוב<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>גן עירוני<\/strong><\/td>\n<td><strong>דרך היכרות<\/strong> (הכי טוב): הורים שאת מכירה, גננת חברה. אתר הרשות ← חינוך ← גני ילדים (לפעמים יש רשימת גנים וכתובות)<\/td>\n<td>הגננת, לרוב יחד עם ועד ההורים<\/td>\n<td>הודעה שחבר/ה מעביר/ה לגננת, ואז וואטסאפ<\/td>\n<\/tr>\n<tr>\n<td><strong>גן פרטי / מעון<\/strong><\/td>\n<td>גוגל מפות: ״גן ילדים פרטי [עיר]״, אתר או עמוד פייסבוק של הגן<\/td>\n<td>הבעלים<\/td>\n<td>שיחה או וואטסאפ למספר העסקי<\/td>\n<\/tr>\n<tr>\n<td><strong>מתנ״ס<\/strong><\/td>\n<td>אתר המתנ״ס או עמוד הפייסבוק ← ״צוות״: רכז/ת תרבות, רכז/ת גיל רך, רכז/ת ילדים ונוער<\/td>\n<td>הרכז/ת, ולפעמים מנהל/ת המתנ״ס<\/td>\n<td>מייל, ואז שיחה<\/td>\n<\/tr>\n<tr>\n<td><strong>קייטנה<\/strong><\/td>\n<td>מתנ״סים, מחלקת הנוער ברשות, קייטנות פרטיות שמפרסמות באביב (פייסבוק, שלטים)<\/td>\n<td>רכז/ת הקייטנה<\/td>\n<td>מייל או שיחה<\/td>\n<\/tr>\n<tr>\n<td><strong>רשות (אירועי עיר)<\/strong><\/td>\n<td>אתר הרשות ← מחלקת תרבות / קהילה. הרבה אירועים עוברים דרך מפיקים<\/td>\n<td>רכז/ת התרבות, או המפיק/ה<\/td>\n<td><strong>שלב מאוחר יותר<\/strong>, אחרי 5+ הופעות<\/td>\n<\/tr>\n<tr>\n<td><strong>הורים (ימי הולדת)<\/strong><\/td>\n<td>המעגל שלך, קבוצות הורים מקומיות בפייסבוק (לפי החוקים), הרשתות שלך, המלצות של לקוחות<\/td>\n<td>ההורה<\/td>\n<td>הודעה אישית / פוסט<\/td>\n<\/tr>\n<tr>\n<td><strong>מפיקי אירועים, מתחמי ימי הולדת<\/strong><\/td>\n<td>גוגל: ״הפקת ימי הולדת לילדים [עיר]״, ״מתחם ימי הולדת [עיר]״, ״ג׳ימבורי [עיר]״<\/td>\n<td>הבעלים<\/td>\n<td>שיחה, ואז וואטסאפ<\/td>\n<\/tr>\n<tr>\n<td><strong>״מגבירים״<\/strong><\/td>\n<td>אנשים שמכירים הרבה הורים וגננות: גננת חברה, מורה, מדריכת חוג, מנהלת קבוצת הורים<\/td>\n<td>—<\/td>\n<td>הודעה אישית: ״יש לך מישהי להכיר לי?״<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>ערוצים לשלב מאוחר יותר (לא עכשיו):<\/strong><\/p>\n<ul>\n<li><strong>בתי ספר (כיתות א׳–ג׳):<\/strong> מנהלי בתי ספר בוחרים תוכניות חיצוניות ממאגר ״גפ״ן״ של משרד החינוך, וספקים מצטרפים אליו דרך מכרז (<a href=\"https://meyda.education.gov.il/files/edu-hub/sherut/Gefen_Sapakim_Dec.pdf\">מדריך גפ״ן לספקים<\/a>). זה דורש עסק רשום, ניסיון ובירוקרטיה. <strong>לבדוק<\/strong> בשנה השנייה.<\/li>\n<li><strong>קניונים, בתי מלון, ימי משפחות של חברות:<\/strong> בדרך כלל דרך מפיקים. מגיעים אליהם אחרי שיש סרטון טוב והמלצות.<\/li>\n<\/ul>\n<h3>לוח עונות: מתי פונים למי<\/h3>\n<blockquote>\n<p><strong>את התאריכים המדויקים בודקים בלוח השנה, ואת מועדי ההזמנה מבררים בשיחה<\/strong> עם 2–3 גננות ורכזות. הטבלה היא כיוון, לא עובדה.<\/p>\n<\/blockquote>\n<table>\n<thead>\n<tr>\n<th>אירוע<\/th>\n<th>בערך מתי<\/th>\n<th>מתי כדאי לפנות (הערכה, לבדוק)<\/th>\n<th>למי<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>חנוכה<\/strong><\/td>\n<td>דצמבר<\/td>\n<td>מאמצע אוקטובר ועד תחילת נובמבר<\/td>\n<td>גנים, מתנ״סים, קייטנות חנוכה, אירועי משפחות<\/td>\n<\/tr>\n<tr>\n<td><strong>ט״ו בשבט<\/strong><\/td>\n<td>ינואר–פברואר<\/td>\n<td>4–6 שבועות לפני<\/td>\n<td>גנים<\/td>\n<\/tr>\n<tr>\n<td><strong>פורים<\/strong><\/td>\n<td>פברואר–מרץ<\/td>\n<td>5–6 שבועות לפני<\/td>\n<td>גנים, מתנ״סים, אירועי משפחות<\/td>\n<\/tr>\n<tr>\n<td><strong>קייטנות פסח<\/strong><\/td>\n<td>מרץ–אפריל<\/td>\n<td>פברואר<\/td>\n<td>קייטנות, מתנ״סים<\/td>\n<\/tr>\n<tr>\n<td><strong>ל״ג בעומר, שבועות<\/strong><\/td>\n<td>מאי–יוני<\/td>\n<td>4–6 שבועות לפני<\/td>\n<td>גנים, אירועי קהילה<\/td>\n<\/tr>\n<tr>\n<td><strong>מסיבות סוף שנה<\/strong><\/td>\n<td>יוני<\/td>\n<td>אפריל–מאי<\/td>\n<td>גנים<\/td>\n<\/tr>\n<tr>\n<td><strong>קייטנות קיץ<\/strong><\/td>\n<td>יולי–אוגוסט<\/td>\n<td><strong>התוכנית נבנית באביב<\/strong> (מרץ–מאי). לשאול את הרכזת<\/td>\n<td>קייטנות, מתנ״סים, צהרונים<\/td>\n<\/tr>\n<tr>\n<td><strong>ימי הולדת<\/strong><\/td>\n<td>כל השנה<\/td>\n<td>תמיד<\/td>\n<td>הורים<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>אם את קוראת את זה באוקטובר–נובמבר:<\/strong> החלון הקרוב הוא <strong>חנוכה<\/strong>. אם הפיילוט כבר מאחורייך, זה הזמן לפנות לגנים ולמתנ״סים. אם עוד לא, פני ל־2–3 גנים לפיילוט בתשלום מוזל לקראת חנוכה (<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>, שלב 8).<\/p>\n<\/blockquote>\n<hr />\n<h2>חלק ד׳ — רשימת 20 הלידים הראשונים<\/h2>\n<h3>ההרכב המומלץ<\/h3>\n<table>\n<thead>\n<tr>\n<th>כמה<\/th>\n<th>סוג<\/th>\n<th>למה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>6<\/td>\n<td>גנים (3 פרטיים, 3 עירוניים דרך היכרות)<\/td>\n<td>מחזורי הזמנה סביב חגים, וגננות ממליצות זו לזו<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>קייטנות ומתנ״סים<\/td>\n<td>קבוצות גדולות, אפשרות למופעים ברצף<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>הורים מהמעגל שלך עם יום הולדת בחודשיים הקרובים<\/td>\n<td>הכי קל לסגור, הכי מהר<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>מפיקי אירועים / מתחמי ימי הולדת<\/td>\n<td>יכולים להביא הזמנות חוזרות<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>״מגבירים״<\/td>\n<td>כל אחד מהם שווה כמה לידים<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>איך מדרגים עדיפות<\/h3>\n<ul>\n<li><strong>א׳<\/strong> = חם (יש היכרות או המלצה) <strong>וגם<\/strong> קרוב <strong>וגם<\/strong> בעונה. פונים קודם.<\/li>\n<li><strong>ב׳<\/strong> = שניים מתוך השלושה.<\/li>\n<li><strong>ג׳<\/strong> = קר, רחוק או לא בעונה. פונים כשיש זמן.<\/li>\n<\/ul>\n<h3>הטבלה (להעתיק ללשונית ״לידים״ בגיליון)<\/h3>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>שם<\/th>\n<th>סוג<\/th>\n<th>עיר<\/th>\n<th>איש/אשת קשר ותפקיד<\/th>\n<th>איך מצאתי<\/th>\n<th>חם/קר<\/th>\n<th>עדיפות<\/th>\n<th>ערוץ<\/th>\n<th>פנייה 1<\/th>\n<th>תגובה<\/th>\n<th>פולואפ יום 3<\/th>\n<th>פולואפ יום 7<\/th>\n<th>סטטוס<\/th>\n<th>הצעד הבא<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><\/td>\n<td>גן פרטי<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><\/td>\n<td>גן פרטי<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><\/td>\n<td>גן פרטי<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><\/td>\n<td>גן עירוני<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><\/td>\n<td>גן עירוני<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><\/td>\n<td>גן עירוני<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td><\/td>\n<td>מתנ״ס<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td><\/td>\n<td>מתנ״ס<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td><\/td>\n<td>קייטנה<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td><\/td>\n<td>קייטנה / צהרון<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td><\/td>\n<td>הורה (יום הולדת)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td><\/td>\n<td>הורה (יום הולדת)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td><\/td>\n<td>הורה (יום הולדת)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td><\/td>\n<td>הורה (יום הולדת)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td><\/td>\n<td>הורה (יום הולדת)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>16<\/td>\n<td><\/td>\n<td>מפיק/ת אירועים<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>17<\/td>\n<td><\/td>\n<td>מתחם ימי הולדת<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>18<\/td>\n<td><\/td>\n<td>מפיק/ת / מתחם<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>19<\/td>\n<td><\/td>\n<td>מגביר/ה<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>20<\/td>\n<td><\/td>\n<td>מגביר/ה<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>ערכי הסטטוס (רשימה נפתחת)<\/h3>\n<table>\n<thead>\n<tr>\n<th>סטטוס<\/th>\n<th>מה זה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>לא פניתי<\/strong><\/td>\n<td>ברשימה, עוד לא נשלח<\/td>\n<\/tr>\n<tr>\n<td><strong>נשלח<\/strong><\/td>\n<td>הודעה ראשונה נשלחה, מחכים<\/td>\n<\/tr>\n<tr>\n<td><strong>מעוניין/ת<\/strong><\/td>\n<td>ענו ״כן, תשלחי״ / ״בואי נדבר״ ← עובר ל<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>, תחנה 2<\/td>\n<\/tr>\n<tr>\n<td><strong>לא עכשיו<\/strong><\/td>\n<td>ענו ״אולי ב־___״ ← רושמים <strong>מתי<\/strong> ביקשו שתחזרי<\/td>\n<\/tr>\n<tr>\n<td><strong>לא<\/strong><\/td>\n<td>ענו לא ← ״לא לפנות״<\/td>\n<\/tr>\n<tr>\n<td><strong>אין מענה<\/strong><\/td>\n<td>אחרי פנייה + 2 פולואפים ← סוגרים<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>חלק ה׳ — התבניות<\/h2>\n<blockquote>\n<p><strong>איך להשתמש:<\/strong> מעתיקים, מחליפים את מה שבסוגריים המרובעים, <strong>ומוסיפים משפט אישי אחד<\/strong> (״ראיתי שאתם...״, ״[שם] אמרה לי ש...״). הודעה שנראית אישית מקבלת הרבה יותר תשובות מהודעה שנראית מועתקת.<\/p>\n<p><strong>אורך:<\/strong> וואטסאפ ראשון, עד 5 שורות. מייל ראשון, עד 8 שורות.<\/p>\n<p><strong>לשון:<\/strong> התבניות כתובות בלשון נקבה, כי רוב מי שתפני אליהן הן גננות, רכזות ואמהות. כשכותבים לגבר, מתאימים.<\/p>\n<\/blockquote>\n<h3>שני מסלולי פולואפ (לכל הסוגים)<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>מסלול א׳: ענו ״תשלחי״, ואז שתקו<\/strong><\/th>\n<th><strong>מסלול ב׳: לא ענו בכלל להודעה הראשונה<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>יום 3<\/strong><\/td>\n<td>פולואפ כתוב קצר (בכל תבנית למטה)<\/td>\n<td><strong>שיחת טלפון<\/strong> (התסריט בכל תבנית)<\/td>\n<\/tr>\n<tr>\n<td><strong>יום 7<\/strong><\/td>\n<td>פולואפ כתוב אחרון, שסוגר את המעגל<\/td>\n<td><strong>שיחה נוספת<\/strong>, בשעה אחרת<\/td>\n<\/tr>\n<tr>\n<td><strong>אחרי זה<\/strong><\/td>\n<td>סטטוס ״אין מענה״. לא פונים<\/td>\n<td>סטטוס ״אין מענה״. לא פונים<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3>1. גנים (גננת / בעלת גן פרטי)<\/h3>\n<h4>1א. וואטסאפ ראשון — דרך היכרות (הכי טוב)<\/h4>\n<p><strong>שלב 1: ההודעה שהחברה מעבירה לגננת<\/strong> (שולחים לחברה, והיא מעבירה):<\/p>\n<blockquote>\n<p>היי [שם הגננת], חברה שלי, קים, מפעילה מופע תנועה ומשחק לגנים, ״קים משחקים״, והיא מחפשת כמה גנים ל[חנוכה / פיילוט]. ראיתי מה היא עושה, ונראה לי שהילדים שלך יעופו על זה. אפשר שהיא תשלח לך הודעה קצרה?<\/p>\n<\/blockquote>\n<p><strong>שלב 2: אחרי שהגננת אמרה ״כן״:<\/strong><\/p>\n<blockquote>\n<p>היי [שם], כאן קים 🟡 [שם החברה] סיפרה לי עלייך, תודה שהסכמת שאכתוב!<\/p>\n<p>[משפט ההיכרות שלך]. מופע של [30/45] דקות, ובסופו נשאר אצלך דף עם 3 משחקים להמשך השבוע.<\/p>\n<p>אפשר לשלוח לך פרטים וסרטון קצר? ומתי נוח לך לדבר 5 דקות, אחרי שעות הגן?<\/p>\n<\/blockquote>\n<h4>1ב. וואטסאפ ראשון — בלי היכרות (גן פרטי, למספר העסקי)<\/h4>\n<blockquote>\n<p>שלום [שם], כאן קים נידם מ״קים משחקים״ 🟡<\/p>\n<p>[משפט ההיכרות שלך]. אני מגיעה לגנים עם מופע של [30/45] דקות, מותאם לגיל, שבו כל הילדים זזים, צוחקים ומשתפים פעולה, ומסתיים ברוגע.<\/p>\n<p>אפשר לשלוח לך פרטים קצרים ל[חנוכה / לשנה הזאת]? אם לא מתאים, פשוט תכתבי ״לא״ ולא אפנה שוב 🙂<\/p>\n<\/blockquote>\n<h4>1ג. מייל ראשון (לגן פרטי עם כתובת מייל)<\/h4>\n<p><strong>נושא:<\/strong> מופע תנועה ומשחק לגן — שאלה קצרה<\/p>\n<blockquote>\n<p>שלום [שם],<\/p>\n<p>[משפט ההיכרות שלך].<\/p>\n<p>אני מגיעה לגנים עם מופע של [30/45] דקות, מותאם לגיל [3–4 / 5–6], שבו הילדים לא יושבים ומסתכלים אלא משחקים: ״קים אומרת״, ״הפסל של קים״, קוביית אתגרים וריקוד. המופע מסתיים בנשימה ובסיום שקט, ונשאר אצלך דף עם 3 משחקים להמשך השבוע.<\/p>\n<p>אשמח לשלוח הצעה מסודרת וסרטון קצר. מתאים?<\/p>\n<p>אם לא, אפשר פשוט להשיב ״לא תודה״, ולא אפנה שוב.<\/p>\n<p>תודה,<\/p>\n<p>קים נידם · ״קים משחקים״ · [טלפון]<\/p>\n<\/blockquote>\n<h4>1ד. שיחת טלפון (גם לפולואפ של מסלול ב׳)<\/h4>\n<p><strong>לפני:<\/strong> מתקשרים <strong>אחרי שעות הגן<\/strong>, ולא בשעה שבה מחזירים ילדים. מחייכים (שומעים את זה בקול).<\/p>\n<p><strong>פתיחה (20 שניות):<\/strong><\/p>\n<blockquote>\n<p>״היי [שם], כאן קים מ״קים משחקים״. יש לך דקה? ... [משפט ההיכרות]. אני מגיעה לגנים עם מופע תנועה ומשחק של חצי שעה עד 45 דקות, ורציתי לשאול אם אתם מחפשים משהו ל[חנוכה / השנה].״<\/p>\n<\/blockquote>\n<p><strong>במסלול ב׳<\/strong> (שלחת הודעה ולא ענו), מוסיפים אחרי ״יש לך דקה?״: ״שלחתי לך הודעה קצרה לפני כמה ימים, וחשבתי שעדיף פשוט להתקשר.״<\/p>\n<p><strong>3 שאלות (אם יש עניין):<\/strong><\/p>\n<ol>\n<li>״כמה ילדים יש בגן, ובאיזה גיל?״<\/li>\n<li>״איך אתם בדרך כלל בוחרים הפעלות? את מחליטה, או יחד עם ועד ההורים?״<\/li>\n<li>״יש לכם כבר תאריך או מועד שאתם חושבים עליו?״<\/li>\n<\/ol>\n<p><strong>סגירה:<\/strong><\/p>\n<blockquote>\n<p>״מעולה. אני שולחת לך עכשיו בוואטסאפ פרטים וסרטון קצר, ואחזור אלייך ב[יום] לשמוע מה חשבת. מתאים?״<\/p>\n<\/blockquote>\n<p><strong>אם לא עונים:<\/strong> לא משאירים הודעה קולית ארוכה. מנסים שוב ביום 7, בשעה אחרת.<\/p>\n<h4>1ה. פולואפים (מסלול א׳, אחרי ״תשלחי״)<\/h4>\n<p><strong>יום 3:<\/strong><\/p>\n<blockquote>\n<p>היי [שם], רק מוודאת שהפרטים הגיעו 🙂 הספקת להציץ בסרטון? אשמח לענות על כל שאלה.<\/p>\n<\/blockquote>\n<p><strong>יום 7:<\/strong><\/p>\n<blockquote>\n<p>היי [שם], אני סוגרת בימים האלה את הלוח ל[חנוכה]. אם זה רלוונטי לגן שלך, אשמח לשריין תאריך. אם לא עכשיו, הכל טוב. רק תגידי לי אם לחזור אלייך לקראת [פורים / סוף השנה] 🟡<\/p>\n<\/blockquote>\n<h4>1ו. ״צריך לבדוק עם ועד ההורים״: הודעה שהגננת יכולה להעביר<\/h4>\n<blockquote>\n<p><strong>״קים משחקים״: מופע תנועה ומשחק לגן<\/strong> 🟡<\/p>\n<p>מופע של [30/45] דקות שבו כל הילדים משחקים: ״קים אומרת״, ״הפסל של קים״, קוביית אתגרים וריקוד, וסיום רגוע.<\/p>\n<p>✅ מותאם לגיל [___] · ✅ כל הציוד עליה · ✅ דף משחקים לגננת להמשך השבוע<\/p>\n<p>💰 [___] ₪ · 📅 מוצע ל[תאריך]<\/p>\n<p>🎬 [קישור לסרטון] · 📞 קים: [טלפון]<\/p>\n<\/blockquote>\n<hr />\n<h3>2. קייטנות ומתנ״סים (רכז/ת)<\/h3>\n<h4>2א. מייל ראשון (הערוץ המרכזי)<\/h4>\n<p><strong>נושא:<\/strong> יום משחקים לקייטנה / למתנ״ס — ״קים משחקים״<\/p>\n<blockquote>\n<p>שלום [שם],<\/p>\n<p>[משפט ההיכרות שלך].<\/p>\n<p>אני מציעה ״יום משחקים עם קים״: מופע תנועה אינטראקטיבי של 30–45 דקות לקבוצות של עד [25/60] ילדים, פנים או חוץ בצל, עם אפשרות לשני מופעים ברצף לשתי קבוצות גיל. אני עובדת לפי צ׳קליסט בטיחות קבוע, ומגיעה 30 דקות לפני כדי לתאם עם הצוות.<\/p>\n<p>אתם כבר בונים את התוכנית ל[חנוכה / פסח / הקיץ]? אם כן, אשמח לשלוח הצעה וסרטון קצר.<\/p>\n<p>ואם זה לא רלוונטי, אפשר להשיב ״לא תודה״, ולא אפנה שוב.<\/p>\n<p>תודה,<\/p>\n<p>קים נידם · ״קים משחקים״ · [טלפון]<\/p>\n<\/blockquote>\n<h4>2ב. וואטסאפ ראשון (כשיש מספר של הרכז/ת)<\/h4>\n<blockquote>\n<p>שלום [שם], כאן קים נידם מ״קים משחקים״ 🟡<\/p>\n<p>[משפט ההיכרות]. אני מציעה מופע תנועה אינטראקטיבי לקייטנות ולמתנ״סים, 30–45 דק׳, עד [___] ילדים בקבוצה.<\/p>\n<p>אתם כבר מתכננים את [העונה]? אפשר לשלוח לך פרטים? (אם לא מתאים, רק תכתבי ״לא״ ולא אפנה שוב)<\/p>\n<\/blockquote>\n<h4>2ג. שיחת טלפון<\/h4>\n<p><strong>פתיחה:<\/strong><\/p>\n<blockquote>\n<p>״שלום, מדברת קים מ״קים משחקים״. אני מחפשת את מי שאחראי/ת על התוכנית של [הקייטנה / הילדים במתנ״ס]... היי [שם], יש לך דקה? אני מציעה מופע תנועה ומשחק לקבוצות ילדים, ורציתי לשאול אם אתם כבר בונים את התוכנית ל[העונה].״<\/p>\n<\/blockquote>\n<p><strong>במסלול ב׳<\/strong> (שלחת מייל ולא ענו): מוסיפים אחרי ״יש לך דקה?״: ״שלחתי לך מייל לפני כמה ימים, וחשבתי שעדיף להתקשר.״<\/p>\n<p><strong>3 שאלות:<\/strong><\/p>\n<ol>\n<li>״מתי אתם סוגרים את התוכנית, ומי מאשר/ת?״<\/li>\n<li>״כמה ילדים בכל קבוצה, באיזה גיל, ופנים או חוץ?״<\/li>\n<li>״אילו מסמכים אתם צריכים מספק חדש?״ <em>(רושמים! ראי <a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>, תחנה 6)<\/em><\/li>\n<\/ol>\n<p><strong>סגירה:<\/strong><\/p>\n<blockquote>\n<p>״אני שולחת לך עוד היום הצעה וסרטון למייל. מתי נוח שאחזור אלייך?״<\/p>\n<\/blockquote>\n<p><strong>אם אומרים ״עוד מוקדם״:<\/strong><\/p>\n<blockquote>\n<p>״אין בעיה. מתי נכון שאחזור אלייך?״ ← רושמים בגיליון את התאריך שאמרו, וחוזרים <strong>בדיוק אז<\/strong>.<\/p>\n<\/blockquote>\n<h4>2ד. פולואפים (מסלול א׳)<\/h4>\n<p><strong>יום 3:<\/strong><\/p>\n<blockquote>\n<p>שלום [שם], רק מוודאת שההצעה הגיעה. אשמח לענות על שאלות, או לשלוח את מסמכי הספק אם זה יעזור לכם להתקדם.<\/p>\n<\/blockquote>\n<p><strong>יום 7:<\/strong><\/p>\n<blockquote>\n<p>שלום [שם], אני מסדרת בימים האלה את הלוח ל[העונה]. אם ״יום משחקים עם קים״ רלוונטי לכם, אשמח לשריין. ואם התוכנית כבר סגורה, אשמח לדעת מתי מתחילים לבנות את העונה הבאה.<\/p>\n<\/blockquote>\n<hr />\n<h3>3. הורים (ימי הולדת)<\/h3>\n<blockquote>\n<p><strong>תזכורת:<\/strong> להורים זרים <strong>לא פונים בפרטי.<\/strong> פונים למעגל שלך, ומפרסמים בקבוצות לפי החוקים שלהן.<\/p>\n<\/blockquote>\n<h4>3א. הודעה אישית למעגל שלך (חברים ומשפחה עם ילדים)<\/h4>\n<p>כל הודעה נשלחת <strong>אחת־אחת<\/strong>, עם שם ומשפט אישי. לא רשימת תפוצה.<\/p>\n<blockquote>\n<p>היי [שם]! 🟡 יש לי חדשות: פתחתי את ״קים משחקים״, מופע תנועה ומשחק לילדים בני 3–8, שבו הילדים לא צופים אלא משחקים איתי.<\/p>\n<p>[אם יש להם ילד/ה עם יום הולדת קרוב:] ל[שם הילד/ה] יש יום הולדת בקרוב, נכון? אשמח לבוא, במחיר השקה לחברים 😉<\/p>\n<p>ובכל מקרה, אם את מכירה הורים עם יום הולדת בקרוב, אשמח מאוד שתעבירי את המספר שלי 🧡<\/p>\n<p>הנה סרטון קצר: [קישור]<\/p>\n<\/blockquote>\n<h4>3ב. פוסט לקבוצת הורים מקומית (פייסבוק)<\/h4>\n<p><strong>לפני שמפרסמים:<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> קראתי את חוקי הקבוצה (בדרך כלל בפוסט נעוץ). יש יום פרסום? מותר פרסום עסקי בכלל?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> בספק: שאלתי את המנהל/ת<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>בלי תמונות של ילדים.<\/strong> תמונה שלך בתלבושת, או הסרטון שלך<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> אני עונה לתגובות באותו יום<\/li>\n<\/ul>\n<blockquote>\n<p><strong>הורים של [עיר], נעים מאוד, אני קים 🟡<\/strong><\/p>\n<p>[משפט ההיכרות שלך].<\/p>\n<p>פתחתי את ״קים משחקים״: מופע של 45 דקות לימי הולדת (גילאי 3–8), שבו <strong>כל הילדים משחקים<\/strong>: ״קים אומרת״, ״הפסל של קים״, קוביית אתגרים וריקוד, וילד/ת יום ההולדת הוא/היא הקפטן/ית שלי.<\/p>\n<p>אני מגיעה עם כל הציוד, ושומרת על כללי בטיחות קבועים: הכל במקום, בלי הרמות, ומבוגר מהבית תמיד בחדר.<\/p>\n<p>🎬 ככה זה נראה: [קישור]<\/p>\n<p>להזמנות ושאלות: [וואטסאפ] 🧡<\/p>\n<\/blockquote>\n<h4>3ג. פוסט גיוס לפיילוט (שבוע 3)<\/h4>\n<blockquote>\n<p><strong>מחפשת 3 משפחות עם יום הולדת ב[חודש] 🎂<\/strong><\/p>\n<p>אני קים, [משפט ההיכרות]. אני משיקה מופע תנועה ומשחק לימי הולדת (גילאי 3–8), ומחפשת 3 משפחות ב[עיר והסביבה] <strong>במחיר השקה<\/strong>, בתמורה למשוב קצר אחרי המופע.<\/p>\n<p>45 דקות שבהן כל הילדים משחקים, ו[ילד/ת] יום ההולדת הוא/היא הקפטן/ית שלי.<\/p>\n<p>מעוניינים? כתבו לי בפרטי או בוואטסאפ: [מספר] 🟡<\/p>\n<\/blockquote>\n<p><strong>חשוב:<\/strong> לא כותבים ״חינם״ בפוסט ציבורי (<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>, שלב 8). הפוסט מביא פניות נכנסות, ואותן מנהלים לפי <a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>.<\/p>\n<h4>3ד. תשובה לתגובה בפוסט<\/h4>\n<blockquote>\n<p>תודה [שם]! 🧡 שלחתי לך הודעה בפרטי עם הפרטים.<\/p>\n<\/blockquote>\n<p>(<strong>רק<\/strong> למי שהגיב/ה ושאל/ה. מי שעשה רק לייק, לא מקבל הודעה בפרטי.)<\/p>\n<hr />\n<h3>4. מפיקי אירועים ומתחמי ימי הולדת<\/h3>\n<p><strong>המטרה כאן היא שיתוף פעולה:<\/strong> שהם יציעו את המופע שלך כתוספת בחבילות שלהם, או יזמינו אותך לאירועים.<\/p>\n<h4>4א. וואטסאפ / מייל ראשון<\/h4>\n<blockquote>\n<p>שלום [שם], כאן קים נידם מ״קים משחקים״ 🟡<\/p>\n<p>[משפט ההיכרות]. יש לי מופע תנועה ומשחק של 30–45 דקות לגילאי 3–8, שמתאים כתוספת לימי הולדת ולאירועי משפחות, ואני מחפשת שיתופי פעולה עם [מתחמים / מפיקים] באזור.<\/p>\n<p>אפשר לשלוח לך פרטים וסרטון קצר, ולדבר 10 דקות על איך זה יכול להשתלב אצלכם? (ואם לא רלוונטי, רק תכתוב/י ״לא״)<\/p>\n<\/blockquote>\n<h4>4ב. שיחה<\/h4>\n<p><strong>פתיחה:<\/strong><\/p>\n<blockquote>\n<p>״היי [שם], כאן קים מ״קים משחקים״. ראיתי שאתם עושים [ימי הולדת / אירועי משפחות] ב[מקום]. יש לי מופע תנועה ומשחק לגילאי 3–8, ואני בודקת אם יש מקום לשיתוף פעולה. יש לך 2 דקות?״<\/p>\n<\/blockquote>\n<p><strong>3 שאלות:<\/strong><\/p>\n<ol>\n<li>״איך נראה אצלכם יום הולדת טיפוסי? כמה זמן, כמה ילדים, באיזה גיל?״<\/li>\n<li>״אתם עובדים כבר עם מפעילים חיצוניים? איך זה בנוי: ההורים משלמים לכם או ישירות למפעיל?״<\/li>\n<li>״מה חשוב לכם במפעיל/ה שאתם ממליצים עליו/ה?״<\/li>\n<\/ol>\n<p><strong>סגירה:<\/strong><\/p>\n<blockquote>\n<p>״אשמח להגיע להופעה אחת אצלכם, שתראו איך זה עובד עם הקהל שלכם. מה דעתך?״<\/p>\n<\/blockquote>\n<p><strong>חשוב:<\/strong> אם הם רוצים ״עמלה״ או מחיר מוזל בשבילם, <strong>לא מחליטים בשיחה.<\/strong> בודקים מול <a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a> שהמחיר נשאר מעל הרצפה, ושואלים את היועץ ב<a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a>.<\/p>\n<h4>4ג. פולואפים (מסלול א׳)<\/h4>\n<p><strong>יום 3:<\/strong><\/p>\n<blockquote>\n<p>היי [שם], הספקת להציץ בסרטון? אשמח לשמוע מה חשבת.<\/p>\n<\/blockquote>\n<p><strong>יום 7:<\/strong><\/p>\n<blockquote>\n<p>היי [שם], רק סוגרת את המעגל. אם יש מקום לשיתוף פעולה עכשיו או בעונה הבאה, אני כאן 🟡 ואם לא, תודה על הזמן!<\/p>\n<\/blockquote>\n<hr />\n<h3>5. ״מגבירים״ (מי שמכיר הרבה לקוחות)<\/h3>\n<blockquote>\n<p>היי [שם]! 🧡 את מכירה מלא גננות והורים, ואני צריכה את העזרה שלך: פתחתי את ״קים משחקים״, מופע תנועה ומשחק לילדים בני 3–8 [קישור לסרטון].<\/p>\n<p>יש 2–3 גננות או הורים שעולים לך לראש, שזה יכול לשמח אותם? אם כן, אשלח לך הודעה קצרה להעביר להם, ככה זה לא ״מתוך כלום״ 🙂<\/p>\n<\/blockquote>\n<p>(ואז שולחים את ההודעה מתבנית 1א, שלב 1, או את הודעת הוועד מ־1ו.)<\/p>\n<hr />\n<h2>חלק ו׳ — תשובות מוכנות לתשובות נפוצות<\/h2>\n<table>\n<thead>\n<tr>\n<th>הם אומרים<\/th>\n<th>את עונה (ברוח הזאת, במילים שלך)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>״כמה זה עולה?״<\/strong> (כבר בהתחלה)<\/td>\n<td>עונים ישר, עם מה כלול: ״[<strong><em>] ₪ למופע של [משך], כולל כל הציוד, באזור [<\/em><\/strong>]. אשמח לספר עוד ולשלוח סרטון.״ <strong>לא מתחמקים.<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>״יקר לנו״<\/strong><\/td>\n<td>״אני מבינה. המחיר כולל [מה כלול], ואני מגיעה חצי שעה לפני ומתאימה הכל לגיל. מה שאפשר לעשות: [מופע ברצף עם גן שכן במחיר מופחת למופע השני / מועד גמיש באמצע השבוע]. ואם התקציב ישתנה, אני כאן.״ <strong>לא מורידים מחיר בשיחה<\/strong> (<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>)<\/td>\n<\/tr>\n<tr>\n<td><strong>״יש לנו כבר מפעיל/ה קבוע/ה״<\/strong><\/td>\n<td>״מעולה, זה אומר שאתם יודעים כמה זה חשוב 🙂 המופע שלי שונה: הילדים לא צופים, הם משחקים כל הזמן. אם יום אחד תרצו משהו אחר לחג או ליום מיוחד, אשמח שתשמרי את המספר שלי.״<\/td>\n<\/tr>\n<tr>\n<td><strong>״אין תקציב עכשיו״<\/strong><\/td>\n<td>״מובן לגמרי. מתי בדרך כלל מחליטים על התקציב להפעלות? אפשר שאחזור אלייך אז?״ ← רושמים תאריך, וחוזרים <strong>רק אם אמרו כן<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>״תשלחי חומר״<\/strong><\/td>\n<td>שולחים את ההצעה וסרטון (<a href=\"06-show-offer.md\">הצעת המופע<\/a>, חלק ה׳), ומוסיפים: ״אתקשר ב[יום] לשמוע מה חשבת, מתאים?״<\/td>\n<\/tr>\n<tr>\n<td><strong>״צריך לבדוק עם הוועד / המנהלת״<\/strong><\/td>\n<td>״בטח. אשלח לך הודעה קצרה שאפשר להעביר להם כמו שהיא.״ (תבנית 1ו) ״מתי כדאי שאבדוק איתך?״<\/td>\n<\/tr>\n<tr>\n<td><strong>״יש לך ביטוח? אישור משטרה?״<\/strong><\/td>\n<td><strong>רק את האמת<\/strong>, לפי המצב ב<a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a>: ״כן, אשלח לך עותק״ או ״אני בתהליך, ויהיה לי עד [תאריך]״<\/td>\n<\/tr>\n<tr>\n<td><strong>״יש סרטון?״<\/strong><\/td>\n<td>שולחים את סרטון ההיכרות. אם עוד אין: ״הסרטון בעריכה, אשלח לך עד [יום]״, <strong>ומקיימים<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>״זה מתאים לגיל ___?״<\/strong><\/td>\n<td>3–4: גרסה של 30 דק׳. 5–8: 45 דק׳. מתחת ל־3: ״המופע לא בנוי לגיל הזה, ואני מעדיפה להגיד לך את זה ביושר.״<\/td>\n<\/tr>\n<tr>\n<td><strong>״זה מתאים לילד/ה עם ___?״<\/strong><\/td>\n<td>״לכל משחק יש גרסה בישיבה, שאני מציגה לכל הילדים כגרסה רגילה. ספרי לי עוד, ואתאים מראש.״ (<a href=\"02-show-script.md\">תסריט המופע<\/a>, פרק 7)<\/td>\n<\/tr>\n<tr>\n<td><strong>״את מגיעה ל[מקום רחוק]?״<\/strong><\/td>\n<td>לפי מדיניות הנסיעות ב<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>: ״כן, בתוספת נסיעה של [<strong><em>] ₪״, או ״כרגע אני עובדת באזור [<\/em><\/strong>]״<\/td>\n<\/tr>\n<tr>\n<td><strong>״אפשר לצלם ולהעלות לעמוד של הגן?״<\/strong><\/td>\n<td>״זה בסדר מבחינתי. רק תוודאי שיש לכם אישורי הורים לפרסום, ושילדים בלי אישור לא מופיעים.״ (<a href=\"08-consent-template.md\">טופס אישור הצילום<\/a>)<\/td>\n<\/tr>\n<tr>\n<td><strong>״אפשר בחינם, בשביל החשיפה?״<\/strong><\/td>\n<td>״אני כבר אחרי הפיילוטים, אז אני לא עושה הופעות בחינם. מה שכן אפשר: [מחיר השקה / מופע ברצף].״ (אם את עדיין בשלב 0 של הפיילוט, זו החלטה שלך לפי <a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>חלק ז׳ — מעקב: מה עובד<\/h2>\n<h3>המדדים (בלשונית ״לידים״, פעם בשבוע)<\/h3>\n<table>\n<thead>\n<tr>\n<th>מדד<\/th>\n<th>איך מחשבים<\/th>\n<th>השבוע<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>פניות שנשלחו<\/td>\n<td>סופרים<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>ענו (כל תשובה)<\/td>\n<td>סופרים<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>אחוז מענה<\/strong><\/td>\n<td>ענו ÷ נשלחו × 100<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>״מעוניין/ת״ (עברו לתהליך הזמנה)<\/td>\n<td>סופרים<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>הצעות שנשלחו<\/td>\n<td>מ<a href=\"12-booking-process.md\">גיליון הלקוחות<\/a><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>הזמנות שנסגרו<\/td>\n<td>מ<a href=\"12-booking-process.md\">גיליון הלקוחות<\/a><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>כללי אצבע (לא מחקר) אחרי 10 פניות<\/h3>\n<table>\n<thead>\n<tr>\n<th>מה רואים<\/th>\n<th>מה כנראה הסיבה<\/th>\n<th>מה משנים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>כמעט אף אחד לא עונה<\/strong><\/td>\n<td>ההודעה ארוכה מדי, נראית מועתקת, או שהיא בעונה הלא נכונה<\/td>\n<td>מקצרים ל־3 שורות, מוסיפים משפט אישי, עוברים לפנייה דרך היכרות<\/td>\n<\/tr>\n<tr>\n<td><strong>עונים, אבל ״לא עכשיו״<\/strong><\/td>\n<td>העיתוי<\/td>\n<td>רושמים מתי, וחוזרים בדיוק אז<\/td>\n<\/tr>\n<tr>\n<td><strong>עונים ״תשלחי״, ואז נעלמים<\/strong><\/td>\n<td>ההצעה לא משכנעת מספיק<\/td>\n<td>בודקים: יש סרטון? ההצעה ברורה? המחיר כתוב? מוסיפים ציטוט מאושר<\/td>\n<\/tr>\n<tr>\n<td><strong>פניות חמות נסגרות, קרות לא<\/strong><\/td>\n<td>זה טבעי לגמרי בהתחלה<\/td>\n<td>משקיעים יותר ב״מגבירים״ ובבקשות הפניה (<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>, תחנה 12)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>ניסוי פשוט:<\/strong> כשיש לך שתי גרסאות להודעה, שלחי כל אחת ל־5 גופים מאותו סוג, ובדקי איזו קיבלה יותר תשובות. את המנצחת משאירים.<\/p>\n<hr />\n<h2>צ׳קליסט: שבוע הפנייה הראשון<\/h2>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ערכת הפנייה מוכנה (חלק ב׳)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מילאתי 20 שורות בגיליון ״לידים״ (חלק ד׳), ודירגתי א׳/ב׳/ג׳<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> שלחתי ל־2 ״מגבירים״ (תבנית 5)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> שלחתי הודעה אישית ל־3–5 הורים מהמעגל שלי (תבנית 3א)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> פניתי לעוד 3–5 לידים בדירוג א׳ (גנים, מתנ״סים, קייטנות). <strong>סה״כ בערך 10 פניות בשבוע<\/strong><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> רשמתי ביומן תזכורות לפולואפ ביום 3 וביום 7<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> כל מי שענה ״מעוניין/ת״ עבר ל<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>, תחנה 2<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> בסוף השבוע: מילאתי את טבלת המדדים, ובחרתי דבר <strong>אחד<\/strong> לשנות בשבוע הבא<\/li>\n<\/ul>\n<p><strong>קבצים קשורים:<\/strong><\/p>\n<p><a href=\"06-show-offer.md\">הצעת המופע<\/a> · <a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a> · <a href=\"12-booking-process.md\">תהליך ההזמנה<\/a> · <a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a> · <a href=\"03-video-scripts.md\">תסריטי הווידאו<\/a> · <a href=\"08-consent-template.md\">טופס אישור הצילום<\/a> · <a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a> · <a href=\"../site/index.html\">עמוד הנחיתה<\/a><\/p>"}, "docs/11-pricing-worksheet.md": {"title": "גיליון תמחור: איך קובעים מחיר בלי לנחש", "html": "<h1>גיליון תמחור: איך קובעים מחיר בלי לנחש<\/h1>\n<blockquote>\n<p><strong>למה את צריכה את זה:<\/strong> המחיר הוא ההחלטה העסקית הכי חשובה שלך בהתחלה. מחיר נמוך מדי ״נדבק״ אלייך: קשה להעלות אותו, וגם מעביר מסר של מופע ״זול״. מחיר גבוה מדי בלי הוכחות (סרטון, המלצות) פשוט לא נסגר.<\/p>\n<p><strong>מה תקבלי בסוף:<\/strong> שלושה מספרים לכל חבילה: <strong>מחיר רצפה<\/strong> (מתחתיו את מפסידה), <strong>מחיר שוק<\/strong> (מה גובים מפעילים דומים באזור שלך), ו<strong>המחיר שלך<\/strong>, שנמצא ביניהם.<\/p>\n<p><strong>חוק אחד:<\/strong> בקובץ הזה <strong>אין מחיר למופע שלך.<\/strong> יש שיטה. את המספרים ממלאת את, לפי הנתונים האמיתיים שלך.<\/p>\n<\/blockquote>\n<p><strong>זמן:<\/strong> בפעם הראשונה 2–3 שעות (כולל מחקר השוק). אחר כך 30 דקות כל 3 חודשים.<\/p>\n<p><strong>איפה ממלאים:<\/strong> אפשר כאן, אבל נוח יותר להעתיק את הטבלאות לגיליון Google Sheets בשם ״קים — תמחור״, ליד גיליון הלקוחות מ<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>.<\/p>\n<hr />\n<h2>איך עובדים עם הגיליון: 8 שלבים<\/h2>\n<table>\n<thead>\n<tr>\n<th>שלב<\/th>\n<th>מה עושים<\/th>\n<th>זמן<\/th>\n<th>מה יוצא<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>סופרת כמה זמן באמת לוקחת הופעה אחת, ומחליטה על שכר שעתי נטו<\/td>\n<td>20 דק׳<\/td>\n<td><strong>שכר נטו להופעה<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>מחשבת עלויות ישירות לכל הופעה (נסיעה, חומרים)<\/td>\n<td>15 דק׳<\/td>\n<td><strong>עלות ישירה להופעה<\/strong><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>מחשבת עלויות קבועות לשנה ומחלקת להופעות<\/td>\n<td>20 דק׳<\/td>\n<td><strong>חלק קבוע להופעה<\/strong><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>בודקת מצב מס (פטור/מורשה) ואחוז הפרשה<\/td>\n<td>10 דק׳ + שיחה עם רו״ח<\/td>\n<td><strong>אחוז מס, מע״מ כן/לא<\/strong><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>מחברת הכל: מחיר רצפה<\/td>\n<td>5 דק׳<\/td>\n<td><strong>מחיר רצפה<\/strong><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>בודקת 5 מפעילים דומים באזור<\/td>\n<td>שעה<\/td>\n<td><strong>טווח מחירי שוק<\/strong><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>קובעת מחיר לכל חבילה ולתוספות<\/td>\n<td>20 דק׳<\/td>\n<td><strong>מחירון<\/strong><\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>בוחרת שלב פיילוט ומחיר השקה<\/td>\n<td>10 דק׳<\/td>\n<td><strong>מה אומרים ללקוח הבא<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>שלב 1 — כמה זמן באמת לוקחת הופעה אחת<\/h2>\n<p><strong>הטעות הכי נפוצה של מתחילות:<\/strong> לחשוב שמופע של 45 דקות הוא 45 דקות עבודה. בפועל זה בערך חצי יום. תמלאי את העמודה ״שלך״ אחרי ההופעה הראשונה, לפי מה שקרה באמת.<\/p>\n<table>\n<thead>\n<tr>\n<th>פעולה<\/th>\n<th>דוגמה (דקות)<\/th>\n<th>שלך (דקות)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>התכתבות ושיחה עם הלקוח, שאלון פרטים, הצעת מחיר (<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>)<\/td>\n<td>30<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>הכנה: התאמת המופע לגיל ולקבוצה, פלייליסט, אריזת ציוד<\/td>\n<td>30<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>התלבשות, קוקו, חימום גוף וקול<\/td>\n<td>15<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>נסיעה הלוך<\/td>\n<td>30<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>הגעה 30 דק׳ לפני: סיבוב בטיחות, קו במה, רמקול, תדריך לאחראי/ת (<a href=\"02-show-script.md\">תסריט המופע<\/a>, פרק 4)<\/td>\n<td>30<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>המופע עצמו<\/td>\n<td>45<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>10 הדקות שאחרי: פרידה, ספירת ציוד, איסוף<\/td>\n<td>15<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>נסיעה חזור<\/td>\n<td>30<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>אחרי: הודעת תודה, קבלה, עדכון גיליון, משוב (<a href=\"05-pilot-feedback.md\">טופס המשוב<\/a>)<\/td>\n<td>15<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>סה״כ<\/strong><\/td>\n<td><strong>240 דק׳ = 4 שעות<\/strong><\/td>\n<td><strong>___ דק׳ = ___ שעות<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>כמה שווה שעה שלך (נטו, אחרי מס)<\/h3>\n<p>בחרי אחת משתי הדרכים, ורשמי את המספר הגבוה מביניהן:<\/p>\n<ol>\n<li><strong>מהיעד שלך:<\/strong> כמה כסף נטו את רוצה שהעסק ייתן לך בחודש ÷ כמה שעות בחודש את מוכנה לתת לו (כולל הכל: הופעות, צילום, שיווק).<\/li>\n<li><strong>מהשוק שלך:<\/strong> כמה את מקבלת (או קיבלת) נטו לשעה בעבודה הקיימת שלך, למשל בהדרכת תנועה לילדים. זה המינימום. כעצמאית את גם נושאת בסיכון, בלי ימי חופשה ומחלה בתשלום, ועם הפרשה לפנסיה על חשבונך, ולכן השכר השעתי שלך צריך להיות <strong>גבוה<\/strong> ממה שאת מקבלת כשכירה.<\/li>\n<\/ol>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>שכר נטו רצוי לשעה<\/td>\n<td>___ ₪<\/td>\n<\/tr>\n<tr>\n<td>שעות להופעה (מהטבלה למעלה)<\/td>\n<td>___<\/td>\n<\/tr>\n<tr>\n<td><strong>שכר נטו להופעה<\/strong> = שכר לשעה × שעות<\/td>\n<td><strong>___ ₪<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>שימי לב:<\/strong> את השעות של <strong>הפקת התוכן<\/strong> (סרטונים) לא מכניסים למחיר של הופעה אחת. הן השקעה בשיווק. אבל כן כדאי לדעת כמה שעות בחודש הן לוקחות, כדי שהיעד החודשי יהיה אמיתי.<\/p>\n<\/blockquote>\n<hr />\n<h2>שלב 2 — עלויות ישירות לכל הופעה<\/h2>\n<p>אלה עלויות שקיימות <strong>רק כי יצאת להופעה הזאת.<\/strong><\/p>\n<h3>איך מחשבים נסיעה<\/h3>\n<ul>\n<li><strong>עלות לק״מ<\/strong> = (מחיר ליטר דלק ÷ כמה ק״מ הרכב שלך עושה לליטר) + בלאי לק״מ.<ul>\n<li>מחיר הדלק בישראל מתעדכן בדרך כלל פעם בחודש. <strong>לבדוק<\/strong> את המחיר העדכני לפני החישוב.<\/li>\n<li><strong>בלאי<\/strong> (טיפולים, צמיגים): אם אין לך מושג, רשמי כמה הוצאת על טיפולים וצמיגים בשנה האחרונה ÷ כמה ק״מ נסעת בשנה.<\/li>\n<\/ul>\n<\/li>\n<li><strong>בלי רכב:<\/strong> רשמי את המחיר האמיתי של מונית או תחבורה ציבורית הלוך־חזור, <strong>עם הציוד<\/strong>. תיק ציוד ורמקול בתחבורה ציבורית זה אפשרי בפיילוט, פחות בשגרה.<\/li>\n<li><strong>חניה וכביש אגרה:<\/strong> אם יש, נכנסים לחישוב.<\/li>\n<\/ul>\n<h3>הטבלה<\/h3>\n<table>\n<thead>\n<tr>\n<th>פריט<\/th>\n<th>דוגמה (₪, מומצא לתרגול)<\/th>\n<th>שלך (₪)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>נסיעה הלוך־חזור (ק״מ × עלות לק״מ)<\/td>\n<td>60<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>חניה / כביש אגרה<\/td>\n<td>0<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>מדבקות לילדים<\/td>\n<td>15<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>מתכלים: סרט הדבקה לקו הבמה, סוללות לשלט<\/td>\n<td>5<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>כביסה (תלבושת, צעיפים)<\/td>\n<td>10<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>הדפסה (״דף משחקים לגננת״, ראי <a href=\"06-show-offer.md\">הצעת המופע<\/a>)<\/td>\n<td>0<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>עמלת תשלום, אם יש (העברה, אפליקציית תשלום, סליקה) — <strong>לבדוק<\/strong> אצל הספק שלך<\/td>\n<td>0<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>עלות אישית שנוצרת בגלל ההופעה (למשל בייביסיטר)<\/td>\n<td>0<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>סה״כ עלות ישירה להופעה<\/strong><\/td>\n<td><strong>90<\/strong><\/td>\n<td><strong>___<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>שלב 3 — עלויות קבועות, ואיך מחלקים אותן להופעות<\/h2>\n<p>אלה עלויות שקיימות <strong>גם אם אין הופעות<\/strong> החודש. כל הופעה צריכה ״לשלם״ חלק מהן.<\/p>\n<h3>איך מחלקים ציוד שמחזיק כמה שנים (״בלאי״)<\/h3>\n<p>רמקול שעולה 400 ₪ ומחזיק שנתיים עולה לך 200 ₪ בשנה. אם יש לך 40 הופעות בשנה, כל הופעה ״משלמת״ 5 ₪ על הרמקול. <em>(המספרים לתרגול בלבד.)<\/em><\/p>\n<h3>הטבלה<\/h3>\n<p>את המחירים של הציוד והתלבושת קחי מהקבצים שבהם הם מפורטים, <strong>לפי מה שקנית בפועל<\/strong>, לא לפי ההערכה.<\/p>\n<table>\n<thead>\n<tr>\n<th>פריט<\/th>\n<th>מאיפה הנתון<\/th>\n<th>כמה שנים מחזיק<\/th>\n<th>עלות לשנה (₪)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ציוד פיילוט: רמקול, שלט, קובייה, כדורים, ערכת עזרה ראשונה<\/td>\n<td><a href=\"02-show-script.md\">תסריט המופע<\/a>, פרק 10<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>ציוד שדרוג (מגבר קול עם מיקרופון ראש וכו׳) — רק כשקנית<\/td>\n<td><a href=\"02-show-script.md\">תסריט המופע<\/a>, פרק 10<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>תלבושת (כולל סט שני כשיהיה)<\/td>\n<td><a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>לוגו / עיצוב בסיסי<\/td>\n<td><a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>ביטוח (אחריות כלפי צד ג׳ / מקצועית) — <strong>מחיר לבדוק<\/strong> מול סוכן<\/td>\n<td><a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a><\/td>\n<td>1<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>רו״ח / הנהלת חשבונות, תוכנה להפקת קבלות<\/td>\n<td><a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a><\/td>\n<td>1<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>קורס עזרה ראשונה, אישורים<\/td>\n<td><a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>רישוי מוזיקה, <strong>אם יתברר שנדרש<\/strong> — <strong>לבדוק<\/strong><\/td>\n<td><a href=\"02-show-script.md\">תסריט המופע<\/a>, פרק 8; <a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a><\/td>\n<td>1<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>חלק עסקי מהטלפון והאינטרנט<\/td>\n<td>החשבון שלך<\/td>\n<td>1<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>דומיין / עמוד נחיתה פשוט<\/td>\n<td><a href=\"../site/index.html\">עמוד הנחיתה<\/a><\/td>\n<td>1<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>הדפסות: כרטיסי ביקור, דף הצעה<\/td>\n<td>—<\/td>\n<td>1<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>קידום ממומן — <strong>רק אחרי<\/strong> <a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a><\/td>\n<td>—<\/td>\n<td>1<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>סה״כ עלויות קבועות לשנה<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<td><strong>___<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>מספר הופעות צפוי בשנה הראשונה (<strong>שמרני!<\/strong>)<\/td>\n<td>___<\/td>\n<\/tr>\n<tr>\n<td><strong>חלק קבוע להופעה<\/strong> = סה״כ לשנה ÷ מספר הופעות<\/td>\n<td><strong>___ ₪<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>למה שמרני:<\/strong> אם תניחי 100 הופעות בשנה ובפועל יהיו 30, כל הופעה ״שילמה״ רק שליש ממה שהיא הייתה צריכה, והפער יוצא מהכיס שלך. בשנה הראשונה עדיף להניח מעט הופעות ולהיות מופתעת לטובה.<\/p>\n<\/blockquote>\n<hr />\n<h2>שלב 4 — מסים: מה צריך לדעת כדי לתמחר נכון<\/h2>\n<blockquote>\n<p><strong>זה לא ייעוץ מס.<\/strong> כאן רק מה שצריך לתמחור. הפרטים על פתיחת העסק ב<a href=\"13-legal-admin.md\">מסמך הרישוי והמנהלה<\/a>. את האחוזים המדויקים קובעים עם רו״ח או יועץ/ת מס.<\/p>\n<\/blockquote>\n<h3>עוסק פטור או עוסק מורשה: מה זה משנה במחיר<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>עוסק פטור<\/th>\n<th>עוסק מורשה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>גובה מע״מ מהלקוח?<\/td>\n<td><strong>לא<\/strong><\/td>\n<td><strong>כן<\/strong>, ומעביר/ה למדינה<\/td>\n<\/tr>\n<tr>\n<td>מה כותבים בהצעה ללקוח פרטי (הורים)<\/td>\n<td>מחיר סופי. אפשר לציין ״עוסק פטור, לא כולל מע״מ כי לא חל״<\/td>\n<td><strong>מחיר סופי כולל מע״מ<\/strong><\/td>\n<\/tr>\n<tr>\n<td>מה כותבים בהצעה למוסד (מתנ״ס, רשות, גן פרטי)<\/td>\n<td>מחיר + ״עוסק פטור״<\/td>\n<td>מחיר + ״לא כולל מע״מ״ או ״כולל מע״מ״, <strong>תמיד לכתוב במפורש<\/strong><\/td>\n<\/tr>\n<tr>\n<td>מתי חובה לעבור למורשה<\/td>\n<td>כשהמחזור השנתי עובר את התקרה<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>תקרת עוסק פטור לשנת 2026:<\/strong> 122,833 ₪ מחזור שנתי, לפי <a href=\"https://www.greeninvoice.co.il/magazine/תקרת-עוסק-פטור/\">Green Invoice<\/a>. <strong>לבדוק<\/strong> באתר רשות המסים לפני החלטה.<\/li>\n<li><strong>שיעור המע״מ:<\/strong> 18% החל מ־1.1.2025, לפי <a href=\"https://meitar.com/wp-content/uploads/2025/01/Preparing-for-VAT-Changes-in-the-Upcoming-Tax-Year-2025-–-A-Value-Added-Review-HEB.pdf\">סקי
