רה של משרד מיתר<\/a>. <strong>לבדוק<\/strong> שזה עדיין השיעור כשאת מתמחרת.<\/li>\n<li><strong>מס הכנסה וביטוח לאומי:<\/strong> משולמים על <strong>הרווח<\/strong> (הכנסות פחות הוצאות מוכרות), ולא על כל ההכנסה. האחוז תלוי בגובה ההכנסה השנתית שלך, ולכן <strong>אין לי מספר בשבילך<\/strong>. שאלי את הרו״ח: ״כמה אחוז מהרווח לשים בצד למס הכנסה וביטוח לאומי, לפי ההכנסה שאני צופה?״<\/li>\n<li><strong>פנסיה:<\/strong> על עצמאים חלה חובת הפקדה לפנסיה. <strong>לבדוק<\/strong> עם הרו״ח כמה, ולהכניס את זה לשכר הנטו הרצוי שלך (שלב 1).<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>עוסק פטור / מורשה<\/td>\n<td>___<\/td>\n<\/tr>\n<tr>\n<td>אחוז הפרשה למס הכנסה + ביטוח לאומי (מהרו״ח)<\/td>\n<td>___%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>שלב 5 — מחיר הרצפה<\/h2>\n<p><strong>מחיר הרצפה<\/strong> הוא המחיר שמתחתיו את <strong>מממנת את הלקוח מהכיס שלך.<\/strong> את לא חייבת לגבות אותו בפיילוט (ראי שלב 8), אבל את חייבת לדעת מה הוא.<\/p>\n<h3>הנוסחה<\/h3>\n<pre><code>רווח לפני מס     = שכר נטו להופעה ÷ (1 − אחוז מס)\nמחיר רצפה        = עלות ישירה + חלק קבוע + רווח לפני מס\nעוסק מורשה, לקוח פרטי:  מחיר לפרסום = מחיר רצפה × (1 + שיעור מע״מ)\n<\/code><\/pre>\n<h3>דוגמה מלאה (כל המספרים מומצאים, רק כדי לתרגל את החשבון)<\/h3>\n<blockquote>\n<p>המספרים בדוגמה נבחרו כי קל לחשב איתם. <strong>הם לא המלצה ולא המחיר שלך.<\/strong><\/p>\n<\/blockquote>\n<table>\n<thead>\n<tr>\n<th>שורה<\/th>\n<th>חישוב<\/th>\n<th>דוגמה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>שכר נטו רצוי לשעה<\/td>\n<td>—<\/td>\n<td>100 ₪<\/td>\n<\/tr>\n<tr>\n<td>שעות להופעה<\/td>\n<td>—<\/td>\n<td>4<\/td>\n<\/tr>\n<tr>\n<td>שכר נטו להופעה<\/td>\n<td>100 × 4<\/td>\n<td>400 ₪<\/td>\n<\/tr>\n<tr>\n<td>אחוז מס (נניח שזה מה שהרו״ח אמר)<\/td>\n<td>—<\/td>\n<td>20%<\/td>\n<\/tr>\n<tr>\n<td>רווח לפני מס<\/td>\n<td>400 ÷ 0.8<\/td>\n<td>500 ₪<\/td>\n<\/tr>\n<tr>\n<td>עלות ישירה<\/td>\n<td>שלב 2<\/td>\n<td>90 ₪<\/td>\n<\/tr>\n<tr>\n<td>חלק קבוע<\/td>\n<td>6,000 ₪ לשנה ÷ 40 הו > ספק אחד באזור אחד, בלי תאריך עדכון<\/td>\n<\/tr>\n<tr>\n<td>מופע או הפעלה <strong>בגן<\/strong> או <strong>בקייטנה<\/strong><\/td>\n<td>לא מצאתי מקור אמין<\/td>\n<td>—<\/td>\n<td><strong>לבדוק<\/strong> רק דרך המחקר שלך: גננות, רכזות, שאלת הבונוס<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>המסקנה:<\/strong> המספרים האלה מראים שיש שוק עם טווח רחב. <strong>המחיר שלך נקבע לפי 5 המפעילים באזור שלך ולפי הרצפה שלך<\/strong>, לא לפי ממוצע ארצי.<\/p>\n<hr />\n<h2>שלב 7 — מחיר לכל חבילה ולתוספות<\/h2>\n<p>החבילות עצמן (מה כלול, משך, מספר ילדים) מוגדרות ב<a href=\"06-show-offer.md\">הצעת המופע<\/a>. כאן רק המספרים.<\/p>\n<h3>טבלת המחירון<\/h3>\n<table>\n<thead>\n<tr>\n<th>חבילה<\/th>\n<th>מה משפיע על המחיר<\/th>\n<th>רצפה<\/th>\n<th>מחיר מלא<\/th>\n<th>מחיר השקה<\/th>\n<th>הערות<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1. יום הולדת עם קים<\/strong> (45 דק׳, עד 25 ילדים)<\/td>\n<td>שישי וחגים מבוקשים יותר<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>2א. קים בגן<\/strong> — גרסת 3–4 (30 דק׳)<\/td>\n<td>לא להוריד יחסית למשך (שלב 5)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>2ב. קים בגן<\/strong> — גרסת 5–6 (45 דק׳)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>מופע נוסף ברצף, באותו מקום ובאותו יום<\/strong><\/td>\n<td>אין נסיעה ואין התארגנות<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>המקום לתת הנחה<\/td>\n<\/tr>\n<tr>\n<td><strong>3א. קייטנה / מתנ״ס<\/strong> — מופע בודד<\/td>\n<td>גודל קבוצה; מעל 25 ילדים צריך מגבר<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>3ב. קייטנה / מתנ״ס<\/strong> — סדרה של 3 מפגשים<\/td>\n<td>התחייבות מראש<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>מחיר למפגש נמוך מבודד, סה״כ גבוה<\/td>\n<\/tr>\n<tr>\n<td><strong>4. אירוע משפחות<\/strong> (ילדים + הורים)<\/td>\n<td>קהל גדול יותר, מגבר חובה, לרוב סופ״ש<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>תוספות<\/h3>\n<table>\n<thead>\n<tr>\n<th>תוספת<\/th>\n<th>איך מתמחרים<\/th>\n<th>המחיר שלך<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>הארכה ל־50–55 דקות<\/strong> (הגרסה הארוכה בפרק 7 ב<a href=\"02-show-script.md\">תסריט המופע<\/a>)<\/td>\n<td>לפי זמן נוסף + אנרגיה<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>נסיעה מעבר לרדיוס<\/strong><\/td>\n<td>ראי ״מדיניות נסיעות״ למטה<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>שעת שיא<\/strong> (שישי, ערב חג, שבוע החנוכה)<\/td>\n<td>החלטה שלך: תוספת קבועה, או פשוט מחיר מלא בלי הנחות<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>קבוצה מעל 25 ילדים<\/strong><\/td>\n<td>רק כשיש לך מגבר; מעל 60 ילדים מציעים שני מופעים<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>מדיניות נסיעות (לבחור אחת)<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>רדיוס חינם + תוספת:<\/strong> ״עד ___ ק״מ מהבית ללא תוספת, מעבר לזה ___ ₪ לכל ק״מ (הלוך־חזור)״. את התוספת לק״מ קחי משלב 2, <strong>ותוסיפי את הזמן<\/strong>.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אזורים:<\/strong> ״אזור א׳ (העיר והסביבה): ללא תוספת · אזור ב׳: ___ ₪ · אזור ג׳: ___ ₪״. פשוט יותר להסביר ללקוחות.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מעבר ל־___ דקות נסיעה לכיוון, לא בשלב הזה.<\/strong> בשנה הראשונה עדיף להתרכז באזור אחד, שבו גם ההמלצות מפה לאוזן עובדות.<\/li>\n<\/ul>\n<h3>חוקי מחיר שלא מתפשרים עליהם<\/h3>\n<ol>\n<li><strong>מחיר אחד ברור.<\/strong> לא ״בערך״, לא ״תלוי״. ״המחיר הוא ___ ₪, והוא כולל ___.״<\/li>\n<li><strong>מספרים עגולים.<\/strong> קל לזכור, קל להעביר.<\/li>\n<li><strong>אותו מחיר לכולם באותה חבילה.<\/strong> גננות ורכזות מדברות ביניהן.<\/li>\n<li><strong>הנחה רק בתמורה למשהו:<\/strong> מועד גמיש (בוקר באמצע השבוע), מופע נוסף ברצף, סדרת מפגשים, משוב והמלצה בכתב, הפניה ללקוח נוסף.<\/li>\n<li><strong>אף פעם לא מתחת לרצפה<\/strong> במחיר המלא או במחיר ההשקה. מתחת לרצפה רק בפיילוט מתוכנן (שלב 8), וידוע מראש לכמה הופעות.<\/li>\n<li><strong>לא מורידים מחיר בשיחה עצמה<\/strong> בגלל ש״יקר״. אומרים ״אני אחזור אלייך מחר״, חושבים עם הגיליון, ורק אז עונים. (תשובות מוכנות ל״יקר״ ב<a href=\"10-outreach-templates.md\">תבניות הפנייה<\/a>.)<\/li>\n<\/ol>\n<hr />\n<h2>שלב 8 — אסטרטגיית מחיר לפיילוט<\/h2>\n<p>המטרה בהתחלה היא <strong>לא להרוויח<\/strong>, אלא להשיג <strong>הוכחות<\/strong>: המלצות בכתב, סרטון (באישור), נתונים מ<a href=\"05-pilot-feedback.md\">טופס המשוב<\/a>, ושלוש־ארבע הופעות של תרגול. אבל <strong>בלי לקבע מחיר נמוך<\/strong> שיהיה קשה לצאת ממנו.<\/p>\n<h3>שלבי המחיר<\/h3>\n<table>\n<thead>\n<tr>\n<th>שלב<\/th>\n<th>למי<\/th>\n<th>מחיר<\/th>\n<th>מה את מקבלת בתמורה<\/th>\n<th>מתי עוברים לשלב הבא<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>0. פיילוט חברים<\/strong><\/td>\n<td>חברים ומשפחה, <strong>1–2 הופעות לכל היותר<\/strong><\/td>\n<td>חינם, או רק כיסוי עלויות ישירות (שלב 2)<\/td>\n<td>צופה שממלא/ת את <a href=\"05-pilot-feedback.md\">טופס המשוב<\/a>, שאלון להורים, ציטוט באישור, צילום <strong>רק באישור<\/strong> (<a href=\"08-consent-template.md\">טופס אישור הצילום<\/a>)<\/td>\n<td>אחרי 2 הופעות, גם אם לא הכל מושלם<\/td>\n<\/tr>\n<tr>\n<td><strong>1. פיילוט בתשלום<\/strong><\/td>\n<td>לקוחות אמיתיים שלא מכירים אותך: גן, יום הולדת, קבוצה בקייטנה. <strong>2–3 הופעות<\/strong><\/td>\n<td>לפחות מכסה את העלויות הישירות. <strong>לא בחינם<\/strong><\/td>\n<td>משוב, ציטוט, הפניה. וגם תשובה לשאלה הכי חשובה: <strong>האם זרים מוכנים לשלם?<\/strong><\/td>\n<td>כשמתקיים הכלל ״יש מוצר״ ב<a href=\"05-pilot-feedback.md\">טופס המשוב<\/a> (חלק ז׳)<\/td>\n<\/tr>\n<tr>\n<td><strong>2. מחיר השקה<\/strong><\/td>\n<td>5–10 הלקוחות המשלמים הראשונים<\/td>\n<td>בין הרצפה למחיר המלא. <strong>בהצעה כותבים את שני המחירים<\/strong><\/td>\n<td>המלצות בכתב, תגובות בגוגל או ברשתות, הפניות<\/td>\n<td>אחרי ___ הופעות או עד תאריך ___ (מחליטים מראש!)<\/td>\n<\/tr>\n<tr>\n<td><strong>3. מחיר מלא<\/strong><\/td>\n<td>כולם<\/td>\n<td>המחיר המלא מהמחירון<\/td>\n<td>—<\/td>\n<td>בדיקה כל 3 חודשים (למטה)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>איך כותבים מחיר השקה (כדי שהמחיר המלא ״יישאר בראש״)<\/h3>\n<blockquote>\n<p><strong>מחיר מלא:<\/strong> [___] ₪<\/p>\n<p><strong>מחיר השקה לחמשת הלקוחות הראשונים:<\/strong> [___] ₪, בתמורה למשוב קצר אחרי המופע.<\/p>\n<\/blockquote>\n<p>כך הלקוח זוכר שהמחיר האמיתי גבוה יותר, ואת לא צריכה ״להעלות מחיר״ אחר כך. רק להפסיק את ההנחה.<\/p>\n<h3>מה לא עושים בפיילוט<\/h3>\n<ul>\n<li><strong>לא מפרסמים ״חינם״<\/strong> בקבוצות גדולות. ״חינם״ מושך את הקהל הלא נכון וקובע מחיר בראש של אנשים. אם צריך, כותבים ״מחיר השקה למספר מוגבל של משפחות״.<\/li>\n<li><strong>לא נותנים הנחה בלי להחליט מראש עד מתי.<\/strong> ״השקה״ בלי סוף היא פשוט המחיר שלך.<\/li>\n<li><strong>לא סוגרים פיילוט ב״איך שבא לכם״<\/strong> (בלי שעה מוגדרת, בלי מבוגר בחדר, בלי מקום מתאים). גם פיילוט עובר את <a href=\"12-booking-process.md\">שאלון ההזמנה<\/a> ואת <a href=\"02-show-script.md\">צ׳קליסט הבטיחות<\/a>.<\/li>\n<\/ul>\n<h3>מתי לשנות מחיר: כללי אצבע אחרי כל 10 הצעות מחיר<\/h3>\n<blockquote>\n<p>אלה <strong>כללי אצבע<\/strong> לעבודה, לא מחקר. הם עוזרים להחליט לפי מה שקרה ולא לפי תחושה. את הנתונים לוקחים מגיליון הלקוחות ב<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a> (כמה הצעות נשלחו, כמה נסגרו).<\/p>\n<\/blockquote>\n<table>\n<thead>\n<tr>\n<th>מה קרה ב־10 ההצעות האחרונות<\/th>\n<th>מה זה כנראה אומר<\/th>\n<th>מה עושים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>כמעט כולן נסגרו מיד<\/strong>, בלי שאלה על המחיר<\/td>\n<td>המחיר כנראה נמוך<\/td>\n<td>מעלים בהצעות הבאות (לקוחות שכבר סגרו נשארים במחיר שסוכם)<\/td>\n<\/tr>\n<tr>\n<td><strong>רובן נסגרו<\/strong>, חלק אחרי שאלה או התלבטות<\/td>\n<td>המחיר בסדר<\/td>\n<td>לא נוגעים<\/td>\n<\/tr>\n<tr>\n<td><strong>רובן לא נסגרו, והסיבה שנאמרה היא מחיר<\/strong><\/td>\n<td>או שהמחיר גבוה, או שהלקוח לא ראה מספיק ערך<\/td>\n<td><strong>לפני<\/strong> שמורידים: נשלח סרטון? נשלחו המלצות? פנית לקהל הנכון? המחיר שלך מעל האמצעי ב־5 המפעילים בלי יתרון ברור? רק אם כן, מורידים<\/td>\n<\/tr>\n<tr>\n<td><strong>רובן לא נסגרו, ולא ברור למה<\/strong><\/td>\n<td>חסר מידע<\/td>\n<td>מתקשרים לשניים־שלושה ושואלים בעדינות: ״מה היה גורם לזה להתאים לכם?״<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>איך אומרים את המחיר (בטלפון ובוואטסאפ)<\/h2>\n<p><strong>הנוסחה:<\/strong> מה כלול → המחיר → שקט.<\/p>\n<blockquote>\n<p>״המופע הוא 45 דקות של משחק פעיל, אני מגיעה עם כל הציוד והמוזיקה, וילד/ת יום ההולדת הוא/היא הקפטן/ית שלי. המחיר הוא [<strong><em>] ₪, כולל הכל באזור [<\/em><\/strong>].״<\/p>\n<\/blockquote>\n<p>ואז <strong>שותקים<\/strong> ומחכים לתגובה. לא מוסיפים ״אבל אם זה יקר אפשר...״. התשובות המוכנות ל״יקר״, ״אין תקציב״ ו״יש לנו כבר מפעיל״ נמצאות ב<a href=\"10-outreach-templates.md\">תבניות הפנייה<\/a>.<\/p>\n<hr />\n<h2>בדיקה כל 3 חודשים (30 דקות)<\/h2>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> עדכנתי את טבלת הזמן (שלב 1) לפי ההופעות האחרונות<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> עדכנתי עלויות ישירות (מחיר דלק, חומרים)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> עדכנתי עלויות קבועות: מה קניתי, מה מחיר הביטוח בפועל<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> עדכנתי את מספר ההופעות הצפוי לשנה לפי הקצב האמיתי<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> חישבתי מחדש את מחיר הרצפה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> בדקתי שוב 2–3 מתוך 5 המפעילים (האם שינו מחיר?)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> בדקתי את כללי האצבע על 10 ההצעות האחרונות<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> החלטתי: מעלה / משאירה / משנה חבילה. רשמתי את ההחלטה ואת התאריך<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> עדכנתי את <a href=\"06-show-offer.md\">הצעת המופע<\/a> ואת <a href=\"../site/index.html\">עמוד הנחיתה<\/a>, אם יש בו מחיר<\/li>\n<\/ul>\n<hr />\n<h2>מקורות ודברים לבדוק<\/h2>\n<table>\n<thead>\n<tr>\n<th>נושא<\/th>\n<th>מקור<\/th>\n<th>סטטוס<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>מחירי הפעלות ימי הולדת (ממוצע מדווח)<\/td>\n<td><a href=\"https://www.midrag.co.il/Content/PriceList/675933\">מידרג<\/a><\/td>\n<td><strong>הערכה, לבדוק.<\/strong> עודכן 14/7/2025 לפי האתר<\/td>\n<\/tr>\n<tr>\n<td>מחירון מומלץ של ספק אחד<\/td>\n<td><a href=\"https://www.b144.co.il/%D7%94%D7%A4%D7%A2%D7%9C%D7%95%D7%AA-%D7%9C%D7%99%D7%9C%D7%93%D7%99%D7%9D/מעלה-החמישה/\">b144, מעלה החמישה<\/a><\/td>\n<td><strong>הערכה, לבדוק<\/strong><\/td>\n<\/tr>\n<tr>\n<td>תקרת עוסק פטור 2026<\/td>\n<td><a href=\"https://www.greeninvoice.co.il/magazine/תקרת-עוסק-פטור/\">Green Invoice<\/a><\/td>\n<td><strong>לבדוק<\/strong> ברשות המסים<\/td>\n<\/tr>\n<tr>\n<td>שיעור מע״מ 18% (מ־1.1.2025)<\/td>\n<td><a href=\"https://meitar.com/wp-content/uploads/2025/01/Preparing-for-VAT-Changes-in-the-Upcoming-Tax-Year-2025-–-A-Value-Added-Review-HEB.pdf\">משרד מיתר<\/a><\/td>\n<td><strong>לבדוק<\/strong> שעדיין בתוקף<\/td>\n<\/tr>\n<tr>\n<td>אחוז מס הכנסה, ביטוח לאומי ופנסיה לעצמאית<\/td>\n<td>רו״ח / יועץ מס<\/td>\n<td><strong>לבדוק<\/strong> לפי ההכנסה שלך<\/td>\n<\/tr>\n<tr>\n<td>מחירי ציוד<\/td>\n<td><a href=\"02-show-script.md\">תסריט המופע<\/a>, פרק 10<\/td>\n<td>הערכה; לעדכן לפי קנייה בפועל<\/td>\n<\/tr>\n<tr>\n<td>ביטוח, אישורים, פתיחת עסק<\/td>\n<td><a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a><\/td>\n<td>שם כל הפרטים<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>קבצים קשורים:<\/strong><\/p>\n<p><a href=\"06-show-offer.md\">הצעת המופע<\/a> · <a href=\"10-outreach-templates.md\">תבניות פנייה<\/a> · <a href=\"12-booking-process.md\">תהליך ההזמנה<\/a> · <a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a> · <a href=\"05-pilot-feedback.md\">טופס המשוב לפיילוט<\/a> · <a href=\"02-show-script.md\">תסריט המופע<\/a> · <a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a><\/p>"}, "docs/12-booking-process.md": {"title": "תהליך ההזמנה: מהפנייה הראשונה ועד הלקוחה החוזרת", "html": "<h1>תהליך ההזמנה: מהפנייה הראשונה ועד הלקוחה החוזרת<\/h1>\n<blockquote>\n<p><strong>למה את צריכה את זה:<\/strong> כשמגיעה פנייה, קל להתרגש ולשכוח לשאול את הדברים החשובים: כמה מבוגרים יהיו בחדר, אם יש צל, מה מצב אישורי הצילום. התהליך הזה מבטיח ש<strong>כל לקוח עובר אותן 12 תחנות<\/strong>, שאף שאלת בטיחות לא נשכחת, ושכל הופעה מסתיימת בהמלצה, בהפניה או בלקוח חוזר.<\/p>\n<p><strong>איך עובדים:<\/strong> כל תחנה כוללת <strong>מתי<\/strong>, <strong>מה עושים<\/strong>, <strong>הודעה מוכנה להעתקה<\/strong>, ו<strong>מה מעדכנים בגיליון הלקוחות<\/strong> (בסוף הקובץ).<\/p>\n<p><strong>לשון:<\/strong> ההודעות כתובות בלשון נקבה, כי רוב הפונות הן אמהות, גננות ורכזות. כשכותבים לגבר, מתאימים.<\/p>\n<\/blockquote>\n<hr />\n<h2>המסלול במבט אחד<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>תחנה<\/th>\n<th>מתי<\/th>\n<th>מה את עושה<\/th>\n<th>סטטוס בגיליון<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>פנייה נכנסת<\/strong><\/td>\n<td>עונים באותו יום<\/td>\n<td>תודה + 3 שאלות קצרות<\/td>\n<td>פנייה<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>שאלון פרטים<\/strong><\/td>\n<td>שיחה של 10 דק׳ או טופס<\/td>\n<td>כל הפרטים, כולל שאלות בטיחות<\/td>\n<td>שאלון<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>בדיקת התאמה<\/strong><\/td>\n<td>מיד אחרי השאלון<\/td>\n<td>ירוק / צהוב / אדום<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><strong>הצעת מחיר<\/strong><\/td>\n<td>באותו יום<\/td>\n<td>הצעה כתובה עם תנאים<\/td>\n<td>הצעה נשלחה<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><strong>פולואפ על ההצעה<\/strong><\/td>\n<td>יום 3, יום 7<\/td>\n<td>תזכורת עדינה, ואז סגירה<\/td>\n<td>הצעה נשלחה / לא נסגר<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><strong>אישור ומקדמה<\/strong><\/td>\n<td>כשהלקוח אומר ״כן״<\/td>\n<td>אישור בכתב, מקדמה, קבלה, יומן<\/td>\n<td>סגור<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td><strong>שבוע לפני<\/strong><\/td>\n<td>7 ימים לפני<\/td>\n<td>אימות פרטים, מספר ילדים, אישורי צילום<\/td>\n<td>סגור<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td><strong>יום לפני<\/strong><\/td>\n<td>ערב לפני<\/td>\n<td>תזכורת, בדיקת חום, אריזה<\/td>\n<td>סגור<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td><strong>יום המופע<\/strong><\/td>\n<td>מגיעים 30 דק׳ לפני<\/td>\n<td>צ׳קליסט ההופעה<\/td>\n<td>בוצע<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td><strong>אותו ערב<\/strong><\/td>\n<td>עד 3 שעות אחרי<\/td>\n<td>תודה, קבלה, הקלטה קולית, גיליון<\/td>\n<td>בוצע<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td><strong>למחרת<\/strong><\/td>\n<td>24 שעות אחרי<\/td>\n<td>שאלון משוב, בקשת המלצה<\/td>\n<td>משוב<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td><strong>פולואפ ולקוח חוזר<\/strong><\/td>\n<td>לפי סוג הלקוח<\/td>\n<td>תזכורת עונתית, בקשת הפניה<\/td>\n<td>לקוח/ה חוזר/ת / ארכיון<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>הכלים (כולם חינמיים)<\/h3>\n<table>\n<thead>\n<tr>\n<th>כלי<\/th>\n<th>בשביל מה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>וואטסאפ ביזנס<\/strong> (אפליקציה נפרדת מהוואטסאפ הפרטי)<\/td>\n<td>הודעת ״לא זמינה״ אוטומטית, תשובות מהירות שמורות (את ההודעות מהקובץ הזה), ותוויות לפי סטטוס<\/td>\n<\/tr>\n<tr>\n<td><strong>Google Sheets<\/strong><\/td>\n<td>גיליון הלקוחות (בסוף הקובץ)<\/td>\n<\/tr>\n<tr>\n<td><strong>Google Forms<\/strong><\/td>\n<td>שאלון הפרטים (תחנה 2), אם נוח ללקוח למלא לבד<\/td>\n<\/tr>\n<tr>\n<td><strong>Google Calendar<\/strong><\/td>\n<td>כל הופעה עם כתובת, איש קשר ותזכורות<\/td>\n<\/tr>\n<tr>\n<td><strong>תוכנה להפקת קבלות<\/strong><\/td>\n<td>חובה על כל תשלום. בחירת התוכנה ב<a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>תחנה 1 — פנייה נכנסת<\/h2>\n<p><strong>מאיפה זה מגיע:<\/strong> וואטסאפ מ<a href=\"../site/index.html\">עמוד הנחיתה<\/a>, הודעה באינסטגרם, טלפון, המלצה מחברה, או תשובה ל<a href=\"10-outreach-templates.md\">פנייה יזומה שלך<\/a>.<\/p>\n<p><strong>הכלל:<\/strong> עונים <strong>באותו יום<\/strong>, ולכל המאוחר תוך 24 שעות. באמצע הופעה? הודעת ״לא זמינה״ אוטומטית בוואטסאפ ביזנס:<\/p>\n<blockquote>\n<p>היי! כאן קים מ״קים משחקים״ 🟡 אני כרגע באמצע משחק עם ילדים, ואחזור אלייך עד [שעה] היום. כדי לחסוך זמן, אפשר כבר לכתוב לי: תאריך, כמה ילדים ובאיזה גיל, ואיפה?<\/p>\n<\/blockquote>\n<p><strong>התשובה הראשונה (כשאת זמינה):<\/strong><\/p>\n<blockquote>\n<p>היי [שם], איזה כיף שפנית! 🟡<\/p>\n<p>כדי לבדוק זמינות ולהתאים לך את המופע, שלוש שאלות קצרות:<\/p>\n<ol>\n<li>מה התאריך והשעה?<\/li>\n<li>כמה ילדים, ובאיזה גיל?<\/li>\n<li>איפה (עיר, ובית/גינה/גן/אולם)?<\/li>\n<\/ol>\n<p>ואם נוח לך, אשמח לשיחה של 10 דקות כדי להבין בדיוק מה מתאים. מתי נוח?<\/p>\n<\/blockquote>\n<p><strong>בגיליון:<\/strong> שורה חדשה, סטטוס ״פנייה״, מקור (מאיפה הגיעו אלייך).<\/p>\n<hr />\n<h2>תחנה 2 — שאלון פרטים<\/h2>\n<p><strong>עדיף בטלפון<\/strong> (10 דקות): זה בונה אמון, ואת שומעת את הטון. אם הלקוח מעדיף לכתוב, שלחי טופס Google עם אותן שאלות.<\/p>\n<p><strong>פתיחת השיחה:<\/strong><\/p>\n<blockquote>\n<p>״היי [שם], כאן קים. תודה שפנית! יש לי כמה שאלות קצרות, ככה אני מתאימה את המופע בדיוק לילדים שלכם, ומוודאת שהכל בטוח. זה לוקח 10 דקות. מתאים?״<\/p>\n<\/blockquote>\n<h3>השאלות (לפי הסדר)<\/h3>\n<p><strong>א. בסיס<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> שם מלא, טלפון, ואיך הגעת אליי?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> סוג האירוע: יום הולדת / גן / קייטנה / מתנ״ס / אירוע משפחות<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> תאריך ושעת התחלה. יש גמישות בשעה?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> כתובת מדויקת, איפה נכנסים ואיפה אפשר לחנות או לפרוק ציוד<\/li>\n<\/ul>\n<p><strong>ב. הילדים<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> כמה ילדים? באיזה גיל (הכי צעיר, הכי גדול)?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> יש ילדים עם צרכים מיוחדים, רגישות לרעש או קושי בתנועה? <em>(רק מה שצריך כדי להתאים. בלי שמות ובלי אבחנות)<\/em><\/li>\n<\/ul>\n<p><strong>ג. המקום<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> פנים או חוץ? כמה גדול בערך? איזו רצפה?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>בחוץ:<\/strong> יש צל מלא? באיזו שעה? (בקיץ: רק בוקר מוקדם או אחה״צ מאוחר)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> יש שקע חשמל ליד אזור המשחק?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> קורה עוד משהו באותו זמן ובאותו מקום (מתנפח, הפעלה נוספת, אוכל)?<\/li>\n<\/ul>\n<p><strong>ד. מבוגרים ואחריות<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>כמה מבוגרים מהמקום יהיו בחדר לאורך כל המופע?<\/strong> (כלל העבודה שלך: לפחות אחד, ובקבוצה גדולה מבוגר/ת לכל 10–15 ילדים)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מי איש/אשת הקשר ביום עצמו, ומה הטלפון?<\/li>\n<\/ul>\n<p><strong>ה. צילום<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מה מצב אישורי הצילום? יש ילדים שאסור לצלם? (<a href=\"08-consent-template.md\">טופס אישור הצילום<\/a>)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> אפשר לבקש מהמארח/ת להגיד להורים בתחילת המופע ״מצלמים רק את הילד שלכם״?<\/li>\n<\/ul>\n<p><strong>ו. יום הולדת בלבד<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> שם הילד/ה ואיך מבטאים אותו. בן/בת כמה?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אוהב/ת להיות במרכז, או מתבייש/ת?<\/strong> (ביישן/ית מקבל/ת תפקיד שקט, למשל מחזיק/ה את הקובייה)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> יש אחים או אחיות שחשוב לשתף?<\/li>\n<\/ul>\n<p><strong>ז. מוסדות בלבד<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> על שם מי החשבונית/הקבלה? יש מספר ח.פ. או ע.ר.?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> אילו <strong>מסמכי ספק<\/strong> צריך? (רשימה בתחנה 6)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מי מאשר/ת את ההזמנה, ואיך (הזמנת עבודה, מייל)?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מתי ואיך משלמים?<\/strong> (מוסדות ציבו ן<\/a>)<\/td>\n<\/tr>\n<tr>\n<td>אישור משטרה לעבודה עם קטינים<\/td>\n<td>ראי <a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a><\/td>\n<\/tr>\n<tr>\n<td>אישור קיום ביטוח<\/td>\n<td>ראי <a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a><\/td>\n<\/tr>\n<tr>\n<td>טופס ״פתיחת ספק״ של הגוף עצמו<\/td>\n<td>כל גוף והטופס שלו. דוגמה: <a href=\"https://k-8.co.il/uploads/n/1756384015.3536.pdf\">טפסי ספקים של עיריית קריית שמונה<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>תיקייה דיגיטלית ״מסמכי ספק״<\/strong> עם כל המסמכים ב־PDF, מוכנים לשליחה במייל אחד<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מופיעים בלי אישור בכתב<\/strong> (הזמנת עבודה או מייל ממורשה/ית). ״בטח, תבואי״ בטלפון זה לא אישור<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>שואלים מתי משלמים<\/strong>, ורושמים בגיליון. תשלום של מוסד ציבורי יכול להגיע אחרי זמן רב. <strong>לבדוק<\/strong> מראש<\/li>\n<\/ul>\n<p><strong>הודעת אישור למוסד:<\/strong> כמו ההודעה לפרטי, בלי ״יום הולדת״, ועם ״אשמח לקבל הזמנת עבודה / אישור במייל, ואני שולחת את מסמכי הספק עוד היום.״<\/p>\n<hr />\n<h2>תחנה 7 — שבוע לפני<\/h2>\n<blockquote>\n<p>היי [שם], כאן קים 🟡 עוד שבוע נפגשים! רק מוודאת:<\/p>\n<ol>\n<li>[תאריך] ב־[שעה], ב[כתובת]: עדיין בתוקף?<\/li>\n<li>כמה ילדים בערך יהיו?<\/li>\n<li>[יום הולדת:] משהו חדש שכדאי שאדע על [שם הילד/ה]?<\/li>\n<li>[מוסד:] מי יהיה איתי בחדר מהצוות? ומה מצב אישורי הצילום?<\/li>\n<li>[בחוץ:] אם יהיה חם מאוד, איפה המקום המקורה שאפשר לעבור אליו?<\/li>\n<\/ol>\n<\/blockquote>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>עדכנתי בגיליון<\/strong> מספר ילדים ושינויים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אם השתנה משהו מהותי<\/strong> (הרבה יותר ילדים, עבר לחוץ), בודקת שוב התאמה (תחנה 3)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מתאימה את המופע:<\/strong> גרסת גיל, קבוצה קטנה או גדולה, רגעי קפטן/ית (<a href=\"02-show-script.md\">תסריט המופע<\/a>, פרקים 7 ו־11)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>פיילוט:<\/strong> תיאמתי צופה ושלחתי לו/ה את דף הצופה (<a href=\"05-pilot-feedback.md\">טופס המשוב<\/a>)<\/li>\n<\/ul>\n<hr />\n<h2>תחנה 8 — יום לפני<\/h2>\n<h3>ההודעה<\/h3>\n<blockquote>\n<p>היי [שם], מחר נפגשים! 🎉 אני מגיעה ב־[שעה], חצי שעה לפני, כדי להתארגן.<\/p>\n<p>תזכורת קטנה: מבוגר/ת בחדר כל הזמן, מקום פנוי, בלי אוכל בזמן המופע.<\/p>\n<p>[אם יתרה לא שולמה:] והיתרה של [___] ₪, אם אפשר עד הערב ב[אמצעי תשלום]. תודה!<\/p>\n<p>יהיה כיף! 🟡<\/p>\n<\/blockquote>\n<h3>הבדיקות שלך<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>בחוץ:<\/strong> תחזית <strong>עומס חום<\/strong> ב<a href=\"https://ims.gov.il\">שירות המטאורולוגי<\/a>. עומס חום כבד? מתקשרת למארח/ת ומעבירים פנימה או קובעים מועד חדש (<a href=\"06-show-offer.md\">הצעת המופע<\/a>, תנאי 7)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>הנחיות פיקוד העורף<\/strong> לאזור (<a href=\"https://www.oref.org.il\">oref.org.il<\/a>): יש הגבלות התקהלות?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מסלול:<\/strong> כמה זמן נסיעה, איפה חונים. מוסיפה 15 דקות ביטחון<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>טעינה:<\/strong> טלפון, רמקול, שלט, סוללה ניידת, מגבר (אם יש)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>פלייליסט<\/strong> שמור בטלפון, לא בסטרימינג (<a href=\"02-show-script.md\">תסריט המופע<\/a>, פרק 8)<\/li>\n<\/ul>\n<h3>רשימת אריזה<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> תלבושת מלאה: בגד גוף, חצאית, טייץ, סניקרס, גרביים, סרט לקוקו (<a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a>)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> רמקול + שלט Bluetooth + כבל טעינה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מגבר קול עם מיקרופון ראש (קבוצות של 25+ ובחוץ)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> קוביית קים, כדורים רכים, צעיפים (אם בתוכנית)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> סרט הדבקה לקו הבמה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מדבקות, מספיק לכל הילדים + 10<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> [יום הולדת:] אבנט/סרט ״קפטן/ית של קים״<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> [גן:] דף ״משחקים עם קים״ מודפס (<a href=\"06-show-offer.md\">הצעת המופע<\/a>, נספח)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ערכת עזרה ראשונה (<a href=\"02-show-script.md\">תסריט המופע<\/a>, פרק 9)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> דף הבמה מודפס (<a href=\"02-show-script.md\">תסריט המופע<\/a>, פרק 14)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> [פיילוט:] דפי צופה מודפסים (<a href=\"05-pilot-feedback.md\">טופס המשוב<\/a>)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> [אם רלוונטי:] עותקים של <a href=\"08-consent-template.md\">טופס אישור הצילום<\/a><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> בקבוק מים, חטיף, בגדים להחלפה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> כרטיסי ביקור / שלט קטן עם קוד QR ל<a href=\"../site/index.html\">עמוד הנחיתה<\/a> (רק כשיש)<\/li>\n<\/ul>\n<hr />\n<h2>תחנה 9 — יום המופע<\/h2>\n<h3>לוח הזמנים (ש = שעת תחילת המופע)<\/h3>\n<table>\n<thead>\n<tr>\n<th>מתי<\/th>\n<th>מה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>ש − זמן נסיעה − 15 דק׳<\/strong><\/td>\n<td>יוצאת מהבית. טלפון במצב טיסה עם Bluetooth דולק <strong>רק כשמגיעים<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>ש − 30 דק׳<\/strong><\/td>\n<td>מגיעה. מכירה את האחראי/ת. <strong>סיבוב בטיחות<\/strong> (<a href=\"02-show-script.md\">תסריט המופע<\/a>, פרק 9, ב׳)<\/td>\n<\/tr>\n<tr>\n<td><strong>ש − 25 דק׳<\/strong><\/td>\n<td>קו במה, רמקול גבוה ויציב, בדיקת שלט ועוצמה<\/td>\n<\/tr>\n<tr>\n<td><strong>ש − 20 דק׳<\/strong><\/td>\n<td>כל הציוד בתיק סגור מאחורייך<\/td>\n<\/tr>\n<tr>\n<td><strong>ש − 15 דק׳<\/strong><\/td>\n<td><strong>תדריך של דקה לאחראי/ת<\/strong> (<a href=\"02-show-script.md\">תסריט המופע<\/a>, פרק 4)<\/td>\n<\/tr>\n<tr>\n<td><strong>ש − 10 דק׳<\/strong><\/td>\n<td>הילדים מתיישבים בחצי עיגול. מוזיקת קבלת פנים חלשה<\/td>\n<\/tr>\n<tr>\n<td><strong>ש − 2 דק׳<\/strong><\/td>\n<td>הטקס שלך: 3 נשימות, 3 קפיצות, ״עם קים — כולם משחקים״<\/td>\n<\/tr>\n<tr>\n<td><strong>ש<\/strong><\/td>\n<td>המופע<\/td>\n<\/tr>\n<tr>\n<td><strong>ש + 45 דק׳<\/strong><\/td>\n<td>סיום, פרידה. מדבקות (בקבוצה גדולה, הצוות מחלק)<\/td>\n<\/tr>\n<tr>\n<td><strong>ש + 55 דק׳<\/strong><\/td>\n<td>ספירת ציוד, איסוף, תודה לאחראי/ת<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>כללי היום<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מתחילים בלי מבוגר/ת מהמקום בחדר.<\/strong> אם יצאו: ״אני צריכה שמישהו מהצוות יישאר איתנו, תודה!״<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מצלמת ילדים<\/strong> בלי אישור. אם צריך תוכן: רק את עצמך, או את ההתרחשות מאחור, לפי <a href=\"09-filming-guide.md\">מדריך הצילום<\/a>, פרק 8<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>יתרה (לקוח פרטי) שלא שולמה:<\/strong> מזכירים בעדינות <strong>לפני<\/strong> המופע, בצד, לא מול האורחים: ״רק תזכורת קטנה לגבי היתרה, אפשר עכשיו או עד הערב, מה שנוח.״<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>תמיד מסיימת בזמן.<\/strong> מופע שנמתח מעייף את הילדים, ומבוגרים זוכרים את זה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>בסוף, משפט אחד למארח/ת:<\/strong> ״היה לי ממש כיף. מחר אשלח לך 5 שאלות קצרות, זה עוזר לי מאוד.״<\/li>\n<\/ul>\n<hr />\n<h2>תחנה 10 — אותו ערב<\/h2>\n<h3>הודעת תודה<\/h3>\n<p><strong>לקוח פרטי:<\/strong><\/p>\n<blockquote>\n<p>היי [שם], תודה ענקית שהזמנתם אותי ליום ההולדת של [שם הילד/ה]! 🎂 היה לי כיף אמיתי.<\/p>\n<p>מצורף דף ״משחקים עם קים״, אם בא לכם להמשיך לשחק בבית (אפשר גם להעביר להורים של החברים).<\/p>\n<p>הקבלה על היתרה מצורפת. מחר אשלח 5 שאלות קצרות 🟡<\/p>\n<\/blockquote>\n<p><strong>מוסד:<\/strong><\/p>\n<blockquote>\n<p>היי [שם], תודה רבה על היום! 🟡 הילדים היו מדהימים.<\/p>\n<p>השארתי לך את דף ״משחקים עם קים״. הקריאה ״עם קים... כולם משחקים!״ עובדת גם כסימן עצירה, תנסי 😉<\/p>\n<p>[החשבונית/הקבלה מצורפת / אשלח את החשבונית ל־___]. מחר אשלח כמה שאלות קצרות.<\/p>\n<\/blockquote>\n<h3>מה עוד באותו ערב<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>קבלה<\/strong> על כל תשלום שהתקבל היום<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>הקלטה קולית<\/strong> של 10 דקות, באוטו, לפני שנוסעים (<a href=\"05-pilot-feedback.md\">טופס המשוב<\/a>, חלק ד׳)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>גיליון:<\/strong> סטטוס ״בוצע״, מספר ילדים בפועל, משהו מיוחד שקרה, <strong>כל אירוע בטיחות<\/strong> (גם ״כמעט״)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ציוד: צעיפים לכביסה, קובייה וכדורים לניגוב, סוללות לטעינה<\/li>\n<\/ul>\n<hr />\n<h2>תחנה 11 — למחרת: משוב, המלצה והפניה<\/h2>\n<h3>שאלון משוב<\/h3>\n<p><strong>הנוסחים המלאים<\/strong> (לצוות ולהורים) נמצאים ב<a href=\"05-pilot-feedback.md\">טופס המשוב<\/a>, חלק ה׳. שולחים אותם 24 שעות אחרי המופע, לא לפני.<\/p>\n<h3>מה עושים עם הציון (0–10)<\/h3>\n<table>\n<thead>\n<tr>\n<th>ציון<\/th>\n<th>מה עושים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>9–10<\/strong><\/td>\n<td>מבקשים: (1) אישור לצטט, (2) המלצה בגוגל או ברשתות, (3) הפניה. הודעה למטה<\/td>\n<\/tr>\n<tr>\n<td><strong>7–8<\/strong><\/td>\n<td>שואלים: ״מה היה הופך את זה ל־10?״ ורושמים. <strong>לא<\/strong> מבקשים המלצה ציבורית<\/td>\n<\/tr>\n<tr>\n<td><strong>0–6<\/strong><\/td>\n<td><strong>מתקשרים<\/strong> (לא וואטסאפ), מקשיבים בלי להתגונן, שואלים מה אפשר לתקן. רושמים ב<a href=\"05-pilot-feedback.md\">טופס המשוב<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>הודעה אחרי ציון 9–10<\/h3>\n<blockquote>\n<p>איזה כיף לקרוא, תודה! 🧡 שלוש בקשות קטנות, רק מה שנוח לך:<\/p>\n<ol>\n<li>אפשר לצטט את מה שכתבת בעמוד שלי? עם [שם פרטי + עיר / תפקיד + עיר / בלי שם], מה שתבחרי<\/li>\n<li>אם יש לך דקה, המלצה קצרה כאן תעזור לי מאוד: [קישור לגוגל / לעמוד]<\/li>\n<li>ואם את מכירה [גננת / הורה / רכזת] שזה יכול להתאים לה, אשמח שתעבירי לה את המספר שלי 🟡<\/li>\n<\/ol>\n<\/blockquote>\n<h3>איפה אוספים המלצות<\/h3>\n<ul>\n<li><strong>פרופיל עסק בגוגל<\/strong> (Google Business Profile): חינמי, ומופיע כשמחפשים ״הפעלה ליום הולדת [עיר]״. <strong>לבדוק<\/strong> את תהליך הפתיחה והאימות, ואם אפשר לפתוח פרופיל בלי כתובת עסק פתוחה לקהל<\/li>\n<li><strong>רשתות:<\/strong> תגובה בעמוד, או ציטוט בסטורי ובהיילייט ״המלצות״ (טקסט על רקע צבעוני, <strong>בלי תמונות של ילדים<\/strong>)<\/li>\n<li><strong><a href=\"../site/index.html\">עמוד הנחיתה<\/a>:<\/strong> 3 ציטוטים מאושרים<\/li>\n<\/ul>\n<h3>חוקי ההמלצות<\/h3>\n<ul>\n<li><strong>רק המלצות אמיתיות.<\/strong> לא כותבים המלצות בעצמך, לא מבקשים מחברים להמליץ על מופע שלא ראו, ולא נותנים הנחה או מתנה בתמורה להמלצה ציבורית<\/li>\n<li><strong>מצטטים רק באישור מפורש,<\/strong> ורק בפורמט שאושר<\/li>\n<li><strong>לא מפרסמים פרטים מזהים של ילדים<\/strong> בהמלצה: לא שם מלא, לא שם הגן, לא תמונה<\/li>\n<\/ul>\n<h3>טבלת המלצות מאושרות (לשונית ״המלצות״ בגיליון)<\/h3>\n<table>\n<thead>\n<tr>\n<th>תאריך<\/th>\n<th>הציטוט (מילה במילה)<\/th>\n<th>מי (בפורמט שאושר)<\/th>\n<th>איפה מותר לפרסם<\/th>\n<th>אישור התקבל ב־<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>עמוד נחיתה / רשתות / הצעת מחיר<\/td>\n<td>וואטסאפ / מייל<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>בגיליון:<\/strong> ציון ההמלצה, ״ציטוט מאושר: כן/לא״, ״הפניה: כן/לא״. סטטוס ״משוב״.<\/p>\n<hr />\n<h2>תחנה 12 — פולואפ ולקוח חוזר<\/h2>\n<p><strong>הכלל:<\/strong> פונים שוב <strong>רק עם סיבה<\/strong> (עונה, חג, אירוע), <strong>רק למי שעבד איתך<\/strong>, ותמיד עם אפשרות פשוטה להגיד ״לא תודה״. לגבי פרסומת בהודעות כתובות, ראי את הכללים ב<a href=\"10-outreach-templates.md\">תבניות הפנייה<\/a>, חלק א׳.<\/p>\n<table>\n<thead>\n<tr>\n<th>סוג לקוח<\/th>\n<th>מתי<\/th>\n<th>מה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>יום הולדת<\/strong><\/td>\n<td><strong>בתחנה 11<\/strong> שואלים: ״אפשר שאזכיר לך לקראת יום ההולדת הבא, או של אח/ות?״ רק אם אמרו כן: חודש לפני<\/td>\n<td>תזכורת אישית<\/td>\n<\/tr>\n<tr>\n<td><strong>גן<\/strong><\/td>\n<td>5–6 שבועות לפני החג או המסיבה הבאים (חנוכה, פורים, סוף שנה). <strong>לבדוק<\/strong> תאריכים בלוח השנה<\/td>\n<td>״רוצה שאגיע גם ל[חג]?״<\/td>\n<\/tr>\n<tr>\n<td><strong>קייטנה / מתנ״ס<\/strong><\/td>\n<td>כשמתכננים את העונה הבאה. <strong>לשאול את הרכזת<\/strong> מתי הם סוגרים תוכנית<\/td>\n<td>״אתם כבר בונים את [הקיץ/החנוכה]?״<\/td>\n<\/tr>\n<tr>\n<td><strong>אירוע משפחות<\/strong><\/td>\n<td>3 חודשים אחרי, או לפני חג<\/td>\n<td>״יש לכם אירוע ב[חג]?״<\/td>\n<\/tr>\n<tr>\n<td><strong>מי שלא סגר<\/strong> (״אולי בהמשך״)<\/td>\n<td><strong>רק אם אמרו במפורש ״תחזרי אליי ב־___״<\/strong><\/td>\n<td>בדיוק בזמן שביקשו<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>הודעה ללקוחה חוזרת (גן, לדוגמה)<\/h3>\n<blockquote>\n<p>היי [שם], כאן קים מ״קים משחקים״ 🟡 עוד מעט [חנוכה], ונזכרתי כמה הילדים שלך אהבו את ״הפסל של קים״. רוצה שאבוא גם ל[מסיבת חנוכה / סתם יום כיף]? יש לי משחק חדש בשבילם 😉<\/p>\n<p>(ואם לא מתאים, הכל טוב, רק תגידי לי ולא אפריע 🙂)<\/p>\n<\/blockquote>\n<h3>בקשת הפניה (לכל לקוח מרוצה, פעם אחת)<\/h3>\n<blockquote>\n<p>היי [שם], אני בונה עכשיו את הלוח ל[חנוכה/קיץ], ורוב ההזמנות שלי מגיעות מהמלצות של אנשים כמוך 🧡 מכירה [גננת / רכזת / הורה עם יום הולדת בקרוב] שזה יכול לשמח? אשמח שתעבירי את המספר שלי.<\/p>\n<\/blockquote>\n<hr />\n<h2>גיליון הלקוחות (Google Sheets)<\/h2>\n<h3>איך מקימים (20 דקות, פעם אחת)<\/h3>\n<ol>\n<li>יוצרים קובץ Google Sheets בשם <strong>״קים משחקים — לקוחות״<\/strong>.<\/li>\n<li>ארבע לשוניות: <strong>״לידים״<\/strong> (רשימת 20 הגופים מ<a href=\"10-outreach-templates.md\">תבניות הפנייה<\/a>), <strong>״הזמנות״<\/strong> (הטבלה למטה), <strong>״המלצות״<\/strong> (תחנה 11), <strong>״מדדים״<\/strong> (סיכום חודשי).<\/li>\n<li>בלשונית ״הזמנות״: שורה ראשונה עם שמות העמודות, ״הקפאה״ של השורה הראשונה (תצוגה ← הקפאה ← שורה אחת).<\/li>\n<li>בעמודת <strong>סטטוס<\/strong>: רשימה נפתחת (נתונים ← אימות נתונים ← רשימת פריטים) עם ערכי הסטטוס למטה.<\/li>\n<li><strong>פרטיות:<\/strong> הקובץ פרטי, משותף רק איתך. אימות דו־שלבי בחשבון Google.<\/li>\n<\/ol>\n<h3>העמודות (לשונית ״הזמנות״)<\/h3>\n<table>\n<thead>\n<tr>\n<th>עמודה<\/th>\n<th>דוגמה (בדויה)<\/th>\n<th>למה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>מס׳<\/td>\n<td>007<\/td>\n<td>לזיהוי מהיר<\/td>\n<\/tr>\n<tr>\n<td>תאריך פנייה<\/td>\n<td>14/10<\/td>\n<td>מודדים כמה מהר עונים<\/td>\n<\/tr>\n<tr>\n<td>מקור<\/td>\n<td>המלצה של הגננת מגן ״רימון״ / אינסטגרם / פנייה יזומה<\/td>\n<td><strong>לדעת מה עובד<\/strong><\/td>\n<\/tr>\n<tr>\n<td>שם איש/אשת קשר<\/td>\n<td>מיכל (אמא)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>טלפון<\/td>\n<td>05X-XXXXXXX<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>סוג לקוח<\/td>\n<td>יום הולדת / גן / קייטנה / מתנ״ס / משפחות<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>עיר<\/td>\n<td>[עיר]<\/td>\n<td>מדיניות נסיעות<\/td>\n<\/tr>\n<tr>\n<td>תאריך ושעת מופע<\/td>\n<td>2/11, 17:00<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>כתובת<\/td>\n<td>[כתובת]<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>מס׳ ילדים (צפוי / בפועל)<\/td>\n<td>18 / 21<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>גילאים<\/td>\n<td>5–6<\/td>\n<td>גרסת המופע<\/td>\n<\/tr>\n<tr>\n<td>חבילה<\/td>\n<td>יום הולדת עם קים<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>מחיר מוסכם<\/td>\n<td>[___] ₪<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>מקדמה (סכום, תאריך, קבלה)<\/td>\n<td>[___] ₪, 15/10, קבלה 0012<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>יתרה (סכום, שולם?)<\/td>\n<td>[___] ₪, כן<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>הערות בטיחות והתאמה<\/td>\n<td>חוץ, צל חלקי, הועבר ל־17:00; ילד עם רגישות לרעש<\/td>\n<td><strong>מה שצריך, בלי שמות ובלי אבחנות<\/strong><\/td>\n<\/tr>\n<tr>\n<td>מבוגרים בחדר<\/td>\n<td>2<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>אישורי צילום<\/td>\n<td>כן / לא / חלקי<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>תזכורת שבוע / יום נשלחה<\/td>\n<td>✓ / ✓<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>סטטוס<\/td>\n<td>בוצע<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>ציון המלצה (0–10)<\/td>\n<td>10<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>ציטוט מאושר / הפניה<\/td>\n<td>כן / כן<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>פולואפ הבא (תאריך + מה)<\/td>\n<td>1/12, לשאול על יום הולדת של האח<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>הערות<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>ערכי הסטטוס<\/h3>\n<table>\n<thead>\n<tr>\n<th>סטטוס<\/th>\n<th>מה זה אומר<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>פנייה<\/strong><\/td>\n<td>פנו אלייך, עוד לא היה שאלון<\/td>\n<\/tr>\n<tr>\n<td><strong>שאלון<\/strong><\/td>\n<td>יש פרטים, צריך לשלוח הצעה<\/td>\n<\/tr>\n<tr>\n<td><strong>הצעה נשלחה<\/strong><\/td>\n<td>מחכה לתשובה (פולואפ ביום 3 וביום 7)<\/td>\n<\/tr>\n<tr>\n<td><strong>סגור<\/strong><\/td>\n<td>יש אישור ומקדמה, המופע ביומן<\/td>\n<\/tr>\n<tr>\n<td><strong>בוצע<\/strong><\/td>\n<td>המופע היה<\/td>\n<\/tr>\n<tr>\n<td><strong>משוב<\/strong><\/td>\n<td>התקבל משוב (וציון)<\/td>\n<\/tr>\n<tr>\n<td><strong>לקוח/ה חוזר/ת<\/strong><\/td>\n<td>הזמינו שוב<\/td>\n<\/tr>\n<tr>\n<td><strong>לא נסגר<\/strong><\/td>\n<td>עם סיבה: מחיר / תאריך / אין מענה / לא מתאים (אדום) / אחר<\/td>\n<\/tr>\n<tr>\n<td><strong>בוטל<\/strong><\/td>\n<td>עם סיבה ומה קרה עם המקדמה<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>סקירה שבועית (ראשון, 15 דקות)<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> כל הפניות מהשבוע קיבלו תשובה?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> למי צריך פולואפ השבוע (יום 3 / יום 7)?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> הופעות של השבוע: נשלחו תזכורות? יתרות שולמו?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> הופעות של שבוע שעבר: נשלח משוב? התבקשה המלצה? נרשם בגיליון?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> פולואפים מתוכננים שהגיע זמנם<\/li>\n<\/ul>\n<h3>מדדים חודשיים (לשונית ״מדדים״)<\/h3>\n<table>\n<thead>\n<tr>\n<th>מדד<\/th>\n<th>איך מחשבים<\/th>\n<th>חודש 1<\/th>\n<th>חודש 2<\/th>\n<th>חודש 3<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>פניות<\/td>\n<td>סופרים שורות חדשות<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>הצעות שנשלחו<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>הזמנות שנסגרו<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>אחוז סגירה<\/strong><\/td>\n<td>נסגרו ÷ הצעות × 100<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>מחיר ממוצע<\/td>\n<td>סכום ההזמנות ÷ מספר ההזמנות<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>מקור מוביל<\/strong><\/td>\n<td>מאיזה מקור הגיעו הכי הרבה הזמנות סגורות<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>הופעות שבוצעו<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>ממוצע ציון המלצה<\/td>\n<td>רק כשיש 3 תשובות ומעלה<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>ציטוטים מאושרים חדשים<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>הפניות שהגיעו<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>את המדדים האלה מביאים ל<a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a>, ואת אחוז הסגירה משווים לכללי האצבע ב<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>, שלב 8.<\/p>\n<h3>פרטיות בגיליון<\/h3>\n<ul>\n<li><strong>רק מה שצריך.<\/strong> בלי שמות של ילדים, חוץ מהשם הפרטי של ילד/ת יום ההולדת (צריך אותו למופע). אחרי המופע מוחקים אותו מהגיליון<\/li>\n<li><strong>התאמות, לא אבחנות:<\/strong> כותבים ״רגישות לרעש, להנמיך עוצמה״, לא מצב רפואי<\/li>\n<li><strong>אישורי צילום<\/strong> נשמרים בנפרד, בתיקייה מסודרת (<a href=\"08-consent-template.md\">טופס אישור הצילום<\/a>)<\/li>\n<li><strong>כמה זמן שומרים<\/strong> פרטים של לקוחות, ומה חוק הגנת הפרטיות מחייב: ב<a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a><\/li>\n<\/ul>\n<hr />\n<h2>כשמשהו משתבש<\/h2>\n<table>\n<thead>\n<tr>\n<th>מצב<\/th>\n<th>מה עושים<\/th>\n<th>הודעה / צעד<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>המקדמה לא הגיעה עד המועד<\/strong><\/td>\n<td>תזכורת אחת. אם אין, משחררים את התאריך<\/td>\n<td>״היי, רק מזכירה שהתאריך משוריין עד מחר. אם עדיין רלוונטי, אשמח לקבל את המקדמה 🙂״<\/td>\n<\/tr>\n<tr>\n<td><strong>לקוח מבטל<\/strong><\/td>\n<td>לפי התנאים שנשלחו <strong>ולפי החוק<\/strong> (<a href=\"06-show-offer.md\">הצעת המופע<\/a>, חלק ד׳). קודם מציעים מועד חלופי<\/td>\n<td>״חבל! רוצה שנמצא תאריך אחר? המקדמה עוברת אליו.״<\/td>\n<\/tr>\n<tr>\n<td><strong>את חולה / מקרה חירום<\/strong><\/td>\n<td>מודיעים <strong>מיד<\/strong>, בטלפון. מציעים החזר מלא או מועד חדש, לפי בחירת הלקוח<\/td>\n<td>״[שם], אני ממש מצטערת, [חליתי]. אני לא אגיע מחר. אפשר מועד חדש לבחירתך, או החזר מלא של המקדמה היום. מה עדיף לך?״<\/td>\n<\/tr>\n<tr>\n<td><strong>עומס חום / גשם (בחוץ)<\/strong><\/td>\n<td>מעבירים פנימה, ואם אין, מועד חדש בלי עלות<\/td>\n<td>״לפי התחזית מחר יש עומס חום כבד. בשביל הילדים, אפשר לעבור ל[מקום מקורה] או לקבוע מועד חדש בלי עלות. מה מתאים?״<\/td>\n<\/tr>\n<tr>\n<td><strong>הנחיות פיקוד העורף<\/strong><\/td>\n<td>מועד חדש בלי עלות<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>הגיעו הרבה יותר ילדים ממה שסוכם<\/strong><\/td>\n<td>מתאימים: יותר משחקים בישיבה, מבקשים מבוגר/ת נוסף/ת. מעל 60, לא מופע אחד<\/td>\n<td>רושמים בגיליון, ומדברים על תוספת <strong>אחרי<\/strong> המופע, לא מול הילדים<\/td>\n<\/tr>\n<tr>\n<td><strong>אין מבוגר מהמקום בחדר<\/strong><\/td>\n<td>לא מתחילים, או עוצרים במשחק ישיבה, ומבקשים בנימוס<\/td>\n<td>״אני צריכה שמישהו מהצוות יישאר איתנו, תודה!״ (<a href=\"02-show-script.md\">תסריט המופע<\/a>, פרק 7)<\/td>\n<\/tr>\n<tr>\n<td><strong>מוסד לא שילם במועד<\/strong><\/td>\n<td>תזכורת מנומסת במייל עם החשבונית, ואחרי שבוע טלפון למי שאישר/ה<\/td>\n<td>״היי [שם], רצ״ב שוב החשבונית מ־[תאריך]. אשמח לדעת מתי צפוי התשלום. תודה!״<\/td>\n<\/tr>\n<tr>\n<td><strong>לקוח לא מרוצה<\/strong><\/td>\n<td>מתקשרים, מקשיבים, שואלים מה אפשר לתקן. לא מתווכחים בכתב<\/td>\n<td>רושמים ב<a href=\"05-pilot-feedback.md\">טופס המשוב<\/a> ומחליטים מה משנים<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>כל ההודעות בקובץ (לשמור כ״תשובות מהירות״ בוואטסאפ ביזנס)<\/h2>\n<table>\n<thead>\n<tr>\n<th>קיצור<\/th>\n<th>הודעה<\/th>\n<th>תחנה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>/לאזמינה<\/td>\n<td>הודעה אוטומטית<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>/פנייה<\/td>\n<td>תשובה ראשונה עם 3 שאלות<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>/סירוב<\/td>\n<td>סירוב מנומס<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td>/הצעה<\/td>\n<td>הצעה ללקוח פרטי<\/td>\n<td>4<\/td>\n<\/tr>\n<tr>\n<td>/פולואפ3, /פולואפ7<\/td>\n<td>פולואפ על הצעה<\/td>\n<td>5<\/td>\n<\/tr>\n<tr>\n<td>/אישור<\/td>\n<td>הודעת אישור<\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td>/שבוע<\/td>\n<td>שבוע לפני<\/td>\n<td>7<\/td>\n<\/tr>\n<tr>\n<td>/מחר<\/td>\n<td>יום לפני<\/td>\n<td>8<\/td>\n<\/tr>\n<tr>\n<td>/תודה<\/td>\n<td>תודה אחרי המופע<\/td>\n<td>10<\/td>\n<\/tr>\n<tr>\n<td>/המלצה<\/td>\n<td>אחרי ציון 9–10<\/td>\n<td>11<\/td>\n<\/tr>\n<tr>\n<td>/חוזר, /הפניה<\/td>\n<td>לקוח חוזר, בקשת הפניה<\/td>\n<td>12<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>קבצים קשורים:<\/strong><\/p>\n<p><a href=\"06-show-offer.md\">הצעת המופע<\/a> · <a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a> · <a href=\"10-outreach-templates.md\">תבניות פנייה<\/a> · <a href=\"05-pilot-feedback.md\">טופס המשוב לפיילוט<\/a> · <a href=\"02-show-script.md\">תסריט המופע<\/a> · <a href=\"08-consent-template.md\">טופס אישור הצילום<\/a> · <a href=\"09-filming-guide.md\">מדריך הצילום<\/a> · <a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a> · <a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a><\/p>"}, "docs/13-legal-admin.md": {"title": "רישוי, מנהלה וחוק: המדריך שלך מא׳ עד ת׳", "html": "<h1>רישוי, מנהלה וחוק: המדריך שלך מא׳ עד ת׳<\/h1>\n<blockquote>\n<p><strong>למה את צריכה את זה:<\/strong> כדי לעבוד עם ילדים בראש שקט, כמה דברים חייבים להיות סגורים: פתיחת עסק, ביטוח לאומי, קבלות, ביטוח, אישור משטרה, שם וסימן מסחר, דומיין, פרטיות, מוזיקה ובטיחות. כל נושא כאן בנוי כ<strong>צעדים לפי הסדר<\/strong>, עם <strong>מקור<\/strong> לכל עובדה ועם סימון <strong>״לבדוק״<\/strong> בכל מקום שלא הצלחתי לאמת.<\/p>\n<p><strong>זה לא ייעוץ משפטי, ייעוץ מס או ייעוץ ביטוחי.<\/strong> זה מדריך התמצאות שיעזור לך לשאול את השאלות הנכונות ולא לשכוח שום דבר. לפני כל החלטה שכרוכה בכסף או בהתחייבות, תתייעצי עם <strong>רו״ח או יועץ/ת מס<\/strong>, עם <strong>עו״ד<\/strong> ועם <strong>סוכן/ת ביטוח מורשה/ית<\/strong>.<\/p>\n<p><strong>מתי נבדק:<\/strong> אוקטובר 2026 (כולל בדיקה חוזרת של תקרת עוסק פטור, אגרות סימני מסחר, תעריף אקו״ם ואישורי המשטרה). תקרות, אגרות ותעריפים מתעדכנים כל שנה, ולכן <strong>בכל ינואר עוברים על הקובץ מחדש<\/strong> (ראי פרק 13).<\/p>\n<\/blockquote>\n<h3>איך לקרוא את הסימונים<\/h3>\n<table>\n<thead>\n<tr>\n<th>סימון<\/th>\n<th>מה זה אומר<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מקור:<\/strong><\/td>\n<td>מצאתי את המידע במקור שמצוין, עם קישור. חלק מאתרי הממשלה (gov.il) לא נפתחו לי ישירות, והמידע מהם הגיע מתקצירי חיפוש. לכן גם כשיש קישור, <strong>תפתחי ותוודאי<\/strong> לפני שאת פועלת<\/td>\n<\/tr>\n<tr>\n<td><strong>לבדוק<\/strong><\/td>\n<td>לא הצלחתי לאמת במקור רשמי, או שזה משתנה לעתים קרובות. <strong>לא מסתמכים על זה<\/strong> לפני בדיקה<\/td>\n<\/tr>\n<tr>\n<td><code>- [ ]<\/code><\/td>\n<td>משימה שלך. מסמנים <code>[x]<\/code> כשהיא בוצעה<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>שלושה כללי ברזל (גם לפני שקראת את כל הקובץ)<\/h3>\n<ol>\n<li><strong>לא כותבים ״מבוטחת״, ״עם אישור משטרה״ או ״עוסק מורשה״ לפני שזה נכון.<\/strong> (כמו ב<a href=\"06-show-offer.md\">הצעת המופע<\/a> וב<a href=\"10-outreach-templates.md\">תבניות הפנייה<\/a>)<\/li>\n<li><strong>לא מקבלים תשלום, אפילו סמלי, לפני שיש תיק עוסק.<\/strong> (פרק 1)<\/li>\n<li><strong>ילד/ה מזוהה לא מופיע/ה בשום פרסום בלי אישור הורה בכתב לשימוש הספציפי הזה.<\/strong> (<a href=\"08-consent-template.md\">טופס אישור הצילום<\/a>)<\/li>\n<\/ol>\n<h3>ה״שערים״: מה חייב להיות סגור לפני כל שלב<\/h3>\n<p>לא צריך לסגור הכול ביום אחד. צריך לסגור את הדבר הנכון <strong>לפני<\/strong> השלב שבו הוא נדרש. לפני כל שלב, עוברים על השער שלו:<\/p>\n<table>\n<thead>\n<tr>\n<th>לפני ש...<\/th>\n<th>חייב להיות סגור<\/th>\n<th>פרקים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מפרסמים את הסרטון הראשון<\/strong><\/td>\n<td>חיפוש השם במאגר סימני המסחר וברשתות · כללי הפרטיות · ביוטיוב: סימון ״מיועד לילדים״ · בסרטון רק את, או ילדים עם אישור חתום<\/td>\n<td>6.1, 7, <a href=\"08-consent-template.md\">08<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>מופיעים בפיילוט מול קהל<\/strong> (גם בחינם)<\/td>\n<td>ביטוח צד שלישי פעיל, או לפחות תשובה בכתב מהסוכן/ת שהפיילוט מכוסה · ערכת עזרה ראשונה בתיק · טופסי אישור צילום נשלחו · פלייליסט ״נקי״ · מבוגר/ת מהמקום בחדר. (חזרה בבית עם כמה ילדים של חברות, כשההורים בחדר, כמו ב<a href=\"02-show-script.md\">תסריט המופע<\/a>: לשאול את הסוכן/ת אם גם היא מכוסה)<\/td>\n<td>4, 7, 8, 9<\/td>\n<\/tr>\n<tr>\n<td><strong>מקבלים את השקל הראשון<\/strong><\/td>\n<td>תיק עוסק (וביטוח לאומי) פתוח · אפליקציית קבלות · חשבון בנק לעסק<\/td>\n<td>1, 2, 3<\/td>\n<\/tr>\n<tr>\n<td><strong>מופיעים במוסד<\/strong> (גן, קייטנה, מתנ״ס, בית ספר)<\/td>\n<td>שאלת את המוסד בכתב אילו אישורי משטרה וביטוח הוא צריך · אישור קיום ביטוחים לפי הנוסח שלו · מסמכי ספק · תיאום צילום (נוסח ג׳)<\/td>\n<td>4.4, 5, 10, <a href=\"08-consent-template.md\">08<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>משקיעים במותג<\/strong> (הדפסות, חולצות, קידום ממומן, שיר מקורי)<\/td>\n<td>החלטה על סימן מסחר · דומיין על שמך · העברת זכויות בכתב מהמעצב/ת או מהמוזיקאי/ת<\/td>\n<td>6<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>המסלול במבט אחד<\/h2>\n<p>הסדר בנוי לפי <a href=\"04-launch-checklist.md\">תוכנית ההשקה<\/a> ולפי סדר ההשקעות ב<a href=\"01-concept.md\">מסמך הקונספט<\/a>: קודם מה שחינמי ודחוף, אחר כך מה שנדרש לפני כסף ראשון, ורק אחרי הפיילוט מה שעולה כסף רציני.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>מה<\/th>\n<th>מתי<\/th>\n<th>עלות<\/th>\n<th>פרק<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>תיקייה מנהלית + טבלת מצב<\/td>\n<td>היום<\/td>\n<td>חינם<\/td>\n<td>0, 14<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>חיפוש השם במאגר סימני המסחר + בדיקת דומיין פנוי<\/td>\n<td>שבוע 1<\/td>\n<td>חינם<\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>טופסי אישור צילום מוכנים + כללי פרטיות<\/td>\n<td>שבוע 1, לפני הסרטון הראשון<\/td>\n<td>חינם<\/td>\n<td>7, <a href=\"08-consent-template.md\">08<\/a><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>הרשמה לקורס עזרה ראשונה (כדי שיסתיים לפני הפיילוט)<\/td>\n<td>שבוע 1<\/td>\n<td>בתשלום, <strong>לבדוק<\/strong><\/td>\n<td>9<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>הצעות מחיר לביטוח צד שלישי<\/td>\n<td>שבוע 1–2<\/td>\n<td><strong>לבדוק<\/strong> מול סוכן<\/td>\n<td>4<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>פלייליסט מופע ״נקי״ מבחינת זכויות<\/td>\n<td>שבוע 2<\/td>\n<td>תלוי בבחירה<\/td>\n<td>8<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>לברר עם המוסד אילו <strong>אישורי משטרה<\/strong> הוא צריך (יש שני סוגים, ראי פרק 5) ולהגיש<\/td>\n<td>ברגע שנקבעת הופעה במוסד, <strong>לפחות 3–4 שבועות לפני<\/strong><\/td>\n<td><strong>לבדוק<\/strong><\/td>\n<td>5<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>שיחה עם רו״ח + פתיחת תיק עוסק (ביטוח לאומי נפתח באותו תהליך)<\/td>\n<td><strong>לפני השקל הראשון שאת מקבלת<\/strong><\/td>\n<td>פתיחה: <strong>לבדוק<\/strong>; רו״ח: הצעת מחיר<\/td>\n<td>1, 2<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>חשבון בנק לעסק + אפליקציית קבלות<\/td>\n<td>מיד אחרי פתיחת התיק<\/td>\n<td><strong>לבדוק<\/strong><\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>ביטוח פעיל<\/td>\n<td>לפני ההופעה הראשונה עם ילדים שאינם מהמשפחה, גם בחינם<\/td>\n<td><strong>לבדוק<\/strong><\/td>\n<td>4<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>רישום דומיין<\/td>\n<td>אחרי שהשם סגור (<a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a>)<\/td>\n<td><strong>לבדוק<\/strong><\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>החלטה על רישום סימן מסחר<\/td>\n<td>אחרי הפיילוט, <strong>לפני<\/strong> הדפסות גדולות ומרצ׳נדייז<\/td>\n<td>אגרה לכל סוג<\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>חובות שוטפות<\/td>\n<td>כל תשלום, כל חודש, כל שנה<\/td>\n<td><\/td>\n<td>13<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>פרק 0 — התיקייה המנהלית (חצי שעה, היום)<\/h2>\n<p>כל מסמך שקשור לעסק נשמר במקום אחד. כשמתנ״ס יבקש ממך ״אישור ביטוח ואישור משטרה עד מחר״, תשלחי תוך דקה.<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> לפתוח תיקייה ב־Google Drive של העסק (לא בתיקייה משותפת עם המשפחה)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> להפעיל <strong>אימות דו־שלבי<\/strong> בחשבון Google ובוואטסאפ ביזנס<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ליצור את תתי־התיקיות:<\/li>\n<\/ul>\n<pre><code>קים משחקים — מנהלה/\n  01 עסק ומסים        ← אישור פתיחת תיק, מסמכים מהרו״ח, הצהרות שנתיות\n  02 ביטוח            ← פוליסה, אישורי קיום ביטוח שנשלחו למוסדות\n  03 אישורים          ← אישור משטרה, תעודת קורס עזרה ראשונה\n  04 שם ומותג         ← צילומי מסך של חיפושים, בקשת סימן מסחר, העברת זכויות מהמעצב/ת\n  05 מוזיקה           ← רישיון לכל רצועה (PDF או צילום מסך)\n  06 אישורי צילום     ← לפי תאריך אירוע. גישה רק לך\n  07 קבלות הוצאות     ← צילום של כל קבלה על הוצאה לעסק\n<\/code><\/pre>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> להעתיק את <strong>טבלת המצב<\/strong> (פרק 14) ל־Google Sheets<\/li>\n<\/ul>\n<hr />\n<h2>פרק 1 — פתיחת העסק: עוסק פטור או עוסק מורשה<\/h2>\n<h3>1.1 מה ההבדל, בשפה פשוטה<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>עוסק פטור<\/th>\n<th>עוסק מורשה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>גובה מע״מ מהלקוח?<\/td>\n<td>לא<\/td>\n<td>כן, ומעביר/ה למדינה<\/td>\n<\/tr>\n<tr>\n<td>איזה מסמך מוציאים על תשלום<\/td>\n<td><strong>קבלה<\/strong><\/td>\n<td><strong>חשבונית מס<\/strong> (או חשבונית מס/קבלה)<\/td>\n<\/tr>\n<tr>\n<td>דיווח למע״מ<\/td>\n<td>הצהרה <strong>שנתית<\/strong> על המחזור<\/td>\n<td>דיווח <strong>תקופתי<\/strong><\/td>\n<\/tr>\n<tr>\n<td>מקזז/ה מע״מ על הוצאות (ציוד, רמקול)?<\/td>\n<td>לא<\/td>\n<td>כן<\/td>\n<\/tr>\n<tr>\n<td>מתאים בדרך כלל ל...<\/td>\n<td>עסק קטן בתחילת הדרך, רוב הלקוחות פרטיים<\/td>\n<td>מחזור גבוה, הוצאות גדולות, או עיסוק שחייב להיות מורשה<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>מקור:<\/strong> <a href=\"https://www.kolzchut.org.il/he/עוסק_פטור\">כל זכות — עוסק פטור<\/a>; <a href=\"https://www.kolzchut.org.il/he/עוסק_מורשה\">כל זכות — עוסק מורשה<\/a>. מה זה משנה <strong>במחיר<\/strong> שאת כותבת בהצעה, ראי <a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>, שלב 4.<\/p>\n<h3>1.2 המספרים (לבדוק כל שנה)<\/h3>\n<ul>\n<li><strong>תקרת המחזור לעוסק פטור בשנת 2026: 122,833 ₪.<\/strong> מחזור = <strong>כל<\/strong> ההכנסות מהעסק, לא הרווח. <strong>מקור:<\/strong> <a href=\"https://www.gov.il/he/service/request-open-exempt-dealer-via-internet\">gov.il — בקשה לפתיחת תיק עוסק פטור באינטרנט<\/a>; <a href=\"https://www.kolzchut.org.il/he/עסק_זעיר\">כל זכות — עסק זעיר<\/a>; אותו מספר מופיע גם ב<a href=\"https://www.bizportal.co.il/guides/news/article/20039167\">Bizportal — מדריך עוסק מורשה<\/a>. <strong>לבדוק<\/strong> שוב ביום שאת פותחת את התיק.<\/li>\n<li><strong>אם המחזור עובר את התקרה<\/strong> באמצע השנה, עוברים לעוסק מורשה. <strong>לבדוק עם הרו״ח<\/strong> מאיזה רגע ואיך, ולעקוב אחרי המחזור כל חודש בגיליון.<\/li>\n<li><strong>שיעור המע״מ<\/strong> (רלוונטי רק לעוסק מורשה): ראי <a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>.<\/li>\n<\/ul>\n<h3>1.3 בדיקה קריטית: האם בכלל מותר לך להיות ״פטורה״?<\/h3>\n<p>יש רשימה של מקצועות ועיסוקים (בעיקר ״מקצועות חופשיים״) שחייבים להירשם כעוסק מורשה <strong>גם אם המחזור נמוך<\/strong>. הרשימה נקבעה בתקנות מע״מ (תקנה 13). <strong>מקור:<\/strong> <a href=\"https://www.kolzchut.org.il/he/עוסק_מורשה\">כל זכות — עוסק מורשה<\/a>, שם מופיעה הרשימה וההפניה לתקנות; <a href=\"https://www.greeninvoice.co.il/magazine/who-can-be-exempt-dealer/\">Green Invoice — מי יכול להיות עוסק פטור<\/a> (אתר מסחרי).<\/p>\n<p><strong>למה זה חשוב דווקא לך:<\/strong> בחלק מהסיכומים של הרשימה שמצאתי ברשת מופיעים גם שירותי <strong>״הרצאה, הוראה, הדרכה״<\/strong>. ״מופעי בידור לילדים״ זה לא אותו דבר כמו ״הדרכה״, אבל העבודה שלך נוגעת בשניהם (הפעלות, תנועה, ניסיון בהדרכה). <strong>לא אימתתי את זה בנוסח התקנות.<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>השאלה הראשונה לרו״ח:<\/strong> ״אני מופיעה במופעי תנועה ובידור לילדים, וגם מעבירה הפעלות. איך להגדיר את העיסוק בטופס, והאם הוא מאפשר עוסק פטור?״<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא לנחש<\/strong> את תיאור העיסוק בטופס הפתיחה. כותבים בדיוק את מה שסוכם עם הרו״ח.<\/li>\n<\/ul>\n<h3>1.4 טבלת החלטה (כיוון בלבד, ההחלטה עם הרו״ח)<\/h3>\n<table>\n<thead>\n<tr>\n<th>המצב שלך<\/th>\n<th>כיוון סביר<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>מחזור צפוי בשנה הראשונה נמוך בהרבה מהתקרה, ורוב הלקוחות הורים<\/td>\n<td><strong>עוסק פטור<\/strong> בדרך כלל פשוט יותר<\/td>\n<\/tr>\n<tr>\n<td>העיסוק שלך מופיע ברשימת המקצועות שחייבים להיות מורשים<\/td>\n<td><strong>עוסק מורשה<\/strong>, חובה<\/td>\n<\/tr>\n<tr>\n<td>צפויות הוצאות גדולות עם מע״מ (ציוד, הפקה)<\/td>\n<td>לבדוק עם הרו״ח אם קיזוז המע״מ משתלם<\/td>\n<\/tr>\n<tr>\n<td>צפי להתקרב לתקרה, או הרבה עבודה עם מוסדות<\/td>\n<td>לשקול <strong>עוסק מורשה<\/strong> עם הרו״ח<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>1.5 צעד אחר צעד: פתיחת תיק באינטרנט<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>1. שיחה עם רו״ח או יועץ/ת מס.<\/strong> השאלות מוכנות בפרק 12. בקשי הצעת מחיר לליווי שנתי (דוח שנתי, הצהרות). <strong>מחיר לבדוק<\/strong>, ולהכניס ל<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>2. להכין:<\/strong> תעודת זהות, פרטי חשבון בנק, תיאור העיסוק (כפי שסוכם עם הרו״ח), תאריך תחילת פעילות, הערכת מחזור שנתי<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>3. להירשם למערכת ההזדהות הלאומית<\/strong> ב־gov.il, אם עוד אין לך<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>4. למלא את הבקשה המקוונת.<\/strong> לעוסק פטור: <a href=\"https://www.gov.il/he/service/request-open-exempt-dealer-via-internet\">בקשה לפתיחת תיק עוסק פטור באמצעות האינטרנט<\/a>. לפי דף השירות, בטופס יש שאלות שלפיהן נקבע אם צריך לפתוח גם תיק בביטוח לאומי, ואם כן, <strong>ההודעה עוברת לביטוח לאומי אוטומטית<\/strong>. לעוסק מורשה: <strong>לבדוק<\/strong> את השירות המתאים עם הרו״ח<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>5. לשמור<\/strong> את אישור פתיחת התיק (PDF) בתיקייה <code>01<\/code><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>6. רק עכשיו<\/strong> לעדכן את <a href=\"06-show-offer.md\">הצעת המופע<\/a> ואת <a href=\"../site/index.html\">עמוד הנחיתה<\/a>: ״עוסק פטור״ או ״עוסק מורשה״ + מספר עוסק<\/li>\n<\/ul>\n<p><strong>מקור לתהליך המשותף עם ביטוח לאומי:<\/strong> <a href=\"https://www.btl.gov.il/Insurance/National%20Insurance/type_list/Self_Employed/Pages/howtoregister.aspx\">ביטוח לאומי — פתיחת תיק עצמאי<\/a>.<\/p>\n<blockquote>\n<p><strong>פיילוט בחינם לגמרי<\/strong> (בלי שום תשלום, גם לא ״דמי נסיעה״): <strong>לבדוק עם הרו״ח<\/strong> אם זה כבר מחייב פתיחת תיק. <strong>פיילוט במחיר סמלי<\/strong> הוא הכנסה מעסק. הכלל הפשוט: <strong>אין תיק, אין תשלום.<\/strong><\/p>\n<\/blockquote>\n<h3>1.6 ״עסק זעיר״ במס הכנסה: מסלול שכדאי להכיר<\/h3>\n<p>לפי <a href=\"https://www.kolzchut.org.il/he/עסק_זעיר\">כל זכות — עסק זעיר<\/a>, מי שהמחזור שלו לא עובר את התקרה (122,833 ₪ ב־2026) יכול לבחור במסלול מס הכנסה מקל, שבו <strong>30% מההכנסות מנוכים אוטומטית כהוצאות<\/strong>, בלי להציג קבלות. יש תנאים (למשל, לא מעסיקים עובדים).<\/p>\n<p><strong>מה זה אומר לך:<\/strong> בשנה הראשונה יהיו לך הוצאות אמיתיות (תלבושת, רמקול, אביזרים, נסיעות, קורס, ביטוח). אם הן יותר מ־30% מההכנסות, ייתכן שהמסלול הרגיל משתלם יותר. <strong>שאלה לרו״ח.<\/strong> ובכל מקרה: <strong>שומרים כל קבלה<\/strong> (פרק 3.6).<\/p>\n<hr />\n<h2>פרק 2 — ביטוח לאומי<\/h2>\n<h3>2.1 למה זה חשוב דווקא לך<\/h3>\n<p>העבודה שלך פיזית: ריצה, קפיצה, ריקוד. אם תיפצעי בהופעה, הזכויות שלך בביטוח לאומי (כמו <strong>ביטוח פגיעה בעבודה<\/strong>) תלויות בזה שאת רשומה ומוגדרת נכון.<\/p>\n<h3>2.2 מי נחשב/ת ״עובד/ת עצמאי/ת״ בביטוח לאומי (נתוני 2026, לבדוק)<\/h3>\n<p>לפי <a href=\"https://www.kolzchut.org.il/he/עובד_עצמאי_%28לפי_הגדרת_המוסד_לביטוח_לאומי%29\">כל זכות — עובד עצמאי לפי הגדרת ביטוח לאומי<\/a>, מספיק תנאי <strong>אחד<\/strong> מאלה:<\/p>\n<table>\n<thead>\n<tr>\n<th>מסלול<\/th>\n<th>התנאי<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>שעות<\/td>\n<td>עבודה בעסק <strong>20 שעות בשבוע<\/strong> בממוצע לפחות<\/td>\n<\/tr>\n<tr>\n<td>הכנסה<\/td>\n<td>הכנסה חודשית ממוצעת מהעסק של <strong>50% מהשכר הממוצע<\/strong> לפחות (כ־6,885 ₪ ב־2026)<\/td>\n<\/tr>\n<tr>\n<td>שילוב<\/td>\n<td><strong>12 שעות בשבוע<\/strong> לפחות, <strong>ו<\/strong>הכנסה של <strong>15% מהשכר הממוצע<\/strong> לפחות (כ־2,065 ₪ בחודש ב־2026)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>מי שלא עומד/ת באף תנאי<\/strong> משלם/ת דמי ביטוח נמוכים יותר, אבל לפי אותו מקור <strong>לא מבוטח/ת בביטוח פגיעה בעבודה ובביטוח אמהות<\/strong>. <strong>לבדוק<\/strong> את המספרים העדכניים באתר ביטוח לאומי.<\/p>\n<blockquote>\n<p>שעות עבודה כוללות גם חזרות, צילום, עריכה, פניות ללקוחות ונסיעות, לא רק את ההופעות עצמן. <strong>מצהירים לפי האמת<\/strong>, ומתייעצים עם הרו״ח איך לדווח.<\/p>\n<\/blockquote>\n<h3>2.2א כמה משלמים (לתכנון בלבד, נתוני 2026, לבדוק)<\/h3>\n<p>כדי לדעת כמה לשים בצד מכל הופעה (<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>), זה הסדר הגודל שפורסם לעצמאים ב־2026:<\/p>\n<table>\n<thead>\n<tr>\n<th>חלק מההכנסה החודשית<\/th>\n<th>שיעור (ביטוח לאומי + ביטוח בריאות)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>עד <strong>7,703 ₪<\/strong> בחודש<\/td>\n<td><strong>7.7%<\/strong> (4.47% + 3.23%)<\/td>\n<\/tr>\n<tr>\n<td>מעל זה, עד <strong>51,910 ₪<\/strong> בחודש<\/td>\n<td><strong>18%<\/strong> (12.83% + 5.17%)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>מקור:<\/strong> <a href=\"https://www.bizportal.co.il/guides/news/article/20039168\">Bizportal — מדריך ביטוח לאומי לעצמאים<\/a> (אתר חדשות, לא ביטוח לאומי). לפי אותו מקור, השיעורים המופחתים נקבעו ב<strong>הוראת שעה עד סוף 2026<\/strong>. <strong>לבדוק<\/strong> באתר ביטוח לאומי ועם הרו״ח, ובכל ינואר מחדש. יש גם <strong>דמי ביטוח מינימליים<\/strong> ותנאים מיוחדים, והם לא מופיעים כאן. בנוסף לזה יש <strong>מס הכנסה<\/strong> ו<strong>פנסיה<\/strong> (2.3), ולכן השאלה ״כמה אחוז לשים בצד מכל תשלום״ היא שאלה לרו״ח (פרק 12).<\/p>\n<h3>2.3 צעדים<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>1.<\/strong> בפתיחת התיק ברשות המסים, למלא את החלק של ביטוח לאומי (פרק 1.5, צעד 4)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>2.<\/strong> אחרי כמה שבועות, לוודא באזור האישי באתר ביטוח לאומי שנפתח תיק עצמאי. אם לא: <strong>לבדוק<\/strong> מול ביטוח לאומי. <strong>מקור:<\/strong> <a href=\"https://www.kolzchut.org.il/he/פתיחת_תיק_עוסק_עצמאי_במוסד_לביטוח_לאומי\">כל זכות — פתיחת תיק עוסק עצמאי בביטוח לאומי<\/a><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>3. מקדמות:<\/strong> נקבעות לפי ההכנסה שהצהרת. אם ההכנסה משתנה הרבה (למעלה או למטה), <strong>לעדכן<\/strong> את ביטוח לאומי, כדי לא לצבור חוב או לשלם יותר מדי<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>4. הוראת קבע<\/strong> למקדמות, כדי לא לשכוח<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>5. את גם שכירה?<\/strong> לספר לרו״ח. זה משפיע על החישוב<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>6. פנסיה:<\/strong> על עצמאים חלה חובת הפקדה לפנסיה. <strong>לבדוק<\/strong> עם הרו״ח כמה, ולהכניס ל<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a><\/li>\n<\/ul>\n<hr />\n<h2>פרק 3 — כסף: קבלות, חשבון בנק, הוצאות ומוסדות<\/h2>\n<h3>3.1 קבלה על כל תשלום. בלי יוצא מן הכלל<\/h3>\n<p>כל תשלום שאת מקבלת (מקדמה, יתרה, העברה, ביט, מזומן) מקבל <strong>קבלה מיד<\/strong>. עוסק פטור מוציא קבלות ולא חשבוניות מס (<strong>מקור, אתר מסחרי של חברת תוכנה:<\/strong> <a href=\"https://www.greeninvoice.co.il/magazine/אישור-ניהול-ספרים-עוסק-פטור\">Green Invoice — אישור ניהול ספרים לעוסק פטור<\/a>). איפה זה קורה בתהליך ההזמנה: <a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>, תחנות 6 ו־10.<\/p>\n<h3>3.2 בחירת אפליקציית קבלות: צ׳קליסט<\/h3>\n<p><strong>קודם כל:<\/strong> שאלי את הרו״ח עם איזו תוכנה הוא/היא עובד/ת. לפעמים זה מכריע.<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>התוכנה רשומה ברשות המסים?<\/strong> לפי רשות המסים, יצרני תוכנות להנהלת חשבונות שמיועדות לשימוש של אחרים (גם בחינם) חייבים לרשום אותן. <strong>מקור:<\/strong> <a href=\"https://www.gov.il/he/service/registration-software-designed-managing-computerized-accounting-system\">gov.il — רישום תוכנה לניהול מערכת חשבונות ממוחשבת<\/a>. שאלי את החברה: ״התוכנה שלכם רשומה ברשות המסים?״<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> יש מסלול חינמי או זול לעוסק פטור? (<strong>לבדוק<\/strong>, המחירים משתנים)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> אפשר להפיק קבלה מהטלפון ולשלוח בוואטסאפ ובמייל?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> אפשר לתת לרו״ח גישה או לייצא דוחות?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> אם תעברי לעוסק מורשה, אפשר להמשיך באותה תוכנה?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> יש דף תשלום (אשראי/ביט) ללקוחות? מה העמלה? (<strong>לבדוק<\/strong>)<\/li>\n<\/ul>\n<p><strong>דוגמאות לשירותים מוכרים בישראל<\/strong> (לא המלצה, לא בדקתי מחירים ותנאים): חשבונית ירוקה (morning), iCount, EZcount, Invoice4u, ריווחית.<\/p>\n<h3>3.3 אם תהיי עוסקת מורשית: חשבונית מס ו״מספר הקצאה״<\/h3>\n<p>בחשבוניות מס מעל סכום מסוים, הלקוח העסקי צריך <strong>מספר הקצאה<\/strong> מרשות המסים כדי לקזז מע״מ. לפי רשות המסים, הסף ירד ל־<strong>10,000 ₪ מינואר 2026<\/strong> ול־<strong>5,000 ₪ מיוני 2026<\/strong> (לפני מע״מ). <strong>מקור:<\/strong> <a href=\"https://www.gov.il/he/service/request-assignment-number-for-tax-invoice\">gov.il — בקשה למספר הקצאה לחשבונית מס<\/a>; <a href=\"https://www.greeninvoice.co.il/magazine/israel-invoice/\">Green Invoice — חשבוניות ישראל<\/a>. רוב תוכנות הקבלות מבקשות את המספר בשבילך. <strong>לבדוק<\/strong> בתוכנה שתבחרי. לעוסק פטור זה לא רלוונטי.<\/p>\n<h3>3.4 חשבון בנק<\/h3>\n<ul>\n<li><strong>אין חובה חוקית<\/strong> לפתוח חשבון עסקי נפרד, אבל <strong>מומלץ להפריד<\/strong> כסף של העסק מהכסף הפרטי. חשבון עסקי עולה בדרך כלל יותר בעמלות. <strong>מקור:<\/strong> <a href=\"https://www.maariv.co.il/economy/consumerism/article-1316871\">מעריב — פתיחת חשבון עסקי<\/a>.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> לשאול את הבנק: מה העמלות בחשבון פרטי נוסף לעומת חשבון עסקי? (<strong>לבדוק<\/strong>)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> להחליט עם הרו״ח, ולפתוח חשבון <strong>רק לעסק<\/strong>: כל ההכנסות נכנסות אליו, כל ההוצאות יוצאות ממנו<\/li>\n<\/ul>\n<h3>3.5 תשלום באפליקציות (ביט, פייבוקס)<\/h3>\n<p>נוח ללקוחות פרטיים. <strong>לבדוק<\/strong> בתנאי השימוש של כל אפליקציה אם מותר לקבל דרכה תשלומים עסקיים, ומה המגבלות והעמלות. <strong>וגם על תשלום בביט מוציאים קבלה.<\/strong><\/p>\n<h3>3.6 הוצאות: שומרים הכול<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> כל קבלה על הוצאה לעסק: מצלמים <strong>באותו יום<\/strong> לתיקייה <code>07<\/code><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> נסיעות להופעות: רושמים תאריך, יעד וקילומטרים בגיליון<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> דוגמאות להוצאות: תלבושת (<a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a>), אביזרים, רמקול, קורס עזרה ראשונה, ביטוח, רו״ח, דומיין, תוכנת קבלות<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מה מוכר בפועל למס ובאיזה אחוז: רק לפי הרו״ח.<\/strong> לא לנחש<\/li>\n<\/ul>\n<h3>3.7 כשמוסד ציבורי משלם לך: ״אישור ניהול ספרים״ ו״ניכוי מס במקור״<\/h3>\n<p><strong>מה זה:<\/strong> לפי <a href=\"https://he.wikisource.org/wiki/חוק_עסקאות_גופים_ציבוריים\">חוק עסקאות גופים ציבוריים<\/a>, גוף ציבורי מתקשר (מעל סכום מסוים) רק עם מי שמציג <strong>אישור על ניהול פנקסי חשבונות<\/strong>. גופים כאלה מבקשים בדרך כלל גם <strong>אישור ניכוי מס במקור<\/strong>. בלי האישור, ייתכן שינכו לך מס מהתשלום. ההוראות מתעדכנות כל שנה (<strong>מקור:<\/strong> <a href=\"https://www.efraty.com/?p=4267\">אפרתי — הוראת ביצוע 1/2025 על אישורי ניכוי במקור ועסקאות ציבוריות<\/a>).<\/p>\n<p><strong>לבדוק:<\/strong> אם רשות מקומית, מתנ״ס או גן עירוני נחשבים אצלך ״גוף ציבורי״ לעניין הזה. בפועל, הם יגידו לך ב״טופס פתיחת ספק״.<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> לשאול את הרו״ח: ״איך מוציאים אישור ניהול ספרים ואישור ניכוי במקור, ולכמה זמן הם בתוקף?״<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> לשמור את שניהם בתיקייה <code>01<\/code>, עם תאריך תוקף בטבלת המצב<\/li>\n<\/ul>\n<hr />\n<h2>פרק 4 — ביטוח<\/h2>\n<h3>4.1 למה<\/h3>\n<p>את מריצה ילדים, מקפיצה אותם ומשחקת איתם במקום של מישהו אחר. אם ילד/ה נפצע/ת, או שמשהו נשבר, תביעה יכולה להגיע <strong>אלייך אישית<\/strong>. ביטוח מגן עלייך, והרבה מוסדות <strong>לא יזמינו אותך בלעדיו<\/strong>.<\/p>\n<h3>4.2 סוגי הביטוח: על מה לשאול<\/h3>\n<p>לפי נספח של חוזר מנכ״ל משרד החינוך על פעילויות מחוץ לבית הספר, מפעילים מתחייבים לבטח ״כמקובל בתחום״, למשל: חבות מעבידים, צד שלישי, רכוש, אחריות מקצועית, חבות מוצר ורכב, <strong>לפי סוג הפעילות<\/strong>. <strong>מקור:<\/strong> <a href=\"https://meyda.education.gov.il/files/hozermankal/bito-1.pdf\">משרד החינוך — נספח הצהרה על ביטוח<\/a>. אצלך, כנראה:<\/p>\n<table>\n<thead>\n<tr>\n<th>סוג<\/th>\n<th>מה מכסה, בקצרה<\/th>\n<th>בשבילך<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>אחריות כלפי צד שלישי<\/strong><\/td>\n<td>פגיעה בגוף או ברכוש של אחרים (ילדים, הורים, צוות, ציוד של המקום) בגלל הפעילות שלך<\/td>\n<td><strong>הבסיס. חובה מעשית<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>אחריות מקצועית<\/strong><\/td>\n<td>טענה שעשית את העבודה המקצועית ברשלנות<\/td>\n<td>לשאול את הסוכן אם נדרשת בנוסף, או כלולה<\/td>\n<\/tr>\n<tr>\n<td><strong>תאונות אישיות / אובדן כושר עבודה<\/strong><\/td>\n<td>את נפצעת ולא יכולה להופיע<\/td>\n<td><strong>לשקול.<\/strong> הגוף שלך הוא העסק<\/td>\n<\/tr>\n<tr>\n<td><strong>ציוד<\/strong><\/td>\n<td>רמקול, אביזרים, תלבושת<\/td>\n<td>לא חובה. לשקול כשיש ציוד יקר<\/td>\n<\/tr>\n<tr>\n<td><strong>חבות מעבידים<\/strong><\/td>\n<td>עובדים שלך<\/td>\n<td><strong>רק<\/strong> אם תעסיקי עוזר/ת<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>4.3 צעד אחר צעד: להשיג הצעות מחיר<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>1.<\/strong> להעתיק את ״תיאור הפעילות״ (למטה) ולמלא את החסר<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>2.<\/strong> לפנות ל־<strong>2–3 סוכנים/ות מורשים/ות<\/strong>. כדאי לבקש המלצה ממי שכבר עובד עם ילדים (מדריכי חוגים, מפעילי ימי הולדת, מאמני כושר לילדים)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>3.<\/strong> לשאול את <strong>כל<\/strong> השאלות (למטה), ולרשום תשובות בטבלת ההשוואה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>4.<\/strong> לבחור, לשלם ולשמור את הפוליסה בתיקייה <code>02<\/code><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>5.<\/strong> להכניס את העלות השנתית ל<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>6.<\/strong> <strong>רק עכשיו<\/strong> מותר לכתוב ״מבוטחת״ בהצעות ובשיחות<\/li>\n<\/ul>\n<p><strong>תיאור הפעילות (להעתקה לסוכן):<\/strong><\/p>\n<blockquote>\n<p>שלום, אני קים נידם. אני פותחת עסק של מופעי תנועה והפעלות אינטראקטיביות לילדים, בעיקר גילאי גן ויסודי צעיר, בשם ״קים משחקים״. המופע נמשך כ־45 דקות וכולל ריצה, קפיצה, משחקי תנועה וריקוד, <strong>בלי הרמת ילדים ובלי מתקנים<\/strong>. אני מופיעה בגנים, בקייטנות, במתנ״סים, בימי הולדת בבתים פרטיים ובגינות ציבוריות, באזור [<strong><em>]. אני עובדת לבד, בלי עובדים. אני צופה כ־[<\/em><\/strong>] הופעות בשנה הראשונה. אשמח להצעה לביטוח אחריות כלפי צד שלישי, ולהסבר אם אני צריכה גם ביטוח אחריות מקצועית ותאונות אישיות.<\/p>\n<\/blockquote>\n<p><strong>השאלות לסוכן:<\/strong><\/p>\n<ol>\n<li>מה <strong>גבול האחריות<\/strong> (למקרה ולתקופה)? מה מוסדות כמו מתנ״סים ורשויות דורשים בדרך כלל?<\/li>\n<li>הפוליסה מכסה <strong>במפורש<\/strong> פעילות גופנית עם ילדים? יש חריגים (קפיצה, ריצה, פעילות בחוץ, אביזרים)?<\/li>\n<li>כמה <strong>השתתפות עצמית<\/strong>?<\/li>\n<li>הכיסוי חל <strong>בכל מקום<\/strong>: בית פרטי, גן, גינה ציבורית, אולם?<\/li>\n<li>אפשר להוסיף מוסד כ״<strong>מבוטח נוסף<\/strong>״ ולהוציא <strong>״אישור קיום ביטוחים״<\/strong>? תוך כמה זמן? יש תשלום?<\/li>\n<li>אפשר ״<strong>ויתור על זכות תחלוף<\/strong>״ ו״<strong>אחריות צולבת<\/strong>״ לטובת מוסד שמבקש?<\/li>\n<li>הופעת <strong>פיילוט בחינם<\/strong> מכוסה כמו הופעה בתשלום?<\/li>\n<li>יש <strong>פוליסה קצרה<\/strong> או לאירוע בודד, לתקופת הפיילוט? (<strong>לבדוק<\/strong>)<\/li>\n<li>אם קרה אירוע: <strong>תוך כמה זמן<\/strong> חייבים לדווח לכם, ואיך?<\/li>\n<li>צריך גם <strong>אחריות מקצועית<\/strong>? <strong>תאונות אישיות<\/strong> בשבילי?<\/li>\n<li>תשלום חודשי או שנתי? מה קורה אם מבטלים באמצע?<\/li>\n<\/ol>\n<p><strong>טבלת השוואה:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>הצעה 1<\/th>\n<th>הצעה 2<\/th>\n<th>הצעה 3<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>חברה / סוכן/ת<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>גבול אחריות (מקרה / תקופה)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>פעילות גופנית עם ילדים מכוסה? חריגים?<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>השתתפות עצמית<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>אישור קיום ביטוחים: זמן ועלות<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>מבוטח נוסף / ויתור על תחלוף<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>מחיר שנתי<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>הערות<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>4.4 ״אישור קיום ביטוחים״: מה זה ומה מבקשים<\/h3>\n<p>מתנ״סים, רשויות ולפעמים גנים פרטיים יבקשו <strong>״אישור קיום ביטוחים״<\/strong>: טופס שחברת הביטוח (או הסוכן) ממלאת, ומאשרת שיש לך פוליסה בתוקף. מושגים שתפגשי בטופס:<\/p>\n<table>\n<thead>\n<tr>\n<th>מושג<\/th>\n<th>מה זה אומר, בפשטות<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>גבול אחריות<\/strong><\/td>\n<td>הסכום המקסימלי שהביטוח ישלם<\/td>\n<\/tr>\n<tr>\n<td><strong>מבוטח נוסף<\/strong><\/td>\n<td>המוסד מתווסף לכיסוי שלך, לגבי הפעילות שלך אצלו<\/td>\n<\/tr>\n<tr>\n<td><strong>ויתור על תחלוף<\/strong><\/td>\n<td>חברת הביטוח שלך מוותרת על תביעה נגד המוסד אחרי שהיא משלמת<\/td>\n<\/tr>\n<tr>\n<td><strong>אחריות צולבת<\/strong><\/td>\n<td>הפוליסה מתייחסת לכל מבוטח כאילו בוטח בנפרד<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>חשוב:<\/strong> האישור <strong>לא מחליף את הפוליסה<\/strong>. בטופס של בנק ישראל, למשל, כתוב שהוא לא כולל את כל התנאים והחריגים, ובמקרה של סתירה הפוליסה קובעת. <strong>מקור:<\/strong> <a href=\"https://boi.org.il/media/5ioclrx5/נספח-ג2-אישור-ביטוחים.pdf\">בנק ישראל — נספח אישור ביטוחים (דוגמה לטופס)<\/a>.<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> בכל הזמנה ממוסד, לשאול <strong>מראש<\/strong> ״יש לכם נוסח ביטוח או סכומים שאתם דורשים?״ (זה כבר ב<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> להעביר את הנוסח לסוכן <strong>לפני<\/strong> שמתחייבים להופעה<\/li>\n<\/ul>\n<blockquote>\n<p><strong>לביטוח של המקום יש תפקיד אחר.<\/strong> גם אם לגן או למתנ״ס יש ביטוח, הוא לא מחליף את שלך.<\/p>\n<\/blockquote>\n<hr />\n<h2>פרק 5 — אישורי משטרה לעבודה עם ילדים<\/h2>\n<blockquote>\n<p><strong>בקצרה:<\/strong> יש <strong>שני חוקים<\/strong> ו<strong>שני אישורים שונים<\/strong>: אחד על עבירות מין ואחד על עבירות אלימות. החובה לבקש אותם מוטלת בעיקר <strong>על המוסד<\/strong> (גן, קייטנה וכו׳), לא עלייך. התפקיד שלך הוא לשאול כל מוסד <strong>בכתב<\/strong> מה הוא צריך, להגיש בזמן, ולא לכתוב ״עם אישור משטרה״ עד שהאישור באמת אצלך.<\/p>\n<\/blockquote>\n<h3>5.1 שני החוקים, זה לצד זה<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>אישור לפי חוק <strong>עבירות מין<\/strong><\/th>\n<th>אישור לפי חוק <strong>עבירות אלימות<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>החוק<\/strong><\/td>\n<td><a href=\"https://he.wikisource.org/wiki/חוק_למניעת_העסקה_של_עברייני_מין_במוסדות_מסוימים\">החוק למניעת העסקה של עברייני מין במוסדות מסוימים, התשס״א־2001<\/a><\/td>\n<td><a href=\"https://www.nevo.co.il/law_html/law00/217967.htm\">חוק למניעת העסקה במוסדות מסוימים של מי שהורשע באלימות כלפי ילדים וחסרי ישע, התשפ״ג־2023<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>על אילו מקומות<\/strong><\/td>\n<td>״מוסדות״ שמשרתים קטינים: גני ילדים, בתי ספר, מעונות, תנועות נוער ועוד. לפי משרד החינוך, בתיקון מ־2010 נוספו גם גופים ״שבין עיסוקיהם מתן שירותי חונכות, הדרכה, הוראה, <strong>בידור<\/strong>״ לקטינים. <strong>מקור:<\/strong> <a href=\"https://meyda.education.gov.il/files/hozermankal/valid/k-2013-2-1-5-3-68.pdf\">משרד החינוך — חוזר על החוק<\/a><\/td>\n<td>מעון, משפחתון, <strong>גן ילדים, קייטנה<\/strong>, פנימייה, מועדונית ו<strong>צהרון<\/strong>. לפי סיכום של משרד עורכי דין, מדובר במסגרות שבהן שוהים <strong>ילדים עד גיל 6<\/strong> (<strong>לבדוק<\/strong>). <strong>מקור:<\/strong> <a href=\"https://o-n.law/violence/\">עוז, לוטן, עינב ונורקין — הסבר על החוק<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>על מי חלה חובת האישור<\/strong><\/td>\n<td><strong>נקודה חשובה לך:<\/strong> לפי <a href=\"https://he.wikipedia.org/wiki/חוק_למניעת_העסקה_של_עברייני_מין_במוסדות_מסוימים\">ויקיפדיה (נכון לינואר 2026)<\/a> ולפי <a href=\"https://meyda.education.gov.il/files/hozermankal/valid/sd1ak8_5_27.htm\">חוזר משרד החינוך על החוק<\/a>, החובה של המוסד <strong>לקבל אישור משטרה<\/strong> חלה כרגע <strong>רק על גברים בגירים<\/strong>. החוק קובע שהחובה תחול גם על נשים ממועד שייקבע בהמשך. <strong>איסור ההעסקה עצמו<\/strong> (של מי שהורשע/ה) חל על כולם. <strong>לבדוק<\/strong>: זה יכול להשתנות בכל רגע<\/td>\n<td>לפי הנוסח, החוק <strong>לא מבחין<\/strong> בין נשים לגברים (זו קריאה של הנוסח, לא חוות דעת. <strong>לבדוק<\/strong>)<\/td>\n<\/tr>\n<tr>\n<td><strong>בתוקף מ־<\/strong><\/td>\n<td>2001 (התקנות מ־2003)<\/td>\n<td>אוגוסט 2024, לפי <a href=\"https://o-n.law/violence/\">עוז, לוטן, עינב ונורקין<\/a>. ב־2026 פורסמו <a href=\"https://www.nevo.co.il/law_html/law00/239778.htm\">תקנות (אישור המשטרה), התשפ״ו־2026<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>השירות ב־gov.il<\/strong><\/td>\n<td><a href=\"https://www.gov.il/he/service/application-for-police-approval\">בקשה לקבלת אישור העסקה מהמשטרה<\/a><\/td>\n<td><a href=\"https://www.gov.il/he/service/employment-approval-from-the-police\">בקשה לקבלת אישור על היעדר הרשעה בעבירות אלימות<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>שאלה פתוחה בשני החוקים:<\/strong> הם מדברים על ״קבלה לעבודה״ ו״העסקה״ במוסד. <strong>לבדוק עם עו״ד<\/strong> אם הופעה חד־פעמית של מופיעה חיצונית, עצמאית, נחשבת ״העסקה״ לעניין זה. בפועל, <strong>המוסד מחליט מה הוא דורש<\/strong>, ואת פועלת לפי מה שהוא מבקש בכתב.<\/p>\n<h3>5.2 מה זה אומר לך, לפי סוג ההופעה<\/h3>\n<table>\n<thead>\n<tr>\n<th>איפה את מופיעה<\/th>\n<th>מה סביר שיקרה<\/th>\n<th>מה את עושה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>גן ילדים, מעון, קייטנה או צהרון לגיל הרך<\/strong><\/td>\n<td>סביר שיבקשו <strong>אישור עבירות אלימות<\/strong>. ייתכן שיבקשו גם אישור עבירות מין, מתוך נוהל פנימי, גם אם החוק לא מחייב אותם לגבי אישה (5.1)<\/td>\n<td>שואלים בכתב מה בדיוק צריך, ומגישים מיד (5.3, 5.4)<\/td>\n<\/tr>\n<tr>\n<td><strong>בית ספר, מתנ״ס, תנועת נוער<\/strong><\/td>\n<td>תלוי בנוהל של המקום ושל הרשות<\/td>\n<td>שואלים בכתב. אם מבקשים, מגישים<\/td>\n<\/tr>\n<tr>\n<td><strong>יום הולדת בבית פרטי<\/strong><\/td>\n<td>הורים ה
