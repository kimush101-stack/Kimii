.il/files/hozermankal/valid/sd1ak8_5_27.htm\">משרד החינוך — חוזר על החוק (תחולה על נשים)<\/a> · <a href=\"https://o-n.law/violence/\">עוז, לוטן, עינב ונורקין — חוק עבירות האלימות<\/a><\/li>\n<li><a href=\"https://www.nevo.co.il/law_html/law00/217967.htm\">נבו — חוק האלימות כלפי ילדים, 2023<\/a> · <a href=\"https://www.nevo.co.il/law_html/law00/239778.htm\">נבו — תקנות 2026<\/a><\/li>\n<li><a href=\"https://www.kolzchut.org.il/he/דיווח_על_התעללות_בקטינים\">כל זכות — דיווח על התעללות בקטינים<\/a><\/li>\n<li><a href=\"https://www.mdais.org.il\">מגן דוד אדום<\/a> · <a href=\"https://www.maccabi4u.co.il/eligibilites/2610/\">מכבי — סדנת החייאת תינוקות וילדים<\/a> · <a href=\"https://www.study.co.il/קורס-עזרה-ראשונה/\">study.co.il — קורס עזרה ראשונה<\/a> · <a href=\"https://www.oref.org.il\">פיקוד העורף<\/a><\/li>\n<\/ul>\n<p><strong>שם, סימן מסחר, דומיין, זכויות<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.gov.il/he/service/search_israeli_trademarks_database\">gov.il — חיפוש במאגר סימני המסחר<\/a> · <a href=\"https://www.gov.il/he/service/trademark_registration\">gov.il — הגשת בקשה לרישום סימן מסחר<\/a><\/li>\n<li><a href=\"https://he.wikisource.org/wiki/תקנות_סימני_המסחר\">תקנות סימני המסחר<\/a> · <a href=\"https://aviveilon.law/מאמרים/אגרות-הפטנטים-מתייקרות-בינואר/\">אביב אילון — עליית אגרות ינואר 2026<\/a> · <a href=\"https://www.gov.il/he/service/objection_to_obtained_trademark\">gov.il — התנגדות לסימן שהתקבל<\/a> · <a href=\"https://www.wipo.int/classifications/nice/en/\">WIPO — סיווג ניס<\/a><\/li>\n<li><a href=\"https://domainoffer.net/tld/co.il\">domainoffer.net — השוואת מחירי ‎.co.il<\/a><\/li>\n<li><a href=\"https://www.isoc.org.il\">ISOC-IL<\/a> · <a href=\"https://support.opensrs.com/support/solutions/articles/201000093589--il-domain-policies\">OpenSRS — מדיניות ‎.il<\/a> · <a href=\"https://news.internetsociety.org/new-rules-opened-2020-at-isoc-il-il-registry-supports-five-year-registration-of-domain-names/\">Internet Society — רישום ל־5 שנים<\/a> · <a href=\"https://www.domainthenet.com/en/tld/co.il.aspx\">Domain The Net — ‎.co.il<\/a><\/li>\n<li><a href=\"https://he.wikisource.org/wiki/חוק_זכות_יוצרים\">חוק זכות יוצרים<\/a><\/li>\n<\/ul>\n<p><strong>פרטיות ופלטפורמות<\/strong><\/p>\n<ul>\n<li><a href=\"https://he.wikisource.org/wiki/חוק_הגנת_הפרטיות\">חוק הגנת הפרטיות<\/a> · <a href=\"https://www.hamichlol.org.il/פגיעה_בפרטיות\">המכלול — פגיעה בפרטיות<\/a> · <a href=\"https://www.bizportal.co.il/takdin/news/article/817225\">Bizportal — פיצוי ללא הוכחת נזק על פרסום תמונה<\/a><\/li>\n<li><a href=\"https://www.loc.gov/item/global-legal-monitor/2025-11-17/israel-amendment-to-privacy-protection-law-goes-into-effect/\">Library of Congress — תיקון 13<\/a> · <a href=\"https://meitar.com/wp-content/uploads/2025/07/AMENDMENT-13-TO-THE-PRIVACY-PROTECTION-LAW-IS-ON-THE-HORIZON-HEB.pdf\">מיתר — תיקון 13<\/a> · <a href=\"https://www.shibolet.com/?p=18280\">שבלת — תיקון 13<\/a><\/li>\n<li><a href=\"https://barlaw.co.il/practice_areas/regulation/privacy-law/client_updates/using-a-name-without-permission-privacy-infringement\">ברנע ג׳פה לנדה — שימוש בשם ובתמונה לשם רווח<\/a> · <a href=\"https://www.israelhayom.co.il/lifestyle/family-and-parenting/article/16379414\">ישראל היום — הסכמה לצילום קטינים<\/a><\/li>\n<li><a href=\"https://support.google.com/youtube/answer/9528076\">YouTube — תוכן מיועד לילדים<\/a> · <a href=\"https://help.instagram.com/517920941588885\">Instagram — גיל מינימום<\/a> · <a href=\"https://www.tiktok.com/community-guidelines/en/youth-safety\">TikTok — Youth Safety<\/a><\/li>\n<li><a href=\"https://www.kolzchut.org.il/he/איסור_העסקת_ילד_בהופעה_או_בצילומים_ללא_היתר\">כל זכות — העסקת ילד בהופעה או בצילומים<\/a> · <a href=\"https://www.gov.il/he/service/performance-license-for-children\">gov.il — היתר להעסקת ילדים בהופעות או בפרסומות<\/a><\/li>\n<li><a href=\"https://www.kolzchut.org.il/he/הנגשת_אתרי_אינטרנט_ואפליקציות_לאנשים_עם_מוגבלות\">כל זכות — הנגשת אתרי אינטרנט<\/a> · <a href=\"https://www.kolzchut.org.il/he/עסקת_מכר_מרחוק\">כל זכות — עסקת מכר מרחוק<\/a><\/li>\n<\/ul>\n<p><strong>מוזיקה<\/strong><\/p>\n<ul>\n<li><a href=\"https://acum.org.il/en/tariff-public-performance/\">אקו״ם — תעריפי ביצוע פומבי<\/a> · <a href=\"https://acum.org.il/en/tariff-public-performance/t008-family-events/\">אקו״ם — אירועים משפחתיים (T008)<\/a> · <a href=\"https://acum.org.il/en/faq/\">אקו״ם — שאלות נפוצות<\/a> · <a href=\"https://apps.acum.org.il/licenses/general/register-payment?action=info&amp;sourceTypeCode=T008&amp;lang=en\">אקו״ם — מערכת רישיונות<\/a> · <a href=\"https://eshkolot.co.il\">אשכולות<\/a><\/li>\n<\/ul>\n<hr />\n<h2>קבצים קשורים<\/h2>\n<p><a href=\"01-concept.md\">מסמך הקונספט<\/a> · <a href=\"08-consent-template.md\">טופס אישור הצילום<\/a> · <a href=\"04-launch-checklist.md\">תוכנית ההשקה<\/a> · <a href=\"06-show-offer.md\">הצעת המופע<\/a> · <a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a> · <a href=\"12-booking-process.md\">תהליך ההזמנה<\/a> · <a href=\"10-outreach-templates.md\">תבניות פנייה<\/a> · <a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a> · <a href=\"02-show-script.md\">תסריט המופע<\/a> · <a href=\"09-filming-guide.md\">מדריך הצילום<\/a> · <a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a> · <a href=\"14-character-bible.md\">תנ״ך הדמות<\/a> · <a href=\"../site/index.html\">עמוד הנחיתה<\/a><\/p>"}, "docs/14-character-bible.md": {"title": "ספר הדמות — מי זאת קים, איך היא נשמעת ומה היא אף פעם לא עושה", "html": "<h1>ספר הדמות — מי זאת קים, איך היא נשמעת ומה היא אף פעם לא עושה<\/h1>\n<blockquote>\n<p><strong>בשביל מה הקובץ הזה:<\/strong> כאן מוגדר מי זאת ״קים משחקים״, כך שהיא תהיה אותה דמות בכל מקום: במופע ובסרטון, בגן וביום הולדת, היום ובעוד שנה. כל מי שיעבוד איתך (צלם/ת, מעצב/ת, משווק/ת, יועץ/ת) צריך לקרוא את הקובץ הזה כדי להבין את הדמות.<\/p>\n<p><strong>הבסיס:<\/strong> <a href=\"01-concept.md\">מסמך הקונספט<\/a>. ספר הדמות לא משנה את הקונספט, רק מפרט אותו.<\/p>\n<p><strong>איך זה מתחבר לשאר החומרים:<\/strong> המופע המלא ב<a href=\"02-show-script.md\">תסריט המופע<\/a>, הסרטונים ב<a href=\"03-video-scripts.md\">תסריטי הסרטונים<\/a>, המראה ב<a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a>, והנוסחים המלאים לפניות ב<a href=\"10-outreach-templates.md\">תבניות הפנייה<\/a>.<\/p>\n<\/blockquote>\n<hr />\n<h2>איך עובדים עם הקובץ<\/h2>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>קראי אותו פעם אחת מההתחלה עד הסוף.<\/strong> זה לוקח בערך 20 דקות.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>סגרי את ההחלטות שבפרק 0<\/strong> בשבוע הראשון (שבוע ״גיבוש״ בקונספט), לפני שמצלמים משהו לפרסום.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>הדפיסי את ״כרטיס הדמות״<\/strong> (פרק 11) ושימי אותו בתיק המופע וליד המראה.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אחרי כל 5 מופעים<\/strong> חזרי לפרק 5 (משפטים) ולפרק 6 (מה לא עושים), ועדכני לפי מה שקרה בשטח. את מה שעבד מוסיפים, ואת מה שלא עבד מוחקים.<\/li>\n<\/ul>\n<h2>תוכן עניינים<\/h2>\n<ol start=\"0\">\n<li>ההחלטות לשבוע הראשון<\/li>\n<li>קים במשפט אחד ובשלוש מילים<\/li>\n<li>מי זאת קים: סיפור רקע קל<\/li>\n<li>הקול והדיבור<\/li>\n<li>הגוף: תנועת היד, תנוחות החתימה, הכניסה והיציאה<\/li>\n<li>בנק משפטי החתימה (23 משפטים)<\/li>\n<li>מה קים אף פעם לא עושה<\/li>\n<li>שלושה קהלים, שלושה קולות: ילדים, הורים, מוסדות<\/li>\n<li>דוגמאות טון: אותו מסר בשלושה קולות<\/li>\n<li>שאלות שילדים שואלים, ותשובות מתוך הדמות<\/li>\n<li>קים ברשתות<\/li>\n<li>כרטיס דמות להדפסה<\/li>\n<li>דברים לבדוק<\/li>\n<\/ol>\n<hr />\n<h2>0. ההחלטות לשבוע הראשון<\/h2>\n<p>אלה ההחלטות שצריך לסגור <strong>לפני הסרטון הראשון שעולה לאוויר<\/strong>. אחרי שילדים למדו תנועה או משפט מהסרטונים, כבר לא משנים אותם. ליד כל החלטה יש הצעה מוכנה, אז לא צריך להמציא מאפס: מספיק לבדוק שזה מרגיש נכון בגוף ובפה שלך.<\/p>\n<ul>\n<li>\n<p>[ ] <strong>1. שלוש המילים של הדמות.<\/strong> ההצעה: <strong>שובבה · סוחפת · אמיתית<\/strong> (פרק 1).\n  <em>איך בודקים:<\/em> צלמי 2 דקות של אלתור בתלבושת, שלחי ל־3 חברים ושאלי: ״תארו אותה בשלוש מילים.״ אם המילים שלהם קרובות לשלוש האלה, זה עובד.<\/p>\n<\/li>\n<li>\n<p>[ ] <strong>2. תנועת היד.<\/strong> ההצעה: <strong>״ה־V של קים״<\/strong> (פרק 4.1). זו ברירת המחדל מהתסריט, עם תוספת אחת: אצבעות פרושות כמו קרני שמש.\n  <em>איך בודקים:<\/em> עשי אותה מול ילד/ה בגיל 4–6 (של חברים או מהמשפחה) בלי להסביר. אם הילד/ה מחקה אותה מיד, היא טובה. <strong>בנוכחות ההורה ובאישורו, בלי לצלם את הילד/ה.<\/strong><\/p>\n<\/li>\n<li>\n<p>[ ] <strong>3. הכניסה הקבועה<\/strong> (פרק 4.3), לפי קטע 1 ב<a href=\"02-show-script.md\">תסריט המופע<\/a>.\n  <em>איך בודקים:<\/em> בחזרה הראשונה עם טיימר, הכניסה עד ״אתם יודעים לשחק?״ לוקחת פחות מדקה.<\/p>\n<\/li>\n<li>\n<p>[ ] <strong>4. משפט היציאה:<\/strong> ״אני קים, ונתראה במשחק הבא!״ (פרק 4.4).<\/p>\n<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>5. חמשת המשפטים הקבועים<\/strong> (פרק 5). אותו נוסח בדיוק בכל מופע ובכל סרטון.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>6. הקול<\/strong> (פרק 3). הקליטי את הכניסה בשלוש גרסאות (רגיל, יותר מואר, יותר שקט), תקשיבי באוזניות, ותבחרי את הגרסה שהכי דומה לך, רק עם יותר אנרגיה.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>7. התשובות לשאלות אישיות של ילדים<\/strong> (פרק 9): בת כמה, איפה גרה, יש לך ילדים. תשנני אותן, כדי שלא תצטרכי לאלתר מול 30 ילדים.<\/li>\n<\/ul>\n<hr />\n<h2>1. קים במשפט אחד ובשלוש מילים<\/h2>\n<p><strong>במשפט אחד:<\/strong> קים היא כוכבת משחק ספורטיבית ושובבה שבאה ״לבדוק אם הילדים יודעים לשחק״, ותמיד מגלה שהם יודעים. לפעמים אפילו יותר טוב ממנה.<\/p>\n<p><strong>ההבטחה לילדים (מהקונספט):<\/strong> לא רק לצפות בקים. <strong>לשחק איתה בפועל.<\/strong><\/p>\n<p><strong>הקריאה:<\/strong> קים קוראת ״עם קים...״, והילדים עונים ״כולם משחקים!״<\/p>\n<h3>שלוש המילים<\/h3>\n<table>\n<thead>\n<tr>\n<th>מילה<\/th>\n<th>איך זה נראה אצל קים<\/th>\n<th>מה זה <strong>לא<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>שובבה<\/strong><\/td>\n<td>מתחילה משחק בלי התראה, ״עובדת״ על הילדים בהומור (״קים לא אמרה!״), נכשלת בכוונה כדי שהילדים יצילו אותה<\/td>\n<td>לא עוקצנית ולא צינית, ולא בלגן שיוצא משליטה<\/td>\n<\/tr>\n<tr>\n<td><strong>סוחפת<\/strong><\/td>\n<td>אנרגיה גבוהה, קצב מהיר, וכולם קמים. גם הביישנים, כי זה נראה כיף ולא כי לחצו עליהם<\/td>\n<td>לא צעקנית, לא לוחצת על ילד/ה שלא רוצה<\/td>\n<\/tr>\n<tr>\n<td><strong>אמיתית<\/strong><\/td>\n<td>זאת את, קים: הקול, הצחוק והגוף שלך, רק בעוצמה גבוהה יותר. היא מודה כשמשהו לא הולך לה: ״את זה גם אני לא יודעת!״<\/td>\n<td>לא ״מתיילדת״: בלי קול תינוקי, בלי ״חמודים״, בלי דמות מצוירת מזויפת<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>מה קים היא לכל אחד<\/h3>\n<table>\n<thead>\n<tr>\n<th>למי<\/th>\n<th>מה היא בשבילו<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>ילדים<\/strong><\/td>\n<td>המאמנת הכי מצחיקה שיש, וחברה לקבוצה. היא צריכה אותם, כי בלעדיהם היא ״משתגעת״<\/td>\n<\/tr>\n<tr>\n<td><strong>הורים<\/strong><\/td>\n<td>מי שמוציאה את הילדים מהמסך ומהספה, בידיים בטוחות, ושקל להזמין אותה<\/td>\n<\/tr>\n<tr>\n<td><strong>גננות, קייטנות, מתנ״סים ורשויות<\/strong><\/td>\n<td>אשת מקצוע עם ניסיון מעשי בהדרכת תנועה ומשחק לילדים ובתיאטרון. מגיעה בזמן, עם כל הציוד, ושומרת על הכללים<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>2. מי זאת קים: סיפור רקע קל<\/h2>\n<p><strong>העיקרון: מספיק סיפור כדי לשחק, לא מספיק כדי להסתבך.<\/strong> יש שלוש סיבות לשמור על סיפור קטן:<\/p>\n<ol>\n<li><strong>הקונספט ביקש דמות ״לא מתיילדת מדי״.<\/strong> קים היא לא פיה ולא דמות מכוכב אחר. היא אישה אמיתית שאוהבת לשחק.<\/li>\n<li><strong>השם שלה הוא השם שלך.<\/strong> ככל שהסיפור קרוב יותר אלייך, קל יותר להישאר בדמות ולאלתר.<\/li>\n<li><strong>פרטיות.<\/strong> כל פרט ״ביוגרפי״ שתמציאי, ילדים ישאלו עליו שוב ושוב. מה שלא מוגדר, לא צריך לזכור, וגם לא חושף אותך.<\/li>\n<\/ol>\n<h3>מה קבוע (״העובדות של קים״)<\/h3>\n<table>\n<thead>\n<tr>\n<th>עובדה<\/th>\n<th>איפה זה מופיע<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>קים עוברת ממקום למקום <strong>ובודקת אם הילדים יודעים לשחק<\/strong><\/td>\n<td>הכניסה במופע, סרטון ההיכרות<\/td>\n<\/tr>\n<tr>\n<td>כל קבוצה שהיא בודקת <strong>עוברת את המבחן<\/strong> והופכת ל״שחקנים של קים״<\/td>\n<td>קטע 1 בתסריט<\/td>\n<\/tr>\n<tr>\n<td>לשחקנים של קים יש <strong>קריאה סודית<\/strong>: ״עם קים...״ / ״כולם משחקים!״<\/td>\n<td>קטע 2 בתסריט<\/td>\n<\/tr>\n<tr>\n<td>יש לה <strong>קובייה<\/strong> שמחליטה מה עושים (״קוביית קים״)<\/td>\n<td>קטע 5, סרטון 5<\/td>\n<\/tr>\n<tr>\n<td><strong>הגוף שלה לפעמים לא מקשיב לה:<\/strong> היד, הרגל, הקול, ״הסוללה״. רק הילדים יכולים לתקן אותה, עם שלוש מחיאות כפיים ו״קים, תקשיבי!״<\/td>\n<td>קטע 6 (״קים משתגעת״)<\/td>\n<\/tr>\n<tr>\n<td>היא <strong>לא מושלמת:<\/strong> לא מצליחה לגעת באף עם הברך, מתבלבלת בין ימין לשמאל, מסתובבת לכיוון הלא נכון<\/td>\n<td>קטע 1, סרטון ההיכרות<\/td>\n<\/tr>\n<tr>\n<td>היא <strong>לא מבינה איך אפשר רק לשבת ולהסתכל<\/strong>. זה החשד הקומי שלה (״סיפרו לי שפה יש ילדים שרק יושבים ומסתכלים...״), אף פעם לא ביקורת על ילד/ה אמיתי/ת<\/td>\n<td>הכניסה<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>מה בכוונה <strong>לא<\/strong> מוגדר<\/h3>\n<table>\n<thead>\n<tr>\n<th>נושא<\/th>\n<th>למה לא<\/th>\n<th>מה עונים אם ילדים שואלים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>גיל<\/td>\n<td>לא רלוונטי, ומזמין השוואות<\/td>\n<td>פרק 9: ״בגיל של משחק!״<\/td>\n<\/tr>\n<tr>\n<td>איפה היא גרה<\/td>\n<td>פרטיות וביטחון שלך<\/td>\n<td>פרק 9: ״בכל מקום שמשחקים בו!״<\/td>\n<\/tr>\n<tr>\n<td>משפחה, בן זוג, ילדים<\/td>\n<td>פרטיות<\/td>\n<td>פרק 9: ״יש לי המון שחקנים. אתם!״<\/td>\n<\/tr>\n<tr>\n<td>״כוחות קסם״<\/td>\n<td>קים היא לא פיה. הקסם הוא המשחק<\/td>\n<td>אם ילד/ה ממציא/ה שהיא קוסמת, אפשר לשחק עם זה בקלילות (״אולי... תבדקו אם אתם יודעים לשחק, ואז נראה״) בלי לבנות על זה סיפור<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>היחסים של קים עם הילדים ועם המבוגרים<\/h3>\n<ul>\n<li><strong>הילדים הם ״שחקנים״.<\/strong> לא ״קהל״, לא ״חמודים״. הם שותפים למשחק.<\/li>\n<li><strong>קים צריכה אותם.<\/strong> הם מצילים אותה, מטעינים לה את ה״סוללה״ ומתקנים לה את הרגל. זה נותן לילדים כוח, וזה מה שהופך את המופע ל״משחק״ ולא ל״הצגה״.<\/li>\n<li><strong>היא מאמנת־חברה, אנרגיה של אחות גדולה.<\/strong> לא גננת, לא אמא, לא ״תינוקת גדולה״. היא מובילה, אבל משחקת באמת.<\/li>\n<li><strong>המבוגרים בחדר:<\/strong> קים מכבדת את הצוות ואת ההורים. היא משתפת מבוגר/ת במשחק (״גם הגננת יודעת לשחק? בואו נבדוק!״) <strong>רק אם סיכמתם את זה מראש<\/strong> בתדריך שלפני המופע (פרק 4 בתסריט). לא מביכים מבוגר/ת שלא הסכים/ה.<\/li>\n<\/ul>\n<hr />\n<h2>3. הקול והדיבור<\/h2>\n<h3>3.1 הקול<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>קים<\/th>\n<th>לא קים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>גובה<\/strong><\/td>\n<td>הקול הטבעי שלך, קצת יותר מואר ו״מחייך״<\/td>\n<td>קול תינוקי, ״קול של גננת מתוקה״, קול מצויר<\/td>\n<\/tr>\n<tr>\n<td><strong>עוצמה<\/strong><\/td>\n<td>דינמית, מלמעלה ועד לחישה. <strong>הלחישה היא כלי עבודה<\/strong><\/td>\n<td>צעקה כדי להשתיק<\/td>\n<\/tr>\n<tr>\n<td><strong>קצב<\/strong><\/td>\n<td>מהיר במשחקים. איטי מאוד ברגעי מתח: ״אתם... יודעים... לשחק?״<\/td>\n<td>קצב אחיד שמרדים<\/td>\n<\/tr>\n<tr>\n<td><strong>מוזיקליות<\/strong><\/td>\n<td>מושכת מילים (״עם קייייים...״), סופרת בקצב, מתופפת בקול<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>״קולות״ מוכנים<\/strong><\/td>\n<td>שישה קולות שקים משתמשת בהם בכוונה (מקטע 2 בתסריט): <strong>לחישה, רובוט, זמרת אופרה, עכבר, אריה, הילוך איטי<\/strong><\/td>\n<td>קולות של דמויות מוכרות מהטלוויזיה (זכויות ובידול)<\/td>\n<\/tr>\n<tr>\n<td><strong>צחוק<\/strong><\/td>\n<td>צחוק אמיתי, גם על עצמה<\/td>\n<td>צחוק מאולץ ״לקהל״<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>3.2 שמונה חוקי שפה<\/h3>\n<ol>\n<li><strong>משפטים קצרים, ופועל בהתחלה:<\/strong> ״קופצים!״ ״קופאים!״ ״כולם לקום!״<\/li>\n<li><strong>שואלים, לא מסבירים:<\/strong> ״מי יודע...?״ ״מוכנים?״ ״סגור?״ כל משחק מוסבר בפחות מ־20 שניות (חוק 2 ב<a href=\"02-show-script.md\">תסריט<\/a>).<\/li>\n<li><strong>מדברים לכל החדר.<\/strong> מחמאות נותנים לקבוצה (״השורה הזאת, פסלים מושלמים!״). מחמאה לילד/ה מסוים/ת רק כשהוא/היא על הבמה בהזמנה.<\/li>\n<li><strong>״שחקנים״.<\/strong> לא ״חמודים״, ״מתוקים״, ״ילדונים״ או ״מאמי״. עם בני 3–4 מותר להיות רכה יותר בטון, אבל עדיין ״שחקנים״.<\/li>\n<li><strong>לשון שמזמינה את כולם:<\/strong> מחליפים בין ״שחקנים״ ל״שחקניות ושחקנים״. <strong>אף פעם לא ״בנים נגד בנות״.<\/strong><\/li>\n<li><strong>סאונד במקום הסבר:<\/strong> ״תררררר...״, ״בוינג!״, ״פשששש...״, ״טוּט!״. ילדים זוכרים צלילים יותר ממילים.<\/li>\n<li><strong>צוחקים על קים, אף פעם לא על ילד/ה<\/strong> (חוק 8 ב<a href=\"02-show-script.md\">תסריט<\/a>).<\/li>\n<li><strong>טעות היא חלק מהמשחק:<\/strong> ״אופס!״ ← ״לא נורא!״<\/li>\n<\/ol>\n<h3>3.3 שמירה על הקול (הוא כלי העבודה שלך)<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>חימום של 5 דקות לפני כל מופע וכל יום צילום:<\/strong> זמזום עם שפתיים סגורות, ״ברררר״ עם שפתיים רפויות, ״סירנה״ מלמטה למעלה. פירוט בפרק 12 ב<a href=\"02-show-script.md\">תסריט<\/a>.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>בקבוק מים ליד הרמקול.<\/strong> לוגמים בין קטעים.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא צועקים כדי להשתלט על רעש.<\/strong> משתמשים ב״ארגז הכלים״ שבפרק 6 ב<a href=\"02-show-script.md\">תסריט<\/a>.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>בקבוצות של 25+ ילדים ובחוץ<\/strong> משתמשים במגבר קול עם מיקרופון ראש (פרק 10 בתסריט).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אחרי יום עם כמה מופעים:<\/strong> יום שקט יותר למחרת.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>צרידות שלא עוברת, או כאב בדיבור:<\/strong> לא ממשיכים ״לדחוף״. פונים לרופא/ת אף־אוזן־גרון.<\/li>\n<\/ul>\n<hr />\n<h2>4. הגוף: תנועת היד, תנוחות החתימה, הכניסה והיציאה<\/h2>\n<h3>4.1 תנועת היד: ״ה־V של קים״ (החלטה סופית)<\/h3>\n<p><strong>ההחלטה:<\/strong> ברירת המחדל מ<a href=\"02-show-script.md\">תסריט המופע<\/a> נשארת, עם תוספת אחת: <strong>האצבעות פרושות כמו קרני שמש<\/strong>. זה מחבר את התנועה לצבעי המותג (שמש, צהוב, כתום).<\/p>\n<table>\n<thead>\n<tr>\n<th>שלב<\/th>\n<th>מה אומרים<\/th>\n<th>מה הגוף עושה<\/th>\n<th>תזמון<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1. ההקשבה<\/strong><\/td>\n<td>״עם קים...״<\/td>\n<td><strong>יד ימין<\/strong> פתוחה מאחורי האוזן הימנית, כף היד פונה קדימה. הגוף נוטה קצת קדימה, הגבות מורמות: ״אני מקשיבה״<\/td>\n<td>אחרי המילים יש <strong>שנייה וחצי של שקט<\/strong>. זה הזמן של הילדים לענות<\/td>\n<\/tr>\n<tr>\n<td><strong>2. ה־V<\/strong><\/td>\n<td>״כולם משחקים!״<\/td>\n<td><strong>שתי הידיים נזרקות למעלה באלכסון<\/strong>, בצורת V. כפות פתוחות קדימה, אצבעות פרושות<\/td>\n<td>בדיוק על המילה ״משחקים״<\/td>\n<\/tr>\n<tr>\n<td><strong>3. הפסל<\/strong><\/td>\n<td>—<\/td>\n<td><strong>קופאים<\/strong> עם הידיים למעלה ועם חיוך. הרגליים על הרצפה<\/td>\n<td>שתי שניות, ואז ממשיכים<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>למה דווקא התנועה הזאת:<\/strong><\/p>\n<ul>\n<li>רואים אותה <strong>מהשורה האחרונה<\/strong> וגם <strong>במסך קטן של טלפון<\/strong>.<\/li>\n<li><strong>אין בה מגע<\/strong> בין ילדים.<\/li>\n<li>אפשר לעשות אותה <strong>בישיבה<\/strong>, ולכן היא מתאימה גם לילד/ה בכיסא גלגלים או עם קושי בתנועה (בתסריט, גרסת הישיבה מוצגת לכולם כ״גרסה מותרת״).<\/li>\n<li><strong>ילד/ה בן/בת 3 יכול/ה לעשות אותה.<\/strong><\/li>\n<li>היא <strong>מצטלמת טוב:<\/strong> לתמונת פרופיל, לתמונה ממוזערת, לכרזה.<\/li>\n<li>בשלב 3 היא הופכת ל<strong>סימן עצירה<\/strong>. זה הכלי הכי חשוב שלך לשליטה בקבוצה (קטע 2 בתסריט).<\/li>\n<\/ul>\n<p><strong>גרסאות:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>מצב<\/th>\n<th>איך<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>לחישה<\/strong><\/td>\n<td>V קטן מול החזה, ״עם קים...״ בלחישה<\/td>\n<\/tr>\n<tr>\n<td><strong>ישיבה<\/strong><\/td>\n<td>אותה תנועה בדיוק, בישיבה. מציגים אותה לכולם<\/td>\n<\/tr>\n<tr>\n<td><strong>גיל 3–4<\/strong><\/td>\n<td>מרימים ידיים, בלי חובה לקפוא<\/td>\n<\/tr>\n<tr>\n<td><strong>גיל 7–8<\/strong><\/td>\n<td>״קריאה עם מכשול״: עונים רק אם קים עשתה את תנועת היד (מהתסריט)<\/td>\n<\/tr>\n<tr>\n<td><strong>סרטון<\/strong><\/td>\n<td>מסגור מדיום, <strong>עם מקום מעל הראש<\/strong> כדי שהידיים לא ייחתכו בפורמט 9:16 (פרק 5 ב<a href=\"09-filming-guide.md\">מדריך הצילום<\/a>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>כללים:<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>תמיד יד ימין לאוזן.<\/strong> אותה יד, בכל פעם.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מתרגלים 20 פעמים מול מראה<\/strong>, ואחר כך מצלמים מ־3 מטר ובודקים בטלפון.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מהרגע שהסרטון הראשון עולה, התנועה לא משתנה.<\/strong> ילדים יגיעו למופע כשהם כבר יודעים אותה מהסרטונים, וזה כל הרעיון של מותג.<\/li>\n<\/ul>\n<h3>4.2 ארבע תנוחות חתימה<\/h3>\n<p>אלה ״התמונות״ של קים. משתמשים בהן במופע, בסרטונים, בתמונת הפרופיל, בעמוד הנחיתה ובהצעת המחיר.<\/p>\n<table>\n<thead>\n<tr>\n<th>שם<\/th>\n<th>איך זה נראה<\/th>\n<th>מתי משתמשים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>טה־דה!<\/strong><\/td>\n<td>ידיים פתוחות באלכסון למעלה, רגל אחת קדימה, סנטר מורם, חיוך גדול<\/td>\n<td>סוף הכניסה, תמונת פרופיל, התמונה הראשית בעמוד הנחיתה<\/td>\n<\/tr>\n<tr>\n<td><strong>החשדנית<\/strong><\/td>\n<td>עיניים מצומצמות, אצבע על הסנטר, הגוף נוטה לכיוון הילדים או המצלמה<\/td>\n<td>״אתם יודעים לשחק?״, הוקים בסרטונים<\/td>\n<\/tr>\n<tr>\n<td><strong>אופס!<\/strong><\/td>\n<td>שתי ידיים על הלחיים, פה פתוח בהפתעה<\/td>\n<td>כל טעות. תמונה ממוזערת לסרטוני ״קים משתגעת״<\/td>\n<\/tr>\n<tr>\n<td><strong>ה־V<\/strong><\/td>\n<td>כמו בתנועת היד, קפואה<\/td>\n<td>סוף כל מופע וכל סרטון, כרטיס הסיום, כרזות<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>ביום הצילום הראשון<\/strong> (פרק 7 ב<a href=\"09-filming-guide.md\">מדריך הצילום<\/a>): צלמי את ארבע התנוחות <strong>כתמונות סטילס<\/strong>, בתלבושת מלאה ועל רקע נקי. מהן תבחרי תמונת פרופיל ותמונה לעמוד הנחיתה.<\/li>\n<\/ul>\n<h3>4.3 הכניסה הקבועה<\/h3>\n<p><strong>במופע<\/strong> (הנוסח המלא בקטע 1 ב<a href=\"02-show-script.md\">תסריט<\/a>):<\/p>\n<ol>\n<li>רצועת הכניסה מתחילה, וקים עוד לא נראית.<\/li>\n<li>רק הקול נשמע, מבחוץ: ״הלו? הלו־הלו? יש פה ילדים?״, ומסלימים שלוש פעמים: ״...יש פה ילדים שיודעים לשחק?!״<\/li>\n<li>קים נכנסת בריצה קלה <strong>לאורך קו הבמה, אף פעם לא דרך הילדים<\/strong>.<\/li>\n<li>נעצרת במרכז בתנוחת <strong>״טה־דה!״<\/strong>. המוזיקה יורדת.<\/li>\n<li>״היי! אני קים! ובאתי לבדוק דבר אחד. רק אחד... אתם... יודעים... לשחק?״<\/li>\n<\/ol>\n<table>\n<thead>\n<tr>\n<th>מצב<\/th>\n<th>הכניסה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>אין איפה להתחבא<\/strong><\/td>\n<td>עומדת בצד החדר עם הגב לקהל, ״קפואה״. ב״הלו? יש פה ילדים?״ מסתובבת בבת אחת<\/td>\n<\/tr>\n<tr>\n<td><strong>גיל 3–4<\/strong><\/td>\n<td>בלי הפתעות ובלי צעקות מבחוץ. נכנסת לאט, מציצה, ״קוקו!״, ומדברת ברכות<\/td>\n<\/tr>\n<tr>\n<td><strong>יום הולדת בבית<\/strong><\/td>\n<td>נכנסת מהחדר או מהמסדרון שההורים הראו לך מראש. לא מסתובבים בבית<\/td>\n<\/tr>\n<tr>\n<td><strong>בחוץ<\/strong><\/td>\n<td>מאחורי עץ, עמוד או קיר, או בגב לקהל. אף פעם לא מכיוון של כביש או חניה<\/td>\n<\/tr>\n<tr>\n<td><strong>בסרטון<\/strong><\/td>\n<td><strong>קופצת לתוך הפריים<\/strong> מהצד ונוחתת מול המצלמה (סרטון 0 ב<a href=\"03-video-scripts.md\">תסריטי הסרטונים<\/a>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>בכניסה אף פעם לא:<\/strong><\/p>\n<ul>\n<li>נכנסים לפני שהמבוגר/ת האחראי/ת נמצא/ת בחדר.<\/li>\n<li>מבהילים ילדים קטנים.<\/li>\n<li>נכנסים עם אביזרים ביד. הכל מחכה בתיק.<\/li>\n<\/ul>\n<h3>4.4 היציאה הקבועה<\/h3>\n<ol>\n<li>״עם קים...״ ← ״כולם משחקים!״, פעמיים, והשנייה חזקה יותר.<\/li>\n<li>״פסל אחרון״: כולם קופאים ומתיישבים לאט, ״כמו נוצה״.<\/li>\n<li>בלחישה: <strong>״תודה. אני קים, ונתראה במשחק הבא!״<\/strong><\/li>\n<li>יוצאת בנפנוף, המוזיקה עולה, והצוות לוקח את הקבוצה.<\/li>\n<\/ol>\n<p><strong>אחרי היציאה:<\/strong> קים מדברת עם האחראי/ת <strong>מחוץ לטווח הראייה של הילדים<\/strong>. בקבוצה קטנה (עד 15) אפשר ״מנהרת יציאה״, שבה כל ילד/ה <strong>בוחר/ת<\/strong> כיף, אגרוף או נפנוף (קטע 10 בתסריט).<\/p>\n<p><strong>בסרטון:<\/strong> הסיום הקבוע עם הקריאה, תנועת היד וכרטיס הסיום (״המבנה הקבוע״ ב<a href=\"03-video-scripts.md\">תסריטי הסרטונים<\/a>).<\/p>\n<hr />\n<h2>5. בנק משפטי החתימה (23 משפטים)<\/h2>\n<p><strong>איך משתמשים:<\/strong> חמשת הראשונים <strong>קבועים<\/strong>. אומרים אותם באותו נוסח בדיוק, בכל מופע ובכל סרטון, ולא משנים אותם. השאר הם <strong>בנק<\/strong>: בוחרים מה שמתאים, ולא חייבים להשתמש בכולם במופע אחד.<\/p>\n<h3>הקבועים (לא משנים)<\/h3>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>המשפט<\/th>\n<th>מתי<\/th>\n<th>מקור<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>״עם קים...״ ← ״כולם משחקים!״<\/strong><\/td>\n<td>פתיחה, סיום, וגם כסימן עצירה לאורך כל המופע<\/td>\n<td>הקונספט<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>״אתם יודעים לשחק?״<\/strong><\/td>\n<td>השאלה הפותחת, ההוק של סרטון ההיכרות<\/td>\n<td>הקונספט<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>״אני קים, ובאתי לבדוק דבר אחד...״<\/strong><\/td>\n<td>הכניסה, סרטון ההיכרות<\/td>\n<td>הקונספט<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><strong>״אופס!״ ← ״לא נורא!״<\/strong><\/td>\n<td>כל טעות, של ילד/ה או של קים<\/td>\n<td>תסריט, ״הסימנים הקבועים״<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><strong>״אני קים, ונתראה במשחק הבא!״<\/strong><\/td>\n<td>היציאה<\/td>\n<td>קטע 10<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>הבנק<\/h3>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>המשפט<\/th>\n<th>מתי<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>6<\/td>\n<td>״עברתם! אתם רשמית שחקנים של קים.״<\/td>\n<td>אחרי ״המבחן״ בכניסה<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>״פסל!״<\/td>\n<td>עצירה, משחק הפסל, החזרת קשב<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>״מי שיודע לשחק, שיגע ב...!״ (אף / ברך / ראש <strong>של עצמו<\/strong>)<\/td>\n<td>מבחן הכניסה, החזרת קשב<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>״קים, תקשיבי!״ (המשפט של הילדים, עם שלוש מחיאות כפיים)<\/td>\n<td>״קים משתגעת״<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>״הצלתם אותי!״<\/td>\n<td>אחרי כל ״תיקון״ של קים<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>״עכשיו אתם! ...אני מחכה...״<\/td>\n<td>בכל סרטון, לפני הסיום<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>״תפנו מקום!״<\/td>\n<td>תחילת כל סרטון תנועה (בטיחות בבית)<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>״תררררר...״ (התופים של קים, על הברכיים)<\/td>\n<td>זמני המתנה: זריקת קובייה, מתנדב/ת שעולה<\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>״יותר מהר! ...סופר מהר!!!״<\/td>\n<td>סבבים מתגברים<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>״את זה גם אני לא יודעת!״<\/td>\n<td>כשקים ״נכשלת״<\/td>\n<\/tr>\n<tr>\n<td>16<\/td>\n<td>״רגע. רגע. רגע...״ (בטון חשדני)<\/td>\n<td>לפני טוויסט<\/td>\n<\/tr>\n<tr>\n<td>17<\/td>\n<td>״מי ששומע אותי... שיגע באף.״ (בלחישה)<\/td>\n<td>החזרת קשב בלי לצעוק<\/td>\n<\/tr>\n<tr>\n<td>18<\/td>\n<td>״ידיים כמו מטוס. זאת הבועה שלכם.״<\/td>\n<td>לפני כל משחק בעמידה<\/td>\n<\/tr>\n<tr>\n<td>19<\/td>\n<td>״את הקו עוברים רק כשקים מזמינה.״<\/td>\n<td>הסבר קו הבמה<\/td>\n<\/tr>\n<tr>\n<td>20<\/td>\n<td>״אין פה צופים. יש פה רק שחקנים!״<\/td>\n<td>פתיחה. עובד גם בשיווק להורים<\/td>\n<\/tr>\n<tr>\n<td>21<\/td>\n<td>״סגור?״ ← ״סגור!״<\/td>\n<td>סגירת חוק או הבטחה<\/td>\n<\/tr>\n<tr>\n<td>22<\/td>\n<td>״אני צריכה צוות. צוות אמיתי.״<\/td>\n<td>מעבר למשחק שיתופי<\/td>\n<\/tr>\n<tr>\n<td>23<\/td>\n<td>״כל שבוע: משחק חדש.״<\/td>\n<td>סרטונים, ביו בפרופיל<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>מילים ששומרים בצד<\/h3>\n<table>\n<thead>\n<tr>\n<th>במקום...<\/th>\n<th>אומרים...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>״חמודים״, ״מתוקים״, ״ילדונים״<\/td>\n<td>״שחקנים״, ״שחקניות ושחקנים״, ״צוות״<\/td>\n<\/tr>\n<tr>\n<td>״שקט!״<\/td>\n<td>״עם קים...״ או לחישה<\/td>\n<\/tr>\n<tr>\n<td>״אתה בחוץ / נפסלת״<\/td>\n<td>״אופס! לא נורא, ממשיכים!״<\/td>\n<\/tr>\n<tr>\n<td>״מי הכי טוב?״<\/td>\n<td>״מי מוכן לנסות?״ / ״שיא החדר!״<\/td>\n<\/tr>\n<tr>\n<td>״בנים נגד בנות״<\/td>\n<td>״השורה הזאת נגד השיא של עצמה״<\/td>\n<\/tr>\n<tr>\n<td>״תעשו לייק / תעקבו״ (בסרטון)<\/td>\n<td>״עכשיו אתם!״ (ואת ההזמנה לתגובות שמים בכיתוב, להורים)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>6. מה קים אף פעם לא עושה<\/h2>\n<p>זה הפרק הכי חשוב בקובץ. הוא שומר על הילדים, עלייך ועל המותג.<\/p>\n<h3>עם הגוף והבטיחות של הילדים<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מרימה, לא מסובבת ולא נושאת על הגב, גם כשמבקשים.<\/strong> תשובה מוכנה: ״קים לא מרימה, קים מקפיצה! כולם לקפוץ!״<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא נוגעת בלי בחירה של הילד/ה.<\/strong> מגע רק כשהילד/ה בוחר/ת: כיף, אגרוף או נפנוף.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אף פעם לא נשארת לבד עם ילד/ה<\/strong> בחדר סגור. שירותים, בכי ופציעה באחריות הצוות או ההורים.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מחלקת ממתקים או אוכל<\/strong> (אלרגיות, וכללי המקום). המתנה היא מדבקה, והצוות מחלק אותה.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא עושה פעלול שילד/ה יחקה ויסכן את עצמו:<\/strong> לא נפילה אמיתית לרצפה, לא טיפוס, לא קפיצה מגובה. ״נפילה״ של קים היא קומית ומבוקרת.<\/li>\n<\/ul>\n<h3>בהומור<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא צוחקת על ילד/ה:<\/strong> לא על מראה, שם, מבטא, גוף או טעות.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מביכה מבוגר/ת<\/strong> מול הילדים בלי שסיכמתם מראש.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מספרת בדיחות של מבוגרים<\/strong> ״מעל הראש״ של הילדים.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא משתמשת בסטריאוטיפים<\/strong> (״בנות לא...״, ״בנים תמיד...״).<\/li>\n<\/ul>\n<h3>בשליטה בקבוצה<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא צועקת ״שקט!״ ולא מאיימת<\/strong> (״אם לא תשבו, אני הולכת!״).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא קוראת לילד/ה בשם מול כולם כדי להעיר<\/strong>, ולא מבקשת מילדים להשתיק ילדים אחרים.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מוציאה ילד/ה מהמשחק.<\/strong> אין מפסידים.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מכריחה ילד/ה ביישן/ית לעלות.<\/strong> מציעים תפקיד שקט (מתופף/ת ראשי/ת, סופר/ת) ולא מתעקשים.<\/li>\n<\/ul>\n<h3>בצילום, בפרטיות וברשתות<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מצלמת ילדים<\/strong> בלי אישור חתום, ולא מפרסמת ילד/ה מזוהה בלי אישור (<a href=\"08-consent-template.md\">נוסח אישור הצילום<\/a>).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מבקשת מילדים<\/strong> לעשות לייק, לעקוב או להירשם.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מנהלת שיחה עם ילדים<\/strong> בהודעות פרטיות או בוואטסאפ. לכל היותר תשובה קבועה אחת שמפנה להורים (פרק 10), ולא ממשיכים. מתכתבים רק עם הורים וצוות.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מוסרת פרטים פרטיים<\/strong> (כתובת, משפחה) ולא מתייגת מיקום בזמן אמת.<\/li>\n<\/ul>\n<h3>בהבטחות<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מבטיחה תוצאות טיפוליות או התפתחותיות.<\/strong> כותבים ״מתרגל״, לא ״משפר״ ולא ״מטפל״ (חוק 7 ב<a href=\"03-video-scripts.md\">תסריטי הסרטונים<\/a>).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מבטיחה לילד/ה משהו שלא תקיים<\/strong> (״אני אבוא ליום ההולדת שלך!״). את ההבטחות שכן נותנים, מקיימים (״אני מבטיחה להזמין אותך בקובייה״).<\/li>\n<\/ul>\n<h3>במותג<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מופיעה כקים בתלבושת חלקית או מלוכלכת<\/strong> (<a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a>).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא משתמשת בדמויות, בשירים או בלוגואים של אחרים<\/strong> בלי זכויות (פרק 8 בתסריט: זכויות במוזיקה).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מחקה כוכבי ילדים אחרים.<\/strong> הבידול של קים הוא ״משחק פעיל, לא צפייה״.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מתווכחת על כסף, שעות או תקלות מול הילדים.<\/strong> רק בצד, עם המבוגר/ת האחראי/ת.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מעשנת, לא מקללת ולא מתעצבנת בפומבי כשהיא בתלבושת<\/strong>, גם לא ״בהפסקה״. ילדים והורים רואים ומצלמים.<\/li>\n<\/ul>\n<h3>מתי יוצאים מהדמות, מייד<\/h3>\n<p>כשיש <strong>בעיית בטיחות אמיתית<\/strong>: ילד/ה נפצע/ה, ילד/ה נעלם/ה מהעין, סכנה בחלל, או ילד/ה במצוקה.<\/p>\n<ol>\n<li>״עם קים...״ ← ״כולם משחקים!״ וקפיאה, או בקול רגיל ורגוע של מבוגרת: <strong>״עוצרים רגע. כולם לשבת.״<\/strong><\/li>\n<li>פונים לאחראי/ת מהמקום, ולא מטפלים לבד.<\/li>\n<li>רק אחרי שהכל בשליטה חוזרים למשחק, או מקצרים (״סדר הקיצוץ״ בפרק 7 בתסריט).<\/li>\n<li>רושמים את האירוע, גם אם היה רק ״כמעט״, ב<a href=\"05-pilot-feedback.md\">טופס המשוב<\/a>.<\/li>\n<\/ol>\n<hr />\n<h2>7. שלושה קהלים, שלושה קולות: ילדים, הורים, מוסדות<\/h2>\n<p><strong>הכלל:<\/strong> מול הילדים מדברת <strong>קים הדמות<\/strong>. מול ההורים מדברת <strong>קים, את<\/strong>, בגוף ראשון, חם ואישי. מול מוסדות מדברת <strong>קים נידם, אשת המקצוע<\/strong>, ו״קים משחקים״ הוא שם העסק.<\/p>\n<p><strong>ביום המופע, הדלת היא המתג.<\/strong> מחוץ לחדר, בשיחה עם הצוות, את אשת מקצוע רגועה. ברגע שאת נכנסת לחדר או חוצה את קו הבמה, את קים. ביציאה חוזרים להיות אשת מקצוע.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>ילדים<\/strong><\/th>\n<th><strong>הורים<\/strong><\/th>\n<th><strong>מוסדות<\/strong> (גננות, רכזות קייטנה, מתנ״סים, רשויות, מפיקי אירועים)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מי מדברת<\/strong><\/td>\n<td>קים הדמות<\/td>\n<td>קים, בגוף ראשון<\/td>\n<td>קים נידם, ״קים משחקים״<\/td>\n<\/tr>\n<tr>\n<td><strong>מה הם צריכים לשמוע<\/strong><\/td>\n<td>״עכשיו משחקים!״<\/td>\n<td>שהילד/ה ייהנה, יזוז ויהיה בטוח, ושקל להזמין<\/td>\n<td>שזה מתאים לגיל ולתוכנית, בטוח ואמין, עם לוגיסטיקה, מחיר ותנאים ברורים<\/td>\n<\/tr>\n<tr>\n<td><strong>אורך<\/strong><\/td>\n<td>משפט אחד<\/td>\n<td>הודעת וואטסאפ של 3–5 שורות<\/td>\n<td>פסקה קצרה ופרטים בנקודות<\/td>\n<\/tr>\n<tr>\n<td><strong>טון<\/strong><\/td>\n<td>אנרגטי, משחקי, שואל<\/td>\n<td>חם, ישיר, קליל, בגובה העיניים<\/td>\n<td>מקצועי, אדיב ותמציתי, ועדיין חם<\/td>\n<\/tr>\n<tr>\n<td><strong>אימוג׳י<\/strong><\/td>\n<td>—<\/td>\n<td>1–2 (🟡 ☀️)<\/td>\n<td>0–1<\/td>\n<\/tr>\n<tr>\n<td><strong>מילים שכן<\/strong><\/td>\n<td>״שחקנים״, ״מוכנים?״, ״עכשיו אתם!״<\/td>\n<td>״הילדים זזים כל הזמן״, ״אין צופים, כולם משתתפים״, ״אני מגיעה עם כל הציוד״<\/td>\n<td>״מופע משחק ותנועה אינטראקטיבי״, ״מותאם לגיל ולגודל הקבוצה״, ״מתרגל תנועה, הקשבה ושיתוף פעולה״<\/td>\n<\/tr>\n<tr>\n<td><strong>מילים שלא<\/strong><\/td>\n<td>״חמודים״, ״שקט!״<\/td>\n<td>״מבצע לזמן מוגבל!!!״, לחץ, הבטחות גדולות<\/td>\n<td>״משפר קשב״, ״טיפולי״, ״מתאים לילדים עם הפרעות קשב״<\/td>\n<\/tr>\n<tr>\n<td><strong>חתימה<\/strong><\/td>\n<td>״עם קים...״<\/td>\n<td>״קים 🟡 עם קים, כולם משחקים!״<\/td>\n<td>״קים נידם · קים משחקים · מופעי משחק ותנועה לילדים · [טלפון]״<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>הנוסחים המלאים<\/strong> (הודעה ראשונה, מעקב, שיחת טלפון) נמצאים ב<a href=\"10-outreach-templates.md\">תבניות הפנייה<\/a>. תהליך ההזמנה מההודעה הראשונה ועד אחרי המופע מפורט ב<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>.<\/p>\n<hr />\n<h2>8. דוגמאות טון: אותו מסר בשלושה קולות<\/h2>\n<h3>דוגמה 1: ״זה מופע של משחק פעיל״<\/h3>\n<ul>\n<li><strong>לילדים:<\/strong> ״היום אף אחד לא יושב ומסתכל. כולם משחקים! מוכנים?״<\/li>\n<li><strong>להורים:<\/strong> ״במופע של קים משחקים הילדים לא יושבים ומסתכלים, הם משחקים איתי: קופצים, קופאים, צוחקים ורוקדים. אני מגיעה עם כל הציוד 🟡״<\/li>\n<li><strong>למוסדות:<\/strong> ״מופע משחק ותנועה אינטראקטיבי של כ־45 דקות (לגילאי 3–4 גרסה של כ־30 דקות). כל ילד/ה מוזמן/ת להשתתף באופן פעיל, ומי שמעדיף/ה מקבל/ת תפקיד שקט. אף אחד לא מוכרח. המופע מותאם לגיל ולגודל הקבוצה, וכל הציוד עליי.״<\/li>\n<\/ul>\n<h3>דוגמה 2: בטיחות ומגע<\/h3>\n<ul>\n<li><strong>לילדים<\/strong> (כשמבקשים ״תרימי אותי!״): ״קים לא מרימה, קים מקפיצה! כולם לקפוץ!״<\/li>\n<li><strong>להורים:<\/strong> ״חשוב לי שתדעו: אני לא מרימה ילדים, ונוגעת רק כשילד/ה בוחר/ת (כיף, אגרוף או נפנוף). אני מבקשת שמבוגר/ת מכם יישאר/תישאר בחדר לאורך כל המופע.״<\/li>\n<li><strong>למוסדות:<\/strong> ״כללי הבטיחות במופע: אין הרמה או נשיאה של ילדים, ומגע רק לפי בחירת הילד/ה. ריצות וקפיצות רק במקום. היוצא מן הכלל: מסלול תנועה בקבוצה קטנה ובשטח פנוי, שבו הילדים עוברים אחד־אחד, בתור. נדרש/ת איש/אשת צוות מהמסגרת בחדר לאורך כל המופע. לפני ההופעה אני בודקת את החלל (רצפה, מכשולים, יציאות).״<\/li>\n<\/ul>\n<h3>דוגמה 3: צילום ילדים<\/h3>\n<ul>\n<li><strong>לילדים<\/strong> (ילד/ה מבקש/ת סלפי): ״תשאל/י את ההורים. הם מחליטים על תמונות!״<\/li>\n<li><strong>להורים:<\/strong> ״אשמח לצלם קטעים מהמופע לרשתות, אבל רק ילדים שההורים שלהם חתמו על אישור. מי שלא חתם לא יופיע עם פנים מזוהות, וזה לגמרי בסדר.״<\/li>\n<li><strong>למוסדות:<\/strong> ״אני מתעדת רק לפי אישורים חתומים של הורים. ילד/ה בלי אישור לא יופיע/תופיע מזוהה/ת בשום פרסום. נוסח האישור מצורף.״ (הנוסח: <a href=\"08-consent-template.md\">אישור צילום<\/a>)<\/li>\n<\/ul>\n<h3>דוגמה 4: ״כמה זה עולה?״<\/h3>\n<p><em>(את המחיר קובעים ב<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>. כאן רק הטון.)<\/em><\/p>\n<ul>\n<li><strong>להורים:<\/strong> ״המחיר תלוי בתאריך, במקום ובמספר הילדים. שלחו לי תאריך, עיר, גיל הילדים וכמה ילדים בערך, ואחזור אליכם עם הצעה מסודרת.״<\/li>\n<li><strong>למוסדות:<\/strong> ״אשמח לשלוח הצעת מחיר מסודרת. כדי להתאים אותה אצטרך: מועד, מיקום, מספר ילדים וגילם, ומשך מבוקש (מופע בודד או סדרה).״<\/li>\n<\/ul>\n<h3>דוגמה 5: תודה אחרי המופע<\/h3>\n<ul>\n<li><strong>לילדים<\/strong> (ביציאה): ״תודה. אני קים, ונתראה במשחק הבא!״<\/li>\n<li><strong>להורים:<\/strong> ״תודה שהזמנתם את קים! 🟡 אם הילדים עדיין צועקים ׳כולם משחקים!׳, עשינו את העבודה. אם בא לך לכתוב לי שתיים־שלוש מילים על איך היה, זה יעזור לי מאוד.״<\/li>\n<li><strong>למוסדות:<\/strong> ״תודה על האירוח והשיתוף פעולה. אשמח לשמוע מה עבד ומה כדאי לשפר (2 דקות, [קישור לשאלון]). אם תרצו להמשיך בסדרת מפגשים או לחזור בחופשה, אשמח לתאם.״ (השאלון: <a href=\"05-pilot-feedback.md\">טופס המשוב<\/a>)<\/li>\n<\/ul>\n<hr />\n<h2>9. שאלות שילדים שואלים, ותשובות מתוך הדמות<\/h2>\n<p><strong>הכלל:<\/strong> עונים בהומור, <strong>בלי לשקר על עובדות ובלי לחשוף פרטים<\/strong>, ומחזירים את הילדים למשחק תוך 5 שניות.<\/p>\n<table>\n<thead>\n<tr>\n<th>השאלה<\/th>\n<th>התשובה של קים<\/th>\n<th>למה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>״בת כמה את?״<\/td>\n<td>״בגיל של משחק! ואתם?... גם! מושלם.״<\/td>\n<td>פרטיות, וחזרה למשחק<\/td>\n<\/tr>\n<tr>\n<td>״איפה את גרה?״<\/td>\n<td>״בכל מקום שמשחקים בו. היום, פה!״<\/td>\n<td>פרטיות וביטחון<\/td>\n<\/tr>\n<tr>\n<td>״יש לך ילדים? / חבר?״<\/td>\n<td>״יש לי המון שחקנים. אתם!״<\/td>\n<td>פרטיות<\/td>\n<\/tr>\n<tr>\n<td>״את אמיתית?״<\/td>\n<td>״תבדקו: מי שחושב שאני אמיתית, שיגע באף!״<\/td>\n<td>הופכים את השאלה למשחק<\/td>\n<\/tr>\n<tr>\n<td>״את מהיוטיוב? מהטלוויזיה?״<\/td>\n<td>״אני מהמשחקים! ראיתם אותי בסרטונים? איזה משחק אהבתם?״<\/td>\n<td>מחזק את הקשר לסרטונים, בלי להתרברב<\/td>\n<\/tr>\n<tr>\n<td>״למה את לבושה ככה?״<\/td>\n<td>״כי זה הבגד הכי קופצני שיש! תראו...״ <em>(קופצת)<\/em><\/td>\n<td>הופכים לתנועה<\/td>\n<\/tr>\n<tr>\n<td>״את יכולה לבוא ליום ההולדת שלי?״<\/td>\n<td>״איזה כיף! תגיד/י להורים שידברו איתי.״<\/td>\n<td>לא מבטיחים לילד/ה. ההזמנה עוברת דרך ההורים<\/td>\n<\/tr>\n<tr>\n<td>״מה הטלפון שלך? / אפשר לשלוח לך הודעה?״<\/td>\n<td>״את הטלפון שלי יש להורים ולגננת. הם יודעים איך למצוא אותי.״<\/td>\n<td><strong>לא<\/strong> נותנים פרטי קשר לילדים<\/td>\n<\/tr>\n<tr>\n<td>״אפשר חיבוק?״<\/td>\n<td>״כיף באוויר? אגרוף? נפנוף? את/ה בוחר/ת!״ <em>(ואם הילד/ה מחבק/ת, מחזירים מגע קצר של יד על הכתף ומשחררים)<\/em><\/td>\n<td>מגע לפי בחירה, קצר, ומול כולם<\/td>\n<\/tr>\n<tr>\n<td>״אפשר לעשות איתך תמונה?״<\/td>\n<td>״תשאל/י את ההורים שלך. אם הם מצלמים, אני אעשה את ה־V!״<\/td>\n<td>רק ההורה מצלם את הילד/ה שלו/ה. לא בטלפון שלך<\/td>\n<\/tr>\n<tr>\n<td>״למה את לא יודעת לגעת באף עם הברך?״<\/td>\n<td>״כי זה בלתי אפשרי! ...רגע, מי פה הצליח?!״<\/td>\n<td>צוחקים על קים<\/td>\n<\/tr>\n<tr>\n<td>״למה הרגל שלך משתגעת?״<\/td>\n<td>״אין לי מושג! רק אתם יודעים לתקן אותה. מוכנים? אחת, שתיים, שלוש...״<\/td>\n<td>מחזירים את הכוח לילדים<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>10. קים ברשתות<\/h2>\n<table>\n<thead>\n<tr>\n<th>איפה<\/th>\n<th>מי מדברת<\/th>\n<th>לאן<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>בתוך הסרטון<\/strong><\/td>\n<td>קים הדמות<\/td>\n<td>לילדים: ״עכשיו אתם!״<\/td>\n<\/tr>\n<tr>\n<td><strong>בכיתוב (קפשן)<\/strong><\/td>\n<td>קים, את<\/td>\n<td>להורים: ״הורים, כתבו לנו...״ (חוק 6 ב<a href=\"03-video-scripts.md\">תסריטי הסרטונים<\/a>)<\/td>\n<\/tr>\n<tr>\n<td><strong>בתגובות<\/strong><\/td>\n<td>קים, בגוף ראשון, חם וקצר<\/td>\n<td>להורים ולגננות<\/td>\n<\/tr>\n<tr>\n<td><strong>בהודעות פרטיות<\/strong><\/td>\n<td>קים נידם, אשת המקצוע<\/td>\n<td>פניות להזמנה: לפי <a href=\"10-outreach-templates.md\">תבניות הפנייה<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>כשילד/ה כותב/ת לך<\/strong> (בתגובה או בהודעה פרטית): עונים <strong>פעם אחת<\/strong>, בתשובה הקבועה, ולא ממשיכים:<\/p>\n<blockquote>\n<p>״תודה! 🟡 תראה/י את הסרטון להורים, ואם יש שאלה, שהם יכתבו לי.״<\/p>\n<\/blockquote>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא ממשיכים בשיחה<\/strong>, גם אם הילד/ה כותב/ת שוב. לא שואלים פרטים (שם, גיל, גן, עיר) ולא שולחים קישורים או תמונות.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>הודעה מדאיגה:<\/strong> ילד/ה מספר/ת על פגיעה או על מצוקה, או מבוגר/ת כותב/ת דברים לא הולמים על ילדים או לילדים. <strong>מצלמים מסך<\/strong> לתיעוד, ופועלים לפי <a href=\"08-consent-template.md\">הכללים הפנימיים<\/a> (״תגובות והודעות ברשתות״): מבוגר/ת פוגעני/ת מוחקים, חוסמים ומדווחים לפלטפורמה. <strong>חשש לפגיעה בילד/ה:<\/strong> המוקד הלאומי להגנה על ילדים ברשת, <strong>105<\/strong> (<strong>לבדוק<\/strong> מראש את דרכי הפנייה, כמו שכתוב שם). <strong>סכנה מיידית:<\/strong> משטרה, <strong>100<\/strong>. לא חוקרים לבד ולא ממשיכים להתכתב עם הילד/ה.<\/li>\n<\/ul>\n<p>הכללים של כל פלטפורמה לגבי ילדים מפורטים בפרק 12 ב<a href=\"09-filming-guide.md\">מדריך הצילום<\/a>.<\/p>\n<p><strong>תגובה שלילית או פוגענית:<\/strong> עונים פעם אחת, בנימוס, או מסתירים ומוחקים לפי הכללים של הפלטפורמה. לא מתווכחים בפומבי.<\/p>\n<p><strong>החשבון האישי שלך:<\/strong> נשאר נפרד, ועדיף פרטי. לא מערבבים חיים פרטיים בחשבון המותג.<\/p>\n<p><strong>שיתופי פעולה עם יוצרים אחרים:<\/strong> רק אחרי <a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a>, ורק עם מי שעומד ברשימת ״מה קים אף פעם לא עושה״.<\/p>\n<hr />\n<h2>11. כרטיס דמות להדפסה<\/h2>\n<blockquote>\n<p><strong>קים משחקים: כרטיס דמות<\/strong><\/p>\n<p><strong>מי:<\/strong> כוכבת משחק ספורטיבית ושובבה, שבאה לבדוק אם הילדים יודעים לשחק, ותמיד מגלה שכן.<\/p>\n<p><strong>שלוש מילים:<\/strong> שובבה · סוחפת · אמיתית<\/p>\n<p><strong>הקריאה:<\/strong> ״עם קים...״ ← ״כולם משחקים!״<\/p>\n<p><strong>תנועת היד:<\/strong> יד ימין מאחורי האוזן ← V עם אצבעות פרושות ← פסל של 2 שניות<\/p>\n<p><strong>כניסה:<\/strong> ״הלו? יש פה ילדים?״ ← ריצה לאורך קו הבמה ← ״טה־דה!״ ← ״אתם יודעים לשחק?״<\/p>\n<p><strong>יציאה:<\/strong> פסל אחרון ← ״תודה. אני קים, ונתראה במשחק הבא!״<\/p>\n<p><strong>5 קבועים:<\/strong> עם קים / אתם יודעים לשחק? / באתי לבדוק דבר אחד / אופס! לא נורא! / נתראה במשחק הבא<\/p>\n<p><strong>5 אף פעם:<\/strong> לא מרימה ילדים · לא צוחקת על ילד/ה · לא צועקת ״שקט!״ · לא מצלמת בלי אישור חתום · לא לבד עם ילד/ה<\/p>\n<p><strong>בטיחות קודמת לדמות.<\/strong> בעיה אמיתית? ״עוצרים רגע, כולם לשבת״, ופונים לאחראי/ת.<\/p>\n<\/blockquote>\n<hr />\n<h2>12. דברים לבדוק<\/h2>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>ייחודיות תנועת היד:<\/strong> 20 דקות של חיפוש ביוטיוב ובאינסטגרם, כדי לוודא שה־V עם היד מאחורי האוזן לא זהה לתנועת חתימה של כוכב/ת ילדים מוכר/ת בישראל. אם יש דמיון חזק, משנים עכשיו, לפני הסרטון הראשון.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>בדיקה מול ילדים:<\/strong> בחזרות של שבוע 2 (פרק 12 ב<a href=\"02-show-script.md\">תסריט<\/a>), האם הילדים מחקים את ה־V בלי הסבר? האם הם זוכרים את ״כולם משחקים!״ גם בסוף? (זה גם מדד ב<a href=\"05-pilot-feedback.md\">טופס המשוב<\/a>).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>פרק 7 מול היועץ/ת והמשווק/ת:<\/strong> להראות בפגישה (<a href=\"07-advisor-meeting.md\">סדר היום<\/a>) את טבלת שלושת הקהלים, במיוחד את ״מילים שלא״.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>ניסוחים שיווקיים:<\/strong> לעבור על כל טקסט שיווקי (עמוד נחיתה, הצעת מחיר, ביו) ולוודא שכתוב ״מתרגל״ ולא ״משפר״, ושאין הבטחה טיפולית.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אחרי 5 מופעים:<\/strong> לעדכן את פרקים 5, 6 ו־9 לפי מה שקרה באמת (שאלות חדשות של ילדים, משפטים שעבדו).<\/li>\n<\/ul>"}, "docs/15-costume-and-logo.md": {"title": "תלבושת, לוגו ושם: הזהות החזותית של קים משחקים", "html": "<h1>תלבושת, לוגו ושם: הזהות החזותית של קים משחקים<\/h1>\n<blockquote>\n<p><strong>בשביל מה הקובץ הזה:<\/strong> כל מה שצריך כדי שקים <strong>תיראה<\/strong> אותו דבר בכל מקום: מפרט התלבושת, רשימת קניות, תלבושת גיבוי וכביסה, צבעי המותג, בריף מוכן למעצב/ת לוגו, דרך זולה לעשות לוגו זמני לבד, ובדיקת זמינות של השם, שמות המשתמש והדומיין.<\/p>\n<p><strong>הבסיס:<\/strong> פרק 3 ב<a href=\"01-concept.md\">מסמך הקונספט<\/a> (שפה חזותית ותלבושת). האופי, הקול ותנועת היד נמצאים ב<a href=\"14-character-bible.md\">ספר הדמות<\/a>.<\/p>\n<p><strong>החוק של הקונספט (פרק 8):<\/strong> מתחילים במיתוג בסיסי, אביזרי תלבושת, תוכן ופיילוט. <strong>לא<\/strong> תופרים תלבושת יקרה, לא מזמינים מרצ׳נדייז ולא בונים אתר מורכב לפני שהביקוש הוכח.<\/p>\n<p><strong>על המחירים בקובץ:<\/strong> כל מחיר כאן מסומן <strong>״הערכה״<\/strong>. זו הערכה גסה שלי, ולא מחיר שבדקתי בחנות. לפני קנייה משווים מחירים באתרי החנויות ובחיפוש של שם המוצר בגוגל (לנעליים אפשר גם ב־<a href=\"https://www.zap.co.il\">zap.co.il<\/a>), ורושמים את מה ששילמת באמת ב<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>.<\/p>\n<\/blockquote>\n<hr />\n<h2>תוכן עניינים<\/h2>\n<ol start=\"0\">\n<li>הדרך מא׳ עד ת׳: סדר הפעולות<\/li>\n<li>צבעי המותג<\/li>\n<li>הגופן<\/li>\n<li>התלבושת: המפרט<\/li>\n<li>רשימת קניות ואיפה לחפש<\/li>\n<li>תלבושת גיבוי וערכת חירום<\/li>\n<li>כביסה, טיפול ואחסון<\/li>\n<li>הלוגו: דרישות, בריף למעצב/ת, מסלול DIY, בחירה וזכויות<\/li>\n<li>שם, שמות משתמש ודומיין<\/li>\n<li>איפה המותג מופיע: יישום<\/li>\n<li>עמוד הנחיתה: מה להחליף, ואיך מעלים לאוויר<\/li>\n<li>מקורות ודברים לבדוק<\/li>\n<\/ol>\n<hr />\n<h2>0. הדרך מא׳ עד ת׳: סדר הפעולות<\/h2>\n<h3>שלב א׳: השבוע (שבוע 1, ״גיבוש״)<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>1. בדיקת שם ושמות משתמש<\/strong> (פרק 8.2). <em>כשעה.<\/em><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>2. בחירת איות לועזי אחד<\/strong> (פרק 8.1). <em>יום אחד: שואלים 5 הורים.<\/em><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>3. פתיחה ושריון של החשבונות החינמיים באותו יום<\/strong> (פרק 8.3): Instagram, TikTok, YouTube, עמוד פייסבוק ו־Gmail. מפרסמים רק בשבוע 2, אבל שומרים את השם כבר עכשיו. <strong>הדומיין רק נבדק שהוא פנוי. קונים אותו אחרי פגישת המיקוד.<\/strong> <em>כשעתיים.<\/em><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>4. ״קניות בארון״:<\/strong> אוספים מה שכבר יש לך (פרק 4.1). <em>חצי שעה.<\/em><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>5. קונים רק את מה שחסר לתלבושת הפיילוט<\/strong> (פרק 4.2).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>6. מבחנים א׳–ג׳: תנועה, שקיפות ומצלמה<\/strong> (פרק 3.4). <em>30 דקות.<\/em> <strong>מבחן ד׳ (נוחות)<\/strong> עושים בחזרה המלאה הראשונה של המופע.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>7. לוגו זמני לבד<\/strong> (פרק 7.5). <em>2–3 שעות.<\/em><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>8. ״תמונת ייחוס״ של התלבושת:<\/strong> מלפנים, מהצד ומאחור (פרק 6.4). <em>5 דקות.<\/em><\/li>\n<\/ul>\n<h3>שלב ב׳: אחרי הפיילוט (שבוע 4 ואילך)<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>9. סט תלבושת שני וערכת חירום<\/strong> (פרק 5).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>10. החלטה על תקציב ללוגו<\/strong> ב<a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a>, ואז שליחת הבריף למעצב/ת (פרק 7.3).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>11. קניית הדומיין<\/strong> אחרי שהשם נסגר בפגישת המיקוד (פרק 8.3, ו־6.6 ב<a href=\"13-legal-admin.md\">מסמך הרישוי והמנהלה<\/a>).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>12. הסכם והעברת זכויות בכתב, וקבלת כל הקבצים<\/strong> (פרק 7.7).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>13. בדיקת סימן מסחר<\/strong> לפני שמשקיעים בהדפסות. הפירוט ב<a href=\"13-legal-admin.md\">מסמך הרישוי והמנהלה<\/a>.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>14. יישום:<\/strong> תמונת פרופיל, כרטיס סיום, מדבקות, עמוד נחיתה (פרקים 9–10).<\/li>\n<\/ul>\n<h3>שלב ג׳: רק אחרי שהביקוש הוכח (ובהחלטה משותפת עם היועץ/ת)<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>15. תלבושת בתפירה אישית<\/strong> (פרק 4.4).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>16. מוצרים ממותגים<\/strong> (מעבר למדבקות). <strong>לא עכשיו.<\/strong><\/li>\n<\/ul>\n<hr />\n<h2>1. צבעי המותג<\/h2>\n<table>\n<thead>\n<tr>\n<th>שם<\/th>\n<th>HEX<\/th>\n<th>RGB<\/th>\n<th>למה משמש<\/th>\n<th>לא להשתמש ל...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>צהוב שמש<\/strong><\/td>\n<td><code>#FFC928<\/code><\/td>\n<td>255, 201, 40<\/td>\n<td>צבע ראשי: רקעים, התלבושת, הדגשות<\/td>\n<td><strong>טקסט על לבן<\/strong> (ניגודיות 1.5:1, לא קריא)<\/td>\n<\/tr>\n<tr>\n<td><strong>כתום אנרגיה<\/strong><\/td>\n<td><code>#FF7A1A<\/code><\/td>\n<td>255, 122, 26<\/td>\n<td>אקסנטים, כפתורים עם טקסט כהה, החצאית<\/td>\n<td><strong>טקסט קטן על לבן<\/strong> ו<strong>טקסט לבן על כתום<\/strong> (2.6:1, לא עובר)<\/td>\n<\/tr>\n<tr>\n<td><strong>כתום עמוק<\/strong><\/td>\n<td><code>#B34700<\/code><\/td>\n<td>179, 71, 0<\/td>\n<td>טקסט וקישורים בכתום על לבן או שמנת<\/td>\n<td>רקעים גדולים (כבד מדי)<\/td>\n<\/tr>\n<tr>\n<td><strong>לבן<\/strong><\/td>\n<td><code>#FFFFFF<\/code><\/td>\n<td>255, 255, 255<\/td>\n<td>רקע, נעליים, גרביים, פסים<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>דיו<\/strong> (חום־שחור)<\/td>\n<td><code>#2B2118<\/code><\/td>\n<td>43, 33, 24<\/td>\n<td>כל הטקסט, רקע כהה לכפתורים ולתחתית העמוד<\/td>\n<td>— (רך יותר משחור מלא)<\/td>\n<\/tr>\n<tr>\n<td><strong>שמנת<\/strong><\/td>\n<td><code>#FFF6DC<\/code><\/td>\n<td>255, 246, 220<\/td>\n<td>רקע רך לאזורים מתחלפים<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>צירופים שאפשר לקרוא בהם טקסט (בדקתי לפי נוסחת הניגודיות של WCAG)<\/h3>\n<p>לפי <a href=\"https://www.w3.org/TR/WCAG21/#contrast-minimum\">WCAG<\/a>, טקסט רגיל צריך ניגודיות של <strong>4.5:1<\/strong> לפחות, וטקסט גדול <strong>3:1<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th>טקסט<\/th>\n<th>על רקע<\/th>\n<th>ניגודיות<\/th>\n<th>מותר?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>דיו <code>#2B2118<\/code><\/td>\n<td>לבן<\/td>\n<td>15.8:1<\/td>\n<td>✅<\/td>\n<\/tr>\n<tr>\n<td>דיו <code>#2B2118<\/code><\/td>\n<td>שמנת<\/td>\n<td>14.6:1<\/td>\n<td>✅<\/td>\n<\/tr>\n<tr>\n<td>דיו <code>#2B2118<\/code><\/td>\n<td>צהוב<\/td>\n<td>10.2:1<\/td>\n<td>✅ (הצירוף הכי ״קים״)<\/td>\n<\/tr>\n<tr>\n<td>דיו <code>#2B2118<\/code><\/td>\n<td>כתום<\/td>\n<td>6.0:1<\/td>\n<td>✅<\/td>\n<\/tr>\n<tr>\n<td>צהוב <code>#FFC928<\/code><\/td>\n<td>דיו<\/td>\n<td>10.2:1<\/td>\n<td>✅ (כפתורים)<\/td>\n<\/tr>\n<tr>\n<td>כתום עמוק <code>#B34700<\/code><\/td>\n<td>לבן<\/td>\n<td>5.5:1<\/td>\n<td>✅<\/td>\n<\/tr>\n<tr>\n<td>כתום עמוק <code>#B34700<\/code><\/td>\n<td>שמנת<\/td>\n<td>5.1:1<\/td>\n<td>✅<\/td>\n<\/tr>\n<tr>\n<td>לבן<\/td>\n<td>כתום <code>#FF7A1A<\/code><\/td>\n<td>2.6:1<\/td>\n<td>❌<\/td>\n<\/tr>\n<tr>\n<td>כתום <code>#FF7A1A<\/code><\/td>\n<td>לבן<\/td>\n<td>2.6:1<\/td>\n<td>❌<\/td>\n<\/tr>\n<tr>\n<td>צהוב <code>#FFC928<\/code><\/td>\n<td>לבן<\/td>\n<td>1.5:1<\/td>\n<td>❌<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>צבעים בהדפסה ובבד<\/h3>\n<ul>\n<li><strong>בהדפסה (מדבקות, כרזה):<\/strong> המרה מתמטית גסה ל־CMYK נותנת בערך: צהוב 0/21/84/0, כתום 0/52/90/0. <strong>זו הערכה בלבד.<\/strong> המעצב/ת או בית הדפוס יבחרו ערכי הדפסה (ואולי גוון Pantone) ויעשו <strong>הדפסת ניסיון<\/strong> לפני כמות. <strong>לבדוק<\/strong> מול בית הדפוס.<\/li>\n<li><strong>בבד:<\/strong> אי אפשר להתאים קוד HEX לבד. בוחרים בעין, באור יום: <strong>צהוב חמים של חמנייה, לא צהוב ניאון. כתום של מנדרינה, לא כתום זוהר.<\/strong> צבעי ניאון ״נשרפים״ במצלמת הטלפון ונראים כמו כתם בלי פרטים.<\/li>\n<\/ul>\n<hr />\n<h2>2. הגופן<\/h2>\n<p><strong>Rubik<\/strong> (מ־Google Fonts). הוא כולל עברית, והוא כבר בשימוש ב<a href=\"../site/index.html\">עמוד הנחיתה<\/a>.<\/p>\n<ul>\n<li><strong>רישיון:<\/strong> Rubik מופץ ברישיון SIL Open Font License (<a href=\"https://www.fontsquirrel.com/license/rubik\">Font Squirrel<\/a>). לפי <a href=\"https://developers.google.com/fonts/faq\">השאלות הנפוצות של Google Fonts<\/a> מותר להשתמש בגופנים שלהם גם בלוגו וגם לשימוש מסחרי. <strong>לבדוק<\/strong> שהנוסח לא השתנה כשמגיעים לרישום סימן מסחר.<\/li>\n<li><strong>משקלים:<\/strong> 800 לשם ולכותרות, 600 לכותרות משנה, 400 לטקסט רגיל.<\/li>\n<li><strong>בכתוביות לסרטונים:<\/strong> Rubik, אם האפליקציה מציעה אותו. אם לא, גופן שתומך בעברית (פרק 10 ב<a href=\"09-filming-guide.md\">מדריך הצילום<\/a>).<\/li>\n<li><strong>בלוגו הסופי<\/strong> המעצב/ת יכול/ה לצייר את המילים ״קים משחקים״ בצורה מיוחדת. Rubik נשאר גופן הטקסט של כל השאר.<\/li>\n<\/ul>\n<hr />\n<h2>3. התלבושת: המפרט<\/h2>\n<h3>3.1 מה הקונספט קבע<\/h3>\n<p>צבעים: <strong>צהוב, כתום ולבן<\/strong>. <strong>בגד גוף קצר וצמוד<\/strong>, מוסתר מתחת ל<strong>חצאית מעודדות גבוהה עם קפלים<\/strong>. <strong>טייץ קצר וצמוד<\/strong> מתחת לחצאית, לצניעות ולתנועה חופשית. <strong>סניקרס לבנות<\/strong> עם נגיעות צהוב או כתום, <strong>גרביים ספורטיביות<\/strong>, ו<strong>קוקו גבוה עם סרט<\/strong>.<\/p>\n<h3>3.2 פריט אחרי פריט<\/h3>\n<table>\n<thead>\n<tr>\n<th>פריט<\/th>\n<th>צבע מומלץ<\/th>\n<th>גזרה ובד<\/th>\n<th>למה ככה<\/th>\n<th>איך בודקים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>בגד גוף<\/strong><\/td>\n<td>צהוב שמש<\/td>\n<td>שרוול קצר, צווארון עגול ולא עמוק. בד ספורט נמתח (לייקרה), <strong>אטום ומט<\/strong>. עדיף עם <strong>סגירת לחצניות למטה<\/strong><\/td>\n<td>בגד גוף לא ״יוצא״ מהחצאית כשמרימים ידיים ב־V או קופצים, כמו שקורה לחולצה. לחצניות הופכות שירותים בהפסקה לפשוטים<\/td>\n<td>ידיים למעלה ב־V: לא רואים בטן. מבחן שקיפות (פרק 3.4)<\/td>\n<\/tr>\n<tr>\n<td><strong>חצאית מעודדות<\/strong><\/td>\n<td>כתום (אפשר עם פס לבן בתחתית)<\/td>\n<td><strong>גבוהה<\/strong>, יושבת על המותניים. קפלים תפורים (קבועים). גומי רחב או רוכסן עם סגירה בטוחה. אורך: באמצע הירך, לא קצרה יותר<\/td>\n<td>ה״לוק״ של מעודדת, ספורטיבי ושמח. קפלים קבועים שומרים על הצורה גם אחרי כביסה<\/td>\n<td>סיבוב, קפיצה, ישיבה ברגליים משוכלות<\/td>\n<\/tr>\n<tr>\n<td><strong>טייץ קצר<\/strong> (״טייץ רכיבה״)<\/td>\n<td>כתום, כמו החצאית, או צהוב<\/td>\n<td>גבוה במותניים, <strong>צמוד, אטום<\/strong>, באורך שלא מציץ מתחת לחצאית בעמידה<\/td>\n<td>צניעות ותנועה חופשית. <strong>לא לבן:<\/strong> טייץ לבן נהיה שקוף כשהוא נמתח, ומתלכלך מהרצפה<\/td>\n<td>כפיפה מול מראה, ישיבה על הרצפה<\/td>\n<\/tr>\n<tr>\n<td><strong>סניקרס<\/strong><\/td>\n<td>לבנות, עם <strong>שרוכים בצהוב או בכתום<\/strong><\/td>\n<td>סוליית גומי <strong>שלא מחליקה<\/strong>, ריפוד טוב (קפיצות על בלטות), קלות. בלי אורות ובלי צלילים<\/td>\n<td>השרוכים הצבעוניים הם הדרך הכי זולה להוסיף את ״הנגיעות״ שהקונספט ביקש<\/td>\n<td>20 קפיצות על בלטות ותנועה לצדדים<\/td>\n<\/tr>\n<tr>\n<td><strong>גרביים<\/strong><\/td>\n<td>לבנות עם פס כתום או צהוב, או לבנות חלקות<\/td>\n<td>גרבי ספורט מעל הקרסול, בד שסופג זיעה<\/td>\n<td>משלימות את הלוק הספורטיבי<\/td>\n<td>שעה של חזרה: בלי שפשופים<\/td>\n<\/tr>\n<tr>\n<td><strong>קוקו גבוה וסרט<\/strong><\/td>\n<td>סרט כתום או צהוב, בצבע <strong>שונה<\/strong> מהבגד שהוא קרוב אליו<\/td>\n<td>גומייה חזקה, ועליה <strong>סרט רחב שרואים מרחוק<\/strong> (סרט גרוגרן לא מתפרם). <strong>עדיף פפיון מוכן על גומייה, בלי סיכות.<\/strong> אם בכל זאת צריך סיכות: סופרים כמה נכנסו לשיער, בודקים שכולן יצאו, וסורקים את הרצפה אחרי המופע (ילדים קטנים יושבים על הרצפה ומכניסים דברים לפה)<\/td>\n<td>הקוקו ״קופץ״ כשקים קופצת. זה חלק מהתנועה ומהזיהוי<\/td>\n<td>20 קפיצות ו״קים משתגעת״: הסרט נשאר במקום, ושום דבר לא נפל על הרצפה<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>3.3 שתי אפשרויות לחלוקת הצבעים<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>אפשרות א׳ (מומלצת)<\/strong><\/th>\n<th><strong>אפשרות ב׳<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>בגד גוף<\/td>\n<td>צהוב<\/td>\n<td>כתום<\/td>\n<\/tr>\n<tr>\n<td>חצאית<\/td>\n<td>כתומה, עם פס לבן בתחתית (לא חובה)<\/td>\n<td>צהובה, עם פס כתום או לבן<\/td>\n<\/tr>\n<tr>\n<td>טייץ<\/td>\n<td>כתום<\/td>\n<td>צהוב<\/td>\n<\/tr>\n<tr>\n<td>סרט<\/td>\n<td>כתום או לבן<\/td>\n<td>צהוב<\/td>\n<\/tr>\n<tr>\n<td>נעליים<\/td>\n<td>לבנות עם שרוכים צהובים<\/td>\n<td>לבנות עם שרוכים כתומים<\/td>\n<\/tr>\n<tr>\n<td>גרביים<\/td>\n<td>לבנות עם פס כתום<\/td>\n<td>לבנות עם פס צהוב<\/td>\n<\/tr>\n<tr>\n<td><strong>למה<\/strong><\/td>\n<td>צהוב ליד הפנים נותן תחושה של ״שמש״ ופנים מוארות במצלמה<\/td>\n<td>אם הצהוב ״נשרף״ במצלמה שלך, הכתום ליד הפנים יציב יותר<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>איך מחליטים:<\/strong> במבחן המצלמה (פרק 3.4). אם אפשר, צלמי 15 שניות בכל אחת מהאפשרויות באותו מקום ובאותו אור, ותבחרי לפי המסך. לא לפי המראה.<\/p>\n<h3>3.4 ארבעה מבחנים (לפני שמורידים תוויות, ושוב לפני כל פיילוט)<\/h3>\n<p><strong>א. מבחן התנועה: 12 תנועות מהמופע, בתלבושת מלאה<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> 10 קפיצות במקום<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ידיים למעלה ב־V (לא רואים בטן, הבגד לא זז)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> סקוואט עמוק, ״נמסים״<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ישיבה ברגליים משוכלות על הרצפה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> קימה מהרצפה בלי ידיים (או עם)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> סיבוב אחד לאט<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> צעד גדול קדימה (לאנג׳)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ״פסל״ מצחיק על רגל אחת<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ריצה במקום, 30 שניות<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> כפיפה לגובה העיניים של ילד/ה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ״הרגל רוקדת בלט״ מ״קים משתגעת״ (בעיטה באוויר, לא לכיוון הקהל)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ״טה־דה!״ עם רגל קדימה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>בסוף:<\/strong> 20 קפיצות ברצף, ואז מסתכלים על הרצפה. <strong>שום דבר לא נפל<\/strong> (סיכה, גומייה, כפתור, נצנץ)<\/li>\n<\/ul>\n<p><strong>ב. מבחן שקיפות:<\/strong> מצלמים את עצמך מאחור, <strong>עם פלאש<\/strong>, בזמן כפיפה. <strong>הפלאש חושף שקיפות שהעין לא רואה במראה.<\/strong> אם רואים דרך הבד, מחליפים פריט או מוסיפים שכבה.<\/p>\n<p><strong>ג. מבחן המצלמה:<\/strong> 15 שניות של צילום במקום שבו תצלמי סרטונים (<a href=\"09-filming-guide.md\">מדריך הצילום<\/a>, פרק 3):<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> הצהוב לא ״נשרף״ (רואים קפלים ותפרים, לא כתם אחיד)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> התלבושת בולטת מהרקע (רקע צהוב או כתום יבליע אותה)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> אין פסים צפופים או הדפס קטן ש״מהבהב״ במסך<\/li>\n<\/ul>\n<p><strong>ד. מבחן נוחות:<\/strong> חזרה מלאה של המופע (<a href=\"02-show-script.md\">תסריט<\/a>) בתלבושת, שעה שלמה. עושים אותו בחזרה המלאה הראשונה (פרק 12 בתסריט), לא באותו יום עם מבחנים א׳–ג׳.<\/p>\n<p><strong>ציון עובר:<\/strong> הכל נשאר במקום, אין שקיפות, ולא היית צריכה לסדר כלום באמצע. <strong>פריט שסידרת יותר מפעמיים בחזרה, מחליפים או מתקנים.<\/strong><\/p>\n<h3>3.5 כללים לכל התלבושת<\/h3>\n<ul>\n<li><strong>מט, לא מבריק.<\/strong> בד מבריק מחזיר אור ונראה ״שרוף״ במצלמה.<\/li>\n<li><strong>צבע מלא<\/strong>, בלי הדפסים קטנים ובלי פסים צפופים.<\/li>\n<li><strong>בלי תכשיטים:<\/strong> לא טבעות, צמידים, שרשראות או עגילים תלויים. ילדים תופסים, ותכשיט יכול לשרוט. עגילים צמודים וקטנים בלבד.<\/li>\n<li><strong>ציפורניים קצרות.<\/strong><\/li>\n<li><strong>איפור קל שעמיד בזיעה.<\/strong> בלי נצנצים שנושרים על הילדים ועל הרצפה.<\/li>\n<li><strong>מתחת:<\/strong> חזיית ספורט תומכת בצבע ניטרלי, שלא נראית דרך הבד.<\/li>\n<li><strong>בחוץ:<\/strong> קרם הגנה. ובכל מקרה, מופע בחוץ רק בצל מלא (פרק 7, ״בחוץ, בחום״, ב<a href=\"02-show-script.md\">תסריט<\/a>).<\/li>\n<\/ul>\n<h3>3.6 התאמה לפי מקום<\/h3>\n<ul>\n<li><strong>מסגרות עם הנחיות לבוש<\/strong> (למשל גנים ממלכתיים־דתיים או חרדיים, או מסגרות שמבקשות לבוש צנוע): <strong>שואלים בשיחת ההזמנה:<\/strong> ״יש הנחיות לבוש למי שמופיע אצלכם?״. לא מנחשים. גרסה אפשרית: טייץ ארוך או 3/4 בצבע המותג, וחולצה צהובה עם שרוול מתחת לבגד הגוף או במקומו. הצבעים, הסרט והנעליים נשארים, וזאת עדיין קים. הפירוט בשיחת ההזמנה ב<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>.<\/li>\n<li><strong>אולם קר בחורף:<\/strong> חולצה צהובה דקה עם שרוול ארוך מתחת לבגד הגוף, וטייץ ארוך.<\/li>\n<li><strong>חום:<\/strong> בד דק ונושם, הפסקות שתייה לפי התסריט.<\/li>\n<\/ul>\n<h3>3.7 הגעה והחלפה<\/h3>\n<ul>\n<li><strong>מגיעים עם שכבה מעל התלבושת<\/strong> (קפוצ׳ון או ז׳קט עם רוכסן ומכנסיים רחבים). הילדים פוגשים את קים רק בכניסה, ואת לא מסתובבת בתלבושת ברחוב (פרטיות, וגם ה״קסם״).<\/li>\n<li><strong>מחליפים רק במקום סגור ופרטי למבוגרים<\/strong>, אף פעם לא בחלל שיש בו ילדים. שואלים על זה מראש.<\/li>\n<li><strong>את הסרט שמים ברגע האחרון<\/strong>, באוטו או במקום.<\/li>\n<li><strong>אחרי היציאה:<\/strong> השכבה העליונה חוזרת לפני שהולכים לאוטו.<\/li>\n<\/ul>\n<hr />\n<h2>4. רשימת קניות ואיפה לחפש<\/h2>\n<h3>4.1 קודם כל: ״קניות בארון״<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> בגד גוף או חולצה צמודה בצהוב או כתום<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> חצאית קפלים (גם חצאית טניס)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> טייץ קצר בצבע מתאים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> סניקרס לבנות במצב טוב<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> גרבי ספורט לבנות<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> סרט או פפיון לשיער, גומיות, סיכות<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> חזיית ספורט ניטרלית<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> קפוצ׳ון או ז׳קט לכיסוי<\/li>\n<\/ul>\n<p><strong>כל מה שסימנת, לא קונים.<\/strong> עוברים עם הפריטים את המבחנים בפרק 3.4, וקונים רק את מה שחסר או נכשל.<\/p>\n<h3>4.2 שלב א׳: תלבושת פיילוט<\/h3>\n<table>\n<thead>\n<tr>\n<th>פריט<\/th>\n<th>כמות<\/th>\n<th>איפה לחפש<\/th>\n<th>הערכת מחיר (₪, <strong>הערכה<\/strong>)<\/th>\n<th>טיפ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>בגד גוף צהוב עם שרוול קצר<\/td>\n<td>1<\/td>\n<td>חנויות ציוד לריקוד והתעמלות, רשתות אופנה (מחלקת ״בגדי גוף״), אונליין<\/td>\n<td>50–200<\/td>\n<td>בגדי גוף של רשתות אופנה לפעמים דקים: מבחן שקיפות<\/td>\n<\/tr>\n<tr>\n<td>חצאית קפלים כתומה<\/td>\n<td>1<\/td>\n<td>רשתות ספורט (״חצאית טניס״), חנויות ריקוד, אונליין (״pleated cheer skirt״ / ״tennis skirt״), חנויות תחפושות<\/td>\n<td>40–200<\/td>\n<td><strong>חצאית טניס עם מכנסון מובנה<\/strong> (״סקורט״) מתאימה רק אם המכנסו
