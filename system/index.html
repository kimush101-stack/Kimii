ם לא ״מוסד״. לא מצאתי חובה חוקית שהורה יבקש ממך אישור<\/td>\n<td>האמון נבנה מהמלצות, מביטוח, ומכללי ההתנהגות שלך (5.5)<\/td>\n<\/tr>\n<tr>\n<td><strong>בעתיד: את מעסיקה עוזר/ת<\/strong><\/td>\n<td>ייתכן שהעסק שלך עצמו ייחשב ״מוסד״ (״שירותי בידור לקטינים״), ואז <strong>את<\/strong> תצטרכי לבקש אישור לגבי העוזר/ת<\/td>\n<td><strong>לבדוק עם עו״ד לפני<\/strong> שמגייסים מישהו/י<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>כשמוסד מבקש אישור שהחוק אולי לא מחייב:<\/strong> <strong>לא מתווכחים<\/strong> ולא אומרים ״החוק לא חל עליי״. אומרים: ״בשמחה, אבדוק איך מגישים ואחזור אלייך היום.״ ואז בודקים בדף השירות או במוקד הממשלתי <strong>1299<\/strong> אם אפשר להוציא אישור בשבילך. אם אי אפשר, מעבירים למוסד את התשובה הרשמית שקיבלת.<\/p>\n<h3>5.3 צעד אחר צעד: אישור עבירות מין<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>1. כשמוסד מזמין, לשאול בכתב<\/strong> (אפשר להעתיק): ״לקראת המופע, אילו אישורים אתם צריכים ממני? אישור משטרה לפי החוק למניעת העסקה של עברייני מין? אישור לפי החוק על עבירות אלימות? אם כן, אשמח לקבל מכם את תעודת המוסד או הפרטים שצריך למלא.״<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>2. לקבל מהמוסד את ״תעודת המוסד״.<\/strong> לפי <a href=\"https://he.wikisource.org/wiki/תקנות_למניעת_העסקה_של_עברייני_מין_במוסד_המכוון_למתן_שירות_לקטינים_%28אישור_המשטרה%29\">התקנות (אישור המשטרה), התשס״ג־2003<\/a> ו<a href=\"https://www.gov.il/BlobFolder/servicequestionnaire/application-for-police-approval/he/police-approval-1.pdf\">הטופס שמופיע בדף השירות<\/a>, לבקשה מצרפים: <strong>בקשת הבגיר/ה<\/strong> (טופס 1), <strong>תעודת מוסד<\/strong> (טופס 2, שהמוסד ממלא) ו<strong>צילום תעודת זהות<\/strong>. אפשר להגיש בעצמך או דרך מיופה/ת כוח<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>3. להגיש.<\/strong> יש שירות מקוון ב־gov.il: <a href=\"https://www.gov.il/he/service/application-for-police-approval\">בקשה לקבלת אישור העסקה מהמשטרה<\/a>. לפי מדריכים לא רשמיים (למשל של ארגונים שמעסיקים צוות חינוכי), מתחברים דרך <strong>מערכת ההזדהות הלאומית<\/strong>, והתשובה מופיעה ב<strong>אזור האישי<\/strong>. <strong>לבדוק בדף השירות<\/strong> את הדרך המעודכנת. אם יש בעיה: מגישים בתחנת משטרה, או מתקשרים ל־<strong>1299<\/strong> (המוקד הממשלתי)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>4. לתכנן זמן:<\/strong> לפי התקנות מ־2003, המשטרה משיבה <strong>עד 21 יום<\/strong> מההגשה. <strong>מגישים לפחות 3–4 שבועות לפני ההופעה<\/strong> (<strong>לבדוק<\/strong> שזה עדיין המצב)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>5. תוקף:<\/strong> לפי סיכומים משפטיים שמצאתי, אישור נחשב תקף כשניתן <strong>בשנה שקדמה<\/strong> להגשתו למוסד. <strong>לבדוק<\/strong>, ולהגדיר תזכורת ביומן אחרי 11 חודשים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>6. עלות:<\/strong> <strong>לבדוק<\/strong> בדף השירות<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>7. לשמור עותק<\/strong> בתיקייה <code>03<\/code>. זה מסמך אישי: שולחים <strong>רק<\/strong> למוסד שצריך אותו, ולא מפרסמים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>8. רק כשיש אישור ביד:<\/strong> לעדכן את <a href=\"06-show-offer.md\">הצעת המופע<\/a> ואת התשובות ב<a href=\"10-outreach-templates.md\">תבניות הפנייה<\/a><\/li>\n<\/ul>\n<h3>5.4 צעד אחר צעד: אישור עבירות אלימות<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>1.<\/strong> לשאול את המוסד (באותה הודעה מ־5.3, צעד 1) אם הוא צריך את האישור הזה, ולבקש ממנו את הטופס או את הפרטים שלו<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>2.<\/strong> להיכנס ל<a href=\"https://www.gov.il/he/service/employment-approval-from-the-police\">דף השירות<\/a>. לפי מה שמופיע בו (בתקציר החיפוש שבדקתי), ההגשה נעשית אחרי <strong>הזדהות במערכת ההזדהות הלאומית<\/strong>; הגשה מקוונת זמינה ל<strong>מעסיקים עם יותר מ־50 עובדים<\/strong>; ובהגשה הראשונה מגיעים עם המסמכים ל<strong>תחנת משטרה<\/strong> לזיהוי וחתימה. <strong>לבדוק<\/strong> בדף מה חל במקרה שלך (את עצמאית, והמוסד הוא ״המעסיק״)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>3.<\/strong> טופס הבקשה של המעסיק/המוסד: <a href=\"https://www.gov.il/blobFolder/service/employment-approval-from-the-police/he/Employer-or-institution-request.pdf\">gov.il — טופס בקשה של מעסיק או מוסד<\/a>. <strong>לבדוק<\/strong> מי ממלא מה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>4.<\/strong> זמנים, תוקף ועלות: <strong>לבדוק<\/strong> בדף השירות. עד שבדקת, מתכננים כמו באישור הראשון: <strong>3–4 שבועות מראש<\/strong><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>5.<\/strong> לשמור בתיקייה <code>03<\/code>, ולעדכן את טבלת המצב (פרק 14)<\/li>\n<\/ul>\n<h3>5.5 מעבר לאישור: כללי התנהגות שמגנים על הילדים ועלייך<\/h3>\n<p>האישור הוא דף. מה שבאמת שומר על ילדים (ועלייך מפני אי־הבנות) הוא איך שאת עובדת:<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אף פעם לא לבד עם ילד/ה<\/strong> בחדר סגור. מבוגר/ת מהמקום נמצא/ת בחדר <strong>לאורך כל המופע<\/strong> (כבר כתוב ב<a href=\"06-show-offer.md\">הצעת המופע<\/a>)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>שירותים, החלפת בגדים, ניגוב אף:<\/strong> רק הצוות או ההורים, לא את<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מגע:<\/strong> כף ביד, ״כיף״, אחיזת ידיים במעגל. <strong>לא<\/strong> הרמה, <strong>לא<\/strong> ילדים על הברכיים, <strong>לא<\/strong> חיבוקים יזומים. ילד/ה שרץ/ה לחבק: מחזירים בעדינות ל״כיף״<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אין קשר ישיר עם ילדים<\/strong> בטלפון או ברשתות. לא נותנים לילדים מספר טלפון. מדברים רק עם הורים וצוות (ראי גם <a href=\"14-character-bible.md\">תנ״ך הדמות<\/a>)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>צילום:<\/strong> רק לפי <a href=\"08-consent-template.md\">טופס אישור הצילום<\/a><\/li>\n<\/ul>\n<p><strong>אם ילד/ה מספר/ת לך משהו מדאיג:<\/strong> מקשיבים בשקט, <strong>לא חוקרים<\/strong> ולא שואלים שאלות מכוונות, <strong>לא מבטיחים לשמור בסוד<\/strong>, וכותבים אחר כך בדיוק את המילים שלו/ה. לפי <a href=\"https://www.kolzchut.org.il/he/דיווח_על_התעללות_בקטינים\">כל זכות — דיווח על התעללות בקטינים<\/a>, יש בחוק <strong>חובת דיווח<\/strong> לפקיד/ת סעד או למשטרה כשיש יסוד סביר לחשוב שקטין נפגע מהאחראי עליו, ואי־דיווח הוא עבירה. אם לא ברור לך מה לעשות: מתייעצים מיד עם פקיד/ת הסעד ברשות המקומית או עם המשטרה (<strong>לבדוק<\/strong> מראש את מספר הטלפון של מחלקת הרווחה באזור שלך).<\/p>\n<hr />\n<h2>פרק 6 — שם, סימן מסחר, דומיין וזכויות יוצרים<\/h2>\n<h3>6.1 חיפוש חינם במאגר סימני המסחר (שבוע 1, 30 דקות)<\/h3>\n<p><strong>למה עכשיו:<\/strong> לפי <a href=\"01-concept.md\">מסמך הקונספט<\/a>, בודקים זמינות שם ודמיון למותגים <strong>לפני השקעה משמעותית<\/strong>. החיפוש עצמו בחינם.<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>1.<\/strong> להיכנס ל<a href=\"https://www.gov.il/he/service/search_israeli_trademarks_database\">חיפוש במאגר סימני המסחר הישראלי<\/a><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>2.<\/strong> לחפש כל אחד מהמונחים: <code>קים משחקים<\/code>, <code>קים<\/code>, <code>כולם משחקים<\/code>, <code>Kim<\/code>, ותעתיקים באנגלית שאת שוקלת לשם המשתמש<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>3.<\/strong> לשים לב במיוחד לסימנים ב<strong>סוג 41<\/strong> (בידור, חינוך, פעילות תרבות) ולסימנים <strong>דומים בצליל או במראה<\/strong>, לא רק זהים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>4.<\/strong> לצלם מסך של כל חיפוש (עם תאריך) לתיקייה <code>04<\/code>, ולמלא את הטבלה:<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>מונח חיפוש<\/th>\n<th>סוג<\/th>\n<th>נמצא סימן דומה?<\/th>\n<th>מה מצאתי (בעלים, סטטוס)<\/th>\n<th>תאריך<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>קים משחקים<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>כולם משחקים<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>5.<\/strong> במקביל: חיפוש ב־Google וברשתות (השורות המתאימות בצ׳קליסט ב<a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a>)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>6. אם מצאת מותג ילדים עם שם דומה:<\/strong> עוצרים לפני לוגו והדפסות, ומתייעצים עם עו״ד או עורך/ת פטנטים<\/li>\n<\/ul>\n<blockquote>\n<p><strong>החיפוש שלך הוא לא חוות דעת משפטית.<\/strong> הוא מסנן מוקדם. לפני רישום או השקעה גדולה, בדיקה מקצועית.<\/p>\n<\/blockquote>\n<h3>6.2 מה זה ״סוג״ (סיווג ניס)<\/h3>\n<p>סימן מסחר נרשם לפי <strong>סוגים<\/strong> של מוצרים ושירותים, לפי <a href=\"https://www.wipo.int/classifications/nice/en/\">סיווג ניס הבינלאומי (WIPO)<\/a>. משלמים אגרה <strong>לכל סוג<\/strong>. הסוגים שרלוונטיים אלייך, לפי סדר העדיפות בקונספט:<\/p>\n<table>\n<thead>\n<tr>\n<th>סוג<\/th>\n<th>מה כולל (בקצרה)<\/th>\n<th>מתי<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>41<\/strong><\/td>\n<td>בידור, הופעות, חינוך, פעילויות תרבות וספורט<\/td>\n<td><strong>הסוג המרכזי.<\/strong> הראשון לשקול<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>תוכן מוקלט והורדות (סרטונים, שירים להורדה)<\/td>\n<td>כשיש תוכן שנמכר/מופץ<\/td>\n<\/tr>\n<tr>\n<td>16<\/td>\n<td>מוצרי דפוס (חוברות, מדבקות)<\/td>\n<td>עם מרצ׳נדייז<\/td>\n<\/tr>\n<tr>\n<td>25<\/td>\n<td>ביגוד<\/td>\n<td>עם מרצ׳נדייז<\/td>\n<\/tr>\n<tr>\n<td>28<\/td>\n<td>צעצועים ומשחקים<\/td>\n<td>עם מרצ׳נדייז<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>לבדוק<\/strong> עם איש מקצוע אילו סוגים ובאיזה ניסוח מדויק של השירותים.<\/p>\n<h3>6.3 מתי לרשום<\/h3>\n<p>לפי סדר ההשקעות ב<a href=\"01-concept.md\">מסמך הקונספט<\/a>: <strong>אחרי<\/strong> שהפיילוט מאשר שהשם עובד, ו<strong>לפני<\/strong> הדפסות גדולות, מרצ׳נדייז או קידום ממומן רציני. ההחלטה בפגישת המיקוד (<a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a>).<\/p>\n<p><strong>השיקול:<\/strong> מי שמגיש/ה ראשון/ה בדרך כלל מקבל/ת עדיפות. ככל שמחכים, יש סיכון קטן שמישהו אחר יגיש שם דומה. מצד שני, אגרה על שם שעוד לא הוכח היא כסף שאולי ילך לפח. <strong>לדון עם היועץ.<\/strong><\/p>\n<h3>6.4 איך מגישים<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>1. להחליט מה רושמים:<\/strong> <strong>סימן מילולי<\/strong> (השם ״קים משחקים״, בלי עיצוב) נותן בדרך כלל הגנה רחבה יותר מלוגו. את הלוגו אפשר לרשום בנפרד, <strong>אחרי<\/strong> שהוא סופי. הסלוגן ״עם קים — כולם משחקים!״ הוא בקשה נפרדת. <strong>לבדוק<\/strong> עם איש מקצוע מה כדאי<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>2. לבד או עם איש מקצוע:<\/strong> אפשר להגיש לבד, דרך <a href=\"https://www.gov.il/he/service/trademark_registration\">שירות הגשת בקשה לרישום סימן מסחר ב־gov.il<\/a>. עורך/ת פטנטים או עו״ד יבדקו לפני ההגשה סיכוי ודמיון לסימנים קיימים. <strong>לבקש הצעת מחיר<\/strong>, ולהשוות<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>3. אגרה:<\/strong> לפי התוספת הראשונה ל<a href=\"https://he.wikisource.org/wiki/תקנות_סימני_המסחר\">תקנות סימני המסחר<\/a> (בנוסח המעודכן ל־2026), אגרת בקשה בסוג אחד היא <strong>1,904 ₪<\/strong>, ו<strong>1,432 ₪<\/strong> לכל סוג נוסף באותה בקשה. האגרות עלו בינואר 2026 (<a href=\"https://aviveilon.law/מאמרים/אגרות-הפטנטים-מתייקרות-בינואר/\">אביב אילון — עליית אגרות רשות הפטנטים בינואר 2026<\/a>). <strong>לבדוק<\/strong> בדף השירות לפני התשלום. לפי דף השירות, תשלום מקוון ישיר אפשרי רק למי שמגיש/ה <strong>בעצמו/ה, בלי מיופה כוח<\/strong>. שכר טרחה של עו״ד או עורך/ת פטנטים: <strong>בנוסף<\/strong>, לפי הצעת מחיר<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>4. לוגו:<\/strong> אם מגישים סימן מעוצב, מכינים קובץ <strong>JPEG<\/strong> מראש (לפי דף השירות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>5. שאלות:<\/strong> לפי דף השירות, למחלקת סימני מסחר ברשות הפטנטים יש מוקד טלפוני, 073-3927290, בימים א׳–ה׳ 8:30–13:30. <strong>לבדוק<\/strong> שהמספר והשעות עדכניים<\/li>\n<\/ul>\n<h3>6.5 אחרי ההגשה<\/h3>\n<p>השלבים בגדול: בדיקה של הבוחן/ת, קיבול, פרסום, תקופה שבה אחרים יכולים להגיש <strong>התנגדות<\/strong> (<a href=\"https://www.gov.il/he/service/objection_to_obtained_trademark\">gov.il — הגשת התנגדות לסימן שהתקבל<\/a>), ורישום. את משך כל שלב: <strong>לבדוק<\/strong> בדף השירות או מול איש המקצוע. <strong>תוקף:<\/strong> לפי הידוע לי, רישום סימן מסחר בישראל תקף <strong>10 שנים<\/strong> ומתחדש בתשלום אגרה (<strong>לבדוק<\/strong>, ולרשום תזכורת בטבלת המצב).<\/p>\n<ul>\n<li><strong>™<\/strong> (״טרייד מארק״): מקובל להשתמש בו כבר עכשיו, כסימון שאת רואה בשם סימן מסחר שלך<\/li>\n<li><strong>®<\/strong>: רק <strong>אחרי<\/strong> שהסימן נרשם בפועל. לא לפני<\/li>\n<\/ul>\n<h3>6.6 דומיין ‎.co.il<\/h3>\n<p><strong>מי מנהל:<\/strong> איגוד האינטרנט הישראלי (ISOC-IL) מנהל את הסיומות ‎.il, וההרשמה בפועל נעשית דרך <strong>רשמים מוסמכים<\/strong> (חברות שהאיגוד הסמיך). ‎.co.il מיועדת בעיקר לגופים שפועלים למטרת רווח. <strong>מקור:<\/strong> <a href=\"https://www.domainthenet.com/en/tld/co.il.aspx\">Domain The Net — רשם מוסמך, על ‎.co.il<\/a>; <a href=\"https://www.isoc.org.il\">ISOC-IL — אתר האיגוד<\/a>.<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>1.<\/strong> לבדוק שהשם פנוי (בכל אתר של רשם מוסמך). לבדוק גם ‎.com, כדי שאף אחד לא יבלבל<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>2. לא לקנות לפני שהשם סגור<\/strong> (<a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a>). אם השם סגור והדומיין פנוי, לא לחכות הרבה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>3.<\/strong> לבחור רשם מוסמך מהרשימה באתר האיגוד, לפי מחיר ושירות. <strong>סדר גודל:<\/strong> אתר השוואת מחירים בינלאומי (<a href=\"https://domainoffer.net/tld/co.il\">domainoffer.net — ‎.co.il<\/a>) הציג באוגוסט–אוקטובר 2026 מחירים של <strong>כ־25 עד 35 דולר לשנה<\/strong> אצל רשמים שונים, וגם מחירים גבוהים יותר. רשמים ישראליים מתמחרים בשקלים. <strong>מחיר לבדוק<\/strong> אצל הרשם שתבחרי, להשוות גם את <strong>מחיר החידוש<\/strong> (לא רק את המבצע לשנה הראשונה), ולהכניס ל<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>4.<\/strong> להירשם <strong>על שמך<\/strong> (לא על שם המעצב/ת או חבר/ה שבונה את העמוד)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>5. לאשר את המייל:<\/strong> לפי מדיניות הרשמים, צריך לאמת את הפרטים במייל <strong>תוך 72 שעות<\/strong>, אחרת ההזמנה נכשלת. ייתכן גם שיבקשו צילום תעודה מזהה לאימות. <strong>מקור:<\/strong> <a href=\"https://support.opensrs.com/support/solutions/articles/201000093589--il-domain-policies\">OpenSRS — מדיניות ‎.il<\/a><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>6.<\/strong> אפשר לרשום לתקופה של <strong>עד 5 שנים<\/strong>. <strong>מקור:<\/strong> <a href=\"https://news.internetsociety.org/new-rules-opened-2020-at-isoc-il-il-registry-supports-five-year-registration-of-domain-names/\">Internet Society — הודעת ISOC-IL<\/a>. להפעיל <strong>חידוש אוטומטי<\/strong> ותזכורת ביומן<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>7. לבדוק<\/strong> מול הרשם אילו פרטים שלך יוצגו בחיפוש הציבורי (WHOIS), ואם אפשר להסתיר כתובת פרטית<\/li>\n<\/ul>\n<blockquote>\n<p>לפי הקונספט: <strong>לא בונים אתר מורכב<\/strong> בשלב הזה. הדומיין יכול פשוט להפנות ל<a href=\"../site/index.html\">עמוד הנחיתה<\/a>.<\/p>\n<\/blockquote>\n<p><strong>שמות משתמש ברשתות:<\/strong> הצ׳קליסט המלא ב<a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a>.<\/p>\n<h3>6.7 זכויות יוצרים במה שאחרים יוצרים בשבילך<\/h3>\n<p>לוגו, עיצוב תלבושת, צילום, עריכה, מוזיקה: לפי <a href=\"https://he.wikisource.org/wiki/חוק_זכות_יוצרים\">חוק זכות יוצרים<\/a>, ביצירה שהוזמנה, ככלל, <strong>היוצר/ת הוא/היא הבעלים<\/strong>, אלא אם הוסכם אחרת. <strong>לבדוק עם עו״ד<\/strong> את הנוסח הנכון.<\/p>\n<p><strong>לפני שמשלמים לכל יוצר/ת, מסכמים בכתב (גם במייל):<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מי הבעלים:<\/strong> העברת זכויות מלאה אלייך, או רישיון שימוש (בלעדי? לכמה זמן?)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>איפה מותר להשתמש:<\/strong> רשתות, אתר, דפוס, מרצ׳נדייז, מודעות בתשלום<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>קבצי מקור<\/strong> (וקטור ללוגו, קבצים פתוחים) נמסרים לך<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>קרדיט:<\/strong> האם ואיך<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מוזיקאי/ת:<\/strong> האם הוא/היא חבר/ה באקו״ם? אם כן, ייתכן שהזכויות מנוהלות דרכם (פרק 8)<\/li>\n<\/ul>\n<p>לוגו שנוצר בעזרת בינה מלאכותית: המעמד המשפטי לא ברור, ראי <a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a>. <strong>לבדוק<\/strong> עם עו״ד.<\/p>\n<hr />\n<h2>פרק 7 — פרטיות: ילדים, צילום ומידע על לקוחות<\/h2>\n<h3>7.1 שלושה כללים<\/h3>\n<ol>\n<li><strong>ילד/ה מזוהה בפרסום:<\/strong> רק עם אישור הורה בכתב, לשימוש הספציפי (<a href=\"08-consent-template.md\">טופס אישור הצילום<\/a>).<\/li>\n<li><strong>אוספים רק מה שצריך.<\/strong> לא שם משפחה של ילדים, לא תעודות זהות, לא אבחנות.<\/li>\n<li><strong>מה שלא צריך, נמחק.<\/strong> בזמנים קבועים מראש (טבלה ב־7.3).<\/li>\n<\/ol>\n<h3>7.2 מה החוק אומר, בקצרה<\/h3>\n<ul>\n<li><strong><a href=\"https://he.wikisource.org/wiki/חוק_הגנת_הפרטיות\">חוק הגנת הפרטיות, התשמ״א־1981<\/a><\/strong> מונה דרכים שבהן פוגעים בפרטיות. ביניהן: <strong>פרסום תצלום<\/strong> של אדם בנסיבות שעלולות להשפיל או לבזות אותו, ו<strong>שימוש בשם, בתמונה או בקול של אדם לשם רווח<\/strong> בלי הסכמתו. <strong>מקור לסעיף ״לשם ריווח״:<\/strong> <a href=\"https://barlaw.co.il/practice_areas/regulation/privacy-law/client_updates/using-a-name-without-permission-privacy-infringement\">ברנע ג׳פה לנדה — שימוש בשם בלי רשות<\/a>.<\/li>\n<li><strong>החשבונות של ״קים משחקים״ הם חשבונות עסקיים.<\/strong> לכן כל ילד/ה מזוהה בתוכן שלך דורש/ת <strong>הסכמה מפורשת<\/strong>.<\/li>\n<li><strong>אצל קטינים, את ההסכמה נותן ההורה או האפוטרופוס<\/strong>, לפי עו״ד שמצוטטת ב<a href=\"https://www.israelhayom.co.il/lifestyle/family-and-parenting/article/16379414\">ישראל היום<\/a>. <strong>לבדוק<\/strong> עם עו״ד אם צריך חתימה של שני ההורים.<\/li>\n<li><strong>פגיעה בפרטיות<\/strong> היא עוולה אזרחית (אפשר לתבוע פיצוי), ובמקרים מסוימים גם עבירה פלילית. <strong>מקור:<\/strong> <a href=\"https://www.hamichlol.org.il/פגיעה_בפרטיות\">המכלול — חוק הגנת הפרטיות<\/a>.<\/li>\n<li><strong>למה זה רציני גם בלי ״נזק״:<\/strong> סעיף 29א לחוק מאפשר לבית המשפט לפסוק <strong>פיצוי בלי שהתובע/ת צריך/ה להוכיח נזק<\/strong>. בפסק דין על פרסום תמונה שסוכם ב־Bizportal, נכתב שהסעיף מאפשר פיצוי כזה <strong>עד 50,000 ₪<\/strong>. <strong>מקור:<\/strong> <a href=\"https://www.bizportal.co.il/takdin/news/article/817225\">Bizportal — פסק דין על פרסום תמונה<\/a>. <strong>לבדוק<\/strong> את הסכום העדכני (הסכומים בחוק מתעדכנים). המסקנה: פוסט אחד בלי אישור יכול לעלות הרבה יותר מכל הופעה.<\/li>\n<li><strong>תיקון 13<\/strong> לחוק נכנס לתוקף באוגוסט 2025. <strong>מקור:<\/strong> <a href=\"https://www.loc.gov/item/global-legal-monitor/2025-11-17/israel-amendment-to-privacy-protection-law-goes-into-effect/\">Library of Congress<\/a>; <a href=\"https://meitar.com/wp-content/uploads/2025/07/AMENDMENT-13-TO-THE-PRIVACY-PROTECTION-LAW-IS-ON-THE-HORIZON-HEB.pdf\">מיתר — סקירת התיקון<\/a>. לפי סיכומים של משרדי עורכי דין, התיקון:<ul>\n<li><strong>הרחיב את סמכויות האכיפה<\/strong> של הרשות להגנת הפרטיות<\/li>\n<li><strong>הרחיב את ״חובת היידוע״<\/strong>: כשאוספים מידע אישי, אומרים מי אוסף/ת, איך יוצרים קשר, האם חובה למסור, מה קורה אם לא מוסרים, ומה הזכויות (עיון ותיקון)<\/li>\n<li><strong>צמצם מאוד את חובת רישום מאגרי מידע<\/strong> אצל רוב הגופים הפרטיים. <strong>מקור:<\/strong> <a href=\"https://www.shibolet.com/?p=18280\">שבלת — אישור תיקון 13<\/a>. כנראה שגיליון הלקוחות שלך <strong>לא<\/strong> מחייב רישום. <strong>לבדוק<\/strong> עם עו״ד<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>7.3 מה מותר לאסוף ולכמה זמן (הכללים שלך)<\/h3>\n<p>הזמנים כאן הם <strong>מדיניות פנימית מוצעת<\/strong>, לא דרישה חוקית. לאשר אותם עם עו״ד ועם הרו״ח.<\/p>\n<table>\n<thead>\n<tr>\n<th>מידע<\/th>\n<th>צריך?<\/th>\n<th>איפה נשמר<\/th>\n<th>כמה זמן<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>שם ההורה, טלפון, כתובת האירוע<\/td>\n<td>כן<\/td>\n<td>גיליון הלקוחות<\/td>\n<td>כל עוד יש קשר עסקי. מסמכי הנהלת חשבונות (קבלות): <strong>כמה שנים שהרו״ח יגיד<\/strong> (<strong>לבדוק<\/strong>)<\/td>\n<\/tr>\n<tr>\n<td>שם פרטי וגיל של החוגג/ת<\/td>\n<td>כן, לברכה ולהתאמה<\/td>\n<td>גיליון הלקוחות<\/td>\n<td>עד אחרי האירוע. לשמור לתזכורת ״יום הולדת בשנה הבאה״ <strong>רק<\/strong> אם ההורה הסכים/ה<\/td>\n<\/tr>\n<tr>\n<td>מידע בריאותי או רגישויות<\/td>\n<td>רק מה שנדרש לבטיחות, <strong>בלי שמות ובלי אבחנות<\/strong> (״ילד עם רגישות לרעש״)<\/td>\n<td>עמודת ״הערות בטיחות״<\/td>\n<td>למחוק אחרי האירוע<\/td>\n<\/tr>\n<tr>\n<td>תמונות וסרטונים של ילדים<\/td>\n<td>לפי <a href=\"08-consent-template.md\">טופס אישור הצילום<\/a><\/td>\n<td>תיקייה <code>06<\/code> בלבד<\/td>\n<td>גולמי שלא בשימוש: <strong>למחוק תוך 30 יום<\/strong><\/td>\n<\/tr>\n<tr>\n<td>טופסי אישור צילום חתומים<\/td>\n<td>כן<\/td>\n<td>תיקייה <code>06<\/code><\/td>\n<td>כל עוד התוכן מפורסם, ועוד תקופה שהעו״ד ימליץ/תמליץ (<strong>לבדוק<\/strong>)<\/td>\n<\/tr>\n<tr>\n<td>ת״ז של ילדים, שמות משפחה, שם הגן בכתוביות<\/td>\n<td><strong>לא. אף פעם<\/strong><\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>7.4 הודעת פרטיות קצרה (להדביק בכל מקום שבו את אוספת פרטים)<\/h3>\n<p>בשאלון הפרטים (<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>, תחנה 2), בטופס הדיגיטלי (<a href=\"08-consent-template.md\">טופס אישור הצילום<\/a>) ובעמוד הנחיתה אם יהיה בו טופס:<\/p>\n<blockquote>\n<p><strong>על הפרטים שלך:<\/strong> הפרטים שתמלא/י כאן ישמשו רק לתיאום המופע ולקשר איתך. מי אוספת: קים נידם, ״קים משחקים״, [טלפון / מייל]. אין חובה חוקית למסור אותם, אבל בלי פרטי קשר ומקום לא אוכל לתאם את המופע. הפרטים לא יועברו לאף אחד, חוץ מספקים שעוזרים לי לנהל את העסק (תוכנת קבלות, רו״ח), ולא ישמשו לפרסום בלי הסכמתך. אפשר לבקש לעיין בפרטים, לתקן אותם או למחוק אותם בכל עת.<\/p>\n<\/blockquote>\n<p><strong>לבדוק<\/strong> את הנוסח עם עו״ד.<\/p>\n<h3>7.5 אבטחת המידע, בפועל<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> אימות דו־שלבי ב־Google, בוואטסאפ ביזנס וברשתות<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> נעילת מסך בטלפון. אם הטלפון אבד: לשנות סיסמאות ולנתק מכשירים מרחוק<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לכבות שמירה אוטומטית<\/strong> של תמונות מוואטסאפ לגלריה, ולבדוק לאן Google Photos מגבה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> קישורי שיתוף ב־Drive: <strong>״מוגבל״<\/strong>, לא ״כל מי שיש לו את הקישור״<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> לא שולחים קבצים של ילדים לקבוצות וואטסאפ (כמו ב<a href=\"09-filming-guide.md\">מדריך הצילום<\/a>)<\/li>\n<\/ul>\n<h3>7.6 כללי הפלטפורמות<\/h3>\n<table>\n<thead>\n<tr>\n<th>פלטפורמה<\/th>\n<th>מה חשוב לדעת<\/th>\n<th>מקור<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>YouTube<\/strong><\/td>\n<td><strong>כל<\/strong> יוצר/ת, בכל מדינה, חייב/ת לסמן אם התוכן <strong>״מיועד לילדים״<\/strong>. תוכן לילדים מקבל הגבלות: בלי תגובות, בלי פרסומות מותאמות אישית ובלי חלק מהתכונות. סימון שגוי עלול להוביל לסנקציות. התוכן שלך מכוון לילדים, אז <strong>כנראה ״מיועד לילדים״<\/strong>. <strong>לבדוק<\/strong> לכל ערוץ וסרטון<\/td>\n<td><a href=\"https://support.google.com/youtube/answer/9528076\">YouTube Help — האם התוכן מיועד לילדים<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>Instagram<\/strong><\/td>\n<td>גיל מינימום 13. חשבון שמייצג ילד/ה מתחת לגיל 13 חייב לציין שהוא מנוהל בידי הורה<\/td>\n<td><a href=\"https://help.instagram.com/517920941588885\">Instagram Help<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>TikTok<\/strong><\/td>\n<td>גיל מינימום 13. איסור על תוכן שמסכן קטינים או מציג אותם באופן לא הולם<\/td>\n<td><a href=\"https://www.tiktok.com/community-guidelines/en/youth-safety\">TikTok — Youth Safety<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>מה זה אומר לך:<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>הקהל של הרשתות שלך הוא הורים<\/strong> (וגננות). ילדים צופים <strong>עם<\/strong> ההורים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא<\/strong> מזמינים ילדים לכתוב תגובות או לשלוח הודעות. <strong>לא<\/strong> עושים תחרויות שבהן ילדים מעלים סרטונים של עצמם (כמו ב<a href=\"03-video-scripts.md\">תסריטי הווידאו<\/a>: מבקשים תשובות בכתב מההורים)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> תגובות שמזכירות שם או מקום של ילד/ה: מוחקים<\/li>\n<\/ul>\n<h3>7.7 ילד/ה ש״משחק/ת״ בסרטון שלך: זה כבר לא רק פרטיות<\/h3>\n<p>לתעד ילדים במופע (באישור) זה דבר אחד. <strong>להושיב ילד/ה ״לשחק״ בסרטון מתוכנן<\/strong>, ובמיוחד בפרסומת, זה דבר אחר. לפי <a href=\"https://www.kolzchut.org.il/he/איסור_העסקת_ילד_בהופעה_או_בצילומים_ללא_היתר\">כל זכות — איסור העסקת ילד בהופעה או בצילומים ללא היתר<\/a>, אסור להעסיק ילד/ה מתחת לגיל 15 בהופעה או בצילומים לפרסומת <strong>בלי היתר<\/strong> ממשרד העבודה. הבקשה: <a href=\"https://www.gov.il/he/service/performance-license-for-children\">gov.il — היתר להעסקת ילדים בהופעות או בפרסומות<\/a>.<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לפני כל סרטון מתוכנן עם ילד/ה<\/strong> (גם הבת של חברה, גם בלי תשלום): <strong>לבדוק<\/strong> עם עו״ד או מול משרד העבודה אם נדרש היתר<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> עד שבדקת: הסרטונים המתוכננים הם <strong>איתך בלבד<\/strong><\/li>\n<\/ul>\n<h3>7.8 עמוד הנחיתה<\/h3>\n<ul>\n<li>כרגע העמוד מפנה לוואטסאפ ולא אוסף פרטים. אם יתווסף טופס: להוסיף את הודעת הפרטיות (7.4).<\/li>\n<li><strong>נגישות:<\/strong> לפי <a href=\"https://www.kolzchut.org.il/he/הנגשת_אתרי_אינטרנט_ואפליקציות_לאנשים_עם_מוגבלות\">כל זכות — הנגשת אתרי אינטרנט<\/a>, אתרים שנותנים שירות לציבור חייבים ככלל להיות נגישים. <strong>לבדוק<\/strong> מה חל עלייך, כולל הצהרת נגישות (ראי גם <a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a>).<\/li>\n<\/ul>\n<h3>7.9 הודעות שיווקיות<\/h3>\n<p>חוק הספאם, מה מותר לשלוח ולמי: <a href=\"10-outreach-templates.md\">תבניות פנייה<\/a>, חלק א׳.<\/p>\n<hr />\n<h2>פרק 8 — מוזיקה במופעים: אקו״ם וזכויות<\/h2>\n<h3>8.1 למה זה בכלל עניין<\/h3>\n<p>השמעה של שיר מוקלט בפני קהל היא ״ביצוע פומבי״. על רוב המוזיקה המוכרת יש זכויות, ומי שמשמיע/ה צריך/ה רישיון, אלא אם המוזיקה פטורה או שיש לך רישיון ממי שיצר/ה אותה.<\/p>\n<h3>8.2 מי גובה מה<\/h3>\n<ul>\n<li><strong>אקו״ם<\/strong> מייצגת יוצרים (מלחינים, כותבים, מעבדים) וגובה על ביצוע פומבי. לפי האתר שלהם, <strong>התעריף המפורסם אינו רישיון<\/strong>: את הרישיון מבקשים <strong>מראש<\/strong>, והמחיר הסופי מחושב לפי פרטי כל לקוח. <strong>מקור:<\/strong> <a href=\"https://acum.org.il/en/tariff-public-performance/\">אקו״ם — תעריפי ביצוע פומבי<\/a>.<\/li>\n<li><strong>תעריף ״אירועים משפחתיים״ (T008):<\/strong> לפי <a href=\"https://acum.org.il/en/tariff-public-performance/t008-family-events/\">דף התעריף באתר אקו״ם<\/a>, <strong>מבקש/ת הרישיון<\/strong> פונה לאקו״ם <strong>עד 72 שעות לפני<\/strong> האירוע, מדווח/ת על המקום והתאריך ומשלם/ת. הרישיון הוא לאירוע אחד, בזמן ובמקום מסוימים. אירועים בעלי אופי עסקי (אירוע חברה, אירוע ועד עובדים) <strong>לא<\/strong> כלולים, ולאירוע באולם של מלון יש תעריף נפרד. <strong>הסכום:<\/strong> בבדיקות שעשיתי באוקטובר 2026 הופיעו לדף התעריף <strong>שני סכומים שונים<\/strong>: <strong>351 ₪<\/strong> ו־<strong>395.30 ₪<\/strong>, שניהם <strong>כולל מע״מ, לאירוע אחד<\/strong> (הדף מסומן ״תעריף 2024״). בדף <a href=\"https://acum.org.il/en/faq/\">השאלות הנפוצות של אקו״ם<\/a> מופיע סכום שלישי לאירוע פרטי. כלומר: <strong>לבדוק<\/strong> את הסכום העדכני ישירות מול אקו״ם, וגם אם התעריף הזה בכלל מתאים להופעה שלך. סדר הגודל הוא <strong>כמה מאות שקלים לאירוע<\/strong>, וזה מספיק כדי להכניס אותו ל<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a> כ״אולי״. התשלום עצמו נעשה דרך <a href=\"https://apps.acum.org.il/licenses/general/register-payment?action=info&amp;sourceTypeCode=T008&amp;lang=en\">מערכת הרישיונות של אקו״ם<\/a>.<\/li>\n<li><strong>מי בדרך כלל ״מבקש/ת הרישיון״ ביום הולדת?<\/strong> לפי לשון התעריף, זה מי שמארגן/ת את האירוע. <strong>לא מצאתי<\/strong> תשובה ודאית אם זה המארח/ת או את, כשאת המופיעה (8.3).<\/li>\n<li><strong>זכויות בהקלטה עצמה:<\/strong> מעבר ליוצרים, יש גופים שגובים עבור <strong>מבצעים<\/strong> (למשל <a href=\"https://eshkolot.co.il\">אשכולות<\/a>) ועבור <strong>מפיקי ההקלטות<\/strong>. <strong>לבדוק<\/strong> אילו מהם רלוונטיים אלייך. (רקע: <a href=\"02-show-script.md\">תסריט המופע<\/a>, פרק 8)<\/li>\n<\/ul>\n<h3>8.3 השאלה הפתוחה<\/h3>\n<p><strong>מי חייב ברישיון<\/strong> כשמופע מוזמן לגן, לקייטנה, למתנ״ס או ליום הולדת: את, המקום או המזמין? לא מצאתי תשובה ודאית. <strong>לבדוק<\/strong> ישירות מול אקו״ם, ולשאול את המקום: ״יש לכם הסדר עם אקו״ם? הוא מכסה גם מופע חיצוני?״<\/p>\n<h3>8.4 הדרך הבטוחה (כבר עכשיו)<\/h3>\n<table>\n<thead>\n<tr>\n<th>אפשרות<\/th>\n<th>מה עושים<\/th>\n<th>מה שומרים בתיקייה <code>05<\/code><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מוזיקה מקורית<\/strong><\/td>\n<td>מוזיקאי/ת מכין/ה רצועות קצב פשוטות<\/td>\n<td>הסכם בכתב: מותר להשתמש בהופעות ובסרטונים. האם חבר/ה באקו״ם?<\/td>\n<\/tr>\n<tr>\n<td><strong>Royalty-Free עם רישיון להופעה חיה<\/strong><\/td>\n<td>רק רצועות שהרישיון שלהן מכסה <strong>במפורש<\/strong> ביצוע חי בפני קהל<\/td>\n<td>PDF או צילום מסך של תנאי הרישיון לכל רצועה<\/td>\n<\/tr>\n<tr>\n<td><strong>בלי הקלטות<\/strong><\/td>\n<td>מחיאות כפיים, תופים, טמבורין, שירה של מנגינות שאת יצרת<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>שתי מלכודות נפוצות:<\/strong><\/p>\n<ul>\n<li><strong>״אני רק שרה, בלי פלייבק״:<\/strong> גם שירה חיה של שיר ילדים מוכר היא <strong>ביצוע של יצירה מוגנת<\/strong> (של המלחין/ה ושל הכותב/ת), גם בלי הקלטה. הקלטה מוסיפה רק שכבת זכויות נוספת. <strong>לבדוק<\/strong> מול אקו״ם (8.5, שאלה 5).<\/li>\n<li><strong>״זה שיר עם, הוא של כולם״:<\/strong> לא תמיד. גם לשירי ילדים ״ישנים״ יש בדרך כלל יוצרים, וזכות היוצרים נמשכת <strong>שנים רבות אחרי מות היוצר/ת<\/strong> (לפי <a href=\"https://he.wikisource.org/wiki/חוק_זכות_יוצרים\">חוק זכות יוצרים<\/a>, ככלל, 70 שנה. <strong>לבדוק<\/strong> לכל שיר). שיר שאת לא בטוחה לגביו: לא נכנס לפלייליסט עד שבדקת.<\/li>\n<\/ul>\n<p><strong>שיר מקורי בהפקה<\/strong> מגיע רק <strong>אחרי<\/strong> אימות ביקוש, לפי סדר ההשקעות ב<a href=\"01-concept.md\">מסמך הקונספט<\/a>.<\/p>\n<h3>8.5 תסריט לשיחה עם אקו״ם<\/h3>\n<blockquote>\n<p>שלום, אני קים נידם, מופיעה במופע תנועה אינטראקטיבי לילדים בשם ״קים משחקים״, כ־45 דקות. אני מופיעה בגנים, בקייטנות, במתנ״סים ובימי הולדת בבתים. במופע מושמעות [<strong><em>] רצועות מוקלטות, כל אחת [<\/em><\/strong>] דקות. שאלות:<\/p>\n<ol>\n<li>מי צריך/ה רישיון בכל אחד מהמקומות האלה: אני, המקום או המזמין?<\/li>\n<li>איזה תעריף מתאים, ויש רישיון שנתי למופיע/ה?<\/li>\n<li>אם המקום כבר משלם לכם, זה מכסה גם אותי?<\/li>\n<li>אם אני משתמשת רק במוזיקה מקורית שהזמנתי, מה אני צריכה להציג?<\/li>\n<li>אם אני <strong>שרה בעצמי<\/strong>, בלי הקלטה, שיר ילדים מוכר, זה מחייב רישיון? ממי?<\/li>\n<li>ביום הולדת בבית: התעריף לאירוע משפחתי (T008) מתאים? מי משלם/ת אותו, אני או ההורים?<\/li>\n<\/ol>\n<\/blockquote>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> לרשום את התשובות <strong>בכתב<\/strong> (לבקש במייל), ולשמור בתיקייה <code>05<\/code><\/li>\n<\/ul>\n<p><strong>סרטונים ברשתות<\/strong> הם עניין נפרד: <a href=\"09-filming-guide.md\">מדריך הצילום<\/a>.<\/p>\n<hr />\n<h2>פרק 9 — בטיחות ועזרה ראשונה<\/h2>\n<h3>9.1 קורס עזרה ראשונה (להירשם בשבוע 1)<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> קורס שכולל <strong>החייאה של מבוגר, ילד ותינוק<\/strong>, חנק וטיפול בפציעות נפוצות. אפשרויות לבדיקה, מהקצרה לארוכה:<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>אפשרות<\/th>\n<th>מה ידוע<\/th>\n<th>מקור<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>סדנה של קופת חולים<\/strong><\/td>\n<td>למשל במכבי: מפגש אחד של כ־<strong>3.5 שעות<\/strong>, החייאה ועזרה ראשונה לתינוקות וילדים, מדריך/ה מטעם מד״א, <strong>לחברי/ות מכבי<\/strong> בהשתתפות עצמית. בקופות אחרות: <strong>לבדוק<\/strong><\/td>\n<td><a href=\"https://www.maccabi4u.co.il/eligibilites/2610/\">מכבי — סדנת עזרה ראשונה והחייאה של תינוקות וילדים<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>קורס מד״א לציבור<\/strong><\/td>\n<td>קורסים בהיקפים שונים. <strong>לבדוק<\/strong> מה מתאים<\/td>\n<td><a href=\"https://www.mdais.org.il\">מגן דוד אדום<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>קורס ״מגיש/ת עזרה ראשונה״ מלא<\/strong><\/td>\n<td>לפי אתר קורסים, הקורס הבסיסי של מד״א הוא בהיקף <strong>44 שעות<\/strong>. מעמיק, אבל לא חובה בשלב הזה<\/td>\n<td><a href=\"https://www.study.co.il/קורס-עזרה-ראשונה/\">study.co.il — קורס עזרה ראשונה<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>ההמלצה לשלב הפיילוט:<\/strong> סדנה קצרה של החייאת ילדים ותינוקות <strong>לפני<\/strong> ההופעה הראשונה, וקורס מלא אם תתחילי להופיע הרבה. <strong>מועדים, מחיר ותעודה: לבדוק<\/strong>. אם מוסד דורש תעודה מסוג מסוים, זה מה שקובע<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> לשמור את התעודה בתיקייה <code>03<\/code>. <strong>לבדוק<\/strong> כל כמה זמן מומלץ לרענן<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> להכניס את העלות ל<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a><\/li>\n<\/ul>\n<h3>9.2 ערכת עזרה ראשונה בתיק ההופעה<\/h3>\n<p>ערכה בסיסית ולא רפואית. <strong>לא נותנים תרופות לילדים<\/strong>, זה של ההורים או הצוות.<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> פלסטרים בגדלים שונים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> פדים סטריליים ותחבושת<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> כפפות חד־פעמיות<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> שקית קירור חד־פעמית (״קרח מיידי״)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מגבונים ומספריים קטנים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מים לשטיפת פצע<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> כרטיס עם מספרי חירום וכתובת האירוע (ממלאים לפני כל הופעה)<\/li>\n<\/ul>\n<h3>9.3 כללי בטיחות קבועים במופע<\/h3>\n<p>אלה הכללים של ״קים משחקים״, בכל הופעה, בלי יוצא מן הכלל. הם תואמים את <a href=\"02-show-script.md\">תסריט המופע<\/a> ואת <a href=\"14-character-bible.md\">תנ״ך הדמות<\/a>.<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מרימים ילדים.<\/strong> לא מסובבים, לא זורקים, לא מעלים על הכתפיים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אין פירמידות, אין מגדלים, אין טיפוס<\/strong> על רהיטים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אביזרים רכים בלבד<\/strong>, בלי חלקים קטנים לגילאי גן<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>משחקי ריצה:<\/strong> כיוון אחד, מרחב מספיק, בלי ריצה לעבר קיר או מדרגות<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>הפסקות שתייה<\/strong>, ובחוץ רק בצל. חום כבד: מקצרים או דוחים (כמו בתנאים ב<a href=\"06-show-offer.md\">הצעת המופע<\/a>)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מבוגר/ת מהמקום בחדר<\/strong> לאורך כל המופע<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>בלי אוכל וממתקים<\/strong> כפרסים, בלי אישור המארח/ת (אלרגיות)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>ילד/ה שלא רוצה להשתתף:<\/strong> מזמינים פעם אחת בחיוך, ולא לוחצים<\/li>\n<\/ul>\n<h3>9.4 לפני כל הופעה: סיבוב שטח (5 דקות)<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> רצפה: לא חלקה, בלי שטיחים מתקפלים, בלי חפצים מפוזרים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> פינות חדות, שולחנות וכיסאות: מזיזים או מסמנים ״אזור לא משחקים״<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> יציאות פנויות. איפה <strong>המרחב המוגן<\/strong> הקרוב (9.6)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> כבלים של הרמקול: לא במסלול ריצה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מי איש/אשת הצוות האחראי/ת, ומה הכתובת המדויקת (לכרטיס החירום)<\/li>\n<\/ul>\n<h3>9.5 אם קרה משהו<\/h3>\n<ol>\n<li><strong>עוצרים את המשחק.<\/strong> הילדים יושבים במקום (״פסל ישיבה״ מתוך המופע).<\/li>\n<li><strong>מטפלים<\/strong> לפי מה שלמדת בקורס, ומעבירים לצוות או להורה.<\/li>\n<li><strong>מקרה חירום:<\/strong> מד״א <strong>101<\/strong>, משטרה <strong>100<\/strong>, כבאות <strong>102<\/strong>. אומרים כתובת מדויקת.<\/li>\n<li><strong>אחרי האירוע, באותו יום:<\/strong> כותבים מה קרה (טופס קצר, למטה), ומודיעים לסוכן הביטוח <strong>לפי מה שכתוב בפוליסה<\/strong>.<\/li>\n<\/ol>\n<p><strong>טופס אירוע חריג (להעתקה לפתקים בטלפון):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>תאריך, שעה, מקום<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>מה קרה (עובדות בלבד)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>מי היה מעורב (בלי שמות משפחה של ילדים)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>מה עשית<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>למי הודעת ומתי (צוות, הורה, 101)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>עדים מהצוות<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>הודעה לביטוח: תאריך<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>9.6 פיקוד העורף<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לפני כל הופעה:<\/strong> לבדוק את ההנחיות לאזור באתר <a href=\"https://www.oref.org.il\">פיקוד העורף<\/a> או באפליקציה, כולל מגבלות התקהלות וזמן ההתגוננות. ההנחיות משתנות לפי אזור ותקופה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> לדעת איפה המרחב המוגן הקרוב, וכמה זמן לוקח להגיע אליו עם הילדים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> הנחיות שלא מאפשרות את האירוע: קובעים מועד חדש בלי עלות (כמו בתנאים ב<a href=\"06-show-offer.md\">הצעת המופע<\/a>)<\/li>\n<\/ul>\n<hr />\n<h2>פרק 10 — מה מוסדות עשויים לבקש ממך<\/h2>\n<table>\n<thead>\n<tr>\n<th>מסמך<\/th>\n<th>מי מבקש בדרך כלל<\/th>\n<th>איך משיגים<\/th>\n<th>פרק<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>אישור משטרה (עבירות מין)<\/td>\n<td>גנים, בתי ספר, קייטנות, מתנ״סים. <strong>לבדוק<\/strong> אם החובה חלה עלייך כאישה (5.1)<\/td>\n<td>gov.il או תחנת משטרה, עם ״תעודת מוסד״ מהמוסד<\/td>\n<td>5.3<\/td>\n<\/tr>\n<tr>\n<td>אישור משטרה (עבירות אלימות)<\/td>\n<td>מעונות, גנים, קייטנות, צהרונים (גיל רך)<\/td>\n<td>שירות נפרד ב־gov.il<\/td>\n<td>5.4<\/td>\n<\/tr>\n<tr>\n<td>אישור קיום ביטוחים<\/td>\n<td>מתנ״סים, רשויות, לפעמים גנים פרטיים<\/td>\n<td>מהסוכן/ת, לפי הנוסח של המוסד<\/td>\n<td>4.4<\/td>\n<\/tr>\n<tr>\n<td>תעודת עוסק (פטור/מורשה)<\/td>\n<td>כולם<\/td>\n<td>מאישור פתיחת התיק<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>אישור ניהול ספרים + ניכוי מס במקור<\/td>\n<td>גופים ציבוריים<\/td>\n<td>דרך הרו״ח / רשות המסים<\/td>\n<td>3.7<\/td>\n<\/tr>\n<tr>\n<td>פרטי בנק (צילום צ׳ק או אישור ניהול חשבון)<\/td>\n<td>מוסדות שמשלמים בהעברה<\/td>\n<td>מהבנק<\/td>\n<td>3.4<\/td>\n<\/tr>\n<tr>\n<td>תעודת קורס עזרה ראשונה<\/td>\n<td>לפעמים<\/td>\n<td>מהקורס<\/td>\n<td>9<\/td>\n<\/tr>\n<tr>\n<td>רישום כספק במערכת של משרד החינוך (גפ״ן)<\/td>\n<td>בתי ספר וגנים שמשלמים מתקציב המשרד<\/td>\n<td><strong>לבדוק<\/strong> אם רלוונטי בעתיד: <a href=\"https://meyda.education.gov.il/files/edu-hub/sherut/Gefen_Sapakim_Dec.pdf\">מדריך הספקים של גפ״ן<\/a><\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>בגן עירוני:<\/strong> <strong>לבדוק<\/strong> עם הגננת אם הפעלה חיצונית צריכה אישור של הפיקוח או של הרשות, ומי משלם (ראי <a href=\"06-show-offer.md\">הצעת המופע<\/a>).<\/p>\n<hr />\n<h2>פרק 11 — חוזים ותנאי ביטול<\/h2>\n<p>תנאי ההזמנה והביטול נמצאים ב<a href=\"06-show-offer.md\">הצעת המופע<\/a>, חלק ד׳. הנקודה המשפטית העיקרית: כשהורה מזמין/ה בטלפון, בוואטסאפ או באינטרנט, ייתכן שזו <strong>״עסקת מכר מרחוק״<\/strong>, עם זכות ביטול שאסור לצמצם. <strong>מקור:<\/strong> <a href=\"https://www.kolzchut.org.il/he/עסקת_מכר_מרחוק\">כל זכות — עסקת מכר מרחוק<\/a>.<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> להעביר את חלק ד׳ לבדיקה של עו״ד <strong>לפני<\/strong> ההזמנה הראשונה בתשלום<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> עם מוסדות: <strong>לבקש את הזמנת העבודה או את ההסכם שלהם בכתב<\/strong> לפני ההופעה, ולקרוא את סעיפי הביטוח, הביטול והתשלום<\/li>\n<\/ul>\n<hr />\n<h2>פרק 12 — שאלות מוכנות לאנשי המקצוע<\/h2>\n<p>הנושאים האלה עולים גם ב<a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a>. רושמים כל תשובה, עם תאריך ושם מי שענה.<\/p>\n<h3>לרו״ח / יועץ/ת מס<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> איך להגדיר את העיסוק שלי (מופעים והפעלות לילדים), והאם הוא מאפשר עוסק פטור? (1.3)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> פטור או מורשה, לפי המחזור הצפוי והלקוחות שלי?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ״עסק זעיר״ (30% הוצאות) או מסלול רגיל, לפי ההוצאות שלי? (1.6)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> פיילוט בחינם לגמרי מחייב פתיחת תיק? (1.5)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> כמה אחוז מכל תשלום לשים בצד למס הכנסה, לביטוח לאומי ולפנסיה?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> איך לדווח לביטוח לאומי, ואיך מגדירים שעות עבודה? (2.2)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> אילו הוצאות מוכרות, ואיך לתעד נסיעות? (3.6)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> איזו תוכנת קבלות את/ה ממליץ/ה, ואת/ה עובד/ת איתה?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> איך מוציאים אישור ניהול ספרים ואישור ניכוי במקור? (3.7)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> חשבון עסקי או חשבון פרטי נפרד? (3.4)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> כמה זמן חייבים לשמור קבלות ומסמכים?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מה מועדי הדיווח שלי השנה, ומי מגיש מה? (פרק 13)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> כמה עולה הליווי שלך בשנה?<\/li>\n<\/ul>\n<h3>לעו״ד<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <a href=\"08-consent-template.md\">טופס אישור הצילום<\/a>: הנוסח מספיק? צריך חתימה של שני ההורים? טופס דיגיטלי (Google Forms) תקף?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> כמה זמן לשמור טופסי אישור וסרטונים?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> הודעת הפרטיות (7.4) בסדר?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> האם העסק שלי נחשב ״מוסד״ לפי החוק למניעת העסקת עברייני מין? ומה אם אעסיק עוזר/ת? (5.1, 5.2)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> הופעה חד־פעמית במוסד נחשבת ״העסקה״ לפי שני החוקים (עבירות מין ועבירות אלימות)? (5.1)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> סרטון מתוכנן עם ילד/ה: צריך היתר עבודת נוער? (7.7)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> תנאי הביטול ב<a href=\"06-show-offer.md\">הצעת המופע<\/a> תואמים את חוק הגנת הצרכן? (פרק 11)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> נוסח העברת זכויות מהמעצב/ת, הצלם/ת והמוזיקאי/ת (6.7)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> רישום סימן מסחר: איזה סוג, מילולי או לוגו, ומתי? (6.3–6.4)<\/li>\n<\/ul>\n<h3>לסוכן/ת ביטוח<\/h3>\n<p>ראי פרק 4.3: תיאור הפעילות + 11 שאלות + טבלת השוואה.<\/p>\n<h3>לאקו״ם<\/h3>\n<p>ראי פרק 8.5.<\/p>\n<h3>למשטרה (או דרך דף השירות)<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" di >\n<tr>\n<td>אישור ניהול ספרים + ניכוי במקור<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><code>01<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>ביטוח צד שלישי<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><code>02<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>אישור משטרה (עבירות מין)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><code>03<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>אישור משטרה (עבירות אלימות)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><code>03<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>קורס עזרה ראשונה<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><code>03<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>ערכת עזרה ראשונה בתיק<\/td>\n<td><\/td>\n<td><\/td>\n<td>—<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>חיפוש במאגר סימני המסחר<\/td>\n<td><\/td>\n<td><\/td>\n<td>—<\/td>\n<td><code>04<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>בקשה לסימן מסחר<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><code>04<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>דומיין<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>העברת זכויות מהמעצב/ת<\/td>\n<td><\/td>\n<td><\/td>\n<td>—<\/td>\n<td><code>04<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>פלייליסט עם רישיונות<\/td>\n<td><\/td>\n<td><\/td>\n<td>—<\/td>\n<td><code>05<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>תשובה בכתב מאקו״ם<\/td>\n<td><\/td>\n<td><\/td>\n<td>—<\/td>\n<td><code>05<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>טופסי אישור צילום (נייר + דיגיטלי + מוסד)<\/td>\n<td><\/td>\n<td><\/td>\n<td>—<\/td>\n<td><code>06<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>הודעת פרטיות בשאלון ובטופס<\/td>\n<td><\/td>\n<td><\/td>\n<td>—<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>תנאי ביטול נבדקו בידי עו״ד<\/td>\n<td><\/td>\n<td><\/td>\n<td>—<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>פרק 15 — שאלות שכנראה תשאלי (ותשובות זהירות)<\/h2>\n<table>\n<thead>\n<tr>\n<th>השאלה<\/th>\n<th>התשובה הקצרה<\/th>\n<th>מה עושים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>״אני מופיעה פעם אחת אצל חברה, היא רוצה לתת לי 200 ₪. זה בסדר בלי תיק?״<\/td>\n<td>תשלום על הופעה הוא הכנסה מעסק. הכלל שלך: <strong>אין תיק, אין תשלום<\/strong> (1.5)<\/td>\n<td>או בחינם לגמרי (ואז <strong>לבדוק<\/strong> עם הרו״ח), או לפתוח תיק לפני<\/td>\n<\/tr>\n<tr>\n<td>״צריך רישיון עסק?״<\/td>\n<td>רישיון עסק נוגע בדרך כלל ל<strong>מקום<\/strong> שבו העסק פועל. את מופיעה במקומות של אחרים. <strong>לא בדקתי<\/strong> את צו רישוי עסקים לעיסוק שלך<\/td>\n<td>שאלה לרו״ח, או למחלקת רישוי עסקים ברשות המקומית: <strong>לבדוק<\/strong><\/td>\n<\/tr>\n<tr>\n<td>״למוסד יש ביטוח. אני עדיין צריכה ביטוח?״<\/td>\n<td>כן. הביטוח שלהם לא מכסה אותך (4.4)<\/td>\n<td>הצעות מחיר (4.3)<\/td>\n<\/tr>\n<tr>\n<td>״הגננת אומרת שיש להם אישורי צילום מההורים. זה מספיק?״<\/td>\n<td>לא בהכרח. טופס של גן מכסה בדרך כלל פרסום <strong>של הגן<\/strong>, לא בערוצים העסקיים שלך<\/td>\n<td>נוסח ג׳ ב<a href=\"08-consent-template.md\">טופס אישור הצילום<\/a><\/td>\n<\/tr>\n<tr>\n<td>״הורה צילם במופע והעלה סרטון עם ילדים אחרים. אני אחראית?״<\/td>\n<td>את לא שולטת במה שהורים מעלים, אבל אפשר להקטין את הסיכוי<\/td>\n<td>המשפט של המארח/ת בתחילת המופע (<a href=\"08-consent-template.md\">טופס אישור הצילום<\/a>, נוסח ד׳). אם הורה אחר פונה אלייך: מפנים בעדינות להורה שהעלה/תה<\/td>\n<\/tr>\n<tr>\n<td>״מוסד ביקש אישור משטרה, ואמרו לי שנשים לא צריכות. מה עונים?״<\/td>\n<td>לא מתווכחים. בודקים, ומחזירים תשובה רשמית (5.2)<\/td>\n<td>1299 או דף השירות. לא לכתוב ״יש לי אישור״ לפני שיש<\/td>\n<\/tr>\n<tr>\n<td>״אפשר להשתמש בשיר מטיקטוק/יוטיוב במופע?״<\/td>\n<td>ככלל, מוזיקה מספרייה של אפליקציה מורשית לשימוש <strong>בתוך האפליקציה<\/strong>, לא להשמעה בפני קהל חי (<strong>לבדוק<\/strong> בתנאי השימוש)<\/td>\n<td>פרק 8.4<\/td>\n<\/tr>\n<tr>\n<td>״הלוגו נעשה בבינה מלאכותית. הוא שלי?״<\/td>\n<td>המעמד המשפטי לא ברור<\/td>\n<td>פרק 6.7 ו<a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a>. <strong>לבדוק<\/strong> עם עו״ד<\/td>\n<\/tr>\n<tr>\n<td>״ילד נפצע קצת (שריטה) והכול בסדר. צריך לעשות משהו?״<\/td>\n<td>כן: לכתוב טופס אירוע חריג באותו יום, ולבדוק בפוליסה אם צריך להודיע<\/td>\n<td>פרק 9.5<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>מקורות (נבדקו באוקטובר 2026)<\/h2>\n<p><strong>עסק ומסים<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.gov.il/he/service/request-open-exempt-dealer-via-internet\">gov.il — בקשה לפתיחת תיק עוסק פטור באמצעות האינטרנט<\/a><\/li>\n<li><a href=\"https://www.kolzchut.org.il/he/עוסק_פטור\">כל זכות — עוסק פטור<\/a> · <a href=\"https://www.kolzchut.org.il/he/עוסק_מורשה\">עוסק מורשה<\/a> · <a href=\"https://www.kolzchut.org.il/he/עסק_זעיר\">עסק זעיר<\/a><\/li>\n<li><a href=\"https://www.gov.il/he/service/request-assignment-number-for-tax-invoice\">gov.il — בקשה למספר הקצאה לחשבונית מס<\/a> · <a href=\"https://www.greeninvoice.co.il/magazine/israel-invoice/\">Green Invoice — חשבוניות ישראל<\/a><\/li>\n<li><a href=\"https://www.gov.il/he/service/registration-software-designed-managing-computerized-accounting-system\">gov.il — רישום תוכנה לניהול מערכת חשבונות ממוחשבת<\/a><\/li>\n<li><a href=\"https://protocol.co.il/exempt-dealer-declaration/\">פרוטוקול — הצהרת עוסק פטור<\/a> · <a href=\"https://www.greeninvoice.co.il/magazine/exempt-dealer-statement/\">Green Invoice — הצהרת עוסק פטור<\/a><\/li>\n<li><a href=\"https://he.wikisource.org/wiki/חוק_עסקאות_גופים_ציבוריים\">חוק עסקאות גופים ציבוריים<\/a> · <a href=\"https://www.efraty.com/?p=4267\">אפרתי — הוראת ביצוע 1/2025<\/a><\/li>\n<li><a href=\"https://www.maariv.co.il/economy/consumerism/article-1316871\">מעריב — פתיחת חשבון עסקי<\/a><\/li>\n<li><a href=\"https://www.bizportal.co.il/guides/news/article/20039167\">Bizportal — מדריך עוסק מורשה (תקרת 2026)<\/a> · <a href=\"https://www.greeninvoice.co.il/magazine/who-can-be-exempt-dealer/\">Green Invoice — מי יכול להיות עוסק פטור<\/a><\/li>\n<\/ul>\n<p><strong>ביטוח לאומי<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.btl.gov.il/Insurance/National%20Insurance/type_list/Self_Employed/Pages/howtoregister.aspx\">ביטוח לאומי — פתיחת תיק עצמאי<\/a><\/li>\
