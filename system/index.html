1>קים משחקים — מסמך קונספט, מיתוג ותוכנית השקה<\/h1>\n<p><em>טיוטת עבודה ליועץ העסקי ולמשווק. סטטוס: קונספט בפיתוח. המסמך מרכז החלטות ורעיונות שעלו בשיחות, ולא מציג מחקר שוק או תחזית הכנסות מאומתת.<\/em><\/p>\n<h2>1 | תקציר המיזם<\/h2>\n<p>״קים משחקים״ היא דמות כוכבת ילדים אנרגטית, צבעונית וספורטיבית, המובילה ילדים למשחק, תנועה, צחוק והשתתפות פעילה. השאיפה היא לבנות מותג מזוהה שיצמח מתוכן דיגיטלי ומפגשים קטנים למופעים, שירים ומוצרים בהמשך.<\/p>\n<p><strong>סלוגן מוביל:<\/strong> ״עם קים — כולם משחקים!״<\/p>\n<h2>2 | זהות הדמות והבידול<\/h2>\n<ul>\n<li><strong>אופי:<\/strong> שובבה, אותנטית, מצחיקה, סוחפת, מעודדת השתתפות; לא דמות מתיילדת מדי.<\/li>\n<li><strong>הבטחה לילדים:<\/strong> לא רק לצפות בקים — לשחק איתה בפועל.<\/li>\n<li><strong>עולמות תוכן:<\/strong> תנועה, אתגרי משחק, יצירתיות, ביטחון להשתטות ושיתוף פעולה.<\/li>\n<li><strong>יתרון מקצועי:<\/strong> ניסיון מעשי בהדרכת תנועה ומשחק לילדים ובפעילות תיאטרון.<\/li>\n<li><strong>קריאת קהל:<\/strong> קים קוראת ״עם קים...״ והילדים עונים ״כולם משחקים!״<\/li>\n<\/ul>\n<h2>3 | שפה חזותית ותלבושת<\/h2>\n<ul>\n<li><strong>צבעי ליבה:<\/strong> צהוב, כתום ולבן; תחושה של שמש, שמחה ואנרגיה.<\/li>\n<li><strong>לוק:<\/strong> בגד גוף קצר וצמוד, מוסתר מתחת לחצאית מעודדות גבוהה עם קפלים.<\/li>\n<li>טייץ קצר וצמוד מתחת לחצאית לצניעות ולתנועה חופשית.<\/li>\n<li>סניקרס לבנות עם נגיעות צהוב/כתום, גרביים ספורטיביות וקוקו גבוה עם סרט.<\/li>\n<li><strong>לוגו מוצע:<\/strong> K גדולה ודינמית, בשילוב רמזים למשחק כגון כדור, קובייה או מסלול תנועה; יש לפשט כדי שייראה טוב גם בקטן.<\/li>\n<li>נדרשת בדיקת זמינות השם, הדמיון למותגים אחרים וזכויות שימוש לפני השקעה משמעותית.<\/li>\n<\/ul>\n<h2>4 | קהל יעד ומיצוב<\/h2>\n<ul>\n<li><strong>קהל ראשוני לבדיקה:<\/strong> ילדי גן וגיל יסודי צעיר, עם התאמת המופע והמשחקים לכל קבוצת גיל.<\/li>\n<li><strong>קהל רוכש/מזמין:<\/strong> הורים, גנים, קייטנות, מתנ״סים, מפיקי אירועים ורשויות.<\/li>\n<li><strong>מיצוב מוצע:<\/strong> כוכבת ילדים של משחק פעיל ולא רק מופע צפייה.<\/li>\n<li>יש להגדיר גיל יעד מדויק, אזורי פעילות, מחירון והצעת ערך לפי משוב מפיילוט.<\/li>\n<\/ul>\n<h2>5 | פורמטים לתוכן דיגיטלי<\/h2>\n<ul>\n<li><strong>״משחקים עם קים״<\/strong> — משחק קצר שאפשר לעשות בבית או בגן.<\/li>\n<li><strong>״אתגר קים״<\/strong> — אתגר תנועה או קואורדינציה שהצופים מוזמנים לנסות.<\/li>\n<li><strong>״קים משתגעת״<\/strong> — רגעים קומיים, שטויות ותנועה חופשית.<\/li>\n<li><strong>סרטון היכרות:<\/strong> ״אני קים, ובאתי לבדוק דבר אחד... אתם יודעים לשחק?״ ומיד אתגר.<\/li>\n<li><strong>קצב פתיחה:<\/strong> שלושה סרטונים בשבוע וסטוריז משלימים; התאמה לפלטפורמות ולהורים כקהל מפיץ.<\/li>\n<li>צילום ילדים לפרסום רק באישור מתאים של הורים/מסגרת, תוך שמירה על פרטיותם.<\/li>\n<\/ul>\n<h2>6 | מוצר ראשוני: המופע של קים משחקים<\/h2>\n<p>מופע אינטראקטיבי של כ־40–50 דקות: כניסה וקריאת פתיחה, משחק תנועה, אתגר, משחק מצחיק, ריקוד או קטע מוזיקלי וסיום עם הסלוגן. המופע צריך לאפשר ריצה, קפיצה, השתתפות ואלתור בהתאם לקהל.<\/p>\n<p><strong>ערוצי פיילוט:<\/strong> יום הולדת, גן, קייטנה או אירוע משפחות קטן. יש למדוד השתתפות, חזרתיות של משפטים, תגובות ילדים ובקשות להמשך.<\/p>\n<h2>7 | תוכנית השקה — 30 יום<\/h2>\n<table>\n<thead>\n<tr>\n<th>שבוע<\/th>\n<th>שלב<\/th>\n<th>מה עושים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>גיבוש<\/td>\n<td>לחדד אופי דמות, סלוגן, תנועת יד, שלוש פינות תוכן ולוק; לצלם 5–6 ניסיונות פרטיים<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>עלייה לאוויר<\/td>\n<td>לפתוח ערוצי מותג, לפרסם כ־3 סרטונים ולבדוק תגובות ותפקוד מול מצלמה<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>פיילוט שטח<\/td>\n<td>לבצע הפעלה ראשונה, לתעד בכפוף להסכמות ולבחון מה הילדים אוהבים<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>אריזה עסקית<\/td>\n<td>לנסח הצעת מופע, ליצור חומר שיווקי ראשוני ולפנות לגופים רלוונטיים<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>8 | סדר השקעות מומלץ<\/h2>\n<p>להתחיל במיתוג בסיסי, אביזרי תלבושת, תוכן ופיילוט. לא להתחייב בשלב ראשון לקליפ יקר, שיר בהפקה גדולה, אתר מורכב, מרצ׳נדייז או ניהול אישי. שיר מקורי, כוריאוגרפיה ומוצרים נוספים הם שלב הרחבה לאחר אימות ביקוש.<\/p>\n<h2>9 | החלטות פתוחות ליועץ ולמשווק<\/h2>\n<ul>\n<li>גילאי היעד וההבדל בין תוכן לילדים לבין שיווק להורים.<\/li>\n<li>שם המשתמשים, זמינות דומיין, בדיקת סימן מסחר ובידול חזותי.<\/li>\n<li>מודל הכנסות: הופעות, הפעלות, אירועי מוסדות, תוכן ממומן בעתיד.<\/li>\n<li>תמחור, עלויות הפקה, ציוד, ביטוח ואישורים נדרשים.<\/li>\n<li>מסלול לקוחות ראשון, תהליך הזמנה ומדדי הצלחה ל־90 יום.<\/li>\n<li>תקציב ריאלי לתלבושת, צילום, עריכה וקידום ממומן.<\/li>\n<\/ul>\n<h2>10 | הצעד הבא<\/h2>\n<p>להפיק סרטון פיילוט אחד ולסגור סקיצת תלבושת ולוגו. לאחר מכן לערוך פגישת מיקוד עם היועץ העסקי והמשווק על בסיס המסמך, לתעד החלטות ולבנות תוכנית 90 יום עם תקציב ואחריות לביצוע.<\/p>"}, "docs/02-show-script.md": {"title": "המופע של קים משחקים — תסריט עבודה מלא", "html": "<h1>המופע של קים משחקים — תסריט עבודה מלא<\/h1>\n<blockquote>\n<p><strong>מדריך הבמה שלך לחזרות ולהופעה.<\/strong>\nגרסת הבסיס: 45 דקות, גילאי 5–6 (גן חובה וכיתה א׳). הגרסאות לגילאי 3–4 ו־7–8 מופיעות בפרק 11.\nהקובץ כתוב אלייך, קים. השורות שמסומנות <strong>קים:<\/strong> הן מה שאת אומרת לילדים.<\/p>\n<\/blockquote>\n<h2>איך עובדים עם הקובץ הזה<\/h2>\n<ol>\n<li><strong>קראי פעם אחת הכל, בקול.<\/strong> זה ייקח בערך שעה. אל תנסי לזכור, רק להכיר.<\/li>\n<li><strong>סמני כל משפט שלא יושב לך טוב בפה, ותכתבי אותו מחדש במילים שלך.<\/strong> התסריט הוא בסיס ולא טקסט קדוש. ארבעה דברים כן צריכים להישאר קבועים: שם המשחק, ההסבר הקצר, החוקים ומשפט המעבר.<\/li>\n<li><strong>עבדי לפי תוכנית החזרות<\/strong> (פרק 12). שלושה שבועות, ממש שלב אחרי שלב.<\/li>\n<li><strong>ביום ההופעה<\/strong> מספיק לך <strong>דף הבמה<\/strong> (פרק 14) מודפס ומודבק על הרמקול.<\/li>\n<li><strong>אחרי כל הופעה<\/strong> ממלאים את <a href=\"05-pilot-feedback.md\">טופס המשוב לפיילוט<\/a>. הוא קובע מה משנים בפעם הבאה.<\/li>\n<\/ol>\n<h2>תוכן עניינים<\/h2>\n<ol>\n<li>המופע במשפט אחד ו־9 חוקי זהב<\/li>\n<li>הסימנים הקבועים של קים<\/li>\n<li>מבנה המופע ועקומת האנרגיה<\/li>\n<li>לפני שהמופע מתחיל (30 הדקות שלפני)<\/li>\n<li>התסריט המלא, קטע אחרי קטע<\/li>\n<li>ארגז כלים: איך מחזירים קשב בלי לצעוק<\/li>\n<li>מצבים מיוחדים: מה עושים כש...<\/li>\n<li>מוזיקה: רצועות, קצב וזכויות<\/li>\n<li>צ׳קליסט בטיחות<\/li>\n<li>ציוד ועלויות (הערכה)<\/li>\n<li>גרסאות לפי גיל: 3–4, 5–6, 7–8<\/li>\n<li>תוכנית חזרות<\/li>\n<li>בנק משחקים חלופיים<\/li>\n<li>דף במה להדפסה<\/li>\n<li>מקורות ודברים לבדוק<\/li>\n<\/ol>\n<hr />\n<h2>1. המופע במשפט אחד ו־9 חוקי זהב<\/h2>\n<p><strong>המופע במשפט אחד:<\/strong> קים מגיעה ״לבדוק אם הילדים יודעים לשחק״, ובמשך 45 דקות הם מוכיחים לה שכן. הם קופצים, קופאים, צוחקים, מצילים אותה כשהיא ״משתגעת״, עובדים כצוות ורוקדים, ובסוף מגיעה הקריאה הכי חזקה של היום: ״עם קים — כולם משחקים!״<\/p>\n<h3>9 חוקי הזהב<\/h3>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>החוק<\/th>\n<th>מה זה אומר בפועל<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>אין צופים, יש שחקנים<\/strong><\/td>\n<td>בכל רגע רוב הילדים זזים. ילד/ה שעולה לבמה לבד נשאר/ת שם עד 60 שניות, ובזמן הזה כל השאר עושים משהו: מתופפים על הברכיים, סופרים או מחקים.<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>מראה, לא מסבירה<\/strong><\/td>\n<td>כל משחק מוסבר בפחות מ־20 שניות לפי הנוסחה: <strong>שם המשחק<\/strong> במשפט אחד, <strong>הדגמה<\/strong> אחת, <strong>סיבוב ניסיון<\/strong>, ויוצאים לדרך. אם את מסבירה יותר מ־20 שניות, איבדת אותם.<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>אין מפסידים<\/strong><\/td>\n<td>אף ילד/ה לא ״נפסל/ת״ ולא יושב/ת בצד. טעות היא ״אופס!״ וממשיכים לשחק.<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><strong>גל אנרגיה<\/strong><\/td>\n<td>אחרי כל שיא באה ירידה. ילדים לא מחזיקים 45 דקות על 100%, וגם את לא.<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><strong>לא צועקים, מנמיכים<\/strong><\/td>\n<td>כשרועש, את מדברת <strong>בשקט יותר<\/strong>, לא חזק יותר (פרק 6).<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><strong>הגוף של הילדים שייך להם<\/strong><\/td>\n<td>לא מרימים ילדים, לא מסובבים אותם ולא מושכים ביד. מגע רק כשהילד/ה בוחר/ת: כיף, אגרוף או נפנוף.<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td><strong>מבוגר מהמקום נשאר בחדר<\/strong><\/td>\n<td>את מובילה את המשחק, והאחריות על הילדים (שירותים, בכי, פציעה) נשארת אצל הצוות או ההורים. סוגרים את זה מראש (פרק 4).<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td><strong>צוחקים על קים, אף פעם לא על ילד<\/strong><\/td>\n<td>קים נכשלת, מתבלבלת ונתקעת, והילדים מצילים אותה. אף פעם לא מצחיקים את הקהל על חשבון ילד/ה ספציפי/ת.<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td><strong>תנועה שילד/ה ממציא/ה = תנועה במקום<\/strong><\/td>\n<td>בכל פעם שילד/ה בוחר/ת תנועה שכל החדר מחקה (עוזרים, קפטנים, צד ממוצא בקובייה, תנועה חמישית בריקוד): <strong>תנועה במקום, בתוך הבועה: בלי לשכב, בלי להתגלגל, בלי גלגלון/עמידת ידיים/שפגט, בלי לקפוץ מגובה ובלי לגעת באחרים.<\/strong> ילד/ה מציע/ה משהו מסוכן? לא אומרים ״לא״, מתרגמים לגרסה בטוחה: ״וואו, גלגלון! בגרסה של קים עושים אותו רק עם הידיים — כולם מגלגלים ידיים!״<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>2. הסימנים הקבועים של קים<\/h2>\n<p>אלה ה״כלים״ שחוזרים לאורך כל המופע. מלמדים אותם בדקות 3–6, ואחר כך הם עושים בשבילך את העבודה.<\/p>\n<table>\n<thead>\n<tr>\n<th>סימן<\/th>\n<th>איך זה נראה<\/th>\n<th>מתי משתמשים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>הקריאה<\/strong><\/td>\n<td>קים: ״עם קים...״ ← ילדים: ״כולם משחקים!״<\/td>\n<td>בפתיחה ובסיום, <strong>וגם כסימן עצירה<\/strong> לאורך כל המופע: עונים וקופאים<\/td>\n<\/tr>\n<tr>\n<td><strong>תנועת היד<\/strong><\/td>\n<td>״ה־V של קים״, לפי ההחלטה הסופית ב<a href=\"14-character-bible.md\">ספר הדמות<\/a> (פרק 4.1): ב״עם קים...״ <strong>יד ימין<\/strong> פתוחה מאחורי האוזן הימנית (״אני מקשיבה״), ואז <strong>שנייה וחצי של שקט<\/strong> כדי שהילדים יענו. ב״כולם משחקים!״ שתי הידיים למעלה בצורת V, <strong>אצבעות פרושות כמו קרני שמש<\/strong>, וכולם קופאים לשתי שניות.<\/td>\n<td>עם כל קריאה<\/td>\n<\/tr>\n<tr>\n<td><strong>קו הבמה<\/strong><\/td>\n<td>פס סרט הדבקה צבעוני על הרצפה, כ־2–3 מטר לפני השורה הראשונה. מעבר לקו זו ״הבמה של קים״, ועוברים אותו רק בהזמנה. <strong>בחוץ<\/strong> (דשא, חול) סרט לא נדבק: מסמנים את הקו בצלחות סימון שטוחות או קונוסים נמוכים, לא בסרט ולא בחבל.<\/td>\n<td>מסבירים בקטע 2<\/td>\n<\/tr>\n<tr>\n<td><strong>בועת קים<\/strong><\/td>\n<td>״ידיים לצדדים כמו מטוס. נגעת במישהו? צעד הצידה.״<\/td>\n<td>לפני כל משחק בעמידה<\/td>\n<\/tr>\n<tr>\n<td><strong>״אופס!״ — ״לא נורא!״<\/strong><\/td>\n<td>מי שטעה או הפיל אומר ״אופס!״ עם ידיים על הלחיים, וכולם עונים ״לא נורא!״<\/td>\n<td>בכל משחק שיש בו טעויות<\/td>\n<\/tr>\n<tr>\n<td><strong>התופים של קים<\/strong><\/td>\n<td>הילדים מתופפים על הברכיים, ״תררררר...״<\/td>\n<td>בזמני המתנה: כשזורקים את הקובייה או כשמתנדב/ת עולה<\/td>\n<\/tr>\n<tr>\n<td><strong>פסל!<\/strong><\/td>\n<td>המוזיקה נעצרת או קים אומרת ״פסל!״, וכולם קופאים<\/td>\n<td>בקטע 4, ואחר כך ככלי להחזרת קשב<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>3. מבנה המופע ועקומת האנרגיה<\/h2>\n<table>\n<thead>\n<tr>\n<th>דקות<\/th>\n<th>#<\/th>\n<th>קטע<\/th>\n<th>אנרגיה<\/th>\n<th>רצועה<\/th>\n<th>ציוד<\/th>\n<th>מה הילדים עושים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0:00–3:00<\/td>\n<td>1<\/td>\n<td>כניסה: ״אתם יודעים לשחק?״<\/td>\n<td>█████<\/td>\n<td>01<\/td>\n<td>—<\/td>\n<td>עונים, נוגעים באף ובברך<\/td>\n<\/tr>\n<tr>\n<td>3:00–6:00<\/td>\n<td>2<\/td>\n<td>הקריאה הסודית<\/td>\n<td>████<\/td>\n<td>—<\/td>\n<td>סרט רצפה<\/td>\n<td>לומדים את הקריאה ואת העצירה<\/td>\n<\/tr>\n<tr>\n<td>6:00–13:00<\/td>\n<td>3<\/td>\n<td>קים אומרת<\/td>\n<td>█████<\/td>\n<td>02 (רקע)<\/td>\n<td>—<\/td>\n<td>עומדים וזזים במקום<\/td>\n<\/tr>\n<tr>\n<td>13:00–17:00<\/td>\n<td>4<\/td>\n<td>הפסל של קים<\/td>\n<td>██<\/td>\n<td>03<\/td>\n<td>שלט למוזיקה<\/td>\n<td>ריקוד איטי, קפיאה, מתיישבים<\/td>\n<\/tr>\n<tr>\n<td>17:00–25:00<\/td>\n<td>5<\/td>\n<td>קוביית קים<\/td>\n<td>████<\/td>\n<td>04<\/td>\n<td>קובייה רכה<\/td>\n<td>זורקים, וכולם מבצעים<\/td>\n<\/tr>\n<tr>\n<td>25:00–30:00<\/td>\n<td>6<\/td>\n<td>קים משתגעת<\/td>\n<td>████<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>מצילים את קים וצוחקים<\/td>\n<\/tr>\n<tr>\n<td>30:00–36:00<\/td>\n<td>7<\/td>\n<td>המסלול של קים<\/td>\n<td>███<\/td>\n<td>05<\/td>\n<td>כדורים רכים<\/td>\n<td>מעבירים כדור בשורות<\/td>\n<\/tr>\n<tr>\n<td>36:00–41:00<\/td>\n<td>8<\/td>\n<td>הריקוד של קים<\/td>\n<td>█████<\/td>\n<td>06<\/td>\n<td>—<\/td>\n<td>לומדים 4 תנועות ומובילים<\/td>\n<\/tr>\n<tr>\n<td>41:00–44:00<\/td>\n<td>9<\/td>\n<td>נשימה ותודה<\/td>\n<td>█<\/td>\n<td>07<\/td>\n<td>צעיפים (לא חובה)<\/td>\n<td>נושמים ומצביעים באגודל<\/td>\n<\/tr>\n<tr>\n<td>44:00–45:00<\/td>\n<td>10<\/td>\n<td>סיום ו״פסל אחרון״<\/td>\n<td>█████ ← █<\/td>\n<td>08<\/td>\n<td>מדבקות<\/td>\n<td>הקריאה הכי חזקה, ואז קופאים בשקט<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>למה דווקא הסדר הזה<\/h3>\n<ul>\n<li><strong>דקות 0–3, תופסים אותם.<\/strong> ב־30 השניות הראשונות הילדים מחליטים אם הם איתך.<\/li>\n<li><strong>דקות 3–6, קודם בונים את כלי השליטה ורק אחר כך את הבלגן.<\/strong> הקריאה הסודית היא ה״בלם״ שלך. אם תלמדי אותה לפני המשחק הפרוע, תוכלי לעצור אותו.<\/li>\n<li><strong>דקה 13, ירידה ראשונה.<\/strong> אחרי 7 דקות של קפיצות צריך לנשום, ו״הפסל״ הוא משחק שקט שהילדים לא מרגישים כמשהו שקט.<\/li>\n<li><strong>דקות 25–30, שיא הצחוק באמצע.<\/strong> בשלב הזה הקשב טבעית יורד, אז דווקא שם נכנס הקטע התיאטרלי שלך, שבו את הכי חזקה.<\/li>\n<li><strong>דקות 36–41, שיא אנרגיה אחרון<\/strong> שהילדים לוקחים איתם הביתה: הריקוד.<\/li>\n<li><strong>דקות 41–45, נחיתה רכה.<\/strong> הקריאה האחרונה חזקה וקצרה, ואחריה ״פסל אחרון״ שקט. <strong>הצוות יודה לך<\/strong> כשתשאירי להם קבוצה רגועה ולא מתפוצצת.<\/li>\n<\/ul>\n<hr />\n<h2>4. לפני שהמופע מתחיל (30 הדקות שלפני)<\/h2>\n<table>\n<thead>\n<tr>\n<th>מתי<\/th>\n<th>מה עושים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>כשיוצאים מהבית<\/strong><\/td>\n<td><strong>מגיעים כבר בתלבושת, עם שכבה מעליה<\/strong> (קפוצ׳ון ומכנסיים ארוכים, הקוקו בתוך כובע). מורידים את השכבה רק רגע לפני הכניסה. <strong>אף פעם לא מחליפים בגדים בשירותים של הילדים או בחדר שילדים יכולים להיכנס אליו.<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>30 דק׳ לפני<\/strong><\/td>\n<td>מגיעים. עושים <strong>סיבוב בטיחות<\/strong> (צ׳קליסט בפרק 9). מזיזים מה שצריך.<\/td>\n<\/tr>\n<tr>\n<td><strong>25 דק׳ לפני<\/strong><\/td>\n<td>מדביקים את <strong>קו הבמה<\/strong> (בחוץ: מניחים צלחות סימון). מציבים רמקול <strong>גבוה ויציב<\/strong>, מחוץ להישג יד של ילדים. בודקים שהשלט עובד. עוברים על הפלייליסט.<\/td>\n<\/tr>\n<tr>\n<td><strong>20 דק׳ לפני<\/strong><\/td>\n<td>שמים את כל הציוד ב<strong>תיק סגור מאחורייך<\/strong>. כל אביזר שהילדים לא רואים הוא הפתעה, וגם אף אחד לא חוטף אותו.<\/td>\n<\/tr>\n<tr>\n<td><strong>15 דק׳ לפני<\/strong><\/td>\n<td><strong>תדריך של דקה לאחראי/ת<\/strong> (נוסח למטה).<\/td>\n<\/tr>\n<tr>\n<td><strong>10 דק׳ לפני<\/strong><\/td>\n<td>הילדים מתיישבים <strong>בחצי עיגול מול הקו<\/strong> (הצוות מושיב אותם). מתנגנת מוזיקת קבלת פנים חלשה (רצועה 00). את כבר לא נראית (ואם אין לאן לצאת, ראי ״ואם הילדים בחדר״ למטה).<\/td>\n<\/tr>\n<tr>\n<td><strong>2 דק׳ לפני<\/strong><\/td>\n<td><strong>הטקס שלך:<\/strong> 3 נשימות עמוקות, 3 קפיצות, ולחישה לעצמך ״עם קים — כולם משחקים״. מורידים את השכבה העליונה. נכנסים.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>ואם הילדים בחדר כל הבוקר?<\/strong> בגן זה המצב הרגיל. לכן בשיחת ההזמנה שואלים: ״אפשר שהילדים יהיו בחצר או בחדר אחר ב־15 הדקות של ההכנה?״ (צ׳קליסט בפרק 9 א׳). אם לא, מתארגנים בגלוי, כ״קים בלי תלבושת״ (השכבה העליונה עלייך), ומשתמשים בכניסה של <strong>״אין איפה להתחבא״<\/strong> (קטע 1). זה עובד מצוין גם ככה.<\/p>\n<h3>תדריך של דקה לאחראי/ת (גננת, מדריכה ראשית, ההורה המארח)<\/h3>\n<blockquote>\n<p>״היי, אני קים, נעים מאוד. שלושה דברים קטנים לפני שמתחילים:\n<strong>אחד<\/strong>, אני צריכה שמבוגר/ת אחד/ת לפחות יישאר/תישאר בחדר כל הזמן. אני מובילה את המשחק, אבל האחריות על הילדים נשארת אצלכם.\n<strong>שתיים<\/strong>, אם ילד/ה צריך/ה שירותים, בוכה או לא מרגיש/ה טוב, אני אסמן לך ואת/ה תטפל/י. אני ממשיכה עם הקבוצה.\n<strong>שלוש<\/strong>, לגבי צילום: אני לא מצלמת ילדים בלי אישור הורים חתום. אם אין אישורים, אני מצלמת רק את עצמי או מאחור, בלי פנים. יש ילד/ה שחשוב שאדע עליו/ה משהו, למשל רגישות לרעש או קושי בתנועה? מישהו חוגג היום?\nועוד משהו קטן: ילד/ה שלא רוצה להשתתף יכול/ה פשוט לשבת לידך ולהסתכל. זה לגמרי בסדר. תודה!״<\/p>\n<\/blockquote>\n<p>רוב השאלות האלה צריכות להישאל כבר <strong>בשיחת ההזמנה<\/strong> (ראי <a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>). התדריך הוא תזכורת אחרונה.<\/p>\n<hr />\n<h2>5. התסריט המלא, קטע אחרי קטע<\/h2>\n<p><strong>איך לקרוא את התסריט:<\/strong> הטקסט ב<strong>מודגש<\/strong> אחרי ״קים:״ הוא מה שאת אומרת. <em>טקסט נטוי בסוגריים<\/em> הוא הוראות במה או תגובות הילדים.<\/p>\n<hr />\n<h3>קטע 1 — כניסה: ״אתם יודעים לשחק?״ · 0:00–3:00 · אנרגיה █████<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מטרה<\/strong><\/td>\n<td>לתפוס את כל העיניים ב־30 השניות הראשונות ולקבוע מההתחלה: כאן משחקים, לא צופים<\/td>\n<\/tr>\n<tr>\n<td><strong>מיקום ילדים<\/strong><\/td>\n<td>יושבים בחצי עיגול מול קו הבמה<\/td>\n<\/tr>\n<tr>\n<td><strong>מוזיקה<\/strong><\/td>\n<td>רצועה 01, ״כניסה״. מתחילה כשאת עוד לא נראית, ומנמיכים אותה כשאת מדברת<\/td>\n<\/tr>\n<tr>\n<td><strong>ציוד<\/strong><\/td>\n<td>אין. הכל מחכה בתיק<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>התסריט:<\/strong><\/p>\n<blockquote>\n<p><em>(המוזיקה מתחילה. קים מחוץ לחדר, מאחורי דלת או מאחורי עמוד, ורק הקול שלה נשמע.)<\/em><\/p>\n<p><strong>קים:<\/strong> ״הלו? הלו־הלו? יש פה ילדים?״<\/p>\n<p><em>(ילדים: ״כן!״)<\/em><\/p>\n<p><strong>קים:<\/strong> ״מה? לא שומעת! יש — פה — ילדים?!״<\/p>\n<p><em>(ילדים: ״כן!!!״)<\/em><\/p>\n<p><strong>קים:<\/strong> ״ו... יש פה ילדים שיודעים לשחק?!״<\/p>\n<p><em>(ילדים: ״כן!!!״)<\/em><\/p>\n<p><em>(קים נכנסת בריצה קלה לאורך קו הבמה, לא דרך הילדים, ונעצרת במרכז בתנוחת ״טה־דה!״. המוזיקה יורדת לרקע.)<\/em><\/p>\n<p><strong>קים:<\/strong> ״היי! אני קים! ובאתי לבדוק דבר אחד. רק אחד. <em>(מתקרבת ולוחשת)<\/em> אתם... יודעים... לשחק?״<\/p>\n<p><em>(ילדים: ״כן!״)<\/em><\/p>\n<p><strong>קים:<\/strong> <em>(חשדנית)<\/em> ״באמת? כי סיפרו לי שפה יש ילדים שרק יושבים ומסתכלים. אני חייבת לבדוק. מבחן ראשון: מי שיודע לשחק, שיגע באף!״<\/p>\n<p><em>(כולם נוגעים באף)<\/em><\/p>\n<p><strong>קים:<\/strong> ״אוקיי... מי שיודע לשחק, שיגע בברך! ...מי שיודע לשחק, שיגע בראש. בראש של עצמו! לא של השכן!״<\/p>\n<p><strong>קים:<\/strong> ״ומבחן אחרון, הכי קשה שיש: מי שיודע לשחק, שיגע באף... עם הברך!״<\/p>\n<p><em>(קים מנסה בעצמה, מתנדנדת ו״נכשלת״ בהומור. בשליטה, בלי ליפול באמת.)<\/em><\/p>\n<p><strong>קים:<\/strong> ״טוב, את זה גם אני לא יודעת. <em>(מתיישרת, טון רשמי)<\/em> אני מכריזה: עברתם! אתם רשמית שחקנים של קים. אבל רגע... לשחקנים של קים יש קריאה סודית. רוצים לדעת מה היא?״<\/p>\n<\/blockquote>\n<p><strong>אם הילדים שקטים או ביישנים בהתחלה:<\/strong> אל תגידי ״לא שומעת!״ יותר מפעמיים. במקום זה: <strong>״רגע... אולי אין פה אף אחד? <em>(מציצה)<\/em> אה! יש פה מלא ילדים! שקטים כמו דגים!״<\/strong> ותעשי פרצוף של דג. צחוק שובר את הקרח מהר יותר מצעקה.<\/p>\n<p><strong>אם אין איפה להתחבא<\/strong> (או שהילדים ראו אותך מתארגנת): עמדי בצד החדר עם הגב לקהל, ״קפואה״, כשהמוזיקה מתחילה. ב״הלו? יש פה ילדים?״ תסתובבי בבת אחת.<\/p>\n<p><strong>גיל 3–4:<\/strong> בלי כניסה מפתיעה מבחוץ ובלי צעקות, כי חלק מהקטנים נבהלים. נכנסים לאט, מציצים, ״קוקו!״, ומדברים ברכות.<\/p>\n<p><strong>משפט מעבר:<\/strong> ״לשחקנים של קים יש קריאה סודית. רוצים לדעת מה היא?״<\/p>\n<hr />\n<h3>קטע 2 — הקריאה הסודית · 3:00–6:00 · אנרגיה ████<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מטרה<\/strong><\/td>\n<td>ללמד את ״עם קים... כולם משחקים!״ <strong>ולהפוך אותה לסימן עצירה<\/strong> שישרת אותך כל המופע. זה הקטע הכי חשוב לשליטה בקבוצה, אל תדלגי עליו.<\/td>\n<\/tr>\n<tr>\n<td><strong>מיקום ילדים<\/strong><\/td>\n<td>יושבים, ובסוף הקטע קמים<\/td>\n<\/tr>\n<tr>\n<td><strong>מוזיקה<\/strong><\/td>\n<td>אין. שקט עוזר להקשיב.<\/td>\n<\/tr>\n<tr>\n<td><strong>ציוד<\/strong><\/td>\n<td>קו הבמה (כבר מודבק)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>ההסבר (עד 20 שניות):<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״כשאני אומרת ׳עם קים...׳, אתם עונים ׳כולם משחקים!׳ ומרימים ידיים ככה <em>(V)<\/em>. ננסה? עם קים...״<\/p>\n<\/blockquote>\n<p><strong>התסריט:<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״עם קים...״<\/p>\n<p><em>(ילדים: ״כולם משחקים!״)<\/em><\/p>\n<p><strong>קים:<\/strong> ״לא רע! עכשיו בלחישה. <em>(לוחשת)<\/em> עם קים...״<\/p>\n<p><strong>קים:<\/strong> ״עכשיו כמו רובוטים. עם. קים...״<\/p>\n<p><strong>קים:<\/strong> ״כמו זמרת אופרה! <em>(שרה באופרה)<\/em> עם קייייים...״<\/p>\n<p><strong>קים:<\/strong> ״כמו עכבר קטנטן... ועכשיו כמו אריה! עם קים...״<\/p>\n<p><strong>קים:<\/strong> ״ובהילוך איטי... ע־ע־ם... ק־י־ם...״<\/p>\n<p><strong>קים:<\/strong> ״ועכשיו מבחן אמיתי. אני רוצה רעש. הכי הרבה רעש שיש, אבל מהמקום! אחת, שתיים, שלוש... רעש!״<\/p>\n<p><em>(3–4 שניות של רעש)<\/em><\/p>\n<p><strong>קים:<\/strong> <em>(בקול רגיל, לא צועקת)<\/em> ״עם קים...״<\/p>\n<p><em>(ילדים: ״כולם משחקים!״ וקופאים)<\/em><\/p>\n<p><strong>קים:<\/strong> ״וואו! ראיתם מה קרה פה? זה הקסם שלנו. בכל פעם שאני אומרת ׳עם קים׳, לא משנה מה עשיתם, עונים, מרימים ידיים וקופאים. אז מה עושים?״<\/p>\n<p><em>(ילדים: ״עונים וקופאים!״)<\/em><\/p>\n<p><strong>קים:<\/strong> ״עכשיו אפשר להתחיל באמת. כולם לקום!״<\/p>\n<p><strong>קים:<\/strong> <em>(מצביעה על הקו)<\/em> ״רואים את הקו הזה? זה הקו הקסום. מפה והלאה זאת הבמה, המקום שבו אני משתגעת. ופה, מאחורי הקו, זה המקום הבטוח שלכם. את הקו עוברים רק כשקים מזמינה.״<\/p>\n<p><strong>קים:<\/strong> ״ועכשיו בועות. ידיים לצדדים, כמו מטוס... מי שנוגע במישהו, צעד הצידה. זאת הבועה שלכם, ובתוך הבועה מותר הכל!״<\/p>\n<\/blockquote>\n<p><strong>אם הם לא קופאים במבחן:<\/strong> ״עוד פעם אחת. הפעם אני אתפוס מי ממשיך לעשות רעש...״ ונסי שוב <strong>פעם אחת בלבד<\/strong>. אם עדיין לא עובד, ממשיכים הלאה ומתרגלים את זה שוב במהלך קטע 3.<\/p>\n<p><strong>קבוצה גדולה או חדר צפוף:<\/strong> הבועה קטנה יותר: ״ידיים כמו כנפיים של ציפור קטנה״.<\/p>\n<p><strong>משפט מעבר:<\/strong> ״בתוך הבועה מותר הכל... אז בואו נבדוק אם אתם יודעים להקשיב לקים.״<\/p>\n<hr />\n<h3>קטע 3 — ״קים אומרת״ · 6:00–13:00 · אנרגיה █████<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מטרה<\/strong><\/td>\n<td>שחרור אנרגיה, הקשבה ו״לתפוס״ את כל הקבוצה בתנועה משותפת<\/td>\n<\/tr>\n<tr>\n<td><strong>מיקום ילדים<\/strong><\/td>\n<td>עומדים, כל אחד בבועה שלו. <strong>זזים רק במקום<\/strong>, בלי ריצות בחדר<\/td>\n<\/tr>\n<tr>\n<td><strong>מוזיקה<\/strong><\/td>\n<td>רצועה 02, קצב רקע חלש מתחת לקול שלך (לא חובה)<\/td>\n<\/tr>\n<tr>\n<td><strong>ציוד<\/strong><\/td>\n<td>אין<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>ההסבר (עד 20 שניות):<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״המשחק נקרא ׳קים אומרת׳. אם אני אומרת ׳קים אומרת: קופצים!׳, קופצים. אם אני אומרת רק ׳קופצים!׳, בלי ׳קים אומרת׳, לא זזים! ניסיון: קים אומרת: מחאו כפיים! <em>(כולם מוחאים)<\/em> ...מחאו כפיים! <em>(חלק מוחאים)<\/em> אה־הא! תפסתי!״<\/p>\n<\/blockquote>\n<p><strong>חוקי המשחק:<\/strong><\/p>\n<ol>\n<li>עושים את התנועה רק כשיש ״קים אומרת״ לפניה.<\/li>\n<li>מי שנתפס/ה אומר/ת <strong>״אופס!״<\/strong> עם ידיים על הלחיים, כולם עונים <strong>״לא נורא!״<\/strong>, וממשיכים לשחק. <strong>אף אחד לא יוצא.<\/strong><\/li>\n<li>כל התנועות נעשות <strong>בתוך הבועה<\/strong>.<\/li>\n<li>בסיבוב האחרון מוזמנים <strong>1–2 ״עוזרים של קים״<\/strong> לבמה, והם בוחרים תנועה <strong>שעושים במקום<\/strong> (חוק זהב 9).<\/li>\n<\/ol>\n<p><strong>התסריט: ארבעה סיבובים<\/strong><\/p>\n<p><strong>סיבוב 1, חימום (כ־1.5 דקות, קל):<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״קים אומרת: תגעו באף! ...קים אומרת: תגעו בכתפיים! ...קים אומרת: שלוש כפיים! ...קים אומרת: פרצוף של לימון חמוץ! ...עוד יותר חמוץ! <em>(פאוזה)<\/em> ...תשבו!״<\/p>\n<p><em>(מי שהתיישב:)<\/em> ״אופס!״ <em>(כולם:)<\/em> ״לא נורא!״<\/p>\n<\/blockquote>\n<p><strong>סיבוב 2, תנועה גדולה (כ־2 דקות):<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״קים אומרת: קופצים כמו צפרדע, במקום! ...קים אומרת: רצים במקום הכי מהר שיש! ...קים אומרת: הולכים כמו פינגווין, במקום! ...קים אומרת: שוחים באוויר! ...עכשיו גב! <em>(בלי ׳קים אומרת׳)<\/em>״<\/p>\n<\/blockquote>\n<p><strong>הטריק שלך:<\/strong> עשי את התנועה בעצמך בלי להגיד ״קים אומרת״. הילדים מחקים את הגוף שלך, וזה מצחיק אותם בכל פעם מחדש.<\/p>\n<p><strong>סיבוב 3, תרגילים מבלבלים (כ־2 דקות, מהר יותר):<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״קים אומרת: ידיים למעלה! ...ועכשיו למטה! <em>(מלכודת)<\/em>״<\/p>\n<p><strong>קים:<\/strong> ״קים <strong>אמרה<\/strong>: קופצים! <em>(מלכודת, כי זה לא ׳קים אומרת׳)<\/em>״<\/p>\n<p><strong>קים:<\/strong> ״קים אומרת: אל תזוזו! <em>(פאוזה ארוכה ומצחיקה, קים עושה פרצופים)<\/em> ...יופי. אתם קשוחים.״<\/p>\n<p><strong>קים:<\/strong> ״קים אומרת: כולם צועקים ׳קים לא תתפוס אותי!׳ ...נראה.״<\/p>\n<p><strong>קים:<\/strong> <em>(כשהרבה ילדים נתפסים)<\/em> ״אופס! תפסתי חצי חדר! אתם ערמומיים מדי, אני צריכה טריק חדש...״<\/p>\n<\/blockquote>\n<p><strong>סיבוב 4, הילדים מובילים (כ־1.5 דקות):<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״אני צריכה עוזרים. מי עומד הכי כמו פסל? <em>(מזמינה 1–2 ילדים לעבור את הקו)<\/em> מה התנועה שלך? משהו שעושים במקום, בתוך הבועה! <em>(הילד/ה מראה. קים בודקת לפי חוק זהב 9 לפני שכולם מחקים)<\/em> קים אומרת: כולם עושים את התנועה של העוזר שלי!״<\/p>\n<\/blockquote>\n<p><strong>אם העוזר/ת מראה משהו מסוכן<\/strong> (גלגלון, עמידת ידיים, שפגט, הפלה לרצפה, קפיצה מכיסא), לא מוותרים עליו/ה ולא אומרים ״לא״. מתרגמים מיד, לפני שכולם מחקים:<\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״וואו, גלגלון! בגרסה של קים עושים אותו רק עם הידיים — כולם מגלגלים ידיים!״<\/p>\n<p><em>(עמידת ידיים ← ״ידיים למעלה והרגליים מתות לעלות, אבל נשארות על הרצפה!״ · שפגט ← ״פסיעה ענקית במקום!״)<\/em><\/p>\n<\/blockquote>\n<p>כל עוזר/ת נשאר/ת על הבמה <strong>סיבוב אחד בלבד<\/strong> (עד 60 שניות) וחוזר/ת למקום עם מחיאות כפיים מכולם.<\/p>\n<p><strong>סיום הקטע:<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״קים אומרת: קופאים כמו פסל! <em>(כולם קופאים)<\/em> ...רגע. פסלים? <em>(מסתכלת סביב)<\/em> מה זה פה, מוזיאון?!״<\/p>\n<\/blockquote>\n<p><strong>אם זה לא עובד:<\/strong><\/p>\n<ul>\n<li><strong>הילדים לא מבינים את המלכודת:<\/strong> תוותרי על המלכודות ותעברי ל״עשו כמוני״ (חיקוי פשוט). זה טבעי לגמרי בגילאים הצעירים.<\/li>\n<li><strong>פרוע מדי:<\/strong> ״קים אומרת: שבו!״ ותמשיכי בישיבה, עם תנועות של ידיים ופנים בלבד.<\/li>\n<li><strong>משעמם להם:<\/strong> תקצרי, תעלי קצב ותגיעי מהר לסיבוב 4.<\/li>\n<\/ul>\n<p><strong>גרסה קצרה (4 דק׳):<\/strong> סיבובים 2 ו־4. <strong>גרסה ארוכה (9 דק׳):<\/strong> להוסיף סיבוב ״קים אומרת בלחישה״, שבו כל ההוראות נאמרות בלחישה.<\/p>\n<p><strong>משפט מעבר:<\/strong> ״פסלים? מה זה פה, מוזיאון?!״<\/p>\n<hr />\n<h3>קטע 4 — הפסל של קים · 13:00–17:00 · אנרגיה ██<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מטרה<\/strong><\/td>\n<td><strong>הורדת אנרגיה בלי שהילדים ירגישו.<\/strong> תרגול עצירה ושליטה עצמית, והרבה צחוק שקט<\/td>\n<\/tr>\n<tr>\n<td><strong>מיקום ילדים<\/strong><\/td>\n<td>עומדים בבועה, ובסוף מתיישבים<\/td>\n<\/tr>\n<tr>\n<td><strong>מוזיקה<\/strong><\/td>\n<td>רצועה 03, איטית ומצחיקה. <strong>את עוצרת ומפעילה אותה עם השלט<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>ציוד<\/strong><\/td>\n<td>שלט Bluetooth לטלפון (או טלפון ביד)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>ההסבר (עד 20 שניות):<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״ברוכים הבאים למוזיאון של קים! כשיש מוזיקה, רוקדים לאט־לאט, כמו בהילוך איטי. כשהמוזיקה נעצרת, קופאים כמו פסל. אני השומרת של המוזיאון, ואני אנסה להצחיק אתכם. <strong>בלי לגעת!<\/strong> מי שצוחק — עוזר לי לשמור עד הסבב הבא!״<\/p>\n<\/blockquote>\n<p><strong>חוקי המשחק:<\/strong><\/p>\n<ol>\n<li>יש מוזיקה: רוקדים בהילוך איטי, בתוך הבועה.<\/li>\n<li>אין מוזיקה: קופאים.<\/li>\n<li>השומרת (קים) מנסה להצחיק עם פרצופים, קולות ובדיחות, <strong>בלי לגעת ובמרחק של יד לפחות.<\/strong><\/li>\n<li>מי שצחק/ה עוזר/ת לשומרת <strong>עד סוף הסבב<\/strong>: מנסה להצחיק אחרים <strong>מהמקום שלו/ה, בלי לגעת ובלי להסתובב בין הילדים.<\/strong> בכל פעם שהמוזיקה חוזרת, <strong>כולם שוב פסלים.<\/strong> ככה אף אחד לא ״יוצא״, וגם בגיל 5–6, שבו רוב הילדים צוחקים כבר בעצירה הראשונה, אפשר לשחק את כל ארבעת הסבבים.<\/li>\n<\/ol>\n<p><strong>התסריט:<\/strong><\/p>\n<blockquote>\n<p><em>(מוזיקה. כולם רוקדים לאט. קים עוצרת את המוזיקה עם השלט.)<\/em><\/p>\n<p><strong>קים:<\/strong> <em>(בטון של מדריכה במוזיאון)<\/em> ״שלום, ברוכים הבאים למוזיאון. כל השורה הזאת: אוסף נדיר של ׳ילדים שאכלו לימון׳. מרשים מאוד. ושם, כל הצד ההוא: ׳ילדים שראו ג׳וק׳. <em>(מתקרבת לאט לשורה, שומרת מרחק)<\/em> אני רק בודקת אם הפסלים האלה אמיתיים... <em>(עיטוש ענק)<\/em> אפצ׳י!״<\/p>\n<p><em>(השמות של ה״פסלים״ תמיד על שורה, על צד או על כל הקבוצה, אף פעם לא על ילד/ה אחד/ת. חוק זהב 8.)<\/em><\/p>\n<p><strong>קים:<\/strong> ״מישהו פה זז? לא... אבל אני בטוחה שראיתי גבה זזה איפשהו בשורה הזאת!״<\/p>\n<p><em>(מוזיקה שוב)<\/em><\/p>\n<\/blockquote>\n<p><strong>סבבים עם נושא<\/strong> (3–4 עצירות, בכל אחת נושא אחר):<\/p>\n<table>\n<thead>\n<tr>\n<th>סבב<\/th>\n<th>קים אומרת לפני העצירה<\/th>\n<th>הבדיחה של השומרת<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>״פסלים רגילים!״<\/td>\n<td>״אפצ׳י!״ וגבה זזה<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>״פסלים של חיות!״<\/td>\n<td>״איזה יופי של ג׳ירפה... רגע, זה פיל? אולי פינגווין?״<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>״פסלים של גיבורי־על!״<\/td>\n<td>״אני רואה פה מלא כוחות־על... אבל מי יש לו כוח־על של לא לצחוק?״<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>״פסלים שנפלה להם הגלידה!״<\/td>\n<td>״אוי... זה עצוב... <em>(בוכה בכי מצחיק)<\/em> ...גם לי נפלה הגלידה פעם!״<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>סיום הקטע:<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״המוזיאון נסגר לערב. כל הפסלים... מתיישבים לנוח. לאט, לאט... כמו נוצה. <em>(כולם יושבים)<\/em> שקט במוזיאון...״<\/p>\n<\/blockquote>\n<p><strong>אם זה לא עובד:<\/strong><\/p>\n<ul>\n<li><strong>הם לא קופאים:<\/strong> קצרי את קטעי הריקוד ל־5–8 שניות. עצירות מהירות ומפתיעות עובדות טוב יותר.<\/li>\n<li><strong>השומרים נוגעים בילדים:<\/strong> ״עם קים...״ ← ״כולם משחקים!״ ואחר כך: ״שומרים אמיתיים לא נוגעים, רק פרצופים!״ ומיד מפעילים מוזיקה: <strong>כל השומרים חוזרים להיות פסלים<\/strong>, וסבב חדש מתחיל.<\/li>\n<\/ul>\n<p><strong>משפט מעבר:<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> <em>(מוציאה את הקובייה מאחורי הגב, לאט ובדרמה)<\/em> ״מישהו יודע מה זה?״<\/p>\n<\/blockquote>\n<hr />\n<h3>קטע 5 — קוביית קים · 17:00–25:00 · אנרגיה ████<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מטרה<\/strong><\/td>\n<td>אנרגיה גבוהה ומבוקרת, תורות, הפתעה. <strong>כל החדר זז בכל זריקה<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>מיקום ילדים<\/strong><\/td>\n<td>יושבים בזמן הזריקה וקמים לביצוע (או נשארים עומדים, לפי האנרגיה)<\/td>\n<\/tr>\n<tr>\n<td><strong>מוזיקה<\/strong><\/td>\n<td>רצועה 04, קצבית וחלשה ברקע. ״תופים״ עושים הילדים על הברכיים<\/td>\n<\/tr>\n<tr>\n<td><strong>ציוד<\/strong><\/td>\n<td>קובייה רכה גדולה, עם ציור <strong>ומילה<\/strong> על כל צד (הקטנים לא קוראים)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>ששת הצדדים של הקובייה:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>צד<\/th>\n<th>ציור<\/th>\n<th>מה עושים<\/th>\n<th>הערת בטיחות<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>סחרור<\/td>\n<td><strong>סיבוב אחד<\/strong> איטי במקום<\/td>\n<td>רק סיבוב אחד, כדי שלא יסתחררו<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>כפיים<\/td>\n<td><strong>10 כפיים<\/strong> וסופרים בקול<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>נעליים<\/td>\n<td><strong>ריצה במקום<\/strong> הכי מהר, 5 שניות<\/td>\n<td>במקום בלבד<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>כוכבים<\/td>\n<td><strong>ריקוד משוגע<\/strong> 5 שניות, ואז ״פסל!״<\/td>\n<td>בתוך הבועה<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>פרצוף צוחק<\/td>\n<td><strong>הצחוק הכי גדול<\/strong> 5 שניות, ואז ״ששש...״ שקט פתאומי<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>גלידה<\/td>\n<td><strong>גלידה נמסה<\/strong>: נמסים לאט־לאט עד הרצפה<\/td>\n<td><strong>נמסים, לא נופלים<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>ההסבר (עד 20 שניות):<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״זאת קוביית קים. מישהו זורק אותה, ומה שיוצא, <strong>כל החדר<\/strong> עושה. רוצים לראות? אני זורקת ראשונה... <em>(זורקת)<\/em> כפיים! עשר כפיים, סופרים איתי!״<\/p>\n<\/blockquote>\n<p><strong>חוקי המשחק:<\/strong><\/p>\n<ol>\n<li><strong>מי זורק:<\/strong> קים בוחרת ״מי שיושב הכי כמו פסל״. <strong>ילד/ת יום ההולדת זורק/ת ראשון/ה.<\/strong><\/li>\n<li>הזורק/ת עובר/ת את הקו לפי הזמנה וזורק/ת <strong>מלמטה, לכיוון של קים<\/strong>, לא לכיוון הקהל.<\/li>\n<li>בזמן הזריקה כל השאר עושים <strong>״תופים של קים״<\/strong> על הברכיים.<\/li>\n<li>קים מכריזה בדרמה מה יצא, וכולם מבצעים, כולל הזורק/ת.<\/li>\n<li>הזורק/ת חוזר/ת למקום, ובוחרים זורק/ת חדש/ה.<\/li>\n<\/ol>\n<p><strong>התסריט, זריקה טיפוסית:<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״מי יושב הכי כמו פסל...? את! בואי, עברי את הקו. כולם, תופים!״<\/p>\n<p><em>(ילדים: ״תררררר...״)<\/em><\/p>\n<p><em>(הילדה זורקת. קים מרימה את הקובייה, מסתכלת, ומחכה שנייה של מתח.)<\/em><\/p>\n<p><strong>קים:<\/strong> ״יצא... גלידה!!! כולם נמסים... לאט... לאט... יותר לאט... <em>(קים נמסה גם היא)<\/em> ...ועכשיו גלידה במקפיא! קופאים!״<\/p>\n<\/blockquote>\n<p><strong>שדרוגים (אחרי 4–5 זריקות, כשהם כבר מכירים):<\/strong><\/p>\n<ul>\n<li><strong>קוביית ״איך״:<\/strong> קים מוסיפה ״איך״ לכל תוצאה. ״סיבוב... <strong>כמו רובוט!<\/strong>״ ״כפיים... <strong>בלחישה!<\/strong>״ ״ריצה במקום... <strong>בהילוך איטי!<\/strong>״<\/li>\n<li><strong>גיל 7–8:<\/strong> שתי זריקות ברצף, ומבצעים את שתי התנועות אחת אחרי השנייה.<\/li>\n<\/ul>\n<p><strong>כמה זריקות?<\/strong> בערך 8–10 זריקות בשמונה דקות. לפני הזריקה האחרונה אומרים את זה בגלוי, בלי ״לסדר״ את התוצאה:<\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״והזריקה האחרונה היא תמיד זריקת הגלידה! לא משנה מה יוצא — כולם נמסים!״<\/p>\n<\/blockquote>\n<p>ככה גם בני 7–8, שתמיד בודקים, יודעים שהמשחק הוגן.<\/p>\n<p><strong>קבוצה גדולה (40+):<\/strong> הזריקה מהבמה לוקחת זמן. <strong>קים זורקת<\/strong>, ומי שנבחר/ה קם/ה במקום וצועק/ת ״עכשיו!״ כשהקובייה באוויר. <strong>אף פעם לא זורקים את הקובייה לתוך הקהל.<\/strong><\/p>\n<p><strong>אם זה לא עובד:<\/strong><\/p>\n<ul>\n<li><strong>כולם רוצים לזרוק ובוכים שלא נבחרו:<\/strong> ״הקובייה תבוא גם לביקור הבא. ובינתיים, מי שלא זרק הוא ׳מתופף ראשי׳!״ ותני לכל השורה לתופף חזק.<\/li>\n<li><strong>פרוע מדי:<\/strong> תוציאי מהמשחק את צד 3 (ריצה) ואת צד 4 (ריקוד משוגע). אם יוצא אחד מהם, הוא נהיה ״גרסה איטית״.<\/li>\n<\/ul>\n<p><strong>משפט מעבר (הם על הרצפה, ״נמסו״):<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> <em>(קמה, ופתאום היד שלה מתחילה לזוז לבד)<\/em> ״אה... רגע. משהו קורה לי...״<\/p>\n<\/blockquote>\n<hr />\n<h3>קטע 6 — קים משתגעת · 25:00–30:00 · אנרגיה ████ (שיא הצחוק)<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מטרה<\/strong><\/td>\n<td>שיא צחוק, הילדים ״מצילים״ את קים. <strong>פה אפשר לראות את הניסיון שלך בתיאטרון<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>מיקום ילדים<\/strong><\/td>\n<td>יושבים<\/td>\n<\/tr>\n<tr>\n<td><strong>מוזיקה<\/strong><\/td>\n<td>אין. אפשר אפקט קולי מצחיק (״בוינג״), לא חובה<\/td>\n<\/tr>\n<tr>\n<td><strong>ציוד<\/strong><\/td>\n<td>אין. רק הגוף שלך<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>אין הסבר.<\/strong> זה סיפור, ומלמדים את ה״תיקון״ תוך כדי.<\/p>\n<p><strong>ה״תיקון״:<\/strong> 3 מחיאות כפיים ביחד וצעקה <strong>״קים, תקשיבי!״<\/strong><\/p>\n<p><strong>התסריט:<\/strong><\/p>\n<blockquote>\n<p><em>(היד הימנית של קים זזה לבד ומנופפת לקהל.)<\/em><\/p>\n<p><strong>קים:<\/strong> ״היי! יד! תפסיקי! זה מביך! <em>(היד מתקרבת לאף ומצפצפת עליו)<\/em> ...טוּט! אני צריכה עזרה! כשאני אומרת ׳שלוש׳, כולם מוחאים שלוש כפיים וצועקים ׳קים, תקשיבי!׳ אחת... שתיים... שלוש!״<\/p>\n<p><em>(ילדים: שלוש מחיאות כפיים, ״קים, תקשיבי!״)<\/em><\/p>\n<p><em>(היד נעצרת. קים מרוצה מעצמה.)<\/em><\/p>\n<p><strong>קים:<\/strong> ״פפפ... תודה. הצלתם א— <em>(הרגל מתחילה לרקוד בלט לבד)<\/em> ...לאאא! עכשיו הרגל! היא רוקדת בלט! אני בכלל לא יודעת בלט! אחת, שתיים, שלוש!״<\/p>\n<p><em>(ילדים: ״קים, תקשיבי!״)<\/em><\/p>\n<\/blockquote>\n<p><strong>ההסלמה, בכל פעם תקלה גדולה יותר:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>התקלה<\/th>\n<th>מה קים עושה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>היד<\/td>\n<td>מנופפת, מצפצפת על האף, ״מגרדת״ את קים<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>הרגל<\/td>\n<td>רוקדת בלט, בועטת באוויר (לא לכיוון הקהל!)<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>הקול<\/td>\n<td>קים מדברת כמו תרנגול: ״אני רוצה להגיד משהו חשוב... קוּקוּרִיקוּ!״<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>הכתפיים<\/td>\n<td>עולות ויורדות בלי הפסקה: ״אני לא יודעת... אני לא יודעת...״<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><strong>הסוללה<\/strong><\/td>\n<td>קים ״נתקעת״ כמו רובוט: ״סו... לה... חל... שה...״. <strong>הילדים ״מטעינים״ אותה<\/strong>: משפשפים ידיים מהר ושולחים אנרגיה, ״פששששש!״, וקים חוזרת למהירות על<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><strong>זה מדבק!<\/strong><\/td>\n<td>״אוי לא... תסתכלו על היד <strong>שלכם<\/strong>... היא מתחילה לזוז!״. הידיים של הילדים ״משתגעות״, ואחר כך הכתפיים. ואז: ״עם קים...״ ← ״כולם משחקים!״ וכולם קופאים. <strong>״הצלנו את כולם!״<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>טיפים למשחק:<\/strong><\/p>\n<ul>\n<li><strong>לאט יותר ממה שנדמה לך.<\/strong> הצחוק בא מהרגע שלפני, כשהיד ״מתלבטת״ אם לזוז.<\/li>\n<li><strong>תגובה גדולה לכל תיקון:<\/strong> הקלה, ״פפפ...״, מחיאת כפיים לעצמך, ורק אז התקלה הבאה.<\/li>\n<li><strong>גיל 7–8:<\/strong> הם בוחרים איזה איבר ״נתקע״ עכשיו. ״מה הדבר הבא שישתגע לי?״<\/li>\n<\/ul>\n<p><strong>אם זה לא עובד:<\/strong><\/p>\n<ul>\n<li><strong>הם לא צוחקים:<\/strong> תגדילי את התנועה, תאטי את הקצב, ותוסיפי סאונד (צפצוף, ״בוינג״). את הקטע הזה מצלמים בחזרות ובודקים מול המראה (פרק 12).<\/li>\n<li><strong>הם קמים ובאים לבמה ״לעזור״:<\/strong> ״עוזרים מהמקום! הכוח עובד רק מהבועה!״<\/li>\n<\/ul>\n<p><strong>משפט מעבר:<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״אחרי כל הבלגן הזה אני צריכה צוות. צוות אמיתי. מי פה יודע לעבוד ביחד?״<\/p>\n<\/blockquote>\n<hr />\n<h3>קטע 7 — המסלול של קים · 30:00–36:00 · אנרגיה ███<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מטרה<\/strong><\/td>\n<td>שיתוף פעולה. <strong>כולנו נגד השיר, לא קבוצה נגד קבוצה<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>מיקום ילדים<\/strong><\/td>\n<td>בשורות (״מסלולים״) של 6–12 ילדים, אחד מאחורי השני, בערך צעד בין ילד לילד<\/td>\n<\/tr>\n<tr>\n<td><strong>מוזיקה<\/strong><\/td>\n<td>רצועה 05, באורך 45–60 שניות עם סוף ברור. ״מסיימים לפני שהשיר נגמר!״ הרצועה שמורה בפלייליסט 6 פעמים ברצף, אחת לכל סבב (פרק 8)<\/td>\n<\/tr>\n<tr>\n<td><strong>ציוד<\/strong><\/td>\n<td>כדור רך אחד לכל שורה, ועוד כדור רזרבי<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>איך יוצרים שורות בלי כאוס (זה החלק הקשה):<\/strong> אל תסדרי ילדים אחד־אחד. <strong>השורה שהם כבר יושבים בה היא המסלול.<\/strong> ״השורה הראשונה, קמה ומסתובבת אליי בצד. מעולה, זה מסלול מספר 1!״ בקבוצה גדולה מבקשים מהצוות לעזור, אחד לכל שורה.<\/p>\n<p><strong>ההסבר (עד 20 שניות):<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״כל שורה היא מסלול. הכדור עובר מהראשון עד האחרון, ובחזרה לראשון, בלי שהוא נופל. צריך להספיק לפני שהשיר נגמר. בואו נראה פעם אחת לאט. <em>(מדגימה עם 3 ילדים בשורה הראשונה)<\/em>״<\/p>\n<\/blockquote>\n<p><strong>חוקי המשחק:<\/strong><\/p>\n<ol>\n<li>מעבירים את הכדור <strong>מיד ליד<\/strong>. לא זורקים.<\/li>\n<li>הכדור נופל? מרימים, מי שהפיל/ה אומר/ת <strong>״אופס!״<\/strong>, השורה עונה <strong>״לא נורא!״<\/strong>, וממשיכים <strong>מאותו מקום<\/strong>. <strong>בלי אשמים<\/strong>, ואף אחד לא ״החזיר את כולם להתחלה״.<\/li>\n<li>הכדור מגיע לסוף? חוזרים בדרך שבה הגיע.<\/li>\n<li>המטרה: לסיים לפני שהשיר נגמר. <strong>כל שורה מתחרה רק בעצמה.<\/strong><\/li>\n<\/ol>\n<p><strong>הסבבים (כל סבב = שיר אחד):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>סבב<\/th>\n<th>איך מעבירים<\/th>\n<th>למי מתאים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>מעל הראש<\/strong><\/td>\n<td>כולם<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>בין הרגליים<\/strong> (מתכופפים לאט)<\/td>\n<td>כולם<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>מעל־מתחת<\/strong> לסירוגין<\/td>\n<td>5+<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><strong>טוויסט<\/strong>: מסתובבים לצד ומעבירים<\/td>\n<td>5+<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><strong>רק עם המרפקים<\/strong>, בלי כפות ידיים<\/td>\n<td>7–8<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><strong>בלחישה<\/strong>: כל מי שמעביר/ה לוחש/ת ״קים!״<\/td>\n<td>כולם, טוב כדי לסיים ברוגע<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>התסריט בין הסבבים:<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״מסלול 1 סיים! מסלול 2 סיים! ...מסלול 3 עוד שנייה... כולם עוזרים להם: קים! קים! קים! ...כן!!!״<\/p>\n<p><strong>קים:<\/strong> ״אתם יודעים מה זה? זה הצוות הכי טוב שהיה לי השבוע. השבוע? החודש!״<\/p>\n<\/blockquote>\n<p><strong>קבוצה קטנה (עד 12) עם מקום:<\/strong> אפשר ״מסלול אמיתי״ עם 3 תחנות: זיגזג בין קונוסים, <strong>קפיצה מעל ״נהר״: שני פסי סרט הדבקה במרחק 30 ס״מ<\/strong> (בלי חבל, כי חבל מתגלגל מתחת לרגליים), והליכה על פס של סרט הדבקה כמו על גשר. כל ילד/ה עובר/ת עם הכדור ביד, והשאר מעודדים. <strong>לא יותר מ־6–8 ילדים בהמתנה<\/strong>, אחרת הם משתעממים.<\/p>\n<p><strong>אם זה לא עובד:<\/strong><\/p>\n<ul>\n<li><strong>הסידור לשורות לוקח יותר מדקה:<\/strong> מוותרים על השורות ועוברים ל<strong>מעגל אחד גדול<\/strong> בישיבה, שבו הכדור עובר מסביב.<\/li>\n<li><strong>הם נלחצים מ״לנצח״:<\/strong> מוותרים על השיר. ״אין זמן. רק בלי שייפול.״<\/li>\n<\/ul>\n<p><strong>משפט מעבר:<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״כל המסלולים, לשבת במקום... <em>(מחכה שישבו)<\/em> צוות כזה צריך ריקוד. ריקוד סודי. הריקוד של קים.״<\/p>\n<\/blockquote>\n<hr />\n<h3>קטע 8 — הריקוד של קים · 36:00–41:00 · אנרגיה █████ (שיא אחרון)<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מטרה<\/strong><\/td>\n<td>שיא אנרגיה, והילדים יוצאים עם ריקוד ״שלהם״ שאפשר לחזור עליו בבית ובגן<\/td>\n<\/tr>\n<tr>\n<td><strong>מיקום ילדים<\/strong><\/td>\n<td>עומדים בבועה, מול קים<\/td>\n<\/tr>\n<tr>\n<td><strong>מוזיקה<\/strong><\/td>\n<td>רצועה 06, קצב ברור של 8 ספירות (ראי פרק 8)<\/td>\n<\/tr>\n<tr>\n<td><strong>ציוד<\/strong><\/td>\n<td>אין<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>ארבע התנועות<\/strong> (כל תנועה = 8 ספירות. לכל תנועה יש שם, כדי שתוכלי ״לקרוא״ לה):<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>שם<\/th>\n<th>איך עושים<\/th>\n<th>ספירות<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>השמש<\/strong><\/td>\n<td>ידיים מוצלבות למטה, עולות בסיבוב גדול ונפתחות למעלה כמו שמש. פעמיים<\/td>\n<td>4+4<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>הקפיץ<\/strong><\/td>\n<td>ידיים על המותניים, 4 קפיצות קטנות במקום<\/td>\n<td>8<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>המעודדת<\/strong><\/td>\n<td>אגרוף ימני למעלה ״הופ!״, שמאלי למעלה ״הופ!״, ושוב<\/td>\n<td>8<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><strong>כולם משחקים<\/strong><\/td>\n<td>4 צעדים במקום תוך כדי סיבוב איטי, ואז ידיים ב־V וקופאים: ״כולם משחקים!״<\/td>\n<td>4+4<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>כשהתלבושת והמותג סגורים (ראי <a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a>), כדאי לבדוק שהתנועות נראות טוב גם בצילום, כי זה בדיוק התוכן לסרטון ״אתגר קים״ ב<a href=\"03-video-scripts.md\">תסריטי הווידאו<\/a>.<\/em><\/p>\n<p><strong>ההסבר (לכל תנועה עד 10 שניות):<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״תנועה ראשונה: השמש! ידיים למטה... וסיבוב גדול למעלה... שמש! עוד פעם!״<\/p>\n<\/blockquote>\n<p><strong>סדר הלימוד:<\/strong><\/p>\n<ol>\n<li>מלמדים תנועה 1 בלי מוזיקה ובוחנים: ״השמש!״, וכולם עושים.<\/li>\n<li>מלמדים תנועה 2, וחוזרים 1+2.<\/li>\n<li>מלמדים תנועה 3, וחוזרים 1+2+3.<\/li>\n<li>מלמדים תנועה 4, וחוזרים על הכל.<\/li>\n<li><strong>עם מוזיקה, בקצב רגיל.<\/strong> את קוראת את שם התנועה 2 ספירות לפני שהיא מתחילה.<\/li>\n<li><strong>״פעם אחת בלעדיי!״<\/strong> את עוצרת ומסתכלת עליהם רוקדים לבד. (זה רגע מדידה, ראי <a href=\"05-pilot-feedback.md\">טופס המשוב<\/a>.)<\/li>\n<li><strong>״קפטנים״:<\/strong> 2–3 ילדים (ילד/ת יום ההולדת ראשון/ה) עוברים את הקו ומובילים מלפנים <strong>את ארבע התנועות שלמדנו<\/strong>, לא תנועות חדשות. מוסיפים ״סלסול״ משלהם? רק במקום ובתוך הבועה (חוק זהב 9).<\/li>\n<li><strong>הסבב האחרון, הכי מהר.<\/strong> ״מי מצליח במהירות של קים?!״ עם רצועה 06ב המהירה, או בלי מוזיקה, כשאת סופרת בקול ומאיצה (פרק 8).<\/li>\n<\/ol>\n<p><strong>התסריט, לפני הסבב בלעדייך:<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״אוקיי, עכשיו מבחן אמיתי. אני... <em>(מתיישבת על הרצפה)<\/em> ...צופה. אתם רוקדים לבד. מוכנים? שמש!״<\/p>\n<\/blockquote>\n<p><strong>אם זה לא עובד:<\/strong><\/p>\n<ul>\n<li><strong>הם לא זוכרים:<\/strong> תשאירי רק 2 תנועות (השמש והקפיץ) ועוד הקפיאה של הסוף.<\/li>\n<li><strong>קבוצה גדולה, הקפיצות מרעישות או מתנגשות:<\/strong> ״הקפיץ״ נהיה ״קפיץ על העקבים״, עלייה על קצות האצבעות במקום קפיצה.<\/li>\n<\/ul>\n<p><strong>משפט מעבר:<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> <em>(מתנשפת בהגזמה)<\/em> ״וואו... אני צריכה לנשום. גם אתם? בואו נשב.״<\/p>\n<\/blockquote>\n<hr />\n<h3>קטע 9 — נשימה ותודה · 41:00–44:00 · אנרגיה █<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מטרה<\/strong><\/td>\n<td>להוריד דופק ולהחזיר את הקבוצה רגועה. <strong>וגם רגע של מדידה: הצבעת אגודלים<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>מיקום ילדים<\/strong><\/td>\n<td>יושבים<\/td>\n<\/tr>\n<tr>\n<td><strong>מוזיקה<\/strong><\/td>\n<td>רצועה 07, שקטה, בלי תופים<\/td>\n<\/tr>\n<tr>\n<td><strong>ציוד<\/strong><\/td>\n<td>צעיפים (לא חובה). <strong>עד 25 ילדים אפשר לחלק, מעל זה עדיף ״ידיים־עננים״ בלי ציוד<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>התסריט:<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״בואו נעשה בלון. נושמים פנימה מהאף... והידיים עולות למעלה כמו בלון שמתמלא... ונושפים מהפה, ׳שששש...׳, והבלון יורד לאט. עוד פעם...״ <em>(3 פעמים)<\/em><\/p>\n<\/blockquote>\n<p><strong>עם צעיפים (עד 25 ילדים):<\/strong> הצוות מחלק בזמן המעבר. ״מחזיקים את הצעיף מול הפנים... ונושפים עליו. הוא עף!״ 3 פעמים. אחר כך: ״כל הצעיפים חוזרים הביתה לתיק של קים. מי מחזיר כמו נינג׳ה, בשקט־שקט?״ (<strong>לכבס את הצעיפים אחרי כל הופעה.<\/strong>)<\/p>\n<p><strong>הצבעת אגודלים (30 שניות, חשוב למדידה):<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״שאלה חשובה, תענו עם אגודל. מי אהב את הקובייה? <em>(אגודלים)<\/em> את הפסל? את קים משתגעת? את המסלול? את הריקוד?״<\/p>\n<\/blockquote>\n<p><em>אם יש איתך צופה, הוא/היא סופר/ת אגודלים בקירוב לכל קטע (<a href=\"05-pilot-feedback.md\">טופס המשוב<\/a>, חלק ג׳).<\/em><\/p>\n<p><strong>תודה:<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״אתם יודעים מה גיליתי היום? באתי לבדוק אם אתם יודעים לשחק... ואתם <strong>לא<\/strong> יודעים לשחק. <em>(פאוזה, הילדים מוחים)<\/em> אתם יודעים לשחק <strong>מעולה<\/strong>! אתם השחקנים הכי טובים שפגשתי!״<\/p>\n<\/blockquote>\n<p><em>(גיל 3–4: בלי ״אתם לא יודעים״. הקטנים לוקחים את זה מילולית. פשוט: ״אתם השחקנים הכי טובים!״)<\/em><\/p>\n<p><strong>משפט מעבר:<\/strong> ״לפני שאני הולכת, נשארה לנו עוד קריאה אחת. הכי חזקה של היום.״<\/p>\n<hr />\n<h3>קטע 10 — סיום ו״פסל אחרון״ · 44:00–45:00 · אנרגיה █████ ← █<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מטרה<\/strong><\/td>\n<td>לסיים בשיא, אבל להשאיר לצוות <strong>קבוצה רגועה<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>מוזיקה<\/strong><\/td>\n<td>רצועה 08 (גרסה חוזרת של רצועת הכניסה)<\/td>\n<\/tr>\n<tr>\n<td><strong>ציוד<\/strong><\/td>\n<td>מדבקות ״שחקן/ית של קים״, שהצוות מחלק אחרי שיצאת או ביציאה מהחדר<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>התסריט:<\/strong><\/p>\n<blockquote>\n<p><strong>קים:<\/strong> ״כולם לקום! ידיים מוכנות? עם קים...״<\/p>\n<p><em>(ילדים: ״כולם משחקים!״)<\/em><\/p>\n<p><strong>קים:<\/strong> ״עוד פעם, שישמעו אותנו עד [שם העיר / שם הגן]! עם קים...״<\/p>\n<p><em>(ילדים: ״כולם משחקים!!!״)<\/em><\/p>\n<p><strong>קים:<\/strong> ״ועכשיו... פסל אחרון. כולם קופאים... ומתיישבים לאט, כמו נוצה... ופסלים לא זזים עד שקים יוצאת מהמוזיאון. <em>(לוחשת)<\/em> תודה. אני קים, ונתראה במשחק הבא!״<\/p>\n<p><em>(קים יוצאת בנפנוף, המוזיקה עולה. הצוות לוקח את הקבוצה.)<\/em><\/p>\n<\/blockquote>\n<p><strong>לקבוצות קטנות (עד 15):<\/strong> אפשר ״מנהרת יציאה״: הילדים עוברים ליד קים בדרך החוצה, וכל ילד/ה <strong>בוחר/ת<\/strong> כיף, אגרוף או נפנוף. מי שלא רוצה לגעת, מנפנף. זה בסדר.<\/p>\n<p><strong>תמונה קבוצתית:<\/strong> <strong>רק<\/strong> לפי הכללים ב<a href=\"08-consent-template.md\">טופס אישור הצילום<\/a>. אם לא כל ההורים חתמו, אין תמונה עם פנים של ילדים, נקודה. אפשר לצלם את קים לבד על ״הבמה״ אחרי שהילדים יצאו.<\/p>\n<h3>אחרי היציאה (10 הדקות שאחרי)<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לשתות מים.<\/strong> את כבר בהופעה הבאה שלך.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>5 דקות עם האחראי/ת<\/strong>, לא מול הילדים: ״איך היה מבחינתך? מה הכי עבד?״ (השאלות המלאות ב<a href=\"05-pilot-feedback.md\">טופס המשוב<\/a>).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>להשאיר פרטים או כרטיס<\/strong> (ראי <a href=\"06-show-offer.md\">הצעת המופע<\/a>).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לספור ציוד:<\/strong> קובייה, כדורים, צעיפים, שלט ורמקול.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>הקלטה קולית באוטו<\/strong>, לפני שנוסעים, לפי חלק ד׳ של <a href=\"05-pilot-feedback.md\">טופס המשוב<\/a>.<\/li>\n<\/ul>\n<hr />\n<h2>6. ארגז כלים: איך מחזירים קשב בלי לצעוק<\/h2>\n<p><strong>העיקרון:<\/strong> צעקה מלמדת את הילדים שהרעש הנכון בחדר הוא צעקה. כשאת מנמיכה, הם צריכים להשתתק כדי לשמוע אותך.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>הכלי<\/th>\n<th>איך עושים<\/th>\n<th>מתי הכי עובד<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>הקריאה<\/strong><\/td>\n<td>״עם קים...״ ← ״כולם משחקים!״ ← קופאים עם ידיים למעלה<\/td>\n<td>תמיד. זה הכלי הראשי שלך<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>לחישה<\/strong><\/td>\n<td>מתחילים משפט בלחישה: ״מי ששומע אותי... שיגע באף...״<\/td>\n<td>כשרוב החדר רועש אבל לא פרוע<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>״מי ששומע אותי״ מדורג<\/strong><\/td>\n<td>״מי ששומע אותי, שיגע באף. מי ששומע אותי, שיגע באוזן. מי ששומע אותי, שישים ידיים על הראש.״ בכל שלב מצטרפים עוד ילדים<\/td>\n<td>כשחלק מהקבוצה ״בעולם אחר״<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><strong>הד מחיאות<\/strong><\/td>\n<td>את מוחאת קצב (״טה, טה, טה־טה־טה״), והם מחזירים<\/td>\n<td>כשאין מוזיקה, או כשהרמקול נפל<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><strong>ספירה לאחור<\/strong><\/td>\n<td>״5... 4... 3... 2... 1... פסל!״ עם האצבעות למעלה<\/td>\n<td>לפני מעבר בין קטעים<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><strong>עצירת מוזיקה<\/strong><\/td>\n<td>לוחצים על השלט: אין מוזיקה, יש פסל (אחרי שלמדו בקטע 4)<\/td>\n<td>מרגע שהם מכירים את הפסל<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td><strong>קים קופאת<\/strong><\/td>\n<td>את קופאת באמצע משפט, בתנוחה מצחיקה. הילדים שמים לב ומשתתקים כדי לראות מה קרה<\/td>\n<td>כשאת מרגישה שאת ״מדברת לקיר״<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td><strong>שינוי גובה<\/strong><\/td>\n<td>״כולם לשבת! מי ראשון?״ ישיבה מורידה אנרגיה מיד<\/td>\n<td>קבוצה שמתלהטת מדי<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td><strong>לתת תפקיד<\/strong><\/td>\n<td>הילד/ה הכי רועש/ת נהיה ״שומר/ת השקט״ או ״אחראי/ת על הספירה״<\/td>\n<td>ילד/ה אחד/ת שמושך/ת את כולם<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td><strong>מחמאה מדויקת<\/strong><\/td>\n<td>״וואו, תראו את השורה הזאת, פסלים מושלמים!״ (על קבוצה, לא על ילד אחד מול כולם)<\/td>\n<td>כשחלק מהקבוצה כבר בשקט<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td><strong>סוד<\/strong><\/td>\n<td>״אני הולכת לספר לכם סוד... אבל רק אם יהיה שקט...״ (הסוד: ״המשחק הבא הוא הכי משוגע!״)<\/td>\n<td>לפני משחק חדש<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td><strong>קרבה<\/strong><\/td>\n<td>בלי מילים: את הולכת לאט ועומדת ליד אזור רועש, <strong>מאחורי קו הבמה<\/strong>, ומחייכת<\/td>\n<td>פינה אחת שמתפרעת<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>מה לא עושים, אף פעם<\/h3>\n<ul>\n<li>לא קוראים לילד/ה בשם מול כולם כדי להעיר.<\/li>\n<li>לא מאיימים (״אם לא תשבו, אני הולכת!״).<\/li>\n<li>לא מבקשים מילדים להשתיק ילדים אחרים.<\/li>\n<li>לא צועקים ״שקט!״. אם יצא לך, נשמי, ותעברי לכלי מספר 1.<\/li>\n<\/ul>\n<hr />\n<h2>7. מצבים מיוחדים: מה עושים כש...<\/h2>\n<h3>ילד/ה בוכה<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>קודם מבינים למה<\/strong><\/td>\n<td>נבהל/ה (קול חזק, קים קרובה מדי)? נפגע/ה? עצוב/ה (רצה לזרוק ולא נבחר/ה)?<\/td>\n<\/tr>\n<tr>\n<td><strong>נבהל/ה<\/strong><\/td>\n<td>צעד אחורה. להנמיך קול. <strong>לא ללחוץ.<\/strong> ״זה בסדר לגמרי. את/ה יכול/ה לשבת עם [הגננת] ולהסתכל, וכשבא לך, את/ה מוזמן/ת לחזור.״ סימן קטן לצוות.<\/td>\n<\/tr>\n<tr>\n<td><strong>נפגע/ה<\/strong><\/td>\n<td>״עם קים...״ ← כולם קופאים. <strong>הצוות מטפל<\/strong>, ואת עוברת למשחק בישיבה (בנק המשחקים, פרק 13). אם נראה רציני, עוצרים את המופע. במקרה חירום: <strong>101 (מד״א)<\/strong>. אחרי ההופעה רושמים מה קרה ב<a href=\"05-pilot-feedback.md\">טופס המשוב<\/a>.<\/td>\n<\/tr>\n<tr>\n<td><strong>עצוב/ה<\/strong><\/td>\n<td>״יש לי תפקיד מיוחד בשבילך...״ (תופף/ת ראשי/ת, סופר/ת, קפטן/ית בריקוד). אם לא עובד, מניחים ולא מתעקשים.<\/td>\n<\/tr>\n<tr>\n<td><strong>מה לא עושים<\/strong><\/td>\n<td>לא לוקחים ילד/ה לבד לחדר אחר. לא מרימים. לא עוצרים את כל המופע בגלל בכי קל. הצוות מטפל, ואת ממשיכה.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>ילד/ה שלא רוצה להשתתף<\/h3>\n<ul>\n<li><strong>זה לגיטימי.<\/strong> לצפות זו גם השתתפות, והרבה ילדים ביישנים מצטרפים אחרי כמה דקות, כשהם רואים שאף אחד לא צוחק עליהם. כמה דקות בדיוק? את זה תלמדי מהניסיון שלך: רשמי בטופס באיזו דקה ילדים ביישנים מצטרפים.<\/li>\n<li><strong>מה אומרים:<\/strong> ״אין בעיה! את/ה יכול/ה להיות השופט/ת שלי. תגיד/י לי אחר כך מי היה הכי מצחיק.״<\/li>\n<li><strong>מה עושים:<\/strong> מחייכים אליו/ה מדי פעם, <strong>בלי<\/strong> להפנות את תשומת הלב של כל החדר.<\/li>\n<li><strong>מה לא עושים:<\/strong> לא מושכים ביד, לא אומרים ״כולם משתתפים, גם את/ה!״, לא מבקשים מהקהל ״לעודד״ אותו/ה.<\/li>\n<li><strong>רושמים בטופס:<\/strong> אם הצטרף/ה, באיזו דקה. זה מדד מצוין לכמה המופע מזמין.<\/li>\n<\/ul>\n<h3>ילד/ה שרץ/ה לבמה<\/h3>\n<ul>\n<li><strong>לא רודפים<\/strong> ולא תופסים פיזית.<\/li>\n<li><strong>קבוצה של עד 15 ילדים, הופכים את זה למשחק קצר:<\/strong> ״וואו, יש לי עוזר! תראה לכולם את הפרצוף הכי מצחיק שלך! <em>(5 שניות. פרצוף או תנועה במקום, לפי חוק זהב 9)<\/em> ...ועכשיו כל החדר סופר לך עד 5, ואתה חוזר למקום הסודי שלך! 1... 2...״<\/li>\n<li><strong>קבוצה של יותר מ־15 ילדים, מחזירים בלי זרקור<\/strong> (אחרת חצי חדר ״ירוץ לבמה״ כדי לקבל את אותו הדבר): ״איזה כיף שבאת! המקום הסודי שלך מחכה לך — כולם, תופים!״ והילד/ה חוזר/ת למקום בזמן שכולם מתופפים.<\/li>\n<li><strong>בפעם השנייה:<\/strong> ״העוזרים שלי עולים רק בהזמנה. אני מבטיחה להזמין אותך בקטע הבא.״ <strong>ולקיים<\/strong> (תפקיד קטן: תופף/ת ראשי/ת, עוזר/ת בקובייה או קפטן/ית בריקוד).<\/li>\n<li><strong>בפעם השלישית:<\/strong> סימן לצוות שיישבו לידו/ה.<\/li>\n<li><strong>מניעה:<\/strong> קו הבמה ברור, ומבקשים מהצוות לשבת <strong>בצדדים של השורה הראשונה<\/strong>.<\/li>\n<\/ul>\n<h3>קבוצה פרועה מדי<\/h3>\n<p><strong>סימנים:<\/strong> אחרי ״עם קים...״ פחות מחצי עונים, יש ריצות בחדר, מתחילות התנגשויות.<\/p>\n<ol>\n<li><strong>עצירה:<\/strong> ״עם קים...״. לא עובד? כלים 7 ו־8 (קים קופאת, כולם לשבת).<\/li>\n<li><strong>הכל עובר לישיבה<\/strong> לפחות ל־5 דקות: ״האוטובוס של קים״ או ״הד מחיאות״ (פרק 13).<\/li>\n<li><strong>בודקים למה:<\/strong> חם? רעבים? היה יום ארוך? יותר מדי ילדים במקום קטן?<\/li>\n<li><strong>משנים את המופע מעכשיו:<\/strong> מוותרים על המסלול, הקובייה בלי צדדים 3 ו־4, והמוזיקה איטית יותר.<\/li>\n<li><strong>מבקשים מהצוות<\/strong> לשבת <strong>בין<\/strong> הילדים ולא בצד.<\/li>\n<\/ol>\n<h3>קבוצה קטנה (5 ילדים)<\/h3>\n<ul>\n<li><strong>היתרון: אינטימיות.<\/strong> כל ילד/ה זורק/ת את הקובייה, כל ילד/ה מוביל/ה תנועה בריקוד (תנועה במקום, חוק זהב 9).<\/li>\n<li><strong>שמות:<\/strong> אפשר להשתמש בשמות, אבל רק אם הילדים אמרו אותם בעצמם.<\/li>\n<li><strong>הקריאה:<\/strong> קבוצה קטנה נשמעת חלשה, אז אל תאמרי ״לא שומעת!״. במקום זה: <strong>״אנחנו צוות קטן אבל הכי רועש בעיר! עם קים...״<\/strong>, ותצטרפי לצעקה שלהם.<\/li>\n<li><strong>קים משחקת איתם<\/strong> במסלול ובפסל, ולא רק מנהלת.<\/li>\n<li><strong>מסלול:<\/strong> הגרסה ״האמיתית״ עם תחנות מתאימה מצוין.<\/li>\n<li><strong>אורך:<\/strong> 35–40 דקות מספיקות. קבוצה קטנה ״נגמרת״ מהר יותר.<\/li>\n<\/ul>\n<h3>קבוצה גדולה (60 ילדים)<\/h3>\n<table>\n<thead>\n<tr>\n<th>נושא<\/th>\n<th>מה עושים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>קול<\/strong><\/td>\n<td><strong>מגבר קול עם מיקרופון ראש<\/strong> (פרק 10). בלי זה תאבדי את הקול באמצע המופע. <strong>הכלל: מעל 25 ילדים, או בחוץ, רק עם מגבר.<\/strong> אין לך עדיין מגבר? מגבילים את ההזמנה ל־25 ילדים בפנים, או מחלקים לשני מופעים (כמו ב<a href=\"06-show-offer.md\">הצעת המופע<\/a>).<\/td>\n<\/tr>\n<tr>\n<td><strong>צוות<\/strong><\/td>\n<td>מבקשים מראש <strong>כמה מבוגרים מהמקום שיישארו לאורך כל המופע<\/strong>. כלל עבודה שלך, לא חוק: מבוגר/ת לכל 10–15 ילדים בערך. סוגרים בשיחת ההזמנה (<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>).<\/td>\n<\/tr>\n<tr>\n<td><strong>סידור<\/strong><\/td>\n<td>שורות בחצי עיגול, עם <strong>מעבר פנוי באמצע<\/strong> (לצוות ולמקרה חירום).<\/td>\n<\/tr>\n<tr>\n<td><strong>תנועה<\/strong><\/td>\n<td><strong>רק במקום.<\/strong> בלי ריצות בחדר ובלי ״מסלול אמיתי״.<\/td>\n<\/tr>\n<tr>\n<td><strong>הקובייה<\/strong><\/td>\n<td>קים זורקת, והילד/ה שנבחר/ה צועק/ת ״עכשיו!״ מהמקום.<\/td>\n<\/tr>\n<tr>\n<td><strong>מסלול<\/strong><\/td>\n<td>שורות של 8–10 ילדים, מבוגר/ת ליד כל שורה. אם הסידור לוקח יותר מדקה, מוותרים.<\/td>\n<\/tr>\n<tr>\n<td><strong>אנרגיה<\/strong><\/td>\n<td><strong>קריאה לפי צדדים<\/strong>, בלי תחרות: ״רק צד ימין: עם קים...״, ״רק צד שמאל...״, ״וכולם ביחד!״<\/td>\n<\/tr>\n<tr>\n<td><strong>מתנדבים<\/strong><\/td>\n<td>מעט, וקצר. 60 ילדים לא יחכו לילד/ה אחד/ת.<\/td>\n<\/tr>\n<tr>\n<td><strong>צעיפים ומדבקות<\/strong><\/td>\n<td>בלי צעיפים. את המדבקות מחלק הצוות אחרי שיצאת.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>בחוץ, בחום<\/h3>\n<p><strong>זה המצב שבו הבטיחות הכי חשובה.<\/strong> ילדים רגישים לחום יותר ממבוגרים.<\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>בשיחת ההזמנה<\/strong> סוגרים שעה: <strong>בוקר מוקדם או אחר הצהריים המאוחרים<\/strong>, וב<strong>צל מלא<\/strong>. אין צל? מבקשים מקום מקורה.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>ערב לפני ובוקר ההופעה<\/strong> בודקים את תחזית <strong>עומס החום<\/strong> ואת <strong>עמוד האזהרות<\/strong> של השירות המטאורולוגי (<a href=\"https://ims.gov.il/he/IMSwarnings\">ims.gov.il/he/IMSwarnings<\/a>). כשיש עומס חום כבד, מעבירים פנימה או דוחים. <strong>סגרי את זה מראש בתנאי ההזמנה<\/strong> (<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>הפסקת שתייה של קים כל 10–15 דקות<\/strong>, כחלק מהמשחק: ״כולם לוקחים בקבוק... שלוק אחד כמו פיל! שלוק אחד כמו ציפור!״ (הבקבוקים מגיעים מהמקום, וכדאי לבקש מראש.)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מקצרים:<\/strong> 30–35 דקות. מוותרים על המסלול ועל ריצה במקום.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מעבירים חלק מהמשחקים לישיבה<\/strong> (״האוטובוס של קים״, ״הד מחיאות״).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>בחוץ צריך מגבר.<\/strong> הקול ״בורח״.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>קו הבמה בחוץ:<\/strong> סרט הדבקה לא נדבק לדשא או לחול. מסמנים את הקו <strong>בצלחות סימון שטוחות או קונוסים נמוכים<\/strong> (מרשימת הציוד בפרק 10), לא בסרט ולא בחבל.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>את:<\/strong> מים, כובע או מצחייה בין קטעים אם אפשר, ותלבושת לא כהה. גם את בסיכון.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>סימנים שעוצרים בגללם:<\/strong> פנים אדומות מאוד, סחרחורת, בחילה, עייפות חריגה או בלבול. <strong>עוצרים, מעבירים לצל, מים, ומודיעים לצוות.<\/strong> כשנראה רציני: <strong>101<\/strong>.<\/li>\n<\/ul>\n<p><em>הערה: זה לא ייעוץ רפואי. בימי חום משרד החינוך הנחה בעבר להימנע מפעילות חוץ בשעות החום ולשתות הרבה (<a href=\"https://www.srugim.co.il/448139-בעקבות-מזג-האוויר-משרד-החינוך-בהנחיות\">דיווח בסרוגים<\/a>). <\/em><em>לבדוק<\/em><em> את ההנחיה העדכנית לפני הקיץ. מקום אפשרי לחפש: <a href=\"https://parents.education.gov.il/gov-education/vacations-camps-leisure/summer-camps/\">פורטל ההורים של משרד החינוך, עמוד הקייטנות<\/a> (<\/em><em>לבדוק שהעמוד קיים ומה כתוב בו<\/em><em>). אזהרות חום רשמיות: <a href=\"https://ims.gov.il/he/IMSwarnings\">עמוד האזהרות של השירות המטאורולוגי<\/a>.<\/em><\/p>\n<h3>יום הולדת: רגעים לילד/ת השמחה<\/h3>\n<p><strong>לפני (בשיחת ההזמנה עם ההורה):<\/strong><\/p>\n<ul>\n<li>איך מבטאים את השם? בן/בת כמה?<\/li>\n<li><strong>הילד/ה אוהב/ת להיות במרכז או מתבייש/ת?<\/strong> זאת השאלה הכי חשובה. לילד/ה ביישן/ית נותנים תפקיד שקט (מחזיק/ה את הקובייה) במקום ״מופע״ סביבו/ה.<\/li>\n<li>יש אחים או אחיות שחשוב לשתף?<\/li>\n<li><strong>יהיו פעוטות מתחת לגיל 3<\/strong> (אחים, תינוקות של אורחים)? הם צופים <strong>מחוץ לאזור המשחק<\/strong>, על הידיים או ליד הורה.<\/li>\n<li><strong>ההורים יושבים מאחורי הילדים, לא על קו הבמה.<\/strong> כך הילדים רואים אותך, ואזור המשחק נשאר פנוי.<\/li>\n<\/ul>\n<p><strong>במהלך המופע: ״קפטן/ית של קים״<\/strong> (רק אם הילד/ה רוצה)<\/p>\n<table>\n<thead>\n<tr>\n<th>רגע<\/th>\n<th>מה קורה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>קטע 1<\/td>\n<td>״שמעתי שיש פה מישהו מיוחד היום... מי חוגג?״ ומזמינים לקו. אבנט או סרט ״קפטן/ית״ <strong>רק אם רוצה ללבוש<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td>קטע 3<\/td>\n<td>הקפטן/ית בוחר/ת תנועה ראשונה ב״קים אומרת״<\/td>\n<\/tr>\n<tr>\n<td>קטע 5<\/td>\n<td>הקפטן/ית <strong>זורק/ת את הקובייה ראשון/ה<\/strong><\/td>\n<\/tr>\n<tr>\n<td>לפני קטע 8<\/td>\n<td><strong>״קפיצות גיל״:<\/strong> ״בן/בת כמה? 6? כל החדר קופץ 6 קפיצות ביחד, ואחת לשנה הבאה!״ סופרים בקול<\/td>\n<\/tr>\n<tr>\n<td>קטע 8<\/td>\n<td>הקפטן/ית מוביל/ה את הריקוד מלפנים<\/td>\n<\/tr>\n<tr>\n<td>קטע 10<\/td>\n<td>״הקריאה האחרונה מוקדשת ל[שם]! עם קים...״<\/td>\n<\/tr>\n<tr>\n<td><strong>בכל רגע: פעוט/ה נכנס/ה לאזור המשחק<\/strong><\/td>\n<td>״עם קים...״ ← ״כולם משחקים!״, כולם קופאים, הורה לוקח/ת את הפעוט/ה, וממשיכים. <strong>הקובייה לא נזרקת וכדורים לא עוברים כשפעוט/ה באזור.<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>בכל רגע: הורים מתקרבים לקו<\/strong> (כדי לצלם או לראות)<\/td>\n<td>סימן קטן למארח/ת, שמבקש/ת מהם לחזור. אם צריך, את בחיוך: ״ההורים המהממים, צעד אחורה מאחורי הילדים, ככה כולם רואים!״<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>קנאה של ילדים אחרים:<\/strong> ״לקפטן/ית יש עוזרים!״ ובוחרים 2 עוזרים לסבב הריקוד.<\/li>\n<li><strong>שיר יום הולדת:<\/strong> נותנים להורים להוביל, כי זה הרגע של המשפחה. לקים יש ״קפיצות גיל״ משלה. שימי לב: שירה חיה היא גם ביצוע של יצירה, אז שאלת הרישוי זהה לזו של מוזיקה מוקלטת (פרק 8, <strong>לבדוק<\/strong>).<\/li>\n<\/ul>\n<h3>עוד מצבים שכדאי להכיר<\/h3>\n<table>\n<thead>\n<tr>\n<th>מצב<\/th>\n<th>מה עושים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>ילד/ה עם רגישות לרעש<\/strong><\/td>\n<td>מראש: עוצמה נמוכה יותר. לפני רגע חזק: ״עוד שנייה נהיה חזקים. מי שרוצה, שם ידיים על האוזניים.״<\/td>\n<\/tr>\n<tr>\n<td><strong>ילד/ה עם קושי בתנועה או בכיסא גלגלים<\/strong><\/td>\n<td><strong>לכל משחק יש גרסת ישיבה בידיים בלבד<\/strong> (קים אומרת, פסל, קובייה, ריקוד). מציגים אותה <strong>לכולם<\/strong> כ״גרסה מותרת״, לא רק לילד/ה.<\/td>\n<\/tr>\n<tr>\n<td><strong>הורים מצלמים<\/strong><\/td>\n<td>בתחילת המופע מבקשים מהמארח/ת להגיד (לא את): ״מצלמים רק את הילד שלכם ולא מעלים לרשת ילדים אחרים.״ ראי <a href=\"08-consent-template.md\">טופס אישור הצילום<\/a>.<\/td>\n<\/tr>\n<tr>\n<td><strong>הרמקול או הטלפון נפלו<\/strong><\/td>\n<td>ממשיכים בלי מוזיקה: הד מחיאות, ״פסל!״ בקול, ״תופים של קים״. <strong>כל משחק במופע עובד גם בלי מוזיקה.<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>שכחת מה הלאה<\/strong><\/td>\n<td>״עם קים...״ ← ״כולם משחקים!״ קונה לך 5 שניות להציץ בדף הבמה שעל הרמקול.<\/td>\n<\/tr>\n<tr>\n<td><strong>הצוות יצא מהחדר<\/strong><\/td>\n<td>ממשיכים במשחק ישיבה ואומרים בנימוס למבוגר/ת שבדלת: ״אני צריכה שמישהו מהצוות יישאר איתנו, תודה!״<\/td>\n<\/tr>\n<tr>\n<td><strong>יש פחות זמן ממה שתוכנן<\/strong><\/td>\n<td>רואים את סדר הקיצוץ למטה<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>סדר הקיצוץ כשממהרים<\/h3>\n<table>\n<thead>\n<tr>\n<th>זמן שיש<\/th>\n<th>מה משאירים<\/th>\n<th>ממה מוותרים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>35 דק׳<\/strong><\/td>\n<td>הכל חוץ מהמסלול; קים אומרת בגרסה קצרה (4 דק׳)<\/td>\n<td>המסלול<\/td>\n<\/tr>\n<tr>\n<td><strong>30 דק׳<\/strong><\/td>\n<td>1, 2, 3 (קצר), 4, 5 (6 זריקות), 6 (קצר: 3 תקלות), 8, 10<\/td>\n<td>המסלול; הנשימה נהיית 30 שניות<\/td>\n<\/tr>\n<tr>\n<td><strong>20 דק׳<\/strong><\/td>\n<td>1 (3 דק׳), 2 (3 דק׳), 3 קצר (4 דק׳), <strong>קובייה: 4 זריקות (4 דק׳)<\/strong>, 8 (5 דק׳), 10 (1 דק׳)<\/td>\n<td>הפסל, קים משתגעת, המסלול, הנשימה<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>בכל גרסה, גם הכי קצרה, משאירים 30 שניות של הצבעת אגודלים<\/strong> (אפשר בתוך הסיום, לפני הקריאה האחרונה). בלי זה אין לך נתונים ל<a href=\"05-pilot-feedback.md\">טופס המשוב<\/a>, חלק ג׳.<\/p>\n<p><strong>אותו סדר בדיוק מופיע בדף הבמה<\/strong> (פרק 14): בלי המסלול ← קים אומרת קצר ← קים משתגעת קצר ← בלי הפסל.<\/p>\n<p><strong>אם יש זמן נוסף (50–55 דק׳):<\/strong> הקובייה עם צדדים שהילדים ממציאים, תנועה חמישית בריקוד (שתיהן לפי חוק זהב 9: קים מאשרת כל רעיון לפני שהוא נכנס), ו״שאלות לקים״ (3 דק׳). השאלות של הילדים הן גם מקור לרעיונות לסרטונים.<\/p>\n<hr />\n<h2>8. מוזיקה: רצועות, קצב וזכויות<\/h2>\n<p><strong>את לא צריכה שירים מפורסמים.<\/strong> את צריכה רצועות אינסטרומנטליות (בלי מילים) עם קצב ברור. BPM הוא מספר הפעימות בדקה, והוא מה שקובע את ״תחושת הקצב״.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>רצועה<\/th>\n<th>מתי<\/th>\n<th>איזו מוזיקה לחפש<\/th>\n<th>קצב (BPM)<\/th>\n<th>אורך<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>00<\/td>\n<td>קבלת פנים<\/td>\n<td>10 דקות לפני<\/td>\n<td>שובבה ורכה, אינסטרומנטלית, בעוצמה נמוכה<\/td>\n<td>95–105<\/td>\n<td>10 דק׳<\/td>\n<\/tr>\n<tr>\n<td>00ב<\/td>\n<td>גשר<\/td>\n<td>מעברים: כשאת מוציאה ציוד או מסדרת שורות<\/td>\n<td>קצרה, שמחה, בעוצמה נמוכה. ממלאת את ה״שקט המת״<\/td>\n<td>100–115<\/td>\n<td>0:30–1:00<\/td>\n<\/tr>\n<tr>\n<td>01<\/td>\n<td>כניסה<\/td>\n<td>קטע 1<\/td>\n<td>פופ או אלקטרוני שמח, עם ״בילד־אפ״ ופיצוץ ב־10 השניות הראשונות<\/td>\n<td>125–135<\/td>\n<td>1:30<\/td>\n<\/tr>\n<tr>\n<td>02<\/td>\n<td>רקע ל״קים אומרת״<\/td>\n<td>קטע 3<\/td>\n<td>גרוב קליל, פאנקי, חלש מתחת לקול<\/td>\n<td>105–115<\/td>\n<td>7 דק׳<\/td>\n<\/tr>\n<tr>\n<td>03<\/td>\n<td>הפסל<\/td>\n<td>קטע 4<\/td>\n<td>איטית ומצחיקה: ואלס, לאונג׳ או ״הילוך איטי״<\/td>\n<td>80–95<\/td>\n<td>4 דק׳<\/td>\n<\/tr>\n<tr>\n<td>04<\/td>\n<td>קובייה<\/td>\n<td>קטע 5<\/td>\n<td>אנרגטית, ברקע חלש<\/td>\n<td>120–130<\/td>\n<td>8 דק׳<\/td>\n<\/tr>\n<tr>\n<td>05<\/td>\n<td>מסלול<\/td>\n<td>קטע 7<\/td>\n<td>קצבית, <strong>עם סוף ברור<\/strong><\/td>\n<td>115–125<\/td>\n<td><strong>45–60 שניות בדיוק<\/strong><\/td>\n<\/tr>\n<tr>\n<td>06<\/td>\n<td>ריקוד<\/td>\n<td>קטע 8<\/td>\n<td><strong>קצב ברור של 4/4 שמתחלק ל־8 ספירות<\/strong>, בלי שינויים מפתיעים<\/td>\n<td>110–120<\/td>\n<td>2:30–3:00<\/td>\n<\/tr>\n<tr>\n<td>06ב<\/td>\n<td>ריקוד מהיר<\/td>\n<td>קטע 8, הסבב האחרון<\/td>\n<td>אותו סגנון, מהיר יותר. <strong>אין?<\/strong> עושים את הסבב בלי מוזיקה, ואת סופרת בקול ומאיצה<\/td>\n<td>130–140 בערך<\/td>\n<td>1:00<\/td>\n<\/tr>\n<tr>\n<td>07<\/td>\n<td>נשימה<\/td>\n<td>קטע 9<\/td>\n<td>אמביינט רגוע, בלי תופים<\/td>\n<td>60–70 או בלי קצב<\/td>\n<td>3 דק׳<\/td>\n<\/tr>\n<tr>\n<td>08<\/td>\n<td>יציאה<\/td>\n<td>קטע 10<\/td>\n<td>חזרה על רצועה 01<\/td>\n<td>125–135<\/td>\n<td>1:30<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>הסידור הטכני (פעם אחת, ואז זה עובד תמיד)<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>פלייליסט אחד<\/strong> בשם ״קים — מופע״, עם קבצים ממוספרים <code>00<\/code>–<code>08<\/code>, לפי הסדר של המופע.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>הכל שמור בטלפון, לא בסטרימינג.<\/strong> באולמות ובגנים אין תמיד קליטה.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מצב טיסה עם Bluetooth דולק<\/strong>, כדי שאף שיחה לא תקטע את המוזיקה באמצע ״הפסל״.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>בין רצועה לרצועה שמים קובץ שקט של כמה דקות<\/strong> (הרבה נגנים לא יודעים ״לעצור אחרי כל שיר״, והשקט מונע הפתעות). איך זה עובד: רצועה נגמרת ← מתנגן השקט ← לוחצים Next ← מתחילה הרצועה הבאה. רוצה לעצור רצועה לפני הסוף? Next ← עוברים לשקט.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>רצועה 05 מופיעה 6 פעמים ברצף<\/strong> (05א–05ו), עם 10 שניות שקט ביניהן: אחת לכל סבב במסלול. צריך יותר זמן בין סבבים? Pause, ואז Play.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>רצועה 06ב<\/strong> (גרסה מהירה, כ־130–140 BPM) לסבב האחרון בריקוד, <strong>או<\/strong> שהסבב הזה נעשה בלי מוזיקה עם ספירה שלך.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>רצועת גשר קצרה (00ב)<\/strong> שמורה בפלייליסט במעברים שבהם את מוציאה ציוד או מסדרת שורות: לפני הקובייה (04) ולפני המסלול (05).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>שלט Bluetooth לטלפון<\/strong>, בכיס החצאית או ביד. איתו את עוצרת ומפעילה את ״הפסל״ בלי לרוץ לטלפון. <strong>המיפוי: Play/Pause = פסל, Next = הרצועה הבאה.<\/strong><ul>\n<li><strong>מה קונים:<\/strong> שלט שכתוב עליו במפורש ״media / music control: play/pause/next״. שלטי ״סלפי״ זולים שולחים בדרך כלל רק פקודת ״הגברת עוצמה״ (כדי לצלם), ולא עוצרים מוזיקה.<\/li>\n<li><strong>לבדוק בבית, מיד אחרי הקנייה,<\/strong> עם הנגן שבו את משתמשת בפועל. לא עובד? מחזירים.<\/li>\n<\/ul>\n<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>עוצמות<\/strong> נבדקות ונקבעות בחזרה הגנרלית.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>גיבוי:<\/strong> אותו פלייליסט גם בטלפון נוסף, או בדיסק־און־קי אם הרמקול תומך.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>כלל עוצמה:<\/strong> אם את צריכה להרים קול כדי לדבר עם מבוגר/ת שעומד/ת לידך, זה חזק מדי לילדים.<\/li>\n<\/ul>\n<h3>זכויות במוזיקה: לבדוק לפני הופעה בתשלום<\/h3>\n<p><strong>מה ידוע:<\/strong><\/p>\n<ul>\n<li>אקו״ם (ACUM) מנהלת בישראל את זכויות הביצוע הפומבי של יוצרים (מלחינים, כותבים ומעבדים) וגובה תמלוגים על השמעת מוזיקה בפני קהל. מקור: <a href=\"https://acum.org.il/en/\">אתר אקו״ם באנגלית<\/a>.<\/li>\n<li>לאקו״ם יש תעריפים שונים לפי סוג השימוש, ביניהם תעריף ל״אירועים משפחתיים״ (<a href=\"https://acum.org.il/en/tariff-public-performance/t008-family-events/\">T008 Family Events<\/a>). לפי מה שמופיע באתר שלהם, <strong>התעריף המפורסם אינו רישיון<\/strong>, ואת הרישיון מבקשים מראש. פרטי תעריף T008 (אירועים משפחתיים, כולל ימי הולדת): ראי <a href=\"13-legal-admin.md\">מסמך הרישוי והמנהלה<\/a>, פרק 8.2. <strong>לבדוק<\/strong> מול אקו״ם.<\/li>\n<li><strong>שירה חיה לא פותרת את השאלה.<\/strong> לפי מה שעולה מחיפוש על דף התעריף, הרישיון לאירוע משפחתי חל על השמעת מוזיקה מהרפרטואר של אקו״ם <strong>״בכל אמצעי״<\/strong>, כולל להקה וזמרים חיים, ולא רק הקלטה. <strong>לבדוק<\/strong> מול אקו״ם.<\/li>\n<li>חוץ מאקו״ם יש זכויות <strong>בהקלטה עצמה<\/strong>: של <strong>המבצעים<\/strong> (<a href=\"https://he.wikisource.org/wiki/חוק_זכויות_מבצעים_ומשדרים\">חוק זכויות מבצעים ומשדרים, התשמ״ד־1984<\/a>; גוף גבייה למשל <a href=\"https://eshkolot.co.il\">אשכולות<\/a>) ושל <strong>מפיקי ההקלטה<\/strong> (<a href=\"https://he.wikisource.org/wiki/חוק_זכות_יוצרים\">חוק זכות יוצרים, התשס״ח־2007<\/a>, שבו ״תקליט״ הוא יצירה מוגנת). <strong>לבדוק<\/strong> מי גובה, ואם זה רלוונטי אלייך.<\/li>\n<\/ul>\n<p><strong>מה עדיין לא ידוע בוודאות (ולכן מסומן לבדוק):<\/strong><\/p>\n<ul>\n<li><strong>מי חייב ברישיון<\/strong> כשמופע ילדים מוזמן לגן, למתנ״ס, לקייטנה או ליום הולדת בבית: את, המקום או המזמין? <strong>לבדוק<\/strong> ישירות מול אקו״ם, ולשאול גם את היועץ בפגישה (<a href=\"07-advisor-meeting.md\">סדר היום לפגישה<\/a>). הפירוט המשפטי נמצא ב<a href=\"13-legal-admin.md\">מסמך הרישוי והמנהלה<\/a>.<\/li>\n<li><strong>מה המחיר.<\/strong> אל תניחי מספר. קודם בודקים.<\/li>\n<\/ul>\n<p><strong>איך מקטינים את הבעיה כבר עכשיו:<\/strong><\/p>\n<ol>\n<li><strong>מוזיקה ״ללא תמלוגים״ (Royalty-Free) עם רישיון שמכסה במפורש הופעה חיה בפני קהל.<\/strong> הרבה רישיונות ״ללא תמלוגים״ מכסים סרטונים בלבד, אז <strong>קראי את תנאי הרישיון של כל רצועה<\/strong> ושמרי צילום מסך או PDF שלהם בתיקייה. <strong>ועוד בדיקה:<\/strong> לבדוק שהמלחין/ה של הרצועה לא רשום/ה בארגון גבייה (כמו אקו״ם או ארגון מקביל בחו״ל). אם כן, ייתכן שעדיין צריך רישיון ביצוע פומבי. <strong>לבדוק.<\/strong><\/li>\n<li><strong>מוזיקאי/ת חבר/ה<\/strong> שמכין/ה לך 6–8 רצועות קצב פשוטות, עם מסמך קצר בכתב שנותן לך זכות שימוש בהופעות ובסרטונים. <strong>לבדוק:<\/strong> אם המוזיקאי/ת חבר/ה באקו״ם, ייתכן שהזכויות מנוהלות דרכם.<\/li>\n<li><strong>מופע בלי מוזיקה מוקלטת:<\/strong> מחיאות כפיים, תופים על הברכיים, טמבורין או תוף מרים. חלק מהמשחקים עובדים ככה אפילו טוב יותר. (קצב ומנגינות שאת המצאת, לא שירים מוכרים: שירה חיה של שיר מוכר היא עדיין ביצוע של יצירה.)<\/li>\n<li><strong>לשאול את המקום:<\/strong> ״יש לכם הסדר עם אקו״ם?״ (<strong>לבדוק<\/strong> אם זה מכסה גם אותך.)<\/li>\n<li><strong>שיר מקורי של קים<\/strong> מגיע <strong>אחרי<\/strong> שהביקוש מוכח, לפי סדר ההשקעות ב<a href=\"01-concept.md\">מסמך הקונספט<\/a>.<\/li>\n<\/ol>\n<p><strong>סרטונים ברשתות<\/strong> הם עניין נפרד, עם כללים של כל פלטפורמה. ראי את <a href=\"09-filming-guide.md\">מדריך הצילום<\/a>.<\/p>\n<hr />\n<h2>9. צ׳קליסט בטיחות<\/h2>\n<h3>א. בשיחת ההזמנה (בטלפון, לפני שסוגרים)<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> כמה ילדים? באיזה גיל?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>יש מגבר?<\/strong> מעל 25 ילדים, או בחוץ, רק עם מגבר (שלך, שאול, או מערכת הגברה של המקום). אין? מגבילים ל־25 ילדים בפנים, או שני מופעים.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> באיזה חלל: פנים או חוץ? כמה גדול? איזו רצפה?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>בחוץ:<\/strong> יש צל מלא? באיזו שעה?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>כמה מבוגרים מהמקום יהיו בחדר לאורך כל המופע?<\/strong><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>ההכנה:<\/strong> ״אפשר שהילדים יהיו בחצר או בחדר אחר ב־15 הדקות של ההכנה?״ אם לא, מתארגנים בגלוי ונכנסים בגרסת ״אין איפה להתחבא״ (פרק 4).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ילדים עם צרכים מיוחדים, רגישויות או מגבלה בתנועה? (בלי שמות ובלי אבחנות, רק מה שצריך למופע)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>יום הולדת:<\/strong> יהיו פעוטות מתחת לגיל 3? (פרק 7, יום הולדת)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מה מצב אישורי הצילום? (<a href=\"08-consent-template.md\">טופס אישור הצילום<\/a>)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> יש שקע חשמל ליד הבמה? (למקרה שהרמקול צריך טעינה)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>יש לך את האישורים הנדרשים לעבודה עם ילדים<\/strong> (כמו אישור משטרה), ראי <a href=\"13-legal-admin.md\">מסמך הרישוי והמנהלה<\/a>?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>יש ביטוח אחריות כלפי צד שלישי בתוקף<\/strong> שמכסה מופע תנועה לילדים, ו״אישור קיום ביטוח״ שמור בתיקייה (ראי <a href=\"13-legal-admin.md\">מסמך הרישוי והמנהלה<\/a>, פרק 4). פיילוט חברים בלי ביטוח = החלטה מודעת אחרי שיחה עם סוכן/ת, <strong>לבדוק<\/strong>.<\/li>\n<\/ul>\n<h3>ב. בהגעה (20–30 דקות לפני)<\/h3>\n<p><strong>הרצפה והחלל:<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> הרצפה יבשה ולא חלקה. <strong>רטובה או חלקה? בלי ריצות ובלי קפיצות, רק משחקים במקום.<\/strong><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>גרביים על רצפה חלקה (פרקט, שיש) גורמות להחלקות.<\/strong> מבקשים נעליים או יחפים, לפי הכללים של המקום.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> אין זכוכית, חפצים חדים או צעצועים קטנים על הרצפה בשטח המשחק.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> פינות חדות של שולחנות וארונות רחוקות מאזור התנועה, או מוזזות.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>כלל אצבע (לא תקן):<\/strong> כל ילד/ה צריך/ה מספיק מקום כדי לפתוח ידיים לצדדים בלי לגעת באחר. אין מקום כזה? המופע עובר לגרסת ישיבה.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> יציאות פנויות, ומעבר באמצע הקהל.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>בחוץ:<\/strong> אין גישה לכביש, לבריכה, למדרגות או לחניה מאזור המשחק. צל מלא.<\/li>\n<\/ul>\n<p><strong>ציוד:<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> רמקול <strong>גבוה ויציב<\/strong>, מחוץ להישג יד של ילדים.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>כבלים מודבקים לרצפה<\/strong> או מוסתרים, כדי שאף אחד לא ייתקל.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> קו הבמה עשוי <strong>סרט הדבקה שטוח<\/strong>, לא חבל שאפשר להיתקל בו. <strong>בחוץ:<\/strong> את קו הבמה מסמנים בצלחות סימון שטוחות או קונוסים נמוכים (מרשימת הציוד), לא בסרט ולא בחבל.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> הקובייה והכדורים <strong>רכים<\/strong>. בלי כדורים קשים, בלי חפצים קטנים (סכנת בליעה לקטנים).<\/li>\n<\/ul>\n<p><strong>אנשים:<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> יודעת <strong>מי האחראי/ת<\/strong> ואיפה <strong>ערכת העזרה הראשונה<\/strong> של המקום.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> יודעת <strong>מה הכתובת המדויקת<\/strong> (למקרה שצריך להזמין את מד״א, 101).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> התדריך של דקה לאחראי/ת נעשה (פרק 4).<\/li>\n<\/ul>\n<h3>ג. במהלך המופע<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מרימים ילדים, לא מסובבים, לא נושאים על הגב.<\/strong> גם אם מבקשים.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מגע רק לפי בחירה של הילד/ה<\/strong> (כיף, אגרוף, נפנוף).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אף פעם לא לבד עם ילד/ה<\/strong> בחדר סגור. שירותים ובכי הם באחריות הצוות.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> קפיצות <strong>רק במקום<\/strong>, ריצה <strong>רק במקום<\/strong> (חוץ מ״מסלול אמיתי״ בקבוצה קטנה ובשטח פנוי).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> סיבובים: <strong>אחד ולאט.<\/strong><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>תנועה שילד/ה ממציא/ה = תנועה במקום, בתוך הבועה:<\/strong> בלי לשכב, בלי להתגלגל, בלי גלגלון/עמידת ידיים/שפגט, בלי לקפוץ מגובה ובלי לגעת באחרים (חוק זהב 9). את בודקת כל תנועה <strong>לפני<\/strong> שכל החדר מחקה אותה.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>פעוט/ה נכנס/ה לאזור המשחק?<\/strong> ״עם קים...״, כולם קופאים, הורה או איש/אשת צוות לוקח/ת, וממשיכים. לא זורקים כלום כשפעוט/ה באזור.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> בחוץ ובחום: <strong>הפסקת שתייה כל 10–15 דקות.<\/strong><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ספרי ילדים בתחילת המופע ובסופו (בקירוב), כדי לדעת שאף אחד לא ״נעלם״. האחריות על הנוכחות היא של הצוות, אבל עין נוספת לא מזיקה.<\/li>\n<\/ul>\n<h3>ד. אחרי<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>ספירת ציוד<\/strong>, כדי שאף כדור או צעיף לא נשאר אצל ילד/ה.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> כל אירוע בטיחות, גם ״כמעט״, נרשם ב<a href=\"05-pilot-feedback.md\">טופס המשוב<\/a>.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> צעיפים לכביסה. קובייה וכדורים לניגוב.<\/li>\n<\/ul>\n<h3>ה. ערכת עזרה ראשונה שלך (גם אם יש למ
