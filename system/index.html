h>מתי צריך<\/th>\n<th>עלות (הערכה, ₪)<\/th>\n<th>הערה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מגבר קול משלך<\/strong> (אם בפיילוט שאלת)<\/td>\n<td>קבוצות של 25+ ובחוץ, באופן קבוע<\/td>\n<td>85–400 (הערכה בלבד, לא נבדק מול מחירון)<\/td>\n<td>מגבר קטן למורים ומדריכים מספיק. מערכת מיקרופונים אלחוטית לאירועים <strong>לא נדרשת<\/strong>. <strong>לבדוק ב־zap לפני קנייה<\/strong><\/td>\n<\/tr>\n<tr>\n<td>20–30 צעיפי שיפון צבעוניים<\/td>\n<td>קטע 9<\/td>\n<td>60–150<\/td>\n<td>אפשר לגזור טול או שיפון מחנות בדים<\/td>\n<\/tr>\n<tr>\n<td>10 קונוסים או צלחות סימון<\/td>\n<td>״מסלול אמיתי״, <strong>וקו הבמה בחוץ<\/strong><\/td>\n<td>30–60<\/td>\n<td>צלחות שטוחות עדיפות, כי קשה יותר להיתקל בהן<\/td>\n<\/tr>\n<tr>\n<td>אבנט או סרט ״קפטן/ית של קים״<\/td>\n<td>ימי הולדת<\/td>\n<td>20–50<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>מדבקות ממותגות ״שחקן/ית של קים״ (100 יח׳)<\/td>\n<td>אחרי שיש לוגו<\/td>\n<td>80–200<\/td>\n<td>ראי <a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a><\/td>\n<\/tr>\n<tr>\n<td>עגלה מתקפלת או תיק גדול לציוד<\/td>\n<td>כשיש הופעות קבועות<\/td>\n<td>100–250<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>סוללה ניידת (Power Bank)<\/td>\n<td>גיבוי לטלפון<\/td>\n<td>60–150<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>רמקול רזרבי<\/td>\n<td>כשיש הופעות רצופות<\/td>\n<td>150–400<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>העלויות האלה נכנסות לחישוב המחיר ב<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>, כולל בלאי, כביסה ונסיעות.<\/em><\/p>\n<hr />\n<h2>11. גרסאות לפי גיל: 3–4, 5–6, 7–8<\/h2>\n<h3>ההבדלים הכלליים<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>3–4 (טרום־טרום חובה וטרום חובה)<\/strong><\/th>\n<th><strong>5–6 (גן חובה וכיתה א׳) — גרסת הבסיס<\/strong><\/th>\n<th><strong>7–8 (כיתות ב׳–ג׳)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>אורך<\/strong><\/td>\n<td>30 דק׳<\/td>\n<td>45 דק׳<\/td>\n<td>45–50 דק׳<\/td>\n<\/tr>\n<tr>\n<td><strong>חוקים<\/strong><\/td>\n<td>כמעט בלי. ״עשו כמוני״<\/td>\n<td>חוק אחד או שניים בכל משחק<\/td>\n<td>חוקים עם טריקים ושדרוגים<\/td>\n<\/tr>\n<tr>\n<td><strong>קול וכניסה<\/strong><\/td>\n<td>רך, בלי הפתעות מבהילות<\/td>\n<td>אנרגטי<\/td>\n<td>אנרגטי ״קול״, לא ״חמוד״<\/td>\n<\/tr>\n<tr>\n<td><strong>הומור<\/strong><\/td>\n<td>פיזי ופשוט (נופלים, ״אפצ׳י״)<\/td>\n<td>פיזי ומילולי<\/td>\n<td>אבסורדי, הפתעות, ״לעבוד״ על קים<\/td>\n<\/tr>\n<tr>\n<td><strong>תחרות<\/strong><\/td>\n<td>אין<\/td>\n<td>אין, רק ״כולנו נגד השיר״<\/td>\n<td>״שיא החדר״, כל שורה נגד השיא של עצמה<\/td>\n<\/tr>\n<tr>\n<td><strong>לשון<\/strong><\/td>\n<td>משפטים קצרים מאוד, הרבה חזרות<\/td>\n<td>רגילה<\/td>\n<td><strong>בלי ״חמודים״, ״מתוקים״ או ״ילדונים״.<\/strong> מדברים אליהם כאל שחקנים<\/td>\n<\/tr>\n<tr>\n<td><strong>תפקיד הילדים<\/strong><\/td>\n<td>מחקים<\/td>\n<td>מחקים ומובילים לפעמים<\/td>\n<td>ממציאים: תנועות, צדדי קובייה, תקלות<\/td>\n<\/tr>\n<tr>\n<td><strong>ליד מי<\/strong><\/td>\n<td>הורים או גננות קרובים<\/td>\n<td>צוות בחדר<\/td>\n<td>צוות בחדר<\/td>\n<\/tr>\n<tr>\n<td><strong>סימן עצירה<\/strong><\/td>\n<td><strong>המוזיקה נעצרת + ״פסל!״ + ״כולם לשבת״.<\/strong> את ״עם קים...״ עדיין אומרים, אבל בגיל הזה מרימים ידיים <strong>בלי חובה לקפוא<\/strong> (<a href=\"14-character-bible.md\">ספר הדמות<\/a>, 4.1)<\/td>\n<td>״עם קים...״ ← עונים וקופאים<\/td>\n<td>״עם קים...״ ← עונים וקופאים<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>התאמה לפי קטע<\/h3>\n<table>\n<thead>\n<tr>\n<th>קטע<\/th>\n<th>3–4<\/th>\n<th>5–6<\/th>\n<th>7–8<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. כניסה<\/td>\n<td>מציצים, ״קוקו!״, בלי צעקות מבחוץ<\/td>\n<td>כמו בתסריט<\/td>\n<td>כמו בתסריט + ״מבחן״ קשה יותר: ״מי יודע לשחק, שיגע באף עם המרפק!״<\/td>\n<\/tr>\n<tr>\n<td>2. קריאה<\/td>\n<td>3 גרסאות בלבד (רגיל, לחישה, אריה)<\/td>\n<td>כמו בתסריט<\/td>\n<td>״קריאה עם מכשול״ כ<strong>משחק אחד של 60 שניות, רק בתוך קטע 2<\/strong>: עונים רק אם קים עשתה את תנועת היד. מיד אחריו מאפסים: <strong>קים:<\/strong> ״מעכשיו — עונים תמיד, גם בלי יד!״ (כי בהמשך הידיים שלך עסוקות בקובייה ובשלט, והשורות האחרונות לא תמיד רואות אותן)<\/td>\n<\/tr>\n<tr>\n<td>3. קים אומרת<\/td>\n<td><strong>״עשו כמוני״<\/strong> (חיקוי, בלי מלכודות), עם הרבה חיות: צפרדע, ארנב, פיל<\/td>\n<td>כמו בתסריט<\/td>\n<td>מלכודות כפולות (״קים אמרה״, ״קים לא אומרת״), קצב מהיר, 2–3 ילדים מובילים (תנועות במקום, חוק זהב 9)<\/td>\n<\/tr>\n<tr>\n<td>4. פסל<\/td>\n<td>עצירות קצרות, בלי שומרים מצטרפים<\/td>\n<td>כמו בתסריט<\/td>\n<td>״פסל בזוגות״: שני ילדים יוצרים פסל אחד <strong>בלי לגעת<\/strong><\/td>\n<\/tr>\n<tr>\n<td>5. קובייה<\/td>\n<td><strong>קים זורקת<\/strong>, תמונות גדולות, בלי שדרוגים<\/td>\n<td>כמו בתסריט<\/td>\n<td>2 זריקות ברצף, וצד שישי ״ממציאים״ על פתק. <strong>קים קוראת ומאשרת את הפתק לפי חוק זהב 9 לפני שהוא נכנס לקובייה<\/strong><\/td>\n<\/tr>\n<tr>\n<td>6. קים משתגעת<\/td>\n<td>3 תקלות בלבד (יד, רגל, אפצ׳י), קצר<\/td>\n<td>כמו בתסריט<\/td>\n<td>הם בוחרים מה ״יתקלקל״, ומתנדב/ת מגלם/ת ״תקלה״ לרגע: <strong>מהמקום, בעמידה<\/strong>, לפי חוק זהב 9 (בלי ״להתמוטט״ לרצפה)<\/td>\n<\/tr>\n<tr>\n<td>7. מסלול<\/td>\n<td><strong>אופציונלי: 3 דק׳ במקום הפסל, אם הקבוצה רגועה.<\/strong> בלי שורות: מעגל בישיבה, ״הכדור הקסום עובר״<\/td>\n<td>כמו בתסריט<\/td>\n<td>סבב מרפקים + ״שיא החדר״<\/td>\n<\/tr>\n<tr>\n<td>8. ריקוד<\/td>\n<td><strong>2 תנועות<\/strong> (השמש, הקפיץ) + קפיאה<\/td>\n<td>4 תנועות<\/td>\n<td>4 תנועות + <strong>תנועה חמישית שהם ממציאים<\/strong> ובוחרים במחיאות כפיים, ״התנועה של הכיתה״. <strong>קים מאשרת את ההצעות לפי חוק זהב 9 לפני ההצבעה<\/strong><\/td>\n<\/tr>\n<tr>\n<td>9. נשימה<\/td>\n<td>בלון, בלי ״אתם לא יודעים לשחק״<\/td>\n<td>כמו בתסריט<\/td>\n<td>״כמה שניות אפשר לנשוף?״ שיא נשיפה שקטה<\/td>\n<\/tr>\n<tr>\n<td>10. סיום<\/td>\n<td>קריאה אחת, ״פסל אחרון״ ונפנוף<\/td>\n<td>כמו בתסריט<\/td>\n<td>כמו בתסריט<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>ציר הזמן של גרסת 3–4 (30 דק׳)<\/h3>\n<table>\n<thead>\n<tr>\n<th>דקות<\/th>\n<th>קטע<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–2<\/td>\n<td>כניסה רכה<\/td>\n<\/tr>\n<tr>\n<td>2–5<\/td>\n<td>הקריאה הסודית (3 גרסאות)<\/td>\n<\/tr>\n<tr>\n<td>5–10<\/td>\n<td>עשו כמוני<\/td>\n<\/tr>\n<tr>\n<td>10–13<\/td>\n<td>הפסל<\/td>\n<\/tr>\n<tr>\n<td>13–19<\/td>\n<td>קוביית קים (קים זורקת)<\/td>\n<\/tr>\n<tr>\n<td>19–22<\/td>\n<td>קים משתגעת (קצר)<\/td>\n<\/tr>\n<tr>\n<td>22–26<\/td>\n<td>הריקוד (2 תנועות)<\/td>\n<\/tr>\n<tr>\n<td>26–29<\/td>\n<td>בלון ותודה<\/td>\n<\/tr>\n<tr>\n<td>29–30<\/td>\n<td>סיום ו״פסל אחרון״<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>קבוצה רגועה? אפשר להחליף את הפסל (10–13) ב״הכדור הקסום עובר״ במעגל בישיבה. זה לא חובה, ובטופס המשוב קטע שלא התקיים פשוט לא נספר.<\/em><\/p>\n<p><strong>קבוצת גילאים מעורבת<\/strong> (למשל יום הולדת עם אחים): מכוונים לגיל <strong>הצעיר<\/strong> בחוקים, ונותנים לגדולים <strong>תפקידים<\/strong>: ״עוזר/ת של קים״, ״קפטן/ית של שורה״ במסלול, ״שופט/ת״.<\/p>\n<hr />\n<h2>12. תוכנית חזרות<\/h2>\n<p><strong>היעד:<\/strong> אחרי 3 שבועות את מריצה את כל המופע בתלבושת, בזמן, בלי דף, ויודעת מה לעשות בכל ״תקלה״.<\/p>\n<p><strong>איך זה משתלב בתוכנית 30 הימים<\/strong> (<a href=\"01-concept.md\">מסמך הקונספט<\/a>): שם הפיילוט בשבוע 3, ובשבוע 2 צריך גם לפתוח ערוצים ולפרסם 3 סרטונים. כלומר החזרות רצות <strong>במקביל<\/strong> לצילומים. בשבוע 3 החזרה הגנרלית וכרטיסי התקלה לוקחים את הימים הראשונים, והפיילוט מגיע בסוף השבוע. לא מספיקה? <strong>הפיילוט זז לשבוע 4, וזה בסדר.<\/strong> עדיף פיילוט שבוע מאוחר מפיילוט לא מוכן.<\/p>\n<p><strong>מה לשנן ומה לא:<\/strong> לא משננים כל מילה. משננים את ה<strong>שלד<\/strong>: סדר הקטעים, המשפט הראשון בכל קטע, ההסבר של 20 השניות ומשפט המעבר. כל השאר בא מהאלתור, ובזה את טובה.<\/p>\n<h3>שבוע 1: לבד<\/h3>\n<table>\n<thead>\n<tr>\n<th>יום<\/th>\n<th>מה עושים<\/th>\n<th>כמה זמן<\/th>\n<th>סימן שסיימת<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>קוראת את כל התסריט בקול ומקליטה את עצמך בטלפון. מסמנת משפטים שלא ״שלך״<\/td>\n<td>שעה<\/td>\n<td>יש לך הקלטה<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>כותבת מחדש במילים שלך את המשפטים שסימנת. מכינה את דף הבמה (פרק 14)<\/td>\n<td>שעה<\/td>\n<td>יש דף במה<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>20 השניות:<\/strong> מתרגלת את ההסבר של כל משחק מול טיימר. כל הסבר ארוך מ־20 שניות נכתב מחדש<\/td>\n<td>45 דק׳<\/td>\n<td>כל ההסברים מתחת ל־20 שניות<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><strong>מעברים:<\/strong> מתרגלת רק את משפטי המעבר, 1←2←3... <strong>כאן רוב המופעים מאבדים את הילדים<\/strong><\/td>\n<td>30 דק׳<\/td>\n<td>עוברת את כל המעברים בלי דף<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><strong>עם מוזיקה:<\/strong> מכינה את הפלייליסט (פרק 8) ומתרגלת את ״הפסל״ עם השלט ואת הריקוד בקצב<\/td>\n<td>שעה<\/td>\n<td>השלט עובד, הריקוד ״יושב״ על הקצב<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><strong>קים משתגעת מול מראה או מצלמה:<\/strong> מצלמת את עצמך (ראי <a href=\"09-filming-guide.md\">מדריך הצילום<\/a>), צופה ומגדילה את מה שקטן מדי<\/td>\n<td>45 דק׳<\/td>\n<td>את צוחקת על עצמך בצפייה<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td><strong>ריצה ראשונה מלאה, עם טיימר,<\/strong> בתלבושת, או בבגדי תנועה דומים (חצאית, טייץ, סניקרס) אם התלבושת עוד לא מוכנה (<a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a>). ממלאת את טבלת הזמנים למטה<\/td>\n<td>שעה וחצי<\/td>\n<td>יש זמנים לכל קטע<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>טריק ל״קהל דמיוני״:<\/strong> הושיבי בובות או כיסאות בחצי עיגול. תרגלי מבט שעובר על כל ״הקהל״, משמאל לימין ובחזרה.<\/p>\n<p><strong>חזרה עם הפרעות:<\/strong> הפעילי ברקע סרטון של רעש ילדים ממקום הומה, ותרגלי את ארגז הכלים (פרק 6) מעל הרעש <strong>בלי להרים קול<\/strong>.<\/p>\n<h3>שבוע 2: עם ילדים של חברים<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מגייסים 3–6 ילדים<\/strong> בגילאי היעד, ילדים של חברות או של המשפחה. הכי טוב גיל מעורב, וגם ילד/ה אחד/ת ״קשה״ (ביישן/ית או פרוע/ה).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>הורה אחד לפחות בחדר<\/strong> לאורך כל הזמן.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>צילום רק לשימוש פנימי שלך<\/strong>, ורק באישור הורים (<a href=\"08-consent-template.md\">טופס אישור הצילום<\/a>). הכי טוב לצלם <strong>מאחורי הילדים<\/strong>: רואים אותך ואת התגובה הכללית, לא פנים.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מריצים 25–30 דקות:<\/strong> קטעים 1, 2, 3, 5, 6, 8, 10.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>שואלים את הילדים בסוף:<\/strong> ״מה הכי אהבתם? מה היה קצת משעמם? מה הייתם מוסיפים?״<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>ממלאים את ״הגרסה המינימלית״ של <a href=\"05-pilot-feedback.md\">טופס המשוב<\/a><\/strong>, כדי לתרגל גם אותו.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מתקנים<\/strong> לפי כללי ההחלטה בטופס (עד 2 שינויים) וחוזרים פעם נוספת באותו שבוע, אם אפשר.<\/li>\n<\/ul>\n<p><em>אם המפגש הזה נעשה עם צופה וטופס משוב ממולא (לפחות הגרסה המינימלית), הוא נחשב <\/em><em>פיילוט חברים מספר 1<\/em><em> (שלב 0 ב<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>, שמרשה עד 2 הופעות כאלה). בלי צופה וטופס, זו חזרה ולא פיילוט.<\/em><\/p>\n<h3>שבוע 3: חזרה גנרלית, ״כרטיסי תקלה״ ופיילוט<\/h3>\n<p><strong>החלוקה:<\/strong> ימים 1–2 חזרה גנרלית וכרטיסי תקלה. פיילוט בימים 5–7. לא מספיקה? הפיילוט זז לשבוע 4, וזה בסדר.<\/p>\n<p><strong>חזרה גנרלית:<\/strong> כל 45 הדקות בתלבושת, עם מוזיקה ושלט, בחלל שדומה לחלל האמיתי (סלון גדול, חדר במתנ״ס, גינה), עם חבר/ה שמשחק/ת את ״הצוות״.<\/p>\n<p><strong>כרטיסי תקלה:<\/strong> כתבי את המצבים האלה על פתקים. החבר/ה שולף/ת פתק בזמן אקראי ומשחק/ת אותו, ואת מגיבה לפי פרק 7.<\/p>\n<table>\n<thead>\n<tr>\n<th>כרטיס<\/th>\n<th>מה החבר/ה עושה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>״אני בוכה״<\/td>\n<td>בוכה בשורה הראשונה<\/td>\n<\/tr>\n<tr>\n<td>״אני לא רוצה״<\/td>\n<td>יושב/ת עם ידיים שלובות<\/td>\n<\/tr>\n<tr>\n<td>״אני רץ לבמה״<\/td>\n<td>חוצה את הקו באמצע קטע<\/td>\n<\/tr>\n<tr>\n<td>״אני צועק כל הזמן״<\/td>\n<td>לא מפסיק/ה לצעוק ״עוד!״<\/td>\n<\/tr>\n<tr>\n<td>״המוזיקה נפסקה״<\/td>\n<td>מכבה את הרמקול<\/td>\n<\/tr>\n<tr>\n<td>״חסר זמן״<\/td>\n<td>אומר/ת באמצע: ״יש לך עוד 15 דקות״<\/td>\n<\/tr>\n<tr>\n<td>״הגננת יוצאת״<\/td>\n<td>יוצא/ת מהחדר<\/td>\n<\/tr>\n<tr>\n<td>״חם מאוד״<\/td>\n<td>אומר/ת: ״הילדים אדומים ועייפים״<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>יום לפני ויום ההופעה<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>יום לפני:<\/strong> הטלפון והרמקול טעונים, הפלייליסט עובד בלי אינטרנט, השלט מחובר, הציוד בתיק, התלבושת מוכנה (ומכובסת), דף הבמה מודפס, הכתובת והאחראי/ת אושרו.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>יום לפני:<\/strong> בחום, בודקים את תחזית עומס החום (<a href=\"https://ims.gov.il\">ims.gov.il<\/a>).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>בוקר ההופעה:<\/strong> ארוחה קלה, מים, <strong>חימום קול<\/strong> (5 דק׳): ״מממממ״ עם שפתיים סגורות, ״ברררר״ עם שפתיים רוטטות, סירנה מנמוך לגבוה, ומשפט הפתיחה בשלוש עוצמות.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>30 דקות לפני:<\/strong> פרק 4.<\/li>\n<\/ul>\n<h3>טבלת זמנים לחזרות<\/h3>\n<table>\n<thead>\n<tr>\n<th>קטע<\/th>\n<th>זמן מתוכנן<\/th>\n<th>ריצה 1<\/th>\n<th>ריצה 2<\/th>\n<th>ריצה 3<\/th>\n<th>הערות<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. כניסה<\/td>\n<td>3:00<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2. קריאה<\/td>\n<td>3:00<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3. קים אומרת<\/td>\n<td>7:00<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4. פסל<\/td>\n<td>4:00<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5. קובייה<\/td>\n<td>8:00<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>6. קים משתגעת<\/td>\n<td>5:00<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>7. מסלול<\/td>\n<td>6:00<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>8. ריקוד<\/td>\n<td>5:00<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>9. נשימה<\/td>\n<td>3:00<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>10. סיום<\/td>\n<td>1:00<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>סה״כ<\/strong><\/td>\n<td><strong>45:00<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>שמירה על הקול:<\/strong> בקבוצות של יותר מ־25 ילדים, או בחוץ, משתמשים במגבר. שותים מים בין קטעים. את הקול ״הגדול״ מוציאים מהבטן ולא מהגרון. אם הקול צרוד אחרי חזרה, זה סימן שצריך מגבר, או להנמיך יותר.<\/p>\n<hr />\n<h2>13. בנק משחקים חלופיים<\/h2>\n<p>משחקים להחלפת קטע שלא עובד (לפי כללי ההחלטה ב<a href=\"05-pilot-feedback.md\">טופס המשוב<\/a>), לקבוצה פרועה, לחום או לגיל צעיר. <strong>לכל משחק יש הסבר של עד 20 שניות.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>משחק<\/th>\n<th>ההסבר (עד 20 שניות)<\/th>\n<th>אנרגיה<\/th>\n<th>מתי כדאי<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>הרמזור של קים<\/strong><\/td>\n<td>״ירוק, רצים במקום. צהוב, הולכים לאט־לאט במקום. אדום, פסל! מוכנים? ירוק!״ (7–8: ״כחול, קופצים. סגול, מסתובבים.״)<\/td>\n<td>███<\/td>\n<td>במקום ״קים אומרת״. <strong>לגיל 3–4: רק ירוק (רצים במקום) ואדום (פסל).<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>האוטובוס של קים<\/strong> (בישיבה)<\/td>\n<td>״כולם עולים לאוטובוס של קים! ידיים על ההגה... סיבוב ימינה, כולם נוטים! בור בכביש, קופצים בישיבה! ברקס! פנצ׳ר, פשששש...״<\/td>\n<td>██<\/td>\n<td>קבוצה פרועה, חום, גיל 3–4<\/td>\n<\/tr>\n<tr>\n<td><strong>הד מחיאות<\/strong><\/td>\n<td>״אני מוחאת, אתם מחזירים בדיוק אותו דבר. טה, טה, טה־טה־טה!״ ומסבכים בהדרגה<\/td>\n<td>██<\/td>\n<td>אין מוזיקה, צריך שקט<\/td>\n<\/tr>\n<tr>\n<td><strong>המראה של קים<\/strong><\/td>\n<td>״אתם המראה שלי. כל מה שאני עושה, אתם עושים בדיוק, בהילוך איטי.״<\/td>\n<td>██<\/td>\n<td>במקום ״הפסל״ או כנשימה<\/td>\n<\/tr>\n<tr>\n<td><strong>מה יש בקופסה?<\/strong><\/td>\n<td>״יש לי פה קופסה דמיונית. <em>(מוציאה ׳מסטיק דביק׳ ונתקעת בו)<\/em> מה הוצאתי? ...עכשיו אתם מוציאים משהו!״<\/td>\n<td>███<\/td>\n<td>7–8, במקו נמיכים.<\/strong> · <strong>לא מרימים ילדים.<\/strong> · <strong>הצוות בחדר.<\/strong> · <strong>חירום: 101<\/strong><\/p>\n<p><strong>מתקצרים?<\/strong> בלי המסלול ← קים אומרת קצר ← קים משתגעת קצר ← בלי הפסל. <strong>תמיד משאירים 30 שנ׳ של אגודלים<\/strong> (אפשר בתוך הסיום).<\/p>\n<hr />\n<h2>15. מקורות ודברים לבדוק<\/h2>\n<table>\n<thead>\n<tr>\n<th>נושא<\/th>\n<th>מקור<\/th>\n<th>סטטוס<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>אקו״ם, רישוי ביצוע פומבי<\/td>\n<td><a href=\"https://acum.org.il/en/\">acum.org.il/en<\/a><\/td>\n<td><strong>לבדוק<\/strong> מי חייב ברישיון במופע שלך ובכמה<\/td>\n<\/tr>\n<tr>\n<td>אקו״ם, תעריף אירועים משפחתיים (כולל ימי הולדת)<\/td>\n<td><a href=\"https://acum.org.il/en/tariff-public-performance/t008-family-events/\">T008 Family Events<\/a><\/td>\n<td><strong>לבדוק<\/strong> מול אקו״ם. הפרטים ב<a href=\"13-legal-admin.md\">מסמך הרישוי והמנהלה<\/a>, פרק 8.2<\/td>\n<\/tr>\n<tr>\n<td>זכויות בהקלטה: מבצעים ומפיקים<\/td>\n<td>מבצעים: <a href=\"https://he.wikisource.org/wiki/חוק_זכויות_מבצעים_ומשדרים\">חוק זכויות מבצעים ומשדרים, התשמ״ד־1984<\/a>. מפיקי הקלטות: <a href=\"https://he.wikisource.org/wiki/חוק_זכות_יוצרים\">חוק זכות יוצרים, התשס״ח־2007<\/a><\/td>\n<td><strong>לבדוק<\/strong> אילו גופי גבייה רלוונטיים אלייך<\/td>\n<\/tr>\n<tr>\n<td>עומס חום, תחזית ואזהרות<\/td>\n<td><a href=\"https://ims.gov.il\">השירות המטאורולוגי<\/a>, <a href=\"https://ims.gov.il/he/IMSwarnings\">עמוד האזהרות<\/a><\/td>\n<td>לבדוק לפני כל הופעה בחוץ בקיץ<\/td>\n<\/tr>\n<tr>\n<td>הנחיות חום למוסדות חינוך<\/td>\n<td><a href=\"https://parents.education.gov.il/gov-education/vacations-camps-leisure/summer-camps/\">פורטל ההורים, משרד החינוך<\/a> (<strong>לבדוק שהעמוד קיים ומה כתוב בו<\/strong>); <a href=\"https://www.srugim.co.il/448139-בעקבות-מזג-האוויר-משרד-החינוך-בהנחיות\">דיווח בסרוגים<\/a><\/td>\n<td><strong>לבדוק<\/strong> את ההנחיה העדכנית<\/td>\n<\/tr>\n<tr>\n<td>מחירי ציוד<\/td>\n<td><a href=\"https://www.zap.co.il\">zap.co.il<\/a><\/td>\n<td><strong>הערכה בלבד, לא נבדק מול מחירון.<\/strong> לבדוק ב־zap לפני קנייה<\/td>\n<\/tr>\n<tr>\n<td>אישורים לעבודה עם ילדים, ביטוח, עסק<\/td>\n<td><a href=\"13-legal-admin.md\">מסמך הרישוי והמנהלה<\/a> (ביטוח: פרק 4. אישורי משטרה: פרק 5)<\/td>\n<td>שם כל הפרטים<\/td>\n<\/tr>\n<tr>\n<td>חירום רפואי<\/td>\n<td>מד״א, <strong>101<\/strong><\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>קבצים קשורים:<\/strong>\n<a href=\"01-concept.md\">מסמך הקונספט<\/a> · <a href=\"05-pilot-feedback.md\">טופס המשוב לפיילוט<\/a> · <a href=\"06-show-offer.md\">הצעת המופע<\/a> · <a href=\"08-consent-template.md\">טופס אישור הצילום<\/a> · <a href=\"12-booking-process.md\">תהליך ההזמנה<\/a> · <a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a> · <a href=\"14-character-bible.md\">ספר הדמות<\/a> · <a href=\"15-costume-and-logo.md\">תלבושת ולוגו<\/a> · <a href=\"03-video-scripts.md\">תסריטי הווידאו<\/a> · <a href=\"09-filming-guide.md\">מדריך הצילום<\/a><\/p>"}, "docs/03-video-scripts.md": {"title": "תסריטי סרטונים — סרטון היכרות + 12 סרטונים לחודש הראשון", "html": "<h1>תסריטי סרטונים — סרטון היכרות + 12 סרטונים לחודש הראשון<\/h1>\n<blockquote>\n<p><strong>בשביל מה הקובץ הזה:<\/strong> כאן כתוב מילה במילה מה לצלם ומה לפרסם בחודש התוכן הראשון של ״קים משחקים״: סרטון היכרות, 12 סרטונים קצרים (4 שבועות, 3 בשבוע), תוכנית סטוריז ותבנית ללוח תוכן חודשי.\n<strong>איך מצלמים, עורכים, מפרסמים ומודדים<\/strong> — ב<a href=\"09-filming-guide.md\">מדריך הצילום והפרסום<\/a>.<\/p>\n<\/blockquote>\n<hr />\n<h2>איך עובדים עם הקובץ — סדר פעולות<\/h2>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>1. קראי פעם אחת<\/strong> את ״חוקי הזהב״ ואת ״המבנה הקבוע של סרטון״ (5 דקות). הם חלים על כל סרטון.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>2. תצלמי קודם את סרטון ההיכרות<\/strong> (סרטון 0). הוא עולה ראשון ונשאר מוצמד לפרופיל.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>3. תדפיסי את ״כרטיס הביטים״<\/strong> של כל סרטון (הטבלה שבו) ותדביקי ליד הטלפון ביום הצילום.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>4. תצלמי במרוכז:<\/strong> 6 סרטונים בכ־2 שעות, לפי פרק ״יום צילום מרוכז״ ב<a href=\"09-filming-guide.md\">מדריך הצילום<\/a>. בכל סרטון מצלמים קודם את הקטעים הרחבים ואחר כך את קטעי המדיום (עמודת ״מסגור״ בכל טבלה).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>5. תערכי<\/strong> לפי ״תהליך העריכה ב־10 צעדים״ ב<a href=\"09-filming-guide.md\">מדריך הצילום<\/a>.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>6. תפרסמי<\/strong> עם הכיתוב וההאשטגים שמופיעים כאן, לפי צ׳קליסט הפרסום.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>7. תמדדי<\/strong> אחרי 48 שעות ואחרי 7 ימים (גיליון המדדים במדריך הצילום).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>8. ביום ה׳, 7 ימים אחרי שסרטון 12 עלה,<\/strong> תחליטי במה להשקיע בחודש השני (פרק ״אחרי 4 שבועות: במה להשקיע״ במדריך הצילום). בשבוע הזה עולים 3 סרטוני ״גשר״ (ראי ״החודש הראשון — ממולא״).<\/li>\n<\/ul>\n<h3>מילון קצר<\/h3>\n<table>\n<thead>\n<tr>\n<th>מילה<\/th>\n<th>מה זה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>הוק<\/strong><\/td>\n<td>2 השניות הראשונות, שתופסות את הצופה לפני שהוא גולל הלאה<\/td>\n<\/tr>\n<tr>\n<td><strong>ביט<\/strong><\/td>\n<td>קטע קצר בתסריט (שורה אחת בטבלה)<\/td>\n<\/tr>\n<tr>\n<td><strong>כרטיס ביטים<\/strong><\/td>\n<td>דף מודפס עם רשימת הביטים של סרטון אחד, שמדביקים ליד הטלפון<\/td>\n<\/tr>\n<tr>\n<td><strong>טוויסט<\/strong><\/td>\n<td>הפתעה לקראת הסוף: קים טועה, כלל חדש, בדיחה<\/td>\n<\/tr>\n<tr>\n<td><strong>בנק<\/strong><\/td>\n<td>מלאי שמצלמים מראש (הוקים, סיומים, בלופרים) ומשתמשים בו אחר כך<\/td>\n<\/tr>\n<tr>\n<td><strong>סלוט<\/strong><\/td>\n<td>משבצת בלוח הפרסום (למשל ״הסלוט של יום ג׳״)<\/td>\n<\/tr>\n<tr>\n<td><strong>ג׳אמפ־קאט<\/strong><\/td>\n<td>חיתוך מהיר שמוריד הפסקה מיותרת באמצע משפט או בין ביטים<\/td>\n<\/tr>\n<tr>\n<td><strong>רחב / מדיום<\/strong><\/td>\n<td>רחב = כל הגוף, הטלפון במרחק 2–3 מטר. מדיום = מהמותניים ומעלה, כ־1–1.5 מטר (פרק 5 ב<a href=\"09-filming-guide.md\">מדריך הצילום<\/a>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>איפה זה נכנס בתוכנית 30 הימים (מתוך <a href=\"01-concept.md\">הקונספט<\/a>)<\/h3>\n<table>\n<thead>\n<tr>\n<th>שבוע בתוכנית<\/th>\n<th>שלב<\/th>\n<th>מה קורה בתוכן<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>שבוע 1<\/td>\n<td>גיבוש<\/td>\n<td><strong>ניסיונות פרטיים בתחילת השבוע:<\/strong> מצלמים את סרטון ההיכרות ואת סרטונים 1–3, צופים בביקורתיות, מתקנים. סוגרים תנועת יד וקריאת קהל. <strong>ביום ה׳:<\/strong> פותחים את הערוצים, וסרטון ההיכרות (0) עולה ומוצמד. <strong>ביום ה׳ או ו׳:<\/strong> יום צילום 1 (סרטונים 1–6).<\/td>\n<\/tr>\n<tr>\n<td>שבוע 2<\/td>\n<td>עלייה לאוויר<\/td>\n<td><strong>שבוע תוכן 1<\/strong> (סרטונים 1–3, א׳/ג׳/ה׳).<\/td>\n<\/tr>\n<tr>\n<td>שבוע 3<\/td>\n<td>פיילוט שטח<\/td>\n<td><strong>שבוע תוכן 2<\/strong> (סרטונים 4–6) + סטוריז מהפיילוט, בלי ילדים מזוהים. <strong>ביום ה׳ או ו׳:<\/strong> יום צילום 2 (לא ביום הפיילוט).<\/td>\n<\/tr>\n<tr>\n<td>שבוע 4<\/td>\n<td>אריזה עסקית<\/td>\n<td><strong>שבוע תוכן 3<\/strong> (סרטונים 7–9).<\/td>\n<\/tr>\n<tr>\n<td>שבוע 5<\/td>\n<td>—<\/td>\n<td><strong>שבוע תוכן 4<\/strong> (סרטונים 10–12). <strong>בסוף השבוע:<\/strong> יום צילום 3, קצר (3 סרטוני גשר).<\/td>\n<\/tr>\n<tr>\n<td>שבוע 6<\/td>\n<td>—<\/td>\n<td><strong>שבוע גשר:<\/strong> 3 סרטונים מבנק הרעיונות עולים בזמן שאוספים נתונים. <strong>ביום ה׳:<\/strong> סיכום מדדים והחלטה לחודש 2.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>ימי פרסום מוצעים:<\/strong> א׳, ג׳, ה׳. זו נקודת התחלה ולא עובדה. אחרי שבועיים תבדקי בתובנות של החשבון באילו ימים ושעות העוקבים שלך פעילים, ותזיזי בהתאם. שתי השערות לבדיקה: אחר הצהריים (16:00–18:00), כשהילדים בבית והורים מחפשים פעילות, או בערב (20:30–21:30), כשהילדים כבר ישנים וההורים גוללים.<\/p>\n<\/blockquote>\n<hr />\n<h2>חוקי הזהב — לכל סרטון, בלי יוצא מן הכלל<\/h2>\n<ol>\n<li><strong>ההוק ב־2 השניות הראשונות.<\/strong> בפריים הראשון קים כבר בתנועה, ויש טקסט על המסך. בלי ״היי, מה קורה, היום נעשה...״. אם בשנייה 2 עוד לא ברור מה המשחק, הצופה כבר גלל הלאה.<\/li>\n<li><strong>משחק אחד, כלל אחד.<\/strong> אם לוקח יותר מ־5 שניות להסביר את הכלל, המשחק מסובך מדי לסרטון קצר. אותו משחק יכול להיכנס <a href=\"02-show-script.md\">למופע<\/a>.<\/li>\n<li><strong>הילדים בבית קמים מהספה.<\/strong> בכל סרטון יש רגע של ״עכשיו אתם!״ ופאוזה קצרה שבה קים <em>מחכה<\/em> להם.<\/li>\n<li><strong>סיום קבוע:<\/strong> קריאה ותגובה (ראי ״המבנה הקבוע״ למטה). זה העוגן של המותג.<\/li>\n<li><strong>כתוביות בעברית תמיד.<\/strong> הרבה הורים צופים בלי סאונד.<\/li>\n<li><strong>הסרטון מדבר לילדים, הכיתוב מדבר להורים.<\/strong> ב־Instagram וב־TikTok גיל המינימום לפתיחת חשבון הוא 13 (ראי פרק ״כללי הפלטפורמות לגבי ילדים״ ב<a href=\"09-filming-guide.md\">מדריך הצילום<\/a>). מי שרואה, שומר, משתף ומזמין הם ההורים והגננות. לכן:\n   - <strong>לעולם לא<\/strong> מבקשים מהילדים ״תעשו לייק / תעקבו / תירשמו לערוץ״, ולא מבקשים מהם לכתוב בתגובות.\n   - את הקריאה לכתוב בתגובות מפנים <strong>להורים<\/strong>, ורק <strong>בכיתוב<\/strong>: ״הורים, כתבו לנו...״.\n   - <strong>בסרטון עצמו (שמדבר לילדים) אין קריאה לקנות, להזמין או ״לבקש מאמא ואבא״.<\/strong> מכירה והזמנות רק בכיתוב, ורק להורים. בישראל יש כללים מיוחדים לפרסומת שמכוונת לקטינים: <a href=\"https://he.wikisource.org/wiki/חוק_הגנת_הצרכן\">סעיף 7א לחוק הגנת הצרכן<\/a> ו״תקנות הגנת הצרכן (פרסומת המכוונת לקטינים), התשנ״א־1991״. ב־2006 הוצע לשנות את שמן ל״פרסומת ודרכי שיווק המכוונים לקטינים״ (מקור: <a href=\"https://www.kolzchut.org.il/he/חוק_הגנת_הצרכן\">כל זכות — חוק הגנת הצרכן<\/a>). <strong>לבדוק<\/strong> את הנוסח העדכני ומה בדיוק התקנות דורשות, ולעבור על זה עם עו״ד <strong>לפני<\/strong> תוכן ממומן או מכירת מוצרים (ראי <a href=\"13-legal-admin.md\">רישוי ומנהלה<\/a>).<\/li>\n<li><strong>״מתרגל״, לא ״משפר״ ולא ״מטפל״.<\/strong> את לא מבטיחה תוצאות התפתחותיות. כותבים ״משחק שמתרגל שיווי משקל״, ולא ״משפר קשב״ או ״מומלץ לילדים עם...״.<\/li>\n<li><strong>בטיחות בבית.<\/strong> כל סרטון תנועה כולל ״תפנו מקום!״ (במילים או בטקסט). אין פעלולים שילד לא יכול לעשות בבטחה בסלון: לא מטפסים על רהיטים, לא קופצים בעיניים עצומות, ומשתמשים רק בחפצים רכים. כש״קים נופלת״, זו נפילה קומית ומבוקרת (מורידה רגל, מתיישבת בדרמטיות), לא נפילה אמיתית לרצפה שילד יחקה.<\/li>\n<li><strong>ילדים בסרטון רק באישור חתום.<\/strong> ילד מזוהה מופיע רק עם אישור הורה (<a href=\"08-consent-template.md\">נוסח אישור<\/a>). <strong>לא מבקשים מהורים לשלוח סרטונים של הילדים.<\/strong> מבקשים תשובות בכתב (״לאיזה מספר הגעתם?״). אם הורה שלח בכל זאת, מודים לו ולא מפרסמים בלי אישור חתום.<\/li>\n<li><strong>גם הפרטיות שלך חשובה.<\/strong> בפריים אין כתובת, מספר בית, שלט רחוב או נוף מחלון שמסגיר איפה את גרה. לא מתייגים מיקום בזמן אמת.<\/li>\n<li><strong>בתוך הדמות.<\/strong> קול, משפטים קבועים ותנועת היד לפי <a href=\"14-character-bible.md\">ספר הדמות<\/a>. תלבושת וצבעים לפי <a href=\"15-costume-and-logo.md\">מפרט התלבושת והלוגו<\/a>.<\/li>\n<\/ol>\n<hr />\n<h2>המבנה הקבוע של סרטון — השלד<\/h2>\n<p>כל אחד מ־12 הסרטונים בנוי לפי השלד הזה. אחרי כמה סרטונים הוא ייכנס לך לגוף.<\/p>\n<table>\n<thead>\n<tr>\n<th>חלק<\/th>\n<th>זמן (בערך)<\/th>\n<th>מה קורה<\/th>\n<th>דוגמה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>הוק<\/strong><\/td>\n<td>0–2 שנ׳<\/td>\n<td>קים בתנועה, עם אתגר או שאלה ישירה למצלמה, וטקסט על המסך מהפריים הראשון<\/td>\n<td>״10 כפיים על רגל אחת. נראה אתכם.״<\/td>\n<\/tr>\n<tr>\n<td><strong>הכלל<\/strong><\/td>\n<td>2–6 שנ׳<\/td>\n<td>״תפנו מקום!״ (בסרטון תנועה) והכלל במשפט אחד<\/td>\n<td>״תפנו מקום! כשאני צועקת ׳פסל!׳ — קופאים!״<\/td>\n<\/tr>\n<tr>\n<td><strong>משחק<\/strong><\/td>\n<td>6–25 שנ׳<\/td>\n<td>2–3 סבבים, וכל סבב מהיר / מצחיק / קשה יותר מהקודם<\/td>\n<td>סבב 1 לאט, סבב 2 מהר, סבב 3 מטורף<\/td>\n<\/tr>\n<tr>\n<td><strong>טוויסט<\/strong><\/td>\n<td>25–32 שנ׳<\/td>\n<td>הפתעה: קים נכשלת, כלל חדש, בדיחה<\/td>\n<td>״אופס! לא אמרתי קים אומרת! ...לא נורא!״<\/td>\n<\/tr>\n<tr>\n<td><strong>״עכשיו אתם!״<\/strong><\/td>\n<td>2–4 שנ׳<\/td>\n<td>הזמנה לעשות ופאוזה קצרה שבה קים מחכה<\/td>\n<td>״עכשיו אתם! אני מחכה...״<\/td>\n<\/tr>\n<tr>\n<td><strong>סיום<\/strong><\/td>\n<td>6–7 שנ׳ אחרונות<\/td>\n<td>קריאה ותגובה, תנועת היד (ה־V), פסל ולוגו<\/td>\n<td>ראי למטה<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>מסגור:<\/strong> בכל טבלת ביטים יש עמודת <strong>״מסגור״<\/strong> (רחב / מדיום). ביום הצילום מצלמים קודם את כל הקטעים הרחבים, ואז מקרבים את החצובה פעם אחת ומצלמים את כל קטעי המדיום ברצף (ראי ״יום צילום מרוכז״ ב<a href=\"09-filming-guide.md\">מדריך הצילום<\/a>).<\/p>\n<\/blockquote>\n<h3>הסיום הקבוע — שנייה אחר שנייה<\/h3>\n<p>לפי ״ה־V של קים״ ב<a href=\"14-character-bible.md\">ספר הדמות<\/a> (פרק 4.1). מסגור מדיום, עם מקום מעל הראש לידיים.<\/p>\n<ol>\n<li>קים, ישר למצלמה: <strong>״עם קים...״<\/strong>, עם <strong>יד ימין פתוחה מאחורי האוזן הימנית<\/strong> (שנייה אחת).<\/li>\n<li><strong>פאוזה של שנייה וחצי<\/strong>, היד עדיין מאחורי האוזן. זה הזמן שבו הילדים בבית עונים. על המסך מופיע: <strong>״כולם משחקים!״<\/strong><\/li>\n<li>קים מצטרפת בקול: <strong>״...כולם משחקים!״<\/strong>, ושתי הידיים נזרקות למעלה ל<strong>V עם אצבעות פרושות<\/strong>, בדיוק על המילה ״משחקים״ (שנייה אחת).<\/li>\n<li><strong>פסל של 2 שניות:<\/strong> קופאת עם הידיים למעלה ועם חיוך.<\/li>\n<li>כרטיס סיום: הלוגו ושם המשתמש (שנייה אחת).<\/li>\n<\/ol>\n<p><strong>סה״כ: 6–7 שניות.<\/strong> בכל טבלה, שורת ״סיום קבוע״ כוללת את כל 5 השלבים.<\/p>\n<blockquote>\n<p><strong>טיפ:<\/strong> בכל יום צילום תצלמי עוד 3–4 סיומים נפרדים, באנרגיות שונות (צועקת, לוחשת עם V קטן מול החזה, קופצת). זה ״בנק סיומים״ למקרה שהסיום בטייק הטוב לא יצא טוב.<\/p>\n<p><strong>״אופס!״ תמיד עם ״לא נורא!״<\/strong> (משפט 4 בספר הדמות): כל פעם שקים טועה בסרטון, היא אומרת ״אופס!״ ומיד ״לא נורא!״. זה המסר לילדים שמותר לטעות.<\/p>\n<\/blockquote>\n<h3>קריאה לפעולה לפי פלטפורמה<\/h3>\n<p><strong>כדי שאותו קובץ יעבוד בכל מקום, הטקסט על המסך זהה בכל הפלטפורמות<\/strong> (״עכשיו אתם!״), וקים <em>לא אומרת<\/em> בסרטון ״כתבו בתגובות״. את הקריאה לפעולה של כל פלטפורמה שמים <strong>רק בכיתוב או בתיאור<\/strong>. ככה מייצאים קובץ אחד בלבד.<\/p>\n<table>\n<thead>\n<tr>\n<th>פלטפורמה<\/th>\n<th>קריאה לפעולה (רק בכיתוב / בתיאור)<\/th>\n<th>למה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Instagram Reels<\/td>\n<td>בכיתוב: ״הורים, כתבו לנו בתגובות...״<\/td>\n<td>שם ההורים מגיבים ושולחים הודעות<\/td>\n<\/tr>\n<tr>\n<td>TikTok<\/td>\n<td>אותו דבר, בכיתוב<\/td>\n<td>כנ״ל<\/td>\n<\/tr>\n<tr>\n<td>YouTube Shorts<\/td>\n<td>בתיאור: ״עכשיו תעשו את זה עם אמא או אבא!״<\/td>\n<td>בתוכן שמסומן ״מיועד לילדים״ התגובות כבויות (ראי <a href=\"09-filming-guide.md\">מדריך הצילום<\/a>), לכן הקריאה היא לעשות בבית ולא להגיב<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>האשטגים — שיטה<\/h3>\n<ul>\n<li><strong>עד 5 האשטגים לפוסט.<\/strong> Instagram הגבילה פוסטים ו־Reels ל־5 האשטגים (מקור: <a href=\"https://www.socialmediatoday.com/news/instagrams-implementing-new-limits-on-hashtag-use/808309/\">Social Media Today<\/a>, <a href=\"https://www.socialsamosa.com/news-2/instagram-hashtags-five-per-post-10923075\">Social Samosa<\/a>). לבדוק אם ההגבלה עדיין בתוקף כשאת מפרסמת. גם ב־TikTok כדאי להסתפק ב־3–5.<\/li>\n<li><strong>תמיד:<\/strong> <code>#קיםמשחקים<\/code> (האשטג המותג; לוודא זמינות לפי <a href=\"15-costume-and-logo.md\">צ׳קליסט השמות<\/a>).<\/li>\n<li><strong>ועוד 1:<\/strong> האשטג הפורמט, כלומר <code>#אתגרקים<\/code> או <code>#קיםמשתגעת<\/code> (או בלי, בפורמט ״משחקים עם קים״).<\/li>\n<li><strong>ועוד 2–3:<\/strong> האשטגים שהורים וגננות ישראלים באמת מחפשים. ההצעות בכל סרטון הן נקודת התחלה. <strong>לבדוק:<\/strong> תחפשי כל האשטג באינסטגרם, ותראי שיש בו פוסטים עדכניים של הורים או גננות בעברית ולא רק פרסומות.<\/li>\n<\/ul>\n<hr />\n<h2>סרטון 0 — ההיכרות: ״אתם יודעים לשחק?״<\/h2>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מתי עולה<\/strong><\/td>\n<td>יום ההשקה: <strong>יום ה׳ של שבוע הגיבוש<\/strong> (שבוע 1 בתוכנית), 3 ימים לפני סרטון 1. מצמידים לפרופיל ב־Instagram וב־TikTok<\/td>\n<\/tr>\n<tr>\n<td><strong>מתי מצלמים<\/strong><\/td>\n<td>בתחילת שבוע הגיבוש, באותו מפגש עם הניסיונות של סרטונים 1–3<\/td>\n<\/tr>\n<tr>\n<td><strong>אורך יעד<\/strong><\/td>\n<td>30–40 שניות<\/td>\n<\/tr>\n<tr>\n<td><strong>אביזרים<\/strong><\/td>\n<td>אין. תלבושת מלאה<\/td>\n<\/tr>\n<tr>\n<td><strong>מקום<\/strong><\/td>\n<td>רקע נקי ובהיר (ראי ״מקום, רקע ואור״ ב<a href=\"09-filming-guide.md\">מדריך הצילום<\/a>), מקום פנוי לקפיצה וסיבוב<\/td>\n<\/tr>\n<tr>\n<td><strong>מה זה מתרגל<\/strong><\/td>\n<td><strong>מוטורי:<\/strong> קואורדינציה ורצף תנועות · <strong>קשב:<\/strong> זיכרון רצף והאצת קצב · <strong>חברתי-רגשי:<\/strong> ״מותר לטעות ולצחוק״<\/td>\n<\/tr>\n<tr>\n<td><strong>תפקיד עסקי<\/strong><\/td>\n<td>זה כרטיס הביקור שלך. הסרטון הזה יעלה ל<a href=\"../site/index.html\">עמוד הנחיתה<\/a> ויישלח בפניות לגננות ולקייטנות (<a href=\"10-outreach-templates.md\">תבניות פנייה<\/a>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>טבלת שוטים<\/h3>\n<table>\n<thead>\n<tr>\n<th>שוט<\/th>\n<th>זמן<\/th>\n<th>מסגור<\/th>\n<th>מה רואים / מה קים עושה<\/th>\n<th>מה קים אומרת<\/th>\n<th>טקסט על המסך<\/th>\n<th>עריכה וסאונד<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>0:00–0:02<\/td>\n<td>מדיום (מהמותניים)<\/td>\n<td>קים <strong>קופצת לתוך הפריים<\/strong> מהצד ונוחתת מול המצלמה<\/td>\n<td>״אני קים, ובאתי לבדוק דבר אחד...״<\/td>\n<td><strong>אתם יודעים לשחק?<\/strong> (מהפריים הראשון)<\/td>\n<td>לחתוך בדיוק על רגע הנחיתה, בלי שנייה ריקה לפני<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>0:02–0:04<\/td>\n<td>קלוז-אפ (זום של עד 130% בעריכה, מתוך צילום המדיום)<\/td>\n<td>עיניים מצומצמות, חשדנית, מתקרבת למצלמה<\/td>\n<td>״...אתם יודעים לשחק?״<\/td>\n<td>—<\/td>\n<td>אפקט סאונד קטן של ״חשד״ (לא חובה)<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>0:04–0:07<\/td>\n<td>מדיום<\/td>\n<td>מצביעה למצלמה, ואז מניפה יד ״קומו!״<\/td>\n<td>״אני צריכה לבדוק! קומו! תפנו מקום!״<\/td>\n<td><strong>קומו! תפנו מקום<\/strong><\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>0:07–0:12<\/td>\n<td>רחב (כל הגוף)<\/td>\n<td>סבב 1, לאט: כפיים, קפיצה, סיבוב <strong>אחד<\/strong><\/td>\n<td>״כפיים! קפיצה! סיבוב!״<\/td>\n<td>כל מילה קופצת בסנכרון: <strong>כפיים / קפיצה / סיבוב<\/strong><\/td>\n<td>הקצב בא מהכפיים של קים. <strong>בלי מוזיקה מספריית אפליקציה<\/strong> (ראי ״מוזיקה״ ב<a href=\"09-filming-guide.md\">מדריך הצילום<\/a>, פרק 9)<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>0:12–0:17<\/td>\n<td>רחב<\/td>\n<td>סבב 2, מהר יותר. עדיין סיבוב אחד בכל סבב<\/td>\n<td>״יותר מהר! כפיים־קפיצה־סיבוב!״<\/td>\n<td><strong>יותר מהר!<\/strong><\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>0:17–0:22<\/td>\n<td>רחב<\/td>\n<td>סבב 3, סופר מהיר. קים מתבלבלת, מסתובבת לכיוון הלא נכון ומתפוצצת מצחוק<\/td>\n<td>״סופר מהר!!! ...אופס! לא נורא!״<\/td>\n<td><strong>סופר מהר!!!<\/strong><\/td>\n<td>אפשר להאיץ ל־1.2 בעריכה<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>0:22–0:27<\/td>\n<td>מדיום<\/td>\n<td>מתנשפת, מחייכת, מסתכלת בהערכה<\/td>\n<td>״אוקיי... אתם יודעים לשחק. ממש יודעים.״<\/td>\n<td><strong>עברתם את הבדיקה!<\/strong><\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>0:27–0:31<\/td>\n<td>מדיום<\/td>\n<td>מצביעה למצלמה, נלהבת<\/td>\n<td>״אז מעכשיו — כל שבוע משחקים ביחד. סגור?״<\/td>\n<td><strong>כל שבוע — משחק חדש<\/strong><\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>0:31–0:37<\/td>\n<td>מדיום<\/td>\n<td>הסיום הקבוע: יד ימין מאחורי האוזן, פאוזה, V, פסל של 2 שניות<\/td>\n<td>״עם קים...״ (פאוזה) ״...כולם משחקים!״<\/td>\n<td><strong>עם קים...<\/strong> ואז <strong>כולם משחקים!<\/strong><\/td>\n<td>פאוזה של שנייה וחצי בשקט<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>0:37–0:38<\/td>\n<td>כרטיס<\/td>\n<td>לוגו ושם משתמש<\/td>\n<td>—<\/td>\n<td><strong>@שם_המשתמש<\/strong><\/td>\n<td>צליל סיום קצר וקבוע <strong>שיצרת בעצמך<\/strong> (למשל ״טוּט!״ בקול שלך או 2 כפיים). אותו צליל בכל הסרטונים<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>בטיחות:<\/strong> <strong>סיבוב אחד בכל סבב, לא מסתובבים ברצף.<\/strong> סיבובים מהירים ברצף עלולים לסחרר ילדים.<\/p>\n<h3>3 גרסאות הוק לצלם (ולבדוק מה עובד)<\/h3>\n<p>ב td>\n<td>רחב<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>2<\/td>\n<td>ה׳<\/td>\n<td>קים משתגעת<\/td>\n<td>חיות בבית של קים<\/td>\n<td>מוטוריקה גסה, דמיון<\/td>\n<td>אין<\/td>\n<td>רחב<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>3<\/td>\n<td>א׳<\/td>\n<td>משחקים עם קים<\/td>\n<td>משחק המראה<\/td>\n<td>קשב חזותי, חיקוי, משחק עם הורה<\/td>\n<td>אין<\/td>\n<td>מדיום<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>3<\/td>\n<td>ג׳<\/td>\n<td>אתגר קים<\/td>\n<td>10 שניות קופצות<\/td>\n<td>סיבולת, ספירה, שיא אישי<\/td>\n<td>טיימר בעריכה<\/td>\n<td>רחב<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>3<\/td>\n<td>ה׳<\/td>\n<td>קים משתגעת<\/td>\n<td>מאחורי הקלעים<\/td>\n<td>״מותר לטעות״, חוסן<\/td>\n<td>בלופרים מימי הצילום<\/td>\n<td>משתנה<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>4<\/td>\n<td>א׳<\/td>\n<td>משחקים עם קים<\/td>\n<td>הרמזור של קים<\/td>\n<td>עכבה, מעבר בין כללים<\/td>\n<td>3 דפים צבעוניים (לא חובה)<\/td>\n<td>רחב<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>4<\/td>\n<td>ג׳<\/td>\n<td>אתגר קים<\/td>\n<td>אתגר הגרב על הראש<\/td>\n<td>יציבה, ריכוז, תנועה מבוקרת<\/td>\n<td>גרב מגולגלת או בובה רכה<\/td>\n<td>רחב<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>4<\/td>\n<td>ה׳<\/td>\n<td>קים משתגעת<\/td>\n<td>השלט של קים<\/td>\n<td>ויסות קצב, משחק תפקידים עם הורה<\/td>\n<td>אין (אפקטים בעריכה)<\/td>\n<td>מדיום<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>חלוקה לימי צילום:<\/strong><\/p>\n<ul>\n<li><strong>יום צילום 1<\/strong> (ה׳ או ו׳ של שבוע הגיבוש) = סרטונים 1–6, ועוד 4 תנוחות החתימה כסטילס.<\/li>\n<li><strong>יום צילום 2<\/strong> (ה׳ או ו׳ של שבוע תוכן 2, לא ביום הפיילוט, ואחרי 2–3 ימי הצבעה על סרטון 5) = 5 סרטונים (7, 8, 10, 11, 12) + <strong>קטעי הדיבור של סרטון 9<\/strong> (12–18, 23–29 והסיום) + ״בנק״ (הוקים, סיומים ובלופרים).<\/li>\n<li><strong>יום צילום 3, קצר<\/strong> (סוף שבוע תוכן 4) = 3 סרטוני גשר מבנק הרעיונות, אחד מכל פורמט.<\/li>\n<li>סרטון 9 נערך מהבלופרים של שני הימים הראשונים ומקטעי הדיבור של יום 2. פירוט ב<a href=\"09-filming-guide.md\">מדריך הצילום<\/a>, פרק 7.<\/li>\n<\/ul>\n<hr />\n<h2>שבוע תוכן 1<\/h2>\n<h3>סרטון 1 · ״הפסל של קים״ — משחקים עם קים<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>אורך יעד<\/strong><\/td>\n<td>30–40 שניות<\/td>\n<\/tr>\n<tr>\n<td><strong>אביזרים<\/strong><\/td>\n<td>אין. <strong>את ״המוזיקה״ עושה קים בעצמה:<\/strong> כפיים בקצב או ביטבוקס (״בום־צ׳יק, בום־צ׳יק״), ואז ״פסל!״ פתאומי (ראי הערה)<\/td>\n<\/tr>\n<tr>\n<td><strong>מה זה מתרגל<\/strong><\/td>\n<td><strong>קשב:<\/strong> הקשבה לקצב ועצירה בדיוק בזמן (שליטה עצמית) · <strong>מוטורי:<\/strong> ריקוד חופשי ויציבות בקפיאה · <strong>חברתי-רגשי:<\/strong> הבעה גופנית, צחוק<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>הוק (0–2 שנ׳):<\/strong> הפריים נפתח כשקים כבר <strong>קפואה<\/strong> בתנוחה מטורפת (רגל באוויר, ידיים כמו כנפיים, לשון בחוץ). טקסט: <strong>״אסור לזוז!!״<\/strong>. אחרי שנייה היא ״נשברת״ ושואלת: ״רגע... אתם זזתם?!״<\/p>\n<table>\n<thead>\n<tr>\n<th>זמן<\/th>\n<th>מסגור<\/th>\n<th>מה רואים<\/th>\n<th>מה קים אומרת<\/th>\n<th>טקסט על המסך<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–2<\/td>\n<td>רחב<\/td>\n<td>קים קפואה, ואז נשברת<\/td>\n<td>״רגע... אתם זזתם?!״<\/td>\n<td><strong>אסור לזוז!!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2–6<\/td>\n<td>מדיום<\/td>\n<td>מסבירה מהר<\/td>\n<td>״תפנו מקום! זה משחק הפסל: כשיש קצב — רוקדים. כשאני צועקת ׳פסל!׳ — קופאים!״<\/td>\n<td><strong>תפנו מקום!<\/strong> ואז <strong>קצב = רוקדים · ״פסל!״ = קופאים<\/strong><\/td>\n<\/tr>\n<tr>\n<td>6–13<\/td>\n<td>רחב<\/td>\n<td>סבב 1: מוחאת כפיים בקצב ורוקדת, ופתאום ״פסל!״ וקופאת<\/td>\n<td>״בום־צ׳יק, בום־צ׳יק... פסל!״ (בקפיאה, דרך השיניים) ״פסל של... ציפור!״<\/td>\n<td><strong>פסל!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>13–20<\/td>\n<td>רחב<\/td>\n<td>סבב 2, ביטבוקס מהיר יותר. קפיאה כמו סופרמן, והאף מגרד לה<\/td>\n<td>״...פסל! פסל של סופרמן... עם גירוד באף... אסור... לגרד...״<\/td>\n<td><strong>אסור לגרד!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>20–28<\/td>\n<td>רחב<\/td>\n<td>סבב 3: ״פסל!״ ותנוחה הכי מצחיקה. היא מחזיקה, מחזיקה... ומתפוצצת מצחוק<\/td>\n<td>״נשברתי! אתם ניצחתם!״<\/td>\n<td><strong>נשברתי!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>28–31<\/td>\n<td>מדיום<\/td>\n<td>מצביעה למצלמה<\/td>\n<td>״עכשיו אתם! מישהו בבית שם מוזיקה ועוצר!״<\/td>\n<td><strong>עכשיו אתם!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>31–38<\/td>\n<td>מדיום<\/td>\n<td>סיום קבוע (יד מאחורי האוזן, פאוזה, V, פסל, כרטיס)<\/td>\n<td>״עם קים...״ ״...כולם משחקים!״<\/td>\n<td><strong>כולם משחקים!<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>הערת צילום:<\/strong> לא משמיעים מוזיקה מרמקול בזמן הצילום, ולא מוסיפים מוזיקה מספריית אפליקציה בעריכה החיצונית, כי הקובץ הזה עולה לכל הפלטפורמות, לעמוד הנחיתה ולוואטסאפ (ראי ״מוזיקה״ ב<a href=\"09-filming-guide.md\">מדריך הצילום<\/a>, פרק 9). <strong>הקצב הוא של קים:<\/strong> כפיים או ביטבוקס של 4–6 שניות, ואז ״פסל!״ פתאומי. כך אין בעיית זכויות, והעצירה מדויקת בלי עריכה. בבית, ההורים יכולים לשחק עם כל שיר שהם רוצים.<\/p>\n<p><strong>כיתוב לפוסט (להעתקה):<\/strong><\/p>\n<blockquote>\n<p>משחק הפסל של קים — הכי פשוט שיש, ועובד בכל מקום: בסלון, בגן, ביום הולדת.\nבבית אפשר עם מוזיקה: מישהו שם שיר ועוצר פתאום. ובלי מוזיקה: מוחאים כפיים בקצב וצועקים ״פסל!״.\nהילדים צריכים לעצור בדיוק בזמן. זה תרגול כיפי של שליטה עצמית, עם הרבה צחוק.\nטיפ: תנו לילד/ה להיות ה״די.ג׳יי״ שעוצר את המוזיקה.\nהורים, ספרו לנו בתגובות: מי אצלכם הצליח לא לצחוק בסבב השלישי?<\/p>\n<\/blockquote>\n<p><strong>האשטגים:<\/strong> <code>#קיםמשחקים<\/code> <code>#משחקיםבבית<\/code> <code>#משחקיתנועה<\/code> <code>#פעילותלילדים<\/code> <code>#משחקיםלגן<\/code><\/p>\n<p><strong>בטיחות:<\/strong> ״תפנו מקום!״ נאמר ומופיע כטקסט בשנייה 2–6. התנוחות על רגל אחת קצרות.\n<strong>סטורי מלווה:<\/strong> סקר: ״איזה פסל בפעם הבאה? ג׳ירפה / רובוט״.<\/p>\n<hr />\n<h3>סרטון 2 · ״הכף והרגל״ — אתגר קים<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>אורך יעד<\/strong><\/td>\n<td>30–40 שניות<\/td>\n<\/tr>\n<tr>\n<td><strong>אביזרים<\/strong><\/td>\n<td>אין<\/td>\n<\/tr>\n<tr>\n<td><strong>מה זה מתרגל<\/strong><\/td>\n<td><strong>מוטורי:<\/strong> שיווי משקל וקואורדינציה (רגל אחת וכפיים יחד) · <strong>קשב:<\/strong> ספירה תוך כדי תנועה · <strong>חברתי-רגשי:<\/strong> התמדה, לנסות שוב אחרי כישלון<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>הוק (0–2 שנ׳):<\/strong> קים כבר עומדת על רגל אחת ומתנדנדת, ומוחאת כף ראשונה. טקסט: <strong>״10 כפיים על רגל אחת. נראה אתכם.״<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>זמן<\/th>\n<th>מסגור<\/th>\n<th>מה רואים<\/th>\n<th>מה קים אומרת<\/th>\n<th>טקסט על המסך<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–2<\/td>\n<td>רחב<\/td>\n<td>קים על רגל אחת, מתנדנדת<\/td>\n<td>״רגל אחת! עשר כפיים! מי מעז?״<\/td>\n<td><strong>10 כפיים על רגל אחת<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2–4<\/td>\n<td>רחב<\/td>\n<td>מורידה רגל, מצביעה על הרצפה מסביב<\/td>\n<td>״תפנו מקום!״<\/td>\n<td><strong>תפנו מקום! משטח לא חלק<\/strong><\/td>\n<\/tr>\n<tr>\n<td>4–10<\/td>\n<td>רחב<\/td>\n<td>ניסיון 1: אחת, שתיים, שלוש, ארבע... ומורידה רגל בדרמטיות<\/td>\n<td>״...ארבע — אופס! לא נורא!״<\/td>\n<td>מונה: <strong>4/10<\/strong><\/td>\n<\/tr>\n<tr>\n<td>10–16<\/td>\n<td>רחב<\/td>\n<td>ניסיון 2: מגיעה ל־7, מתנדנדת בקומיות ומורידה רגל<\/td>\n<td>״שבע! כמעט!״<\/td>\n<td>מונה: <strong>7/10<\/strong><\/td>\n<\/tr>\n<tr>\n<td>16–25<\/td>\n<td>רחב<\/td>\n<td>ניסיון 3: הפנים מרוכזות לגמרי, סופרת לאט עד 10<\/td>\n<td>״...שמונה... תשע... עשר!!!״<\/td>\n<td>מונה עולה עד <strong>10/10<\/strong> וסימן הצלחה<\/td>\n<\/tr>\n<tr>\n<td>25–30<\/td>\n<td>מדיום<\/td>\n<td>חוגגת ומצביעה למצלמה<\/td>\n<td>״עכשיו אתם! רגל אחת... מוכנים?״<\/td>\n<td><strong>עכשיו אתם!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>30–33<\/td>\n<td>מדיום<\/td>\n<td>מדגימה כפיים מעל הראש<\/td>\n<td>״רמה 2: כפיים מעל הראש!״<\/td>\n<td><strong>רמה 2: כפיים מעל הראש<\/strong><\/td>\n<\/tr>\n<tr>\n<td>33–40<\/td>\n<td>מדיום<\/td>\n<td>סיום קבוע (יד מאחורי האוזן, פאוזה, V, פסל, כרטיס)<\/td>\n<td>״עם קים...״ ״...כולם משחקים!״<\/td>\n<td><strong>כולם משחקים!<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>כיתוב לפוסט (להעתקה):<\/strong><\/p>\n<blockquote>\n<p>אתגר קים: עומדים על רגל אחת ומוחאים 10 כפיים בלי להוריד רגל.\nנשמע קל? קים נכשלה פעמיים (בכוונה... בערך).\nהכי חשוב לנסות שוב. ככה מתרגלים שיווי משקל וגם התמדה.\nהורים, כתבו לנו בתגובות לאיזה מספר הילד/ה הגיעו. ואם הצליחו, נסו את רמה 2: כפיים מעל הראש.\nחשוב: על משטח לא חלק, יחפים או בנעלי ספורט (לא בגרביים על רצפה חלקה).<\/p>\n<\/blockquote>\n<p><strong>האשטגים:<\/strong> <code>#קיםמשחקים<\/code> <code>#אתגרקים<\/code> <code>#אתגרלילדים<\/code> <code>#שיווימשקל<\/code> <code>#פעילותלילדים<\/code><\/p>\n<p><strong>בטיחות:<\/strong> ״הנפילות״ של קים הן הורדת רגל קומית, לא נפילה לרצפה. מצלמים על משטח לא חלק.\n<strong>סטורי מלווה:<\/strong> חידון: ״לאיזה מספר קים הגיעה בניסיון השני? 4 / 7 / 10״.<\/p>\n<hr />\n<h3>סרטון 3 · ״הרגל שלי לא מקשיבה לי!״ — קים משתגעת<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>אורך יעד<\/strong><\/td>\n<td>30–40 שניות<\/td>\n<\/tr>\n<tr>\n<td><strong>אביזרים<\/strong><\/td>\n<td>אין<\/td>\n<\/tr>\n<tr>\n<td><strong>מה זה מתרגל<\/strong><\/td>\n<td><strong>מוטורי:<\/strong> מודעות לחלקי הגוף ובידוד תנועה (רק הרגל, רק היד) · <strong>קשב:<\/strong> תגובה לאות (״עצור!״) · <strong>חברתי-רגשי:<\/strong> ביטחון להשתטות, לעזור למישהו אחר<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>הוק (0–2 שנ׳):<\/strong> קים הולכת רגיל, ופתאום הרגל שלה <strong>בועטת הצידה מעצמה<\/strong>. היא מסתכלת עליה בהלם: ״היי! מה את עושה?!״ טקסט: <strong>״הרגל של קים השתגעה״<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th>זמן<\/th>\n<th>מסגור<\/th>\n<th>מה רואים<\/th>\n<th>מה קים אומרת<\/th>\n<th>טקסט על המסך<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–2<\/td>\n<td>רחב<\/td>\n<td>הרגל בועטת לבד<\/td>\n<td>״היי! מה את עושה?!״<\/td>\n<td><strong>הרגל של קים השתגעה<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2–8<\/td>\n<td>רחב<\/td>\n<td>הרגל ״מושכת״ את קים הצידה, וקים נגררת בקפיצות קטנות<\/td>\n<td>״לאן את הולכת? תחזרי! ...תפנו לי מקום!״<\/td>\n<td><strong>תפנו מקום!<\/strong> (בקטן, למעלה)<\/td>\n<\/tr>\n<tr>\n<td>8–14<\/td>\n<td>רחב<\/td>\n<td>קים תופסת את הרגל, ועכשיו <strong>היד<\/strong> מתחילה לנופף לבד<\/td>\n<td>״רגע... גם את?!״<\/td>\n<td><strong>גם היד?!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>14–20<\/td>\n<td>רחב<\/td>\n<td>הראש מהנהן לבד, והכתפיים רוקדות. כל הגוף ״משתולל״<\/td>\n<td>״אני לא שולטת בזה!!״<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>20–25<\/td>\n<td>מדיום<\/td>\n<td>מתחננת למצלמה<\/td>\n<td>״תעזרו לי! תצעקו לה: עצור!״<\/td>\n<td><strong>תצעקו: עצור!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>25–27<\/td>\n<td>מדיום<\/td>\n<td>יד מאחורי האוזן, מחכה שנייה וחצי. הגוף קופא<\/td>\n<td>—<\/td>\n<td><strong>עצור!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>27–31<\/td>\n<td>מדיום<\/td>\n<td>נושמת לרווחה... ואז האצבע הקטנה מתחילה לזוז<\/td>\n<td>״הצלתם אותי! תודה! ...אוי לא, שוב?״<\/td>\n<td><strong>שוב?!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>31–38<\/td>\n<td>מדיום<\/td>\n<td>סיום קבוע (יד מאחורי האוזן, פאוזה, V, פסל, כרטיס)<\/td>\n<td>״עם קים...״ ״...כולם משחקים!״<\/td>\n<td><strong>כולם משחקים!<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>כיתוב לפוסט (להעתקה):<\/strong><\/p>\n<blockquote>\n<p>גם לכם יש ימים שהגוף עושה מה שהוא רוצה? לקים כן.\nתעלו את הווליום ותנו לילדים לצעוק ״עצור!״. הם מצילים את קים.\nמשחק המשך לבית: אחד ״משתגע״ והשני אומר ״עצור!״, ואז מתחלפים.\nהורים, מי צעק הכי חזק אצלכם?<\/p>\n<\/blockquote>\n<p><strong>האשטגים:<\/strong> <code>#קיםמשחקים<\/code> <code>#קיםמשתגעת<\/code> <code>#משחקיםבבית<\/code> <code>#צחוקעםילדים<\/code> <code>#משחקיתנועה<\/code><\/p>\n<p><strong>בטיחות:<\/strong> ה״גרירה״ היא קפיצות קטנות במקום פנוי, בלי היתקלות ברהיטים.\n<strong>סטורי מלווה:<\/strong> שאלה פתוחה להורים: ״איזה חלק בגוף של קים צריך להשתגע בפעם הבאה?״<\/p>\n<hr />\n<h2>שבוע תוכן 2<\/h2>\n<h3>סרטון 4 · ״קים אומרת״ — משחקים עם קים<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>אורך יעד<\/strong><\/td>\n<td>30–40 שניות<\/td>\n<\/tr>\n<tr>\n<td><strong>אביזרים<\/strong><\/td>\n<td>אין<\/td>\n<\/tr>\n<tr>\n<td><strong>מה זה מתרגל<\/strong><\/td>\n<td><strong>קשב:<\/strong> להקשיב עד סוף המשפט לפני שזזים (עכבה) · <strong>מוטורי:<\/strong> תנועות מהירות ומגוונות · <strong>חברתי-רגשי:<\/strong> לצחוק כשנתפסים<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>הוק (0–2 שנ׳):<\/strong> קים מצביעה על המצלמה כבר מהפריים הראשון, ונוגעת באף: ״קים אומרת: תגעו באף!״ טקסט: <strong>״קים אומרת...״<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th>זמן<\/th>\n<th>מסגור<\/th>\n<th>מה רואים<\/th>\n<th>מה קים אומרת<\/th>\n<th>טקסט על המסך<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–2<\/td>\n<td>מדיום<\/td>\n<td>נוגעת באף<\/td>\n<td>״קים אומרת: תגעו באף!״<\/td>\n<td><strong>קים אומרת...<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2–6<\/td>\n<td>מדיום<\/td>\n<td>מסבירה מהר<\/td>\n<td>״תפנו מקום! עושים רק כשאני אומרת ׳קים אומרת׳! מוכנים?״<\/td>\n<td><strong>תפנו מקום!<\/strong> ואז <strong>רק כש״קים אומרת״!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>6–16<\/td>\n<td>רחב<\/td>\n<td>4 פקודות בקצב עולה: קפיצה, ידיים למעלה, סיבוב ראש לאט, יד על הבטן<\/td>\n<td>״קים אומרת: לקפוץ! קים אומרת: ידיים למעלה!...״<\/td>\n<td>כל פקודה כטקסט<\/td>\n<\/tr>\n<tr>\n<td>16–20<\/td>\n<td>רחב<\/td>\n<td><strong>מלכודת 1:<\/strong> ״ידיים על הראש!״, וקים עצמה עושה. ואז קולטת<\/td>\n<td>״...אופס! לא אמרתי קים אומרת! נתפסתי! ...לא נורא!״<\/td>\n<td><strong>נתפסתי!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>20–25<\/td>\n<td>רחב<\/td>\n<td>2 פקודות מהירות, ואז <strong>מלכודת 2:<\/strong> ״שבו!״<\/td>\n<td>״...שבו! — חחח! נתפסתם? גם אני!״<\/td>\n<td><strong>נתפסתם?<\/strong><\/td>\n<\/tr>\n<tr>\n<td>25–29<\/td>\n<td>מדיום<\/td>\n<td>חגיגי<\/td>\n<td>״עכשיו אתם! קים אומרת... לצעוק הכי חזק:״<\/td>\n<td><strong>עכשיו אתם!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>29–36<\/td>\n<td>מדיום<\/td>\n<td>סיום קבוע, משתלב במשחק (יד מאחורי האוזן, פאוזה, V, פסל, כרטיס)<\/td>\n<td>״עם קים...״ ״...כולם משחקים!״<\/td>\n<td><strong>כולם משחקים!<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>כיתוב לפוסט (להעתקה):<\/strong><\/p>\n<blockquote>\n<p>״קים אומרת״ — הגרסה של קים ל״הרצל אמר״.\nהמלכודת: עושים רק כשהמשפט מתחיל ב״קים אומרת״. הילדים מתרגלים להקשיב עד הסוף לפני שהם זזים, וגם לצחוק כשהם נתפסים.\nאחרי הסרטון, תנו לילד/ה להיות ״קים״ ולתת לכם פקודות.\nהורים, תודו בתגובות: מי נתפס במלכודת של ה״שבו!״?<\/p>\n<\/blockquote>\n<p><strong>האשטגים:<\/strong> <code>#קיםמשחקים<\/code> <code>#קיםאומרת<\/code> <code>#משחקיםלילדים<\/code> <code>#משחקיםלגן<\/code> <code>#הוריםוילדים<\/code><\/p>\n<p><strong>סטורי מלווה:<\/strong> ״קים אומרת״ בסטורי: 3 פריימים, כל פריים פקודה אחת, ובשלישי מלכודת.<\/p>\n<hr />\n<h3>סרטון 5 · ״הקובייה מחליטה״ — אתגר קים<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>אורך יעד<\/strong><\/td>\n<td>35–45 שניות<\/td>\n<\/tr>\n<tr>\n<td><strong>אביזרים<\/strong><\/td>\n<td><strong>רק קובייה רכה גדולה (ספוג או בד)<\/strong>, למשל ״קוביית קים״ מ<a href=\"02-show-script.md\">ציוד המופע<\/a>. לא קובייה קשה<\/td>\n<\/tr>\n<tr>\n<td><strong>מה זה מתרגל<\/strong><\/td>\n<td><strong>מוטורי:<\/strong> מעבר בין תנועות שונות · <strong>קשב:<\/strong> זיהוי מספרים וספירה עד 5 · <strong>חברתי-רגשי:<\/strong> תורות, כשמשחקים בקבוצה<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>הוק (0–2 שנ׳):<\/strong> קים <strong>זורקת את הקובייה הרכה למעלה ותופסת<\/strong>, או <strong>מגלגלת אותה על הרצפה מול המצלמה<\/strong>. לא זורקים לכיוון המצלמה (זה יכול להפיל את החצובה, וילדים יחקו ויזרקו על מסך). טקסט: <strong>״הקובייה מחליטה מה תעשו״<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th>זמן<\/th>\n<th>מסגור<\/th>\n<th>מה רואים<\/th>\n<th>מה קים אומרת<\/th>\n<th>טקסט על המסך<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–2<\/td>\n<td>רחב<\/td>\n<td>זורקת למעלה ותופסת / מגלגלת על הרצפה<\/td>\n<td>״הקובייה מחליטה!״<\/td>\n<td><strong>הקובייה מחליטה מה תעשו<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2–7<\/td>\n<td>מדיום<\/td>\n<td>על המסך מופיע ״מקרא״<\/td>\n<td>״תפנו מקום! כל מספר — תנועה. 5 פעמים!״<\/td>\n<td><strong>תפנו מקום!<\/strong> ואז <strong>1 קפיצה · 2 סיבוב · 3 כפיים למעלה · 4 ריצה במקום · 5 צפרדע · 6 צוחקים<\/strong><\/td>\n<\/tr>\n<tr>\n<td>7–16<\/td>\n<td>רחב<\/td>\n<td>הטלה 1 (מגלגלת על הרצפה): יוצא 4, ריצה במקום וספירה<\/td>\n<td>״תררררר... ארבע! ריצה במקום! אחת, שתיים...״<\/td>\n<td><strong>4 = ריצה במקום<\/strong> ומונה עד 5<\/td>\n<\/tr>\n<tr>\n<td>16–25<\/td>\n<td>רחב<\/td>\n<td>הטלה 2: יוצא 5. קפיצת צפרדע (כריעה וקפיצה קטנה)<\/td>\n<td>״חמש! צפרדעים! קוואק!״<\/td>\n<td><strong>5 = צפרדע<\/strong><\/td>\n<\/tr>\n<tr>\n<td>25–33<\/td>\n<td>רחב<\/td>\n<td>הטלה 3: יוצא 6. ״לצחוק!״ קים מזייפת צחוק, והצחוק הופך לאמיתי<\/td>\n<td>״שש... לצחוק? זה הכי קשה בעולם... חה... חה... חחחחח!״<\/td>\n<td><strong>6 = צוחקים<\/strong><\/td>\n<\/tr>\n<tr>\n<td>33–37<\/td>\n<td>מדיום<\/td>\n<td>מצביעה למצלמה<\/td>\n<td>״עכשיו אתם! ובפעם הבאה — תזרקו קובייה בבית ותגלו מה יוצא לכם!״<\/td>\n<td><strong>עכשיו אתם!<\/strong> (זהה בכל הפלטפורמות)<\/td>\n<\/tr>\n<tr>\n<td>37–44<\/td>\n<td>מדיום<\/td>\n<td>סיום קבוע (יד מאחורי האוזן, פאוזה, V, פסל, כרטיס)<\/td>\n<td>״עם קים...״ ״...כולם משחקים!״<\/td>\n<td><strong>כולם משחקים!<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>הערת עריכה:<\/strong> את המקרא (1–6) כדאי להשאיר על המסך בקטן לאורך כל הסרטון, באמצע־למעלה, <strong>מתחת<\/strong> לרצועה העליונה שהממשק מכסה (פרק 5 ב<a href=\"09-filming-guide.md\">מדריך הצילום<\/a>).<\/p>\n<p><strong>כיתוב לפוסט (להעתקה):<\/strong><\/p>\n<blockquote>\n<p>אתגר הקובייה: מטילים ומבצעים 5 פעמים.\n1 קפיצה · 2 סיבוב · 3 כפיים למעלה · 4 ריצה במקום · 5 צפרדע · 6 צוחקים.\nאין לכם קובייה? ציירו אחת על דף. ורק קובייה רכה: מגלגלים על הרצפה, לא זורקים לכיוון מסך או טלוויזיה.\nהורים, כתבו לנו בתגובות מספר מ־1 עד 6: המספר שיקבל הכי הרבה תגובות ייכנס לאתגר של שבוע הבא.\nבגן: כל ילד/ה מטילים פעם אחת, וכל הקבוצה מבצעת.<\/p>\n<\/blockquote>\n<p>(ביוטיוב, בתיאור: ״עכשיו תזרקו קובייה בבית עם אמא או אבא!״, בלי בקשה לתגובות.)<\/p>\n<p><strong>האשטגים:<\/strong> <code>#קיםמשחקים<\/code> <code>#אתגרקים<\/code> <code>#משחקיםלגן<\/code> <code>#משחקיםבבית<\/code> <code>#אתגרלילדים<\/code><\/p>\n<p><strong>בטיחות:<\/strong> קפיצת צפרדע נמוכה, נוחתים על ברכיים רכות. <strong>רק קובייה רכה. לא זורקים לכיוון מסך, טלוויזיה או אנשים.<\/strong> סיבוב אחד בכל פעם.\n<strong>חשוב:<\/strong> תרשמי איזה מספר ניצח בתגובות של ההורים (אחרי 2–3 ימים). הוא נכנס כבונוס בסרטון 8, שמצולם ביום צילום 2.<\/p>\n<hr />\n<h3>סרטון 6 · ״חיות בבית של קים״ — קים משתגעת<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>אורך יעד<\/strong><\/td>\n<td>30–40 שניות<\/td>\n<\/tr>\n<tr>\n<td><strong>אביזרים<\/strong><\/td>\n<td>אין<\/td>\n<\/tr>\n<tr>\n<td><strong>מה זה מתרגל<\/strong><\/td>\n<td><strong>מוטורי:<\/strong> מוטוריקה גסה (קפיצות, הליכות של חיות שונות) · <strong>קשב:<\/strong> חיקוי וניחוש · <strong>חברתי-רגשי:<\/strong> דמיון ומשחק תפקידים<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>הוק (0–2 שנ׳):<\/strong> קים <strong>צצה מתחתית הפריים<\/strong> בכריעה של צפרדע: ״קוואק!״ טקסט: <strong>״קים התעוררה... צפרדע?!״<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>זמן<\/th>\n<th>מסגור<\/th>\n<th>מה רואים<\/th>\n<th>מה קים אומרת<\/th>\n<th>טקסט על המסך<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–2<\/td>\n<td>רחב<\/td>\n<td>צפרדע צצה<\/td>\n<td>״קוואק!״<\/td>\n<td><strong>קים התעוררה... צפרדע?!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2–8<\/td>\n<td>רחב<\/td>\n<td>3 קפיצות צפרדע קטנות<\/td>\n<td>״רגע, אני צפרדע! תפנו מקום ותקפצו איתי! קוואק, קוואק!״<\/td>\n<td><strong>תפנו מקום!<\/strong> ואז <strong>צפרדע<\/strong><\/td>\n<\/tr>\n<tr>\n<td>8–14<\/td>\n<td>רחב<\/td>\n<td>הופכת לפינגווין: ידיים צמודות, הליכה מתנדנדת<\/td>\n<td>״אוי... עכשיו אני פינגווין!״<\/td>\n<td><strong>פינגווין<\/strong><\/td>\n<\/tr>\n<tr>\n<td>14–20<\/td>\n<td>רחב<\/td>\n<td>קוף: מגרדת בראש וקופצת<\/td>\n<td>״או־או־אה־אה! קוף!״<\/td>\n<td><strong>קוף<\/strong><\/td>\n<\/tr>\n<tr>\n<td>20–25<\/td>\n<td>רחב<\/td>\n<td>נחש: הידיים מתפתלות והגוף מתנועע<\/td>\n<td>״סססס... נחש!״<\/td>\n<td><strong>נחש<\/strong><\/td>\n<\/tr>\n<tr>\n<td>25–30<\/td>\n<td>רחב<\/td>\n<td><strong>ניחוש:<\/strong> חוטם עם היד והליכה כבדה<\/td>\n<td>״עכשיו אתם! ...מה אני?״ (מחכה)<\/td>\n<td><strong>מה אני?<\/strong> (פאוזה) ואז <strong>פיל!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>30–37<\/td>\n<td>מדיום<\/td>\n<td>סיום קבוע (יד מאחורי האוזן, פאוזה, V, פסל, כרטיס)<\/td>\n<td>״עם קים...״ ״...כולם משחקים!״<\/td>\n<td><strong>כולם משחקים!<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>כיתוב לפוסט (להעתקה):<\/strong><\/p>\n<blockquote>\n<p>בוקר אחד קים התעוררה... והייתה צפרדע. ואז פינגווין. ואז קוף.\nמשחק חיות הוא דרך מעולה להוציא אנרגיה בלי שום ציוד, וגם הקטנים ביותר יכולים להצטרף.\nהצלחתם לנחש את החיה האחרונה?\nהורים, כתבו בתגובות איזו חיה קים צריכה להיות בפעם הבאה.<\/p>\n<\/blockquote>\n<p><strong>האשטגים:<\/strong> <code>#קיםמשחקים<\/code> <code>#קיםמשתגעת<\/code> <code>#משחקחיות<\/code> <code>#משחקיתנועה<\/code> <code>#פעילותלילדים<\/code><\/p>\n<p><strong>סטורי מלווה:<\/strong> סקר: ״החיה הבאה: תמנון / קנגורו״, ואת החיה המנצחת מצלמים ביום הצילום הבא.<\/p>\n<hr />\n<h2>שבוע תוכן 3<\/h2>\n<h3>סרטון 7 · ״משחק המראה״ — משחקים עם קים<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>אורך יעד<\/strong><\/td>\n<td>30–40 שניות<\/td>\n<\/tr>\n<tr>\n<td><strong>אביזרים<\/strong><\/td>\n<td>אין<\/td>\n<\/tr>\n<tr>\n<td><strong>מה זה מתרגל<\/strong><\/td>\n<td><strong>קשב:<\/strong> קשב חזותי ומעקב · <strong>מוטורי:<\/strong> חיקוי ותכנון תנועה · <strong>חברתי-רגשי:<\/strong> משחק משותף עם הורה, התחלפות בהובלה<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>הוק (0–2 שנ׳):<\/strong> קים קרובה למצלמה, ושתי כפות הידיים שלה ״על הזכוכית״: ״אתם המראה שלי. אל תזוזו...״ טקסט: <strong>״אתם המראה של קים״<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th>זמן<\/th>\n<th>מסגור<\/th>\n<th>מה רואים<\/th>\n<th>מה קים אומרת<\/th>\n<th>טקסט על המסך<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–2<\/td>\n<td>מדיום (קים קרובה לטלפון)<\/td>\n<td>ידיים ״על המראה״<\/td>\n<td>״אתם המראה שלי. אל תזוזו...״<\/td>\n<td><strong>אתם המראה של קים<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2–6<\/td>\n<td>מדיום<\/td>\n<td>צעד אחורה, למקום הקבוע של המדיום<\/td>\n<td>״כל מה שאני עושה — אתם עושים בדיוק אותו דבר. לאט!״<\/td>\n<td><strong>עושים בדיוק כמו קים<\/strong><\/td>\n<\/tr>\n<tr>\n<td>6–16<\/td>\n<td>מדיום<\/td>\n<td>תנועות איטיות: יד עולה, ראש נוטה, כתפיים עולות<\/td>\n<td>(בלחש) ״לאט... לאט...״<\/td>\n<td><strong>לאט...<\/strong><\/td>\n<\/tr>\n<tr>\n<td>16–24<\/td>\n<td>מדיום<\/td>\n<td>פרצופים: לחיים נפוחות, לשון בחוץ, עין עצומה, ואז מהר יותר<\/td>\n<td>״ועכשיו פרצופים!״<\/td>\n<td><strong>פרצופים!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>24–28<\/td>\n<td>מדיום<\/td>\n<td>טוויסט: קים עושה תנועה מטורפת מהר ומתבלבלת בעצמה<\/td>\n<td>״רגע, מי פה המראה?! ...אופס! לא נורא!״<\/td>\n<td><strong>מי המראה?!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>28–32<\/td>\n<td>מדיום<\/td>\n<td>מצביעה<\/td>\n<td>״עכשיו תעשו את זה עם אמא או אבא — אחד מוביל, אחד מראה!״<\/td>\n<td><strong>עכשיו בזוגות!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>32–39<\/td>\n<td>מדיום<\/td>\n<td>סיום קבוע (יד מאחורי האוזן, פאוזה, V, פסל, כרטיס)<\/td>\n<td>״עם קים...״ ״...כולם משחקים!״<\/td>\n<td><strong>כולם משחקים!<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>צילום:<\/strong> כל הסרטון במדיום, מאותה נקודה. את ההוק עושים בצעד קדימה לכיוון הטלפון, בלי להזיז את החצובה.<\/p>\n<\/blockquote>\n<p><strong>כיתוב לפוסט (להעתקה):<\/strong><\/p>\n<blockquote>\n<p>משחק המראה: הכי פשוט ומחבר שיש.\nשלב 1: הילדים מחקים את קים. שלב 2: עושים את זה בזוגות, הורה וילד/ה, ומתחלפים מי מוביל.\nטיפ: תתחילו מאוד לאט. ככל שלאט יותר, מצחיק יותר.\nהורים, ספרו לנו: מי הוביל אצלכם, ומי צחק ראשון?<\/p>\n<\/blockquote>\n<p><strong>האשטגים:<\/strong> <code>#קיםמשחקים<\/code> <code>#משחקהמראה<\/code> <code>#הוריםוילדים<\/code> <code>#זמןאיכות<\/code> <code>#משחקיםבבית<\/code><\/p>\n<p><strong>סטורי מלווה:<\/strong> ״אתגר מראה לגננות״: שאלה פתוחה, ״איך הייתן משחקות את זה עם קבוצה?״. זו גם הזדמנות טבעית להכיר גננות.<\/p>\n<hr />\n<h3>סרטון 8 · ״10 שניות קופצות״ — אתגר קים<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>אורך יעד<\/strong><\/td>\n<td>25–35 שניות<\/td>\n<\/tr>\n<tr>\n<td><strong>אביזרים<\/strong><\/td>\n<td>אין. טיימר ומונה מוסיפים בעריכה<\/td>\n<\/tr>\n<tr>\n<td><strong>מה זה מתרגל<\/strong><\/td>\n<td><strong>מוטורי:<\/strong> סיבולת, כוח רגליים וקצב · <strong>קשב:<\/strong> ספירה · <strong>חברתי-רגשי:<\/strong> להתחרות בעצמך, לא באחרים (שיא אישי)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>הוק (0–2 שנ׳):<\/strong> טיימר ענק <strong>10<\/strong> על המסך, וקים בעמידת מוכנות, כפופה קדימה. טקסט: <strong>״10 שניות. כמה קפיצות?״<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>זמן<\/th>\n<th>מסגור<\/th>\n<th>מה רואים<\/th>\n<th>מה קים אומרת<\/th>\n<th>טקסט על המסך<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–2<\/td>\n<td>רחב<\/td>\n<td>עמידת מוכנות<\/td>\n<td>״10 שניות. כמה קפיצות? מוכנים?״<\/td>\n<td><strong>10 שניות. כמה קפיצות?<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2–4<\/td>\n<td>רחב<\/td>\n<td>מצביעה על הרצפה מסביב<\/td>\n<td>״תפנו מקום! שלוש, שתיים, אחת — עכשיו!״<\/td>\n<td><strong>3... 2... 1...<\/strong> ובקטן: <strong>מקום פנוי, משטח לא חלק<\/strong><\/td>\n<\/tr>\n<tr>\n<td>4–14<\/td>\n<td>רחב<\/td>\n<td>קופצת וסופרת בקול<\/td>\n<td>״אחת! שתיים! שלוש!...״<\/td>\n<td>טיימר יורד מ־10 ל־0, ומונה קפיצות עולה<\/td>\n<\/tr>\n<tr>\n<td>14–18<\/td>\n<td>מדיום<\/td>\n<td>מתנשפת, מחייכת<\/td>\n<td>״[המספר]! זה השיא שלי. עכשיו תורכם לקבוע שיא בית!״<\/td>\n<td><strong>השיא של קים: [המספר]<\/strong><\/td>\n<\/tr>\n<tr>\n<td>18–22<\/td>\n<td>רחב<\/td>\n<td>בונוס (אם היה מספר מנצח בסרטון 5)<\/td>\n<td>״ובחרתם מספר [X] בקובייה — אז בונוס: [התנועה] 5 פעמים!״<\/td>\n<td><strong>בחרתם: [X]<\/strong><\/td>\n<\/tr>\n<tr>\n<td>22–25<\/td>\n<td>מדיום<\/td>\n<td>מצביעה למצלמה<\/td>\n<td>״עכשיו אתם! ומחר — נסו לשבור את השיא שלכם!״<\/td>\n<td><strong>עכשיו אתם!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>25–32<\/td>\n<td>מדיום<\/td>\n<td>סיום קבוע (יד מאחורי האוזן, פאוזה, V, פסל, כרטיס)<\/td>\n<td>״עם קים...״ ״...כולם משחקים!״<\/td>\n<td><strong>כולם משחקים!<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>כיתוב לפוסט (להעתקה):<\/strong><\/p>\n<blockquote>\n<p>אתגר 10 השניות: כמה קפיצות אפשר לעשות ב־10 שניות?\nקים הגיעה ל־[המספר]. נסו פעם אחת, תרשמו את המספר ונסו שוב מחר.\nהכיף הוא לשבור את השיא של עצמכם, לא של אחרים.\nהורים, כתבו לנו את השיא בתגובות.\nקופצים על משטח לא חלק, רחוק מרהיטים.<\/p>\n<\/blockquote>\n<p><strong>האשטגים:<\/strong> <code>#קיםמשחקים<\/code> <code>#אתגרקים<\/code> <code>#אתגרלילדים<\/code> <code>#ילדיםבתנועה<\/code> <code>#פעילותלילדים<\/code><\/p>\n<p><strong>בטיחות:<\/strong> טקסט קטן על המסך בשנייה 2–4: <strong>״מקום פנוי, משטח לא חלק״<\/strong>.\n<strong>סטורי מלווה:<\/strong> סליידר: ״כמה אנרגיה יש לילדים היום?״, ולמחרת ״מי שבר שיא?״.<\/p>\n<hr />\n<h3>סרטון 9 · ״מאחורי הקלעים״ — קים משתגעת<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>אורך יעד<\/strong><\/td>\n<td>30–36 שניות<\/td>\n<\/tr>\n<tr>\n<td><strong>חומר גלם<\/strong><\/td>\n<td>בלופרים משני ימי הצילום. <strong>תשמרי כל טייק כושל מצחיק<\/strong> (ראי ״ניהול קבצים״ ב<a href=\"09-filming-guide.md\">מדריך הצילום<\/a>). <strong>קטעי הדיבור<\/strong> (12–18, 23–29 והסיום) מצולמים ביום צילום 2, במדיום<\/td>\n<\/tr>\n<tr>\n<td><strong>מה זה מתרגל<\/strong><\/td>\n<td><strong>חברתי-רגשי:<\/strong> מותר לטעות, לצחוק על עצמך ולנסות שוב (חוסן, ״ביטחון להשתטות״ מתוך <a href=\"01-concept.md\">הקונספט<\/a>) · <strong>מוטורי / קשב:<\/strong> — (סרטון צפייה; התרגול נעשה בבית, ב״עכשיו אתם״)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>הוק (0–2 שנ׳):<\/strong> הבלופר הכי מצחיק פותח, למשל קים מתפוצצת מצחוק באמצע ״הפסל״. טקסט: <strong>״ככה זה נראה באמת״<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th>זמן<\/th>\n<th>מסגור<\/th>\n<th>מה רואים<\/th>\n<th>מה קים אומרת<\/th>\n<th>טקסט על המסך<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–2<\/td>\n<td>כמו בטייק המקורי<\/td>\n<td>בלופר 1<\/td>\n<td>(צחוק)<\/td>\n<td><strong>ככה זה נראה באמת<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2–12<\/td>\n<td>כמו בטייקים המקוריים<\/td>\n<td>3–4 בלופרים, 2–3 שניות כל אחד<\/td>\n<td>(מה שנאמר בטייק)<\/td>\n<td>מספר טייק: <strong>טייק 7... טייק 12...<\/strong><\/td>\n<\/tr>\n<tr>\n<td>12–18<\/td>\n<td>מדיום<\/td>\n<td>ישר למצלמה<\/td>\n<td>״אתם חשבתם שאני תמיד מצליחה? ממש לא! ככה נראה אימון.״<\/td>\n<td><strong>ככה נראה אימון<\/strong><\/td>\n<\/tr>\n<tr>\n<td>18–23<\/td>\n<td>כמו בטייק המקורי<\/td>\n<td>הטייק המוצלח, קצר<\/td>\n<td>״וכשמשהו לא יוצא לי? אני צוחקת... ומנסה שוב!״<\/td>\n<td><strong>צוחקים ומנסים שוב<\/strong><\/td>\n<\/tr>\n<tr>\n<td>23–26<\/td>\n<td>מדיום<\/td>\n<td>ישר למצלמה<\/td>\n<td>״אופס? לא נורא! מותר לטעות. מותר להשתטות!״<\/td>\n<td><strong>מותר לטעות. מותר להשתטות.<\/strong><\/td>\n<\/tr>\n<tr>\n<td>26–29<\/td>\n<td>מדיום<\/td>\n<td>מצביעה למצלמה<\/td>\n<td>״עכשיו אתם: תבחרו משהו שקשה לכם, תנסו 3 פעמים ותצחקו על הטעויות!״<\/td>\n<td><strong>עכשיו אתם! 3 ניסיונות<\/strong><\/td>\n<\/tr>\n<tr>\n<td>29–36<\/td>\n<td>מדיום<\/td>\n<td>סיום קבוע (יד מאחורי האוזן, פאוזה, V, פסל, כרטיס)<\/td>\n<td>״עם קים...״ ״...כולם משחקים!״<\/td>\n<td><strong>כולם משחקים!<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>כיתוב לפוסט (להעתקה):<\/strong><\/p>\n<blockquote>\n<p>בלופרים! ככה נראה יום צילומים של קים.\nאני רוצה שהילדים יראו גם את הנפילות, כי ככה לומדים כל דבר: מנסים, צוחקים, מנסים שוב.\nהורים, ספרו לנו: על מה הילד/ה שלכם התאמנו הכי הרבה פעמים עד שהצליחו?<\/p>\n<\/blockquote>\n<p><strong>האשטגים:<\/strong> <code>#קיםמשחקים<\/code> <code>#קיםמשתגעת<\/code> <code>#מאחוריהקלעים<\/code> <code>#מותרלטעות<\/code> <code>#הוריםוילדים<\/code><\/p>\n<p><strong>אם הפיילוט כבר היה:<\/strong> אפשר להוסיף משפט אחד: ״ובשבוע שעבר הייתה לי ההופעה הראשונה מול ילדים אמיתיים, וגם שם לא הכל הצליח. היה הכי כיף!״. <strong>בלי<\/strong> ילדים מזוהים, בלי שם המקום ובלי תאריך.<\/p>\n<hr />\n<h2>שבוע תוכן 4<\/h2>\n<h3>סרטון 10 · ״הרמזור של קים״ — משחקים עם קים<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>אורך יעד<\/strong><\/td>\n<td>30–40 שניות<\/td>\n<\/tr>\n<tr>\n<td><strong>אביזרים<\/strong><\/td>\n<td>לא חובה: 3 דפים או צלחות חד־פעמיות בירוק, צהוב ואדום. אפשר גם רק צבע על המסך בעריכה<\/td>\n<\/tr>\n<tr>\n<td><strong>מה זה מתרגל<\/strong><\/td>\n<td><strong>קשב:<\/strong> עכבה, קשב חזותי ושמיעתי, מעבר בין כללים (גמישות) · <strong>מוטורי:<\/strong> ריצה במקום, תנועה איטית ועצירה · <strong>חברתי-רגשי:<\/strong> לתת לאחר להוביל<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>הוק (0–2 שנ׳):<\/strong> המסך מתמלא בירוק, וקים כבר רצה במקום: ״ירוק — רצים!״ טקסט: <strong>״ירוק = רצים״<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th>זמן<\/th>\n<th>מסגור<\/th>\n<th>מה רואים<\/th>\n<th>מה קים אומרת<\/th>\n<th>טקסט על המסך<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–2<\/td>\n<td>רחב<\/td>\n<td>ירוק, ריצה במקום<\/td>\n<td>״ירוק — רצים!״<\/td>\n<td><strong>ירוק = רצים<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2–7<\/td>\n<td>מדיום<\/td>\n<td>מציגה את הדפים או הצבעים<\/td>\n<td>״תפנו מקום! צהוב — הילוך איטי. אדום — קופאים!״<\/td>\n<td><strong>תפנו מקום!<\/strong> ואז <strong>צהוב = לאט · אדום = קופאים<\/strong><\/td>\n<\/tr>\n<tr>\n<td>7–18<\/td>\n<td>רחב<\/td>\n<td>רצף צבעים בקצב עולה (ירוק, צהוב, אדום, ירוק, אדום)<\/td>\n<td>קים קוראת כל צבע ומבצעת<\/td>\n<td>מסגרת צבעונית בשולי המסך מתחלפת<\/td>\n<\/tr>\n<tr>\n<td>18–24<\/td>\n<td>רחב<\/td>\n<td><strong>טוויסט:<\/strong> מסגרת <strong>כתומה<\/strong><\/td>\n<td>״כתום?! צבע חדש! כתום — רוקדים!!״<\/td>\n<td><strong>כתום = רוקדים!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>24–28<\/td>\n<td>רחב<\/td>\n<td>עוד 3 צבעים מהר, כולל כתום<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>28–32<\/td>\n<td>מדיום<\/td>\n<td>מצביעה למצלמה<\/td>\n<td>״עכשיו מישהו אחר בבית הוא הרמזור!״<\/td>\n<td><strong>עכשיו אתם הרמזור!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>32–39<\/td>\n<td>מדיום<\/td>\n<td>סיום קבוע (יד מאחורי האוזן, פאוזה, V, פסל, כרטיס)<\/td>\n<td>״עם קים...״ ״...כולם משחקים!״<\/td>\n<td><strong>כולם משחקים!<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>כיתוב לפוסט (להעתקה):<\/strong><\/p>\n<blockquote>\n<p>הרמזור של קים: ירוק — רצים במקום, צהוב — בהילוך איטי, אדום — קופאים.\nובאמצע קים הוסיפה צבע חדש...\nהילדים מתרגלים לעצור, להאט ולהחליף כלל באמצע, וזה מה שעושה את המשחק מצחיק.\nגננות: המשחק עובד עם כל הקבוצה ובלי שום ציוד.\nהורים, איזה צבע חדש הייתם מוסיפים, ומה עושים בו?<\/p>\n<\/blockquote>\n<p><strong>האשטגים:<\/strong> <code>#קיםמשחקים<\/code> <code>#משחקיםלגן<\/code> <code>#גננות<\/code> <code>#משחקיתנועה<\/code> <code>#פעילותלילדים<\/code><\/p>\n<p><strong>בטיחות:<\/strong> ריצה <strong>במקום<\/strong>, לא ריצה בחדר.\n<strong>סטורי מלווה:<\/strong> חידון: ״מה עושים בצהוב?״.<\/p>\n<hr />\n<h3>סרטון 11 · ״אתגר הגרב על הראש״ — אתגר קים<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>אורך יעד<\/strong><\/td>\n<td>30–40 שניות<\/td>\n<\/tr>\n<tr>\n<td><strong>אביזרים<\/strong><\/td>\n<td>גרב מגולגלת לכדור, או בובה רכה קטנה<\/td>\n<\/tr>\n<tr>\n<td><strong>מה זה מתרגל<\/strong><\/td>\n<td><strong>מוטורי:<\/strong> יציבה, שיווי משקל ותנועה מבוקרת · <strong>קשב:<\/strong> ריכוז מתמשך · <strong>חברתי-רגשי:<\/strong> התמדה, ליהנות מכישלון<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>הוק (0–2 שנ׳):<\/strong> קים הולכת לאט מאוד, עם גרב מגולגלת על הראש ועיניים למעלה. טקסט: <strong>״5 צעדים. בלי שהגרב תיפול.״<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>זמן<\/th>\n<th>מסגור<\/th>\n<th>מה רואים<\/th>\n<th>מה קים אומרת<\/th>\n<th>טקסט על המסך<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–2<\/td>\n<td>רחב<\/td>\n<td>הליכה זהירה<\/td>\n<td>(בלחש) ״אל... תיפלי...״<\/td>\n<td><strong>5 צעדים. בלי שהגרב תיפול.<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2–6<\/td>\n<td>רחב<\/td>\n<td>ניסיון 1: הגרב נופלת מיד<\/td>\n<td>״אופס! כבר?! ...לא נורא! תפנו מקום, מנסים שוב!״<\/td>\n<td><strong>ניסיון 1<\/strong> ובקטן: <strong>תפנו מקום!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>6–14<\/td>\n<td>רחב<\/td>\n<td>ניסיון 2: 5 צעדים מוצלחים, עם ספירה<\/td>\n<td>״אחת... שתיים... חמש! הצלחתי!״<\/td>\n<td>מונה צעדים <strong>1–5<\/strong><\/td>\n<\/tr>\n<tr>\n<td>14–20<\/td>\n<td>רחב<\/td>\n<td>רמה 2: להתכופף ולקום<\/td>\n<td>״רמה 2: להתכופף... ולקום...״<\/td>\n<td><strong>רמה 2<\/strong><\/td>\n<\/tr>\n<tr>\n<td>20–26<\/td>\n<td>רחב<\/td>\n<td>רמה 3: סיבוב <strong>אחד<\/strong>, לאט. הגרב נופלת, וקים תופסת אותה באוויר<\/td>\n<td>״רמה 3: סיבוב... תפסתי!!״<\/td>\n<td><strong>רמה 3<\/strong><\/td>\n<\/tr>\n<tr>\n<td>26–30<\/td>\n<td>מדיום<\/td>\n<td>מחזיקה גרב ובובה<\/td>\n<td>״עכשיו אתם! גרב, כרית קטנה או בובה רכה. רק דברים רכים!״<\/td>\n<td><strong>רק דברים רכים!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>30–37<\/td>\n<td>מדיום<\/td>\n<td>סיום קבוע (יד מאחורי האוזן, פאוזה, V, פסל, כרטיס)<\/td>\n<td>״עם קים...״ ״...כולם משחקים!״<\/td>\n<td><strong>כולם משחקים!<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>כיתוב לפוסט (להעתקה):<\/strong><\/p>\n<blockquote>\n<p>אתגר הגרב: שמים גרב מגולגלת (או בובה רכה) על הראש והולכים 5 צעדים בלי שתיפול.\nרמה 2: להתכופף ולקום. רמה 3: להסתובב.\nרק חפצים רכים, ורק על רצפה פנויה.\nהורים, לאיזו רמה הגעתם? ומי בבית הכי טוב בזה, אתם או הילדים?<\/p>\n<\/blockquote>\n<p><strong>האשטגים:<\/strong> <code>#קיםמשחקים<\/code> <code>#אתגרקים<\/code> <code>#אתגרלילדים<\/code> <code>#שיווימשקל<\/code> <code>#משחקיםבבית<\/code><\/p>\n<p><strong>בטיחות:<\/strong> אין חפצים קשים, שבירים או כבדים על הראש. לא במדרגות.<\/p>\n<hr />\n<h3>סרטון 12 · ״השלט של קים״ — קים משתגעת<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>אורך יעד<\/strong><\/td>\n<td>30–40 שניות<\/td>\n<\/tr>\n<tr>\n<td><strong>אביזרים<\/strong><\/td>\n<td>אין. האייקונים (פליי, עצור ועוד) מוסיפים בעריכה<\/td>\n<\/tr>\n<tr>\n<td><strong>מה זה מתרגל<\/strong><\/td>\n<td><strong>מוטורי:<\/strong> ויסות קצב (מהר, לאט, אחורה) · <strong>קשב:<\/strong> תגובה לאותות · <strong>חברתי-רגשי:<\/strong> משחק תפקידים עם הורה<\/td>\n<\/tr>\n<tr>\n<td><strong>רמת עריכה<\/strong><\/td>\n<td>גבוהה יותר (הילוך איטי, הרצה מהירה, הפוך). בשבוע 4 כבר יהיה לך ניסיון בעריכה<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>הוק (0–2 שנ׳):<\/strong> קים <strong>קפואה<\/strong> כמו סרטון שנעצר, עם אייקון עצירה (II) על המסך. היא ממלמלת בלי להזיז את השפתיים: ״תלחצו... על... פליי...״ טקסט: <strong>״קים נתקעה! תלחצו פליי״<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th>זמן<\/th>\n<th>מה רואים<\/th>\n<th>מה קים אומרת<\/th>\n<th>טקסט על המסך<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–2<\/td>\n<td>קפואה<\/td>\n<td>״תלחצו... על... פליי...״<\/td>\n<td><strong>קים נתקעה! תלחצו פליי<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2–5<\/td>\n<td>אייקון ״פליי״, קים ״חוזרת לחיים״<\/td>\n<td>״תודה! אני סרטון, ואתם מחזיקים את השלט!״<\/td>\n<td><strong>אתם מחזיקים את השלט<\/strong><\/td>\n<\/tr>\n<tr>\n<td>5–11<\/td>\n<td><strong>הילוך איטי<\/strong><\/td>\n<td>(מוארך) ״אאאני... ממממשיכה...״<\/td>\n<td><strong>הילוך איטי<\/strong><\/td>\n<\/tr>\n<tr>\n<td>11–16<\/td>\n<td><strong>הרצה קדימה<\/strong>: רוקדת מהר (מואץ בעריכה)<\/td>\n<td>(קול מצפצף)<\/td>\n<td><strong>קדימה מהר<\/strong><\/td>\n<\/tr>\n<tr>\n<td>16–21<\/td>\n<td><strong>אחורה<\/strong>: הולכת אחורה (מצולם הפוך או הופכים בעריכה)<\/td>\n<td>(דיבור הפוך)<\/td>\n<td><strong>אחורה<\/strong><\/td>\n<\/tr>\n<tr>\n<td>21–25<\/td>\n<td><strong>השתקה<\/strong>: מדברת בלי קול ומתעצבנת בקומיות<\/td>\n<td>(שקט)<\/td>\n<td><strong>השתקה<\/strong><\/td>\n<\/tr>\n<tr>\n<td>25–29<\/td>\n<td>מדיום<\/td>\n<td>״עכשיו אתם הסרטון, ואמא או אבא מחזיקים את השלט!״<\/td>\n<td><strong>עכשיו אתם!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>29–34<\/td>\n<td>סיום קבוע<\/td>\n<td>״עם קים...״ ״...כולם משחקים!״<\/td>\n<td><strong>כולם משחקים!<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>כיתוב לפוסט (להעתקה):<\/strong><\/p>\n<blockquote>\n<p>קים הפכה לסרטון... ואתם מחזיקים את השלט.\nמשחק לבית: הילד/ה הם ״הסרטון״, ההורה מחזיק ״שלט״ ולוחץ: פליי, עצור, הילוך איטי, קדימה מהר, אחורה. ואז מתחלפים (הורים בהילוך איטי זה הכי מצחיק).\nואם אתם רוצים את קים בגן, ביום הולדת או בקייטנה, הפרטים בקישור בפרופיל.<\/p>\n<\/blockquote>\n<p><strong>האשטגים:<\/strong> <code>#קיםמשחקים<\/code> <code>#קיםמשתגעת<\/code> <code>#משחקיםבבית<\/code> <code>#הוריםוילדים<\/code> <code>#הפעלותלילדים<\/code><\/p>\n<p><strong>הערה עסקית:<\/strong> זה הסרטון הראשון שהכיתוב שלו מזכיר הזמנות, והוא עולה בשבוע שבו <a href=\"06-show-offer.md\">הצעת המופע<\/a> מוכנה. <strong>בסרטון עצמו<\/strong> אין שום מכירה. המכירה נמצאת רק בכיתוב. כלל אצבע: לכל היותר כיתוב אחד מתוך שלושה מזכיר הזמנות.<\/p>\n<hr />\n<h2>תוכנית סטוריז<\/h2>\n<p><strong>למה סטוריז:<\/strong> הסרטונים מביאים חשיפה, והסטוריז בונים <strong>אמון<\/strong>. בסטוריז ההורים והגננות מכירים את קים ״מקרוב״, ומשם מגיעות הודעות פרטיות, כלומר הזמנות.<\/p>\n<p><strong>איפה:<\/strong> קודם כל ב־Instagram Stories, ובמקביל ב<strong>סטטוס וואטסאפ<\/strong> (אצלנו בישראל הורים וגננות נמצאים שם, והמעגל הקרוב שלך הוא המפיץ הראשון).<\/p>\n<p><strong>כמה:<\/strong> בימי פרסום 3–4 פריימים, ובשאר הימים 1–2. עדיף מעט כל יום מאשר הרבה פעם בשבוע.<\/p>\n<h3>שבוע סטוריז טיפוסי<\/h3>\n<table>\n<thead>\n<tr>\n<th>יום<\/th>\n<th>סוג<\/th>\n<th>מה עושים בפועל<\/th>\n<th>סטיקר<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>א׳ (פרסום)<\/td>\n<td>טיזר ושיתוף<\/td>\n<td>בבוקר: ״היום ב־[שעה] משחק חדש!״. אחרי הפרסום: שיתוף הסרטון לסטורי<\/td>\n<td>ספירה לאחור, ואז קישור לסרטון<\/td>\n<\/tr>\n<tr>\n<td>ב׳<\/td>\n<td>מאחורי הקלעים<\/td>\n<td>התלבושת על הקולב, האביזרים, חימום קול. 10 שניות, בלי מאמץ<\/td>\n<td>סקר: ״איזה משחק הבא?״<\/td>\n<\/tr>\n<tr>\n<td>ג׳ (פרסום)<\/td>\n<td>שיתוף ושאלה<\/td>\n<td>שיתוף הסרטון החדש<\/td>\n<td>חידון על הסרטון<\/td>\n<\/tr>\n<tr>\n<td>ד׳<\/td>\n<td>ערך להורים<\/td>\n<td>״משחק של 15 שניות לבית״: קים מדברת למצלמה ומציעה רעיון אחד<\/td>\n<td>שאלה: ״מה הילדים שלכם לא מפסיקים לבקש לשחק?״<\/td>\n<\/tr>\n<tr>\n<td>ה׳ (פרסום)<\/td>\n<td>שיתוף ובקשה<\/td>\n<td>שיתוף הסרטון: ״שלחו להורה שצריך את זה לסוף השבוע״<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>ו׳<\/td>\n<td>חם ומשפחתי<\/td>\n<td>״שבת שלום מקים״ ורעיון למשחק משפחתי לסוף השבוע<\/td>\n<td>סליידר: ״כמה אנרגיה נשארה לכם?״<\/td>\n<\/tr>\n<tr>\n<td>ש׳<\/td>\n<td>מנוחה, או שיתוף תגובות<\/td>\n<td>צילומי מסך של תגובות הורים (רק טקסט, בלי שמות ותמונות פרופיל)<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>הסטוריז המוצמדים בפרופיל (Highlights)<\/h3>\n<table>\n<thead>\n<tr>\n<th>שם<\/th>\n<th>מה בפנים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מי זאת קים<\/strong><\/td>\n<td>סרטון ההיכרות, ״מה אני עושה״ וניסיון בהדרכת תנועה ומשחק<\/td>\n<\/tr>\n<tr>\n<td><strong>משחקים לבית<\/strong><\/td>\n<td>כל הסטוריז של ״משחק של 15 שניות״<\/td>\n<\/tr>\n<tr>\n<td><strong>מופעים<\/strong><\/td>\n<td>קטעים מהמופעים <strong>בלי ילדים מזוהים<\/strong> (גב, ידיים, קים בפריים), ואיך נראה מופע<\/td>\n<\/tr>\n<tr>\n<td><strong>הורים מספרים<\/strong><\/td>\n<td>המלצות בכתב, באישור לפרסם ובלי שם מלא (<a href=\"05-pilot-feedback.md\">שאלון המשוב<\/a>)<\/td>\n<\/tr>\n<tr>\n<td><strong>להזמנות<\/strong><\/td>\n<td>מה כולל המופע ואיך מזמינים, עם קישור לווטסאפ או ל<a href=\"../site/index.html\">עמוד הנחיתה<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>סטוריז בשבוע הפיילוט<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לפני:<\/strong> ״השבוע ההופעה הראשונה שלי!״. <strong>בלי<\/strong> מקום, תאריך או שעה.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>ביום המופע:<\/strong> לא מעלים בזמן אמת. מצלמים רק את קים, את החדר הריק לפני ואת האביזרים.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אחרי (באותו ערב או למחרת):<\/strong> קים מדברת למצלמה, ״איך היה, ומה הילדים הכי אהבו״, ועוד משפט המלצה בכתב (באישור).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ילדים בפריים רק אם יש <a href=\"08-consent-template.md\">אישור חתום<\/a>. גם אז עדיף מאחור או מרחוק.<\/li>\n<\/ul>\n<h3>כללי סטוריז והודעות<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> עונים להודעות פרטיות תוך 24 שעות. פנייה על הזמנה עוברת לתהליך ב<a href=\"12-booking-process.md\">תהליך ההזמנה<\/a>.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> אם ילד כותב לך ישירות: עונים קצר וחם, ומבקשים שאמא או אבא יכתבו. לא מנהלים שיחה פרטית עם ילד.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> לא חושפים את הבית, את השכונה או את הרכב.<\/li>\n<\/ul>\n<hr />\n<h2>לוח תוכן חודשי — תבנית<\/h2>\n<h3>הקצב החודשי<\/h3>\n<table>\n<thead>\n<tr>\n<th>מתי<\/th>\n<th>מה<\/th>\n<th>זמן משוער<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>תחילת שבוע 1<\/td>\n<td><strong>יום צילום מרוכז<\/strong> (6 סרטונים לשבועיים)<\/td>\n<td>2 שעות + שעה הכנה ערב לפני<\/td>\n<\/tr>\n<tr>\n<td>תחילת שבוע 3<\/td>\n<td><strong>יום צילום מרוכז<\/strong> (6 הבאים + בנק)<\/td>\n<td>כנ״ל<\/td>\n<\/tr>\n<tr>\n<td>פעמיים בשבוע<\/td>\n<td><strong>עריכה<\/strong> (2–3 סרטונים בכל ישיבה)<\/td>\n<td>1–1.5 שעות לישיבה<\/td>\n<\/tr>\n<tr>\n<td>כל יום<\/td>\n<td><strong>15 דקות קהילה<\/strong>: לענות לתגובות ולהודעות, סטורי אחד<\/td>\n<td>15 דק׳<\/td>\n<\/tr>\n<tr>\n<td>כל יום ו׳<\/td>\n<td><strong>מדדים<\/strong>: מילוי הגיליון ב<a href=\"09-filming-guide.md\">מדריך הצילום<\/a><\/td>\n<td>20 דק׳<\/td>\n<\/tr>\n<tr>\n<td>סוף החודש<\/td>\n<td><strong>סיכום והחלטה<\/strong> לחודש הבא<\/td>\n<td>שעה<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>התבנית (להעתיק לחודש חדש)<\/h3>\n<table>\n<thead>\n<tr>\n<th>תאריך<\/th>\n<th>יום<\/th>\n<th>פלטפורמות<\/th>\n<th>סוג<\/th>\n<th>פורמט<\/th>\n<th>כותרת<\/th>\n<th>סטטוס<\/th>\n<th>כיתוב מוכן?<\/th>\n<th>צפיות 48 ש׳<\/th>\n<th>הערות<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td>א׳<\/td>\n<td>IG · TT · YT<\/td>\n<td>ריל<\/td>\n<td>משחקים עם קים<\/td>\n<td><\/td>\n<td>רעיון / תסריט / צולם / נערך / תוזמן / פורסם<\/td>\n<td>☐<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>ג׳<\/td>\n<td>IG · TT · YT<\/td>\n<td>ריל<\/td>\n<td>אתגר קים<\/td>\n<td><\/td>\n<td><\/td>\n<td>☐<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>ה׳<\/td>\n<td>IG · TT · YT<\/td>\n<td
