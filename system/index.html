ים. רק אחרי שיש לוגו סופי (פרק 7)<\/td>\n<\/tr>\n<tr>\n<td>תיק תלבושת ייעודי<\/td>\n<td>שהתלבושת לא תתקמט ולא תתלכלך<\/td>\n<td>30–100<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>4.4 שלב ג׳: תפירה אישית (רק אחרי שהביקוש הוכח)<\/h3>\n<ul>\n<li><strong>מי:<\/strong> תופרת או מעצבת תלבושות. מחפשים בהמלצות של להקות מחול, תיאטרונים קהילתיים או בתי ספר למחול.<\/li>\n<li><strong>מה מביאים:<\/strong> תמונת הייחוס (פרק 6.4), קודי הצבע, מידות, ורשימת 12 התנועות מפרק 3.4. <strong>התלבושת חייבת לעבור את המבחנים.<\/strong><\/li>\n<li><strong>מחיר:<\/strong> <strong>הערכה גסה מאוד: מאות ועד אלפי שקלים<\/strong>, תלוי בבד, במספר הסטים ובעבודה. מבקשים <strong>2–3 הצעות מחיר<\/strong> ומחליטים עם היועץ/ת.<\/li>\n<li><strong>מתי:<\/strong> כשיש הופעות בתשלום באופן קבוע, ולא לפני.<\/li>\n<\/ul>\n<h3>4.5 איפה לחפש בישראל<\/h3>\n<table>\n<thead>\n<tr>\n<th>סוג מקום<\/th>\n<th>מה תמצאי שם<\/th>\n<th>יתרון<\/th>\n<th>חיסרון או סיכון<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>רשתות ספורט<\/strong> (סניפים ואתרים)<\/td>\n<td>טייץ, חצאיות טניס, גרביים, נעליים, חזיות ספורט<\/td>\n<td>אפשר למדוד ולהחזיר. בדים לתנועה<\/td>\n<td>מבחר צבעים מוגבל (הרבה שחור ואפור)<\/td>\n<\/tr>\n<tr>\n<td><strong>חנויות ציוד לריקוד, בלט והתעמלות קרקע<\/strong> (חפשי ״חנות ריקוד״ ושם העיר)<\/td>\n<td>בגדי גוף, חצאיות ומכנסונים בהרבה צבעים<\/td>\n<td>בדים שנבנו לתנועה, אטומים<\/td>\n<td>יקר יותר<\/td>\n<\/tr>\n<tr>\n<td><strong>רשתות אופנה<\/strong><\/td>\n<td>בגדי גוף (״bodysuit״) עם לחצניות, חצאיות קפלים<\/td>\n<td>זמין, מלא סניפים<\/td>\n<td>בדים דקים לפעמים: מבחן שקיפות<\/td>\n<\/tr>\n<tr>\n<td><strong>חנויות תחפושות<\/strong><\/td>\n<td>חצאיות מעודדות, פפיונים<\/td>\n<td>״לוק״ מוכן<\/td>\n<td>איכות נמוכה לפעמים, נקרע בכביסה. המבחר הגדול לפני פורים (בערך במרץ, <strong>לבדוק<\/strong> תאריך)<\/td>\n<\/tr>\n<tr>\n<td><strong>אונליין בינלאומי<\/strong> (AliExpress, Amazon, Shein וכדומה)<\/td>\n<td>חצאיות מעודדות, פפיונים, שרוכים צבעוניים, מגיני זיעה<\/td>\n<td>זול, הרבה צבעים<\/td>\n<td>משלוח של שבועות (<strong>להזמין מוקדם<\/strong>), מידות לא אחידות, הצבע שונה מהתמונה, החזרה מסובכת. קוראים ביקורות <strong>עם תמונות של קונים<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>חנויות בדים וסדקית<\/strong><\/td>\n<td>סרט גרוגרן, גומי, סיכות, ערכת תפירה<\/td>\n<td>בוחרים צבע בעין<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>תופרת שכונתית או מכון תיקונים<\/strong><\/td>\n<td>קיצור, הוספת גומי, תפירת לחצניות, פס לבן על החצאית<\/td>\n<td>זול יחסית ומותאם אישית<\/td>\n<td>צריך זמן<\/td>\n<\/tr>\n<tr>\n<td><strong>יד שנייה<\/strong> (קבוצות ואתרים)<\/td>\n<td>חצאיות ובגדי ריקוד<\/td>\n<td>זול<\/td>\n<td>לכבס לפני שימוש, לבדוק מצב<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>4.6 כללי קנייה חכמה<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מביאים לחנות את הפריטים שכבר יש<\/strong> ובודקים התאמת צבעים <strong>באור יום<\/strong>, ליד החלון או בחוץ.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>בתא המדידה:<\/strong> קפיצה, סקוואט ו־V.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>שומרים קבלות<\/strong> עד שהבגד עבר את המבחנים בבית, ובודקים את מדיניות ההחזרה לפני שקונים.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אונליין:<\/strong> מזמינים קודם פריט אחד ורואים את הצבע במציאות, לפני שמזמינים סט שלם.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מה שעבר את הפיילוט<\/strong> קונים שוב (סט שני) רק בשלב ב׳.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>כל קבלה נשמרת:<\/strong> התלבושת היא הוצאה של העסק. רושמים ב<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>. מה מותר לקזז בפועל, <strong>לבדוק<\/strong> לפי <a href=\"13-legal-admin.md\">מסמך הרישוי והמנהלה<\/a>.<\/li>\n<\/ul>\n<hr />\n<h2>5. תלבושת גיבוי וערכת חירום<\/h2>\n<h3>5.1 מה זה ״גיבוי״<\/h3>\n<table>\n<thead>\n<tr>\n<th>שלב<\/th>\n<th>מה יש בתיק המופע<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>פיילוט (שלב א׳)<\/strong><\/td>\n<td>סרט רזרבי, 3 גומיות, סיכות, זוג גרביים נוסף, זוג שרוכים נוסף, <strong>וחולצה צהובה וטייץ כ״תוכנית ב׳״<\/strong> אם בגד הגוף נקרע או נרטב<\/td>\n<\/tr>\n<tr>\n<td><strong>אחרי הפיילוט (שלב ב׳)<\/strong><\/td>\n<td><strong>סט שני מלא<\/strong>: בגד גוף, טייץ, ואם אפשר גם חצאית<\/td>\n<\/tr>\n<tr>\n<td><strong>מופעים רצופים<\/strong><\/td>\n<td>סט א׳ וסט ב׳ בתורות. אחד במופע, אחד בכביסה<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>5.2 ערכת חירום לתלבושת (קופסה קטנה בתיק)<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> סיכות ביטחון (6–10). <strong>רק סגורות, ורק לתיקון בצד, לא מול הילדים.<\/strong> סופרים כמה יצאו מהקופסה וכמה חזרו<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> סרט הדבקה דו־צדדי לבד<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> ערכת תפירה קטנה: חוט צהוב, כתום ולבן, ומחט<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> עט או מגבון להסרת כתמים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> דאודורנט ומגבונים לחים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מגבת קטנה<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> שקית לבגדים מיוזעים<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> גומיות, סיכות וסרט רזרבי<\/li>\n<\/ul>\n<p><em>ערכת העזרה הראשונה היא דבר נפרד. הרשימה שלה בפרק 9 ב<a href=\"02-show-script.md\">תסריט<\/a>.<\/em><\/p>\n<hr />\n<h2>6. כביסה, טיפול ואחסון<\/h2>\n<blockquote>\n<p><strong>תווית הכביסה של כל בגד קודמת לטבלה הזאת.<\/strong> אם כתוב בתווית משהו אחר, עושים לפי התווית.<\/p>\n<\/blockquote>\n<h3>6.1 שגרה אחרי כל מופע (5 דקות בבית)<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מוציאים את התלבושת מהתיק <strong>באותו יום<\/strong>. זיעה שנשארת בלילה בתיק = ריח וכתמים צהובים.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מנגבים את הנעליים.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מכבסים (6.2).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> בודקים תפרים, גומי ושקיפות. מתקנים עכשיו, לא ביום המופע הבא.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מחזירים לתיק התלבושת: נקי, יבש ומקופל, עם ערכת השיער.<\/li>\n<\/ul>\n<h3>6.2 לפי פריט<\/h3>\n<table>\n<thead>\n<tr>\n<th>פריט<\/th>\n<th>כביסה<\/th>\n<th>ייבוש<\/th>\n<th>לא<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>בגד גוף וטייץ<\/strong> (לייקרה)<\/td>\n<td>מים קרים או 30°, הפוך, בשקית כביסה<\/td>\n<td>שטוח או תלוי, <strong>בצל<\/strong><\/td>\n<td>בלי מרכך (פוגע בגמישות ובספיגה), בלי מייבש, בלי גיהוץ<\/td>\n<\/tr>\n<tr>\n<td><strong>חצאית קפלים<\/strong><\/td>\n<td>הפוכה, בשקית כביסה, תוכנית עדינה<\/td>\n<td><strong>תולים מייד כשהיא רטובה<\/strong>, ומסדרים את הקפלים ביד. אפשר לסגור את התחתית באטבים<\/td>\n<td>גיהוץ רק אם התווית מרשה, בחום נמוך ודרך בד<\/td>\n<\/tr>\n<tr>\n<td><strong>סניקרס לבנות<\/strong><\/td>\n<td>ניגוב אחרי כל מופע. שרוכים מכבסים בנפרד<\/td>\n<td>בצל, באוויר<\/td>\n<td>לא על רדיאטור ולא בשמש. כביסה במכונה רק אם היצרן מאשר (הדבק יכול להיפרד)<\/td>\n<\/tr>\n<tr>\n<td><strong>גרביים<\/strong><\/td>\n<td>כביסה רגילה, הפוכות<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>סרט<\/strong><\/td>\n<td>ביד, עם מעט סבון<\/td>\n<td>שטוח<\/td>\n<td>גיהוץ רק בחום נמוך, אם צריך<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>השמש בישראל דוהה צבעים מהר.<\/strong> תמיד מייבשים בצל, וצהוב במיוחד.<\/p>\n<h3>6.3 אחסון<\/h3>\n<ul>\n<li><strong>תיק תלבושת ייעודי<\/strong>, ושקית שקופה קטנה לערכת השיער.<\/li>\n<li><strong>התלבושת רק למופעים ולצילומים.<\/strong> לא לובשים אותה לחדר כושר או ״סתם״.<\/li>\n<\/ul>\n<h3>6.4 תמונת ייחוס ומתי מחליפים<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>ביום הראשון:<\/strong> צלמי את התלבושת המלאה מלפנים, מהצד ומאחור, על רקע לבן ובאור יום. שמרי בתיקייה ״קים: תמונת ייחוס״. זו גם התמונה שתשלחי לתופרת או למעצב/ת.<\/li>\n<li><strong>מחליפים פריט כש:<\/strong><\/li>\n<li>הצבע דהה לעומת תמונת הייחוס<\/li>\n<li>הבד נהיה שקוף במבחן הפלאש<\/li>\n<li>הגומי נמתח והחצאית או הטייץ זזים<\/li>\n<li>יש ״כדורים״ על הבד<\/li>\n<li><strong>הסוליה של הנעליים נשחקה.<\/strong> זה סיכון החלקה, לא רק עניין של מראה<\/li>\n<\/ul>\n<hr />\n<h2>7. הלוגו: דרישות, בריף למעצב/ת, מסלול DIY, בחירה וזכויות<\/h2>\n<h3>7.1 מה הלוגו צריך לעשות<\/h3>\n<p><strong>מהקונספט (פרק 3):<\/strong><\/p>\n<ul>\n<li><strong>K גדולה ודינמית<\/strong><\/li>\n<li><strong>בשילוב רמזים למשחק:<\/strong> כדור, קובייה או מסלול תנועה<\/li>\n<li><strong>פשוט<\/strong>, כך שייראה טוב גם בקטן (״יש לפשט״)<\/li>\n<\/ul>\n<p><strong>המלצה שלי (כדי לפשט, כמו שהקונספט מבקש):<\/strong> רמז אחד למשחק, לא שלושה. שני רמזים זה עדיין אפשרי, אם הלוגו עובר את מבחן 32 הפיקסלים (פרק 7.6).<\/p>\n<h3>7.2 איפה הוא יופיע (ומה חייב לשרוד שם)<\/h3>\n<table>\n<thead>\n<tr>\n<th>מקום<\/th>\n<th>גודל בערך<\/th>\n<th>מה חייב לעבוד<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>תמונת פרופיל ברשתות ובוואטסאפ<\/td>\n<td>קטן מאוד, <strong>בתוך עיגול<\/strong><\/td>\n<td>הסמל לבד, בלי טקסט<\/td>\n<\/tr>\n<tr>\n<td>אייקון בלשונית הדפדפן (favicon)<\/td>\n<td>16–32 פיקסלים<\/td>\n<td>צורה אחת ברורה<\/td>\n<\/tr>\n<tr>\n<td>כרטיס סיום בסרטון (9:16)<\/td>\n<td>בינוני<\/td>\n<td>סמל, שם ושם משתמש<\/td>\n<\/tr>\n<tr>\n<td>מדבקה ״שחקן/ית של קים״<\/td>\n<td>בערך 5 ס״מ<\/td>\n<td>צבעוני, ונקרא גם בהדפסה זולה<\/td>\n<\/tr>\n<tr>\n<td>על התלבושת (טלאי או הדפסה)<\/td>\n<td>כף יד<\/td>\n<td><strong>בצבע אחד<\/strong><\/td>\n<\/tr>\n<tr>\n<td>עמוד הנחיתה והצעת המחיר<\/td>\n<td>בינוני וגדול<\/td>\n<td>לוגו מלא: סמל ושם<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>7.3 הבריף: להעתיק, למלא ולשלוח<\/h3>\n<blockquote>\n<p><strong>שלום [שם המעצב/ת],<\/strong><\/p>\n<p><strong>מי אני:<\/strong> קים נידם, יוצרת ומבצעת של ״קים משחקים״: דמות כוכבת ילדים אנרגטית, מצחיקה וספורטיבית, שמובילה ילדים למשחק, תנועה, צחוק והשתתפות פעילה. במופעים ובסרטונים שלי הילדים לא צופים, הם משחקים. יש לי ניסיון מעשי בהדרכת תנועה ומשחק לילדים ובתיאטרון.<\/p>\n<p><strong>הסלוגן:<\/strong> ״עם קים — כולם משחקים!״ (קריאה ותגובה: אני קוראת ״עם קים...״ והילדים עונים ״כולם משחקים!״)<\/p>\n<p><strong>הקהל:<\/strong> ילדים בגיל הגן ובכיתות א׳–ב׳ (בערך 3–8). מי שמזמין: הורים, גננות, קייטנות, מתנ״סים ומפיקי אירועים.<\/p>\n<p><strong>האופי:<\/strong> שובבה · סוחפת · אמיתית. ספורטיבית ושמחה. <strong>לא<\/strong> מתיילדת ולא ״מתוקה״.<\/p>\n<p><strong>מה אני מבקשת:<\/strong><\/p>\n<ol>\n<li><strong>סמל:<\/strong> אות <strong>K<\/strong> גדולה ודינמית, עם רמז אחד למשחק: כדור, קובייה או מסלול תנועה (ההחלטה איזה, שלך). אפשר להציע גם כיוון עם שני רמזים, אם הוא עדיין עובד ב־32 פיקסלים.<\/li>\n<li><strong>לוגו מלא:<\/strong> הסמל יחד עם השם בעברית: <strong>״קים משחקים״<\/strong>.<\/li>\n<li><strong>(לא חובה)<\/strong> גרסה עם הסלוגן.<\/li>\n<\/ol>\n<p><strong>דרישות חובה:<\/strong><\/p>\n<ul>\n<li>קריא ומזוהה <strong>בגודל קטן מאוד<\/strong> (אייקון של 32 פיקסלים, תמונת פרופיל בעיגול)<\/li>\n<li>עובד <strong>בצבע אחד<\/strong> (שחור, ולבן על רקע כהה)<\/li>\n<li>עובד על רקע <strong>צהוב, כתום ולבן<\/strong><\/li>\n<li>אפשר להדפיס אותו על <strong>בד<\/strong> ועל <strong>מדבקה<\/strong> בלי פרטים שנעלמים<\/li>\n<li>צורה שגם <strong>ילד/ה שעוד לא קורא/ת<\/strong> יזהה ויוכל/תוכל לצייר מהזיכרון<\/li>\n<\/ul>\n<p><strong>צבעים:<\/strong> צהוב <code>#FFC928<\/code> · כתום <code>#FF7A1A<\/code> · לבן <code>#FFFFFF<\/code> · דיו (לטקסט) <code>#2B2118<\/code>. לטקסט כתום על לבן: <code>#B34700<\/code>.<\/p>\n<p><strong>גופן טקסט קיים:<\/strong> Rubik (Google Fonts). אפשר לצייר את המילים בלוגו בצורה מיוחדת.<\/p>\n<p><strong>מה לא:<\/strong><\/p>\n<ul>\n<li>לא ציור מפורט של דמות או פנים (בשלב הזה)<\/li>\n<li>לא תבניות, קליפ־ארט או אלמנטים מספריות תמונות<\/li>\n<li>לא דמיון למותגי ילדים קיימים<\/li>\n<li>לא צללים, גרדיאנטים ואפקטים שנעלמים בקטן<\/li>\n<li>לא שימוש בכלי בינה מלאכותית ליצירת הלוגו הסופי בלי לתאם איתי מראש<\/li>\n<\/ul>\n<p><strong>מה אני צריכה לקבל בסוף:<\/strong><\/p>\n<ul>\n<li>קבצים וקטוריים (SVG ו־PDF, וגם קובץ המקור של התוכנה שבה עבדת)<\/li>\n<li>PNG עם רקע שקוף בגדלים שונים, כולל ריבוע לתמונת פרופיל<\/li>\n<li>גרסאות: צבעוני, שחור, לבן, סמל בלבד, לוגו מלא לרוחב, לוגו מלא לגובה<\/li>\n<li>עמוד אחד של ״כללי שימוש״: צבעים, מרווח מינימלי סביב הלוגו, גודל מינימלי, ומה אסור<\/li>\n<li>שמות הגופנים שבשימוש, והרישיון שלהם<\/li>\n<\/ul>\n<p><strong>תהליך:<\/strong> 2–3 כיוונים ראשונים כסקיצות ← אני בוחרת אחד ← עד 2 סבבי תיקונים ← קבצים סופיים.<\/p>\n<p><strong>זכויות:<\/strong> בסיום התשלום, <strong>העברה מלאה של כל זכויות היוצרים בלוגו אליי, בכתב<\/strong>, והצהרה שהעבודה מקורית ושאין בה אלמנטים של אחרים (תבניות, תמונות ממאגרים, או גופנים בלי רישיון מתאים). ייתכן שאגיש את הלוגו לרישום כסימן מסחר.<\/p>\n<p><strong>לוח זמנים:<\/strong> [להשלמה] · <strong>תקציב:<\/strong> [להשלמה, לפי ההחלטה בפגישת המיקוד]<\/p>\n<p><strong>מצורף:<\/strong> תמונות שלי בתלבושת (ובלי ילדים), קישור לסרטון ההיכרות, ועמוד הנחיתה הזמני.<\/p>\n<p><strong>אשמח לקבל:<\/strong> תיק עבודות, הצעת מחיר, לוח זמנים ומספר סבבי התיקונים שכלולים.<\/p>\n<p>תודה! קים נידם · קים משחקים · [טלפון]<\/p>\n<\/blockquote>\n<h3>7.4 איפה מוצאים מעצב/ת<\/h3>\n<table>\n<thead>\n<tr>\n<th>מקור<\/th>\n<th>איך<\/th>\n<th>לשים לב<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>המלצות<\/strong> של בעלי עסקים קטנים שאת מכירה<\/td>\n<td>״מי עשה לך את הלוגו? היית מרוצה?״<\/td>\n<td>המקור הכי אמין<\/td>\n<\/tr>\n<tr>\n<td><strong>אינסטגרם ו־Behance<\/strong><\/td>\n<td>חיפוש ״מעצבת גרפית״, ״מיתוג לעסקים קטנים״, ״לוגו לילדים״<\/td>\n<td>בתיק העבודות מחפשים <strong>לוגואים פשוטים ונועזים<\/strong> ואייקונים, לא רק איורים מורכבים<\/td>\n<\/tr>\n<tr>\n<td><strong>Fiverr<\/strong> וזירות פרילנס<\/td>\n<td>מחפשים מעצבים שכותבים בפרופיל שהם עובדים בעברית, וקוראים ביקורות<\/td>\n<td>לבדוק שתיק העבודות אמיתי (חיפוש תמונה הפוך ב־Google Lens). לוודא העברת זכויות בכתב<\/td>\n<\/tr>\n<tr>\n<td><strong>סטודנטים ובוגרים<\/strong> למחלקות תקשורת חזותית (למשל בצלאל, שנקר, HIT מכון טכנולוגי חולון, ויצו חיפה)<\/td>\n<td>תערוכות בוגרים, פנייה למחלקה, אינסטגרם<\/td>\n<td>לרוב זול יותר. צריך הסכם ברור ולוח זמנים<\/td>\n<\/tr>\n<tr>\n<td><strong>קבוצות פייסבוק<\/strong> של עסקים קטנים ופרילנסרים<\/td>\n<td>פרסום קצר של הבריף<\/td>\n<td>יגיעו הרבה הצעות. בוחרים לפי תיק עבודות, לא לפי מחיר<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>איך בוחרים:<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מבקשים <strong>3 הצעות מחיר<\/strong> לאותו בריף.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> שואלים: ״תוכל/י להראות לי לוגו שעשית איך שהוא נראה בגודל אייקון?״<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מוודאים מראש <strong>בכתב<\/strong>: העברת זכויות, מספר תיקונים, קבצים סופיים.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> מבקשים לדבר עם לקוח/ה קודם/ת אחד/ת.<\/li>\n<\/ul>\n<p><strong>מחיר:<\/strong> טווח המחירים בשוק רחב מאוד: <strong>מכמה מאות שקלים בזירות פרילנס ועד אלפי שקלים לתהליך מיתוג אצל מעצב/ת מנוסה<\/strong> (הערכה כללית, <strong>לא נבדק<\/strong>. הצעות המחיר שתקבלי הן המקור). את התקציב קובעים ב<a href=\"07-advisor-meeting.md\">פגישת המיקוד<\/a> ורושמים ב<a href=\"11-pricing-worksheet.md\">גיליון התמחור<\/a>.<\/p>\n<h3>7.5 מסלול DIY: לוגו זמני לפיילוט (כמעט בחינם)<\/h3>\n<p><strong>מתאים ל:<\/strong> שבוע 1 עד אחרי הפיילוט. זה <strong>לוגו זמני<\/strong>. כשיש תקציב, הוא עובר למעצב/ת.<\/p>\n<ol>\n<li><strong>על נייר, 15 דקות:<\/strong> ציירי 20 גרסאות של K. רעיונות:\n   - K שהרגל שלה היא דמות רצה\n   - K עם כדור קטן כ״נקודה״\n   - K שהרגל שלה ממשיכה לקו מקווקו של מסלול\n   - K על פאה של קובייה\n   - K עם קווי תנועה<\/li>\n<li><strong>בחרי 3<\/strong>, והראי ל־3 ילדים (של חברים או מהמשפחה) ול־3 הורים: ״מה אתם רואים?״ את הילדים: <strong>בנוכחות ההורה ובאישורו, בלי לצלם את הילד/ה.<\/strong><\/li>\n<li><strong>בני את הגרסה הנבחרת ב־Canva או ב־Figma<\/strong> (בשניהם יש גרסה חינמית), <strong>רק<\/strong> עם:\n   - הגופן Rubik\n   - צורות בסיסיות: עיגול, ריבוע, קו\n   - קודי הצבע מפרק 1<\/li>\n<li><strong>בלי תבניות לוגו ובלי אלמנטים מהספרייה<\/strong> (איורים, אייקונים, תמונות). לפי <a href=\"https://www.canva.com/help/trademarks-logo/\">דף העזרה של Canva על לוגו וסימני מסחר<\/a> (לפי תוצאות חיפוש. לא הצלחתי לפתוח את הדף ישירות):\n   - <strong>מותר:<\/strong> כל הגופנים של Canva, וקווים וצורות בסיסיות מהספרייה החינמית. גם ציור מקורי שלך שהעלית.\n   - <strong>אסור, אם רוצים לרשום סימן מסחר:<\/strong> תבנית לוגו (גם עם שינויים קטנים), ואיורים, אייקונים או תמונות מהספרייה. הרישיון עליהם לא בלעדי, ומשתמשים אחרים יכולים להשתמש באותו דבר.\n   - <strong>לבדוק<\/strong> בדף שהכללים לא השתנו. וזכרי: Canva אומרת מה היא מרשה, לא מה רשם סימני המסחר יאשר.<\/li>\n<li><strong>ייצוא:<\/strong> PNG גדול עם רקע שקוף, ועוד גרסה ריבועית על רקע צהוב לתמונת פרופיל.<\/li>\n<li><strong>בדיקה:<\/strong> הקטיני בטלפון לגודל של אייקון. עדיין רואים K?<\/li>\n<li><strong>שם הקובץ:<\/strong> ״לוגו־זמני״, כדי שלא תשכחי שזה זמני.<\/li>\n<\/ol>\n<p><strong>גרסה פשוטה עוד יותר (זה הלוגו הזמני שכבר נמצא ב<a href=\"../site/index.html\">עמוד הנחיתה<\/a>):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>חלק<\/th>\n<th>מה<\/th>\n<th>צבע<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>העיגול<\/td>\n<td>עיגול מלא<\/td>\n<td>צהוב <code>#FFC928<\/code><\/td>\n<\/tr>\n<tr>\n<td>האות<\/td>\n<td>K גדולה ב־Rubik 800 (בעמוד הנחיתה: מוטה קצת, כמו בתנועה)<\/td>\n<td>דיו <code>#2B2118<\/code> (ניגודיות 10.2:1 על הצהוב)<\/td>\n<\/tr>\n<tr>\n<td>הנקודה<\/td>\n<td>עיגול קטן בפינה הימנית העליונה. זה ה״כדור״<\/td>\n<td>כתום <code>#FF7A1A<\/code><\/td>\n<\/tr>\n<tr>\n<td>מסגרת<\/td>\n<td>רק כשהרקע צהוב או כתום (כמו בראש עמוד הנחיתה): מסגרת לבנה סביב העיגול<\/td>\n<td>לבן<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>אותו סימן משמש גם כאייקון בלשונית הדפדפן. כדי להכין אותו בעצמך לתמונת פרופיל: ב־Canva, ריבוע של 1080×1080, עיגול צהוב, האות K ב־Rubik, ועיגול כתום קטן. בלי שום אלמנט מהספרייה.<\/p>\n<p><strong>כלי בינה מלאכותית:<\/strong> אפשר להשתמש בהם <strong>להשראה בלבד<\/strong>. המעמד המשפטי של יצירות שנוצרו בבינה מלאכותית (זכויות יוצרים, רישום סימן מסחר) לא ברור, וזה <strong>לבדוק<\/strong> מול עו״ד (<a href=\"13-legal-admin.md\">מסמך הרישוי והמנהלה<\/a>). הלוגו הסופי: יצירה של אדם, עם העברת זכויות בכתב.<\/p>\n<h3>7.6 איך בוחרים בין הכיוונים שהמעצב/ת שלח/ה<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מבחן הפזילה:<\/strong> מצמצמים עיניים. עדיין רואים K ותנועה?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מבחן 32 פיקסלים:<\/strong> מקטינים בטלפון לגודל אייקון.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מבחן שחור־לבן:<\/strong> עובד בלי צבע?<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>על שלושה רקעים:<\/strong> צהוב, כתום ולבן.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מבחן ילדים:<\/strong> מראים ל־3–5 ילדים (של חברים או מהמשפחה), ואחרי דקה מבקשים: ״תציירו אותו מהזיכרון.״ <strong>אם ילד/ה מצליח/ה לצייר אותו, הוא חזק.<\/strong> בנוכחות ההורה ובאישורו, בלי לצלם את הילד/ה (את הציור אפשר לצלם, בלי שם).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מבחן הורים:<\/strong> ״על מה העסק הזה, לדעתך?״ התשובה צריכה להיות ״משהו של משחק או תנועה לילדים״, לא ״בית ספר״ ולא ״חדר כושר״.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>ייחודיות:<\/strong> חיפוש תמונה הפוך ב־Google Lens, וחיפוש <strong>עצמאי וחינמי<\/strong> ב<a href=\"https://www.gov.il/he/service/search_israeli_trademarks_database\">מאגר סימני המסחר הישראלי<\/a> (לא החיפוש בתשלום. ההסבר בשורה 11 בפרק 8.2). הפירוט ב<a href=\"13-legal-admin.md\">מסמך הרישוי והמנהלה<\/a>, פרק 6.1.<\/li>\n<\/ul>\n<h3>7.7 זכויות וקבצים<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>הסכם בכתב לפני שמתחילים:<\/strong> מה כלול, כמה תיקונים, לוח זמנים, תשלום.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>העברת זכויות יוצרים מלאה אלייך<\/strong>, בכתב, בסיום התשלום. מה הנוסח הנכון, <strong>לבדוק<\/strong> מול עו״ד (<a href=\"13-legal-admin.md\">מסמך הרישוי והמנהלה<\/a>).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>הצהרת מקוריות:<\/strong> בלי תבניות, בלי תמונות ממאגרים, בלי גופנים בלי רישיון.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>כל הקבצים מפרק 7.3<\/strong>, כולל קבצי המקור.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>גיבוי בשני מקומות:<\/strong> ענן ודיסק או מחשב.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>סימן מסחר:<\/strong> רק אחרי בחירת הלוגו, ולפני הדפסות גדולות. ב<a href=\"13-legal-admin.md\">מסמך הרישוי והמנהלה<\/a>.<\/li>\n<\/ul>\n<hr />\n<h2>8. שם, שמות משתמש ודומיין<\/h2>\n<h3>8.1 בוחרים איות לועזי אחד<\/h3>\n<p>בעברית יש לנו ״קים משחקים״. ברשתות ובדומיין צריך אותיות לועזיות, ואת ה־ח אפשר לכתוב כ־h, ch או kh. <strong>מה שקובע הוא איך הורים יקלידו את השם כשהם יחפשו אותך.<\/strong><\/p>\n<p><strong>השיטה:<\/strong><\/p>\n<ol>\n<li>אומרים את השם בקול ל־5 הורים (בלי להראות כתוב) ומבקשים: ״תקלידו את זה כמו שהייתם מחפשים באינסטגרם.״<\/li>\n<li>האיות שהכי הרבה הורים כתבו הוא האיות שלך.<\/li>\n<li><strong>אותו איות בכל הפלטפורמות.<\/strong> האותיות זהות בכל מקום. רק סימן ההפרדה (נקודה, מקף) יכול להשתנות, כי לא כל פלטפורמה מרשה כל סימן (הטבלה למטה).<\/li>\n<\/ol>\n<table>\n<thead>\n<tr>\n<th>אפשרות<\/th>\n<th>אורך<\/th>\n<th>הערה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>kimmesahakim<\/code><\/td>\n<td>12<\/td>\n<td>הכי נקי, ועובד <strong>בכל מקום<\/strong>, כולל פייסבוק ודומיין. אבל קשה לקרוא כמילה אחת<\/td>\n<\/tr>\n<tr>\n<td><code>kim.mesahakim<\/code><\/td>\n<td>13<\/td>\n<td>נקודה מפרידה וקל לקרוא. עובד באינסטגרם, בטיקטוק, ביוטיוב ובפייסבוק. <strong>לא עובד בדומיין<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>kim_mesahakim<\/code><\/td>\n<td>13<\/td>\n<td>קו תחתון. פחות נוח להקליד בטלפון. <strong>לא עובד בפייסבוק ולא בדומיין<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>kimmesachakim<\/code> / <code>kim.mesachakim<\/code><\/td>\n<td>13–14<\/td>\n<td>איות עם ch, נפוץ אצל דוברי עברית<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>איפה איזה סימן מותר:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>נקודה <code>.<\/code><\/th>\n<th>קו תחתון <code>_<\/code><\/th>\n<th>מקף <code>-<\/code><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Instagram<\/td>\n<td>✅<\/td>\n<td>✅<\/td>\n<td>❌<\/td>\n<\/tr>\n<tr>\n<td>TikTok<\/td>\n<td>✅ (לא בסוף)<\/td>\n<td>✅<\/td>\n<td>❌<\/td>\n<\/tr>\n<tr>\n<td>YouTube<\/td>\n<td>✅ (לא בהתחלה ובסוף)<\/td>\n<td>✅<\/td>\n<td>✅<\/td>\n<\/tr>\n<tr>\n<td>Facebook<\/td>\n<td>✅, אבל <strong>פייסבוק מתעלמת ממנה<\/strong><\/td>\n<td>❌<\/td>\n<td>❌<\/td>\n<\/tr>\n<tr>\n<td>דומיין ‎.co.il<\/td>\n<td>❌<\/td>\n<td>❌<\/td>\n<td>✅<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>המקורות לכל שורה בטבלה של פרק 8.2. חלקם משניים: <\/em><em>לבדוק<\/em><em> ביום הפתיחה.<\/em><\/p>\n<p><strong>בדומיין אין נקודה ואין קו תחתון:<\/strong> <code>kimmesahakim.co.il<\/code> או <code>kim-mesahakim.co.il<\/code>.<\/p>\n<p><strong>ביוטיוב<\/strong> אפשר להשתמש בשם ערוץ (handle) גם באותיות של שפות נתמכות (<a href=\"https://support.google.com/youtube/answer/11585688\">עזרת YouTube<\/a>), ולכן ייתכן ש־<code>@קיםמשחקים<\/code> אפשרי. <strong>לבדוק.<\/strong> שם לועזי זהה בכל הפלטפורמות עדיין חשוב יותר.<\/p>\n<h3>8.2 צ׳קליסט בדיקת זמינות<\/h3>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>איפה<\/th>\n<th>איך בודקים<\/th>\n<th>כללים (<strong>לבדוק<\/strong> בזמן הפתיחה)<\/th>\n<th>פנוי?<\/th>\n<th>שמרתי בתאריך<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>Instagram<\/strong><\/td>\n<td>באפליקציה: יצירת חשבון חדש או ״עריכת פרופיל״, ומקלידים את השם. אפשר גם לגלוש ל־instagram.com/השם<\/td>\n<td>עד 30 תווים: אותיות, ספרות, נקודה וקו תחתון (מקור משני: <a href=\"https://blog.hootsuite.com/instagram-username-ideas/\">Hootsuite<\/a>)<\/td>\n<td>☐<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>TikTok<\/strong><\/td>\n<td>באפליקציה, או tiktok.com/@השם<\/td>\n<td>עד 24 תווים: אותיות, ספרות, קו תחתון ונקודה, ולא נקודה בסוף (מקור משני: <a href=\"https://onlypult.com/blog/how-to-change-tiktok-username\">Onlypult<\/a>)<\/td>\n<td>☐<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>YouTube<\/strong><\/td>\n<td>ב־YouTube Studio, הגדרות ה־handle<\/td>\n<td>3–30 תווים. מפרידים מותרים: קו תחתון, מקף, נקודה, אבל לא בהתחלה ולא בסוף (<a href=\"https://support.google.com/youtube/answer/11585688\">עזרת YouTube<\/a>)<\/td>\n<td>☐<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><strong>Facebook<\/strong> (עמוד עסקי)<\/td>\n<td>גולשים ל־facebook.com/השם. אם מגיעים לעמוד של מישהו, השם תפוס. הבדיקה הסופית: בזמן פתיחת העמוד, בשדה ״שם משתמש״<\/td>\n<td>מותר: אותיות, ספרות ונקודה, <strong>לפחות 5 תווים<\/strong>. <strong>אין קו תחתון.<\/strong> פייסבוק מתעלמת מנקודות ומאותיות גדולות, אז <code>kim.mesahakim<\/code> ו־<code>kimmesahakim<\/code> הם אותו שם (מקורות משניים: <a href=\"https://uberall.helpjuice.com/guides/1737737-set-a-facebook-page-username\">Uberall<\/a>, <a href=\"https://socialrails.com/blog/facebook-page-username-not-eligible\">SocialRails<\/a>. <strong>לבדוק<\/strong> בעזרה של פייסבוק)<\/td>\n<td>☐<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><strong>WhatsApp Business<\/strong><\/td>\n<td>שם העסק ״קים משחקים״, קטגוריה, תיאור<\/td>\n<td>אין בדיקת זמינות. שם העסק הוא מה שהלקוחות רואים<\/td>\n<td>☐<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><strong>מייל של העסק<\/strong><\/td>\n<td>פתיחת Gmail חדש על האיות שבחרת<\/td>\n<td>—<\/td>\n<td>☐<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td><strong>דומיין ‎.co.il<\/strong> (<strong>רק בודקים, לא קונים<\/strong>)<\/td>\n<td>נכנסים לאתר של רשם מוסמך (הרשימה באתר איגוד האינטרנט הישראלי, <a href=\"https://www.isoc.org.il\">isoc.org.il<\/a>), ומקלידים בתיבת החיפוש את השם המלא, למשל <code>kimmesahakim.co.il<\/code><\/td>\n<td>אותיות לועזיות, ספרות ומקף. <strong>בלי נקודה ובלי קו תחתון<\/strong> בתוך השם. מחיר, חידוש, הסתרת פרטים ב־WHOIS ומ li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>בודקים הכל קודם<\/strong> (8.2), כולל שהדומיין פנוי, ובוחרים איות <strong>שפנוי בכל הפלטפורמות<\/strong>.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>פותחים באותו יום את החשבונות החינמיים בלבד:<\/strong> Instagram, TikTok, YouTube, עמוד פייסבוק ו־Gmail. אחרת מישהו יכול לתפוס את השם באמצע.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>הדומיין: רק בודקים שהוא פנוי, ורושמים בטבלה את התאריך.<\/strong> לא קונים עדיין.<\/li>\n<\/ul>\n<p><strong>אחרי פגישת המיקוד: הדומיין<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> בפגישה (<a href=\"07-advisor-meeting.md\">סדר היום<\/a>) סוגרים את השם ואת האיות הסופי. הקונספט (פרק 9) השאיר את זה כהחלטה פתוחה ליועץ/ת.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אם הוחלט על איות אחר:<\/strong> ברוב הרשתות אפשר לשנות שם משתמש (<strong>לבדוק<\/strong> בכל פלטפורמה. בפייסבוק, למשל, לפי מקורות משניים ייתכן שהשם הישן ישתחרר מיד ומישהו אחר ייקח אותו). דומיין אי אפשר לשנות, ולכן קונים אותו רק עכשיו.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>קונים את הדומיין<\/strong> לפי פרק 6.6 ב<a href=\"13-legal-admin.md\">מסמך הרישוי והמנהלה<\/a>: רשם מוסמך, על שמך, חידוש אוטומטי.<\/li>\n<\/ul>\n<p><strong>תמיד<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>הכל על שמך:<\/strong> החשבונות, הדומיין והמייל. <strong>אף פעם לא<\/strong> על שם המעצב/ת, המשווק/ת או מי שבונה את האתר. אם מישהו עוזר לך, נותנים לו הרשאה, לא בעלות.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אימות דו־שלבי<\/strong> בכל חשבון, וקודי גיבוי שמורים במקום בטוח.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מייל העסק<\/strong> הוא מייל השחזור של כל החשבונות.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>סיסמה שונה לכל חשבון<\/strong>, בעזרת מנהל סיסמאות.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לא מפרסמים עדיין.<\/strong> אפשר לשים תמונת פרופיל ולהשאיר ריק עד שבוע 2 (יום ההשקה ב<a href=\"03-video-scripts.md\">תסריטי הסרטונים<\/a>).<\/li>\n<\/ul>\n<h3>8.4 אם השם תפוס<\/h3>\n<ol>\n<li><strong>מנסים גרסה עם מפריד:<\/strong> <code>kim.mesahakim<\/code> במקום <code>kimmesahakim<\/code>. <strong>בפייסבוק זה לא עוזר:<\/strong> פייסבוק מתעלמת מנקודות, ולכן אם <code>kimmesahakim<\/code> תפוס שם, גם <code>kim.mesahakim<\/code> תפוס. בדומיין המפריד היחיד הוא מקף: <code>kim-mesahakim.co.il<\/code>.<\/li>\n<li><strong>מוסיפים מילה קצרה ומובנת:<\/strong> למשל <code>kimmesahakim.kids<\/code> או <code>kimmesahakim.show<\/code> (<strong>לבדוק<\/strong> זמינות ואורך). בפייסבוק זה נחשב <code>kimmesahakimkids<\/code>, ובדומיין כותבים <code>kimmesahakim-kids.co.il<\/code>.<\/li>\n<li><strong>לא מוסיפים<\/strong> ספרות או תווים אקראיים. הורים לא יזכרו אותם.<\/li>\n<li><strong>בוחרים את הגרסה שפנויה בכל הפלטפורמות<\/strong>, גם אם היא לא האהובה עלייך.<\/li>\n<li><strong>אם בחיפוש בגוגל או במאגר הסימנים מצאת מותג ילדים עם שם דומה:<\/strong> <strong>עוצרים<\/strong> לפני שמשקיעים בלוגו או בהדפסות, ומתייעצים (<a href=\"13-legal-admin.md\">מסמך הרישוי והמנהלה<\/a>).<\/li>\n<\/ol>\n<hr />\n<h2>9. איפה המותג מופיע: יישום<\/h2>\n<table>\n<thead>\n<tr>\n<th>מקום<\/th>\n<th>מה שמים<\/th>\n<th>הערה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>תמונת פרופיל<\/strong> (Instagram, TikTok, YouTube, WhatsApp)<\/td>\n<td><strong>תמונה של קים<\/strong> בתנוחת ״טה־דה!״ או ״החשדנית״, בתלבושת, על רקע נקי<\/td>\n<td>פנים מזוהות בונות קשר. הלוגו נכנס בכרטיס הסיום ובמסמכים. <strong>לבדוק<\/strong> מול המשווק/ת<\/td>\n<\/tr>\n<tr>\n<td><strong>ביו<\/strong><\/td>\n<td>הטקסט למטה<\/td>\n<td>אותו ביו בכל הפלטפורמות<\/td>\n<\/tr>\n<tr>\n<td><strong>כרטיס סיום בסרטון<\/strong><\/td>\n<td>לוגו ושם משתמש, שנייה אחת<\/td>\n<td>תבנית קבועה (<a href=\"09-filming-guide.md\">מדריך הצילום<\/a>)<\/td>\n<\/tr>\n<tr>\n<td><strong>WhatsApp Business<\/strong><\/td>\n<td>שם העסק, תיאור, קישור לעמוד הנחיתה<\/td>\n<td><a href=\"10-outreach-templates.md\">תבניות הפנייה<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>עמוד הנחיתה<\/strong><\/td>\n<td>לוגו, צבעים, גופן<\/td>\n<td><a href=\"../site/index.html\">site/index.html<\/a>, ופרק 10 כאן<\/td>\n<\/tr>\n<tr>\n<td><strong>הצעת מחיר<\/strong><\/td>\n<td>לוגו בראש, צבעים<\/td>\n<td><a href=\"06-show-offer.md\">הצעת המופע<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>מדבקות ״שחקן/ית של קים״<\/strong><\/td>\n<td>הסמל ו״שחקן/ית של קים״<\/td>\n<td><strong>רק אחרי לוגו סופי.<\/strong> עד אז, מדבקות כוכב כלליות (פרק 10 בתסריט)<\/td>\n<\/tr>\n<tr>\n<td><strong>חתימה במייל<\/strong><\/td>\n<td>הטקסט למטה<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>טקסטים מוכנים<\/h3>\n<p><strong>ביו<\/strong> (מבוסס על תוכנית ההשקה. לכל פלטפורמה יש מגבלת אורך משלה, <strong>לבדוק<\/strong> כשכותבים):<\/p>\n<blockquote>\n<p>קים משחקים 🟡 עם קים — כולם משחקים!<\/p>\n<p>מופעים והפעלות משחק ותנועה לילדים<\/p>\n<p>להזמנות 👇<\/p>\n<\/blockquote>\n<p><strong>תיאור ל־WhatsApp Business:<\/strong><\/p>\n<blockquote>\n<p>קים משחקים: מופע משחק ותנועה אינטראקטיבי לילדים. בגנים, בקייטנות, במתנ״סים, בימי הולדת ובאירועי משפחות. אין צופים, כולם משחקים! 🟡<\/p>\n<\/blockquote>\n<p><strong>חתימה במייל:<\/strong><\/p>\n<blockquote>\n<p>קים נידם<\/p>\n<p>קים משחקים · מופעי משחק ותנועה לילדים<\/p>\n<p>[טלפון] · [אתר] · [@שם_משתמש]<\/p>\n<p>עם קים — כולם משחקים!<\/p>\n<\/blockquote>\n<hr />\n<h2>10. עמוד הנחיתה: מה להחליף, ואיך מעלים לאוויר<\/h2>\n<p>הקובץ: <a href=\"../site/index.html\">site/index.html<\/a>. <strong>מתי:<\/strong> שבוע 4 בקונספט (״אריזה עסקית״), אחרי הפיילוט. עד אז העמוד הוא טיוטה שרק את פותחת.<\/p>\n<p><strong>במה עורכים:<\/strong> עורך טקסט פשוט, כמו Notepad (ב־Windows) או Visual Studio Code (חינמי, ל־Windows ולמק). <strong>לא Word.<\/strong> כדי לראות את התוצאה, לוחצים פעמיים על הקובץ והוא נפתח בדפדפן. אם זה מרגיש מסובך, אפשר לבקש עזרה ממישהו שמכיר HTML, ולתת לו <strong>רק את הקובץ הזה<\/strong>, לא את כל התיקייה.<\/p>\n<h3>10.1 איך יודעים מה עוד נשאר<\/h3>\n<table>\n<thead>\n<tr>\n<th>מה רואים<\/th>\n<th>מה זה<\/th>\n<th>מה עושים אחרי שטיפלת<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מסגרת אדומה מקווקוות<\/strong> בעמוד<\/td>\n<td>משהו להחליף או לאשר (גילים, מספר ילדים, אזורים, תמונה, ״על קים״)<\/td>\n<td>מוחקים מהתגית את המילה <code>data-todo<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>כפתור קשר אדום עם ״(להשלים)״<\/strong><\/td>\n<td>עוד לא הכנסת את הפרט ב־<code>CONFIG<\/code> (בתחתית הקובץ). הכפתור לא לחיץ, כדי שאף אחד לא יגיע למספר או לחשבון שגוי<\/td>\n<td>ממלאים את הפרט ב־<code>CONFIG<\/code>. הכפתור נהיה רגיל לבד<\/td>\n<\/tr>\n<tr>\n<td><strong>הערה בקוד שמתחילה ב־<code>TODO:<\/code><\/strong><\/td>\n<td>משהו שלא רואים בעמוד: התמונה לשיתוף, בדיקת הנגישות<\/td>\n<td>מוחקים את ההערה כולה<\/td>\n<\/tr>\n<tr>\n<td><strong>פס אדום ״טיוטה״<\/strong> בראש העמוד<\/td>\n<td>סופר את שלושת הסוגים שלמעלה<\/td>\n<td>נעלם כשלא נשאר כלום<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>לפני העלאה, בכל זאת:<\/strong> פותחים את הקובץ בעורך, Ctrl+F, מחפשים <code>TODO:<\/code> (עם הנקודתיים), ומוודאים שלא נשאר אף אחד.<\/p>\n<h3>10.2 מה להחליף<\/h3>\n<p><strong>חוסם העלאה:<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>פרטי קשר<\/strong> ב־<code>CONFIG<\/code>: מספר וואטסאפ (972 ואחריו המספר בלי ה־0 שבהתחלה), טלפון, מייל, שם משתמש באינסטגרם. <strong>אין לך אינסטגרם או מייל של העסק?<\/strong> מוחקים את הכפתור המתאים בתחתית העמוד.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>טווח גילים:<\/strong> לאשר אחרי הפיילוט. כרגע ״3–8 בערך: גן וכיתות א׳–ב׳״, לפי הגרסאות ב<a href=\"02-show-script.md\">תסריט<\/a> (3–4, 5–6, 7–8). מופיע בשני מקומות: התגית בראש העמוד והשאלה ״לאיזה גיל״. אם בפיילוט יתברר שזה עובד גם לכיתה ג׳, מרחיבים ל־3–9.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>מספר ילדים מקסימלי:<\/strong> כרגע ״עד 25״, כי עד שיש לך מגבר קול מגבילים ל־25 (<a href=\"06-show-offer.md\">הצעת המופע<\/a>). מאשרים, ומשנים רק אחרי שקנית מגבר.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אזורי פעילות:<\/strong> להשלים.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>תמונה של קים<\/strong> בתלבושת, בתנוחת ״טה־דה!״. <strong>בלי ילדים.<\/strong><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>״על קים״:<\/strong> 1–2 משפטים אמיתיים בלבד (כמה שנים, איפה הדרכת, איזו הכשרה).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>נגישות:<\/strong> העמוד נבנה עם ניגודיות מספקת, כותרות מסודרות ותמיכה במקלדת, אבל זו לא בדיקת נגישות מקצועית. לפי <a href=\"https://www.kolzchut.org.il/he/הנגשת_אתרי_אינטרנט_ואפליקציות_לאנשים_עם_מוגבלות\">כל זכות<\/a>, אתרים שנותנים שירות לציבור חייבים, ככלל, להיות נגישים.<\/li>\n<li><strong>איך בודקים אם את פטורה:<\/strong> <a href=\"https://www.kolzchut.org.il/he/פטור_מחובת_הנגשה_לאתרי_אינטרנט_ואפליקציות\">כל זכות, פטור מחובת הנגשה לאתרי אינטרנט ואפליקציות<\/a>. יש שם פטורים לעסקים קטנים לפי מחזור. לפי תוצאות חיפוש על הדף (לא הצלחתי לפתוח אותו ישירות), מופיע בו פטור אוטומטי לגוף שהמחזור השנתי שלו לא עולה על 1,000,000 ₪ (לא חל על רשויות ציבוריות). <strong>לבדוק<\/strong> את הסף העדכני בדף עצמו, ולשאול את הרו״ח מה המחזור הצפוי שלך.<\/li>\n<li><strong>אם יוצא שאת חייבת:<\/strong> הצהרת נגישות (יש מקום מוכן לקישור בתחתית העמוד) ובדיקה של איש/אשת מקצוע. ההרחבה: פרק 7.8 ב<a href=\"13-legal-admin.md\">מסמך הרישוי והמנהלה<\/a>.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>תמונה לשיתוף בוואטסאפ<\/strong> (<code>og:image<\/code> ו־<code>og:url<\/code>): אפשר רק אחרי שיש כתובת. ראי שלב 4 ב־10.3.<\/li>\n<\/ul>\n<p><strong>לא חוסם העלאה. עושים כשיש:<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>המלצות:<\/strong> האזור <strong>מוסתר<\/strong> כברירת מחדל (המילה <code>hidden<\/code> בקוד), כדי שהעמוד לא יציג ״עוד אין המלצות״. מפעילים רק כשיש <strong>לפחות 2 המלצות אמיתיות<\/strong>, כל אחת עם אישור בכתב לפרסום (<a href=\"08-consent-template.md\">אישור הצילום<\/a>, נוסח ה׳). ההוראות בהערה שמעל האזור. <strong>אסור להמציא המלצות.<\/strong><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>סרטון ההיכרות:<\/strong> בקוד יש אזור מוכן בהערה.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>אישורים<\/strong> (אישור משטרה, ביטוח, עזרה ראשונה): להוסיף <strong>רק אחרי שיש<\/strong> (<a href=\"13-legal-admin.md\">מסמך הרישוי והמנהלה<\/a>). בקוד יש שורות מוכנות בהערה.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>לוגו סופי:<\/strong> מחליפים את הלוגו הזמני (פרק 7.5) כשיש קבצים מהמעצב/ת.<\/li>\n<\/ul>\n<h3>10.3 העלאה לאוויר: Netlify Drop<\/h3>\n<p>הדרך הפשוטה, בלי ידע טכני. <strong>לבדוק<\/strong> את התנאים של החשבון החינמי ביום ההעלאה.<\/p>\n<ol>\n<li><strong>תיקייה נפרדת:<\/strong> יוצרים במחשב תיקייה חדשה, למשל ״אתר־קים״, ושמים בה <strong>רק<\/strong> את <code>index.html<\/code> ואת התמונות שהעמוד משתמש בהן (למשל <code>kim.jpg<\/code>). <strong>שום מסמך אחר מהתיקייה של הפרויקט.<\/strong><\/li>\n<li><strong>חשבון:<\/strong> נכנסים ל־<a href=\"https://app.netlify.com/drop\">app.netlify.com/drop<\/a> ופותחים חשבון חינמי, עם המייל של העסק ועל שמך (פרק 8.3). לפי מדריכים משניים, אתר שהועלה בלי חשבון נמחק אחרי 24 שעות (<strong>לבדוק<\/strong>).<\/li>\n<li><strong>גוררים<\/strong> את התיקייה לחלון. אחרי כמה שניות מקבלים כתובת שנגמרת ב־<code>netlify.app<\/code> (<a href=\"https://docs.netlify.com/start/quickstarts/netlify-drop-quickstart/\">המדריך של Netlify<\/a>). בשלב הזה עוד מופיע הפס האדום, כי חסרה התמונה לשיתוף. זה בסדר: לא שולחים את הקישור לאף אחד עדיין.<\/li>\n<li><strong>תמונה לשיתוף:<\/strong> שמים בתיקייה תמונה של קים ברוחב 1200 פיקסלים (בלי ילדים), ובקובץ מחליפים את <code>YOUR-DOMAIN<\/code> בכתובת שקיבלת, לפי ההוראות בהערה בראש הקובץ. מוחקים את ההערה.<\/li>\n<li><strong>מעלים שוב:<\/strong> בעמוד של האתר בחשבון Netlify, גוררים שוב את התיקייה המעודכנת. לפי המדריך של Netlify, זה מעדכן את אותו אתר (<strong>לבדוק<\/strong> איפה בדיוק נמצא אזור הגרירה).<\/li>\n<li><strong>בדיקה בטלפון:<\/strong> פותחים את הכתובת. הפס האדום לא מופיע? לוחצים על כל כפתור: הוואטסאפ נפתח עם ההודעה המוכנה? שולחים את הקישור לעצמך בוואטסאפ: מופיעה התמונה?<\/li>\n<li><strong>דומיין:<\/strong> אחרי פגישת המיקוד וקניית הדומיין (פרק 8.3) מחברים אותו לאתר. זה דורש הגדרות אצל הרשם, ובשלב הזה כדאי לבקש עזרה. <strong>לבדוק<\/strong> את ההוראות של Netlify ושל הרשם.<\/li>\n<\/ol>\n<blockquote>\n<p><strong>לא להפעיל GitHub Pages על התיקייה (המאגר) של הפרויקט הזה.<\/strong> בחשבון GitHub חינמי, GitHub Pages עובד רק ממאגר <strong>ציבורי<\/strong> (<a href=\"https://docs.github.com/en/get-started/learning-about-github/githubs-plans\">GitHub, ״About GitHub's plans״<\/a>). אם מפעילים אותו כאן, כל המסמכים הפנימיים נחשפים לכל העולם: גיליון התמחור, מסמך הרישוי, סדר היום ליועץ/ת, כללי אישורי הצילום. אם בכל זאת רוצים GitHub, פותחים מאגר <strong>נפרד<\/strong> שיש בו רק את <code>index.html<\/code> והתמונות.<\/p>\n<\/blockquote>\n<hr />\n<h2>11. מקורות ודברים לבדוק<\/h2>\n<h3>מקורות<\/h3>\n<ul>\n<li>Canva, לוגואים וסימני מסחר (לפי תוצאות חיפוש, לא נפתח ישירות): <a href=\"https://www.canva.com/help/trademarks-logo/\">canva.com/help/trademarks-logo<\/a><\/li>\n<li>Google Fonts, שאלות נפוצות (שימוש בלוגו ושימוש מסחרי): <a href=\"https://developers.google.com/fonts/faq\">developers.google.com/fonts/faq<\/a><\/li>\n<li>רישיון Rubik (SIL OFL): <a href=\"https://www.fontsquirrel.com/license/rubik\">fontsquirrel.com/license/rubik<\/a><\/li>\n<li>YouTube, כללי handle: <a href=\"https://support.google.com/youtube/answer/11585688\">support.google.com/youtube/answer/11585688<\/a><\/li>\n<li>Instagram, כללי שם משתמש (מקור משני): <a href=\"https://blog.hootsuite.com/instagram-username-ideas/\">Hootsuite<\/a><\/li>\n<li>TikTok, כללי שם משתמש (מקור משני): <a href=\"https://onlypult.com/blog/how-to-change-tiktok-username\">Onlypult<\/a><\/li>\n<li>Facebook, כללי שם משתמש לעמוד (מקורות משניים): <a href=\"https://uberall.helpjuice.com/guides/1737737-set-a-facebook-page-username\">Uberall<\/a>, <a href=\"https://socialrails.com/blog/facebook-page-username-not-eligible\">SocialRails<\/a><\/li>\n<li>איגוד האינטרנט הישראלי (רשימת הרשמים המוסמכים ל־‎.il): <a href=\"https://www.isoc.org.il\">isoc.org.il<\/a>. מחיר, חידוש ותנאים: פרק 6.6 ב<a href=\"13-legal-admin.md\">מסמך הרישוי והמנהלה<\/a><\/li>\n<li>חיפוש במאגר סימני המסחר הישראלי (חיפוש עצמאי חינמי, וחיפוש בתשלום על ידי בוחן/ת): <a href=\"https://www.gov.il/he/service/search_israeli_trademarks_database\">gov.il<\/a><\/li>\n<li>ניגודיות צבעים, WCAG: <a href=\"https://www.w3.org/TR/WCAG21/#contrast-minimum\">w3.org/TR/WCAG21<\/a><\/li>\n<li>נגישות אתרים, כל זכות: <a href=\"https://www.kolzchut.org.il/he/הנגשת_אתרי_אינטרנט_ואפליקציות_לאנשים_עם_מוגבלות\">kolzchut.org.il<\/a><\/li>\n<li>פטור מחובת הנגשה, כל זכות (לפי תוצאות חיפוש, לא נפתח ישירות): <a href=\"https://www.kolzchut.org.il/he/פטור_מחובת_הנגשה_לאתרי_אינטרנט_ואפליקציות\">kolzchut.org.il<\/a><\/li>\n<li>Netlify Drop, מדריך התחלה: <a href=\"https://docs.netlify.com/start/quickstarts/netlify-drop-quickstart/\">docs.netlify.com<\/a><\/li>\n<li>GitHub, תוכניות (Pages בחשבון חינמי רק ממאגר ציבורי): <a href=\"https://docs.github.com/en/get-started/learning-about-github/githubs-plans\">docs.github.com<\/a><\/li>\n<\/ul>\n<h3>לבדוק<\/h3>\n<ul>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>כל מחירי התלבושת<\/strong> (פרק 4). כולם הערכה.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>כללי שמות המשתמש<\/strong> בכל פלטפורמה, ביום הפתיחה. הם משתנים, וחלק מהמקורות משניים. בפייסבוק במיוחד: נקודות, קו תחתון ואורך מינימלי.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>תנאי רישום ‎.co.il<\/strong>, רשימת הרשמים המוסמכים והמחיר: לפי פרק 6.6 ב<a href=\"13-legal-admin.md\">מסמך הרישוי והמנהלה<\/a>.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>כללי Canva<\/strong> לגבי לוגו וסימן מסחר, לפני שמגישים בקשה לרישום.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>הסף לפטור מחובת הנגשה<\/strong>, בדף של כל זכות ומול הרו״ח.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>תנאי החשבון החינמי ב־Netlify<\/strong> (מגבלות, ומה קורה לאתר בלי חשבון).<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>המעמד המשפטי של לוגו שנעשה בבינה מלאכותית<\/strong>, מול עו״ד.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>ערכי הדפסה<\/strong> (CMYK או Pantone), מול בית הדפוס, עם הדפסת ניסיון.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>חובת נגישות והצהרת נגישות<\/strong> לעמוד הנחיתה.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" disabled> <strong>תאריך פורים<\/strong> בשנה הקרובה, אם רוצים לקנות בחנויות תחפושות.<\/li>\n<\/ul>"}}};
const LETTERS = ["א","ב","ג","ד","ה","ו","ז","ח","ט","י","כ","ל"];
const STAGES = DATA.roadmap.stages;
const ROUTINES = DATA.roadmap.routines || [];
const DOCS = DATA.docs;
const STEPS = [];
STAGES.forEach((st, si) => st.steps.forEach((s, i) => STEPS.push(Object.assign({}, s, { si, idx: i }))));
const BY_ID = Object.fromEntries(STEPS.map(s => [s.id, s]));
const LS_KEY = "kim-path-v1";

let state = { done: {}, acts: {}, notes: {} };
let view = "now";
let focusId = null;
let readerPath = null, readerBack = null;

/* ---------- small DOM helper ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}

/* ---------- progress logic ---------- */
const isDone = id => !!state.done[id];
const depsMet = s => (s.depends_on || []).every(d => !BY_ID[d] || isDone(d));
function status(s) { if (isDone(s.id)) return "done"; return depsMet(s) ? "open" : "lock"; }
function nextStep() { return STEPS.find(s => !isDone(s.id) && depsMet(s)) || STEPS.find(s => !isDone(s.id)) || null; }
function stageDone(si) { return STAGES[si].steps.every(s => isDone(s.id)); }
function curStage() { const n = nextStep(); return n ? n.si : STAGES.length; }
function pct() { return STEPS.length ? Math.round(100 * STEPS.filter(s => isDone(s.id)).length / STEPS.length) : 0; }

/* ---------- persistence: account (db) when available, browser as fallback ---------- */
let docRef = null, saving = false, dirty = false, saveTimer = null, pendingLocal = false;
function loadLocal() { try { const raw = localStorage.getItem(LS_KEY); if (raw) state = normalize(JSON.parse(raw)); } catch (e) {} }
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
function normalize(o) { return { done: Object.assign({}, o && o.done), acts: Object.assign({}, o && o.acts), notes: Object.assign({}, o && o.notes) }; }
function scheduleSave() { saveLocal(); if (!docRef) return; pendingLocal = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700); }
async function flush() {
  if (!docRef) return;
  if (saving) { dirty = true; return; }
  saving = true; dirty = false;
  try { await docRef.set(JSON.parse(JSON.stringify(state))); }
  catch (e) { if (e && (e.code === "invalid_argument" || e.code === "revoked")) { docRef = null; setStore("local"); } }
  saving = false;
  if (dirty) flush(); else pendingLocal = false;
}
function mergeStates(a, b) {
  const out = normalize(a);
  for (const [k, v] of Object.entries(b.done)) if (!out.done[k]) out.done[k] = v;
  for (const [k, v] of Object.entries(b.acts)) out.acts[k] = Array.from(new Set([...(out.acts[k] || []), ...v]));
  for (const [k, v] of Object.entries(b.notes)) if (!out.notes[k]) out.notes[k] = v;
  return out;
}
function setStore(mode) {
  document.getElementById("store").textContent = mode === "db"
    ? "ההתקדמות נשמרת בחשבון שלך ומסתנכרנת בין המכשירים"
    : "ההתקדמות נשמרת בדפדפן הזה בלבד";
}
async function initStore() {
  if (!window.claude || !window.claude.use) return;
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  if (!db || !user) return;
  const uid = await user.id();
  if (!uid) return;
  const ref = db.doc("data/users/" + uid + "/progress");
  let first = true;
  ref.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    const remote = snap.exists ? normalize(snap.data()) : normalize({});
    if (first) {
      first = false;
      const merged = mergeStates(remote, state);
      const changed = JSON.stringify(merged) !== JSON.stringify(remote);
      state = merged; docRef = ref; setStore("db"); saveLocal(); render();
      if (changed) flush();
    } else if (!saving && !pendingLocal && JSON.stringify(remote) !== JSON.stringify(state)) { state = remote; saveLocal(); render(); }
  }, () => { docRef = null; setStore("local"); });
}

/* ---------- actions ---------- */
function toggleAct(id, i, on) {
  const set = new Set(state.acts[id] || []);
  on ? set.add(i) : set.delete(i);
  state.acts[id] = Array.from(set).sort((a, b) => a - b);
  scheduleSave();
}
let justDone = null;
function markDone(id) {
  state.done[id] = new Date().toISOString().slice(0, 10);
  justDone = id; focusId = null;
  scheduleSave(); render(); scrollTop();
}
function undo(id) { delete state.done[id]; focusId = id; scheduleSave(); render(); }
let noteTimer = null;
function setNote(id, v) { pendingLocal = !!docRef; clearTimeout(noteTimer); noteTimer = setTimeout(() => { if (v.trim()) state.notes[id] = v; else delete state.notes[id]; scheduleSave(); }, 500); }
function scrollTop() { window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }
function go(v) { view = v; render(); scrollTop(); }
function openStep(id) { focusId = id; justDone = null; go("now"); }
function openDoc(path, back) { if (!DOCS[path]) return; readerPath = path; readerBack = back || null; go("library"); }

/* ---------- header ---------- */
function renderHeader() {
  const p = pct();
  const pctEl = document.getElementById("pct");
  pctEl.firstChild.textContent = p + "%";
  const track = document.getElementById("track");
  track.replaceChildren();
  const cs = curStage();
  STAGES.forEach((st, si) => {
    if (si) track.append(h("span", { class: "rail" + (stageDone(si - 1) ? " done" : "") }));
    const cls = stageDone(si) ? "done" : si === cs ? "cur" : "";
    track.append(h("button", { class: "station " + cls, title: st.title, "aria-label": "שלב " + LETTERS[si] + ": " + st.title,
      onclick: () => { mapOpen = si; go("map"); } }, LETTERS[si]));
  });
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === view)));
  for (const v of ["now", "map", "routines", "library"]) document.getElementById("view-" + v).hidden = v !== view;
}

/* ---------- NOW ---------- */
function renderNow() {
  const root = document.getElementById("view-now");
  root.replaceChildren();
  const next = nextStep();
  if (!next && !focusId) {
    root.append(h("div", { class: "banner" }, h("h2", {}, "עברת את כל המסלול!"),
      h("div", {}, "עם קים — כולם משחקים! עכשיו זה הזמן לשגרות ולשלב הבא.")));
    return;
  }
  if (justDone && BY_ID[justDone]) {
    const d = BY_ID[justDone];
    const finishedStage = stageDone(d.si);
    root.append(h("div", { class: "banner" },
      h("div", {}, h("span", { class: "stamp pop" }, "בוצע ✓")),
      finishedStage
        ? [h("h2", {}, "סיימת את שלב " + LETTERS[d.si] + ": " + STAGES[d.si].title + "!"), STAGES[d.si].milestone ? h("div", {}, STAGES[d.si].milestone) : null]
        : h("div", {}, "״" + d.title + "״ מאחורייך. הנה הצעד הבא:")));
  }
  const s = focusId && BY_ID[focusId] ? BY_ID[focusId] : next;
  if (s !== next && next) {
    root.append(h("p", { class: "focusnote muted" }, "את מסתכלת על צעד מתוך המסלול. ",
      h("button", { onclick: () => { focusId = null; justDone = null; render(); } }, "חזרה לצעד הבא שלי ←")));
  }
  root.append(stepCard(s, s === next));
}

function stepCard(s, isNext) {
  const st = status(s);
  const stage = STAGES[s.si];
  const acts = new Set(state.acts[s.id] || []);
  const card = h("article", { class: "card", "aria-labelledby": "st-" + s.id });
  card.append(h("div", { class: "eyebrow" }, "צעד " + LETTERS[s.si] + (s.idx + 1) + " · שלב " + stage.title + " · " + (s.idx + 1) + " מתוך " + stage.steps.length));
  card.append(h("h2", { class: "step-title", id: "st-" + s.id }, s.title));
  const chips = h("div", { class: "chips" },
    s.time ? h("span", { class: "chip" }, "⏱ " + s.time) : null,
    s.cost ? h("span", { class: "chip" }, "₪ " + s.cost) : null,
    st === "done" ? h("span", { class: "chip ok" }, "בוצע " + fmtDate(state.done[s.id])) : null,
    st === "lock" ? h("span", { class: "chip lock" }, "עדיף אחרי: " + (s.depends_on || []).filter(d => BY_ID[d] && !isDone(d)).map(d => BY_ID[d].title).join(", ")) : null);
  card.append(chips);
  if (s.why) card.append(h("p", { class: "why" }, s.why));

  card.append(h("div", { class: "label" }, "מה עושים"));
  const ol = h("ol", { class: "actions" });
  (s.actions || []).forEach((a, i) => {
    const id = "a-" + s.id + "-" + i;
    ol.append(h("li", {}, h("label", { for: id },
      h("input", { type: "checkbox", id, checked: acts.has(i), onchange: e => toggleAct(s.id, i, e.target.checked) }),
      h("span", {}, a))));
  });
  card.append(ol);

  if (s.done_when) card.append(h("div", { class: "donewhen" }, h("b", {}, "תדעי שסיימת כש: "), s.done_when));
  if (s.tip) card.append(h("div", { class: "tip" }, h("b", {}, "טיפ: "), s.tip));

  const res = (s.resources || []).filter(r => r && r.file);
  if (res.length) {
    card.append(h("div", { class: "label" }, "חומרים לצעד הזה"));
    card.append(h("div", { class: "res" }, res.map(r => DOCS[r.file]
      ? h("button", { class: "btn small", onclick: () => openDoc(r.file, s.id) }, "📄 " + r.label)
      : h("span", { class: "chip" }, "📄 " + r.label + " (" + r.file + ")"))));
  }

  const notes = h("details", { class: "more", open: !!state.notes[s.id] },
    h("summary", {}, "הערות שלי לצעד הזה"),
    h("textarea", { id: "note-" + s.id, placeholder: "מה למדתי, למי פניתי, מה נשאר…", oninput: e => setNote(s.id, e.target.value) }));
  notes.querySelector("textarea").value = state.notes[s.id] || "";
  card.append(notes);

  if (sampleFn) card.append(askBox(s));

  const row = h("div", { class: "row" });
  if (st === "done") row.append(h("button", { class: "btn ghost", onclick: () => undo(s.id) }, "סמני כלא בוצע"));
  else row.append(h("button", { class: "btn primary", onclick: () => markDone(s.id) }, "סיימתי את הצעד ✓"));
  row.append(h("span", { class: "spacer" }));
  const gi = STEPS.indexOf(s);
  if (gi > 0) row.append(h("button", { class: "btn small ghost", onclick: () => openStep(STEPS[gi - 1].id) }, "→ הקודם"));
  if (gi < STEPS.length - 1) row.append(h("button", { class: "btn small ghost", onclick: () => openStep(STEPS[gi + 1].id) }, "הבא ←"));
  card.append(row);
  return card;
}

function fmtDate(iso) { if (!iso) return ""; const [y, m, d] = iso.split("-"); return d + "." + m + "." + y.slice(2); }

/* ---------- Ask Claude about a step (optional, only where the viewer allows it) ---------- */
let sampleFn = null, askCtl = null;
function askBox(s) {
  const out = h("div", { class: "ask-out", hidden: true, "aria-live": "polite" });
  const ta = h("textarea", { id: "ask-" + s.id, placeholder: "למשל: איך אני מוצאת גננות לפנות אליהן באזור שלי?" });
  const btn = h("button", { class: "btn small" }, "שאלי");
  const stop = h("button", { class: "btn small ghost", hidden: true }, "עצרי");
  stop.onclick = () => askCtl && askCtl.abort();
  btn.onclick = async () => {
    const q = ta.value.trim();
    if (!q) { ta.focus(); return; }
    askCtl = new AbortController();
    btn.disabled = true; stop.hidden = false; out.hidden = false; out.textContent = "חושבת…";
    const prompt = [
      "את עוזרת אישית של קים נידם, שמקימה את ״קים משחקים״: דמות כוכבת ילדים אנרגטית וספורטיבית בישראל שמובילה ילדים למשחק, תנועה וצחוק. סלוגן: ״עם קים — כולם משחקים!״.",
      "קים עובדת לפי מסלול צעדים. זה הצעד שהיא נמצאת בו עכשיו:",
      JSON.stringify({ stage: STAGES[s.si].title, title: s.title, why: s.why, actions: s.actions, done_when: s.done_when }),
      "השאלה של קים: " + q,
      "עני בעברית טבעית, בגוף שני נקבה, קצר ומעשי (עד 150 מילים), עם צעדים ממוספרים אם מתאים. אל תמציאי מחירים, חוקים או עובדות כוודאיים; אם צריך לבדוק משהו, כתבי ״לבדוק״ ואיפה."
    ].join("\n\n");
    try {
      await sampleFn(prompt, { signal: askCtl.signal, cache: false, onText: ({ text }) => { out.textContent = text; } });
    } catch (e) {
      if (e && e.code === "cancelled") { out.textContent = e.text || ""; if (!e.text) out.hidden = true; }
      else if (e && (e.code === "not_granted" || e.code === "sampling_disabled" || e.code === "not_declared" || e.code === "capability_disabled" || e.code === "capability_removed")) { sampleFn = null; box.remove(); }
      else if (e && e.code === "rate_limited") out.textContent = (e.text ? e.text + "\n\n" : "") + "יותר מדי שאלות ברגע אחד. נסי שוב עוד מעט.";
      else out.textContent = (e && e.text ? e.text + "\n\n" : "") + "התשובה נקטעה. אפשר לנסות שוב.";
    }
    btn.disabled = false; stop.hidden = true;
  };
  const box = h("details", { class: "more" }, h("summary", {}, "תקועה? שאלי את Claude על הצעד הזה"),
    h("div", { style: "display:grid;gap:8px;margin-top:8px" }, ta, h("div", { class: "row" }, btn, stop), out));
  return box;
}

/* ---------- MAP ---------- */
let mapOpen = null;
function renderMap() {
  const root = document.getElementById("view-map");
  root.replaceChildren();
  root.append(h("div", { class: "legend" },
    h("span", { class: "s-done" }, h("i", { class: "dot" }, "✓"), "בוצע"),
    h("span", { class: "s-next" }, h("i", { class: "dot" }), "הצעד הבא"),
    h("span", { class: "s-open" }, h("i", { class: "dot" }), "פתוח"),
    h("span", { class: "s-lock" }, h("i", { class: "dot" }), "מחכה לצעד קודם")));
  const next = nextStep();
  const cs = curStage();
  STAGES.forEach((st, si) => {
    const doneN = st.steps.filter(s => isDone(s.id)).length;
    const cls = stageDone(si) ? "done" : si === cs ? "cur" : "";
    const open = mapOpen != null ? mapOpen === si : si === cs;
    const det = h("details", { class: "stage " + cls, open, id: "stage-" + st.id },
      h("summary", {},
        h("span", { class: "letter" }, LETTERS[si]),
        h("span", {}, h("h3", {}, st.title), h("span", { class: "sub" }, st.week_hint || "")),
        h("span", { class: "count" }, doneN + "/" + st.steps.length)));
    const body = h("div", { class: "stage-body" });
    if (st.goal) body.append(h("p", { class: "goal", style: "margin:0" }, st.goal));
    const ul = h("ul", { class: "steps" });
    STEPS.filter(s => s.si === si).forEach(s => {
      const k = isDone(s.id) ? "s-done" : s === next ? "s-next" : depsMet(s) ? "s-open" : "s-lock";
      ul.append(h("li", { class: k }, h("button", { onclick: () => openStep(s.id) },
        h("span", { class: "dot" }, isDone(s.id) ? "✓" : ""),
        h("span", { class: "t" }, s.title),
        h("span", { class: "time" }, s.time || ""))));
    });
    body.append(ul);
    if (st.milestone) body.append(h("div", { class: "milestone" }, h("b", {}, "בסוף השלב: "), st.milestone));
    det.append(body);
    root.append(det);
  });
  if (mapOpen != null) { const el = document.getElementById("stage-" + STAGES[mapOpen].id); mapOpen = null; if (el) requestAnimationFrame(() => el.scrollIntoView({ block: "start" })); }
}

/* ---------- ROUTINES ---------- */
function renderRoutines() {
  const root = document.getElementById("view-routines");
  root.replaceChildren();
  root.append(h("p", { class: "muted", style: "margin:0" }, "הרגלים קבועים שמחזיקים את העסק בתנועה. כל שגרה נפתחת אחרי צעד מסוים במסלול."));
  if (!ROUTINES.length) { root.append(h("div", { class: "empty" }, "אין עדיין שגרות.")); return; }
  ROUTINES.forEach(r => {
    const after = r.starts_after && BY_ID[r.starts_after];
    const active = !after || isDone(after.id);
    root.append(h("article", { class: "card routine" + (active ? "" : " off") },
      h("div", { class: "chips" }, h("span", { class: "chip" + (active ? " ok" : "") }, active ? "פעילה" : "עוד לא"), h("span", { class: "chip" }, "🔁 " + r.frequency)),
      h("h3", {}, r.title),
      h("ul", {}, (r.actions || []).map(a => h("li", {}, a))),
      after ? h("div", { class: "muted", style: "font-size:14px" }, "מתחילה אחרי: ",
        h("button", { class: "btn small ghost", onclick: () => openStep(after.id) }, after.title)) : null));
  });
}

/* ---------- LIBRARY ---------- */
function docTitle(path) { return DOCS[path].title || path; }
function resolveLink(base, href) {
  if (!href || /^(https?:|mailto:|tel:|#)/.test(href)) return null;
  const [p, hash] = href.split("#");
  const parts = base.split("/").slice(0, -1);
  for (const seg of p.split("/")) { if (seg === "..") parts.pop(); else if (seg && seg !== ".") parts.push(seg); }
  const full = parts.join("/");
  return DOCS[full] ? { path: full, hash } : null;
}
function renderLibrary() {
  const root = document.getElementById("view-library");
  root.replaceChildren();
  if (readerPath && DOCS[readerPath]) {
    const row = h("div", { class: "row" });
    if (readerBack && BY_ID[readerBack]) row.append(h("button", { class: "btn small", onclick: () => { const b = readerBack; readerPath = null; readerBack = null; openStep(b); } }, "→ חזרה לצעד: " + BY_ID[readerBack].title));
    row.append(h("button", { class: "btn small ghost", onclick: () => { readerPath = null; readerBack = null; render(); scrollTop(); } }, "כל החומרים"));
    root.append(row);
    const md = h("div", { class: "md" });
    md.innerHTML = DOCS[readerPath].html || "";
    md.querySelectorAll("table").forEach(t => { const w = h("div", { class: "tbl" }); t.replaceWith(w); w.append(t); });
    md.querySelectorAll("a[href]").forEach(a => {
      const target = resolveLink(readerPath, a.getAttribute("href"));
      if (target) a.addEventListener("click", e => { e.preventDefault(); openDoc(target.path, readerBack); });
      else if (/^https?:/.test(a.getAttribute("href"))) { a.target = "_blank"; a.rel = "noopener"; }
    });
    md.querySelectorAll("input[type=checkbox]").forEach(c => c.disabled = true);
    root.append(h("article", { class: "card reader" }, md));
    return;
  }
  root.append(h("p", { class: "muted", style: "margin:0" }, "כל התסריטים, הטפסים והתבניות של קים משחקים. כל צעד במסלול מקשר לחומרים שהוא צריך."));
  const list = h("div", { class: "doclist" });
  Object.keys(DOCS).forEach(p => list.append(h("button", { onclick: () => openDoc(p) }, h("b", {}, docTitle(p)), h("small", {}, p))));
  root.append(list);
}

/* ---------- render ---------- */
function render() {
  renderHeader();
  if (view === "now") renderNow();
  if (view === "map") renderMap();
  if (view === "routines") renderRoutines();
  if (view === "library") renderLibrary();
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.view === "now") { focusId = null; justDone = null; }
  if (b.dataset.view === "library") { readerPath = null; readerBack = null; }
  go(b.dataset.view);
}));
const startHash = (location.hash || "").slice(1);
if (["now", "map", "routines", "library"].includes(startHash)) view = startHash;
loadLocal();
render();
initStore();
if (window.claude && window.claude.use) claude.use("sample").then(fn => { if (fn) { sampleFn = fn; if (view === "now") renderNow(); } });
</script>
